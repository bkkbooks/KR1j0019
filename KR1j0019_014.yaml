front:
  text: 配鹽幽叔也從叔支聲臣鍇曰幽謂造之幽暗也暗翅反俗䜴
  hash: sha256:03efc9486ea01db6e9ccf5cf2dd9f79facdeea4a4ae7d511213a8df8bd8ddc2e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_014-1a}
body:
  text: 文二重一物𥘉生之題也且上家生形下象根也凡專之屬皆從專臣鍇曰題猶額也端也古發端之專直如此而已一地也端湍顓遄從此象形下桓反文二菜名也一種而久生者也象形在一之上此與專同意凡韭之屬皆從韭臣鍇曰一地也故曰與專同意非刈之復生也異于常草皆故自為字邊象形勾有反也從韭隊聲臣鍇曰古謂今膾酢合和者故有受辛之言古人言金五膾以粟黃薑為故黃今人多謂𦵔為也大妹反也從韭次􅙻皆聲臣鍇曰膾酢也莊子曰萬物而不以為黃謂視萬物之細也子兮反或從齊菜也其葉似韭從韭聲臣鍇曰按爾雅一名鴻薈也遐戒反山韭也從韭㦰聲臣鍇按爾雅注山中有之如人家種者瀸鐡纖韱如此息鹽反小蒜也從韭畨聲臣鍇曰中國蒜也今之大蒜胡蒜也抶袁反文六重一蓏也象形凡瓜之屬皆從瓜臣鍇曰某瓜實也外蔓也古華反小瓜也從瓜交聲臣鍇曰今有馬㼎如小瓜也部卓反㼎也從瓜失聲詩曰綿綿瓜瓞臣鍇按毛詩傳曰小瓜在枝間連大瓜也以喻子孫承嗣也大節反或從弗小瓜也從瓜熒省聲玄經反瓜也從瓜省聲延朝反瓜中實也從瓜辡聲臣鍇曰瓜也一名瓠犀詩曰齒如瓠犀是也爾雅作瓠棲部莧反本不勝末微弱也從二瓜讀若庾臣鍇曰瓜根弱而實竒大故二瓜為㼌會意也戈主反文七重一瓠匏也從瓜夸聲凡瓠之屬皆從瓠臣鍇曰瓜根柢柔弱楚辭曰幹棄周鼎而寶康瓠康空也康瓠空瓠也爾雅康瓠謂之甈瓦為之得名于此也下故反蠡也從爂瓠省聲臣鍇曰半破瓢以酌水為蠡故東方朔曰以蠡酌海也部遙反文二交覆深屋也象形凡宀之屬皆從宀臣鍇曰象屋兩下垂覆也滅仙反居也從宀豭省聲臣鍇按爾雅戶牖之間謂之扆其內謂之家古者為堂自半巳前虛之謂之堂半巳後實之為室東為戶西為牖中為壁尊者在室常居牖下謂之隩故論語曰與其媚于奧寧媚于竈春秋左傳趙鞅曰畢萬有百乘死于牖下言安樂也東南隅謂之開戶聲也在室外則人君當陽而生在戶牖之間故曰負斧扆也古牙反古文家所託居也從宀乇聲直摘反古文臣鍇曰宅必相其土故從土亦古文實也從宀至聲室屋皆從至所止也臣鍇曰堂之內人所安止也尸質反天子宣室也從宀亘聲臣鍇按漢書音義未央前正室也又有宣室殿息鉛反北出牖也從口從宀詩曰塞向戶臣鍇按豳七月詩也塞向避北風也窗所以通人氣故從口會意也詩文反飬也室之東北隅貪所居也從宀臣臣鍇曰東北陽氣𥘉起養萬物也立春之候戈伊反戶樞聲室之東南隅也從宀㫐聲臣鍇曰㫐音杳從白下􅎅乙皛反宛也室之西南隅從宀聲臣鍇曰宛深也故從宷古審字也人所居故從宀會意也乙告反屋宇也從宀辰臣鍇按班固西都賦曰日月才經于𬒮宸宸高下之中事也實申反屋邊從宀于聲昜曰上棟下宇臣鍇按春秋傳曰况衛在君之宇下是為邊垂也于矩反籕文從禹大屋也從宀豐聲昜曰豐其屋甫馮反周垣也從宀免聲故官反或從􅊟完聲臣鍇曰今言院即取名于周垣也屋深響也從宀聲臣鍇按靈光殿賦曰宖寥以崢嶸下泓反屋響從宀弘聲臣鍇曰釋加上宇也豫萌反屋貌從宀為聲于彼反屋㝩㝗也從宀康聲臣鍇按長門賦曰委參差以㝩㝗㝗屋虛大也㝗與梁義同可郎反㝩也從宀良聲臣鍇曰左思吳都賦所謂聊㝗之野字力疆反屋所容受也從宀成聲食征反安也從宀心在皿上皿人之食飲器所以安人也臣鍇曰風雨有時飲食無虞人所以安也史記曰未嘗寧居乃丁反安也從宀正聲臣鍇按孝經曰昏定而晨省定在床下也徒寧反止也從宀是聲臣鍇曰實如此止如此也市職反止也從女在宀中臣鍇曰女子非有大故不踰閾也詩曰之子于歸逺送于野不安居也遏寒反安也從宀必聲臣鍇曰古書慮字多從作此蓋訛蹐所致非假借也忙一反靜也從宀契聲臣鍇曰深靜也一戾反安也從宀妟聲臣鍇曰齊桓公不肯救邢管仲曰宴安鴆毒不可懷也乙現反無人聲也從宀從叔聲臣鍇曰􅓦寞字才狄反或從言作覆審也從宀祭聲臣鍇曰宀覆也從此會意又扎反至也從宀親聲千刃反全也從宀元聲也古文以為字臣鍇按春秋傳曰繕完也胡官反備也從宀畐聲臣鍇曰富潤屋也福務反富也從宀貫為貨物臣鍇按春秋左傳曰遷其內貫遷其家也市日反藏也從宀保省聲周昜曰陳赤刀也臣鍇曰所寶藏摶抱反盛也從宀谷聲臣鍇曰此但為容受字容貌字古作頌也弋雍反古文容從公不見也從宀聲一曰不看人臣鍇曰室中無人也忙千反珍也從宀玉貝缶聲臣鍇曰人所保也跛抱反古文寶省貝羣居也從宀君聲臣鍇曰古亦借麇字為之也九羣反散也從宀人在屋下無田事也周書曰宫中之冗人食也臣鍇曰無定所執也秦漢有冗從僕射散從也人勇反仕也從宀臣臣鍇曰執事于中也春秋左傳曰為官女戶慣反罪人在屋下執事者從宀從辛辛亦罪也臣鍇曰老子曰為而不宰謂為之務于利天下無所定執也執則失之也宰制之則辛苦故從辛與愆意同子待反守官也從宀從寸寺府之事也從寸寸法度臣鍇曰宀官府也莊子曰謂之刑法以守之是也戶受反尊居也從宀龍聲臣鍇按詩曰為龍為光龍寵也丑壟反寬也從宀有聲臣鍇曰寬之而巳未全放也尤舊反所安也從宀之下一之上多省聲臣鍇曰一地也既得其地上蔭深屋為宜也擬機反古文亦古文置物也從山舄聲悉也切夜也從宀宀下冥也肖聲相邀切止也從宀㑂聲㑂古文夙息逐切卧也從宀侵聲七荏切籕文􅤑省冥合也從宀丐聲讀若書曰藥不瞑眩臣鍇曰與宵同義也名片反屋寬大從宀莧聲若桓反寤也從宀吾聲臣鍇曰窹寐也故從宀頑互反居之速也從宀疌聲臣鍇曰詩曰不寁故也走敢反少也從宀頒頒分也從宀頒故為少也臣鍇曰不患寡而患不均不患貧而患不安蓋和無寡安無傾也會意古旦反屈草自覆也從宀死聲蔚逺反或從怨寄也從宀從各聲慳草反記也從宀奇聲堅芰反寄也從宀禺聲疑豫反或從廣作臣鍇曰廣者依巖為室貧病也從宀久聲詩曰煢煢在㝌見岫反凍也從人在宀下從茻上下為覆下有仌也臣鍇曰按尹令曰寒氣總至人力不堪其皆入室寒也䀶安反傷也從宀口言從家起也丰聲臣鍇曰周廟金人銘曰口是傷禍之門言行君子樞機樞機之發榮辱之主尚口乃窮有攸往主人有言言必讒也家人嗃嗃末失也婦子嘻嘻失家節也驪姬之占曰齒牙為禍孟姬之讒晉亦以亂文王刑于寡妻至于兄弟以御于家邦君子正家而天下定矣嘗起于家而生于忽微也故害從宀桓艾反入家搜索之貌從宀索聲臣鍇曰此探𦣱索隱之字也史迮反窮也從宀䉅聲臣鍇曰窮則反本故從宀宀家也居逐反或從冗姦也外為盜內為宄從宀九聲俱水反古文臣鍇曰寸法度也春秋左傳曰禦姦以德禦宄以刑亦古文塞也從宀聲讀若虞書㝮三苗之㝮臣鍇曰今尚書作竄三苗粗最反過也一曰洞屋從宀碭省聲汝南有項宕鄉臣鍇曰今言故宕也他浪反居也從宀木聲臣鍇曰室居也蘇綜反屋傾下也從宀執聲臣鍇曰人言其㝪隘也昏墊即土之傾下也丁念反尊祖廟也從宀示臣鍇曰宗廟北方謂地空因以為土穴為戶從穴皿聲讀與猛同年丙反地室也從穴音聲臣鍇曰今書京謂地窖臧酒為窨乙沁反地室也從穴復聲臣鍇曰詩古公亶父避狄于岐下陶􅠈陶穴謂于地旁巖築下為室若陶竈也方目反炮竈也從穴鼀省鼀黽也象竈之之形臣鍇曰穿地為竈也到反或不省作臣鍇曰竈子兵反燒瓦窯竈也從穴從羔聲弋堯反空也從穴圭聲臣鍇曰甑下孔也一奎反深也一曰竈從穴􅎣求省聲讀若禮三年導服之導臣鍇曰深字從此古無禫字借導字為之故必以年導服明反通也從牙在穴中臣鍇曰詩曰誰謂鼠無牙何以穿我墉啜鉛反穿也從穴尞聲也諭語有公伯寮臣鍇曰西都賦曉日龍光于綺寮寮窗牖之名也力凋反穿也從穴夬聲一穴反深抉從穴抉聲一決反空也從穴賣聲臣鍇曰水溝口也周禮曰宫中之竇其崇三尺直漏反空也從穴敫聲挈呌反竅也從穴工聲臣鍇曰周禮曰鑽其空欲其惌也口紅反空也從穴巠聲詩曰瓶之矣臣鍇曰今左氏傳作字也誥徑反空也從穴乙聲鬱八反穴貌從穴矞聲臣鍇曰䆷之言缺也火穴反空也從穴果聲一曰烏巢也一曰在穴曰窠在樹曰巢臣鍇曰按吳都賦曰巢宿異禽苦和反通孔也從穴恖聲義江反汙邪下也從穴瓜聲臣鍇曰汙猶迂杜預春秋傳序盡而不汙則此字同魏都賦曰窊隆異等窊隆猶卑高也乙瓜反汙也從穴㼌聲朔方有窳渾縣也臣鍇曰汙音迂也史曰舜陶于河濵器不苦窳窳缺犬從穴中暫出也從犬在穴中也一曰滑也匪突也臣鍇曰犬匿于穴中人人不意之突然而出也他兀反匿也從鼠在穴中臣鍇曰會意也千斷反從穴中卒出從穴卒聲千元反追也從穴君聲臣鍇曰入于穴窮迫也臣殞反窮也從穴弓聲臣鍇曰穹隆然上高也草根名穹窮象之也丘弓反深肆極也從穴兆聲臣鍇按詩曰窈窕淑女謂其德深厚沉密不輕薄也大了反冥也從穴㫐聲一了反䆞窔深篠貌從穴交聲臣鍇按上林賦曰巖窔洞出是也吉了反深逺也從穴遂聲小遂反極也從穴躬聲臣鍇曰入于穴是極也巨弓反深逺也從穴幼聲一了反杳窱也從亢條聲臣鍇曰靈光殿賦曰旋室便姢以杳窱是也他弔反穿地也從穴毳聲一曰小鼠聲周禮曰大喪甫竁臣鍇按周禮注甫竁始為穴也充芮反葬下棺也從穴乏聲周禮曰及窆執斧方驗反葬之厚夕也從屯聲春秋傳曰窀穸從先君于地下臣鍇按杜預春秋左傳注窀厚也巨倫反窀穸夜也從穴夕聲臣鍇按春秋左傳唯是窀穸之事言其夜深厚也詞亦反入刺穴謂之拶從穴甲聲臣鍇曰脈字也苦今人言五藏窬穴有肝窬肺窬是也一甲反窮也從穴九聲臣鍇曰九亦究竟之意當言九亦聲巳又反文五十一重一寐而覺者也從從夢周禮曰以日月星辰占六夢之吉凶一曰正夢二曰咢三曰觭四曰窹五曰喜六曰懼凡之屬皆從臣鍇曰夢之言蒙也不明之貌者倚著也宀屋也卧安則夢多也宣王考室之詩曰上莞下簟乃安斯寢其夢維何六夢之解具于禮注前識之言多矣臣以為人晝之所為陽也性及魂精氣之所為也夜寐所覺隂也情及魄氣之所為也人之情常侵于性故禮曰生而有欲性之害也文子曰日月欲明浮雲蔽之人性欲平嗜性害之中庸以上能節其情欲以成其性愚者反是六情恆侵于五常魄氣奪其精粹故人晝能自攝于禮義者其夢想亦嘗不欺于貪婪然其夢中懈于平晝也禍福嘗起于忽微始于隂微至于陽顯故吉凶多先見于寢也王符曰夢寐徴怪所以警人也晉文公夢楚子伏巳而盬其腦以其有文德之教能自警戒所以敗楚秦始皇嘗與海神戰不勝豈真海神哉海隂也人民之象也不勝者敗也不能自勉狼戾治兵求報其神所以喪天下而無念之也可不懼哉弄反病卧也從夢省侵省聲臣鍇曰春秋左傳曰公寢疾當作此假借寢字為之也遷荏反從夢省未聲臣鍇曰寐之言迷也不明之意也忙庇反寐覺而省信曰寤從夢省吾聲一曰晝見而夜夢也五故切籕文寤楚人謂寐曰夢從夢省女聲人與反寐而猒也從夢省米聲臣鍇曰厭也寐則神遊神為隂乞所厭不得出也若鬼神其實非也寐故人卧手住心胸上則多厭也莊子曰今夫巳陳之芻狗復取之逰居寢卧其下不得夢必且寐焉是也又山海經有食之不寐假借眯字為之也忙弟反熟寐也從夢省水聲巨癸反卧驚病也從夢省丙聲部命反瞑言也從夢省臬聲臣鍇曰今人謂寐中有言為寱語寱語也寸世反卧驚也一曰小兒號寣寣從夢省從言火滑反文十一重一痾也人有疾痛象倚著之形凡疒之屬皆從疒臣鍇曰今日謂人勊強不得巳曰厄疒則此字痾者病乞有所倚也疒象人乘四體也一所倚之物也女厄反病也從疒矢聲慈悉反籕文疾臣鍇曰病來急故從矢矢急疾也古文疾加也從疒丙曰春秋左傳曰公疾病也疲柄反病也從疒聲詩曰我僕痡矣普胡切病也從疒甬聲臣鍇曰自此以下多見爾雅他弄反病也從疒鬼聲詩曰譬彼瘣木一曰腫旁出也臣鍇按爾雅抱道木魁瘣注謂樹木叢生根枝節目盤結磈磊石隈反病也從疒可聲五行傳曰即有口痾臣鍇曰阿猶倚也因人之釁以生五行傳劉向所作演尚書洪範之意也五行有失則有痾恙從之也一佐反病也從疒堇聲也巨巾反病劣也從疒祭聲臣鍇按郭璞曰江東呼病曰瘵側介反病也從疒真聲一曰腹脹也臣鍇按揚雄曰臣有癲胘病癲倒也丁年反病也從疒莫聲臣鍇按詩曰求民之瘼郭璞曰病東齊曰瘼摩慱反腹中急痛也從疒斗聲臣鍇曰今人多言腹中絞結痛也姑咬反病也從疒員聲子問反病也從疒間聲侯難反病也從疒出聲吾忽反病也從疒此聲臣鍇曰莊子曰物不疵癘才資反痼疾也從疒發聲臣鍇按律有廢疾頭腫也從疒婁聲律豆反顫也從疒又聲臣鍇按字書尤舊反積血病從疒於聲了遽反腸痛從疒山聲所間反小腹病也從疒肘省聲讀若紂丁友反滿也從疒聲平媚反俯病也從疒付聲臣鍇按爾雅注戚施之疾俯而不能仰也弗父反逆氣也從疒欮聲臣鍇按韓詩外傳曰人主之疾有二十其一曰厥無使小民飢寒則厥不作百姓不足君孰與足故以逆氣喻之屰逆也欠氣也會意字九越反或省疒酸痟頭痛從疒肖聲周禮曰春時有痟首疾相邀切幽脊也從疒句聲具俱切氣不定從疒季聲臣鍇按靈光殿賦曰心猥􅓥而發痵也蔡季反風病也從疒非聲臣鍇按史記曰田蚡病痱步禮反小腫也一曰族纍病從疒垔聲臣鍇曰瘯魚謔反有熱瘧從疒占聲春秋傳曰齊侯疥遂痁臣鍇按春秋左傳曰痁作而伏式占反二日一發瘧也從疒亥聲臣鍇按顔之推家訓以為左氏傳齊侯疥遂痁疥字當是此字借疥字耳引此為證言初二日一發漸加至一日一發也豈有疥癬小疾諸侯問之乎二柴反疝病從疒林聲臣鍇曰小便不快濕痺治瀝也力禽反後病也從疒寺聲直豈反痺疾從疒委聲臣鍇按吕氏春秋曰出與入輦命曰痿蹶之機韓王信曰如痿人之不忘起人住反濕病從疒卑聲臣鍇曰溼則營衛氣不至而頑痺也彼二反足氣不至也從疒畢聲臣鍇按曰今人言久坐則足痺也高士傳曰晉侯與亥唐坐痹不敢壞坐也毗辟反中寒腫核從疒豕聲臣鍇按漢書曰士卒皸瘃墮指者什百陟録反半枯也從疒扁聲臣鍇曰吕氏春秋公孫綽有㾫枯之藥將倍之以起死者是也匹綿反脛氣腫從疒童聲詩曰既微且瘇臣鍇按下溼地則生此疾故詩曰彼何人斯居河之湄既微且瘇爾故伊何是也時踊反籕文臣鍇曰允尪字童籕文童字跛病從疒盍聲也讀若脅又讀若掩一盍反歐傷也從疒只聲臣鍇按漢書音義以杖歐人青黑腫起而無創瘢者律謂疻手友反疻痏也從疒有聲臣鍇按沈約瘡痏􅌟于牀之曲于救反創裂也一曰疾從疒巂聲誰唯反皮剝從疒冉聲讀若楠又讀若簷赤古反籕文痛也從疒農聲乃統反傷也從疒夷聲臣鍇按春秋左氏傳曰命軍吏察夷傷後漢書謂金瘡曰金夷以之反痍也從疒般聲臣鍇曰痍處謂已愈有䀶曰瘢步安反胝瘢也從疒聲戶根反強急也從疒巠聲臣鍇按字書中寒體強急也臣井反動病也從疒蟲省聲大冬反臞也從疒叟聲山􅘇反熱病也從火從疒鍇按春秋左傳曰則有疢疾會意丑刃反勞病也從疒單聲臣鍇按詩曰哀我疸人丁佐反黃病也從疒旦聲臣鍇曰勞熱而黃也怛漢反病小息也從疒夾聲丘輒反痛也從疒否聲讀若鄙臣鍇曰又病結也傳几反脈瘍也從疒昜聲臣鍇曰脈跳動也夷益反狂走從疒术聲讀若欻火物反勞力也從疒皮聲弼悲反瘕病也從疒􅙻壯九反病不翅從疒氏聲臣鍇曰見詩也上支反病劣也從疒及聲臣鍇曰本草云苟𣏌療虛㽺病謂㽺㽺無氣力也火匝反病也從疒聲臣鍇曰今謂甚劇曰一賣反罷病也從疒隆聲臣鍇曰按史記平原君躄者曰臣不幸有疲癃病謂形穹隆然也力中反籕文癃省民皆病曰疫從疒役省聲臣鍇曰亦鬼神在其間若皆應役然也晉時嘗疫有人通鬼者問之曰今年何為多疫對曰劉孔才為太山將軍將反召人作兵耳俞具反小兒瘛瘲病也從疒恝聲元制反馬病從疒多聲詩曰痑痑駱馬臣鍇曰馬疲乏也吐佐反馬脛瘍從疒兊聲一曰持傷也臣鍇持傷謂駱馬為持馬所傷也大活反久病從疒古聲臣鍇曰劉稹詩曰反嬰沈痼疾竄身清漳濵自夏反徂秋曠爾十餘旬是也古語反治也從疒樂聲讀若勞臣鍇按詩曰多將嘺嘺不可救藥是也戈勺反或從尞楚人謂藥毒痛從疒剌聲臣鍇曰日中人生瘡爛力帶反朝鮮謂飲藥毒曰癆從疒勞聲力到反愈也從疒差聲臣鍇曰今人病差字才他反減也從疒衰聲一曰衰耗臣鍇曰病將愈也韋反病瘳也從疒俞聲臣鍇曰今作愈字弋主反疾病愈也從疒翏聲臣鍇曰忽愈若抽去之也尚書金縢王有疾不豫周公乃卜翌日乃瘳是愈速也勑尤反不慧也從疒疑聲臣鍇曰癡者神思不足故亦病也丑遲反惡瘡疾也從疒厲省聲臣鍇按史記曰豫讓漆身為厲人體著漆多生瘡也大力反文一百二重七覆也從一下垂也凡坰之屬皆從坰臣鍇曰尚書云丕冒海隅此其義也此與爼几字相亂几俎字狹而高兩足外向坰冒字低廣兩垂直下也眠狄反絭也所以絭髮辨冕之惣名從坰元元亦聲冠有法制從寸臣鍇曰取其在首故從元故謂冠為元服絭音卷卷束也古寬反積也從坰取取亦聲臣鍇曰古之人以聚物之聚為最上必有覆冒之也才句反奠酒爵也從坰託聲周書曰三宿三祭三㓃是也臣鍇曰奠置也言三進三祭三醊置爵子地也爵有冒之也丁故反文四重覆也從坰一凡􅜪之屬皆從􅜪讀若莓之莓臣鍇曰莓今音亡莫保反合會也從􅜪口臣鍇曰從口者言化同而後心同然後不謀同辭也尚書曰同寅協恭直東反幬帳之象也從􅜪之其飾也臣鍇曰幬音稠單帳也之象其幄上飾形非之適之字口江反覆也從􅜪從豕臣鍇曰蒙字從此莫公反文四小兒及蠻夷頭衣也從坰二二其飾也凡冃之屬皆從冃臣鍇曰史記云薄太后以冒絮提文帝是也今作帽張衡東京賦曰戴翠冒羽蓋也周禮考工記曰良蓋下冒不紘冒之義也忙報反大夫以上冠也邃延垂瑬纊紞從冃免聲后者黃帝𥘉作冕臣鍇曰冕冠上加之也長六寸前狹圎後廣方朱緣塗之前後邃延斿其前垂珠也俯仰逶迤如水之流也纊紞黃色也以黃綿綴冕兩旁下係玉瑱又謂之珥細長而鋭若筆頭以屬耳中無作聰明亂舊章虛巳以待人之意也史記曰黃帝始作軒冕故曰軒轅靈光殿賦曰炳煥可觀黃帝唐虞軒轅以庸衣裳有殊是也美選反或從系作臣鍇按論語曰麻冕禮也今也純儉純謂以絲衣冕也故從糸韓詩外傳曰黃帝純以拜鳯皇及管子皆作此絻字也兜鍪也從月由聲臣鍇曰胄胤之胄别從肉作胄長宥反司馬法胄從革冢而前也從月目聲臣鍇曰以物自蒙而前也謂貪冒若目無所見也莫號反古文犯取又曰會從月取聲臣鍇曰犯而取也故軍㓛上曰最下曰殿則外反犯而見也從月從見也臣鍇曰義同于冒沒黑反文六重三再也從坰闕昜曰參天地凡之屬皆從臣鍇曰此本為兩再之兩里飬反二十四銖為一兩從一從兩兩平分也兩亦聲臣鍇曰兩者積雙兩而成為一故從一此會意里飬反平也從草十五行之數二十分為一辰㒼平也讀若蠻沒團反文三庖犧所結繩以漁也從坰下象网交文也凡网之屬皆從网臣鍇按周易曰始作网罟以畋以漁坰者蒙覆取之也文爽反网或加亡臣鍇曰云聲或從糸古文网字從亡聲臣鍇曰與坰義同再也從坰闕昜曰參天地凡之屬皆從臣鍇曰此本為兩再之兩里飬反二十四銖為一兩從一從兩兩平分也兩亦聲臣鍇曰兩者積雙兩而成為一故從一此會意里飬反平也從草十五行之數二十分為一辰㒼平也讀若蠻沒團反文三庖犧所結繩以漁也從坰下象网交文也凡网之屬皆從网臣鍇按周易曰始作网罟以畋以漁坰者蒙覆取之也文爽反网或加亡臣鍇曰云聲或從糸古文网字從亡聲臣鍇曰與坰義同籕文從􅜪臣鍇曰坰與坰亦同网也從网繯繯亦聲也一曰綰也臣鍇曰今人多作罥字回茜反网也從网每聲莫推反网也從网干聲臣鍇曰天子出有罕車网也又雲罕大旗為网今俗謂網旗也享侃反罕也從网奄聲臣鍇曰網從上掩之也殷業反网也從网巽聲臣鍇曰亦免网也思篆反或從足巽逸也周書曰不卯不𦌔以成鳥獸者罥獸足故從足臣鍇曰獸之足也周也從网米聲詩曰入其阻也臣鍇曰网即周布之意眠伊反或從貞省臣鍇曰􅰴字從此捕魚從网非秦以罪為罪字臣鍇按詩曰豈不懷歸畏此罪罟造濯反魚网從网鋭聲臣鍇曰今謂織皮為罽居例反捕魚器從网卓聲臣鍇曰爾雅藿謂之罩网捕魚籠也吒孝反魚网從网曽聲走稜反魚罔從网瓜聲詩曰施罛濊濊臣鍇按爾雅曰魚罟謂之罛注曰網最大者也古呼反曲梁寡婦之笱魚所留也從网留聲臣鍇按爾雅凡曲者為罶注曰凡以簿為魚笱者為罶又曰嫠婦之笱謂之罶婺矛牙婦即寡婦也當言留脫亦字連丑反罶或從婁春秋國語曰講罶積柴本水中以聚魚從网林聲臣鍇按爾雅罧謂之涔注今祚罧者積柴水中魚得寒入其裏藏隱因以簿圍取之師今反罜䍡小魚罟從网主聲友處反䍡從网鹿聲盧木反釣也從网民聲臣鍇按左思吳都賦曰罠蹄連綱綱网中維絡大繩也眉均反以絲罟鳥從网從維古者芒氏𥘉作羅臣鍇按爾雅鳥謂之羅婁何反捕魚覆車也從网叕聲臣鍇按爾雅罟謂之罿罿罬也罬謂鳥敢反詈也從网馬聲也臣鍇曰謂以惡言加网之也悶亞反絡頭者也從网馽馬絆斤離反网也從网古聲臣鍇曰網之惣名也昆覩反或從革作罵也從网言臣鍇曰會意力豉反文三十四重十二覆也從册上下覆之凡襾之屬皆從襾讀若臣鍇曰表裏反覆之也音火下反賈字亦如此吼迓反覆也從襾乏聲臣鍇曰漢武帝詔曰􅘆弛之士駕之馬亦在御之而已宋顔延之赭白馬賦曰馬無覂駕之軼方勇反覂也從西復聲一曰蓋也臣鍇曰蓋覆也芳富反笮邀遮其辭得實曰核也大巾也從巾般聲或以為首幋臣鍇曰幋囊也别安反巾帤也從巾如聲也一曰幣布是臣鍇按易曰濡有衣帤又道家黃庭經曰人間紛紛臭如帤皆寒漏孔之故帛也故以喻煩臭女徐反帛也從巾敝聲臣鍇曰禮傳云幣帛是也避制反幘也髮有巾曰幘從巾責聲臣鍇按蔡雍獨斷曰漢元帝額有壯髮不欲人見故加幘以布包之也至王莽內加巾故時人云王莽秃幘施屋側册反布帛廣從巾畐聲臣鍇曰春秋左傳曰為之幅度便之無遷方菊反設色之工治絲練者從巾巟聲一曰㡆隔也臣鍇曰周禮冬官之屬有㡆氏忽光反紳也男鞶革婦人鞶絲象繫佩之形帶必有巾從重巾臣鍇曰􅜼其帶上連屬結固處當奈反領專也從巾旬聲相倫切弘農謂裙帔也從巾皮聲披義切下裙也從巾尚聲臣鍇曰裳下直而垂象巾故從巾射強反俗常從衣下裳也從巾君聲具分反俗從衣作裙也一曰帗也一曰婦人脅巾也從巾戔聲讀若椒榝之榝帔也臣鍇曰今謂之秼亦相復之屬也所八反幒也從巾軍聲古論反褌或從衣褌也從巾忽聲一曰帙之松反或從松作楚謂無緣衣從巾監聲臣鍇按春秋左氏傳曰蓽路􅯋縷是籠三反幔也從巾冥聲周禮有幎人臣鍇按周禮家宰之屬有幎人掌巾幎民的反幕也從巾曼聲悶半反禪帳也從巾􅔧聲臣鍇按曹植詩曰何必用衮幬然後展殷勤爾雅曰幬謂之帳注曰江東呼單帳也禪單字陳收反帷也從巾兼聲臣鍇按釋名曰簾廉也所以鄣為廉恥也因作此字今俗作簾連鹽反在旁曰帷也從巾隹聲位逵反古文帷臣鍇曰從匚象周匝張也從巾長聲臣鍇曰史籍或借張字如餉反帷在上曰幕按爾雅從巾莫聲門落反㡜裂也從巾􅎅聲并止反殘帛也從巾祭聲師例反書衣也從巾失聲遲匹反正專裂從巾俞聲臣鍇曰謂隨幅而裂之也數雛反帛書署從巾占聲署謂檢署名也遏輒反帙或從衣幡幟也從巾前聲臣鍇按國語曰戎車侍遊車之則千反幟也以絳徽帛著于背從巾徽省聲春秋傳曰楊徽者公徒若今救火衣然也火韋反幟也從巾􅰈聲片妖反書兒拭觚布也從巾番聲臣鍇曰觚八稜木于其上學書巳以布拭之晉人云不見酒家幡布乎用久則爛分軒反刜也從巾剌聲臣鍇曰謂拂之也勸遏反拭也從巾韱聲楚彡反車弊貌從巾單聲聲詩曰檀車幝幝也臣鍇曰車弊則木連及韋革金鐏飾皆起若敗巾然故從巾昌善反蓋衣也從巾冡聲也臣鍇曰象形古有罪著黑􅞲是也母東反蓋幭也從巾蔑聲一曰禪𬒳名咽反覆也從巾無聲臣鍇按爾雅幠大也又有也覆有之也儀禮曰幠用斂衮虎為反刷也從巾從人從食聲讀若式一曰襐飾臣鍇曰爾雅刷即飾也申力反囊也從巾韋聲臣鍇曰爾雅曰刷即飾也又帶也火韋反囊也今鹽官三斛為一帣從巾從聲臣鍇曰亦囊也俱便反糞也從又持巾掃坰內也古者少康𥘉作箕帚秫酒少康杜康也葬長垣臣鍇曰掃除曰􅠜除也古白紵歌詞曰白紵色如銀𫀆以光軀巾拂塵制以為𫀆餘作巾巾可以拂也故帚從巾取象也坰門內也少康殷王也或曰少康一號杜康也職受反幡也從巾卯聲臣鍇曰莊子云孔子翻六經以説老子疏曰翻㠾亂取之也迂言反籍也禮天子諸侯席肩黼黻純飾從巾庶省聲臣鍇曰巾即純也辭尺反古文從石省曰言其安如石也囊也從巾朕聲徒朋反以囊盛榖大滿而裂也從巾奮聲臣鍇曰囊榖滿涇即漲而幩也房粉反載米也從巾盾聲讀若易屯卦之屯臣鍇曰音寧亦囊也文倫反蒲席也從巾及聲讀若垥苟合反馬纏鑣扇汗也從巾賁詩曰朱幩鑣鑣是也曰謂以帛纒馬口旁鐵扇汗使不汗也扶云反墀地以巾之也從巾夒聲也讀若水溫㬮一曰著也臣鍇曰漢制以形漆塗地曰丹墀以黑漆塗地曰玄墀拭故汗則以巿臣鍇曰以韋為之也詩曰三百赤巿易曰朱巿方來多用此字也分勿反篆文巿從韋從犮谷作士無巿有制如榼缺四角爵辨服其色韎賤不得與裳同司農曰裳纁色從巿合聲臣鍇曰榼也酒榼腹圓上小下大象之也裳皆玄韎赤色韎曷然也苟搯反或從韋文二重二繒也從巾白聲凡帛之屬皆從帛臣鍇曰當言白亦聲脫亦字也陪陌反襄色織文也從帛金聲臣鍇曰襄雜色也漢魏郡有縣能織錦綺因名襄色也九沈反文二西方色隂用事物色白皆入之從入合二二隂數也凡白之屬皆從白臣鍇曰物入隂色剝為白陪陌反古文口之白也從白堯聲臣鍇曰日未出光生白日也宋玉神女賦曰若白日𥘉出照屋梁火杳反月之白也從白交聲詩曰月出皎兮堅鳥反人色白從白折聲臣鍇按古樂府曰為人頗白晳也思益反老人白也從白番聲易曰賁如皤如臣鍇按班固詩曰皤皤國老步他反或從頁作鳥之白從白寉聲臣鍇按詩曰白鳥胡僕反霜雪之白也從白豈聲臣鍇按張衡思玄賦曰行積水之皚皚偶來反草華白從白巴聲臣鍇曰今謂草華房為葩也鋪瓜反玉石之白從白敫聲堅鳥反際見之貌從白上下小見之臣鍇曰徐見若門壁之隙縫繳徹黑與青相次文也從黹友聲臣鍇曰其畫形作斧取其威斷也分勿反白與黑相次文也從黹甫聲臣鍇曰其畫形作斧取其威斷也分武反會五采鮮貌從黹虘聲詩曰衣裳􅮽􅮽臣鍇曰今詩作楚假借也襯許反會五采繒從黹綷省聲臣鍇曰郭璞爾雅序會綷舊説是也子內反衮衣山龍華蟲黺米也畫粉也從黹粉省聲衛宏説臣鍇曰畫聚粉也衛宏嘗傳古文尚書于杜林也弗吻反文六説文解字通釋卷第十四
