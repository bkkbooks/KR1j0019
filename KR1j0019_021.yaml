從水妾聲七捷反水名也從水居聲堅踈反水也從水臮聲其冀反水也從水尤聲馬秋反水也從水困聲苦悶反水也從水􅩏聲讀若瑣先火反水也從水尨聲免江反水也從水乳聲能吼反水也從水夂聲夂古文終字隻公反淺水也從水百聲臣鍇按顔之推家訓趙州柏人城北有小水土人不知名後讀西徐整碑云洦流東會之推以為此水漢來無名直以淺貌目之也潘客反水也從水千聲七先反水也一曰詩江有洍從水臣聲臣鍇按今爾雅作沱云沱湖在江邊詳紀反勃澥海之别名也從水解聲一説澥即澥谷臣鍇按列子諸書多謂海為渤澥侯豸反北方流沙也一曰清也從水莫聲臣鍇按史記云胸奴漠也班固云踰大漠門洛反天池也以納百川者也從水每聲臣鍇按莊子曰溟海者天池也吼乃反大也從水専聲拍戶反水大至也從水暗聲烏撼反浲水也從水共聲貟聰反大水也從水夆聲胡翁反水不遵其道也從水夆聲一曰洚下臣鍇按尚書降水警子作降侯邦反水朝宗于海貌也從水行余羡反水朝宗于海也從水朝省聲臣鍇曰今俗作潮直超反水脈行地中濥濥也從水夤聲異印反水漫天貌從水舀聲偷刀反小流從水肙聲爾雅曰汝為涓臣鍇按周廟銘曰涓涓不壅今爾雅汝為溳弓玄反豐流也從水昆聲古論反水潒漾也從水象聲讀若蕩徒廣反順流也一曰水名也從水􅫕聲臣鍇按爾雅又漦渌渌出涎沫也國語曰龍亡而漦在􅫕仕淄反仕災反水相入也從水內聲臣鍇按春秋左傳館于洛汭水曲曰汭是相入處也汝歲反深清也從水肅聲即肉反長流也一曰水名從水寅聲異展反流散也從水奐聲臣鍇按周易風行水上曰渙渙散也蘇判反俠流也從水必聲臣鍇按詩曰泌之洋洋頻未反流聲也從水􅡜聲臣鍇按詩其流活活古活反活或從聒水流湝湝從水皆聲一曰湝寒也詩曰風兩湝湝臣鍇曰衆流之貌古諧反泫湝流水從水玄聲上黨有泫氏縣臣鍇按漢書泫氏縣泫水所出也豫顯反水流貌詩曰滮池北流從水彪省聲反彪反沛也從水旁聲臣鍇曰水廣及貌坡良反流清貌從水劉聲詩曰瀏其清矣連丑反疾流也從水或聲况邑反礙流也從水薉聲詩曰施器歡括反深廣也從水聲一曰池臣鍇曰音皇春秋左傳周氏之周氏之池也烏光反清深也從水翏聲讀若牢臣鍇按莊子曰漻乎其清也梨桃反清也從水此聲臣鍇按謝眺詩曰寒流自清泚取啓反寒水也從水兄聲臣鍇曰愴况寒涼貌詡誑反涌繇也從水中聲讀若動臣鍇曰繇也橫而搖動也潘嶽曰泳之彌沖直東反浮貌從水凡聲方梵反轉流也從水云聲讀若混曰臣鍇按張衡賦水沄而涌濤羽文反澆也從水告聲書曰洪水浩浩候抱反莽沉大水從水亢聲一曰大澤臣鍇曰莽沆大水貌慱物志曰停水東方曰都一名㳘也解黨反水從孔疾出也從水冗翲迭反水暴至聲從水鼻聲披傋反水小聲也從水爵聲臣鍇曰小水瀺灂聲也士角反水疾聲也從水翕聲希立反水超涌也從水聲臣鍇曰又古國名徒崩反水涌光也從水光光亦聲詩曰在洸有潰臣鍇曰言勇如水之涌也國昌反涌出也從水矞聲一曰水中坻人所為為潏一曰潏水在京兆杜陵臣鍇按漢書潏在鄠縣北過上林入渭鵙冗反水涌流也從水反聲輔陀反江水之大波謂之澐從水雲聲臣鍇按梁有殷澐也羽文反大波為瀾從水闌聲臣鍇按爾雅注言渙瀾也勒餐反小波從漣臣次立按説文曰瀾或從連徐鉉曰今俗音力延反小波為淪從水侖聲詩曰河水清且淪漪一曰沒臣鍇曰有倫理也吕辰反浮也從水票聲片祅反汜也從水孚聲附柔反濫也從水已聲一曰淹符梵反汜也從水監聲一曰濡上及下也詩曰滭沸濫泉一曰清也臣鍇按孔子家語江出岫山原可濫觴泛觴也盧闞反下深免從水弘聲烏亭反回也一曰水名從水韋聲字歸反深所至也從水則聲察色反疾瀨也從水專聲土鑾反水聲也從水宗聲侯卭反水礙也疾波也從水敫聲一曰半遮臣鍇曰敫音􅕛堅歷反疾流也從水同聲頭貢反大波也從水幡聲福袁反涌也從水胸聲朂恐反滕也從水甬聲一曰涌水在楚與恐反湁湒􅘺也從水拾聲臣鍇按上林賦曰湁湒鼎􅘺丑立反宜流也從水空聲苦龍反激水聲也從水勺聲一曰井一有水一無水為汋實削反混流聲也從水軍聲一曰汙下貌户昆反水清也從水列聲易曰井洌寒泉食良舌反湛也從水叔聲臣鍇曰湛澄深也成育反水盛也從水容聲與恐反清也從水聲臣鍇按劉向列女傳曰􅊹漢酒醴如此音徴纏凌反朗也􅊹水之貌從水青聲親貞反水清底見也從水是聲詩曰湜湜其止神息反水流浼浼貌從水閔聲眉引反下漉也從水參聲臣鍇按相如封禪書滋夜漉所禁反下流濁也從水圍聲字歸反亂也一曰水濁貌從水圂聲明頓反濁也從水屈聲一曰滒泥一曰水出貌也古沒反回泉也從水旋省聲似戀反深也從水崔聲詩曰有漼者淵醋餧反回水也從水􅘢象形左右岸也中象水也扶蓮反古文淵從口臣鍇曰會意淵或省水滿也從水爾聲靣侈反水搖也從水詹聲從敢反旁深也從水尋聲臣鍇按淮南子曰遊于江潯海裔似侵反谷也從水平聲備明反水貌從水出聲讀若窋誇訥反水至貌從水薦聲讀若尊則千反土得水沮也從水聲讀若䵂臣鍇曰沮低散也遲夕反盈溢也從水㒼聲臣鍇曰㒼亡干反門罕反利也從水骨聲胡劼反不滑也從水嗇聲師吸反光潤也從水睪聲臣鍇按山海經濁澤而有光澄赫反浸淫隨理也從水䍃聲一曰久雨曰淫臣鍇曰隨其脈理而浸漬也移仐反漬也從水韯聲爾推曰泉一見一否曰瀸精亷反漏也從水貴聲亦決也胡塊反水所蕩泆也從水失聲移七反水不利也從水鬒聲五行傳曰若其沴作臣鍇曰氣不利乃為沴鬒非聲傳寫誤也即計反不深也從水戔聲剌件反水暫益且止未減也從水寺聲只耳反少減也一曰水門也從水省聲一曰水出丘前為渻息水反泥也從水卓聲臣鍇按春秋左傳掀公以出于淖獰教反小溼也從水翠聲遵誄反溼暑也從水辱聲臣鍇曰月令曰土潤溽暑儒曲反黑土在水者也從水土曰聲臣鍇曰論語涅而不淄檷穴反益也從水兹聲一曰滋水出牛飮山白陘谷東入呼沱臣鍇按春秋左傳曰正考父三命滋恭則欺反青黑貌也從水曶聲臣錯曰䀛音忽虎配反溼也從水邑聲臣鍇按詩曰厭浥行露殷戢反水散石從水少聲水少沙見也楚東有沙水臣鍇曰會意色加反談長説沙或從尐尐子結切水流沙上也從水賴聲臣鍇按漢有下瀨將軍郎蔡反水崖也從水貢聲詩曰敦彼淮濆臣鍇曰水崖墳潤也扶云反水崖也從水矣聲周書曰王出涘臣鍇曰人至崖止若有俟也牀史反水崖也從水午聲臣鍇按詩曰及江之汻忽午反水崖枯土也從水九聲爾稚曰水醮曰氿臣鍇曰水醮盡處俱水反水崖也從水漘聲詩曰置河之漘臣鍇曰爾雅云夷上酒下是倫反水濵也從水甫聲臣鍇按楚辭送美兮南浦送至于水濵也拍户皮小渚曰沚從水止聲詩曰于沼于沚只耳反滭沸檻泉也從水弗聲臣鍇曰滭沸檻泉毛詩也沸涌字作分勿反小水入大水曰潨從水衆聲詩曰鳧鷖在潨隻公反别水也從水􅏨􅏨亦聲臣鍇曰􅏨匹賣反水別復入也從水已聲詩曰江有汜一曰汜窮瀆也詳紀反湀辟流水處也從水癸聲臣鍇按爾雅湀門流川云通川也虬癸反滎濘也從水寧聲臣鍇曰春秋左傳戎馬旋濘泥濘也手徑反深池也從水圭聲臣鍇曰又渥窪水名恩崖反淸水也從水窐聲一曰窊也臣鍇曰老子漥則盈烏瓜反絶小水也從水熒省聲玄經反積水池也從水黃聲臣鍇曰春秋左傳潢汙行潦之水户荒反池也從水召聲臣鍇按詩潛雖在沼立少反大陂也從水胡聲楊州濅有五湖濅川澤所仰以溉灌臣鍇曰湖猶都也五湖一名具區其派有五故曰五湖或云以其周行五百里故曰五潮此失之甚夫雲夢澤方五百里可言五澤乎或引國語吳越戰于五湖直在一湖中戰故曰太湖自名五湖蓋五湖其都數若言兩京五都三秦百越但舉南都亦可言五都豈便謂其總舉太湖哉在三之中故云王湖復可爽乎塊徒反水都也從水支聲臣鍇曰水𡵨枝所會翹移反十里為成成間廣八赤深八赤謂之洫從水血聲論語曰盡力于溝洫况色反水瀆廣四赤深四赤從水冓聲臣按爾雅水注川曰溪注溪曰谷注谷曰溝注澮曰瀆便尤反溝也從水賣聲一曰邑中溝陀谷反水所居也從水聲臣鍇曰即匱字巨居反谷也從水臨聲讀若林一曰寒也力尋反水草交曰湄從水睂聲閩之反溝行水也從水行聲間撗反山夾水也從水間聲一曰澗出弘農新安東南入洛臣鍇曰澗猶隈也溝鴈反隈崖也其內曰澳其外曰隈從水奧聲臣鍇按淮南子漁者以其隈隩曲崖相讓內謂岸內曲隈外曲也詩曰汭鞠之即于目反夏有水冬無水曰澩從水學省聲讀若學士角反澩或不省水濡而乾也從水聲詩曰其乾矣臣鍇曰字騫罕反俗從隹魚遊水免從水山聲詩曰蒸然汕汕臣鍇曰舒散貌史患反行流也從水夬聲廬江有決水出大別山臣鍇按漢書決水廬江雩婁縣鵬穴反漏流也從水􅒋聲魯剜反水注也從水啻聲顛狄反新吕癰水也從水昔聲漢律曰及其灑㳻史索反埤增水邊土人所止者從水筮聲夏書曰過三澨時制反灌也從水主聲支處反溉灌也從水芙聲剜毒反水渡也從水􅩎聲臣鍇曰􅩎昔津將親反古文津從舟淮無舟渡河也從水朋聲臣鍇按詩曰不敢淜河今借馮字皮陵反小也從水橫聲一曰以船渡也户更反編木以渡水也從水付聲臣鍇按爾雅庶人乘泭甫殳反濟也從水度聲特路反緣水而下也從水合聲春秋傳曰三汾夏臣鍇曰公音兖與川反逆流而上曰洄溯向也水欲不違之而上也從水斥聲桑柞反或從朔溯洄也從水回聲尸隈反潛行水中也從水永聲子柄反涉水也一曰藏從水替聲一曰漠為潛臣鍇曰禹貢梁州潛水自漢出秦苫反水入船中也從水金聲一曰泛也臣鍇按漢書淦水出豫章新淦西入湖溝暗反淦或從今浮也從水之聲方帆反浮行水上也從水從聲古文或以汓為沒字臣鍇曰會意延秋反汓或從囚履石渡水也從石從水詩曰深則砅臣鍇曰今詩又作厲會意里曳反砅或從厲水上人所會也從水奏聲餐候反沒也從水甚聲一曰湛水豫章臣鍇按今周禮荆水其頴湛注云當在豫州在此非也宅減反古文湛沒也從水垔聲伊倫反沈也從水聲臣鍇曰音沒謀骨反沒水也從人從水讀與溺同臣鍇曰會意況覓反沒也從水畏聲㨶枚反雲氣起也從水翁聲臣鍇雲起于水綰本反滃也從水來聲臣鍇按漢武內傳曰七月七日決鬱日雲起殷強反雲雨起也從水妻聲臣鍇按宋玉高堂賦曰淒兮如雨七低反雲雨貌從水弇聲詩曰有淹淒淒依漸反小雨溟溟也從水貝聲民甹反小雨零也從水束聲臣鍇曰束音䇿史迮反疾雨也從水暴聲詩曰終風且瀑一曰沫也且曰瀑也臣鍇曰今詩作暴盆操反時雨澍生萬物從水尌聲臣鍇曰尌音豎時注反雨下也從水咠聲一曰􅘺涌也泲人反久雨涔澬也一曰水名從水資聲疾咨反雨水大貌從水尞聲臣鍇按楚詞曰收潦雨清言百川至秋則暴雨流潦之水盡而澄徹也勒抱反雨流雷下貌下從水蒦聲户霍反流下滳也從水豖聲上谷有涿縣臣鍇曰豖音畜角反竒字涿曰有涿鹿縣雨瀧瀧也從水龍聲臣鍇曰猶言濛瀧也來充反㴎沛也從水奈聲臣鍇曰流清貌能大反雨漊漊也從水婁聲一曰汝南請飲酒習之不醉為漊臣鍇曰漊漊小雨不絶之貌律乳反久雨也從水高聲􅳜抱反小雨也從水微省聲臣鍇曰音微尾希反溦雨從水蒙聲臣鍇從詩曰零雨其濛母束反陵上滴水也從水冗聲一曰濁黕也臣鍇曰冗者琛池心反雷震洅洅也從水再聲臣鍇曰謂雷聲震屋霤水聲散也則代反泥水滔滔也從水舀聲一曰繅絲湯侯坎反水澤多也從水甬聲詩曰僣始既涌胡甘反漸溼從也拿聲而住反澤多也從水憂聲詩曰既瀀既渥衣尤反漬也從水岑聲涔陽渚在郢臣鍇按楚辭望涔陽乎極浦助吟反小濡貌也從水足聲士角反霑也從水屋聲乙卓反灌也從水崔聲臣鍇曰崔音崔呼郭反露多也從水農聲詩曰零露濃濃奴聰反雨雪瀌瀌從水聲臣鍇曰瀌猶浮也此詩之言彼消反薄水也或曰中絶小水從水兼聲臣鍇按潘嶽寡婦賦曰霤淋淋而夜下兮水溓溓而微凝連鹽反水石之理從水阞聲周禮曰石有時而泐臣鍇曰言石因其脈理而解裂也阞音勒郎忒反凝也從水帶聲臣鍇按楚辭聖人不凝滯于物直例反著止也從水氏聲臣鍇曰春秋左傳物乃汦伏只耳反水裂去也從水虢聲古獲反水索也從水斯聲臣鍇曰索盡也先剌反水涸也從水氣聲或曰江下也詩曰汽可小康希氣反渴也從水固聲讀若狐貉之貉間慱反盡也從水肖聲息超反盡也從水焦聲子妙反盡也從水曷聲臣鍇曰飢渴字從欠刻曷反水虛也從水康聲臣鍇按爾雅漮虛也注漮之言空也謂丘虛爾彄莊反井一有水一無水曰瀱汋從水罽聲臣鍇曰按爾雅夏有水冬無水也居例反幽涇也從一覆也覆土而有水故溼也從濕省聲臣鍇曰今人不知有此字以濕為此字濕它匝反水名非此也傷執反幽溼也從水音聲臣鍇曰今人多言浥湆也羌邑反濁水不流也一曰窳下也從水夸聲臣鍇按淮南子曰決而入江汙水下樂也古乎反薉也從水于聲一曰小池為汙一曰塗也屋怖反隘下也從水秋聲有湫水在周地春秋傳曰晏子之宅湫隘安定胡郍有湫泉臣鍇按史記封禪書云祠湫于朝那即由反水潤下從水閠聲如順反平也從水阜聲王閔反平也從水丁聲臣鍇曰水岸平處京師南九里汀它寧反汀或從平水吏也亦溫也從水丑聲如紂反水濅也從水糞聲讀若粉臣鍇按爾雅瀵大出尾下注云尾猶底也河東汾隂縣有水口如車輪許濆沸涌出其深無限名之為馮翊郃陽縣又有一相去數里夾河河渚又一皆潛通夫問反新也從水􅓧聲臣鍇按詩􅗍其深矣又新臺有漼本皆如此字醋餒反無垢也從水靜聲從性反減瀎拭滅貌從水蔑聲臣鍇按春秋左傳曰三數叔魚之惡不為瀎減本此字今作末假借門撥反瀎泧也從水戊聲讀若椒榝之榝歡括反灌釡也從水自聲其冀反湯也從水耎聲奴短反渜水也從水安聲鳥旰切洝也從水而聲一曰煮熟也忍伊反財溫水也從水兊聲周禮曰以涗漚其絲臣鍇曰財裁始也輸𬒮反􅘺也從水官聲酒泉有樂涫縣臣鍇按史記龜策傳曰心如涫湯古安反涫溢也今河朔方言謂沸溢為涾從水沓聲臣鍇曰沓沓然沸也道合反浙㶕也從水大聲臣鍇曰水激過也楚辭曰齊吳榜以擊汏張衡賦曰涎瀺灂特奈反浙也從水簡聲艮限反汏米也從水析聲星激反浚乾漬米也從水竟聲孟子曰孔子去齊滰淅而行其兩反浸沃也從水叟聲色酋反抒也從水夋聲臣鍇曰杼取出之也蘇徇反浚也從水歷聲臣鍇按魯靈光殿賦曰動滴瀝以成響凡言滴瀝者皆謂漉出而餘滴也連的反浚也從水鹿聲一曰水下貌也臣鍇曰水下所謂滲漉盧木反浙米汁也從水番聲一曰潘水在河南榮陽臣鍇按左傳遺之潘沐潘可以沐也浦漫反潘也從水蘭聲勒餐反周謂潘曰泔從水甘聲溝三反久泔也從水修聲息抽反滓垽也從水殿聲臣鍇按爾雅澱謂之垽滓澱也今青澱澄澱所出也庭硯反澱滓濁泥也從水於聲於據反澱也從水宰聲阻史反濁也從水念聲乃忝反漬也從水籥聲胤略反釃酒也一曰浚也從門從水焦聲讀若夏書天用勦絶臣鍇曰釃濾酒也故從門即沼反側出泉也從水殸聲士挺反沈于酒也從水靣聲用書曰网敢湎于酒彌兖反莤酒也一曰浚也一曰露貌也從水胥聲詩曰有酒湑我又曰零露湑兮臣鍇曰莤音縮束茅以酹也私以反酢漿也從水將省聲子長反古文漿萍也從水京聲柳昌反薄味也從水炎聲稻槧反食已復吐之從水君聲爾雅曰太歲在申曰涒灘它門反沃也從水堯聲堅蕭反津也從水夜聲移尺反多汁也從水哥聲讀若柯臣鍇按淮南子曰甚淖而滒更和反豆汁也從水皓聲苟老反器滿也從水益聲移七反滌也從水西聲古文以為灑掃字息米反灑也從水條聲田溺反和也從水戢聲臻也反液也從水十聲之習反汁也從水審聲春秋傳曰猶拾瀋尺甚反飮歃也從水弭聲靣侈反飲歃也從水算聲一曰吮也巽倦反蕩口也從水欶聲色透反滄也從水坰聲臣鍇按詩洞酌彼行潦泂逺也當作迥借此字余請反寒也從水倉聲𥘉况反冷寒也從水靚聲又敬反滅火器也徙水卒聲臣鍇曰淬劒燒而入水也此退反灌髮也從水木聲門逐反灑靣也從水未聲虎配反古文沫從頁灑身也從水谷聲余足反灑手也從水噪聲子草反灑足也從水先聲臣鍇按尚書曰自洗腆思典反引水于井也從水及聲飢泣反渌也從水􅙯聲臣鍇按周禮曰渥淳其帛是倫反以水沃也從水林聲一曰淋淋山水下也方尋反漚也從水責聲贊寄反久漬也從水區聲臣鍇按春秋腹中有水氣也從水愁聲即沼反乳汁也從水重聲臣鍇按列子曰乳湩有餘端奉反鼻液也從水夷聲臣鍇按禮曰垂洟涕今人多誤以洟為涕以涕為洟他計反人液也從水干聲俟玩反無聲出涕者泣從水立聲羌邑反泣也從水弟聲它禮反涕流貌也從水散省聲詩曰潸焉出涕色間反㶕也從水東聲臣鍇按周禮書涷帛如此郎見反議罪也從水獻聲與法同意臣鍇曰如水之平也今相承從言訛也魚滅反變汙也從水俞聲一曰渝水出遼西臨渝東出塞臣鍇曰春秋左傳曰專之渝羊朱反損也從水咸聲古黯反盡也從水滅聲臣鍇曰滅音血彌恱反水轉轂也從水曹聲一曰人所乘及船也慈到反諸侯饗射之宫也西南為水東北為墻從水半半亦聲臣鍇曰天子辟雍水周之諸侯泮宫水才其半會意鋪渙反以銅受水刻節晝夜百刻從水屚聲臣鍇曰屚音漏屋屚也勒豆反丹沙所化為水銀也從水項聲臣鍇按淮南子曰正土之氣御于埃天埃天五百歲生缺缺百五歲生黃埃黃埃五百歲生黃澒黃澒五百歲生黃金偏土之氣御于清天清天五百歲生青曽靑曽五百歲生靑澒青澒五百歲生青金壯土之氣御于赤天赤天七百歲生赤丹赤丹七百歲生赤澒赤澒七百歲生赤金弱土之氣御于白天白天九百歲生白礜白礜九百歲生白澒白澒九百歲生白金澒水銀也呼寵反革水草也從水革蘋亦聲臣鍇曰蘋音平頻寧反治水也從水曰聲臣鍇曰尚書曰作泊作干筆反水多貌從水歲聲烏最水也從水果聲骨朵反霑也以水合聲侯夾切熱水也從水昜聲土郎切
