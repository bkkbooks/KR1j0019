front:
  text: 下南出積石山西南流又東回入塞過敦煌張掖酒泉南與洮河合過安定北又北流過朔方郡西又南流過五原郡南又東流過雲中西河郡東又南流過上郡河東郡西南出龍門至潼關與渭水合又東回過砥柱及洛陽即孟津至鞏縣與洛水合至成臯與濟水合又東北流過武德與沁水合至黎陽信都巨鹿之北分為九河又合為一河入海漢書云燉煌本酒泉地春秋左傳所謂允姓之戎所居瓜州也發原獨至於海故曰瀆間俄反西極之水從水八聲爾雅曰西至於汃國謂之四極臣鍇按今爾雅作邠注云極逺之國也匹人反澤在昆侖下從水幼聲讀若同臣鍇按水所鍾曰澤伊紏反水出發鳩山入河從水東聲得紅反水出廣漢梓潼北界南入墊江從水童聲臣鍇按山海經注發鳩山在上黨長子縣西田風反水出廣漢剛邑道徼外南入漢從水咅聲臣鍇按漢書廣漢郡剛邑道涪水徼外南至從墊江入漢過郡仁行千六十九里縣有蠻夷曰道附柔反水出蜀湔氐徼外岫山入海從水工聲臣鍇按漢書湔氐蜀郡道岫山在西徼外江所出東南入海過郡九行七千六百六十里又按周禮楊州其川三江岫山為大江至九江為中江至徐州為北江出岫山若甕口今益州建寧漏江縣濳行地底數里至楚都廣十里名南江𥘉在犍為與靑水汶水合至雒縣與雒水合東北至巴郡與涪水漢水白水合東至長沙與澧沅湘合顔延之所謂三湘淪洞庭者也至江夏與沔水合至潯陽為九道東會于蠡澤經蕪湖為中江至南徐州名北江入海溝降反江别流也岫山東别為沱從水它聲臣鍇按漢書沱出南郡江縣西東入江今又為池字豆科反江水東至會稽山隂為浙江從水折聲臣鍇按漢書浙江出會稽縣縣南蠻夷中東入海漢書浙江或作漸江慎所言或别也漢世謂黟歙為山越也之列反水出蜀汶江徼外東南入江從水我聲按漢書涐水出汶江縣徼外過郡七行三千三十里偶和反水出蜀郡縣虒玉壘山東南入江從水前聲一曰湔手浣之臣鍇按漢書湔出綿虒縣玉壘山至江陽入江過郡三行千八百九十里則千反水出蜀西南徼外東南入江從水末聲門撥反水出犍為涪南入黔水從水聲臣鍇按漢書溫出涪縣至鄨入黚水黚水亦南至鄨入江塢門反水出巴郡宕渠西南入江從水鬵聲臣鍇按漢書廬江灊縣沘山灊水所出北至壽春入芍陂以侵反水出漢中房陵東入江從水且聲臣鍇按漢書沮水出房陵縣東至郢入江行七百里王粲所謂倚曲沮之長洲且渠反益州池從水真聲臣鍇按史記漢池水厚廣末更狹似到流故曰滇池漢書在益州郡滇池縣西北大澤也的煙反水出益州牧靡南山西北入澠從水余聲臣鍇按漢書塗屮牧靡縣西北至越嶲入澠過郡二行千二十里注云靡音麻即升靡殺毒藥所出也周禮書塗路字如此古無塗字途彌俗也田吾反水出牂牁故且蘭東北入江從水元聲言袁反水出越嶲徼外東入若水從水奄聲殷潛反水出隴西臨洮東北入河從水兆聲臣鍇按漢書洮出臨洮縣西蕪中北至枹四于東入河偷勞反水自張掖刪丹西至酒泉合黎餘波入流沙從沙水弱聲桑欽所説臣鍇按漢書云桑欽以為導弱水自此西至酒泉合黎泥覔反滄浪水也南入江從水良聲臣鍇按江水出荆水東南流為滄浪之水勒當反水出安定涇陽开頭山東南入渭從水巠聲雍州川也臣鍇按漢書幵頭山在涇陽縣西涇水東南至陽陵入渭過郡三行千六十里幵苦見反在今靈洲東南土人謂之􅊈屯山陽陵漢景帝陵所在又按自幵頭東南經新平扶風至京兆高陵縣而入渭與淸洛水合至潼涬入河堅丁反水出隴西柏道東至武都為漢從水羕聲臣鍇按漢書漾出氐道縣至武都為漢水今漢書作漾胤亮反古文漾從水養聲水出隴西首陽渭首亭南谷東入河從水渭省聲杜林所説夏書以為出鳥鼠山雍州濅臣鍇按漢書出首陽縣西南鳥鼠同穴山東至船司空入河過郡四行千八百七十里周禮注可以為陂灌溉曰􅎊臣鍇按自首陽東至狟道縣上邽縣北陳倉縣南武功縣北槐里縣南與勞禮二水合東至髙陵與涇水合又與洛水合經秦漢之都至潼津而入河船司空漢造船官所在也于貴反漾也東為滄浪水從水難省聲喝散反古文漢如此水出武郡沮縣東狼谷東南入江從水丐聲或以為入夏水臣鍇按漢書自沮縣至沙羡南入江過郡五行四千里荆州川沮音千余反彌兖反水出金城臨羌塞外東入河從水皇聲臣鍇按漢書湟出臨羌縣盬池北東至允吾入河允吾亦金城郡之縣名户荒反水出右扶風􅊈縣西北入渭從水幵聲臣鍇曰班固西都賦所謂􅊈涌其西棄姸反水出右扶風鄠北入渭從水勞聲臣鍇曰相如上林賦所謂蕩蕩八川闌刀反水出石扶風杜陵𡵨山東入渭一曰入洛一曰漆城池從水漆聲臣鍇按漢書在右扶風漆縣西詩所謂漆沮既從秋日反水出京兆藍田谷入灞從水産聲所簡反水出左馮翊歸德北夷中東南入渭從水各聲雍州濅臣鍇按漢書歸德為德又按今出上洛冡領山經上洛弘農河南廬氏蠡城陽巾冝陽合伊瀍穀澗之水至鞏縣入河勒記反水出弘農盧氏山東南入沔從水育聲或以為出酈山西臣鍇按漢書淯出盧氏縣南至順陽入沔過郡二行六百里張衡南都賦所謂淯水蕩其􅎍融六反水出弘農盧氏還歸山東入淮從水女聲臣鍇按漢書汝出汝南定陵縣髙陵山東南至新蔡入淮過郡四行千三百四十里又淮南子博物志皆同高陵一名猛山則此注傳寫誤軟許反水出河南密縣大隗山南入潁從水異聲臣鍇按漢書潩出密縣大騩山南至臨潁入潁以即反水出太原晉陽山西南入河從水分聲或曰出汾陽北山冀州濅臣鍇按漢書汾出太原汾陽縣北山西南至汾隂入河過郡二行千三百四十里春秋左傳所謂新田有汾澮以流其惡也周禮云冀州其􅐛汾潞扶云反水出東郡東武陽入海從水顯聲桑欽云出平原高聲臣鍇按漢書禹治濕水出東郡東武陽縣東北至千乘入海過郡三行千二十里顯午合反它合反水出山陽平樂東北入泗從水包聲臣鍇按漢書泡出平樂縣東北泲入泗浦包反渮澤水在山陽湖陵南禹貢浮于淮泗逹于菏從水苛聲臣鍇按尚書又曰導菏澤𬒳孟豬更和反受泲水東入淮從水四聲臣鍇按漢書泗出濟隂乘氏縣東南至雎陵入淮過郡六行千一百一十里周禮青州川淮泗素次反水在齊魯之間從水亘聲臣鍇按杜預春秋釋側洹出汲郡林慮縣東北至信成入張甲河按張甲河信成縣杜預所言晉制在漢後地名攺昜也春秋左傳曰聲伯夢濟洹而歌也戶寒反河灉水在宋從水雍聲臣鍇按尚書雷夏既澤灉沮會同言灉入于雷澤也爾雅曰水自河出為灉按漢書雷澤在今濟隂城陽西北宛封反澶淵水也在宋從水亶聲臣鍇按春秋諸侯􅉀于澶淵杜預釋例頓丘衛南繁也示川反水出泰山蓋臨樂山北入泗從水朱聲臣鍇按漢書洙出蓋縣臨樂山西北入泗杜預云入沇水下合泗船區反水出青州濅從水木聲臣鍇按漢書術水自東莞縣南至下邳入泗過郡三行七百一十里注術與沭同常出反水出東海費東西入泗從水斤聲一曰沂水出泰山蓋靑州濅臣鍇按漢書沂出泰山蓋縣南至下邳入泗過郡五行六百里魚希反水出齊臨朐石膏山東北入巨定從水羊聲臣鍇按漢書洋水出臨朐石膏山東北至廣饒入巨定水名在齊郡巨定縣廣饒亦齊郡屬縣似羊反水出齊郡厲媯山東北入巨定從水蜀聲臣鍇按漢書濁出齊郡廣縣為山東北至廣饒入巨定木渥反水出東海桑瀆覆甑山東北入海從水既聲一曰灌注也臣鍇按漢書溉出北甑山東北至都昌入海苟代反水出琅邪箕屋山東入海從水維聲徐州濅夏書曰維淄其導臣鍇按漢書雜出琅邪箕縣北至昌都入海過郡三行五百二十里與追反水出琅邪靈門壺山東北入濰從水吾聲臣鍇按漢書浯水出靈門縣與此同阮孤反水出東萊曲城陽丘山南入海從水台聲臣鍇按漢書治出曲城縣陽丘山南至沂入海直而反水出琅邪朱虛東泰山東入濰從水文聲桑欽説汶水出泰山菜蕪西南入泲臣鍇按漢書朱虛縣東山汶所出東至安丘入維論語曰吾必在汶上矣亡運反水出魏郡武安東北入滹沱從水聲臣鍇按漢書魏郡武安縣有濅水東北至昌入滹沱河過郡五行六百一里進沁反水出趙國襄國西山東北入濅從水禺聲臣鍇按漢書趙國漢分郡縣封諸侯故曰國襄國縣西山渠水所出東北至任入濅又云有蓼水馮水東至朝平入湡朝平廣平國之縣名也五俱反水出趙國襄國中東入湡從水虒聲臣鍇按漢書廣平國南和縣有葭水東入㴲未知㴲所出卒兹反水在常山中丘逢山東入湡從水者聲一曰小洲曰渚臣鍇按漢書中丘縣蓬山長谷渚水所出東至張邑入濁諸與反水出常山房子贊皇山東入泜從水齊聲臣鍇按漢書房子縣贊皇山濟水所出東至廮陶入泜此非四瀆之濟古皆作泲字今人多亂之即洗反水出常山石邑井陵山東南入泜從水交聲國有洨縣臣鍇按漢書石邑縣西有井陵山洨水所出東南至廮陶入泜井陵今或作井陘誤也俊交反水在常山從水氐聲纏伊反水出涿郡故安東入漆涑從水需聲臣鍇按漢書易水出故安縣至范陽入濡軟區反水出河西靃山西南入汾從水會聲臣鍇按杜預春秋釋例澮出平陽絳縣西入汾古最反水出上黨穀逺羊頭山東南入河從水心聲臣鍇按漢書穀逺縣羊頭山世靡谷沁水所出東南至滎陽入河過郡三行九百七十里顔師古曰今沁至懷州武陟縣界入河云滎陽疑傳寫誤七任反水出上黨壺關東入淇一曰沾益也從水占聲臣鍇按漢書至朝歌入淇此又益也今俗作添土兼反冀州濅也上黨有潞縣從水路聲臣鍇按周禮潞出歸德縣漢書云潞縣古路子國按歸德縣屬北地郡勒妬反水出河內共北山東入河或曰出隆慮西山從水其聲臣鍇按漢書出共縣北山東至黎陽入河處知反濁漳出上黨長子鹿谷山東入清漳清漳出沽山大要谷北入河南漳出南郡臨沮從水章聲臣鍇按漢書濁漳東至鄴入清漳清漳出沽縣東北至邑城入大河過郡五行千六百八十里又南郡臨沮縣東北有􅍮山漳水所出東至江陵入陽水入沔行六百里注春秋左傳所謂江漢沮漳楚之望也周良反水出河內蕩隂東入黃澤從水􅛅聲臣鍇按漢書出蕩隂縣東至內黃澤蕩音湯􅛅音蕩吞匡反水出河東東垣王星山東為泲從水允聲臣鍇按漢書王屋山在垣縣東北流水所出南至武德入河軼出滎陽北地中又東至琅槐入海過郡九行千八百四十里今按沇出山東至溫縣西北始名泲水又東南流當鞏縣之北而南入河與河並流過成臯軼出為滎水東流過陽武及封丘北又東過冤昫縣南至定陶縣南又東北流與荷水會東至乘氏縣西分而為二其一東北流入巨野澤過壽張西與汶水合又北過穀城縣西又東北過盧縣北經齊郡東萊郡而入海與件反古文沇如此臣次立按説文徐鉉注云口部已有此重出又本部下文沿字注云緣水而下與川反沇也東入于海從水􅙻聲臣鍇曰今多作齊故與常山濟水相亂此則四瀆之濟即洗反水出南郡高成洈山東入繇從水危聲臣鍇按漢書洈出洈山東入繇南至華容入江注繇音由虞為反水在漢南從水差聲􅍮州寖春秋傳田修塗梁溠臣鍇按杜預春秋釋利義陽縣西有溠水原出縣北從縣西東南至隨入腹水側巴反水出桂陽盧山洭浦關為桂水郡念洭縣洭水所出東北入沅又桂水出桂陽縣東北入湘區昌反水出盧江入淮從水惠聲回桂反水出廬江雩婁北入淮從水雚聲臣鍇按漢書雩婁縣灌水北至蓼入決水過行郡二行五百一十里決水亦出此