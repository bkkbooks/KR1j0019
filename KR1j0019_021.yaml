body:
  text: 文四百六十五重二十三二水也闕凡沝之屬皆從沝職纍反水行也從沝從㐬㐬突忽也臣鍇曰突忽猶疾也里由反篆文流從水徒行厲水也從步沝臣鍇曰詩曰涉胃為亂常攝反篆文涉從水文三重二水崖也人所賔附頻蹙不前而止從真從涉凡頻之屬皆從頻臣鍇曰故謂之頻也詩曰率止之頻或借
  hash: sha256:f45304b54cf0ceb23776bbf7ed3a2b54a53244969271632266089a89b8d73991
