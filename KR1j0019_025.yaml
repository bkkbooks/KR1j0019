seq: 25
body:
  text: 絡從糸咎聲讀若柳力久切織橫絲也從糸韋聲云貴切緯也從糸軍聲王問切織餘也從糸貴聲胡貴切紀也從糸充聲他綜切絲别也從糸已聲居擬切粗類也從糸強聲居兩切絲節也從糸頪聲盧對切絲勞即紿從糸台聲徒亥切絲瀝納納也從糸內聲奴答切細絲也從糸方聲妃兩切斷絲也從糸從刀從卩情雷切古文絶象不連體絶二絲續也從糸繼一曰反􅓟為繼古詣切連也從糸賣似足切古文續從庾貝臣鉉等曰今俗作古行切繼也從糸贊聲作管切繼也從糸召聲一曰紹緊絲也市沼切古文紹從邵偏緩也從糸聲曷善切緩也從糸盈聲讀與聽同杝丁切䋼或從呈緩也一曰舍也從糸從聲足用切緩也從糸豫聲傷魚切絲勞也從糸然聲女延切詘也從糸于聲曰縈也億俱切直也從糸幸月讀若陘胡頂切細也從糸韱聲息亷切微也從糸囟聲穌計切旄絲也從糸苗聲周書曰惟緢有稽武儦切參縒也從糸差聲楚冝切冕也從糸番聲附袁切亂也從糸宿聲曰蹴也所六切亂也從糸文聲啇書曰有條而不紊亡運切絲次弟也從糸及聲居立切聚束也從糸忽聲臣鉉等曰今俗作總非是作孔切約也從糸具聲居玉切纏束也從糸勺聲于略切纏也從糸聲盧鳥切繞也從糸㕓聲直連切門里也從糸堯聲而沼切轉也從糸鬒聲之忍切落也從糸聲胡畎切交也從糸辡聲頻犬切締也從糸吉聲古屑切結也從糸骨聲古忽切結不解也從糸帝聲時計切束也從系專聲符钁切束也從糸崩聲墨子曰禹葬會稽桐棺三寸葛以繃之輔肓切急也從糸求聲詩曰不競不絿巨鳩切急引也從糸同聲古熒切散絲也從糸瓜聲匹卦切不均也從糸羸聲力臥切相足也從糸合聲居立切止也從糸林聲讀若郴丑林切止也從糸畢聲卑吉切素也從糸丸聲胡官切絿絲也從糸冬聲職切古文終合也從糸從集讀若捷姊人切帛也從糸曽聲疾陵切籕文繒從宰省楊雄以為漢律祠宗廟丹書告繒也從糸胃聲云貴切綺絲之數也漢律曰綺絲數謂之絩布謂之總綬組謂之首從糸兆聲治小切文繒也從糸寄聲祛彼切細縳也從糸聲胡谷切白鮮色也從糸專聲持沇切並絲繒也從糸兼聲古甛切厚繒也從糸弟聲杜兮切凍繒也從糸柬聲郎甸切鮮色也從糸高聲古老切粗緒也從糸璽聲臣鉉等曰今俗别作絶非是式支切大絲繒也從糸由聲直由切㨖繒也一曰徽幟信也有齒從糸􅽠聲康禮切東齊謂布帛之細曰綾從糸夌聲力膺切繒無文也從糸曼聲漢律曰賜衣者縵表白襄莫半切五采備也從糸肅聲息救切倉絢切帛丹黃色從糸是聲他禮切緹或從氏帛赤黃色一染謂之縓再染謂之赬三染謂之纁從糸原聲七絹切帛青赤色從糸此聲將此切帛赤白色從糸工聲户公切帛青色從糸蔥聲倉紅切帛深青楊赤色從糸甘聲古暗切帛蒼艾色從糸卑聲詩縞衣綥巾未嫁女所服一曰不借綥渠之切綥或從其帛如繒色或曰深繒從糸噪聲讀若噪親小切帛黑色也從糸災聲側持切帛雀頭色一曰微黑色如紺才淺也讀若才從糸毚聲士咸切帛騅色也從糸剡聲詩曰毳衣如􅣞臣鉉等曰今俗别作毯非是士敢切帛文草染色從糸戾聲郎計切白鮮衣貌從糸不聲詩曰素衣其紑匹丘切白鮮衣貌從糸炎聲謂衣米色鮮也充彡切釆色從系需聲讀若易繻有求臣鉉等曰漢書傳符帛也相俞切繁釆色也從糸辱聲而蜀切冠織也從糸麗聲所綺切冠卷也從糸肱聲户萌切紘或從弘冕冠塞耳者從糸冘聲臣鉉等曰今俗别作髧非是都感切冠糸也從糸嬰聲于盈切纓卷也從糸央聲于兩切糸冠纓也從糸委聲儒隹切織帶也從糸昆聲古衣切大帶也從系申聲尖人切帶綬也從糸單聲昌善切韍維也從糸受聲殖酉切綬屬其小者以為冕纓從糸且聲則古切綬紫青也從糸咼聲古蛙切綬維也從糸逆聲冝戟切似組而赤從糸算聲作管切系也一曰結而可解從糸丑聲女久切青絲綬也從糸侖聲古還切系綬也從糸廷聲他丁切綬也從糸亘聲胡官切細疏布也從糸惠聲私鋭切頸連也然糸暴省聲輔各切刀劒􅚆也從糸矦聲舌矦切衣糸也從糸今聲居音切籕文從金衣純也從糸彖聲以絹切裳削幅謂之纀從糸僕聲博木切脛衣也從糸夸聲苦故切褲細也從糸喬聲牽搖切小兒衣也從糸保聲臣鉉等曰今俗作非是慱抱切薉貉中女子無褲以帛為脛空用絮輔核名曰繜衣狀如襜䄖從糸尊聲子昆切絛屬從糸皮聲讀若𬒳或讀若水波之波慱禾切扁緒也從糸攸聲土刀切采彰也一曰車馬飾從糸戉聲玉伐切絨屬從糸從從省聲足容切圜釆也從糸川聲詳遵切增益也從糸重聲直容切援臂也從糸襄聲汝羊切維綱中繩從糸嶲聲讀若畫或讀若維户圭切維紘繩也從糸岡聲古郎切古文綱持綱紐也從糸員聲周禮曰縜寸臣鉉等曰絹長寸也為贇切絳線也從糸侵省聲詩曰具胄朱子林切線也從糸婁聲力主切縷也從糸戔聲私箭切古文線縷一棪也從糸穴聲乎決切以針紩衣也從糸逢聲符容切緶衣也從糸疌聲七接反緁或從習縫也從糸失聲直質切衣戚也從糸耎聲而沇切輔縫也從糸旦聲文莧切輔也從糸善聲時戰切論語曰絬衣長短右𬒮從糸舌聲私􅍌切綴得理也一曰大索也從糸畾聲力追切以絲介履也從糸離聲力知切戟衣也從糸殹聲一曰赤黑色繒烏雞切旌旗之遊也從糸參聲所銜切邪幅也一曰三紏繩也從糸微省聲計歸切扁緒也一曰弩腰鉤帶從糸折聲井􅍌切繟繩也從糸刃聲女鄰切索也從糸蠅省聲食陵切紆朱縈繩一曰急弦之聲從糸爭聲讀若旌側莖切收韏也從糸熒省聲於營切纑繩絇也從糸句聲讀若鳩其俱切以繩有所縣也春秋傳曰夜縋納師從糸追聲持偽切攘臂繩也從糸聲居願切束篋也從糸咸聲古咸切緘也從糸滕聲徒登切次簡也從糸扁聲布玄切車蓋維也從糸隹聲以追切車鞴也從糸伏聲平祕切鞴或從草鞴或從革􅴻聲乘輿馬飾也從糸正聲諸盈切䋊綊也從糸夾聲胡頰切馬髦飾也從糸每聲春秋傳曰可以稱旌繁乎附袁切繁或從籀文辨馬紲也從糸疆聲居良切馬尾韜也從糸分聲撫文切馬緧也從糸肘省聲除柳切馬紂也從糸酋聲七由切蟲縶也從糸半聲博慢切絆前兩足也從糸須聲漢令蠻夷卒有相主切牛糸也從糸引聲讀若矤直引切以長繩繫牛也從糸旋聲辭㘘切牛㘘也從糸麻聲靡為切縻或從多糸也從糸世聲春秋傳曰臣貟羈紲私􅍌切紲或從枼索也從糸黑聲莫北切大索也一曰急也從糸恆聲古恆切綆也從糸矞聲余聿切古文從絲籕文繘汲井綆也從糸更聲古杏切彈彄也從糸有聲弋宰切又古亥切生絲縷也從糸敫聲之若切繴謂之罿罿謂之罬罬謂之罦捕鳥覆車也從糸辟聲慱厄切釣魚繫也從糸昏聲吳人解衣相𬒳謂之緍武申切敝綿也從糸如聲息據切絮也一曰麻未漚也從糸各聲盧各切絮也從糸廣聲春秋傳曰皆如挾纊苦謗切纊或從光絮一苫也從糸氏聲諸氏切治敝絮也從糸剖聲芳武切潔緼也一曰敝絮從糸奴聲易曰需有衣絮女余切繫才也一曰惡絮從糸􅌛聲古詣切繫􅮗也一曰維從糸虒聲郎兮切績也姪省乃得聲徒結切交枲也一曰緁衣也從糸便聲房連切履也一曰青絲頭履也讀若阡陌之陌從糸户聲亡百切枲履也從糸封聲慱蠓切履兩枚也一曰絞也從糸從兩兩亦聲力讓切麻一專也從糸㓞聲古屑切枲之一潔也一曰綢繆從糸翏聲武彪切繆也從系周聲直由切紼也從糸昷聲于云切亂系也從糸弗聲分勿切氐人殊縷布也從糸并聲北萌切氐人􅖯也讀若禹貢玭珠從糸比聲卑履切西胡毳布也從糸罽聲居例切經也從糸益聲春秋傳曰夷薑縊于賜切車中把也從糸從妥徐鍇曰禮升車必正立執綏所以安也當從瓜從安省説文無妥字匆遺切宗廟常器也從糸系繤也廾持米器中實也互聲此與爵相似周禮六彛雞彛鳥彛黃彛虎彛蜼彛斝彛以待祼將之禮以脂切皆古文彛密也從糸致聲直利切文二百四十八重三十一白緻繒也從糸􅑰取其澤也凡素之屬皆從素桑故切素屬從素奴聲居玉切白䋤縞也從素勺聲以灼切素屬從素率聲所律切也從素卓聲昌約切繛或省繛也從素爰聲胡玩切緩或省文六重二𧖟所吐也從二糸凡絲之屬皆從絲息兹切馬轡也從絲從軎與連同意詩曰六轡如絲兵媚切織絹從糸貫杼也從絲省廾聲古還切臣鉉等曰草古磺字文三捕鳥畢也象絲罔上下其竿柄也凡率之屬皆從率所律切文一一名慱三寸首大如擘指象其卧形物之微細或行或毛或羸或介或鱗以蟲為象凡蟲之屬皆從蟲許偉切蟲也從蟲復聲芳目切神蛇也從蟲朕聲徒登切大蛇可食從蟲冉聲人占切蚓也從蟲堇聲棄忍切側行者從蟲寅聲余忍切蚓或從引蟲在牛馬皮者從蟲翁聲烏紅切螉䗥也從蟲從聲子紅切知聲蟲也從蟲鄉聲許兩切司馬相如蠁從向蟲也從蟲召聲都僚切蟲也從蟲聲祖外切繭蟲也從蟲甬聲余隴切蛹也從蟲鬼聲讀若潰胡罪切腹中長蟲也從蟲有聲户恢切腹中短蟲也從蟲堯聲如招切似蜥蜴而大從蟲唯聲息遺切虺以注鳴詩曰胡為虺􅔼從蟲兀聲臣鉉等曰兀非聲未詳許偉切􅔼易也從蟲析聲先繫切在壁曰蝘蜓在草曰􅔼易從蟲匽聲于殄切蝘或從䖵蝘蜓也從蟲廷聲一曰蚓蜓徒典切榮蚖蛇醫從注鳴者從蟲元聲愚袁切蟲也一曰大螫也讀若蜀都布名從蟲雚聲巨貟切蟲食榖葉者吏冥冥犯法即生螟從蟲從冥冥亦聲莫經切蟲食苗葉者吏乞貸則生蟘從蟲從貸貸亦聲詩曰去其螟蟘臣鉉等曰今俗作􅠀非是徒得切蝨子也一曰齊謂蛭曰蟣從蟲幾聲居稀切蟣也從蟲至聲之曰切蛭蝚至掌也從蟲柔聲耳由切蛣䖦蝎也從蟲吉聲去吉切蛣䖵也從由出聲區勿切白魚也從蟲覃聲余針切丁蛵負勞也從蟲巠聲户經切毛囊也從蟲臽聲乎感切蟲也從蟲喬聲居夭切毛蟲也從蟲􅥘聲千志切蠆也從蟲圭聲烏蝸切䖯也從蟲氏聲巨支切毒蟲也象形丑芥切蠆或從䖵蝤也從蟲酋聲字秋切也從蟲齊聲徂兮切蚚也從蟲弘聲徐鍇曰弘與強聲不相近秦刻石文從口疑從籕文省巨良切籕文強從䖵從強強也從蟲斤聲巨衣切中𧖟也從蟲上目象蜀頭形中象其身蜎蜎詩曰蜎蜎者蜀巿玉切馬蠲也從蟲目益聲象形明堂月令曰腐草為蠲古玄切齧牛蟲也從蟲聲邊兮切尺蠖屈申蟲也從蟲蒦聲烏郭切復陶也劉歆説蝝蚍蜉子董佇舒説蝗子也從蟲彖聲與專切螻蛄也從蟲婁聲一曰天螻洛矦切螻蛄也從蟲古聲古乎切丁蟻也從蟲龍聲盧紅切羅也從蟲我聲臣鉉等案爾雅蛾羅𧖟蛾也䖵部已有或作蛾此重出五何切蚍蜉也從蟲豈聲魚綺切蟻子也從蟲氐聲周禮有蚔醢讀若祈直尼切籕文蚳從䖵古文蚳從土􅊟蠜也從蟲樊聲附袁切悉􅢊也從蟲帥聲臣鉉等曰今俗作蟀非是所律切馬蜩也從蟲靣聲武延切蠰不過也從蟲當聲都郎切蠰也從蟲襄聲汝羊切堂蜋也從蟲良聲一名蚚父魯當切蛸堂蜋子從蟲肖聲相邀切􅛔蟥以翼鳴者從蟲并聲薄經切􅛔蟥也從蟲矞聲余律切􅛔蟥也從蟲黃聲乎光切蛅䗐強半也從蟲施聲式支切蛅斯墨也從蟲占聲職廉切蝤蠐也從蟲曷聲胡葛切縊女也從蟲見聲胡典切盧也從蟲肥聲符非切渠䖼一曰天社從蟲却聲其虐切融羸蒲盧細要土蜂也天地之性細要純雄無子詩曰螟蠕有子蜾羸負之從蟲聲古火切融或從果蜾羸也從蟲羸聲從曰虒蝓郎果切螟蠕桑蟲也從蟲霝聲郎丁切蛺蝶也從蟲夾聲兼叶切蛺蝶也從蟲疌聲臣鉉等曰今俗作蝶非是徒叶切蟲也從蟲之聲赤之切螌螯毒蟲也從蟲螌聲布還切螌蝥也從蟲敄聲臣鉉等曰今俗作䖵非是蟲即蠿蟊蜘蛛之别名也莫交切鼠婦也從蟲番聲附袁切蛜威委黍委黍鼠婦也從蟲伊省聲于脂切蜙蝑以股鳴者從蟲蚣聲息恭切蜙或省臣鉉等曰俗作古紅切以為蜈蜈蟲名蚣蝑也從蟲胥聲相居切蟲也從蟲庶聲之夜切螽也從蟲皇聲乎先切蟬也從蟲周聲詩曰五月鳴蜩徒腳切蜩或從舟以旁鳴者從蟲單聲市連切寒蜩也從蟲兒聲丑雞切螇鹿蛁蟟也從蟲奚聲胡雞切􅢤蚗蛁蟟也從蟲失聲于恱切􅢤蚗蟬屬讀若周天子赧從蟲丐聲武延切蜻蛚也從蟲列聲良薛切蜻蛚也從蟲青聲子盈切蜻蛉也從蟲令聲一名桑根郎丁切蠛蠓也從蟲蒙聲莫孔切􅨑也一曰蜉蝣朝生莫死者從蟲􅮼聲離灼切秦晉謂之蚋楚謂之蚊從蟲芮聲而鋭切蟰蛸長股者從蟲肅聲穌雕切蟲也從蟲省聲息正切商何也從蟲寽聲力輟切蠅䏣也周禮蠟氏掌除從蟲昔聲鉏駕切動也從蟲耎聲而沇切行也從蟲支聲巨支切蟲行也從蟲瞏聲香沇切蟲曵行也從蟲􅋄聲讀若騁丑善切螽醜螸垂腴也從蟲欲聲余足切蠅醜搖翼也從蟲扇聲式戰切蛇蟬所解皮也從蟲稅省輸芮切螫也從蟲若省聲呼各切蟲行毒也從蟲赦聲施隻切镻也從蟲亞聲烏各切搔蛘也從蟲羊聲余兩切敗創也從蟲人食食亦聲乘力切龍之屬也池魚滿三千六百蛟來為之長能率魚飛置笱水中即蛟去從蟲交聲古肴切若龍而黃北方謂之地螻從蟲離聲或云無角曰螭丑知切龍子有角者從蟲丩聲渠幽切蛇屬黑色潛于神淵能興風雨從蟲侖聲讀若戾草力屯切蜦或從戾海蟲也長寸而白可食從蟲兼聲讀若嗛力鹽切雉入海化為蜃從蟲辰聲時忍切蜃屬有三皆生于海千歲化為秦謂之牡厲又云百歲燕所化魁􅧳一名復纍老服翼所化從蟲合聲古沓切陛也修為螷圜為蠇從蟲􅋻臣鉉等曰今俗作􅪓或作􅜹非是蒲猛切蝸螺也從蟲咼聲古華切蜃屬從蟲丰聲步項切蚌屬似螊微大出海中今民食之從蟲萬聲讀若賴力制切虎蝓也從蟲俞聲羊朱切蜎也從蟲肙聲狂沇切卯蟺也從蟲亶聲常演切􅝦蟉也從蟲幽聲于蚪切􅝦蟉也從蟲翏聲力幽切藏也從蟲執聲直立切青蚨水蟲可還錢從蟲夫聲房無切䗇鼁詹諸以脰鳴者從蟲掬聲居六切蝦蟆也從蟲假聲乎加切蝦蟆也從蟲莫聲莫遐切大龜也從胃鳴者從蟲巂聲户圭切司馬相如説蠵從敻螹離也從蟲漸省聲慈染切有二敖八足旁行非蛇鮮之穴無所庇從蟲解聲胡買切蟹或從魚蟹也從蟲危聲過委切短狐也似鱉三足以氣射害人從蟲或聲于逼切蜮又從國臣鉉等曰今俗作古獲切以為蝦蟇之别名似􅔼易長一丈水潛吞人即浮出日南從蟲屰聲吾各切蛧蜽山川之精物也淮南王説蛧蜽狀如三歲小兒赤黑色赤目長耳美髮從蟲网聲國語曰木石之怪夔蛧蜽文兩切蛧蜽也從蟲兩聲臣鉉等曰今俗别作魍魎非是良奬切善援禺屬從蟲爰聲臣鉉等曰今俗别作猿非是雨元切禺屬從蟲翟聲直角切如母猴卬鼻長尾從蟲隹聲余季切北方有蚼犬食人從蟲句聲古厚切蛩蛩獸也一曰秦謂蟬蛻曰蛩從蟲鞏聲渠容切鼠也一曰西方有獸前足短與蛩蛩巨虛比其名謂之蟨從蟲厥聲居月切蝙蝠也從蟲扁聲布玄切蝙蝠服翼也從蟲畐聲方六切南蠻蛇種從蟲􅒋聲莫還切東南越蛇種從蟲門聲武巾切螮蝀也狀似蟲從蟲工聲明堂月令曰虹始見户工切籕文虹從申申電也螮蝀虹也從蟲帶聲都計切螮蝀也從蟲東聲多貢切衣服歌謡草木之怪謂之祅禽獸蟲蝗之怪謂之從蟲辥聲魚􅍌切文一百五十三重十五蟲之總名也從二蟲凡䖵之屬皆從䖵讀若昆古魂切任絲也從䖵替聲昨含切𧖟化飛蟲從䖵我聲五何切或從蟲齧人珧蟲從䖵又聲叉古瓜字子皓切蚤或從蟲齧人蟲從䖵卂聲所櫛切蝗也從䖵夂聲攴古文終字職戎切螽或從蟲衆聲蟲也從䖵展省聲知衍切小蟬蜩也從䖵􅎒聲子􅍌切蠿蟊作罔蛛蟊也從䖵􅓟聲􅓟古絶字側八切蠿蟊也從䖵矛聲莫交切蟲也從䖵寧聲奴丁切也從䖵曹聲財牢切螻蛄也從䖵聲胡葛切蟲蛸也從䖵卑聲匹標切或從蟲飛蟲螫人者從䖵逢聲敷容切古文省蜂甘飴也一曰螟從蟲冪聲彌必切或從宓螶􅨑也從䖵巨聲強魚切齧人飛蟲從䖵民聲無分切蚊或從昏以昏時出也俗蚊從蟲從文齧人飛蟲從䖵亡聲武庚切木中蟲從䖵橐聲當故切蠹或從木象蟲在木中形談長説蟲齧木中也從䖵彖聲盧啓切古文多足蟲也從䖵求聲巨鳩切或從蟲虻也從䖵㯱聲縳年切或從蟲從孚蟲食也從䖵雋聲子兖切蟲動也從䖵春聲尺尹切古文蠢從􅥘周書曰我有于西文六重四八風也東方曰眀庶風東南曰清明風南方曰景風西南曰涼風西方曰閶闔風西北曰不周風北方曰廣莫風東北曰融風風動蟲生故蟲八日而化從蟲凡聲凡風之屬皆從風方戎切古文風北風謂之從風涼省聲吕張切小風也從風术聲翾聿切扶搖風也從風猋聲甫遙切飆或從包回風也從風㶾聲撫招切朔風也從風立聲穌合切高風也從風翏聲力求切疾風也從風從忽忽亦聲呼骨切大虱也從風胃聲王勿切大風也從風日聲于筆切風所飛揚也從風易聲與章切風雨暴疾也從風利聲讀若栗力質切烈風也從風􅍌聲讀若􅍌良切文十三重二蟲也從蟲而長象冤曲尾形上古草居患它故相問無它乎凡它之屬皆從它説何切它或從蟲臣鉉等曰今俗作食遮切文一重一舊也外骨內肉者也從它龜頭與它頭同天地之性廣肩無雄龜鱉之類以它為雄象足甲尾之形凡龜之屬皆從龜居追切古文龜龜名從龜久聲攴古文終字徒冬切龜甲邉也從龜冉聲天子巨尺有二寸諸矦尺大夫八寸士六寸汝閻切文三重一蛙黽也從它象形黽頭與它頭同臣鉉等曰色其腹也凡黽之屬皆從黽莫否切籕文黽甲蟲也從黽敝聲井􅍌切大鱉也從黽元聲愚袁切蝦蟇也從黽圭聲烏媧切圥鼀詹諸也其鳴詹諸其皮鼀鼁其行圥圥從黽從圥圥亦聲七宿切鼀或從酋􅖚􅠴詹諸也詩曰得此􅖚􅠴言其行􅠴􅠴從黽爾聲式支切水蟲似蜥易長大從黽單聲徒何切水蟲也薉貉之民食之從黽奚聲胡雞切屬頭有兩角出遼東從黽句聲其俱切營營青蠅蟲之大腹者從黽從蟲余陵切鼀蟊也從黽省聲陟離切或從蟲蛛也從黽朱聲陟輸切蛛或從蟲匽􅏯也讀若朝楊雄匽􅏯蟲名旦非是從黽從旦臣鉉等曰今俗作朝直遙切篆文從良文十三重五凡物無乳者卵生象形凡卵之屬皆從卵盧管切卵不孚也從卵假聲徒執切文二説文解字通釋卷第二十五
