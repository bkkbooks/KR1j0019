front:
  text: 古文金臣鍇曰􅎧上皆象金形白金也從金㫐聲言陳反白金從金尞聲臣鍇曰爾雅其美者謂之鐐梨桃反白金也從金沃聲臣鍇按詩曰隂靷鋈續晼毒反青金也從金公聲與川反錕鉛之間也從金易聲臣鍇曰銀色而鉛質也星激反錫也從金引聲臣鍇曰爾雅云也異印反赤金也從金同聲田風反銅屬也從金連聲臣鍇按史記曰長沙出連錫郎此也鄰延反黑金也從金􅨖聲聽切反鐡或省古文鐡從夷九江謂鐡曰鍇從金皆聲臣鍇曰張衡南都賦曰銅錫鉛鍇南陽與九江雖遙俱為楚地也字書曰鐡好也一曰白鐡也夫鐡精則白肯駭反鐡也一曰轡首銅也從金攸聲臣鍇曰今人言鈭錔也延秋反剛鐡也可以刻鏤從金婁聲夏書曰梁州貢鏤金也一曰鏤釡也勒丑反鐡類也從金賁聲讀若訓父文反金之澤者也從金先聲一曰小鑿一曰鐘下兩角其間謂之銑臣鍇按國語曰玦之以金者銑寒甚矣胡可恃也注曰銑猶灑也灑然寒貌言無和潤也思典反剛也從金臤聲臣鍇曰淬刀劒刃便堅也經硯反金屬也一曰剝也從金黎聲里西反金色從金柔聲臣鍇曰借為領録字劣束反銷金也從金夀聲支處反鑠金也從金肖聲息超反銷金從金樂聲書却反治金也從金柬聲郎電反錬鉼黃金也從金丁聲的冥反鑄塞也從金固聲臣鍇曰鑄銅鐡以塞隙也後漢注有黨錮寒其仕進之路也骨度反作中腸也從金襄聲臣鍇曰鑄鍾鑄屬使內空者于型範中更作土模所以後却流銅也又若果實之穰釋名云銄鑲兵也兩頭曰銄中央曰鑲或推攘或銄引也臣鍇按晏子云直兵將推之曲兵將銄之即此也然莊反可以持冶器鑄鎔者也從金夾聲讀若漁人策魚之策一曰若挾持臣鍇曰今鐡夾持鑄鍋者居狹反冶器法也從金容聲臣鍇曰亦樓範也古言鎔栽出于此與封反銅鐡朴也從金廷聲笛頲反小冶也從金假聲臣鍇曰推之而已不銷故曰小冶都半反鐡文也從金曉聲喜杳反景也從金竟聲居􅔡反曲鉹也一曰鬵鼎也從金多聲讀若擲一曰若詩曰侈兮之移同臣鍇按爾雅鬵鉹也注涼州呼曰鉹昌婢反似鐘而頸長從金幵聲賢星反酒器也從金重聲之松反大盆也從金監聲一曰鑒諸也可以取明水于月臣鍇按周禮曰春始治鑒注曰如甀大口鑒諸鏡也一曰石也各摲反似鼎而長足從金喬聲伎昭反陽也從金隊聲臣鍇按周禮司烜民掌以夫遂取明火于曰以鑑取明水于月注云夫遂陽燧也鑒鏡屬也取水者世謂之方諸夕位反溫器也圜直上從金巠聲臣鍇曰所以燠物賢星反瓽也從金嶲聲户迷反鐫也從金隻聲户廓反釡而大口者從金夏聲分副反金屬也從金敄聲莫浮反朝鮮謂釜曰錪從金典聲聽銑反也從金坐聲泉和反銼􅟋也從金羸聲魯戈反器也從金刑聲臣鍇曰鉶羹器也賢星反溫器也從金高聲武王所都鎬在長安西上林苑中字亦如此候抱反溫器也一曰金器從金麀聲讀若奧阿高反溫器也從金兆聲一曰田器臣鍇按詩傳曰錢銑也延朝反酒器也從金象器形徒斗反或省金鐎斗也從金焦聲臣鍇曰史記注刁斗云以銅作鐎器受二升晝炊飯夜擊持行也煎昭反小盆也從金肙聲火玄反鉉也從金建聲一曰車轄其獻反鼎也從金彗聲讀若慧于歲反舉鼎具也從金玄聲易謂之鉉禮謂之冪預顯反可以句鼎耳及爐炭也從金谷聲讀若洛一曰銅屑余足反器也從金熒省聲讀若銑玄經反鐡器也從金韱聲一曰鐫精亷反錠也從金登聲臣鍇按爾雅瓦梪謂之鐙注即膏鐙也臣鍇以此楚辭所謂蘭膏明燭華鐙錯丹增反鐙也從金定聲顛定反鍱也從金集聲牆揖反鏶或從咠鏶也從金産聲一曰平鐡臣鍇曰鮑昭賦云鏟利銅山𥘉簡反鏶也齊謂之鍱從金枼聲臣鍇曰今言鐡葉也亦接反方爐也從金盧聲論孤反圜爐也從金旋聲似戀反器也從金虒聲敵圭反煎膠器也從金虜聲勒古反金飾器口從金口口亦聲臣鍇曰若今金銀􅏢器也懇走反金塗也從金昔聲臣鍇曰詩曰約軧錯衡操各反鉏也從金御聲臣鍇曰鉏猶犬牙也疑舉反或從吾鉏也從金竒聲江淮之間謂釡錡臣鍇曰春秋左傳筐筥錡釡之器注有足曰錡魚倚反郭夜針也從金臿聲丑輒反綦緘也從金木聲臣鍇曰剌余之緘也綦履履底也常出反所以縫也從金咸聲正沈反大針也從金皮聲一日劒而刀裝者臣鍇按春秋左傳曰夾之以鈸杯卑反鋭也從金毚聲岑嵒反印鼻也從金丑聲女有反古文鈕從玉斤斧穿也從金聲臣鍇曰柄孔受柯處六韜曰大柯斧銎長八寸曲恭反鈭錍斧也從金此聲即宜反鈭錍也從金卑聲賔而反小鑿也從金斬斬亦聲昨三反破木鐫也從金雋聲一曰琢石也讀若韯津宣反穿木也從金省聲自莫反臿屬也從金舌聲讀若掞桑欽讀若鎌先亷反臿屬也從金冘聲讀若沈池心反臿金也從金危聲一曰䤥瑩鐡也讀若毁行溝委反河內謂臿頭金也從金敝聲僻噎反銚也古者田器從金戔聲曰庤乃錢鏄一曰貨也自仙反大鈕也從金矍聲俱躍反鈐􅣾大犁也一曰類耜從金今聲勤潛反鈐􅣾也從金隋聲特安反兩刃有木􅧇可以劉草從金發聲讀若撥普末反耜屬也從金蟲省聲杜冬反立薅所用也從金且聲蟬于反耜屬也從金罷聲讀若媯彼移反鍥也從金兼聲力鹽反鎌也從金契聲經節反大鎌也從金召聲鎌或謂之鉊張胤説真遙反穫禾短鎌也從金至聲臣鍇按爾雅曰鑊也知疾反慱壓也從金真聲陟陳反鐵銸也從金占聲一曰膏專鐡鉆敕淹反鉆也從金取聲臣鍇曰猶籋也陟聶反以鐡有所劫束也從金甘聲勒潛反鐡鉗也從金大聲臣鍇按字書在足曰釱笛計反䅮唐也從金居聲釠御反可以綴著物者從金替聲祖堪反鋭也從金隹聲專唯反芒也從金兑聲與歲反籕文鋭從剡鐡杇也從金曼聲臣鍇曰所以泥也役團反鏝或從木臣次立按徐鉉云木部有此重出所以穿也從金贊聲祖半反錯銅鐡也從金慮聲臣鍇曰摩錯之也留御反衡也從金全聲七沿反權十分黍之重從金朱聲臣鍇曰二十四銖為一兩也船區反十銖二十五分之十三也從金寽聲周禮曰重三鋝北方二十兩為鋝録設反鋝也從金爰聲虞書曰罰百鍰户刪反六銖也從金災聲側持反八銖也從金垂聲直垂反三十斤也從金勻聲堅鄰反古文鈞從旬兵車也從金巴聲一曰鐡也司馬法曰晨夜內耙車不奢反鉦也從金蜀聲軍法司馬執鐲臣鍇按周禮注形如小鐘軍行鳴之以為鼓節木渥反鈐釘也從金今聲連丁反鐃也從金正聲似鈴柄中上下通真名反小鉦也從金堯聲軍法卒長執鐃獰交反大鈴也從金睪聲軍法五人為伍五伍為兩兩司馬執鐸騰莫反大鐘謂之鏞從金庸聲與封反大鐘淳于之屬所以應鍾聲也堵以二金樂則鼓鏄應之從金薄聲匹各反方鍾也從金方聲府昌反樂鐘也秋分之音也物種成從金童聲古者垂作鍾之松反鍾或從甬鏄鱗也鍾上橫木上金華也從金專聲一曰田器也詩曰庤乃錢鏄臣鍇曰鍾筍上飾今儀制令所謂慱山也又詩傳曰鏄耨也本泊反鍾聲也從金皇聲詩曰鍾鼓鍠鍠户荒反鐘聲也從金倉聲測彭反繚金聲也從金爭聲測彭反鍾鼓之聲也從金堂聲詩曰擊鼓其鏜吞匡反鎗鍯也從金忽聲一曰大鑿平木者粗中反金聲也從金輕聲讀若春秋傳曰􅚢而乘他車寧反劒鼻也從金覃聲臣鍇按莊子曰周宋以為鐔劒鐔鼻也人握處之下也移金反鏌釾大戟也從金莫聲臣鍇曰又劒名門落反鏌釾也從金牙聲延車反鈹有鐔也從金殺聲臣鍇按嵇康曰鸞翮有時鎩師壞反刀削末銅也從金㶾聲臣鍇曰削音肖刀匣也片妖反鋋也從金及聲臣鍇曰鈒戟也飾吸反小矛也從金延聲示川反從侍臣所執兵從金允聲周書曰冕執鈗與凖反短矛也從金它聲臣鍇曰今又音蛇晉書曰丈八匜矛左右盤亦牙反矛也從金從聲取蚣反鏦或從彖長矛也從金炎聲讀若老𥅆杜南反兵專也從金聲甫蛩反矛戟祕下銅鐏從金聲詩曰厹矛沃臣鍇曰祕柄也得昏反祕下銅也從金尊聲徂寸反弩眉也從金翏聲一曰黃金之美者里由反甲也從金豈聲苦蓋反鎧也從金于聲臣鍇曰管子曰桓公方田弛弓脫釪公羊曰而鋟其版侯旿反錏煆頸鎧也從金亞聲歐瓜反錏煆也從金假聲痕加反車軸鐡也從金間聲臣鍇按釋名曰鐧間也間釭軸之間使不相摩也溝鴈反車轂中鐡也從金工聲君聰反車結也從金折聲讀若誓一曰銅生五色時制反乘輿馬頭上防釳插以翟尾鐡翮象角所以防羅去之也從金氣聲疑瑟反莝斫刀也從金夫聲甫殳反人君車四馬鑣八鑾鈴象鵉鳥之聲和即敬也從金鸞省聲臣鍇按古今注竹朱鳥口銜鈴禮所謂行前朱雀也臣鍇以為行步中度則聲和也魯剜反車鑾聲也從金戉聲詩曰鑾聲鉞鉞臣鍇曰戊即古之斧鉞字今皆用此鉞虎會反馬頭飾也從金陽聲詩曰鉤膺鏤鐊一曰鍱車輪鐡也臣鍇按刻金華當馬額也淮南子曰煆鐊文鐃乍晦明猶良反馬勒口中也從金行銜者行馬者也臣鍇曰馬銜所以制馬之行也會意侯彡反馬銜也從金麃聲彼消反鑣或從角組帶鐡也從金劫聲讀若劫居怯反羊箠也端有鐡從金執聲讀若至弘利反鉤魚也從金勺聲的糶反鋃鐺鎖也從金良聲勒當反鋃鐺也從金當聲得郎反大鎖也一環貫二者從金每聲詩曰盧重鋂莫堆反銀鑸不平也從金畏聲塢賄反不平也從金壘聲落浼反怒戰也從金氣聲春秋傳曰諸侯敵王所鎎許意反箸門鋪首也從金甫聲噴摸反所以鈎門户樞一曰治户器也從金巽聲七沿反扠取也從金少聲側嘲反以金有所冒也從金沓聲他合反斷也從金􅡜聲古獺反􅚎也從金各聲勒託反伐擊也從金亶聲旨闡反利也從金族聲作木反剌也從金夫聲縈節反利也從金欶聲色透反殺也從金留聲臣鍇按春秋左傳虔劉我邊垂本此字里由反業也賈人占錉從金昏聲臣鍇曰謂使自隱度其家之所有也史記曰楊可方為告緍眉均反大剛也從金巨聲臣平也象二千對構上平也几幵之屬皆從幵臣鍇曰幵但象物平也無音義激賢反
