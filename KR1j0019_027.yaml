body:
  text: 文一挹取也象形中有實與包同意凡勺之屬皆從勺臣鍇曰禮曰今夫水一勺之多少也真若反賜豫也一勺為與此即與同臣鍇曰不患少而患不均故從一勺尹汝反文二踞几也象形周禮五几玉几雕几形几髹凡素几凡几之屬皆從几臣鍇曰人所憑坐几也謹美反依几也從几從任周書曰憑玉几讀若馮臣鍇曰會意皮凌反處也從尸得几而止也孝經曰仲尼凥間凥如此臣鍇曰會意九魚反止也從夂得几而止臣鍇按詩曰爰居爰處以為居者定居處者暫止而已會意嗔佇反處或從虍聲文四重一薦也從凡足有二橫一其下地凡且之屬皆從且七賈反古文臣為且又以為凡字禮俎也從半肉在且上臣鍇曰指事側所反旦往也從且豦聲昨怒反文三重二斫木斧也象形凡斤之屬皆從斤臣鍇曰尸象木也幾欣反斫也從斤父聲浮甫反方銎斧也從斤爿聲詩曰又缺我斨倩常反擊也從斤石聲真若反斫也從斤句聲臣鍇按爾雅劬斸謂之注鉏屬羣吁反斫也從斤屬聲輟蜀反斫也從斤聲輟角反臣次立曰徒斗切非聲又按徐鉉曰器也斤以斫之斫或從丮晝劑也從金從斤宜謹反伐木聲也從斤户聲詩曰伐木所所師阻反析也從斤其聲詩曰斧以斯之息移反斬也從斤昔聲臣鍇曰尚書曰斫朝涉之脛側削反截也從斤􅓟􅓟古文絶字都件反古文斷從古文叀周書曰猗無他技亦古文斷柯擊也從斤良聲勒可反取木也從斤亲聲息鄰反二斤也闕臣次立按説文曰從二斤語斤切文十五重三十升也象形有柄凡斗之屬皆從斗都厚反十斗也從斗角聲胡谷反玉爵也夏曰盞殷曰斝周曰爵從斗門象形吅也爵同意或説斝表六升臣鍇曰然則如亦象形也格雅反量也從米在斗中讀若遼梨桃反量也從斗臾聲周禮曰求三庾臣鍇曰周禮考工記之言注曰未聞勻取反蟸柄也從斗斡聲楊雄杜林説皆以為軺車輪斡臣鍇曰蟸所以㧒也烏末反羹斗也從斗鬼聲臣鍇曰謂斗杓為魁柄為摽也庫摧反平斗斛量也從斗冓聲臣鍇曰斠量之今作較江嶽反勻也從斗甚聲止沈反杼也從斗余聲讀若荼似車反挹也從斗奭聲臣鍇按張衡思玄賦曰㪺白水為漿卷朱反量物分半也從斗半亦聲脯漫反量物溢也從斗旁聲破郎反杼滿也從斗􅒋聲俱戀反相易物俱等為從斗蜀聲昌六反斛旁有從斗庣聲一曰突也曰􅳍利也爾雅曰􅳍謂之疀古田器也臣鍇按漢書量其旁有􅳍注耳也周禮耳三寸實一升爾雅所謂􅳍今俗作鍬字土雕反十籥也從升亦象形失稱反文十七臣次立曰今文十六輔遺斣一字酋矛也建于兵車長二文象形凡矛之屬皆從矛臣鍇曰鉤兵也酋矛長牙也矛也其上所注旄屬建者邪迆立之也周禮酋矛常有四尺十六尺為常也莫浮反古文矛從戈矛屬也從矛良聲勒當反矛屬也從矛昔聲讀若苲臣鍇按史記曰矠魚鱉測索反矛柄也從矛今聲臣鍇按史記曰鉏耰棘矜機仍反刺也從矛曰聲女有反矛屬從矛害聲恆夬反文六重一輿輪之揔名也夏后時奚仲所作象形凡車之屬皆從車臣鍇按周禮曰一器而工聚者惟車為多山海經番禺生奚仲奚仲生吉光吉光是始以木為車注云父子共作也稱椰反籕文車曲輈轓事也從車干聲臣鍇曰載物則直輈軒大夫以上車也􅙲兩旁壁也欣元反軿車前衣車後也從車災聲臣鍇曰所謂庫車側持反輶車也從車并聲頻寧反卧車也從車昷聲塢門反卧車也從車京聲柳昌反小車也從車召聲延朝反輕車也從車巠聲牽并反輕車也從車酋聲詩曰輶車鑾鑣延秋反兵車也從車朋聲臣鍇曰史記曰淮南王造輣車部行反兵車也從車屯聲徒論反陷􅞽車也從車童聲臣鍇曰臨衝間間衝假借未重反兵高車加巢以望敵也從車巢聲春秋傳曰楚子登轈車事交反車和輯也從車咠聲牆揖反車輿也從車聲臣鍇按輿車底也以虛反衣車蓋也從車曼聲悶半反車軾前也從車凡聲周禮曰立當前軌浮檻反車前也從車式聲臣鍇按周禮兵車軾高三尺三寸人所憑也申力反車軨前橫木也從車各聲臣鍇曰史記婁敬脫挽輅勒妬反臣次立按徐鉉云各非聲當從路省車輢上曲銅也從車爻聲臣鍇按古今注車較車耳也在車輦上重起如牛魚詩曰猗重較兮江嶽反車耳反出也從車反聲府晚反車橫也從車對聲周禮曰參分軹圍去一以為轛圍臣鍇按周禮注軾之植者衡者又曰車軨輿立者為轛橫者為軹轛以其向人為名追類反車旁也從車竒聲于綺反車兩輢也從車耴聲陟聶反車約輴也從車川聲周禮曰孤乘夏輴一曰下棺車曰輴臣鍇曰約謂為節約刻飾之也今人俗作軔丑巡反車籍交錯也從車嗇聲臣鍇按枚乘七發曰中若結轖踈憶反車轖間橫木也從車令聲連丁反司馬相如軨從霝軺車前橫木也讀若羣從車君聲一曰讀若禈愚藴反車後橫木也從車鬒聲支引反車伏兔也從車菐聲周禮曰加軫與轐焉已伏反車伏兔下革也從車聲古文昏字讀若閔眉引反持輪也從車由聲陳六反臣次立按説文引徐鉉曰當從胄省車軸縛也從車聲易曰車脫方菊反車韌也從車柔聲臣鍇曰車輪外罔木一曰牙一曰渠如紂反輻所湊也從車聲孤速反車輮規也一曰一輪車從車熒省聲讀若煢蔡名反有輻曰輪無輻曰輇從車侖聲吕辰反轂齊等貌也從車昆聲周禮曰望真轂欲其輥孤損反長轂軝也以朱約之從車氐聲詩曰約軧錯衡翹移反軝或從革車輪小穿也從車只聲真彼反車軸專也從車象叀之形杜林説臣鍇曰指事于歲反叀或作彗輪轑也從車畐聲方菊反車輨也從車大聲笛計反轂專錔也從車官聲古碗反輈也從車袁聲羽元反轅也從車舟聲陟求反籕文輈直轅車也從車具聲臣鍇曰載物之車俱燭反車轅專特衡者從車元聲臣鍇曰重縛在衡上也元伐反轅前也從車厄聲晏索反軛軥也從車軍聲户昆反軛下曲也從車句聲臣鍇按春秋左傳射其下兩軥而還格漚反車衡載轡者從車義聲臣鍇曰爾雅軛上鐶轡所貫也研之反轙或從金獻臣鍇按爾雅鏕謂之钀載轡謂之轙然則钀與轙異疑此説文本脫誤春秋傳曰輔車相依從車甫聲人頰車也浮甫反驂馬內轡繫軧前者從車內聲詩曰鋈以觼軜奴合反蓋弓也一曰輻也從車聲臣鍇曰車椽也乘車二十八勒抱反車搖也從車從衒省聲古縣反軺車後登也從車承聲讀若易拯馬之拯臣鍇曰從後上也視澄反乘也從車􅥘聲則代反圜圍也四千人為軍從包省從車軍兵車也俱勳反範軷也從車范省聲讀與犯同浮檻反出將有事于道必先告其神立壇四通樹茅以依神為軷既祭犯轢牲而行為範軷從車友聲詩曰取羝以軷彭札反載高貌也從車獻聲臣鍇曰何晏景福殿賦曰反宇䡾䡾顔遏反車聲也從車害聲一曰轄鍵也間刮反還也從車專聲智箭反委輸也從車俞聲臣鍇曰以車委輸也施迂反重也從車周聲隻留反若軍發車百兩為輩從車非聲輔配反􅱢也從車乙聲尼戞反轢也從車􅭋聲尼展反車所踐也從車樂聲連的反車徹也從車元聲臣鍇曰古車徹從車也俱皮反車迹也從車從省臣鍇曰今俗作蹤子龍反車相出也從車失聲臣鍇按春秋左傳懼其侵軼我也移七反車䡩聲也從車真聲讀若論語鏗爾舍瑟而作一曰讀若掔若間反抵也從車執聲臣鍇曰潘嶽曰如如軒軒舉也涉利反車戻也從車匡聲倦臣反礙車也從車刃聲臣鍇曰止輪之轉其物名軔楊雄賦曰車不安軔爾吝反車小缺復合者也從車叕聲誅劣反臣次立按徐鉉曰門部輟與罬同此重出礙也從車多聲溪你反車轄相擊也從車毄毄亦聲周禮曰舟輿轚玄者也已惠反治車軸也從車聲率眷反接軸車也從車可聲可貨反車堅也從車殸聲􅛮耕反反推車今有所付者從車付讀若胥臣鍇按春秋後語鬼谷子曰牽受推軵儀不如秦也乳恕反藩車下􅋻輪也從車全聲讀若饌一曰無輻也臣鍇曰無輻謂直斫木為之若推輪乎丑旬反大車轅專持衡者也從車兒聲臣鍇曰論語所謂大車無輗擬西反輗或從宜輗又從木大車後也從車氐聲的米反大車簀也從車秦聲讀若臻側詵反淮陽名車穹隆轒從車賁聲臣鍇按六韜曰大攻城圍邑則有轒䡝臨衝䡝作輼扶云反大車後壓也從車宛聲迂分反大車駕馬也從車共聲俱燭反連車也一曰卻車抵堂為從車從差省聲讀若遲臣鍇按春秋左傳曰車鮑點車官名士佳反挽車也從車㚘在車前引之也里典反引車也從車免聲武反反紡車也從車聲讀若狂一曰一輪車也倦匡反車裂人也從車睘聲春秋傳曰轘諸栗門户刪反臣次立按徐鉉曰睘音渠營切非聲當從環省截也從車斤斬法車裂側減反喪車忍從車而聲忍伊反羣事聲從三車臣鍇曰會意昏耕反文九十九重八臣次立曰今重六輔遺棿二字説文解字通釋卷苐二十七
