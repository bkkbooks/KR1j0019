body:
  text: 繫傳七文林郎守祕書省校書郎臣徐鍇傳釋朝散大夫行祕書省校書郎臣朱翺反切三十五部文六百四十重百十二舉目使人也從攴目凡􅡚之屬皆從􅡚讀若臣鍇曰支止也隳恱反營求也從􅡚人在穴中商書高宗寢得説使百工營求得之傳巖巖穴也臣鍇曰人與目隔穴與人字也目經營而見之然後指使人求之也攴所以指畫也營經營也臣以為高宗見湯得伊尹於負鼎又見朝士無可類此者乃使百工處處營求果得之於傳巖也尚書作營翾正反低目視也從􅡚門聲弘農胡縣有闅鄉汝南西乎有闅亭無云反大視也從大􅡚聲讀若齤衢貟反文四人目也象形重童子也凡目之屬皆從目莫叔反古文目目也從目㫐聲儒盞反兒𥘉生瞥者從目睘聲讀若告之謂調臣鍇曰請轉目視人也靈光殿賦曰目䁵轉而意迷邦見反目無常主也從目玄聲臣鍇曰目眩眩也回茜反目匡也從目此聲寂帝反目旁毛也從目夾聲臣鍇曰史云離婁不見目睫者也節攝反盧童子也從目縣聲臣鍇曰盧黑也眼中黑子也楊雄甘泉賦曰玉女無所眺其清盧是也預犬反目童子精瞦也從目喜聲讀若爾雅禧福軒其反目旁薄緻從宀宀也從目聲臣鍇按楚辭曰靡顔膩理遺視矏矏今人云眼臉單也名連反大目也從目非聲甫肥反大目也從目臤聲侯産反大目也從目旱聲臣鍇按春秋左傳曰睅其目注云睅出目也户版反睅或從完大目也從目爰聲呼逺反平目也從目㒼聲臣鍇曰目臉低也魏武小名瞞沒團反大目出也從目軍聲工鈍反目矕矕也從目􅒋聲武版反目大也從目侖聲春秋傳有鄭伯㫻孤損反詩曰美目盻兮從目分聲臣鍇曰目好流視也鋪幻反多白也從目干聲臣鍇曰張目也根旱反多白眼也從目反聲春秋傳曰鄭遊眅字子明臣鍇按周易曰巽為多白眼潘蠻反出目也從目見聲臣鍇曰詩云睍睆黃鳥易顯反目多精也從目雚聲益州謂瞋目曰矔古翰反目精也從目粦聲臣鍇曰左思吳都賦曰鷹瞵鶚視里神反深目也從穴中目臣鍇曰會意也倚了反目少精也從目毛聲虞書字從此臣鍇曰古書耄字多作此手抱反目無精直視也從目黨聲臣鍇曰莾黨然也他朗反暫視貌從目炎聲若白蓋謂之苫相似臣鍇按郭璞江賦獱獺睒瞲干厱空收儼反吳楚謂瞋目顧視曰眮從目同聲頭貢反直視也從目必聲讀若詩葵名反視而止也從目亶聲旨闡反目冥逺視也從目勿聲一曰久也一曰且明也莫隊反目有所恨而止也從目鬒聲臣鍇按爾雅云眕重也目厚意也支允反􅕉也從目爂聲臣鍇曰微視之也匹妙反察也從目祭聲臣鍇曰左思魏都賦曰有􅕉吕染言下視吕梁也刺細反見也從目者聲得古反古文睹從見目相及也從目隸省聲讀若與隸同也道合反目不相聽也從目癸聲臣鍇按易睽卦曰二女同居其忠不相得彎圭反望也從目希聲海岱之間謂眄曰睎臣鍇曰班固西都賦曰睎秦嶺大凡睎望字皆當如此欣祈反目不明從目末聲門撥反轉目視也從目般聲别安反小兒白眼也從目辡聲鋪患反目則視也從目􅏨聲臣鍇曰謂目略視之也古詩曰盈盈一水間眽眽不得語也莫獲反目睞謹也從目録聲讀若鹿盧木反眄也從目各聲勒託反失意視也從目修聲臣鍇曰左思魏都賦曰焉失所他狄反謹鈍目也從目􅙯聲朱順反目動也從目閠聲然勻反恨張目也從目賔聲詩曰國步斯矉婢民反目無明也從目卯聲讀若委臣鍇按春秋左傳曰目於眢井蓋為隱語也言井無水若目無精也眢之九反仰目也從目隹聲臣鍇曰睢眄也又梁宋水名許惟反目搖也從目勻省聲回茜反旬或從目旬臣鍇按史記項梁眴籍曰可行矣謂動目私視之也大視也從目蒦聲臣鍇曰驚視也吁醵反目順也從目坴聲一曰敬和也臣鍇曰通論詳矣莫叔反嬿殷典反短深目貌也從目取聲烏未反顧也從目聲詩曰乃眷西顧便俱反察也從目叔聲一曰目病也得酷反睎也從手下目臣鍇曰以手翳目而望也宋玉賦曰若姣姬楊𬒮鄣目而望所思此會意刻干反看或從倝臣鍇曰倝聲也深視也一曰下視也又竊見也從目覃聲臣鍇按春秋左傳晉有狼瞫施甚反長眙也從目寧聲一曰張眼臣鍇曰長久也楚辭曰思美人兮涕而眝陟臣反坐寐也從目垂聲時位反翕目也從目冥冥亦聲臣揩按尚書曰若藥弗瞑眩謂藥若毒使人目閉而瞑眩之也民甹反目病生翳也從目生聲臣鍇按春秋左傳曰日月之眚謂日月有蝕若月有翳也息永反過目也又目翳也從目敝聲一曰財見也臣鍇曰瞥然暫見也僻列反目傷眥也從目多聲一曰瞢兜臣鍇曰瞢兜目汁疑也今人言眼兜眵齒離反目眵也從目蔑省聲臣鍇按宋玉風賦曰中為眕得目為名噎反睊也從目夬聲臣鍇曰目美也鵙穴反目病也從目良聲力上反目不明也從目未聲臣鍇按春秋左傳吳子夷昧亡貝反戴目也從目間聲江淮之間謂視曰瞷臣鍇曰戴目目望陽也視古視字候間反草入目中也從目米聲臣鍇按吕氏春秋瞽師之愛子也不免枕之以粳眯之也名洗反目不正從目兆聲臣鍇曰潘嶽射雉賦曰目不步體哀眺旁剔惕弔反目童子不正也從目來聲臣鍇日眄睞睞者目光聲也勤菜反眣也從目攸聲臣鍇曰修自失也尹修反修或從丩臣鍇曰斗聲目不從正也從目失聲臣鍇曰其視散若有所失也暘七反童蒙也從目蒙聲一曰不明也臣鍇按周禮樂師有瞽矇目不明者於聽聲審也母東反一目小也從目少亦聲臣鍇曰會意彌少反目偏合也從目丏聲一曰邪視也秦語臣鍇曰楚辭曰滿堂兮美人忽獨與余兮目成弭釧反目無眸子從目亡聲泛彭反目陷也從目咸聲刻洽反目但有朕也從目鼓聲臣鍇按説尚書者言目漫若鼓反也朕但有黑子外微黑影而已昆覩反無目也從目叟聲蘇后切惑也從目榮省聲臣鍇按史記曰朝營或天子玄經反目小也從目坐聲泉和反棺目也從目叉聲臣鍇曰棺槄也又音晚字烏未反目小哀視也從目弟聲南楚謂眄睇臣鍇按班固幽通賦曰養流睇而猿號苗計反開闔目數搖也從目寅聲臣鍇曰目也失閠反直視也從目台聲臣鍇曰視不移也靈光殿賦序曰覩斯而胎敕餌反恨視也從目兮聲臣鍇曰漢西京有盻胃殿異契反目不明也從目弗聲普未反文一百十三重九左右視也從二目几瞿之屬皆從瞿讀若拘又若良士瞿瞿九遇反目圍也從瞿讀若書卷之卷古文以為􅌤臣鍇曰翳目也字從此俱便反目邪也從瞿從大大人也臣鍇曰字從此卷子反俱辭也從比從白臣鍇曰比皆也會意古諧反鈍詞也從白鮺省聲論語曰參也魯臣鍇曰劉熙釋名曰魯國多山水民性朴鈍勒古反别事詞也從白聲古文旅臣鍇曰凡文有者字者所以為分别隔異也煮也反詞也從白􅴣聲虞書曰帝曰咨陳收反識詞也從白亐知臣鍇曰亐亦氣也此會意展避反古文十十也從一白數十百為一貫相章也臣鍇曰百亦成數故云一貫以詩言之為一章也會意慱陌反古文百文七重三引氣自卑也從自從卑凡鼻之屬皆從鼻臣鍇曰卑與也助也會意頻至反也尾長從羽從隹臣鍇曰古謂雉為翟故尚書曰羽畎夏翟注漢書有言翟方進姓本音狄後人姓乃音澤也田溺反赤羽雀也從羽非聲出鬱林臣鍇按左思吳都賦翡翠列巢以重行符既反青羽雀也出鬱林從羽卒聲臣鍇按爾雅翠雛也注似燕漢書南越王獻翠為干此醉反羽生也一曰羽從羽前聲子善反頸毛也從羽公聲臣鍇曰爾雅多謂草華莖細葉叢出為翁臺取名於此也又謂老人為老翁言其頸毛白而強短若此鳥頸也鳥公反翼也從羽支聲叱智反翅或從羽氏趐也從羽革聲溝厄反尾長毛也從羽堯聲臣鍇按班固西都賦曰發皓羽兮奮翹英尾毛光華也岐遙反羽本也從羽侯聲一曰羽初生河溝反羽莖也從羽鬲聲臣鍇按史晉船人曰鳥所恃者六翮也間隔反羽曲也從羽句聲犀吁反羽之風亦古諸侯也一曰射師從羽幵臣鍇曰猶翳也古有窮之君名一曰帝嚳射官五計反飛舉也從羽者聲只庶反起也從羽合聲臣鍇曰相合起也希立反小飛也從羽睘聲臣鍇曰文子云翾飛蠕動或作蜎虛全反大飛也從羽軍聲一曰伊雒而南雉五采皆備曰翬詩曰有翬斯飛大韋反高飛也從羽鬒臣鍇曰鬒新生羽而飛也長羽短羽相副然後能高飛也會意良秀反疾飛也從羽扁聲臣鍇曰魏文帝書云元瑜書記翩翩言疾速也僻連反捷也飛之疾從羽夾聲讀告歰一曰俠也山洽反飛貌也從羽立聲臣鍇曰今言輔翊猶翼戴也以即反飛盛貌也從羽曰聲臣鍇曰盛也會意踏從此他榼反秩海雉如雉而黑在海中山上翟山雉長尾雗雉鵫雉併之臣以為雗雉今白雉􆁝白翬雉屬白質五采皆備成章毛色光鮮搖青質五采皆備成章也􅴣音儔已下皆四方雉名臣鍇以為雉豸豸然介直貌也陳匕反古文雉從弟雌雉鳴也雷始動雉鳴而鴝其頸從隹句句亦聲臣鍇曰禮月令曰雉始雊格漚反知時畜也從隹奚聲臣鍇曰以為雞稽也能考時也古兮反籕文雞從鳥雞子也從隹芻聲臣鍇曰雛猶云𥘉也善于反籕文雛從鳥天鸙也從隹翏聲一曰雉之莫子為雡臣鍇按爾雅注鷚天鸙雀色似鶉好髙飛作聲雉之莫子晚生者也良秀反黃蒼庚也鳴則蠶生從隹離聲臣鍇按爾雅注即楚雀又名商庚古有九雇官夏雇其一蔡雍曰夏雇趣民蠶麥爾雅雇竊玄此云雡纍而黃疑之此即夏雇鄰之反鷻也從隹周聲臣鍇按詩曰匪鷻匪鳶翰飛戾天注云鷻之雕也覩姚反籕文雕從鳥鳥也從隹瘖省聲或從人人亦聲臣鍇曰鷹隨人所指蹤故從人倚氷反籕文從鳥也從隹氏聲臣鍇曰今俗猶呼為鷂嗔肌反籕文鴟從鳥鴟也從隹垂聲時位反石鳥一名雍渠一曰精列從隹幵聲春秋傳秦有士雅臣鍇曰爾雅即雍渠雀屬飛則鳴行則搖士雅人姓名也棄妍反雍渠也從隹雍聲宛封反鳥也從隹今聲春秋傳有公子若鴒臣鍇曰若鴒宋人也勤潛反鳥也從隹從人廠聲讀若鴈臣鍇按春秋後語楚有昭雁迎諌反黃也從隹黎聲一曰楚雀也其色黎黑而黃臣鍇曰即離黃也里西反鳥也從崔虍聲臣鍇曰虧字從此虎鳥反牟母也從隹奴聲臣鍇按爾雅䳺也青州呼鴾母熱除反或從鳥九雇農桑候鳥扈民不媱者也從隹户聲春雇鳻盾夏雇竊玄秋雇竊藍冬雇竊黃棘雇竊丹行雇唶唶宵雇嘖嘖桑雇竊脂老雇鷃鷃臣鍇按春秋左傳帝少昊以鳥名官故有九雇雇扈也扈止也故云雇民不娷娷過時也蔡雍獨斷春扈氏趣民耕種夏扈氏趣民藝除秋扈氏趣民收斂冬扈氏趣民蓋藏棘扈氏掌民百果行扈氏晝為民驅鳥宵扈氏夜為民驅獸桑扈氏趣民養蠶老扈氏趣民收麥唶音借嘖音仕䇿反臣鍇以為竊猶淺也桓土反籕文雇從鳥雇或從雩䳺屬也從隹􅙯聲是倫反屬也從隹酓聲思甘反籕文䨄從鳥鳥也從隹支聲一曰䧴度臣鍇按漢西京有䧴鵲觀䧴度猶今言度支也章移反鳥肥大􅭐􅭐從隹工聲貟聰反􅭐或從鳥􅌳也從隹􅤖聲一曰飛􅤖也臣鍇曰繒􅌳以取鳥也􅤖音散四旦反􅌳射飛鳥也從隹弋聲臣鍇曰管子曰田獵畢弋今作弋以即反鳥父也從隹肱聲于戎反鳥母也從隹此聲千思反覆鳥令不飛走也從网隹讀者到臣鍇曰罩猶罩也吒孝反肥肉也從弓所以射隹長沙有下雋縣臣鍇按楚辭鵠酸臇鳬煎鴻鶬蒯通著書號雋永言其説有味而長也下雋縣今鄂州唐年縣也自𥚹反飛也從隹隓聲式垂反文三十九重十二鳥張毛羽自奮從大隹凡奎之屬皆從奎讀若睢臣鍇曰大張大貌也指事思振反蒦或從尋尋亦度也楚辭曰求矩彠之所同小爵也從萑吅聲詩曰雚鳴于垤臣鍇曰今俗作鸛古翰反鴟舊留也從萑臼聲臣鍇曰即怪鴟也今借為新舊字其救反舊或從鳥休聲文四重二羊角也象形凡􅘲之屬皆從􅘲讀若友買反戾也從􅘲而兆兆古文别臣鍇曰兆重八也骨排反相當也闕讀若宀臣鍇曰繭字從此沒團反文三目不正也從􅘲從目凡首之屬皆從首莧從此讀若不臣鍇曰􅘲角戾也此會意名噎反目不明也從首從旬旬目數搖也臣鍇曰會意木空反大不明也從苜火苜亦聲周書曰布重席織蒻席也讀與蔑同臣鍇曰會意今尚書作蔑名噎反勞目無猜也從苜人勞則蔑然從戍臣鍇曰會意名噎反文四祥也從􅘲象四足尾之形孔子曰牛羊之字以形舉也凡羊之屬皆從羊臣鍇曰説禮者云羊吉祥也猶臭反黑羝羊朱反夏羊牡曰羖從羊殳聲昆覩反羊羖犗也從羊曷聲臣鍇曰羊形也鳩歇反騬羊也從羊夷聲徐姊切黃腹羊也從羊從畨聲臣鍇按爾雅曰羳羊黃腹也復喧反羊名也從羊巠聲懇耕反羊名也從羊執聲汝南與有摯亭讀若晉子印反瘦也從羊羸聲臣鍇曰六畜之中駿馬多瘦牛亦瘦狗亦細形雞之瘦不至於劣唯羊瘦則羸也逹垂反羊相積也從羊委聲臣鍇曰羊性好䍴也藴瑞反䍴也從羊責聲替寄反輩也從羊君聲臣鍇曰羊性好羣居也具分反羣羊相也一曰黑羊也從羊垔聲鳥間反羊名􅕭皮可以割黍從羊此聲臣鍇曰言皮利也千思反甘也從羊大羊在六畜主給膳也美與善同臣鍇曰羊取大者也羊美物也故以為摯會意免鄙反西戎從羊人也從人從羊羊亦聲南方蠻閩從蟲北方狄從犬東方貉從豸西方羌從羊此六種也西南𤏡人僬僥從人蓋在坤地頗有順理之性惟東夷從大大人也夷俗仁仁者夀有君子不死之國孔子曰道不行欲之九夷秉桴浮於海以也臣鍇曰東方行方也會意立香反古文羌如此追善也從羊久聲文王拘羑里在湯隂臣鍇曰若言誘善也慱物志曰殷名獄曰羑里湯隂在毫州夷酒反文二十六重二羊臭也從三羊也凡羶之屬皆從羶相則臭禮月令曰其臭羶會意賖延反方反鶻鳩也從鳥九聲飢酬反鶌鳩也從鳥屈聲臣鍇按爾雅注似山鵲而小短尾多聲居屈反祝鳩也從鳥佳聲古滑反隼或從隹二曰鶉字臣鍇曰執之也鶻鳩也從鳥骨聲古忽反鶻鵃也從鳥舟聲陟牛反桔鷨尸鳩從鳥聲臣鍇按爾雅注布榖也堅祝反鳩屬也從鳥合聲茍合反渴鴠也從鳥旦聲臣鍇按詩曰相彼鳱鴠尚或惡之夜鳴急旦也兜散反伯勞也從鳥臭聲臣鍇按鵙伯趙氏司至者也涓寂反鵙或從隹天鸙也從鳥翏聲良秀反卑居也從鳥與聲臣鍇按爾雅曰􅢟斯也玄遇反雗鷽山鵲知來事鳥也從鳥學省聲臣鍇按爾雅注曰似鵲有文采尾長觜短赤西京雜記陸賈曰干鵲噪行人至即此也臣鍇以為亦猶猩猩知人往事也禮射鳱鵠即此也了卓反鷽或從隹鳥黑色多子師曠曰南方有鳥名曰羌鷲黃頭赤目五色皆備從鳥就聲絶僦反鴟梟寧鳺也從鳥號聲臣鍇按爾雅注鴟屬詩曰占彼飛梟集于泮林食我桑椹懷我好音然則梟惡聲鳥也尤嬌反寧鳺也從鳥夬聲古穴切鳥也從鳥祟聲相聿反澤虞也從鳥方聲臣鍇按爾雅注涸澤鳥也似水雞倉黑常在澤中有象主守之官故名澤虞分敞反鳥也從鳥􅎒聲姊薛反鳥也從鳥聲秋日反鋪鼓也從鳥失聲臣鍇按爾雅鳺鋪鼓注未詳亭結反鶤雞也從鳥軍聲讀若運臣鍇按楚辭曰鶤雞嘲􅑜而悲鳴爾雅雞五尺為鶤古論反鳥也從鳥芙聲晏考反鳥也從鳥臼聲俱燭反鷦􅛯桃蟲也從從鳥焦聲臣鍇按爾雅桃蟲鷦其䳄鴱注云鷦􅛯雀俗呼為巧婦詩云肇凡彼桃蟲拚飛維鳥注云始小終大之鳥也煎昭反鷦􅛯也從鳥眇聲彌小反鳥少美長醜為鶹離從鳥留聲臣鍇按爾雅少美長醜為鶹鷅詩曰瑣兮尾兮留離之子里求反鳥也從鳥堇聲能闌反􅴥或從隹臣鍇曰借為難易之難古文􅴥古文􅴥古文􅴥欺老也從鳥彖聲臣鍇按爾雅鶀老鴒鶨俗呼為癡焦丑縜反鳥也從鳥兊聲與缺反鳥也從鳥主聲土偶反鳥也從鳥昏聲眉勻反刀鷯剖葦食其中蟲從鳥燎聲臣鍇按爾雅一名剖葦食其中蟲江東呼盧虎虎褲蟲衣也分昭反鳥也其雌皇從鳥匽聲一曰鳯凰也臣鍇按爾雅注即鳯一名依逺反暝鴲也從鳥旨聲真夷反鳥鸔也從鳥各聲臣鍇按爾雅注水鳥似鶂而短頸腹趐紫白背上緑色勒記反鳥鸔也從鳥暴聲已伏反鳴九臯聲聞于天從鳥寉聲臣鍇按爾雅鶴鳴九臯聲聞于天臯澤也自外數之有九言幽逺也間博反白鷺也從鳥路聲勤姑反鴻鵠也從鳥告聲胡僕反鴻鵠也從鳥江聲貟聰反秃也從鳥叔聲七牛反臣次立按説文徐鉉曰叔非聲又按叔行反豆也字義不通疑從秋省乃得聲叔傳寫禾之誤也下文鶖即不省於義可見或從秋鴛鴦也從鳥卯聲迂言反鴛鴦也從鳥央聲殷光反鵽鳩也從鳥叕聲臣鍇按爾雅鵽鳩冠雉注大如鴿似䳄雉鼠腳無後趾歧尾為鳥憨急羣飛出北方沙漢誅貀反鴚鵝也從鳥可聲臣鍇按子虗鵖鴒戴鵀注云即戴勝也其輒反鴔鵖也從鳥皂聲皮及反鳥也肉出尺胾從鳥聲臣鍇按鴇虎文無後趾大如鴈詩云肅肅鴇羽胾臠也言大也輔老反鴇或從包􅖥也從鳥渠聲巨居反水梟也從鳥區聲殷婁反鳥也從鳥友聲讀若撥臣鍇按郭璞江賦鷗䳁注曰䳁似鳬蒲特反鳥也從鳥庸聲臣鍇按字書渠似鳬一名水雞與封反鳥也從鳥兒聲春秋傳曰鶂退飛臣鍇按字書鶂水鳥一曰鷁一身九頭倪激反鶂或從鬲司馬相如説鶂從赤鵜胡汚澤也從鳥夷聲敵反鵜或從弟天狗也從鳥立聲臣鍇按爾雅注小鳥色青似翠食魚江東呼為水狗里汲反麋鴰也從鳥倉聲臣鍇按爾雅注今呼鶬鴰切陽反鶬或從隹麋鴰也從鳥􅡜聲古活反鵁􅪦也從鳥交聲一曰鵁鸕也加肴反鵁􅪦也從鳥青聲津貞反鵁􅪦也從鳥幵聲臣鍇按爾雅鳽鶄也激賢反鷀也從鳥一聲臣鍇曰盧鷀也即􅰌鴜乙器反􅰌鴜也從鳥針聲止沉反􅰌鴜也從鳥此聲即冝反雕也從鳥敦聲詩曰匪鷻匪鳶杜酸反鷙鳥也從鳥屰聲與川反鴟也從鳥間聲侯艱反鷙鳥也從鳥䍃聲異召反白鷢玉瞗也從鳥厥聲臣鍇按崔豹古今注似鷹尾上白瞿月反王鴡也從鳥且聲且渠反鸛畐蹂如鵲短尾射之銜矢射人從鳥雚聲臣鍇按爾雅一名􅦀羿呼寬反鷐風也從鳥亶聲臣鍇按爾雅注曰鷂屬也遮延反籕文鸇從㕓鷐風也從鳥晨聲石倫反擊殺鳥也從鳥執聲戰媚反鸇飛貌從鳥穴聲詩曰鴥彼鷐風與必反鳥也從鳥榮省聲詩曰有鶯其羽臣鍇又按詩傳鳥羽文也恩行反鴝鵒也從鳥句聲羣吁反鴝鵒也從鳥谷聲古者鴝鵒不踰泲臣鍇曰泲子禮反水名此周禮文也余足反鵒或從臾隹赤雉也從鳥敝聲周禮曰孤服鷩冕辟舌反鵔鸃鷩也從鳥夋聲蘇徇反鵔鸃也從鳥義聲秦漢之𥘉侍中冠駿鸃冠研之反雉屬戇鳥也從鳥啻聲顛狄反似雉出上黨從鳥曷聲臣鍇按顔之推家訓曰鶡上黨數嘗見之黃黑無駮雜色衡割反鳥似鶡而青出羌中從鳥介聲臣鍇曰家訓又云竇如同自河州得䲸來也苟差反鸚鵡也從鳥嬰聲思行反鸚鵡也從鳥母聲能言鳥也勿撫反走鳴長尾雉也乘輿以為防釳著馬頭上從鳥喬聲臣鍇按蔡雍獨斷釳方數寸以插羽也伎昭反䳄雉鳴也從鳥唯聲詩曰有鷕雉鳴以沼反鼠形飛走且乳之鳥也從鳥畾聲臣鍇曰飛生鼠也柳水反籕文鸓雉肥音者也從鳥倝聲魯郊以丹雞祝曰以斯鶾音赤羽去魯侯之咎臣鍇按禮雞曰翰音侯玩反雇也從鳥安聲臣鍇按爾雅今鴳雀殷訕反毒鳥也從鳥穴聲一名運目臣鍇按鴪食蝮狀如鶚紫黑色一名運曰也直賃反鳥子生哺者從鳥殼聲格漚反鳥聲也從鳥口聲臣鍇曰今會意眉平反飛貌也從鳥寨省聲臣鍇按班固西都賦曰鳯騫翥於棟欣元反鳥聚貌也一曰飛貌也從鳥分聲扶云反蔞鵝也從鳥坴烏字也有連反文三重三説文解字通釋卷第七
