body:
  text: 繫傳三十六文林郎守袐書省校書郎臣徐鍇撰説文之學久矣其説有不可得而詳者通識君子所冝詳而論之楚夏殊音方俗異語六書之內形聲居多其會意之字學者不了鄙近傳寫多妄加聲字篤論之士所宜隱括而李陽氷隨而譏之以為已力不亦誣乎自切韻玉篇之興説文之學湮廢泯沒能省讀者不能二三棄本遂末乃至於此沮誦逾逺許慎不作丗之知者有可以振之可也前代學者所譏文字蓋亦有矣中興書闕不可得盡此蓋作者之冠冕而後來之妄故臣今略記所憶作祛妄篇説文云導禾司馬相如曰導一莖六穗於庖顔之推作家訓云導擇禾也故光武詔曰非徒豫飬導擇之勞是也而説文云導禾名乃引封禪書導一莖六穗於庖犧雙觡共抵之獸為證無妨自當有禾名導非相如所用也禾一莖六穗於庖豈成文乎縱使相如天才鄙拙強為此語則下句當云麟雙觡共抵之獸不得云犧也吾嘗笑許純儒不逹文章之體如此之流不足馮信此皆之推之言也臣鍇以為導訓擇治乃從寸故漢書有導官字不從禾也相如云䆃一莖六穗於庖猶言此禾也則有一莖六穗在庖此犧也則有雙觡共抵之獸雖今之作者對屬之當何以過此况在古乎上句末有於庖字乃云禾一莖六穗於庖下句末有之獸字所以云犧雙觡共抵之獸猶言殺此雙觡共抵之獸交互對之爾若依之推云導擇也則是擇一莖六穗於庖麟雙觡共抵之獸非徒鄙陋乃不成文豈相如之意哉屬對允愜文字相避近自陳隨爾封禪書又云招翠黃乘於沼鬼神接靈囿賔於間館如此者不可勝數豈鄙拙乎陽氷曰弋質也天地既分人生其間皆形質已成故一二三皆從弋臣鍇以為弋之訓質蒼雅未聞既云天地既分人生其間皆形質已成乃從弋則一二之時形質未成何得從弋其謬甚矣説文從屮毒聲陽氷云從屮母出地之盛從土土可制毒非取毒聲毒烏代反臣鍇按顔師古注漢書毒音與毒同是古有此音豈得非聲母何得為出地之盛方説毒而言土可制毒為不類矣説文云斷草籀文從手陽氷云折各異自折人手折之臣鍇按古字令令長長皆同用自毀為壞人毀為壞音怪字亦不異衣服為衣𬒳此衣為衣去聲亦復不殊自折人折何可遽異此為謬矣説文從足各聲臣鍇以為古之音字或與今殊蓋亦不甚切或多聲字可言各者路各别之意陽氷云非各聲從足輅省臣今按周禮車輅字多借路字然則先有路字後有輅字不得云路從輅省也説文云樂竹管以和衆聲從品侖侖理也陽氷云從集册集古集字品象衆竅蓋集衆管如册之形而置竅爾臣鍇按詩左手執籥是籥以和樂也又曰於論鼓鍾注云論倫也品實三口象籥三管於義何害何必妄拆侖字也説文云㨖也倒入一為入二為言稍甚也陽氷云干一為􅥷臣鍇以為㨖稍密深也故云入一為干入二為􅥷二重深也何必須言干一為􅥷欲作何訓乎説文云從􅍫自􅍫交省聲臣鍇曰􅍫持也人身頸腰皆關節要害所以自秉持其身猶竹木之節交要實聲許不言象形此義明了不可強以為形故也陽氷所見為淺近焉説文從又從􅹆闕陽氷云從􅊂􅊂豫也􅹆器也又手也手持器為求之於人人與之也臣鍇以為陽氷之言􅊂音夷以此為與是強名也此義亦疏説文云剝獸謂之皮從又為省聲李云從又持皮襜然臣鍇以為剝獸之皮則又為手以剝皮剝皮所以飾物豈空持之而已萬物皆可以持豈獨皮而持之乎説文云鳥之短尾總名陽氷云鳥之總稱爾雅長尾而從佳知非短尾之稱臣鍇以為本注當言亦總名脫亦一字爾不然者許慎豈如此之疏乎説文叀小謹也從么省􅋄才見􅋄亦聲陽氷云墨斗中形象車軸頭叀墨之形上晝平引不從􅋄也臣鍇以為以叀為墨斗其義無取安得不從􅋄説文小也象子𥘉生之形陽氷云某不公也重某為么蒙昧之象也會意非象形臣鍇按爾雅么幼也直是幼小之稱非為蒙昧陽氷妄矣説文云閡也從叀引而止之陽氷云車前重不前合從車宜上晝平不從􅋄明矣臣鍇以為此則毛詩狼跋其胡載疐其尾字言狼進則躐其胡退則閡其尾凡專謹者事多閡故從叀而引止之疐之名不主於車也陽氷妄矣説文云刃刀之堅利處象有刃之形陽氷曰刀靣曰刃一示其處所也此會意臣鍇以為刃在刀前即是象形縱使以一示其處即為指事非會意也説文曰冬生草陽氷云謂之草非也臣鍇以為竹類於草近於木逺今言草之冬者即當矣若不言冬生草可謂之冬生木乎非木非草復是何物陽氷之妄説文曰豆之豐滿者象形陽氷云山中之乃豐聲也臣鍇以為象豆滿形足矣山是何義乎説文曰血祭所獻也從皿一血也陽氷云從一聲臣鍇以為人身之血無可以象故象血在此但見於器若言一聲則惟有皿在比但見器爾豈關血乎陽氷此義最謬陽氷云象膏澤之氣土象土木為臺氣主火之義會意臣鍇以為鐙火之臺不得言土膏澤下流亦不上出象形非會意説文云叄合也從入一象三合形陽氷云入者合集之義自一而成乎億萬入者集之𥘉故從入從一臣鍇以為集合也故象三合人三為衆衆合乃為集入一爾豈得言集集者象衆集豈言其𥘉陽氷妄矣説文云詞也從矢引省聲矢者取詞之𥘉所之陽氷云蒼頡作字無形象者則取音以為之訓矢引則為矧其類往往而有之矣字是也臣鍇以為周禮六書無形象者莫過聲字則取法於耳又爾字則取象氣散皆有以象之不爾則會意亦虛象也今言矢引為矤在左右皆音六書所未聞六書之中欲附何處若有全以音為字則是七書不得言六書此淺俗之甚説文云從􅋄下象根陽氷云象之形木者五行之一豈取象於卉乎臣鍇案周易云百果草木皆甲坼是草木同言甲坼􅋄甲坼之象合抱之木生於豪末木象於􅋄何足非乎説文云草木之𥘉也從丨貫一將生枝也一地也陽氷曰才木之幹也木體枝上曲今去其枝但有槎枿臣鍇按古人多以此為才始若云材木為良材者將節目盡去豈存其槎枿乎説文曰陽精不虧從口一陽氷云古人正圜象日形其中一點象烏非口一蓋篆籀方其外引其點爾臣鍇云無妨古文自有日中作烏者日中含一不足致譏也説文云禾麥吐穗上平象形陽氷云二物相並乃知齊平臣鍇以為上三物相齊不勞其下更為二字二實地形陽氷妄矣説文云穬粟實也象禾實之形陽氷云象在穗上之形臣鍇以為天降嘉穀一稃二米此象稃穀坼開米出見也米者已去稃裹之名若穗上則粟穀矣陽氷為妄乃臆説説文云張口氣語也象氣從人上出之形陽氷云上象人開口下象氣昨從人所謂欠去許氏擅攺作無所據也臣鍇以為陽氷作蓋按李斯等篆古文多互體雖有從者其下亦是人字且人之欠去氣並上出不下流安得氣在下陽氷在許慎之後所見雖博猶應不及於慎今之所説無乃偏執之論乎説文如此陽氷云當作臣鍇按李斯書實如陽氷所作然陽氷不了其義許慎言其所由李斯小篆所異者少李斯隨事書之筆力微變未足譏評也説文云象卪相合分之形陽氷云􅊟字從卪而生一重為卪二為以三為􅊟臣鍇以為卩自瑞信􅎧自堆堆􅎧不相因也説文從兀從從倒亡陽氷云非倒亡聲倒亡不亡也臣鍇以為説文傳寫實多聲字非慎之過陽氷非所致譏又陽氷作與許小異並如頁字解中也夜浚明庶人宵興日出而作豈至卯時方起乎説文爵諸侯之土從之土寸寸其制度陽氷云從古文古文從一之下土音皇非封臣鍇以為之者受命而往各之其國土也音皇字之土兩字合之封字之土寸三字合之較然有分非所譏也説文從土左右注象金在土中形今聲上古文陽氷云當作金許慎金體非臣鍇以為金古文今古篆如此金為正體陽氷合之妄矣説文挹取也象形中有實與包同意陽氷云古文不從屈一之體並從包包一為勺二為勻一少也二漸多也兩均之義許氏因俗輩云一勺為與便謂中畫屈一則與與字同部又云包同意此正包也豈得為同意哉移入勺部之略反大小篆如此許氏如此臣鍇以為勺一勺也禮云今夫海一勺水之多實少也與包同意則勺外之包與勺蓋不相逺與陽氷之所異者微無足致議也説文賜豫也一勺為與與豫皆同陽氷云中畫盤屈兩頭各鉤物有交互相與之義與互同意許云一勺甚涉迂誕與屈中為蟲何殊臣鍇以為勺取也謂挹取而與之一而與之無或二三也言與則直與爾何必交互乃為相與雖篆有今古筆有省便義無踰於慎也説文酋矛也象形陽氷作然無所説臣鍇以為矛戟之字直如許慎所作丨其柄也上其首也亦其枝也其建衣也陽氷所作本出賊字字上非矛字亦不成文中丨直象苗之莖象蟲緣繞自下而上食其葉端今人見此因書矛戟字與之同妄矣説文蛇食象形陽氷云從已中一不合次已下臣鍇以為己亦屈伸可象巴蛇陽氷妄矣説文云秋時萬物庚庚有實也陽氷云從象人兩手把干立庚庚然史記大橫庚庚是也臣鍇按史記漢文帝卜得兆正橫其繇曰大橫庚庚然則庚庚橫貌也木實亦橫著樹陽氷云兩手把干立為庚庚立則竪矣豈得庚庚乎又案李斯篆庚字正如許慎則知陽氷妄也説文不順忽出也從倒子不孝子突出也陽氷云疏流二字並從古疏通流行也豈不順哉臣鍇以為疏流非取不順蓋取出之速疾爾子之事父出必告今不順故忽然自出故速也氷所言煩蕪今不復載之也説文忤也五月隂氣午逆陽冒地而出與矢同意陽氷云五月筍成竹此之半枝出地臣鍇以為説文十幹十二辰皆取象天地及氣之出入或取物之大者豈取半竹乎五字既隂陽交午此午則象隂之衝陽陽上冒而未徹矢亦象上射象射以徹春氣又五月草木並盛銜華載實者衆豈獨竹乎説文九月萬物畢成陽下入地從戊含一也五行土生於戊盛於戍從戍一聲陽氷曰戊土也一陽也陽氣入地一固非聲臣鍇以為一自與戍為聲不勞入地也説文曰二古上字一人男一人女乙象懷子賅賅之形陽氷曰古文本象豕形諸義穿鑿之爾古文亥從豕陽氷曰本象豕減一畫爾篆文乃從二首六身臣鍇以為二首六身丘明所記史趙所言豈得謂之穿鑿蓋古之篆文文體互變謹案孔子家語子夏聞讀史三豕渡河知已誤為三亥誤為豕然則古文亥當作也及史趙所云亥有二首六身則為篆文矣杜預注云下亥上二畫竪置身旁則如算之六也案士丐云二萬六千六百有六旬矣今據李斯書亥字如此然則二畫竪則算家之二萬丄曲次之則似算家之六千􅗵象算家之六百又􅗵則算家之隔位六矣此蓋史趙以亥字布畫偶有此形因舉言之亦不言亥字之義則如許慎所説陽氷妄非趙許不足言也臣鍇以為文字之義無出説文而古來學者鮮能師尚輕薄之徒互矜字義六書既未能曉蒼雅曽不經懷蔡雍漢末碩學而云色絲為絶殊不知絶字系旁為刀刀下為卪而又況不及蔡者乎魏祖以合為人一口吳人云無口為天有口為吾曽不知吳從梁武書貞字為與上人取會嬉戲無顧經典矣庾肩吾方述書法乃云土力為地隨文帝惡隨字為走乃去之成隋字隋裂肉也其不祥大焉殊不知隨從辵辵安步也而妄去之者豈非不學之故將亦天奪其明乎及顔元孫作干祿字書欲以訓丗其從孫真卿書之于石而釐字攺牙為牙冕字轉坰為􅹇鄰正體也而謂之訛鄰俗謬也反謂之正蓋為病矣又國子司業張參作九經文字為古殺字而刋石作􅵠腦字旁轉寫者以在右乃作􅑠云字不亦疏乎又圖讖之興興于兩漢自唐堯申四嶽之命箕子陳五行之書河圖洛書聖人則之此天所以隂騭下人而聖人知命之術也自仲舒劉向博極其學自餘諸子多非兼才其陳説圖讖皆玄契將來然離合文字本非其術至使所作符命文字皆俗體相兼顔之推論之詳矣又童謡讖亦天所以告俗人或時之識占候者隨事而作以傳俗聞未可以文字言也君子於其言無所苟而已矣況文字乎又點畫之法著自前聞蓋博物君子優遊端粹援毫布墨寫其心素寬間由其樂昜精粹自其端平規旋矩折如中繩墨蕭何題署張芝章草筆迹輕重著在縑緗而後之學者棄本逐末爭求點畫之妙不測布置之由乃至刪除點畫加減隨意是有杶幹之才而不得棟宇之法豫章𣏌梓得無枉屈之嘆乎目巧之室臣所不取又梁武帝觀鍾繇書云損輔巧密臣以為損謂字闊則畫短間狹則點微輔謂字狹則畫盈字疏則點壯爾古謂善結字者謂布置也點畫雖多善布置者不覺其密點畫雖少能結字者不見其疏此乃可稱爾若多則師心以減少則任意以增以求平滿則誰實不能事不師古亦臣所耻今文字可謂訛矣陛下神䘳勝氣獨冠皇流多才多蓻俯弘小學以虞舜好問之德兼漢宣乙夜之勤蓋太山起於一拳巨海由乎一勺將禆事業無遺幽介臣亦何者而不上其所見哉
