body:
  text: 熈寧己酉冬傳監察王聖羙本翰林祗候劉允恭等篆子容題時領少府并詳定天下印文允恭等案吏也司農南齊再看舊闕二十五三十共二卷俟別求𥙷冩嘉祐中予編定集賢書籍暇日因往見樞相宋鄭公謂予曰知君校中袐書皆以文字訂正此正校讎之事也又曰文字之學今世罕傳說文之外復得何書予以徐公繫傳爲對公曰某少時觀此未以爲竒其後兄弟留心字學當世所有之書訪求殆遍其閒論議曾不得徐公之彷彿其所據以今所得校之十不及其五六誠該洽無比也又問予曰小徐學問文章才敏皆優於其兄而後人稱羙出其兄下何耶予曰信如公言所以然者楚金仕江左少年早卒鼎臣歸朝公卿皆與之逰士夫大從其學者亦衆冝乎名髙一時也公再三見賞相謂曰君之評論精詣如此當書錄余暇日整比三舘亂書得南唐徐楚金說文繫傳愛其博洽有根據而一半断爛不可讀㑹江西漕劉文潜以書来言李仁甫託訪此書乃從葉石林氏昔得之方傳録未竟而余有𥙷外之命遂令小子㮣扵舟中補足此夲得扵蘇魏公家而訛舛尚多當是未經校理也乾道癸巳十月廿四日尤袤題南唐徐鍇說文繫傳近所傳本有三一乾隆壬寅汪啟淑刻本一馬氏龍威祕書巾箱刻本一道光已亥祁嶲藻刻本汪馬本行世已久人雖知其謬誤恨無善本代之乾嘉諸儒亦頗援引以校徐鉉本迨祁本岀人人知汪馬之非而益信祁本之足貴矣祁本岀自影宋抄本歷經黃蕘圃顧千里鑒藏其善處已詳祁序及後附校勘記中然其本出自何人傳之誰氏顧氏思適齋文集黃氏士禮居藏書題跋記曾未一言及之祁序所稱汪士鐘藏宋槧殘本則出自明趙宧光舊藏亦經黃氏藏過其書每半葉七行行大字十四字小字雙行二十二字祗存通釋第三十至末凡十一卷語詳莫友芝知見傳本書目今汪祁二本行字與此同相校則互有迻易汪本譌奪亦同馬本祁刻校勘記時舉正之就三本互勘祁本之善自無可議惟不見宋刻或影宋原抄本終無以釋人疑問也曩閱錢曾讀書敏求記載有此書四十卷云流傳絕少世罕有覯之者當李巽巖時蒐訪歲久僅得七八闕卷誤字又無是正何况後之學人年代浸遠何從覩其全本此等書應有神物呵護留心籍氏者莫謂述古書庫中無驚人祕笈也曾之推重是書余固未敢深信述古藏書散後此書歸上海郁泰峰宜稼堂郁書於同治初元半歸揭陽丁禹生中丞持靜齋丁書於癸丑年散落滬巿間余在繆藝風先生坐中有書估持書來見之余岀卽尾追估人已渺如黃鶴顧揣其書必不岀滬上也時屬張菊生同年訪之乃知果在南潯張石銘孝廉家今已借得影印先以示余因取汪祁二本勘之知其同岀一原行字皆有迻改汪本迻改尤多木部心部闕至數十字橤部脫去部首字㡀黹㐆㱃㳄兄嵬象等部通部俱脫馬本亦然至祁刻校勘記所舉原抄及汪馬各本誤處此本並同其汪刻異者諦審行字均刻後改之如一部上篆下任器此本任作仕汪本作禮器是也顧細按汪刻禮字微偏其爲刻後校改痕迹可驗也示部䄟篆下讀若舂麥爲毳之毳此本與祁本同汪本兩毳字均作䄟而䄟字略小其必刻後據鉉本校改而原見之本必作毳字亦痕迹可驗也玉部瑮篆下相帶縈帶汪本無此四字此本祁本有之則汪本之譌奪也玭篆下玭珠之有聲者祁本無者字校勘記云當依汪本作玭珠之有聲者此本正有者字則又知此本勝於祁所據之抄本也略舉前一二篇以見大凡餘非別作校記不能詳也又二十五卷據祁刻云舊闕此卷宋鈔本以大徐所校定本補之故祁本此卷前結銜題名祇徐鉉一行此本與汪馬兩刻仍題徐鍇傳釋朱翺反切兩行則所據之原本又似與祁刻所據者微有不同但鉉本用孫愐切音鍇本用朱翺反切此本雖題朱翺反切書中仍用孫愐切音則此本又不如祁刻所見原本之審愼矣此本篆字出自抄胥不無描寫之失然近世鉉鍇二書亦已家絃戶誦昔邢子才有云誤書思之亦是一適此在深通小學之儒必不以此爲病若論此抄本之古則在顧黃以前亦較顧黃本爲有來歷余誠不意二百數十年所傳驚人祕笈至今化身千億流布人間論菊生同年表章之功他日當於說文統系圖中增一坐位矣辛酉八月中秋葉德輝跋
