front:
  text: 沙注褘衣玄晝翬也褕青狄畫摇狄皆刻而畫闕狄赤刻而不畫鞠衣黄象桑葉􅨲塵色展衣白縁衣字或作褖褖衣黒六服皆以素沙為裏使張顯也羊朱反袨服從衣㐱声臣鍇曰袗重衣也鄒陽書曰趙人祇服叢臺之下袨服盛服也支引反袗或從辰上衣從衣毛古者衣裘故以毛為表臣鍇曰古以皮為裘毛皆在外故衣毛為㑹意彼眇反古文表從衣内從衣里声臣鍇按詩不離于裏六矣反負兒衣從衣強声已賞反衣領從衣棘声詩曰要之襋之巳力反黼領從衣暴声詩曰素衣朱襮臣鍇曰黼領剌為斧盤沃反䙔領從衣匽声臣鍇曰謂衣領偃曲依逺反褗謂之裺從衣奄声依漸反衣衿從衣壬声而沈反衽也從衣婁声臣鍇曰春秋左傳曰蓽輅藍褸律乳反䘳縁從衣疌声臣鍇曰􅸩鍬緶之也禮僃緝字為此七十反交衽從衣金声臣鍇曰衽之交處居斟反襲袟從衣夫声臣鍇曰衣袟即䘳也今俗猶言之甫殳反蔽膝從衣韋声周禮曰王后之眼褘衣謂畫袍火韋反左衽袍從衣龖省声臣鍇曰衣一襲謂單複穪具也似集反籕文襲不省襺從衣包声論語曰衣敝緼袍臣鍇曰蠶絲曰絮枲曰緼盆毛反袍衣從衣繭声以絮曰襺以緼曰袍春秋傳曰盛夏重襺堅殄反南楚謂禪衣曰􅵄從衣葉声臣鍇按楚辭曰余􅵄于澧浦囚俠反衣帶以上從衣矛声一曰南比曰袤東西曰廣莫透反籕文袤從楙帶所結從衣會声春秋傳曰衣有襘古最反檾也詩曰衣錦褧衣反古從衣耿声臣鍇曰檾枲屬檾在外故曰反古茗反袛裯短衣從衣氐声的齊反衣袂裯袛從衣周声臣鍇按楚辭被荷裯之晏裯今俗語覩桃反裯謂之襤褸無縁從衣監声臣鍇曰襤猶濫濫薄也無縁故濫薄籠三反無袂衣謂之䙃故從衣省声徒臥反衣躬縫從衣毒声讀若督下毒反衣袂從衣去声一曰袪裏也裏者也袪尺二寸春秋傳曰披斬其袪臣鍇曰袂即今衣之袖口俚言䄂繳遺如反袂從衣声仍又反俗褎從由從衣夬声弭例反裏一曰藏從衣鬼声戸乖反褱也從衣包声臣鍇曰俗言袌也薄保反俠也從衣眔声一曰槖臣鉉等曰眔非声未詳戸乖切衣蔽前從衣詹声臣鍇曰又襜褕謂帷襜以蔽前後也亦占反衣衸從衣石声臣鍇按字書袥張衣令大也他作反袥從衣介声臣鍇按字書衸補厀裙怕夬反絝從衣睪声滕莫反裙也從衣它声一曰論語曰朝服袉紳圖坐反諸衦從衣亐声臣鍇按諸亏袍也員湏反絝從衣寒省声春秋傳曰㣲褰與襦豈䖍反衣袍從衣居声讀與居同堅踈反絝踦從衣龍声臣鍇曰踦足也勤動反襱或從賣絝上從衣召声臣鍇按漢書朱慱傳齊官属褒衣大袑食夭反衣慱大從衣尋声他感反慱裾從衣声臣鍇曰慱廣也漢書云褱衣也補袍反衣正幅從衣耑声臣鍇曰正幅幅下袤殺也春秋左傳及禮所謂端委之衣顚歡反重衣皃從衣圍声爾雅曰䙟䙟臣鍇按爾雅無此言唯釋言云虹潰也疑古今文字或誤也于歸反重衣從衣复声一曰褚衣芳郁反衣厚褆褆從衣是声臣鍇按詩曰好人褆褆敵圭反衣厚皃從衣農声詩曰何彼襛矣臣鍇按詩傳猶戎戎臣以為戎戎衆也女重反新衣声一曰背縫從衣叔声臣鍇按春秋左傳及國語曰衣之偏裻史記佞幸傳亦云作督假借也得酷反衣裾從衣多声春秋傳曰公㑹齊侯于袳臣鍇曰禮言大夫袳袂謂其袂張大公㑹齊侯于袳地名昌婢反衣裾從衣㕯声臣鍇曰裾衣邊也故謂四裔春秋左傳曰衡流而彷徉裔焉延世反古文裔長衣皃從衣分声翻文反長衣皃從衣軎省声臣鍇曰音專羽元反短衣從衣鳥声春秋傳曰有空臣鍇曰今春秋傳無此言疑注誤也覩挑丁了二反重衣從衣執声巴郡有褺江縣田俠反長衣皃從衣非声歩雷反短衣從衣蜀声讀若蜀殊燭反衣至地從衣斵声輟角反短衣從衣需声一曰㬮衣臣鍇按古詩曰紫綿為止襦輭區反緥也從衣啻声詩曰載衣之􅠷他計反衣小從衣扁声臣鍇曰春秋左傳曰帶其褊矣比兖反衣無絮從衣合声臣鍇曰夾衣也史記匈奴傳賜單衣袷溝呷反衣不重從衣單声臣鍇曰漢書葢寛饒断其禪衣今俗皆借單字得于反漢令解衣耕謂之㐮從衣声臣鍇曰詩曰兩服上襄音寜修翔反古文襄寢衣長一身有半從衣皮声平義反飾從衣象声似奨反日日所常衣從衣從日亦日声臣鍇曰㑹意而吉反私服從衣埶声詩曰是褻袢也臣鍇曰埶音午世反私列反裏䙝衣從衣中声春秋傳曰衷其衵服珎蒙反好佳從衣未聲詩曰靜女其袾臣鍇曰今詩作姝姝尺夫反事好從衣且声前吕反接益從衣卑声臣鍇曰若衣之接益也賔而反五彩相合從衣集声自合反衽從衣臣鍇曰春秋左傳曰之以立緟迂胃反衣物饒從衣谷声易曰有孚裕無咎臣鍇曰謙德之裕也謙受益也與襦反韏衣從衣辟声臣鍇曰猶卷也襞摺疊衣也故禮注謂裙褶爲襞積也頻役反摩展衣從衣干声臣鍇曰若今熨衣使展也根岸反繒餘從衣􅍌声臣鍇曰裁剪之餘也良舌反弊衣從衣奴声臣鍇曰猶言帛臭也女如反衣縫觧從衣旦声臣鍇曰今俗作綻字宅莧反完衣從衣甫声臣鍇曰詩衮職有闕仲山甫補之伯普反紩衣從衣黹黹亦声臣鍇按爾雅黹紩也臣以爲即今刺繡眡雉反奪衣從衣虒声讀若池臣鍇按易曰终朝三褫之陳知反袒從衣􅢓声盧跛反或從果作袒從衣呈声臣鍇按孟子曰裸裎于我側丑靜反袒從衣易声臣鍇曰禮有裼襲裼裎衣見内也星激反紕也從衣牙声臣鍇曰紕謂帛文䟽紕衺戾也周禮欹邪作竒衺也辭牙反以衣衽扱物謂之襭從衣頡声臣鍇按爾雅曰扱衣上衽于帶謂之襭羊截反襭或從手執衽謂之袺也從衣吉声臣鍇按爾雅持衣上衽也根察反帴從衣曹声殘高反裏從衣壯声側良反纒從衣果声骨朶反書囊從衣邑声殷業反緶從衣齊声臣鍇曰禮齋縗字謂鍬衣下也子思反豎使布長襦從衣豆声臣鍇曰豎通内外者禮曰内豎韶乳反編枲衣從衣區声一曰頭䙔一曰次裹衣臣鍇曰編麻為衣也次音疾延反今小兒次衣宛撫反編枲韤一曰粗衣從衣曷声臣鍇曰粗猶麤詩曰無衣無褐衡葛反艸雨衣秦謂之萆從衣象形臣鍇曰萆音闢宣靴反古文衰隷人給事者衣為卒卒衣有題識者臣鍇按吕氏春秋鄧析教鄭人訟一襦火獄卒題題識若今救火衣减㪍反卒也從衣者声一曰制衣臣鍇曰又衣之也春秋左傳曰取我衣冠而褚之抽暑反裁從衣制声正曵反蠻夷衣從衣友声一曰蔽膝北末反大被從衣今声却林反衣死人從衣遂声春秋傳曰楚使公親襚夕位反棺中縑裏從衣弔声讀若雕覩挑反贈終者衣被曰裞從衣兊声輸袂反鬼衣從衣熒省声讀若詩曰葛藟褮之一曰若靜女其姝之袾玄經反車温從衣延声賖延反無色從衣半一曰詩曰是紲袢也讀若普臣鍇按詩傳縐絺當暑袢紲之服臣以為袢煩溽也近身衣也復喧反以組帶馬從衣馬声臣鍇按秦衣馬簮裊漢書注謂以組帶馬也彌了反
