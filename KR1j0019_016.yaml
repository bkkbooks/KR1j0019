body:
  text: 文一百十四重十反衣也從衣求声一曰象形與衰同凡之屬皆從臣鍇曰以獸皮毛作之以助女工也䖍柔反古文求此與意同臣鍇曰古象衣求形後則加衣也裏也從鬲声讀若擊楷革切文二重一考也七十曰老從人毛匕言湏髪變白凡老之屬皆從老臣鍇曰㑹意也勒抱反年八十曰耋從老省至声臣鍇按易曰大耋之嗟春秋傳曰以伯舅耋老亭結反年九十曰從老蒿省声臣鍇曰亦作耄莫號反老從老省旨声臣鍇按禮八十曰耆臣支反老人行才相逮從老易省行象讀若樹臣鍇曰行遲多駐也易象析易行也上句反人老靣凍黎若垢從老省句声臣鍇曰尚書曰耉造徳不降也講吼反老人靣如點處從老省占声讀若耿介之耿丁念反乆也從老省声常帚反老也從老省丂声刻保反善事父母者從老省從子子承老老省亦声臣鍇曰通論僃矣獻罩反文十眉髪之屬及獸毛也象形凡毛之屬皆從毛臣鍇曰二象毛乙其中後高也門高反毛盛從毛隼声虞書曰鳥獸㲝毛臣鍇按說尚書者曰鳥獸生細毛自煖也而尹反獸豪從毛幹声臣鍇曰翰林皆當作㲦羽翰則作翰古多假借侯玩反仲秋鳥獸毛盛可選取以為噐從毛先声讀若選臣鍇詳許慎之意毨訓選也孔安國云毨少也毛至秋皆成而少也則可選慎與安國義通也息典反以毳為􅖯色如虋禾之赤苗故謂之􅨷從毛㒼声詩曰毳衣如􅨷臣鍇按外國織皮毛為罽璊玉色赤與尸古者居從古臣鍇按文子曰聖人泉點而雷声尸居而龍興也踈堅反俗居從足一本從居臥息從尸自声臣鍇曰臥中喘息也介反動作切切從尸䏌声臣鍇曰居旣從尸動亦從尸也層屑屑屢動作也故言不以屑是不以動意也私列反轉從尸省声陟衍反行不便一曰極從尸􅒘声臣鍇曰極即至也􅒘塊字也苟瘵反􅷥從尸九声苦劳反髀從尸下兀居凡臣鍇曰几所生几也徒論反或從肉隼或從骨声尻從尸旨声起反從後近之從尸匕声臣鍇曰尼猶昵也女咨反從後相臿從尸臿声楚甲反㞚從尸乏声長立反柔皮從尸申尸之後也或從女展反㐲皃從尸展声一曰屋宇珎忍反屖遟從尸辛声臣鍇曰漢書傳云器不屖利屖堅也又屖遟不進也犀墀字從此先迷反履屬從尸非声臣鍇按春秋左傳曰屝屨資糧注屝草履也扶沸反終主從尸死声臣鍇曰主于身也申離反從尸者声田吾反履中薦從尸枼声臣鍇曰履中替也相聶反居也從尸尸所主一曰尸象屋形從至至所止屋室皆從至臣鍇曰經傳皆訓尸為主也屋人居所主也烏谷反籕文屋從厂古文屋屏蔽從尸并声比郢反重屋從尸曾声前増反文二十三重五十寸也人手卻十分動􅎃為寸口十寸為尺尺所以指尺規矩事也從尸從乙乙所識也周制寸尺咫尋常仞諸度量皆以人之体為法凡尺之属皆從尺臣鍇曰十分一寸也人所診􅎃處五藏脈所會也家語曰布指尺知舒肱知尋漢書武帝常讀東方朔上書輒乙其處是以乙為記識也昌夕反中婦人手長八寸謂之咫周尺也從尺只声臣鍇曰國語楛砮矢實之其長尺有咫長短適中眞彼反文二㣲也從倒毛在尸後古人或飾系㞑西南夷皆然凡㞑之屬皆從㞑臣鍇曰微者書在後時將末漸微也倒毛謂㞑毛生倒属也飾系㞑若以雉㞑飾鑣或從豹㞑亡斐反連從㞑蜀声臣鍇曰屬相連續若㞑之在体故從㞑專玉反無㞑從㞑出声臣鍇曰字從此居屈反人小便從㞑水年銚反文四定所依也從尸從彳攵舟象履形一曰尸声凡􅛛之属皆從􅛛臣鍇曰􅛛行故從彳六矣反古文􅛛從頁從足􅛛從􅛛省婁声一曰鞮臣錯曰鞮革􅛛也九遇反􅛛下從􅛛省歷声臣鍇按周禮注繶者以采絲礫􅛛之下臣以為􅛛牆下連底處釆絲編剌之曆曆然作礫假借當作此字連的反􅛛從􅛛省予声夕與反􅛛從􅛛省喬声臣鍇曰史記虞卿躡屩見趙王屩猶蹻足高也己藥反屩從􅛛省支声其㦸反文六重一船也古者共皷貨狄刳木為舟剡木為楫以濟不通象形凡舟之属皆從舟臣鍇按共皷貨狄二人黄帝臣也隻留反空中木為舟亼從舟從巜巜水也臣鍇曰亼者取二合之義巜音俞猶窬穿之義㑹意羊朱反舟從舟鉛省声市縁反船行從舟彡声敕林反艫從舟由声漢律名船方長為舳艫一曰尾臣鍇曰尾船尾陳六反舳艫從舟盧声一曰船頭論孤反船行不安從舟刖省讀若兀吾忽反船著不從行舟㚇声讀若䔂臣鍇按爾雅艐至也不行即至也子紅反我也文二重一仁人也古文竒字人象形孔子曰在人下故詰屈凡几之属皆從凡臣鍇按山海經非人羿莫能上尔申反高而上平也從一在人上讀若夐茂陵有兀桑里吾忽反孩子也從几象小兒頭囱未合然知反信也從儿声臣鍇曰儿仁人也故為信與凖反說也從儿㕣声臣鍇曰說音悅昜曰兌悦也㕣音兗杜㑹反長也高也從儿育省声臣鍇曰云在伋上也赤風反文六籕文皃從豸臣鍇曰豸獸豸豸然皃之嚴毅或從頁豹省声冕也周曰殷曰哻夏曰收從皃象形皮變反籕文覍或從卝上象形或字文二重四廱蔽也從人象左右皆蔽形凡之属皆從讀若瞽公户反鍪首鎧也從從省皃象人頭形也單頭反文二前進也從几之凡先之属皆從先臣鍇曰之在人上也鬼前反進也從二先贊從此闕所臻反文二無髮也從人上象釆粟之形取其声凡秃之属皆從秃王育説蒼頡出見秃人㐲禾中因以制字未知其審臣鍇曰言秃人髪不纎長若禾稼也他哭反秃皃從秃䝿声徒催反文二視也從目儿凡見之属皆從見臣鍇曰目几偽見㑹意經硯反瞻也從見示声善旨反古文視亦古文視臣鍇曰此一字古文以為視字今則自為一字葢古今之変亦猶示古為祗字今自音視求也從見麗声讀若池臣鍇曰鮑昭曰南䚕炎國婁患反好視從見委声臣鍇曰低囘而視也委為反内視從見児声臣鍇曰今為睨内視自視也疑制反好視從見声魯戈反笑視也從見录声劣束反大視也從見爰声呼逺反察視也從見矣声讀若鎌臣鍇曰漢書多言廉得某情亷察視也當作此規火火廉反連塩反外慱衆多視也從見貟声讀若運臣鍇曰俗名目䚋亂也于問反諦視也從見雚声古翰反古文觀從取也從見寸寸度之亦手也臣鍇曰得從此㑹意多則反觀也從見監亦声臣鍇曰監臨也㑹意婁坎反内也從見來声臣鍇口猶眯也勒菜反顯也從見是声敵圭反目有察省從見声臣鍇曰微察之也此眇反拘覰未致宻也從見虘声臣鍇曰致亦宻也親去反小見也從見冥声爾雅曰覭髳弗離臣鍇按爾雅注覭髳謂草木之藂攢翳薈者弗離猶彌離猶䝉籠民甹反内視也從見甚声丁含切遇見也從見冓声臣鍇曰詩曰亦既覯止格漚反注目視也從見歸声臣鍇曰然視不移也權雖反窺視從見占声春秋傳曰公使覘之信敕染反司從見㣲声臣鍇曰司伺視也尾希反突前從見曰声臣鍇曰􅜪音䝉止空反暫見從見炎声春秋公羊傳曰覢然公子陽生收儼反暫見從見賔声匹儐反䚔􅳳從見樊声讀若幡復宣反病人視從見氐声讀若迷民冺反下視深從見声讀若攸延秋反私出頭視從見䑣声讀若郴欶林反覷闚觀從見束声七恣反㰟從見豈声訖示反欲從見俞声羊朱反視不明從見舂声一曰直視丑尨反視誤從見􅕛声異召反寤從見學省声一曰發也江岳反目亦從見智声他秋反召從見青声臣鍇曰亦用爲淨甘泉賦曰稍暗而靚深也從姓反至從見亲声臣鍇曰宻至也亲音榛之鄰反諸侯秋朝曰覲劳王事從見堇声其襯反諸侯三年大相聘曰覜覜視從見兆声愓弔反從見毛声讀若苗臣鍇按詩曰參差行菜左右芼之芼擇菜也其餘簡擇爲覒門高反蔽不相見從見必声名噎反司人從見它声讀若馳臣鍇曰伺候也詩曰彼留子嗟将其來施施當作此視字申而反目蔽垢從見声讀若兠臣鍇曰眵目汁凝也單頭反文四十五重三並視也從二見凡覞之属皆從覞臣鍇曰㑹意異召反狠視從覞声齊景公之勇有成􅵾者臣鍇曰很戾而視也成􅵾孟子所云也􅵾其名苦閑反見雨而止息從覞從雨臣鍇曰雨雨也周普故並視皆見此㑹意虚致反文三張口气悟也象气從人上出之形凡欠之属皆從欠臣鍇曰人欠去也悟觧也气擁滯欠去而解也三气形丘劔反欠皃從欠金声臣鍇曰欠去而見却林反欠皃從欠䜌声魯剜反喜也從欠吉声臣鍇曰此今俚俗言也馨速反吹也一曰笑意從欠句声臣鍇按老子曰或欨或吹况于反温吹從欠虖声虎烏反吹气從欠或声于目反安气從欠與声臣鍇曰孔子曰歸歟歸歟今試言之則气緩而安也以虚反翕气從欠脅声虛業反吹气從欠賁声臣鍇曰班固西都賦曰欱野歕山鋪奔反息一曰气越泄從欠曷声讀若香臭盡歇臣鍇按鮑昭曰薫歇㶳滅軒謁反喜樂從欠雚声臣鍇曰喜動声气故從欠呼寛反笑喜從欠斤声臣鍇曰禮笑不至欣作矧假借希斤反笑不壊顔曰弞從欠引省声矢引反意有所欲從欠㝮省声臣鍇曰今人言識𣢾也苦暖反㱁或從奈從欠气声一曰口不便言臣鍇曰楊雄口吃吃與欮相類幾迄反貪欲從欠谷声臣鍇曰欲人六情之所生也余足反詠從欠哥声臣鍇曰歌者長引其声以誦之也更和反歌或從言口乞引從欠耑声讀若車輇以蟬反歍􅩃從欠鼀声臣鍇曰口相就也即肉反俗􅩃從口從就惄然也從欠尗声孟子曰曾西然才六切含笑從欠今声丘嚴反人相笑歋瘉從欠虒声臣鍇曰晋羅友曰鬼見歋榆是也以支反歊气出皃從欠高高亦声欣消反有所吹起從欠炎声讀若忽飛詡屈反出气從欠從口臣鍇曰㑹意叱為反坎戲笑皃從欠之声臣鍇曰今訛俗作咍字軒其反气出皃從欠声延朝反吟從欠肅声詩曰其歗也謌臣鍇曰歗者吹气出声也息叫反吟從欠􅴥省声臣鍇曰此悲歎也古詩曰一彈再三歎從口作嘆嘆息也他旦反籕文歎不省卒喜從欠喜声軒其反訾從欠矣声遏開反歐從欠此声賛寄反欷從欠虛声一曰出气臣鍇曰歔欷者悲泣气咽而抽息也忻余反歔從欠希声忻祈反盛气怒從欠蜀声臣鍇曰春秋左傳齊有邴歜川欲反言意從欠從亦声讀若酉夷酒反欲飲從欠渇声臣鍇曰今俗用渇字刻葛反所謌從欠噭省声讀若噭呼見弔反悲意從欠声踈億反盡酒從欠􅧤声臣鍇按史記郭解姉子與人飮使之作醮字假借也子妙反監持意口閉從欠緘声上咸反指而笑從欠辰声讀若蜃食忍反昆于不可知從欠鰥声臣鍇曰禹父號鯀義當此字古論反歠從欠臿声春秋傳曰㰱而忘山呷反吮從欠束声臣皓曰漱遬從此色捉反食不滿從欠甚声讀若坎吕糝反欲得從欠臽声讀若貪臣鍇曰楚辭曰傺而沈藏脫甘反歠從欠合声呼合反歉食不滿從欠兼声丘點反咽中􅒚不利從欠骨声鳥滑反嚘從欠因声乙器反吐從欠區声恩斗反心有所悪若吐從欠鳥声一曰相就臣鍇按山海經曰相㧕之所山􅺽為澤宛都反逆气從欠亥声苦噯反且唾一曰小笑從欠毄声許璧反縮鼻也從欠翕声丹陽有歙縣臣鍇按老子曰将欲歙之也希立反蹴鼻從欠咎声讀若爾雅曰麔猳短脰思斗反愁皃從欠㓜声伊虬反咄欪無慙一曰無腸意從欠出声臣鍇曰蹙鼻為㰶猶今俗人之言欶宻反詮詞從欠曰曰亦声詩曰欥求厥寜臣鍇曰詮理也理其事之詞也一曰發声今詩假借聿字㑹意與必反不前不精從欠二声臣鍇曰不前是次于上也不精是其次也七恣反古文次飢虚從欠康声臣鍇曰㱂猶康空也彄荘反詐欺從欠其声遣之反神食气從欠音声臣鍇曰禮周人上臭灌用欎鬯又曰有飶其香神靈先享其气也忻吟反文六十五重四歠也從欠酓声凡㱃之属皆從㱃臣鍇曰酓一音甘九沈反古文㱃從今水古文㱃從今食㱃從㱃省叕声昌説切歠或從口夬文二重三慕欲口液從欠水凡㳄之属皆從㳄臣鍇曰今訛俗作延夕違反㳄或從侃籕文㳄貪欲從㳄羑省呼之羑文王所拘羑里臣鍇曰無然歆羡欲也訓誘也㑹意之彦反歠從㳄厂声讀若移臣鍇曰厂音移以支反私利物從㳄㳄敬血者臣鍇曰㑹意徒號反文四重二㱃食气逆不得息曰旡從反欠凡旡之属皆從臣鍇曰欠息也故反欠為不得息居志反古文先逆悪驚詞從咼声讀若是人名多夥胡顆反専有不善爾雅簿從先京声臣鍇按春秋左傳號多徳今爾雅左傳作凉假借力状反文三重一通釋繫傳卷第十六
