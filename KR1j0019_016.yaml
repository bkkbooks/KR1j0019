seq: 16
body:
  text: 沙注褘衣玄晝翬也褕青狄畫搖狄皆刻而畫闕狄赤刻而不畫鞠衣黃象桑葉􅨲塵色展衣白緣衣字或作褖褖衣黑六服皆以素沙為裏使張顯也羊朱反袨服從衣鬒聲臣鍇曰袗重衣也鄒陽書曰趙人祇服叢臺之下袨服盛服也支引反袗或從辰上衣從衣毛古者衣裘故以毛為表臣鍇曰古以皮為裘毛皆在外故衣毛為會意彼眇反古文表從衣內從衣里聲臣鍇按詩不離于裏六矣反負兒衣從衣強聲已賞反衣領從衣棘聲詩曰要之襋之巳力反黼領從衣暴聲詩曰素衣朱襮臣鍇曰黼領剌為斧盤沃反䙔領從衣匽聲臣鍇曰謂衣領偃曲依逺反褗謂之裺從衣奄聲依漸反衣襟從衣壬聲而沈反衽也從衣婁聲臣鍇曰春秋左傳曰蓽輅藍褸律乳反䘳緣從衣疌聲臣鍇曰􅸩鍬緶之也禮僃緝字為此七十反交衽從衣金聲臣鍇曰衽之交處居斟反襲袟從衣夫聲臣鍇曰衣袟即䘳也今俗猶言之甫殳反蔽膝從衣韋聲周禮曰王后之眼褘衣謂畫袍火韋反左衽袍從衣龖省聲臣鍇曰衣一襲謂單復稱具也似集反籕文襲不省襺從衣包聲論語曰衣敝緼袍臣鍇曰蠶絲曰絮枲曰緼盆毛反袍衣從衣繭聲以絮曰襺以緼曰袍春秋傳曰盛夏重襺堅殄反南楚謂禪衣曰􅵄從衣葉聲臣鍇按楚辭曰余􅵄于澧浦囚俠反衣帶以上從衣矛聲一曰南比曰袤東西曰廣莫透反籕文袤從楙帶所結從衣會聲春秋傳曰衣有襘古最反檾也詩曰衣錦褧衣反古從衣耿聲臣鍇曰檾枲屬檾在外故曰反古茗反袛裯短衣從衣氐聲的齊反衣袂裯袛從衣周聲臣鍇按楚辭被荷裯之晏裯今俗語覩桃反裯謂之襤褸無緣從衣監聲臣鍇曰襤猶濫濫薄也無緣故濫薄籠三反無袂衣謂之䙃故從衣省聲徒臥反衣躬縫從衣毒聲讀若督下毒反衣袂從衣去聲一曰袪裏也裏者也袪尺二寸春秋傳曰披斬其袪臣鍇曰袂即今衣之袖口俚言袖繳遺如反袂從衣聲仍又反俗褎從由從衣夬聲弭例反裏一曰藏從衣鬼聲戶乖反褱也從衣包聲臣鍇曰俗言袌也薄保反俠也從衣眔聲一曰槖臣鉉等曰眔非聲未詳戶乖切衣蔽前從衣詹聲臣鍇曰又襜褕謂帷襜以蔽前後也亦占反衣衸從衣石聲臣鍇按字書袥張衣令大也他作反袥從衣介聲臣鍇按字書衸補膝裙怕夬反褲從衣睪聲滕莫反裙也從衣它聲一曰論語曰朝服袉紳圖坐反諸衦從衣亐聲臣鍇按諸亏袍也員須反褲從衣寒省聲春秋傳曰微褰與襦豈虔反衣袍從衣居聲讀與居同堅踈反褲踦從衣龍聲臣鍇曰踦足也勤動反襱或從賣褲上從衣召聲臣鍇按漢書朱慱傳齊官屬褒衣大袑食夭反衣慱大從衣尋聲他感反慱裾從衣聲臣鍇曰慱廣也漢書云褱衣也補袍反衣正幅從衣專聲臣鍇曰正幅幅下袤殺也春秋左傳及禮所謂端委之衣顚歡反重衣貌從衣圍聲爾雅曰䙟䙟臣鍇按爾雅無此言唯釋言云虹潰也疑古今文字或誤也于歸反重衣從衣復聲一曰褚衣芳郁反衣厚褆褆從衣是聲臣鍇按詩曰好人褆褆敵圭反衣厚貌從衣農聲詩曰何彼襛矣臣鍇按詩傳猶戎戎臣以為戎戎衆也女重反新衣聲一曰背縫從衣叔聲臣鍇按春秋左傳及國語曰衣之偏裻史記佞幸傳亦云作督假借也得酷反衣裾從衣多聲春秋傳曰公會齊侯于袳臣鍇曰禮言大夫袳袂謂其袂張大公會齊侯于袳地名昌婢反衣裾從衣訥聲臣鍇曰裾衣邊也故謂四裔春秋左傳曰衡流而倣徉裔焉延世反古文裔長衣貌從衣分聲翻文反長衣貌從衣軎省聲臣鍇曰音專羽元反短衣從衣鳥聲春秋傳曰有空臣鍇曰今春秋傳無此言疑注誤也覩挑丁了二反重衣從衣執聲巴郡有褻江縣田俠反長衣貌從衣非聲步雷反短衣從衣蜀聲讀若蜀殊燭反衣至地從衣斫聲輟角反短衣從衣需聲一曰㬮衣臣鍇按古詩曰紫綿為止襦軟區反褓也從衣啻聲詩曰載衣之􅠷他計反衣小從衣扁聲臣鍇曰春秋左傳曰帶其褊矣比兖反衣無絮從衣合聲臣鍇曰夾衣也史記胸奴傳賜單衣夾溝呷反衣不重從衣單聲臣鍇曰漢書蓋寬饒斷其禪衣今俗皆借單字得于反漢令解衣耕謂之襄從衣聲臣鍇曰詩曰兩服上襄音寧修翔反古文襄寢衣長一身有半從衣皮聲平義反飾從衣象聲似奬反日日所常衣從衣從日亦日聲臣鍇曰會意而吉反私服從衣藝聲詩曰是褻袢也臣鍇曰藝音午世反私列反裏褻衣從衣中聲春秋傳曰衷其衵服珍蒙反好佳從衣未聲詩曰靜女其袾臣鍇曰今詩作姝姝尺夫反事好從衣且聲前吕反接益從衣卑聲臣鍇曰若衣之接益也賔而反五彩相合從衣集聲自合反衽從衣臣鍇曰春秋左傳曰之以立緟迂胃反衣物饒從衣谷聲易曰有孚裕無咎臣鍇曰謙德之裕也謙受益也與襦反韏衣從衣辟聲臣鍇曰猶卷也襞摺疊衣也故禮注謂裙褶為襞積也頻役反摩展衣從衣干聲臣鍇曰若今尉衣使展也根岸反繒餘從衣􅍌聲臣鍇曰裁剪之餘也良舌反弊衣從衣奴聲臣鍇曰猶言帛臭也女如反衣縫解從衣旦聲臣鍇曰今俗作綻字宅莧反完衣從衣甫聲臣鍇曰詩衮職有闕仲山甫補之伯普反紩衣從衣黹黹亦聲臣鍇按爾雅黹紩也臣以為即今刺繡視雉反奪衣從衣虒聲讀若池臣鍇按易曰終朝三褫之陳知反袒從衣􅢓聲盧跛反或從果作袒從衣呈聲臣鍇按孟子曰裸裎于我側丑靜反袒從衣易聲臣鍇曰禮有裼襲裼裎衣見內也星激反紕也從衣牙聲臣鍇曰紕謂帛文疏紕邪戾也周禮欹邪作竒邪也辭牙反以衣衽扱物謂之襭從衣頡聲臣鍇按爾雅曰扱衣上衽于帶謂之襭羊截反襭或從手執衽謂之袺也從衣吉聲臣鍇按爾雅持衣上衽也根察反帴從衣曹聲殘高反裏從衣壯聲側良反纒從衣果聲骨朵反書囊從衣邑聲殷業反緶從衣齊聲臣鍇曰禮齋縗字謂鍬衣下也子思反豎使布長襦從衣豆聲臣鍇曰豎通內外者禮曰內豎韶乳反編枲衣從衣區聲一曰頭䙔一曰次裹衣臣鍇曰編麻為衣也次音疾延反今小兒次衣宛撫反編枲襪一曰粗衣從衣曷聲臣鍇曰粗猶粗詩曰無衣無褐衡葛反草雨衣秦謂之萆從衣象形臣鍇曰萆音闢宣靴反古文衰隸人給事者衣為卒卒衣有題識者臣鍇按吕氏春秋鄧析教鄭人訟一襦火獄卒題題識若今救火衣減勃反卒也從衣者聲一曰制衣臣鍇曰又衣之也春秋左傳曰取我衣冠而褚之抽暑反裁從衣制聲正曵反蠻夷衣從衣友聲一曰蔽膝北末反大被從衣今聲却林反衣死人從衣遂聲春秋傳曰楚使公親襚夕位反棺中縑裏從衣弔聲讀若雕覩挑反贈終者衣被曰裞從衣兊聲輸袂反鬼衣從衣熒省聲讀若詩曰葛藟褮之一曰若靜女其姝之袾玄經反車溫從衣延聲賖延反無色從衣半一曰詩曰是紲袢也讀若普臣鍇按詩傳皺絺當暑袢紲之服臣以為袢煩溽也近身衣也復喧反以組帶馬從衣馬聲臣鍇按秦衣馬簮裊漢書注謂以組帶馬也彌了反文一百十四重十反衣也從衣求聲一曰象形與衰同凡之屬皆從臣鍇曰以獸皮毛作之以助女工也虔柔反古文求此與意同臣鍇曰古象衣求形後則加衣也裏也從鬲聲讀若擊楷革切文二重一考也七十曰老從人毛匕言須髮變白凡老之屬皆從老臣鍇曰會意也勒抱反年八十曰耋從老省至聲臣鍇按易曰大耋之嗟春秋傳曰以伯舅耋老亭結反年九十曰從老蒿省聲臣鍇曰亦作耄莫號反老從老省旨聲臣鍇按禮八十曰耆臣支反老人行才相逮從老易省行象讀若樹臣鍇曰行遲多駐也易象析易行也上句反人老靣凍黎若垢從老省句聲臣鍇曰尚書曰耉造德不降也講吼反老人靣如點處從老省占聲讀若耿介之耿丁念反久也從老省聲常帚反老也從老省丂聲刻保反善事父母者從老省從子子承老老省亦聲臣鍇曰通論僃矣獻罩反文十眉髮之屬及獸毛也象形凡毛之屬皆從毛臣鍇曰二象毛乙其中後高也門高反毛盛從毛隼聲虞書曰鳥獸㲝毛臣鍇按説尚書者曰鳥獸生細毛自暖也而尹反獸豪從毛幹聲臣鍇曰翰林皆當作㲦羽翰則作翰古多假借侯玩反仲秋鳥獸毛盛可選取以為器從毛先聲讀若選臣鍇詳許慎之意毨訓選也孔安國云毨少也毛至秋皆成而少也則可選慎與安國義通也息典反以毳為􅖯色如虋禾之赤苗故謂之􅨷從毛㒼聲詩曰毳衣如􅨷臣鍇按外國織皮毛為罽璊玉色赤與尸古者居從古臣鍇按文子曰聖人泉點而雷聲尸居而龍興也踈堅反俗居從足一本從居臥息從尸自聲臣鍇曰臥中喘息也介反動作切切從尸䏌聲臣鍇曰居既從尸動亦從尸也層屑屑屢動作也故言不以屑是不以動意也私列反轉從尸省聲陟衍反行不便一曰極從尸􅒘聲臣鍇曰極即至也􅒘塊字也苟瘵反􅷥從尸九聲苦勞反髀從尸下兀居凡臣鍇曰几所生几也徒論反或從肉隼或從骨聲尻從尸旨聲起反從後近之從尸匕聲臣鍇曰尼猶昵也女咨反從後相臿從尸臿聲楚甲反㞚從尸乏聲長立反柔皮從尸申尸之後也或從女展反伏貌從尸展聲一曰屋宇珍忍反屖遲從尸辛聲臣鍇曰漢書傳云器不屖利屖堅也又屖遲不進也犀墀字從此先迷反履屬從尸非聲臣鍇按春秋左傳曰屝屨資糧注屝草履也扶沸反終主從尸死聲臣鍇曰主于身也申離反從尸者聲田吾反履中薦從尸枼聲臣鍇曰履中替也相聶反居也從尸尸所主一曰尸象屋形從至至所止屋室皆從至臣鍇曰經傳皆訓尸為主也屋人居所主也烏谷反籕文屋從廠古文屋屏蔽從尸并聲比郢反重屋從尸曾聲前增反文二十三重五十寸也人手卻十分動􅎃為寸口十寸為尺尺所以指尺規矩事也從尸從乙乙所識也周制寸尺咫尋常仞諸度量皆以人之體為法凡尺之屬皆從尺臣鍇曰十分一寸也人所診􅎃處五藏脈所會也家語曰布指尺知舒肱知尋漢書武帝常讀東方朔上書輒乙其處是以乙為記識也昌夕反中婦人手長八寸謂之咫周尺也從尺只聲臣鍇曰國語楛砮矢實之其長尺有咫長短適中真彼反文二微也從倒毛在尸後古人或飾系㞑西南夷皆然凡㞑之屬皆從㞑臣鍇曰微者書在後時將末漸微也倒毛謂㞑毛生倒屬也飾系㞑若以雉㞑飾鑣或從豹㞑亡斐反連從㞑蜀聲臣鍇曰屬相連續若㞑之在體故從㞑專玉反無㞑從㞑出聲臣鍇曰字從此居屈反人小便從㞑水年銚反文四定所依也從尸從彳攴舟象履形一曰尸聲凡􅛛之屬皆從􅛛臣鍇曰􅛛行故從彳六矣反古文􅛛從頁從足􅛛從􅛛省婁聲一曰鞮臣錯曰鞮革􅛛也九遇反􅛛下從􅛛省歷聲臣鍇按周禮注繶者以采絲礫􅛛之下臣以為􅛛牆下連底處釆絲編剌之曆曆然作礫假借當作此字連的反􅛛從􅛛省豫聲夕與反􅛛從􅛛省喬聲臣鍇曰史記虞卿躡屩見趙王屩猶蹻足高也己藥反屩從􅛛省支聲其戟反文六重一船也古者共鼓貨狄刳木為舟剡木為楫以濟不通象形凡舟之屬皆從舟臣鍇按共鼓貨狄二人黃帝臣也隻留反空中木為舟集從舟從巜巜水也臣鍇曰集者取二合之義巜音俞猶窬穿之義會意羊朱反舟從舟鉛省聲市緣反船行從舟彡聲敕林反艫從舟由聲漢律名船方長為舳艫一曰尾臣鍇曰尾船尾陳六反舳艫從舟盧聲一曰船頭論孤反船行不安從舟刖省讀若兀吾忽反船著不從行舟㚇聲讀若䔂臣鍇按爾雅艐至也不行即至也子紅反我也文二重一仁人也古文竒字人象形孔子曰在人下故詰屈凡几之屬皆從凡臣鍇按山海經非人羿莫能上爾申反高而上平也從一在人上讀若敻茂陵有兀桑里吾忽反孩子也從几象小兒頭囱未合然知反信也從兒聲臣鍇曰兒仁人也故為信與凖反説也從兒公聲臣鍇曰説音悅昜曰兌悅也公音兗杜會反長也高也從兒育省聲臣鍇曰云在伋上也赤風反文六籕文貌從豸臣鍇曰豸獸豸豸然貌之嚴毅或從頁豹省聲冕也周曰殷曰哻夏曰收從貌象形皮變反籕文覍或從草上象形或字文二重四雍蔽也從人象左右皆蔽形凡之屬皆從讀若瞽公户反鍪首鎧也從從省貌象人頭形也單頭反文二前進也從几之凡先之屬皆從先臣鍇曰之在人上也鬼前反進也從二先贊從此闕所臻反文二無髮也從人上象釆粟之形取其聲凡秃之屬皆從秃王育説蒼頡出見秃人伏禾中因以制字未知其審臣鍇曰言秃人髮不纎長若禾稼也他哭反秃貌從秃貴聲徒催反文二視也從目兒凡見之屬皆從見臣鍇曰目几偽見會意經硯反瞻也從見示聲善旨反古文視亦古文視臣鍇曰此一字古文以為視字今則自為一字蓋古今之變亦猶示古為祗字今自音視求也從見麗聲讀若池臣鍇曰鮑昭曰南䚕炎國婁患反好視從見委聲臣鍇曰低回而視也委為反內視從見兒聲臣鍇曰今為睨內視自視也疑制反好視從見聲魯戈反笑視也從見録聲劣束反大視也從見爰聲呼逺反察視也從見矣聲讀若鎌臣鍇曰漢書多言廉得某情亷察視也當作此規火火廉反連鹽反外慱衆多視也從見貟聲讀若運臣鍇曰俗名目䚋亂也于問反諦視也從見雚聲古翰反古文觀從取也從見寸寸度之亦手也臣鍇曰得從此會意多則反觀也從見監亦聲臣鍇曰監臨也會意婁坎反內也從見來聲臣鍇口猶眯也勒菜反顯也從見是聲敵圭反目有察省從見聲臣鍇曰微察之也此眇反拘覷未致密也從見虘聲臣鍇曰致亦密也親去反小見也從見冥聲爾雅曰覭髳弗離臣鍇按爾雅注覭髳謂草木之藂攢翳薈者弗離猶彌離猶蒙籠民甹反內視也從見甚聲丁含切遇見也從見冓聲臣鍇曰詩曰亦既覯止格漚反注目視也從見歸聲臣鍇曰然視不移也權雖反窺視從見占聲春秋傳曰公使覘之信敕染反司從見微聲臣鍇曰司伺視也尾希反突前從見曰聲臣鍇曰􅜪音蒙止空反暫見從見炎聲春秋公羊傳曰覢然公子陽生收儼反暫見從見賔聲匹儐反䚔􅳳從見樊聲讀若幡復宣反病人視從見氐聲讀若迷民泯反下視深從見聲讀若攸延秋反私出頭視從見䑣聲讀若郴欶林反覷窺觀從見束聲七恣反吃從見豈聲訖示反欲從見俞聲羊朱反視不明從見舂聲一曰直視丑尨反視誤從見􅕛聲異召反寤從見學省聲一曰發也江嶽反目亦從見智聲他秋反召從見青聲臣鍇曰亦用為淨甘泉賦曰稍暗而靚深也從姓反至從見亲聲臣鍇曰密至也亲音榛之鄰反諸侯秋朝曰覲勞王事從見堇聲其襯反諸侯三年大相聘曰眺眺視從見兆聲愓弔反從見毛聲讀若苗臣鍇按詩曰參差行菜左右芼之芼擇菜也其餘簡擇為覒門高反蔽不相見從見必聲名噎反司人從見它聲讀若馳臣鍇曰伺候也詩曰彼留子嗟將其來施施當作此視字申而反目蔽垢從見聲讀若兜臣鍇曰眵目汁凝也單頭反文四十五重三並視也從二見凡覞之屬皆從覞臣鍇曰會意異召反狠視從覞聲齊景公之勇有成􅵾者臣鍇曰很戾而視也成􅵾孟子所云也􅵾其名苦間反見雨而止息從覞從雨臣鍇曰雨雨也周普故並視皆見此會意虛致反文三張口氣悟也象氣從人上出之形凡欠之屬皆從欠臣鍇曰人欠去也悟解也氣擁滯欠去而解也三氣形丘劔反欠貌從欠金聲臣鍇曰欠去而見却林反欠貌從欠䜌聲魯剜反喜也從欠吉聲臣鍇曰此今俚俗言也馨速反吹也一曰笑意從欠句聲臣鍇按老子曰或欨或吹况于反溫吹從欠呼聲虎烏反吹氣從欠或聲于目反安氣從欠與聲臣鍇曰孔子曰歸歟歸歟今試言之則氣緩而安也以虛反翕氣從欠脅聲虛業反吹氣從欠賁聲臣鍇曰班固西都賦曰欱野噴山鋪奔反息一曰氣越泄從欠曷聲讀若香臭盡歇臣鍇按鮑昭曰薰歇㶳滅軒謁反喜樂從欠雚聲臣鍇曰喜動聲氣故從欠呼寬反笑喜從欠斤聲臣鍇曰禮笑不至欣作矧假借希斤反笑不壞顔曰弞從欠引省聲矢引反意有所欲從欠㝮省聲臣鍇曰今人言識𣢾也苦暖反款或從奈從欠氣聲一曰口不便言臣鍇曰楊雄口吃吃與欮相類幾迄反貪欲從欠谷聲臣鍇曰欲人六情之所生也余足反詠從欠哥聲臣鍇曰歌者長引其聲以誦之也更和反歌或從言口乞引從欠專聲讀若車輇以蟬反歍􅩃從欠鼀聲臣鍇曰口相就也即肉反俗􅩃從口從就惄然也從欠叔聲孟子曰曾西然才六切含笑從欠今聲丘嚴反人相笑歋愈從欠虒聲臣鍇曰晉羅友曰鬼見歋榆是也以支反歊氣出貌從欠高高亦聲欣消反有所吹起從欠炎聲讀若忽飛詡屈反出氣從欠從口臣鍇曰會意叱為反坎戲笑貌從欠之聲臣鍇曰今訛俗作咍字軒其反氣出貌從欠聲延朝反吟從欠肅聲詩曰其嘯也歌臣鍇曰嘯者吹氣出聲也息叫反吟從欠􅴥省聲臣鍇曰此悲歎也古詩曰一彈再三歎從口作嘆嘆息也他旦反籕文歎不省卒喜從欠喜聲軒其反訾從欠矣聲遏開反歐從欠此聲贊寄反欷從欠虛聲一曰出氣臣鍇曰歔欷者悲泣氣咽而抽息也欣余反歔從欠希聲欣祈反盛氣怒從欠蜀聲臣鍇曰春秋左傳齊有邴歜川欲反言意從欠從亦聲讀若酉夷酒反欲飲從欠渴聲臣鍇曰今俗用渴字刻葛反所歌從欠噭省聲讀若噭呼見弔反悲意從欠聲踈億反盡酒從欠􅧤聲臣鍇按史記郭解姊子與人飮使之作醮字假借也子妙反監持意口閉從欠緘聲上咸反指而笑從欠辰聲讀若蜃食忍反昆于不可知從欠鰥聲臣鍇曰禹父號鯀義當此字古論反啜從欠臿聲春秋傳曰歃而忘山呷反吮從欠束聲臣皓曰漱遬從此色捉反食不滿從欠甚聲讀若坎吕糝反欲得從欠臽聲讀若貪臣鍇曰楚辭曰傺而沈藏脫甘反啜從欠合聲呼合反歉食不滿從欠兼聲丘點反咽中􅒚不利從欠骨聲鳥滑反嚘從欠因聲乙器反吐從欠區聲恩斗反心有所惡若吐從欠鳥聲一曰相就臣鍇按山海經曰相抑之所山􅺽為澤宛都反逆氣從欠亥聲苦噯反且唾一曰小笑從欠毄聲許璧反縮鼻也從欠翕聲丹陽有歙縣臣鍇按老子曰將欲歙之也希立反蹴鼻從欠咎聲讀若爾雅曰麔猳短脰思斗反愁貌從欠幼聲伊虬反咄欪無慙一曰無腸意從欠出聲臣鍇曰蹙鼻為㰶猶今俗人之言欶密反詮詞從欠曰曰亦聲詩曰欥求厥寧臣鍇曰詮理也理其事之詞也一曰發聲今詩假借聿字會意與必反不前不精從欠二聲臣鍇曰不前是次于上也不精是其次也七恣反古文次飢虛從欠康聲臣鍇曰㱂猶康空也彄莊反詐欺從欠其聲遣之反神食氣從欠音聲臣鍇曰禮周人上臭灌用欎鬯又曰有飶其香神靈先享其氣也欣吟反文六十五重四啜也從欠酓聲凡飲之屬皆從飲臣鍇曰酓一音甘九沈反古文飲從今水古文飲從今食飲從飲省叕聲昌説切啜或從口夬文二重三慕欲口液從欠水凡涎之屬皆從涎臣鍇曰今訛俗作延夕違反涎或從侃籕文涎貪欲從涎羑省呼之羑文王所拘羑里臣鍇曰無然歆羡欲也訓誘也會意之彥反啜從涎廠聲讀若移臣鍇曰廠音移以支反私利物從涎涎敬血者臣鍇曰會意徒號反文四重二飲食氣逆不得息曰旡從反欠凡旡之屬皆從臣鍇曰欠息也故反欠為不得息居志反古文先逆惡驚詞從咼聲讀若是人名多夥胡顆反専有不善爾雅簿從先京聲臣鍇按春秋左傳號多德今爾雅左傳作涼假借力狀反文三重一通釋繫傳卷第十六
