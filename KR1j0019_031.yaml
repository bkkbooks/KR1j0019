body:
  text: 次之以一也自而起者屮故次之以屮草之𥘉也故次之以草之深為蓐故次之以蓐之廣博為茻故次之以三者皆屮之屬也丨𥘉分為小小才可分也故次之以八實分之故次之以釆分之明也故次之以分者半也故次之以牲之大而分者莫若牛故次之以㹈牛之屬也故次之以牛勞則善仰而告人故次之以告必以口故次之以口開為凵故次之以開口而言必喧故次之以喧哭聲也故次之以哭而亡之故次之以走必止故次之以止之剌撥故次之以止必安步故次之以步止于此故次之以止乎此者居正也故次之以居正於是故次之以是而有行必愼故次之以辵行且止也愼者必安故次之以小安步也安而引長之故次之以引而有儀有儀可觀故次之有延而後為行故次之以窮下而上齒承止故次之以牙亦齒屬故次之以足亦止也故次之以古文足為止故次之以匹亦疏也疏通者必品之故次之以品三竅也故次之以册亦編竹故次之以册言之衆故次之以戢多言之窮必卷舌故次之以舌干口故次之以干而谷故次之以谷口上上蹙理也語必餘聲故次之以只止而餘聲也止則訥故次之以止而訥者言之句也故次之以句之相糾也故次之以言相傳為古故次之以古積久也故次之以十之變為所傳而積久者言也故次之以二言必競故次之以聲成文曰音故次之以多言愼於愆故次之以辛愆也草之嶽丵猥出似辛故次之以丵必猥叢故次之以叢之衆猥必有故次之以或收之或之故次之以之謂共故次之以共者合異謀故次之以矯異為同衆共力也故次之以􅺢者臼之故次之以臼者敬敕持之也昧旦丕顯故次之以䢅而炊故次之以爨而新故次之以爨新以鬲故次之以鬲而烹飪故次之以和飪以爪故次之以瓜所以戟持故次之以丮而不巳必鬪故次之以能解爭者以一一而有制故次之以又必有所佐故次之以左右以供史也故次之以史忠正也中必有支故次之以手敏為聿故次之以敏於手者筆故次之以聿筆也筆所以規畫故次之以畫界以相及故次之以隸及也規畫所及以為堅久也故次之以臤堅也堅以事君曰臣故曰臣堅也故次之以臣必有所執故次之以殳以示殺故次之以殺之字從殳殳從王者三驅示殺託於驅禽故次之以凡鳥也驅有法度故次之以寸法度也皮革之飭以示法度故次之柔韋曰㼱故次之以所以治者以支故次之以攴作教刑故次之以卜筮神以教民也故曰爻效也效教也故次之以卜而從乃可用故次之以爻以情言故次之以爻交也交之積故次之以明而使人故次之以􅡚舉目使人也目而使人故次之以左右察之故次之以目之飭以眉故次之以所以蔽眉目者盾故次之以盾亦通蔽眉目鼻故次之以白亦自也故次之以鼻百出於白也皕二百也故次之以鳥之習飛以氣白氣所由出也故次之以習而玩之鳥之所以飛也鳥之自玩習者羽故次之以有羽者佳故次之以佳喜自奮故次之以有角而奮者萑故次之以萑所以異者角故次之以􅘲角也目之角戾為苜故次之以獸之美角者羊故次之以半之臭羶故次之以鳥之角鷹鷹似於羊也故次之以瞿鷹隼之視也鳥雙為雔故次之以鳥之群為雥故次之以鳥即隹也故次之以烏鳥之異者故次之以烏之言雜雜久必棄之故次之以華所以棄也華除然後交材以構故次之以冓者𥘉也故次之以么而微故次之以􅖨小也小謹為叀故次之以幽而微為玄故次之以微而相成亦相豫而相承故次之以受豫者多者逐故次之以放者落也故次之以落必殘故次之以􅯂而歹故次之以歹者死也故次之以肉去則為冎故次之以冎而後骨故次之以骨肉之核也故次之以肉必有筋故次之以筋肉胾也割胾以刀故次之以刀以刃故次之以刃所以為巧㓞巧也故次之以刀以斷草故次之以丰草之散亂也耒所以耕耕去草故次之以耒曲木也角亦曲骨也故次之以骨之堅者為角草之堅者為竹故次之以竹以為箕故次之以丌所薦也故次之以薦所以佐故次之以左然後有所為故次之以欲知其工必展視之故次之以㠭展也巫者虛無也嫌其無規矩故次之以工規矩也甘者美也美而無守則亂工一所守故次之以含道以言故次之以曰言也其言也訒故次之以乃難言之也乃而聲曲故次之以丂曲也曲必舒可故次之以可必有所稽故次之以兮稽也稽而遲留留而舒舒必形於聲故次之以號必舒故次之以亏舒也言所以通旨故次之以旨通必喜故次之以喜而飾之以樂故次之以喜樂也樂之聞者莫若鼓故次之以師有功則豈樂故次之以豈愷也飲至以豆故次之以豆行豐故次之以豐尚豐故次之以器以陶故次之以䖒陶器必文之故次之以虍虎文也獸之文者虎故次之以虎怒為虤故次之以虎以飾彛器故次之以皿以稟於故次之以去也故次之以去相違也相違則爭爭必傷傷則血故次之以血明自而箸也故次之以箸也之明者莫若丹故次之以丹而青故次之以丹青之不可移也若井故次之以井以供烹飪故次之以皀粒也粒以為鬯故次之以鬯食類也故次之以食合衆者故次之以集合也合會也故次之以會而之曰倉故次之以倉主入故次之以入於缶故次之以矢亦所以主入故次之以矢及髙回故次之以山􅊟之髙在於坰故次之以在􅴹之外故次之以京為髙丘郭之外也故次之以髙所以享故次之以享必滿故次之以畐滿也滿厚故次之以厚者斂而取之故次之以廪而愛之故次之以嗇必有來故次之以來麥也故次之以周所降麥天所來也來若有行故次之以攴行遲也遲而相背為舛故次之以草之蔓延相背舜故次之以相背者韋也故次之以韋逮也制韋而次第之故次之以弟者自後至也故次之以文在後也有所致必久故次之以違而久者磔之故次之以桀磔也桀於木故次之以木生於東故次之以林木之漸也故次之以林以生材故次之以才木也水之大者海之若木焉故次之以木長有所之故次之以之者必反反而匝故次之以匝而復出故次之以草木之出􅜨然而盛故次之以􅜨生也故次之以葉出乇然翹出故次之以翹而垂故次之以垂者草木之華也故次之以木頭曲而禾故次之以曲而稽留故次之以木之多曲者鳥所依故次之以禾木之類漆也故次之以木可用而束之故次之以圂而束之故次之以㯻口之也故次之以口而數之故次之以物之庶者具故次之以邑有名數也故次之以兩邑相對故次之以物圜為日日亦物也故次之以日盛於旦故次之以旦而光盛故次之以倝光盛也光之流偃蹇故次之以光盛則冥故次之以冥往則且來故次之以晶還而月繼之故次之以日月有食之故次之以食必明故次之以明而夕故次之以重夕為多矣故次之以日月避而其照通也多區其氣同也故次之以草木之成實者華也故次之以弓之連纍故次之以棗之結為故次之以禾麥之實先後必齊故次之以木之長齊其剌均也故次之以木判之為片故次之以折薪以灼故次之以鼐之鼎器之銘刻也故次之以克刻也成而録録然故次之以器成而食故次之以禾之生必勻故次之以秝等勻也禾之黏黍故次之以黍稷馨香故次之以穀之精為米故次之以米而舂之故次之以毇以臼故次之以地之陷者凶故次之以凶惡地也地惡不理以藝麻故次之以林木也故次之以巳理者為麻故次之以叔麻之屬也故次之以禾黍麻示之屬實在其專故次之以專之盛者韭故次之以盛而蔓者瓜故次之以瓠匏瓜也故次之以瓠者亦施于宇故次之以宀深屋也故次之以宫律吕之中也故次之以古者陶居而穴處蕢桴而土鼓故次之以居深而寢安必夢故次之以寢而安必有所倚故次之以或倚之或覆之故次之以重覆之故次之以􅜪者所以冒首故次之以兩者兼冒也故次之以而西覆之故次之以所以覆者巾故次之以巾似巾而蔽膝者市故次之以帛為巾也故次之以白帛之敝故次之以㡀而黹之故次之以説文解字繫傳第三十一
