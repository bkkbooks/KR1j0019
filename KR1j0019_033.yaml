front:
  text: 説文解字通論上第三十三
  hash: sha256:a0c551f3f88a13c287e6b113a215ec64545bf2104f36386e8b56a4bfbbe63751
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_033-1a}
body:
  text: 繫傳三十三文林郎守袐書省校書郎臣徐鍇撰昔在太𥘉泱鬱吁渝若埴在範若金在爐不不圯實為太始水澤火熹各與類期上屬於天下纍於祇聖人知之物見其質神示其情聖人謀之於是畫一以象道一者妙萬物而為形者也生二以象兩二者佴也佴次也天實先成地實次之人生其間故二生三三者參也天成地平人參其間然後萬物形而禮義昭矣易曰天一地二老子曰天大地大故於文一大為天天之為言顚也無所與髙也地者迆也迆而髙也山嶽也丘陵也墳衍也迆而卑臯隰也汙潢也故曰地有二形髙下平故於文土迆為地坤以簡能故省之也迆亦聲也天地之分精氣為人煩氣為蟲故於文蟲煩而人省也春秋穀梁子曰獨陽不生獨隂不成獨天不生隂陽天必三合而生故於文人為三歧上一而下二也古者聖人仰觀象於天俯取法於坤故仰晞於天三光下臨俯察於地山谷相交隂陽相午中則於人強弱相成剛柔相形故於文人乂為文故曰經緯天地謂之文王者則天之明因地之義通人之情丨而貫之丨一也一以貫之故於文丨貫三為王丨者居中也皇極之道也三者天地人也天曰柔克地曰剛克人曰正直王者抑剛而法柔體於正直故王之位居中而髙三之中王者之位也上附者居中而髙也詩曰載色載笑匪怒伊教夫登山者必下􅕉焉在谷者必仰窺焉地使之然也王者人中之髙也則天以臨民故曰聖人之大寶曰位也皇者大也始也天地既開始為君曰皇故文王自為皇自始也始為王也皇之為言煌煌然放道而趨率性而行自然有合於道也民無得而名若觀火焉不測其薪燎之本但見其煌煌而巳帝者諦也審諦於道也秉矩彠也故書曰若稽古帝堯古者皇也言順考上古三皇之道而效之故書曰耄期倦于勤故於文二朿為帝二古上也朿聲也朿者剌也審諦之物也王者天下之所歸往也為君之義同而體道之名減也君者尹也正也長民之通稱也天下之所取表正也表正則影正表曲則影曲口以出令也晉悼公曰臣之求君以出令也舜曰惟口出好興戎朕言不再狎侮小人罔以盡其力狎侮君子罔以盡其心故以文口尹為君慎其口也君群下之所歸往也大百年耄荒度作刑以誥四方是也易變而不窮也至屯剝之後萬物始復復則不妄非繼體之象故無妄之象曰先王以茂對時育萬物此夏桀之後湯始育民之象也故曰先王於文一口􅛣為后口發號也一令出惟行不惟反也􅛣垂衣之象旁逹之形天子之妃曰后后後也王前妃後也古謂官長曰后書曰汝后稷是也故於文后偏也君官也天生蒸民君實官之君不能獨治故設百官唐虞稽古建官惟百夏商官倍以至于周千品萬官故於文宀􅎧為官􅎧堆也堆衆􅊟也山以衆􅊟成其髙君以衆官成其聖宀深屋萬乘之君憂勞于廟堂之上公卿髙議於巖廊也曰實也陽德也君道也天無二日故於文一為日者轉而不窮也貟以利轉也轉而不一不可以訓故從一也月者闕也虧闕也亦所以輔陽之闕也隂德也臣道也隂不可抗於陽臣不可敵於君故於文闕者為月日貟而月方其中畫縱順以從上也上陽也周貟為君君德遍也德施普也闕者為臣才有闕也臣能集衆方以成德故曰翕受敷施九德咸事臣能盡衆才以禆於君故曰人之有能有為使羞其行而國其昌臣者司君之闕也君子曰在天者莫明於日月故于文日月為明書曰惟我文考若日月之照臨光于四海顯于西土或從囧囧亦明也日之狀也在地者莫明乎水火故於文水青為清青者精也道書曰積精成青書曰亮彼武王肆伐大商會朝清明天明地清也火在人上則能光故於文火几為几者人也火在上者書曰光宅天下言其光充滿天下也故古文草火為光草共也清光皆明也水火皆在地也故曰在地者莫明乎水火在人者莫明乎禮義故於文示豐為禮示者明示之也示日月星也又古祇字也豐者禮器也禮之袐也難覩故陳籩豆設簠簋為之揖讓升降趍翔以示之禮者履也道明示人則履行之禮者示也故古兩君相見陳禮樂以相示也明則易見也義者事之冝也孝經曰天之經也地之義也經常也言天有常道其氣一也地從冝而化之萬物異形也義者明也尚斷謂之善則斷而從之故於文羊我為義羊者美物也羊祥也大夫有羔羊之德君子有比焉我者已也人言之已斷之又我者俄也定於俄頃也君子所貴于賢有立斷焉其於五行也禮在南方南方火也義在西方西方金也金炯耀也是以禮義皆明也故曰在人者莫明乎禮義也仁者人也人之行也仁者親也仁者兼愛故於丈人二為仁二亦聲也古文尸二為仁屋也覆也兼覆二也古文千心為仁唯仁者能服衆心也智者知也知者必有言故於文白知為智白者詞言之氣也知不窮氣亦不窮也君子先行其言然後從之子路單辭可以折獄古者胥命而不盟鸚狌能言不離禽獸言而不信非為人也故於文人言為信或曰仁智信何以不明也曰仁者不尸其功智者自悔其迹莊子曰智生而無以智為也是謂以恬養智臧武仲作不順而施不恕任智之過也大信不約亦不自顯也禮難見欲民之深曉義者斷割也不明則民不服其於五行也仁在東方東方木也木柔而晦智在北方北方水也水晦也信在中央土亦柔昧明在內也道書曰黃庭內景黃者中庭也故禮義尚明而仁智信尚晦也道者蹈也人所蹈也一逹謂之道二逹曰歧旁三代之所以直道而行也故夏后太康之弟述大禹之戒以歌曰唯彼陶唐有此冀方今失其道亂其紀綱乃底滅亡此禹遵陶唐之道也堯舜同道堯曰稽占推可知矣此夏道也箕子作洪範曰無有作好遵王之道無反無側王道正直此殷道也詩曰周道如砥其直如矢此周道也左道者邪僻之徑也直道必循川塗邪徑越山便而行利速也直道夷而逺安而逸心泰而無慮風氣舒緩其所負荷也多邪徑險而速危而逼心惕而多畏不有跋躓之懼必有虎狼之患風氣擁迮其所負荷也少權道者違經而合於道也道經也權者不久之名也不得巳而行也若人之遇尊者於塗必歧道以避之尊者過不旋踵則復故道也惟君子能行權道積之於雅素也立身行道當愼其積積久則不能自返也君子曰任重而道逺仁以為己任不亦重乎死而後巳不亦逺乎君子之行於世兢兢業業畏天之渝不敢馳驅故於文辵首為道辵者乍行乍止也首始也術者方術也一方之道也猶五味之一也輪之一輻蓋之一轑輻轑之不工不教其鄉里國有疑議輦而如公言德與年長也行者行也人所履行也君子言忠信行篤敬蠻貊之邦行也懷之曰行易曰果行育德又曰多識前言往行以畜其德行有小大深淺小曰行大曰德故於文彳亍為行彳亍左右足相副而行也德大故彳漸進也德在內故主於心行在外主於行行彳也通名曰道道燾也覆燾之也行之言莖也若枝莖也真者仙也化也人生而靜物之性性而有欲性之害也感於物而動然後心術形焉人不能反身天理乃失君子所以駭世真人未嘗過而問焉真親未笑而和真悲未泣而哀魚目之賤也今有人以千金之珠易魚之一目魚不樂也何者貴而偽不若賤而真智巧所以飾身也巧智繁多反以害其身仙人者反夲修古重道延命長世字民之道也然必真乃能故漢王方平從後視鄰人之背曰噫子心邪不正終不可教以仙是知學仙者必正其心也故於文􅎅目隱八為真匕者化也反人為匙衆人熙熙如春登臺我獨泊兮如無所歸衆人或或好惡積億真人恬漠獨與道息人皆趍顯我獨守默人皆與彼我獨守此故反於人也黃帝聖人之真也民利其教百年而死人畏其神百年而亡人由其教百年而移故曰黃帝三百年老𥅆真人也莊子曰老子古人之博大真人哉夫子見之曰吾見老𥅆其猶龍也不知其乘風雲而上孔子顯其智以化於民民猶不知故曰吾東家丘子貢曰夫子之言性與天道不可得而聞也故真從目鹵莽不能識也隱隱也八其所乘也乘風雲也真人其生也天行其死也物化真人之氣常存於天非謂其身能上也古文匕一為真亦所乘也一不二也道也偽者飾也假也聖人在天下無為而有守也有為則無好也有為則患生有好則諛起為者敗之執響之附聲如影之箸形故於文音鄉為響鄉猶向也仿也鄉亦響之聲也説文解字繫傳第三十三
