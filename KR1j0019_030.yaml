  text: 說文解字通釋第三
  hash: sha256:e436a69962b96b2570872421fced5ade00849ae9e67d4c0f3e7d4dca948d77be
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_030-1a}
body:
  text: 繫傳三十文林郎守祕書省校書郎臣徐鍇撰後叙曰此十四篇五百四十部也九千三百五十三文重一千一百六十三解說凡十三萬三千四百四十一字其建首也立一爲耑臣鍇曰耑音端方㠯類聚物以羣分同條牽屬共理相貫雜而不越臣鍇曰類聚謂水部水部相次同條共理謂中之類與屮同從冂而貫之雖雜而各有部分不相逾越也據形聮系引而申之㠯究萬原臣鍇曰據形聮系謂之部因次㠯􅎅部從㠯究盡萬事之原也畢終於亥知化窮冥臣鍇謂亥生子終則復始故託於一寄終於亥亥則物之該盡故曰窮冥也于時大漢聖徳熈明承天稽唐敷崇殷中臣鍇曰漢承堯後故稽考唐堯之道殷正也正中也遐邇𬒳澤渥臣故封於吕周武王封苗裔文叔於許以爲太岳胤在頴川許昌縣召謂汝南邵陵縣後丗所居也切卬景行敢渉聖門其弘如何節彼南山欲罷不能旣竭愚才惜道之味聞疑臣鍇曰言疑則闕之也載疑演賛其志次列微辝知此者稀儻昭所尤庶有逹者理而董之臣鍇曰董正也召陵萬歳里公乗臣鍇曰漢因秦制二十等爵公乗第八也艸莽臣沖稽首再拜上書皇帝陛下臣伏見陛下㠯神明盛徳承遵聖業上考度於天下流化於民先天而天不違後天而奉天時萬國咸寧神人以和猶復深惟五經之妙皆爲漢制博采幽逺窮理盡性以至於命先帝詔侍中騎都尉賈逵修理舊文殊藝異術王教一耑茍有可㠯加於國者靡不悉集易曰窮神之化徳之盛也書曰人之有能有爲使羞其行而國其昌臣父故太尉南閣祭酒愼本從逵受古學蓋聖人不空作皆有依據今五經之道昭炳光明而文字者其本所由生自周禮漢律皆當學六書貫通其意恐巧說衺辝使學者疑愼博問通人考之於逵作說文解字六藝群書之詁皆訓其意而天地鬼神山川艸木鳥獸䖵䖝雜物竒怪王制禮儀丗間人事莫不畢載凢十五卷十二萬今說文作十三萬三千四百四十一字愼前以詔書校書東觀教小黄門孟生李喜等㠯文字未定未奏上今愼巳病遣臣齎詣闕愼又學孝經孔氏古文說古文孝經者孝昭帝時魯國三老所獻建武時給事中議郎衛宏所校皆口傳官無其說謹撰具一篇幷上臣鍇按後漢書杜林嘗得古文漆書尚書後㠯傳衛宏及徐巡愼又從宏受也臣誠惶誠恐頓首頓首死辠死辠䭬首再拜㠯聞皇帝陛下建光元年九月己亥朔二十日戊午上臣鍇曰建光元年漢安帝之十五年歳在辛酉也召上書者汝南許沖詣左掖門外㑹令并齎所上書十月十九日中黄門饒喜㠯詔書賜召陵公乗許沖布四十匹即日受詔朱雀掖門勑勿謝說文解字通釋第三十
