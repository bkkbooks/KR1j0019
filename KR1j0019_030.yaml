  text: 説文解字通釋第三
  hash: sha256:b161c34123e600857a6562ae845da12a41ec2370077d9c622342829a33ff4f4c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_030-1a}
body:
  text: 繫傳三十文林郎守祕書省校書郎臣徐鍇撰後敘曰此十四篇五百四十部也九千三百五十三文重一千一百六十三解説凡十三萬三千四百四十一字其建首也立一為專臣鍇曰專音端方以類聚物以羣分同條牽屬共理相貫雜而不越臣鍇曰類聚謂水部水部相次同條共理謂中之類與屮同從坰而貫之雖雜而各有部分不相逾越也據形聮系引而申之以究萬原臣鍇曰據形聮系謂之部因次以􅎅部從以究盡萬事之原也畢終於亥知化窮冥臣鍇謂亥生子終則復始故託於一寄終於亥亥則物之該盡故曰窮冥也于時大漢聖德熙明承天稽唐敷崇殷中臣鍇曰漢承堯後故稽考唐堯之道殷正也正中也遐邇𬒳澤渥臣故封於吕周武王封苗裔文叔於許以為太嶽胤在頴川許昌縣召謂汝南邵陵縣後丗所居也切卬景行敢涉聖門其弘如何節彼南山欲罷不能既竭愚才惜道之味聞疑臣鍇曰言疑則闕之也載疑演贊其志次列微辝知此者稀儻昭所尤庶有逹者理而董之臣鍇曰董正也召陵萬歲里公乘臣鍇曰漢因秦制二十等爵公乘第八也草莽臣沖稽首再拜上書皇帝陛下臣伏見陛下以神明盛德承遵聖業上考度於天下流化於民先天而天不違後天而奉天時萬國咸寧神人以和猶復深惟五經之妙皆為漢制博采幽逺窮理盡性以至於命先帝詔侍中騎都尉賈逵修理舊文殊藝異術王教一專茍有可以加於國者靡不悉集易曰窮神之化德之盛也書曰人之有能有為使羞其行而國其昌臣父故太尉南閣祭酒愼本從逵受古學蓋聖人不空作皆有依據今五經之道昭炳光明而文字者其本所由生自周禮漢律皆當學六書貫通其意恐巧説邪辝使學者疑愼博問通人考之於逵作説文解字六藝群書之詁皆訓其意而天地鬼神山川草木鳥獸䖵蟲雜物竒怪王制禮儀丗間人事莫不畢載凡十五卷十二萬今説文作十三萬三千四百四十一字愼前以詔書校書東觀教小黃門孟生李喜等以文字未定未奏上今愼巳病遣臣齎詣闕愼又學孝經孔氏古文説古文孝經者孝昭帝時魯國三老所獻建武時給事中議郎衛宏所校皆口傳官無其説謹撰具一篇並上臣鍇按後漢書杜林嘗得古文漆書尚書後以傳衛宏及徐巡愼又從宏受也臣誠惶誠恐頓首頓首死罪死罪稽首再拜以聞皇帝陛下建光元年九月己亥朔二十日戊午上臣鍇曰建光元年漢安帝之十五年歲在辛酉也召上書者汝南許沖詣左掖門外會令并齎所上書十月十九日中黃門饒喜以詔書賜召陵公乘許沖布四十匹即日受詔朱雀掖門勑勿謝説文解字通釋第三十
