body:
  text: 繫傳三十八文林郎守祕書省校書郎臣徐鍇撰昔聖人之作書也觀象於天而生文觀變於隂陽而為字幽贊於神明而河出圖洛出書極數於萬物而秬粟降測實於幽冥而鬼哭察於無聲著於無形曲而因之隨而模之一而繩之所以窮髙逺而徹幽隱者也止戈而為武交修而為文武者救患於未萌文者陶鈞於既成其治之大乎君子曰作書者其知後丗之患乎其聖人之留神乎君子人者若能修之善人勉焉淫人聳焉故畫一以極其本加二以致其變屈曲究竟以盡其意孳而胤之以窮其機故萬物舛形剛柔分情隆弛其德更貿其迹一著於筆如置金石刻於彛器罔敢或二故定天下之紏紛成萬物之精華者莫大於書非天下之至精其孰能作之逝者沒也來者進也沒則瀎減進則過溢往者著之來者平之追往而迎來立中而定之以為萬丗法非天下之至正其孰能作之民心不齊丗變風移夸而自巧以誣國寶器不中法謂之悖道故立匚音方以為器正矩以為工人君若能察之大化得焉萬民一焉非天下之大智其孰能作之是以君子所樂而玩者文之質也所取而馮者字之意也以行事者取其義以作器者尚其規故曰皿蟲為蠱反正為乏非天下之至神其孰能作之其稱名也小其取義也大其著於人也深精則簡粗則繁故人獸異也精者象而粗者譬故日月丘陵殊也古者聖人之心在於書乎故著而行之是以古之王者立中而天下治正家而天下定南靣而治垂衣裳而已矣蓋著於王王字也天無私覆地無私載日月無私照人君法之故背私而為公蓋著於公背也私也王者之道廣覆兼愛無適也無莫也蓋著於衣衣下覆二人之象為上者正身以出令蓋著於君古文君為今文尹口尹正也為下者鞠躬以事其上蓋著於臣曲身之狀君子居於正故能久蓋著之立天不能獨運地以佐之君不能獨治臣以佐之交修可否以成其德故令出而不擁蓋著於行兩彳相佐佑殺者所以立法也故務於去惡去惡而善行矣蓋著於刑刑從井井法也古者制器有象成象有矩蓋著於工古者敬鬼神而逺之人不易物惟德繄物故神不享其珍而享其德無法則煩煩則黷黷則無福蓋著於巫從工工法也古者制民畢力於田蓋著於男其有德則為官長正車服衣冠而臨之蓋著於夫古之制以其所有易其所無交易而退各得其所區而别之交而不爭蓋著於市市從丩几乙及也丩其中分界也唯口出好興戎尚口乃窮是以古之君子信心而後行故令行而不逆隱括而後語故語出而逺應喋喋之辭君子愼之蓋著於言言從口䇂䇂愆字天得一以成地得一以寧故天地之動貞夫一者也古之君子得一善則拳拳服膺而不捨書曰安汝止得一而止之大中之道也蓋著於正正者直也古之君子一其心而事君夫子曰一以貫之三代之所以直道而行也蓋著於德與德字同古之君子則天以臨民剛以經之柔以緯之陽以繩之隂以繟之寬以濟之猛以紏之故文武之道一弛而一張文陽而武隂蓋著之明明從日從月隂陽之象也説文解字錯綜卷第三十八
