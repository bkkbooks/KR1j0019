seq: 22
front:
  text: 古文􅖱從田川􅎌之川也篆古􅖱從田犬聲六畎而為一畒
  hash: sha256:4845e2952bbe11756967cc448033e3ede0bd7317709b269bd87d7dfe83d07e76
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_022-1a}
body:
  text: 文一重二水流澮澮也方百里為巜廣二尋深二仞凡巜之屬皆從巜讀若儈同臣鍇按釋名水注溝曰巜巜會也小水之所聚會也今人作澮古最反水生崖石間粼粼也從巜粦聲臣鍇曰水流石間不駃也里刃反文二貫穿通流水也虞書曰濬􅖱巜距川言深􅖱巜之水會為川也凡川之屬皆從川叱專反水脈也從川在一之下一地也壬省聲一曰水冥巠也臣鍇曰經理也紏茗反古文巠不省水廣也從川亡聲易曰包巟用憑河臣鍇曰荒慌統從此忽光反水流也從川或聲臣鍇按郭璞江賦測淢濜溳也况邑反水流也從川曰聲臣鍇按相如賦曰汩乎順流汩即此字曰音越于筆反水流也從川夕省聲臣鍇曰􅍌字從此良舌反四方有水自雍城池者是也從川邑讀若雍臣鍇曰古以城塹因山為高岸曰塹有溝無水曰陘有水曰池春秋左傳曰齊申池又史曰金城湯池是也會意宛封反籀文雍如此剛直也從信信古文信也從川取其不舍晝夜論語曰子貢侃侃如也臣鍇曰子路有聞未之能行唯恐有聞是其不捨晝夜也會意肯肝反害也從一雍川春秋傳曰川雍水泉本也從灥出廠下臣鍇曰會意北水原字原隰字古作邍也言袁反篆文省文二重一水長也象水巠理之長水也詩曰江之永矣凡永之屬皆從永雨省反水長也從永羊聲詩曰江之羕矣臣鍇曰蜀有彭羕㨾漾從此余亮反文二水之袤流别也從反永凡􅏨之屬皆從􅏨讀若蜀稗縣臣鍇曰永長流反則分派也匹賣反血理之分袤行體中者從􅏨從血臣鍇曰五藏六府之氣血分流四肢也會意莫獲反或從肉籕文邪視也從􅏨從見臣鍇按張衡西京賦覛往昔之館又南都賦覛魯縣而來遷民的反籕文覛文三重三泉出通川為谷從水半見出於口凡谷之屬皆從谷臣鍇曰指事孤速反山瀆無所通者從谷奚聲臣鍇曰俗作溪若兮反通谷也從谷害聲臣鍇曰前有所通也吼作反空谷也從谷翏聲梨桃反大長谷也從谷龍聲讀若聾來充反谷中響也從谷肱聲臣鍇曰隆墀永歎逺壑必盈幽谷無私有至斯響鏗𥙿中谷聲也混耕反望山谷谸俗青也從谷千聲七縣反深通川也從殘也地坑坎意也虞書曰濬畎澮距川臣鍇曰會意蘇徇反濬或從水古文濬文八重三凍也象水凝之形也凡仌之屬皆從仌臣鍇曰冰初疑文理如此也彬仍反氷堅也從水仌臣鍇今以為仌字也言丞反俗氷從疑寒也從仌廪聲力甚反寒也從仌青聲臣鍇曰冬和而夏凊也此併反仌也從仌束聲得貢反仌出也從仌聲詩曰納于隂力膺反或從夌流仌也從仌斯聲臣鍇曰冰解而流也後漢書曰河流澌不可渡也辛兹反半傷也從仌周聲臣鍇曰語曰歲寒然後知松柏之後凋後凋者非不凋也松柏為凋即凋是半傷也都僚反四時盡也從仌夊夊古文終臣鍇曰白虎通曰冬終也仌霜冬終之候也會意都農反古文冬從曰臣鍇曰冬者月之終也曰窮于紀也消也從仌台聲臣鍇曰未玄虛海賦曰陽氷不冶羊者反寒也從仌倉聲初訪反寒也從仌今聲魯皿反寒也從仌函聲胡甘反風寒也從仌畢聲卑聿反一之曰滭沷也從仌友聲臣鍇曰詩之言也一之曰十一月之日也分勿反寒貌也從仌桌日人人聲臣鍇曰寒使人戰凍也力必反寒也從欠賴聲郎蔡反文十七重三水從雲下也一象天坰象雲水霝其間也凡雨之屬皆從雨于捕反古文雨臣鍇曰但象雲雨而巳隂陽薄動靁雨生物者也從雨畾象回轉形臣鍇曰隂陽相蕩薄易繫曰雷風相薄雷出則萬物出也來堆反籕文靁間有回回靁聲也古文靁亦古文靁雨也齊人謂靁為霣從雨員聲一曰雲轉起也讀若昆臣鍇按易曰有霣自天也眉引反古文霣如此靁餘聲也鈴鈴所以挺出萬物從雨廷聲臣鍇按隂陽相薄而為雷激而為霆霹歷也田丁反霅霅震電貌從雨譶省聲一曰霅衆言臣鍇按吳都賦颯霅吸呷人衆聲也宅甲反隂陽激耀也從雨申聲庭硯反古文電如此劈歷振物者從雨辰聲春秋傳曰震夷狛之廟臣鍇以為霆其急激者也震所加物之稱也春秋左傳南宫極震章信反古文震如此凝雨説物者也從雨彗聲臣鍇以謂雪之著物積久而不流其浸潤深以解説物也相省反雨霰為霄也從雨肖聲齊語臣鍇以為霄雪今人所謂溼雪著物則消者也息超反稷霄也從雨散聲臣鍇按詩曰如彼雨雪先集惟霰郭璞以謂雨雪雜下也息茜反霰或從見雨仌也從雨包聲臣鍇按西京雜記隂氣􅎍陽為雹別車反古文雹如此雨零也從雨􅮎象零形詩曰霝雨其濛連丁反雨下零也從雨各聲勒記反餘雨也從雨令聲臣鍇曰孫楚詩零雨𬒳秋草連丁反小雨裁也從雨鮮聲讀若斯辛兹反霢霂小雨也從雨脈聲臣鍇曰詩曰潤之以霢霂臣以為霢若人之血脈流遍又如沐之霑濡也莫獲反霢霂也從雨沐聲門逐反小雨也從雨酸聲素攢反微雨也從雨聲讀若芟精廉反小雨也從雨衆聲明堂月令曰􅵪雨止宋反久隂也從雨沈聲池心反久雨也從雨兼聲連鹽反久雨也從雨函聲甘反凡雨三日已上為霖從雨林聲力尋反霖雨也從雨􅏨聲南陽名霖雨震臣鍇曰聚然不正也銀葴切雨聲也從雨真聲讀若資子思反雨貌也方語從雨禹聲讀若瑀于角反小雨也從雨僉聲精亷反雨築也從雨沾聲陟潛反霑也從雨染聲而厭反寒也從雨執聲或曰早霜也讀若春秋傳曰墊厄丁念反夏祭樂于赤帝以祈甘雨也從雨于聲臣鍇曰四月之祭也員須反􅟔舞羽也故或從羽臣鍇曰周禮以皇舞舞旱熯之事注皇舞象羽舞旱熯之事謂􅟔也水音也從雨羽聲云煦反􅓄也遇雨不進而止􅓄也從雨而聲易曰雲上於天需臣鍇按春秋左傳需事之下也然則需遲疑􅓄待也四于反文四十六重十一山川氣也從雨云聲象雲回轉形凡雲之屬皆從雲臣鍇曰禮曰山川出雲指事羽文反古文雲亦古文雲臣鍇曰二字直象形而巳雲覆日也從雲今聲臣鍇按漢書曰浮雲為我隂郁吟反古文省古文文二重四水蟲也象形魚㞑與燕㞑相似凡魚之屬皆從魚臣鍇曰下火象㞑而巳非水火之火字研余反魚子巳生者也從魚憜省臣鍇曰謂巳放散泊草渚者也秃頗反籕文䲊省魚子也一曰魚之美者有東海之鮞從魚而聲讀若而臣鍇曰吕氏春秋伊尹之言也忍伊反魚也從魚去聲臣鍇按相如賦禺禺魼魶去魚反虛鰨也從魚莫大羽聲臣鍇按字書魚似鮎四足它榼反赤目魚也從魚尊聲臣鍇按爾雅注鮅鱒似鯶赤眼鱓鯇也租本反魚也從魚猌聲臣鍇按猌音魚吝反里神反魚也從魚容聲與封反魚也從魚胥聲先居反鯍也周禮謂之䱴從魚恆聲臣鍇按相如賦䱴䱬漸離𩶶即鯍溝恆反䱴也從魚巟聲夢登反鮥也周禮春獻王鮪從魚有聲臣鍇按爾雅注鱣屬大曰王鮪小曰叔鮪詩序曰春獻鮪汪曰春鮪新來也于虺反叔鮪也從魚各聲勒託反魚也從魚系聲臣鍇曰即禹父名也孤損反魚也從魚眔聲固山反鱣也從魚里聲示矣反鯉也從魚亶聲陟連反籕文鱣如此魚也從魚專聲臣鍇按鱄因赤魚殊剸反魚也從魚同聲一曰也讀若褲櫳臣鍇按爾雅鰹大鮦小者鮵注今青州呼小鱺曰鮵篆勇反鮦也從魚蠡聲蓮第反魚也一曰鯉一名鰜從魚婁聲臣鍇按亦比目魚也力殊反䱾也從魚兼聲結添反魚也從魚攸聲臣鍇按何晏景福殿賦曰瀨戲鰋鯈陳收反魚也從魚豆聲土偶反魚也從魚便聲賔延反鯁或從扁赤尾魚也從魚方聲浮長反籕文魴從旁魚也從魚與聲臣鍇按鱮似魴頭大夕與反魚也從魚連聲鄰延反魚也從魚反聲壞卑反魚也從魚幼聲讀若幽伊紏反魚也從魚付聲臣鍇按鮒小魚也符注反魚也從魚巠聲𡵨或反魚也從魚聲臣鍇曰今作鯽津易反魚也從魚麗聲里西反魚也從魚曼聲沒團反魚也從魚蒦聲讀若瓠臣鍇按爾雅注似鮎而大色白户化反大鱯也小者名鮡從魚丕聲部悲反鱯也從魚豐聲連弟反鱧也從魚果聲戶把反楊也從魚嘗聲臣鍇按詩曰倏鱨鰋鯉字書黃頰魚也射強反魚也從魚覃聲傳曰伯牙鼓琴鱏魚出聽移今反也從魚兒聲擬西反鰌也從魚習聲臣鍇按爾雅注泥鰌也似入反鰼也從魚酋聲七牛反魚也從魚完聲户版反哆口魚也從魚乇聲它作反飲而不食刀魚也九江有之從魚此聲臣鍇按爾雅鮤魚刀注鮆也自禮反也從魚占聲年兼反鮀也從魚妟聲依逺反或從匽大鮎也從魚弟聲敵圭反魚也從魚賴聲郎蔡反鮎也從魚它聲臣鍇按爾雅亦鯊鮀也豆科反魚也從魚替聲似侵反魚也從魚翁聲烏公反魚也從魚舀聲經念反魚也從魚厥聲俱稅反白魚也從魚取聲士足反魚也皮可以為鼓從魚單聲石遣反魚也出薉邪頭國從魚免聲臣鍇曰今人音敏美選反魚出薉邪頭國從魚分聲臣鍇曰薉邪頭東夷也敷粉反魚也出樂浪潘國從魚虜聲勒古反魚也狀似蝦無足長寸大如義股出遼東從魚區聲器方反魚也出樂浪畨國從魚妾聲七捷反魚也出樂浪畨國從魚市聲浦會反魚也出樂浪畨國從魚掬聲一曰䱡出九江有兩乳一曰漙浮居六切魚也出樂浪畨國從魚沙省聲臣鍇曰今沙魚皮有珠文可飾刀劒靶皮亦可食所加魚也出樂浪畨國從魚樂聲勒託反魚也出貉國從魚羶省聲臣鍇曰古以此字音鮮借魚名臣鍇曰䏽肉也山雅注鮺真夷反藏魚也從魚差省聲南方謂之鱗北方謂之鮺臣鍇曰今俗作鮓側瓦反鮺也從魚今聲一曰大魚為鮺小魚為鱗祖慘反饐魚也從魚包聲臣鍇曰饐陳臭也步拗反蟲連行紆行者也從魚令聲臣鍇曰連行謂若蟻之行連屬不絶也連丁反魵也從魚假聲痕加反大蝦也從魚高聲候抱反當氐也從魚咎聲臣鍇按爾雅注海魚似鯿大鱗肥美多鯁溝曰反大貝也從魚亢聲一曰魚膏讀若罔臣鍇按爾雅注今紫貝也大者如車渠恆湯反蚌也從魚丙聲臣鍇曰爾雅作螷蒲猛反蚌也從魚吉聲漢律會稽郡獻鮚醬三斗巨乙反魚名也從魚必聲果聿反魚名從魚瞿聲九遇反魚名從魚矦聲何溝反魚骨專肥從魚周聲臣鍇曰小魚也覩挑反蒸然從魚卓聲臣鍇按詩南有嘉魚蒸然注蒸久也作罩罩籗也輟角反鱣鮪鮁鮁從魚友聲臣鍇按詩施罛濊濊鱣鮪撥撥借撥字北末反鯕魚出東萊從魚夫聲甫殳反魚名也從魚其聲虔知反魚名也從魚兆聲池沼反魚名也從魚匕聲呼跨反新魚精也從三魚不變魚臣鍇曰三衆也衆而不變是鮮也息遷反無似鱉無甲有尾無足口在腹下從魚納聲奴答切文一百三重七二魚也闕凡􅦏之屬皆從􅦏研余反捕魚也從水􅦏臣鍇曰從二􅦏二魚多也研余反篆文從魚文二重一玄鳥也籋口布翅枝㞑象形凡燕之屬皆從燕臣鍇曰籋音聶小鍇也于甸反文一鱗蟲之長能南能明能細能巨能短能長春分而登天秋分而潛淵從肉飛之形童省凡龍之屬皆從龍臣鍇曰肉飛也力鍾反龍也從龍霝聲霝古文靈字連丁反龍貌也從龍合聲慳南反龍鬐脊上䶬䶬也從龍幵聲丁帖反飛龍也從二龍讀若沓大市反文五鳥翥也象形凡飛之屬皆從飛臣鍇曰上旁飛者象鳥頭頸長毛甫肥反翅也從飛異聲籕文翼以即反篆文從羽文二重一逹也從飛下翅取其相背也凡非之屬皆從非甫肥反别也從非巳聲斧尾反披靡也從非麻聲臣鍇曰披靡分故取相違之義眉彼反相逹也從非告聲古奧反牢也所以拘非也從非陛省聲比倪反文五疾飛也從飛而羽不見也凡卂之屬皆從卂臣鍇曰此字出于飛羽不見無飛也思震反回飛疾也從卂營省聲臣鍇曰詩借為癏字葵名反文二説文解字通釋卷第二十二
