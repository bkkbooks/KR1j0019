seq: 9
body:
  text: 臣鍇曰竹青也迷牝反竹裏也從竹本聲臣鍇曰竹白也輔忖反竹兒也從竹翁聲臣鍇曰翁然並出也烏公反差也從竹參聲臣鍇曰今無復用此字師今反引書也從竹彖聲臣鍇曰篆書著於竹竹箋簡也直選反讀書也從竹榴聲春秋傳曰卜籀云臣鍇曰諷誦書也卜籀謂讀卦爻詞也顔氏臣謬正俗曰詩不可抽也注抽讀也司馬遷曰細文記長宥反書也一曰關西謂榜篇從竹扁聲臣鍇按詩書之義一篇一義聮也榜笞掠也僻連反簿書也從竹藉聲臣鍇曰史記云尺籍伍符然則籍簡長天也疾辟反竹田也從竹皇聲臣鍇按漢書皇竹之區戶荒反剖竹未去節謂之蔣從竹將聲子兩反籥也從竹枼聲亦接反書僮竹笞也從竹􅕛聲臣鍇曰謂編竹以習書尚書云啓籥見書即今鑰字胤略反竹聲也從竹劉聲臣鍇曰猶言瀏然聲清也里由反牒也從竹間聲艮限反竹列也從竹亢聲臣鍇按爾雅説仲無笐注云未詳格康反㒼爰也從竹部聲臣鍇按字書㒼爰簡牘也盆帚反齊簡也從竹寺寺官曹之等平也臣鍇曰簡簡牘也官曹之書也會意都肯反法也從竹泛聲竹簡書也古法有竹刑浮檻反表識書也從竹戔聲臣鍇曰今作箋於書中有所表記之也故張華博物志鄭玄郎毛萇之郡人謙敬不敢言注是也言但表識其不明者耳則千反信也漢制以竹長六寸分而相合從竹付聲臣鍇按史記漢文帝三年始與郡國守相為銅虎符竹使符注云銅虎符一至五國家當發兵遣使至都合符符合乃聽受之竹使符皆以竹箭五枚長五寸旁鐫篆書第一至第五以代古之圭璋從簡易也凡無反易卦用蓍也從竹古文巫字楚辝曰帝告巫陽有人在下我欲輔之魂魄離散汝筮與之巫主筮也會意時制反簮也從竹幵聲臣鍇曰女子十五而笄許嫁而筓也其端刻雞形古兮反取蟣北也從竹臣聲居而反收絲者也從竹蒦聲王若反蒦或從角間繀絲管也從竹廷聲臣鍇曰竹片挺也故東方朔曰以筳撞鍾曰丁反筟也從竹完聲古碗反筳也從竹孚聲讀若春秋魯公子彄逋吳反笿也可熏衣從竹冓聲宋楚謂竹篝牆以居也臣鍇曰竹籠也覆之可熏衣史記陳涉世家曰夜篝火以籠覆火也龜䇿傳亦然梗尤反迫也在瓦之下棼上從竹乍聲臣鍇曰爾雅注屋上簿謂之屋笮也滓白反堂簾也從竹廉聲臣鍇按尚書注戺堂簾曲隅也即謂兩階欲下隅曲處今此從竹即簾惟據此書刀蘀名簾惟皆作慊疑慊或與簾别或者此簾字後人所加之乎所不能決也連閻反牀􅳞也從竹責聲側册反牀簀也從竹􅙻聲臣鍇曰春秋左傳曰牀第聲言是阻史反竹席也從竹延聲周禮度堂以筵一丈椰然反竹席也從竹覃聲定嗛反籧篨粗竹席也從竹遽聲臣居反籧篨也從竹除聲除諸反竹器也可以取粗去細從竹麗聲色離反犬箕也從竹潘聲一曰蔽也臣鍇曰古亦謂車兩壁為藩作轓義同分軒反漉米籔也從竹奧聲於目反炊䉛也從竹數聲臣鍇曰木耳圜生似盤類此楊憚云鼠不容穴銜窶籔也蘇走反蔽也所以蔽甑底從竹卑聲必至反飯筥從竹襄聲爾往反可以收也從竹象形中象人手所推握也渾素反䇘或省臣鍇曰此直象形周禮百梐􅔰蓋以木作之交互以為遮間也宗廟盛肉竹器也從竹聲周禮供盆簝以待事梨挑反飲牛筐也從竹豦聲方言曰筐圓曰􅞠巳吕反飲馬器也從竹兜聲臣鍇曰藥有馬兜苓此也單頭反積竹矛戟矜也從竹盧聲春秋國語朱儒扶盧論孤反籋也從竹拑聲臣鍇按漢書曰箝語燒書勒潛反箱也從竹爾聲臣鍇曰今俗作鑷女攝反笠篕也從竹登聲臣鍇按史記虞卿躡屩擔簦丹增反簦無抦也從竹立聲里泣反大車牝服也從竹相聲臣鍇按詩皖彼牽牛不以服箱修翔反車笭也從竹匪聲臣鍇按尚書曰惟厥士女篚厥玄黃昭我周王言出其處為驗也七占反榜也從竹殿聲徒論反綴衣針也從竹咸聲止沉反以竿擊人也從竹削聲虞舜樂曰簫韶色捉反管三十六黃也從竹亏聲員須反十三簧象鳯之身也笙正月之音物生故謂之笙大者謂之巢小者謂之和從竹生聲古者隨作笙臣鍇按爾雅注大笙十九簧小者十三簧色行反笙中簧也從竹黃聲古者女媧作簧臣鍇按穆天子傳曰吹笙鼓簧葛洪神仙傳仙人王遙篋中取竹簧與人對鼓之也户往反簧屬也從竹是聲是支反篸差管樂象鳯之翼從竹肅聲臣鍇按爾雅注大者長尺四寸編二十三管小者十六管楚辝曰吹參差弓誰思參差簫也先么反通簫也從竹同聲臣鍇曰通洞無底也漢書成帝能吹洞簫頭貢反三扎籥也大者謂之築陟祝反鼓弦竹身樂也從竹爭聲臣鍇曰古以竹為之秦樂也側泓反吹鞭也從竹孤聲臣鍇曰蓋於鞭王作孔馬上吹之􅈱􅈱然古乎反吹筒也從竹秋聲匙肖反壷夭也從竹夀聲臣鍇曰投壷之矢也其制似箸人以之算數也踈收反行棊相塞謂之簺從竹塞塞亦聲臣鍇曰今博蒲馬箸其采有簺也四載反局戲也六箸十二棊也從竹慱聲古者烏胄作簙臣鍇按韓子秦昭王使人以鈎梯上華山以松柏之心為慱箭刻曰昭王與天神慱於此箭即心箸也本泊反藩落也從竹畢聲春秋傳曰篳門圭窬卑聿反蔽不見也從竹愛聲晏再反隿射所蔽者也從竹嚴聲臣鍇曰射雉之所以自鄣也語淹反禁苑也從竹御聲春秋傳曰澤之自篽臣鍇按漢書注池篽謂於水邊作小屋落鄣魚鳥臣以為篽禁苑之遮衛故張衡曰禁禦不若篽禦也疑舉反篽或作􆀦從又魚聲長六寸計歷數者從竹弄言常算乃不誤也臣鍇曰會意蘇判反數也從竹具讀若算臣鍇按春秋左傳不可算也蘇纂反此字本闕臣鉉等案孫愐唐韻引説文云喜也從竹從大而不𫐠其義今俗皆從犬又按李陽氷刋定説文從竹從夭義云竹得風其體天屈如人之笑未知其審私妙切文百四十五重十五簸也從竹甘象刑下其丌也凡箕之屬皆從箕臣鍇曰丌其下也居而反古文箕臣鍇曰此直象刑皆台文臣鍇曰象舌刑乎持之籕文箕古文箕臣鍇曰已上皆象形籕文箕揚米去粳也從箕從皮聲臣鍇按詩曰維南有箕不可以簸揚布火切文二重五下基也薦物之丌象形凡丌之屬皆從丌讀若箕臣鍇曰薦下籍以進之也居而反古之道人以木鐸記詩言從辵從丌丌亦聲讀與記同臣鍇按尚書春秋左傳皆曰每歲仲春道人以木鐸徇于路以求詩言行而求之故從辵辵行也丌也丌薦而進之也進之於上也會意故曰亦聲居意反五帝之書也從册在丌上尊閣之也莊都説典大册也臣鍇按五帝經傳之説不同諸儒多引易繫所云作者然易通論古者聖人之制作未必盡舉五帝據孔子家語黃帝顓頊堯舜禹為五帝尚書序少昊顓頊高辛唐虞為五帝史記與家語同國語次序黃帝以下凡五黃帝顓頊帝嚳堯舜也典言常道也言百也常行之道也尚書所謂大訓在東序司馬遷所謂金匱石室之書顛睓反古文典從竹巽也從丌顛此易卦為長女為風者蘇困反相付與之約在閣上也從丌田聲臣鍇曰閣所以承物禮曰天子之閣左逹五右逹五春秋左傳曰執曹伯廾宋人卤之字左音信必至反具也從丌聲臣鍇曰具謂僎具而進之也音蘇困反古文巽篆文巽置祭也從酋酋酒也下其丌也禮有奠祭者臣鍇曰祭進也奠置也置物而進之故尚書曰敢執壤奠尚書奠高山大川奠置定也庭硯反古文工從彡臣鍇曰彡音髟反法也從工弋聲臣鍇曰尚書百官承式規矩也申力反巧技也從工丂聲肯飽反規巨也從工象手持之形臣鍇曰今獨音炬指事水許反古文巨巨或從木矢矢者其中正也文四重三極巧視之也從四工凡㠭之屬皆從㠭臣鍇按周禮考工云展角之道展察視也四㠭同視也陟衍反室也從㠭從升窐宀中㠭猶齊也臣鍇曰塞從此叟或反文二音歷稀踈勻調也會意晉書有郭庚堪反飽也從甘肰臣鍇曰肰音然犬肉也會意於潛反猒或從以尤安樂也從甘甘匹耦也臣鍇曰禮曰子甚冝其妻會意神朕反古文甚文五重二詞也從口凡聲亦象口氣出也凡曰之屬皆從曰臣鍇曰今試言曰則口開而氣出也凡稱詞者虛也語氣之助也豫厥反告也從册曰臣鍇曰曰告之也會意側麥反何也從曰丐聲臣鍇曰詩曰曷不肅雍曷詞助曰隨往也讀若仍臣鍇按泰刻石文書乃字類此而冰反古文氣行貌從了聲讀若攸臣鍇曰音條尚書曰匱鬯一􅓒爾雅曰􅒾中尊也延秋反文三重三氣欲舒出包上礙於一也丂古文以為亐字又以為巧字凡丂之屬皆從丂臣鍇曰丂猶稽丂之意也刻保反亟詞也從丂從由或曰甹俠也三輔謂輕財者為甹臣鍇曰俠任俠也俠者便棲任氣自由之為也會意篇丁反願詞也從丂寧聲臣鍇曰今人言寧可如此是願如此也古人云寧飲建業水是也彌丁反反丂也讀若呵獻他反文四肯也從口亦聲也凡可之屬皆從可臣鍇曰可是肯也丂氣躓閡可則不復疑間故反丂反丂不閡也會意肯我反異也一曰不偶從大從可臣鍇曰大可是異也巨離反可也從可加聲詩曰哿矣冨人閉果反聲也從二可古文以為歌字臣鍇曰可亦氣道也故二可為聲哥猶歌也或借此為歌字更和反文四語所稽也從丂八象氣越亐也凡兮之屬皆從兮臣鍇曰舜歌曰南風之薰兮是也為有所稽考未便言之也言兮則語當駐駐則氣越亐也賢迷反驚辝也從兮旬聲臣鍇曰兮亦氣也息允反􆁎或從心氣也從兮義聲許移反乎者語之餘也從兮象聲上越揚之形也臣鍇曰凡言乎皆上句之餘聲也故曰從我者子乎去我者鄙己乎皆聲之餘也了餘聲氣上出而盡也指事魂徒反文四重一痛聲也從口在丂上凡號之屬皆從號臣鍇曰丂者痛聲不舒楊也指事候到反呼也從號虎聲臣鍇按詩曰誰之永號行高反文二於也象氣之舒亐從丂從一一者其氣乎之也凡亏之屬皆從亏臣鍇曰試言豫則口氣直平出也員須反氣損也從亏雐聲臣鍇曰氣闕則其出舒遲故從亏起為反虧或從兮弓也審慎之辝者從宩從兮周書曰粵三日丁亥臣鍇曰凡言粵皆在事端句首未便言之駐其言以審思之也粵三日是也心中暗數其日數然后言之宩審字也其聲氣舒久故從亏會意豫厥反驚語也從口從亏亏亦聲臣鍇曰口部已有疑誤重也况于反語平舒也從亏從八八分也爰禮説臣鍇曰指事爰禮即序所謂沛人印爰禮也古爰袁通備明反古文平字文五重二美也從甘匕聲凡旨之屬皆從旨臣鍇曰禮曰調以滑旨旨甘也職美反古文旨口味之也從旨尚聲臣鍇曰口試其味也射強反文二重一樂也從壴從口凡喜之屬皆從喜臣鍇按春秋左傳曰公喜而後可知也形於言色虛已反古文喜從欠與歡同恱也從心喜喜亦聲臣鍇曰喜在心喜見為此事是恱為此事也會意欣記反大也從喜否聲春秋傳吳有太宰嚭披鄙反文三重一陳樂立而上見也從􅋄豆凡壴之屬皆從壴臣鍇曰豆樹鼓之象之其上羽葆也象形陟具反立也從壴從寸持之也讀若駐臣鍇曰此樹鼓字樹木字從木時遇反夜戒守鼓也從壴蚤聲禮昏鼓四通為大鼓夜半三通為戒晨旦五通為發明讀若戚臣鍇曰周禮曰凡軍旅夜鼓􅿏一歇為一通千益反鼓聲也從壴彡聲白亨反美也從壴加聲間牙反文五郭也春秋之音萬物郭皮甲而出故謂之鼓從壴支象其手擊之也周禮六鼓靁鼓八面靈鼓六面路鼓四面鼖鼓臯鼓晉鼓皆兩面凡鼓之屬皆從鼓臣鍇曰郭者覆冒之意又鼓木也故為春周禮鼓人掌教六鼓以雷鼓鼓神祀以靈鼓鼓社祭以路鼓鼓鬼享以鼖鼓鼓軍事以鼛鼓鼓役事昆覩反籕文鼓從古臣鍇曰古聲大鼓也從鼓咎聲詩曰鼛鼓不勝家豪反大鼓謂之鼖鼖八尺而兩面以鼓軍事從鼓卉聲扶云反臣次立曰當從説文云鼓賁聲鼖或從革賁聲騎鼓也從鼓卑聲頻奚反鼓聲也從鼓隆聲杜冬反鼓聲也從鼓􅘢聲詩曰鼗鼓鼘鼘扶蓮反鼓聲也從鼓堂聲詩曰擊鼓其鼞吞匡反鼓聲也從鼓合聲臣鍇按相如賦曰鏗鏘鼞䶀洞心駭耳道合反古文䶀從革鼓無聲也從鼓咠聲蕩輒反鼓鼙聲從鼓嶽聲他合反文十重三還師振旅旅樂也一曰欲也登也從豆省聲凡豈之屬皆從豈臣鍇曰周禮師大捷獻愷作愷今借此為詞也丘里反康也從心豈豈亦聲刻海反也訖事之樂也從豈幾聲臣鍇按爾雅􅠟汔也故為訖巨希反文三古食肉器也從口象形凡豆之屬皆從豆臣鍇曰周禮斻人為簋實一觳崇尺厚半寸豆實三而成觳又曰豆中縣汪縣繩以正豆之柄觳三斗也人曰食一豆肉飲一豆酒中人之食也注云一豆酒當一升酒也笛奏反古文豆臣鍇曰象形木豆謂之梪從木豆蠡也從豆蒸省聲臣鍇曰今婚禮合用匏謂之已隱反豆屬也從豆聲俱卷反豆飴也從豆卯聲臣鍇曰飴餳也今豆名宛桓反禮器也從升持肉在豆上讀若鐙同臣鍇曰會意也丹增反文六重一行禮之器也從豆象形凡豐之屬皆從豐讀與禮同臣鍇曰禮體澧字從此蓮弟反爵之次第也從豐弟虞書曰平豑東作臣鍇曰令尚書作秩運匹反文二豆之豐滿者也從豆象形一曰鄉飲酒有豐俠者凡豐之屬皆從豐臣鍇曰象豆中所盛也麷􅾈灃從此孚弓反古文豐好而長也從豐豐大也盍聲春秋傳曰美而豔臣鍇曰容色豐滿也羊染反文二重一古祠器也從豆虍聲凡䖒之屬皆從䖒臣鍇曰戲亦從此許移反土鍪也從䖒號聲讀若鎬臣鍇曰鍪金屬土瓦也侯𫀆反器也從䖒㿾㿾亦聲闕真與反文三虎文也象形凡虍之屬皆從虍讀若春秋傳曰虍有餘臣鍇曰象文章屈曲也虎烏反騶虞也白虎黑文尾長於身仁獸食自死之肉從虍吳聲詩曰于嗟乎騶虞臣鍇按六韜慱物志林氏國經曰以鐻貫耳則耳環屬也篆文文九重三山獸之君從虐虎足象人足象形凡虎之屬皆從虎忽五反古文虎亦古文虎虎聲也從虎毄讀若隔溝厄反白虎也從虎昔省聲讀若冪臣鍇按今人多音酣準隋曹憲作爾雅音云音見又云梁有顧䖑費䖑不知其名音為酣民的反䖑屬也從虎去聲詞暫反黑虎也從虎倏聲臣鍇按爾雅注漢宣帝南郡獲白虎獻其皮骨瓜牙晉永嘉四年建平秭歸縣檻得黑虎如小虎而黑毛深為班尸竹尺虎竊毛謂之虦貓從虎戔聲竊淺也臣鍇按爾雅注引詩有貓有虎也昨間反虎文也從虎彡象其文也彼虬反虎貌也從虎乂聲偶蝎反虎貌也從虎氣聲疑反虎嗚也一曰師子從虎九聲臣鍇曰詩曰闞如虓虎享茅反虎聲也從虎斤聲語殷反易履虎尾􅊒􅊒恐懼一曰蠅虎也從虎􅽘聲臣鍇曰易曰震來􅊒􅊒軒逆反虎所攫盡明文也從虎寽聲古獲反委虒虎之有角者也從虎􅛣聲臣鍇曰春秋時晉有虒祁之官禠箎禠從此辛兹反黑虎也從虎騰聲徒朋反文十五重二虎怒也從二虎凡虤之屬皆從虤眼間反兩虎爭聲也從虤從曰讀若憖臣鍇曰曰音越會意言陳反分别也從虤對爭具讀若回臣鍇按左思魏都賦曰蒹葭贙會意預顯反文三飲食之用器也象形與豆同凡皿之屬皆從皿讀若猛美而反飲器也從皿弓聲臣鍇按史記田蚡學孔甲盤盂諸書謂盤盂之刻銘也貟須反小盂也從皿卯聲烏管反黍稷在器中也從皿成臣鍇曰春秋左傳奉盛以告曰潔齋豐盛示征及黍稷在器以祀者從皿齊聲子思反小甌也從皿有聲讀若灰或曰若賄延􅎁反䀁或從右飯器也從皿聲論孤反籀文盧器也從缶皿古聲昆覩反器也從皿弔聲真遙反盆也從皿央聲臣鍇曰漢長安城有覆盎門晏亢反盎或從瓦盎也從皿分聲步門反器也從皿寧聲臣鍇曰從此真與反盨負戴器也從皿須聲臣鍇按顔師古漢書注謂盨狀如盤如今賣食物者所戴楊憚傳作藪率武反器也從皿漻聲根卯反械器從皿必聲臣鍇曰謐從此彌畢反酸也作醯以以酒從酒並省從皿皿器也臣鍇曰會意顯繄反調味也從皿禾聲臣鍇曰詩曰亦有盉羹今詩作和借也户歌反饒也從水皿皿益之意也臣鍇曰會意伊昔反蒲器也從皿夃臣鍇等曰夃古乎切益多之義也古者以買物多得為夃故從夃以成反器中空也從皿㶳聲臣鍇曰㶳音盡寂泯反器虛也從皿中聲老子曰道盅而用之臣鍇曰盅而用之虛而用之也今作沖假借直柬反覆蓋也從皿酓聲思甘反仁也從皿以食囚也官漙説臣鍇曰韞從此會意塢門反澡也從􅍫水臨皿春秋傳曰奉匜沃盥臣鍇曰會意古翰反滌器也從皿湯聲臣鍇曰易云入卦相蕩從廣反文二十五重三凵盧飰器目柳條之象形凡凵之屬皆從凵遣如反凵或從竹去聲文一重一人相違也從大凵聲凡去之屬皆從去臣鍇曰凵即飯器也大象人也論語曰違之之一邦違之去也氣恕反去也從去曷聲臣鍇曰張衡賦曰回至朅來朅來去來也丘絶反去也從去夌聲讀若棘陵力膺反文三祭所薦牲血也從皿一象血形也凡血之屬皆從血臣鍇曰祭薦毛血也翾迭反血也從血亡聲春秋傳曰士刲羊亦無􅎺也臣鍇曰心上血也匆光反凝血也從血不聲臣鍇曰衃猶胚也普杯反氣液也從血􅩎􅩎亦聲臣鍇曰今作津借也將親反定息也從血甹省聲讀若亭臣鍇曰春秋左傳曰不敢寧居今作寧借也寧從此田丁反鼻出血也從血丑聲而叔反腫血也從血農省聲奴聰反俗農從肉農聲血醢從血醓聲禮記有醢以牛乾脯梁麴鹽酒也臣鍇曰周禮加豈之實醢他感反醢也從血菹聲齋居反蕰或從缶以血有所刉塗祭也從血幾聲臣鍇按周禮肆師掌祈或為􅤀成廟則釁之雍人舉羊升屋自中屋南面刲羊血流于前乃降是􅤀為羊血也夾室則用雞為衈士師職則云刏珥明當刏也作祈假借本作􅤀也臣希反憂也從血卩聲一曰鮮少也臣鍇按春秋傳曰君命寡君同恤社禝恤者言憂之切至也相室反傷痛也從血聿皕聲周書曰民罔不衋傷心讀若憘希式反羊凝血也從血舀聲臣鍇案陶氏本草注云宋時大官作䘓削藕皮落其中血不凝知藕之散血然則䘓血羹也慳暗反䘓或從覆也從血大聲侯臘反汚血也從血蔑聲彌恱反文十五重三説文解字繫傳第九
