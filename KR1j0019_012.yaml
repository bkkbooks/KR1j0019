body:
  text: 文二重一出也象草過􅋄枝莖益大有所之一者地也凡之屬皆從之臣鍇曰按春秋傳將之晉將之齊是之為出也之者枝也象草木之枝東西旁出而常連於根本也孔子在齊曰歸歟孔曰奈何去墳墓也象形真而反草木妄生從之在土上讀若皇臣鍇曰妄生謂非所生而生史曰芳蘭當門又莠生門上故從之在土上土上益高非其冝也會意戶荒反古文臣鍇曰王者厚也與土義同文二重一周也從反之而匝也凡匝之屬皆從匝周盛説臣鍇曰日一日行一度一歲往反而周匝也周盛當時之人色也從子論語色孛如也是此臣鍇曰言人色勃然壯盛似草木之茂也子人也從子者小子不能言以色知之也會意蒲妹反止也從􅜨盛而從一橫止之貌也臣鍇曰按字書蔽􅙻小貌即似反草木至南方有枝任也從􅜨羊聲臣鍇曰南方主化育故曰有枝任也毛詩或用南為任音也音荏叔甘反古文文六重一進也象草木生出土上凡生之屬皆從生也臣鍇曰土者吐出萬物尚書曰丕冒海隅蒼生春秋傳曰食土之毛故生從全土色反草盛也從生上下逹也臣鍇曰察草之生上盛者其下必深根也甫蛩反生也從生彥省古文臣鍇曰象垂也文一重一草木華也從􅑰亏聲凡􅒧之屬皆從􅒧况于反或從草夸臣鍇按爾雅苵薊其實荂薊莖頭皆有臺名荂荂即其實臣鍇曰以為草木之將生葉先生細葉蓊然如鴈頸也臺若今人言菜臺也郭璞又言江東呼華為荂音敷盛也從􅒧韋聲詩曰萼不臣鍇曰華葉之盛也故曰棠椂之華鄂不于鬼反文二重二榮也從草從􅒧凡華之屬皆從華臣鍇按爾雅華荂也木謂之華呼華反草木曰華也從華從白臣鍇按漢書禮樂志曰華燁曄固靈根是也此會意炎捷反文二木之曲頭止不能上也凡禾之屬皆從􅬘臣鍇曰木方長上礙於物而曲也堅兮反多小意而止也從禾只支聲一曰木也臣鍇曰汖即止也按字書曲枝果也之巳反䅩也從禾又句聲又者從丑一曰木名闕臣鍇曰丑者束縳也故從丑省積詘曲不伸之意也䅩之果其狀詰屈亦取此為名按本草枳梖樹徑尺葉似桑柘子作房似珊瑚核在其專人噉之即䅩也又曰此亦竒物故自别為字也俱吕反文三留止也從禾從尤旨聲凡稽之屬皆從稽臣鍇曰木之曲止也尤者異也有所異處必稽考之考之即遲留也尚書曰曰若稽古帝堯居迷反特止也從稽省卓聲臣鍇曰特止者卓立也稽止也誅角反而止也從稽省咎聲讀若皓賈侍中説稽三字皆木名也臣鍇曰詘曲而後止也咎古亦音為皋陶字按書細綴也工皓反文三黍也從黍髟聲火牛反漆垸已復漆之從漆包聲臣鍇曰垸謂以骨灰和漆而為漆之骨也普效反文三縳也從口木凡束之屬皆從束臣鍇曰束薪也口音圍象纏淮南子荷纒束薪者曰九方堙會意施録反分别簡之從束八八分别也臣鍇曰開其束而束之也會意巳限反小束者也從束幵聲讀之若繭臣鍇曰今俗以鐙炷為一也堅輦反戾也從束刀刀者剌之也臣鍇曰剌乖違也束而相乖害者莫若束刀易注曰近而不相得則爭魚跳蹳剌亦不順之名也會意勒割反文四橐也從束圂聲凡橐之屬皆從㯻臣鍇曰束縳囊橐之名春秋國語曰侯使於齊者㯻載而歸作㮯稛假借也之言溷也物雜厠其中也戶本反囊也從㯻省石聲臣鍇曰按字書有底曰囊無底曰橐然則橐今纒腰下者春秋公羊傳舉大橐而至視之闖然公子楊生也他各反橐也從㯻襄省聲那當反車上大橐從㯻省咎聲詩曰載櫜弓矢臣鍇曰今弓胡蔍也古勞反橐張大貌從㯻省陶省聲符宵反文五回也象回匝之形凡口之屬皆從口于歸反天躰也從口睘聲臣鍇曰此方貟字雨專反圜也從口專聲杜酸反規也從口肙聲臣鍇曰小圜也今人言用姢姢義出此似緣反回也從口云聲羽文反圜全也從口貟聲讀若貟臣鍇曰此音運幅貟字也干問反轉也從口中象回轉形臣鍇曰渾天之氣天地相成天周地外隂陽日月五星回薄其中也戶瓌反古文臣鍇曰直象回轉之形畫計難也從口啚聲難意也臣鍇曰口其規畫也圗畫必先規畫之圖者吝嗇難之義也莊子曰魯公為圗畫有一人舐筆和㕓公使視之方解衣盤旋公曰真畫者也此難意也田廬反回行也從口睪聲尚書曰圛圜升雲半有半無讀若驛臣鍇按洪範稽疑卜五曰圛曰霽説曰圛者象氣絡繹不連屬也是半有半無也今卜者以兆躰蒙晦不分為水兆亦其義也以陟反邦也從口或聲臣鍇曰口其疆境也或亦域字古或反宫中道從口象宫垣道上之形詩曰室家之壼臣鍇曰山象歧道入宫也口其外闕也若渾反廩之園者從禾在口中園謂之囷方謂之京臣鍇曰詩曰如京如坻也京高丘也囷取象焉牽輪反養畜之間也從口卷聲群宛反苑有垣也從口有聲又禽獸有囿臣鍇曰苑其周垣名也園樹果菜也周禮有囿遊之禁亦樹以果菜也延救反籕文從二林所以樹果也從口袁聲羽先反種菜曰圃從口甫聲臣鍇曰不如老圃是也不雨反就也從口大徐鍇曰春秋左傳曰楨有禮因重固能大者衆圍就之也史記曰就之如日言近則大也又大字人之象也天因就人之為也尚書曰天視自我民視天聽自我民聽伊申反下取物縮藏之從又從口讀若籋字臣鍇曰人謂禽獸就地物為囚女洽反獄也從口今聲臣鍇曰囹者櫺也櫳檻之名里丁反守之也從口吾聲臣鍇曰守禦之意也研許反擊也從口人在口似求反四塞也從口古聲臣鍇曰周禮曰負固不服守天下之要塞也淮南子謂九州之險為九州之塞大汾也黽厄也荆院也方城也殽阪也井陘也今庇也句注也居庸也古路反守也從口韋聲于歸反故廬也從木在口中臣鍇曰舊所居廬故其木久而困弊也苦悶反古文困臣鍇曰止即廬舍厠也從口象豕在其口中也會意臣鍇曰豕食不潔也戶本反譯也從口化聲率鳥文二重一海介蟲也居陸名在水名蜬象形也古者貨貝而寶龜周而有泉到秦廢貝行錢也凡貝之屬皆從貝臣鍇曰下象其垂足尾形龜可決疑故寶之泉即錢也謂之泉者欲其貿易流行不壅積也若水之壅則為害矣輔每反貝聲從小貝也臣鍇曰象連貫小貝相叩之聲也會意斯果反財也從貝有聲臣鍇曰國上所有也若吳貴縞鄭貴紵也虎每反人所寶從貝才聲臣鍇曰可以入用也自來反財也從貝化聲臣鍇曰可以交易曰貨貨化也尚書曰貿遷有無化居毁過反資也從貝為聲臣鍇按字書云古貨字矩利反貨也從貝次聲臣鍇曰人所齎持也易曰喪其資斧津司反貨也從貝萬聲臣鍇曰人所賴也魯械反富也從貝辰聲也臣鍇曰振也振起之也止忍反多才也從貝臤聲臣鍇曰臤者臣執事也欲其用之如貝之行也如貝之積聚也詩曰思皇多士生此王國由堅反飾也從貝卉聲又逼媚反臣鍇曰尚書賁若草木卉草也傳寫多聲字房文反又鄙媚反以禮物相奉慶也從貝加聲臣鍇曰按史記漢髙帝曰賀錢萬是也侯箇反獻也從貝工聲獻納總稱尊嚴臣鍇按貢公獻之也周禮太宰以九貢致邦國之用一曰祀貢二曰嬪貢三曰器貢四曰幣貢五曰材貢六曰貨貢七曰服貢八曰遊貢九曰物貢古弄反見也從貝從兟臣鍇曰進見也貝為禮也尚書曰贊贊襄哉子旦反會禮也從貝盡聲臣鍇曰孟子歸賮是也似忍反持遺也從貝齊聲臣鍇曰持以遺人也春秋傳曰自齎其一子西反施也從貝代聲借也臣鍇曰春秋傳曰陳氏厚貸焉是也他代反從人求物也從貝弋聲借也臣鍇曰史記曰漢武帝時縣官無錢從人貣馬是也他得反遺也從貝各聲勒故反臣次立桉徐鉉曰從路省乃得聲物相增加也從貝朕聲一曰送也副也臣鍇曰今鄙俗謂物餘為賸古者一國嫁女二國往媵之媵之言送也副貮也義出于此也以證反玩好相送也從貝曽聲臣鍇曰贈增也既辝又以此增益之也春秋傳曰郊勞至于贈賄是也昨鄧反移子也從貝皮聲臣鍇曰春秋傳楚薳啓疆言曰齊與晉貱此久矣寡君無適與也而傳諸君慱媚反賜也從貝省聲臣鍇曰故端木賜字子贛也古弄反籕文省作賜也從貝來聲周書曰賚爾秬鬯臣鍇曰天下罔不欣賴也詩頌曰徂賚孝孫尚書曰大賚于四海勒戒反賜有功從貝尚聲臣鍇曰賞之言尚也尚其功也賞以償之也式掌反豫也從貝易聲臣鍇曰從難易之易賜之言易也有故而與之也禮記曰慶賜逐行無有不當絲義反重次弟物也從貝也聲臣鍇曰路之邪次弟為迆物之重次弟為貤也弋示反有餘賈利也從貝嬴聲臣鍇曰春秋傳曰賈欲贏而惡囂乎是也夷嬰反贏也從貝剌聲臣鍇按晉灼注史記無賴曰江湖間謂小兒無利入於家曰無賴利即贏也上同恃也從人守貝有所恃也臣鍇曰春秋傳魯申豐曰貨以藩身又史記貨殖傳巴寡婦者以財自衛不見侵也會意得缶反積也從貝寧聲臣鍇曰當言寧亦聲少亦字也會意竹吕反副益也從貝二聲二古文二字耳臣鍇曰副二者相禆益也春秋傳曰齊侯器二不匱會意曰至反所敬也從貝聲臣鍇曰貝者贈賄好貨忠臣嘉賔得盡其心也音眠必人反古文也從貝余聲臣鍇曰今人謂遲緩為賖也式車反貸也從貝世聲時卸反以物質錢也從敖貝敖者猶放貝當復取之一曰最臣鍇曰史記注謂男無娉財以身自質于妻家為贅壻敖者放也最者出也附贅之義老子曰餘食贅行贅獨出也會意之芮反以物相贅從貝斦聲臣鍇曰質實也事凝虛以人物實之也之日反易財也從貝丣聲臣鍇曰貿猶亂也交至之義門豆反散財用也從貝弗聲臣鍇曰財散出如湯沸然高士傳子夏曰憚為子費扶味反求也從貝束聲臣鍇曰責者迫迮而取之也史記李斯殺二世為督責之政也側革反賈市也從貝西聲一曰坐賣售也臣鍇曰漢書胡建傳監軍為賈區尚書曰肇牽車牛逺服賈謂逺就事于坐賈而買之也公雅反竹賈也從貝商省聲臣鍇曰易啇旅不行春秋傳曰鄭啇人弦髙將貨于周行賈也諸家書傳並假啇字升羊反買賤賣貴者從貝反聲臣鍇曰善販者旱則資舟水則聚車人棄我取與當情反也方萬反市也從网貝聲孟子曰登壟斷而网市利臣鍇按孟子曰古之為市以其所有易其所無有賤丈夫登壟斷網市利然則征啇自賤丈夫始也壟斷高地也故列子曰無登壟斷高謂登高望見利則取之也忙戒反賈少也從貝戔聲臣鍇曰賤之言踐輕也目見反斂也從貝武聲臣鍇曰賦者分也分取之分也方布反欲物也從貝今聲臣鍇曰貪婪也春秋傳縉雲氏不才子聚斂積實不知紀極吐含反損也從貝從乏聲臣鍇曰當言從乏乏亦聲脫誤也會意悲儉反財分少也從貝分聲臣鍇曰按原憲曰無財謂之貧見分則少也當言分亦聲脫誤也會意粥巾反古文從山分聲臣鍇曰家貧也原憲甕牗桑樞是室屋之貧也上同庸也從貝任聲臣鍇曰庸功也自賃自為功庸以求食也春秋傳曰申解虞僕賃于野任者負荷也此脫亦聲字會意女心反以財枉法相謝從貝求聲一曰戴質也臣鍇曰非理而求之也巨牛反以財有所求從貝冓聲臣鍇曰購遘遇也求遇之人也漢法購書也工豆反齎財卜問為從貝匹聲讀若所臣鍇曰詩曰握粟出卜是也楚辝曰懷桂糈而要之史記曰司馬季主曰卜而不中不見奪糈借糈字也山吕反小罰以財自贖從貝此聲漢律民不徭資錢二十二臣鍇按史記張釋之以資為郎即今州縣吏以身應役是也資錢即今庸直也子司反南蠻賦也從貝宗聲臣鍇曰賨者總率其所有而已不切責之也才冬反也從貝聲古文睦字讀若育臣鍇按彭羕曰自衒賣龎統是也寅六反物不賤從貝臾聲臣鍇曰臾音匱短位反從貝賣聲臣鍇曰以財贖罪實燭反頸飾也從二貝臣鍇曰蠻夷連貝為纓絡是也嬰字從此史成反又一盈反文五十九重三國也從口先王之制尊卑有小大從卩凡邑之屬皆從邑臣鍇曰有宗廟先君之主曰都無曰邑邑曰築築曰城口其城郭也應執反國也從邑聲臣鍇曰古謂封諸侯為邦故尚書曰乃命諸王而邦之蔡漢諱邦故兩漢無稱張華慱物志曰東夷有國謂國為邦行酒為行觴秦之遺也北江反古文臣鍇按春秋傳曰分之土田陪敦命之伯禽封於少昊之虛周制天子地方千里分為百縣縣有四郡故春秋傳曰上大夫受郡是也至秦𥘉天下置三十六郡焉以監其郡縣從邑君聲臣鍇按髙誘淮南子注曰周制天子地千里分為百縣縣有四郡郡有四鄙瞿運反有先君之舊宗廟也都從邑者聲周禮制國五百里為都臣鍇曰按周禮四縣為都丁沽反五家為鄰從邑粦聲里神反百家為鄼鄼四里也從邑贊聲南陽有鄼縣臣鍇曰按周禮五家為鄰五鄰為里二十五家也四里為鄼百家也五鄼為鄙五百家也五鄙為縣二千五百家也五縣為遂一萬二千五百家也祖滿反五鄼為鄙從邑啚聲慱美反距國百里為郊從邑交聲臣鍇按爾雅邑外謂之郊古看反屬國舍從邑氏聲臣鍇曰諸侯來朝所舍為邸邸有根抵也根本所在也丁禮反郭也從邑孚聲臣鍇曰春秋傳曰伐宋入其郛郛郭也郛猶祔也草木華房為樹在外苞裹之也弗扶反境上行書舍從邑垂垂邊也臣鍇曰郵之言過也使所過也宇牛反國甸大夫稍稍所食邑從邑肖聲周禮曰任地在天子三百里之內臣鍇曰謂天子之曰稍稍以封大夫也山召反鄯善西胡國也從邑善善亦聲臣鍇曰按後漢書西域鄯善班超所護也時扇反夏后時諸侯夷羿國也從邑窮省聲臣鍇曰后羿之國也巨弓反周封黃帝之後于􅠥也從邑契聲讀若萴上谷有􅠥縣臣鍇按今諸書多作萴字古諸反炎帝之後薑姓所封周素外家國從邑台聲古扶風斄縣是也臣鍇曰詩曰即有邰家室他來反周文王所封在右扶風美陽中外鄉從邑支聲臣鍇按顔之推家部本音竒後人始音抵也臣伊反􅑢或從山支因岐山以名之也古文􅑢從枝從山作臣鍇曰按字書以岐為山名􅑢為邑名按孟子太王即就岐山之下而居指山之名更别無邑名故許慎三字並同也周王國在古扶風美陽從邑分聲布巾反美陽亭即豳也民俗以夜市有豳山從山從豩闕臣鍇按漢書百官表大率十里為亭亭有長古扶風縣名也從邑眉聲閩之反古扶風郁夷也從邑有聲臣鍇按漢書北郁郅縣於六反古扶風縣名也從邑雲聲下古反夏后同姓所封戰于甘者在鄠有扈國也有甘亭從邑戶聲臣鍇曰春秋傳曰屈蕩扈之杜預注曰扈止也楚辝曰扈江籬與薛芷王逸注曰扈披也同上古文扈從山弓臣鍇曰從辰巳之已毛詩陟彼屺兮則從戊巳之巳右扶風鄠鄉從邑崩聲沛城父有剻鄉讀若陪臣鍇按史記漢有剻成侯周緤部梅反右扶風鄠鄉從邑且聲且渠反右扶風鄠鄉盩屋縣從邑赤聲吼作反周文王所都在京邑桂陵西南從邑豐聲臣鍇按春秋傳康有酆宫之朝杜預曰始平鄠縣東酆邑臺也臣鍇曰為許愼地名多見春秋左傳地名精考莫精于杜預比于今又近故春秋地名一取于杜預又草木鳥獸之名莫近于爾雅及新修本草終古不刋故臣鍇曰一切以為凖的孚洪反京兆縣周厲王子友所封從邑奠聲宗周之滅鄭徒漕洧之上今新鄭是也臣鍇按鄭𥘉封在今華州杜預云後徙滎陽宛陵縣西南新鄭城劉熙釋名曰鄭町也其地町然平也直敬反左馮翊部陽縣從邑合聲詩曰在郃之陽侯匝反京兆藍田鄉也從邑口聲懇走反京兆杜陵鄉從邑樊聲臣鍇曰此即樊川漢曰御宿在長安城南終南山北連芙蓉園曲江也父闌反左馮翊縣從邑麃聲臣鍇按秦穆公作鄜畤以祭包拂扶反左馮翊有䣝陽亭從邑屠聲田吾反左馮翊高陵從邑由聲田溺反左馮翊谷口也從邑年聲讀若寧泥賢反隴西上邽也從邑圭聲涓兮反天水秋部從邑咅聲臣鍇曰部屬也部之言簿也分簿之也故吕氏春秋曰黎丘北部大玄曰方州部分部諸縣或為四或為二也盤五反弘農縣庾地從邑豆聲單頭反河南縣直城門官陌地也從邑辱聲春秋傳曰成王定鼎于郟鄏儒曲反周邑也從邑輦聲里典反周邑從邑祭聲臣鍇按春秋公周公之子所封又春秋釋例鄭地祭在陳留長垣縣比祭城側戒反河南洛陽北止山上邑從邑止聲蒙匡反周之邑從邑尋聲臣鍇按杜預曰可南鞏縣西南有地名鄩徐林反周邑也在河內從邑希聲臣鍇曰按杜預曰河內野王縣西南絺城是丑脂反河南泌水卿從邑軍聲魯有鄆地臣鍇按鄆古嬴姓國又杜預曰魯叔孫帥師疆鄆田此東鄆莒魯所爭者在城陽姑幕縣西南員亭又昭公居于鄆即西鄆東郡廩丘縣東有鄆城是也于藴反故啇邑自河內朝歌以北是也從邑比聲臣鍇按字書紂都城北曰邶南曰鄘東曰衛輔妹反周武王子所封在河內野王是也從邑于聲讀又若區字是臣鍇曰杜預曰扶風雍縣東南𨝍亭火于反殷諸侯國在上黨東北從邑聲古文利字啇書西伯戡􅧰里西反晉邑也從邑召聲食要反晉邑食也從邑冥聲春秋傳曰伐鄍三門是也臣鍇按杜預闕之也民丁反晉邢侯邑從邑畜聲臣鍇按杜預春秋釋例闕之也許六反晉之溫地從邑矦聲春秋傳曰爭鄇田胡遘反晉邑也從邑必聲臣鍇按春秋晉楚戰于邲脾必反晉大夫叔虎之邑也從邑谷聲丘逆反河東聞喜縣從邑非聲步雷反河東聞喜邑從邑虔聲其延及仲郎河東聞喜鄉從邑匡聲區王反河東臨汾地也從邑癸聲即漢之所祭后土處臣鍇按杜預曰濟桓公會于葵丘葵丘宋地陳留外黃縣有葵丘九月乃盟晉為地主無緣欲會而不盟臣鍇按許慎直言鄈是河東臨汾鄈耳不言鄈是葵丘與杜預之言同也巨規反周公子所封地近河內懷從邑幵聲臣鍇按杜預曰今廣平襄國縣賢經反太原縣從邑烏聲臣鍇曰今太原塢縣烏古反太原縣從邑示聲臣鍇按杜預曰太原祁縣巨夷反魏郡縣也從邑業聲魚劫反鄭地有亭也從邑井聲賢經反趙邯鄲縣從邑甘聲胡安反邯鄲縣從邑單聲得干反周武王子所封國從邑旬聲讀若泓在晉地臣鍇曰文王弟所封伯爵詩所謂四國有王郇伯勞之也息倫反清河縣從邑俞聲臣鍇曰史記欒布清河俞人是也式于反常山縣也從邑高聲世祖所即位今為高邑臣鍇按字書常山鄗縣火屋反又大各反巨鄜縣也從邑梟聲臣鍇按史記孔子弟子有鄡單字子家吕么反涿郡縣從邑莫聲臣鍇按字書河間鄚縣北齊邢峙北河間鄚人也磨各反北地郁郅縣從邑至聲臣鍇按裴駰漢書音義云郅至也司馬相如封禪書曰爰周郅隆之日反北方長狄國也在夏為防風氏殷為汪茫氏從邑聲春秋傳曰瞞侵齊是也臣鍇按張華慱物志瞞長二丈也山尤反炎帝太嶽之胤甫侯所封在潁川從邑無聲讀若許臣鍇按史記鄭世家云許公惡鄭伯于楚許字作此無邑蓋諸書假借許字欣巨反潁川縣從邑亢聲看浪反潁川縣從邑匽聲于建反潁川縣從邑夾聲臣鍇按杜預曰今鄭域襄城郟縣古洽反新郪汝南縣從邑妻聲臣鍇曰今廣漢有郪縣千私反姬姓之國在淮北從邑息聲今汝南新息是也臣鍇曰即春秋息侯也司弋反汝南邵陵里從邑自聲讀若奚臣鍇曰李陽氷云即許慎所居之里移雞反汝南鮦陽亭從邑旁聲薄皇反蔡邑也從邑臭聲春秋傳曰鄓陽人女奔之臣鍇曰杜預衛地鄓氏又名垂葭髙平巨野西南鄓亭又蔡地鄓陽杜預闕之也古役反曼姓之國今屬南陽也從邑登聲徙亘反鄧國地也從邑憂聲春秋傳曰鄧南鄙鄾人攻之也臣鍇按杜預曰鄧縣南河水之北有鄾城乙求反南陽清陽鄉從邑號聲臣鍇按字書卿在南陽戶髙反南陽棗陽鄉從邑巢聲助交反今南陽穰縣是從邑襄聲臣鍇曰即秦穰侯魏冉所封假借穰字耳張反南陽穰鄉從邑婁聲里于反南陽西鄂亭從作此沛假借也慱梅反宋下邑從邑丙聲臣鍇曰按齊有邴意兹公羊傳以魯祊田作邴字郭璞注穆天子傳亦同許愼所不取也布定反沛國縣從邑虘聲今鄼縣臣鍇曰即蕭何所封也粗何反地名也從邑少聲升沼反地名也從邑臣聲之忍反宋地從邑聲讀若讒臣鍇曰按春秋左傳宋有般士咸反宋魯間地從邑晉聲臣鍇曰按杜預北海都縣西北有訾城子而反周文王子所封國從邑告聲臣鍇按杜預云文王子那季之弟所封子爵又鄭師取郜宋邑濟隂城武縣東南有南郜城工督反又工到反衛地今濟隂鄄城從邑垔聲臣鍇按杜預曰陳郡鄄城也鄭史記曰晉伐阿鄄當七國時屬齊也擊箭反卭地在濟隂縣從邑工聲臣曰又蜀臨卭縣俱重反祝融之後妘姓所封潧洧之間鄭滅之從邑會聲臣鍇按杜預曰榮陽密縣東鄶城是古會反鄭邑也從邑從元聲臣鍇按春秋左傳圍邧新城杜預闕之也杜預云秦地此云鄭地傳寫誤擬逺反鄭地從邑延聲臣鍇按春秋傳鄭地杜預闕之不可知也臣鍇曰以為杜預之沒身于春秋而其地名有不知而闕者則後代雖有獨得者亦未可以取憑焉弋然反琅邪莒邑從邑更聲春秋傳曰取郠臣鍇曰按杜預闕之也古橫反妘姓之國從邑禹聲春秋傳曰鄅人藉稻讀若規矩臣鍇按杜預鄅琅邪開陽縣子爵風姓于甫反魯縣也古邾國帝顓頊之後所封從邑芻聲臣鍇按趙岐孟子題辝邾國至孟子時攺曰鄒側留反邾下邑地從邑余聲魯東有䣄城讀若塗臣鍇曰古音塗今音徐大都反附庸國在東平亢父邿亭從邑寺聲春秋傳曰取邿下臣鍇按杜預又齊地邿平隂城西有邿山申之反魯下邑孔子之鄉從邑取聲臣鍇按春秋左傳聊人紇是也側侯反魯孟氏邑也從邑成聲臣鍇按杜預云姬姓國周公弟郕叔處之後在東平剛縣西南郕亭又魯縣邑於郕春秋及杜預但作郕在泰山巨平縣東南郕是征反周公所誅䣍國在魯從邑奄聲臣鍇按尚書春秋左傳皆作奄歐撿反下邑也從邑雚聲春秋曰齊人來歸酄是臣鍇按春秋左傳作歡字假借也杜預曰濟北地丘縣西有下歡亭火桓反魯亭也從邑良聲臣鍇按春秋桓公及齊人戰于郎又莊公築臺于郎杜預曰髙平郡髙平縣東有郁郎亭臣以為此字本因邑名而立故從邑他放此魯當反奚仲之後湯左相仲虺所封國在魯薛縣是也從邑丕聲臣鍇按仲虺所封在魯薛縣部東萊安縣勻低反姒姓國在東海從邑曽聲臣鍇按杜預鄫姬姓與説文同或寫作姒誤琅邪鄫縣又名鄫行自陵反琅邪郡名也從邑牙聲臣鍇曰今沂州也又語未定之詞寅遮反琅邪縣一名純德從邑夫聲弗無反齊地也從邑黍聲此誤反齊之郭氏虛善善不能進惡惡不能退是以亡國從邑享聲臣鍇按孔子家語云中行氏善善不能進惡惡不能退賢者知其不進巳踈之不肖者知其惡巳怨之怨讎並在於己鄰國講兵于郊中行氏不亡何待唯太公六韜周志三十六國云郭氏此云齊郭氏當是靖郭之後乎又按杜預虢一名郭都于上陽在弘農陜縣棗南虢或作郭古落反齊地從邑兒聲春秋傳曰齊高厚定郳田臣鍇按杜預即小邾一名也東海昌盧縣東北有郳城擬低反郣地從邑孛聲一曰地之起者曰郣臣鍇曰疑勃海近此字又周禮土有郣壤當作此假借勃字也步勿反國也齊桓公之所滅從邑覃聲臣鍇按杜預東海褰冥是也子爵魯莊十年滅杜簷反地名也從邑句聲群許反陳留鄉從邑亥聲苟孩反故國在陳留從邑􅥘聲臣鍇按春秋傳宋以伐載召蔡人即載國子戴反地名從邑燕聲一遷反地名也從邑丘聲起秋反地名從邑如聲熱除反地名也從邑丑聲女有反地名也從邑几聲謹美反地名從邑翕聲臣鍇曰今作歙縣也欣急反地名從邑求聲柔反地名從邑嬰聲伊請反地名從邑尚聲澄沆反地名從邑聲臣鍇按杜預紀地東莞臨朐縣東南城脾并反地名也從邑虛聲忽五反地名從邑火聲呼朵反地名從邑翏聲臣鍇疑此則春秋蓼國字里皎反地名也從邑為聲居危反地名從邑屯聲鹿孫反地名也從邑舍聲申車反地名從邑盍聲臘反地名從邑乾聲骨安反地名從邑聲讀若淫力甚反地名從邑山聲色間反地名從邑興聲香應反地名從邑聲古堂字特郎反姬姓之國從邑從馮聲臣鍇曰今作馮也父重反汝南安陽鄉從邑省聲庫拜反汝南上蔡亭從邑甫聲分武反南陽縣從邑聲臣鍇曰今為鄧州縣里反地名從邑聲親延反南郡縣孝惠三年改名宜城從邑焉聲于乾切從反字從此闕文一百八十二重六鄰道也從邑從凡􅣑之屬皆從􅣑臣鍇曰二邑為鄰也會意下降反國離邑民所封鄉也嗇夫别治從􅣑皀聲封圻之內六鄉治之也臣鍇曰當許慎其時皀音香臣按周禮淮南子云甸有鄰有里有鄼有鄙有郡有縣有􅨕故曰國離邑離邑别邑也大夫所封周禮有卿大夫嗇夫秦漢已來官也鄭玄為鄉嗇夫也漢書百官表云大率十里一亭亭有長十亭一鄉鄉有三老有䄮嗇夫遊徼三老掌教化嗇夫職聽訟收賦稅遊徼主盜賊軒良反邑中道從􅣑共言在邑中所共恨絳反篆文從􅣑省
