body:
  text: 文二重一出也象草過􅋄枝莖益大有所之一者地也凡之屬皆從之臣鍇曰按春秋傳將之晉將之齊是之為出也之者枝也象草木之枝東西旁出而常連於根本也孔子在齊曰歸歟孔曰奈何去墳墓也象形真而反草木妄生從之在土上讀若皇臣鍇曰妄生謂非所生而生史曰芳蘭當門又莠生門上故從之在土上土上益高非其冝也㑹意戸荒反古文臣鍇曰王者厚也與土義同文二重一周也從反之而帀也凡帀之屬皆從帀周盛說臣鍇曰日一日行一度一歳徃反而周帀也周盛當時之人色也從子論語色孛如也是此臣鍇曰言人色勃然壯盛似草木之茂也子人也從子者小子不能言以色知之也㑹意蒲妹反止也從􅜨盛而從一横止之皃也臣鍇曰按字書蔽􅙻小皃即似反草木至南方有枝任也從􅜨羊聲臣鍇曰南方主化育故曰有枝任也毛詩或用南為任音也音荏叔甘反古文文六重一進也象草木生出土上凡生之屬皆從生也臣鍇曰土者吐出萬物尚書曰丕冐海隅蒼生春秋傳曰食土之毛故生從全土色反草盛也從生上下逹也臣鍇曰察草之生上盛者其下必深根也甫蛩反生也從生彦省古文臣鍇曰象垂也文一重一草木華也從􅑰亏聲凡􅒧之屬皆從􅒧况于反或從艸夸臣鍇按爾雅苵薊其實荂薊莖頭皆有臺名荂荂即其實臣鍇曰以為草木之將生葉先生細葉蓊然如鴈頸也臺若今人言菜臺也郭璞又言江東呼華爲荂音敷盛也從􅒧韋聲詩曰萼不臣鍇曰華葉之盛也故曰棠椂之華鄂不于鬼反文二重二荣也從艸從􅒧凡華之屬皆從華臣鍇按爾雅華荂也木謂之華呼華反草木曰華也從華從白臣鍇按漢書禮樂志曰華燁曄固靈根是也此㑹意炎㨗反文二木之曲頭止不能上也凡禾之屬皆從􅬘臣鍇曰木方長上礙於物而曲也堅兮反多小意而止也從禾只支声一曰木也臣鍇曰汖即止也按字書曲枝果也之巳反䅩也從禾又句声又者從丑一曰木名闕臣鍇曰丑者束縳也故從丑省積詘曲不伸之意也䅩之果其状詰屈亦取此爲名按本草枳梖樹徑尺葉似桑柘子作房似珊瑚核在其耑人噉之即䅩也又曰此亦竒物故自别爲字也俱吕反文三留止也從禾從尤旨声凡稽之屬皆從稽臣鍇曰木之曲止也尤者異也有所異處必稽考之考之即遲留也尚書曰曰若稽古帝尭居迷反特止也從稽省卓声臣鍇曰特止者卓立也稽止也誅角反而止也從稽省咎声讀若皓賈侍中說稽三字皆木名也臣鍇曰詘曲而後止也咎古亦音爲皐陶字按書細綴也工皓反文三黍也從黍髟声火牛反桼垸已復桼之從桼包声臣鍇曰垸謂以骨灰和桼而為桼之骨也普効反文三縳也從口木凡束之屬皆從束臣鍇曰束薪也口音圍象纏淮南子荷纒束薪者曰九方堙㑹意施録反分别簡之從束八八分别也臣鍇曰開其束而束之也㑹意巳限反小束者也從束幵声讀之若繭臣鍇曰今俗以鐙炷為一也堅輦反戾也從束刀刀者剌之也臣鍇曰剌乖違也束而相乖害者莫若束刀易注曰近而不相得則争魚跳蹳剌亦不順之名也㑹意勒割反文四橐也從束圂声凡橐之屬皆從㯻臣鍇曰束縳囊橐之名春秋國語曰侯使於齊者㯻載而歸作㮯稛假借也之言溷也物雜厠其中也戸本反囊也從㯻省石声臣鍇曰按字書有底曰囊無底曰橐然則橐今纒腰下者春秋公羊傳舉大橐而至視之闖然公子楊生也他各反橐也從㯻襄省声那當反車上大橐從㯻省咎声詩曰載櫜弓矢臣鍇曰今弓胡蔍也古劳反橐張大皃從㯻省匋省声符宵反文五回也象回帀之形凡口之屬皆從口于歸反天躰也從口睘声臣鍇曰此方貟字雨專反圜也從口專声杜酸反䂓也從口䏍声臣鍇曰小圜也今人言用姢姢義出此似縁反回也從口云声羽文反圜全也從口貟声讀若貟臣鍇曰此音運幅貟字也干問反轉也從口中象回轉形臣鍇曰渾天之气天地相成天周地外隂陽日月五星回薄其中也戸瓌反古文臣鍇曰直象回轉之形畫計難也從口啚声難意也臣鍇曰口其䂓畫也圗畫必先䂓畫之圖者吝嗇難之義也荘子曰魯公為圗畫有一人䑛筆和㕓公使視之方解衣盤旋公曰真畫者也此難意也田廬反回行也從口睪声尚書曰圛圜升雲半有半無讀若驛臣鍇按洪範稽疑卜五曰圛曰霽說曰圛者象气絡繹不連屬也是半有半無也今卜者以兆躰蒙晦不分爲水兆亦其義也以陟反邦也從口或声臣鍇曰口其疆境也或亦域字古或反宫中道從口象宫垣道上之形詩曰室家之壼臣鍇曰山象歧道入宫也口其外闕也若渾反廩之園者從禾在口中園謂之囷方謂之京臣鍇曰詩曰如京如坻也京高丘也囷取象焉牽輪反養畜之閑也從口卷声群宛反苑有垣也從口有声又禽獸有囿臣鍇曰苑其周垣名也園樹果菜也周禮有囿游之禁亦樹以果菜也延救反籕文從二林所以樹果也從口袁声羽先反種菜曰圃從口甫聲臣鍇曰不如老圃是也不雨反就也從口大徐鍇曰春秋左傳曰楨有禮因重固能大者衆圍就之也史記曰就之如日言近則大也又大字人之象也天因就人之為也尚書曰天視自我民視天聽自我民聽伊申反下取物縮藏之從又從口讀若籋字臣鍇曰人謂禽獸就地物為㘝女洽反獄也從口今声臣鍇曰囹者櫺也櫳檻之名里丁反守之也從口吾声臣鍇曰守禦之意也研許反撃也從口人在口似求反四塞也從口古声臣鍇曰周禮曰負固不服守天下之要塞也淮南子謂九州之險為九州之塞大汾也黽阸也荆院也方城也殽阪也井陘也今庇也句注也居庸也古路反守也從口韋声于歸反故廬也從木在口中臣鍇曰舊所居廬故其木乆而困弊也苦悶反古文困臣鍇曰止即廬舎厠也從口象豕在其口中也㑹意臣鍇曰豕食不㓗也戸本反譯也從口化声率鳥文二重一海介蟲也居陸名在水名蜬象形也古者貨貝而寳龜周而有泉到秦廢貝行錢也凡貝之屬皆從貝臣鍇曰下象其垂足尾形龜可决疑故寳之泉即錢也謂之泉者欲其貿易流行不壅積也若水之壅則為害矣𥙷毎反貝声從小貝也臣鍇曰象連貫小貝相叩之声也㑹意斯果反財也從貝有声臣鍇曰國上所有也若吴貴縞鄭貴紵也虎毎反人所寳從貝才声臣鍇曰可以入用也自來反財也從貝化声臣鍇曰可以交易曰貨貨化也尚書曰貿遷有無化居毁過反資也從貝為声臣鍇按字書云古貨字矩利反貨也從貝次声臣鍇曰人所齎持也易曰䘮其資斧津司反貨也從貝萬声臣鍇曰人所頼也魯械反富也從貝辰声也臣鍇曰振也振起之也止忍反多才也從貝臤声臣鍇曰臤者臣執事也欲其用之如貝之行也如貝之積聚也詩曰思皇多士生此王國由堅反飾也從貝卉声又逼媚反臣鍇曰尚書賁若草木芔草也傳冩多声字房文反又鄙媚反以禮物相奉慶也從貝加声臣鍇曰按史記漢髙帝曰賀錢萬是也侯箇反獻也從貝工声獻納緫稱尊嚴臣鍇按貢公獻之也周禮太宰以九貢致邦國之用一曰祀貢二曰嬪貢三曰器貢四曰幣貢五曰材貢六曰貨貢七曰服貢八曰㳺貢九曰物貢古弄反見也從貝從兟臣鍇曰進見也貝為禮也尚書曰贊贊㐮哉子旦反㑹禮也從貝盡声臣鍇曰孟子歸賮是也似忍反持遺也從貝齊声臣鍇曰持以遺人也春秋傳曰自齎其一子西反施也從貝代声借也臣鍇曰春秋傳曰陳氏厚貸焉是也他代反從人求物也從貝弋声借也臣鍇曰史記曰漢武帝時縣官無錢從人貣馬是也他得反遺也從貝各声勒故反臣次立桉徐鉉曰從路省乃得声物相増加也從貝朕声一曰送也副也臣鍇曰今鄙俗謂物餘為賸古者一國嫁女二國徃媵之媵之言送也副貮也義出于此也以證反玩好相送也從貝曽声臣鍇曰贈増也旣辝又以此増益之也春秋傳曰郊劳至于贈賄是也昨鄧反移子也從貝皮声臣鍇曰春秋傳楚薳啓疆言曰齊與晋貱此乆矣寡君無適與也而傳諸君慱媚反賜也從貝省声臣鍇曰故端木賜字子贛也古弄反籕文省作賜也從貝來声周書曰賚爾秬鬯臣鍇曰天下罔不欣頼也詩頌曰徂賚孝孫尚書曰大賚于四海勒戒反賜有功從貝尚声臣鍇曰賞之言尚也尚其功也賞以償之也式掌反予也從貝易声臣鍇曰從難易之易賜之言易也有故而與之也禮記曰慶賜逐行無有不當絲義反重次弟物也從貝也声臣鍇曰路之邪次弟為迆物之重次弟為貤也弋示反有餘賈利也從貝嬴声臣鍇曰春秋傳曰賈欲贏而惡囂乎是也夷嬰反贏也從貝剌声臣鍇按晉灼注史記無頼曰江湖間謂小兒無利入於家曰無頼利即贏也上同恃也從人守貝有所恃也臣鍇曰春秋傳魯申豐曰貨以藩身又史記貨殖傳巴寡婦者以財自衞不見侵也會意得缶反積也從貝宁声臣鍇曰當言宁亦声少亦字也㑹意竹吕反副益也從貝弍声弍古文二字耳臣鍇曰副貳者相禆益也春秋傳曰齊侯噐貳不匱㑹意曰至反所敬也從貝声臣鍇曰貝者贈賄好貨忠臣嘉賔得盡其心也音眠必人反古文也從貝余声臣鍇曰今人謂遲緩為賖也式車反貸也從貝世声時卸反以物質錢也從敖貝敖者猶放貝當復取之一曰最臣鍇曰史記注謂男無娉財以身自質于妻家為贅壻敖者放也最者出也附贅之義老子曰餘食贅行贅獨出也㑹意之芮反以物相贅從貝斦声臣鍇曰質實也事凝虚以人物實之也之日反易財也從貝丣声臣鍇曰貿猶乱也交至之義門豆反散財用也從貝弗声臣鍇曰財散出如湯沸然高士傳子夏曰憚為子費扶味反求也從貝束声臣鍇曰責者迫迮而取之也史記李斯殺二世為督責之政也側革反賈市也從貝西声一曰坐賣售也臣鍇曰漢書胡建傳監軍為賈區尚書曰肇牽車牛逺服賈謂逺就事于坐賈而買之也公雅反竹賈也從貝商省声臣鍇曰易啇旅不行春秋傳曰鄭啇人弦髙將貨于周行賈也諸家書傳並假啇字升羊反買賤賣貴者從貝反声臣鍇曰善販者旱則資舟水則聚車人棄我取與當情反也方萬反市也從网貝声孟子曰登壟㫁而网市利臣鍇按孟子曰古之為市以其所有易其所無有賤丈夫登壟㫁䋞市利然則征啇自賤丈夫始也壟㫁高地也故列子曰無登壟㫁高謂登高望見利則取之也忙戒反賈少也從貝戔声臣鍇曰賤之言踐輕也目見反斂也從貝武声臣鍇曰賦者分也分取之分也方布反欲物也從貝今声臣鍇曰貪惏也春秋傳縉雲氏不才子聚歛積實不知紀極吐含反損也從貝從乏声臣鍇曰當言從乏乏亦声脫誤也㑹意悲儉反財分少也從貝分声臣鍇曰按原憲曰無財謂之貧見分則少也當言分亦声脫誤也㑹意粥巾反古文從山分声臣鍇曰家貧也原憲甕牗桑樞是室屋之貧也上同庸也從貝任声臣鍇曰庸功也自賃自為功庸以求食也春秋傳曰申解虞僕賃于野任者負荷也此脫亦声字㑹意女心反以財枉法相謝從貝求声一曰戴質也臣鍇曰非理而求之也巨牛反以財有所求從貝冓声臣鍇曰購遘遇也求遇之人也漢法購書也工豆反齎財卜問為從貝疋声讀若所臣鍇曰詩曰握粟出卜是也楚辝曰懷桂糈而要之史記曰司馬季主曰卜而不中不見奪糈借糈字也山吕反小罰以財自贖從貝此声漢律民不傜貲錢二十二臣鍇按史記張釋之以貲為郎即今州縣吏以身應役是也貲錢即今庸直也子司反南蠻賦也從貝宗声臣鍇曰賨者緫率其所有而已不切責之也才冬反也從貝声古文睦字讀若育臣鍇按彭羕曰自衒賣龎綂是也寅六反物不賤從貝臾声臣鍇曰臾音匱短位反從貝賣声臣鍇曰以財贖罪實燭反頸飾也從二貝臣鍇曰蠻夷連貝為纓絡是也嬰字從此史成反又一盈反文五十九重三國也從口先王之制尊卑有小大從卩凡邑之屬皆從邑臣鍇曰有宗廟先君之主曰都無曰邑邑曰築築曰城口其城郭也應執反國也從邑声臣鍇曰古謂封諸侯為邦故尚書曰乃命諸王而邦之蔡漢諱邦故兩漢無稱張華慱物志曰東夷有國謂國為邦行酒為行觴秦之遺也北江反古文臣鍇按春秋傳曰分之土田陪敦命之伯禽封於少昊之虚周制天子地方千里分為百縣縣有四郡故春秋傳曰上大夫受郡是也至秦𥘉天下置三十六郡焉以監其郡縣從邑君声臣鍇按髙誘淮南子注曰周制天子地千里分為百縣縣有四郡郡有四鄙瞿運反有先君之舊宗廟也都從邑者声周禮制國五百里為都臣鍇曰按周禮四縣為都丁沽反五家為隣從邑粦声里神反百家為鄼鄼四里也從邑賛声南陽有鄼縣臣鍇曰按周禮五家為鄰五鄰為里二十五家也四里為鄼百家也五鄼為鄙五百家也五鄙為縣二千五百家也五縣為遂一萬二千五百家也祖滿反五鄼為鄙從邑啚声慱羙反距國百里為郊從邑交声臣鍇按爾雅邑外謂之郊古看反屬國舎從邑氏声臣鍇曰諸侯來朝所舎為邸邸有根抵也根本所在也丁禮反郭也從邑孚声臣鍇曰春秋傳曰伐宋入其郛郛郭也郛猶祔也草木華房為樹在外苞裹之也弗扶反境上行書舍從邑垂垂邊也臣鍇曰郵之言過也使所過也宇牛反國甸大夫稍稍所食邑從邑肖声周禮曰任地在天子三百里之内臣鍇曰謂天子之曰稍稍以封大夫也山召反鄯善西胡國也從邑善善亦声臣鍇曰按後漢書西域鄯善班超所護也時扇反夏后時諸侯夷羿國也從邑窮省声臣鍇曰后羿之國也巨弓反周封黄帝之後于􅠥也從邑契声讀若萴上谷有􅠥縣臣鍇按今諸書多作萴字古諸反炎帝之後姜姓所封周素外家國從邑台声古扶風斄縣是也臣鍇曰詩曰即有邰家室他來反周文王所封在右扶風羙陽中外郷從邑支声臣鍇按顔之推家部本音竒後人始音抵也臣伊反􅑢或從山支因岐山以名之也古文􅑢從枝從山作臣鍇曰按字書以岐爲山名􅑢爲邑名按孟子太王即就岐山之下而居指山之名更别無邑名故許慎三字並同也周王國在古扶風羙陽從邑分声布巾反羙陽亭即豳也民俗以夜市有豳山從山從豩闕臣鍇按漢書百官表大率十里爲亭亭有長古扶風縣名也從邑眉声閩之反古扶風郁夷也從邑有声臣鍇按漢書北郁郅縣於六反古扶風縣名也從邑雲声下古反夏后同姓所封戰于甘者在鄠有扈國也有甘亭從邑戸声臣鍇曰春秋傳曰屈蕩扈之杜預注曰扈止也楚辝曰扈江籬與薛芷王逸注曰扈披也同上古文扈從山弓臣鍇曰從辰巳之已毛詩陟彼屺兮則從戊巳之巳右扶風鄠郷從邑崩声沛城父有䣙郷讀若陪臣鍇按史記漢有䣙成侯周緤部梅反右扶風鄠鄕從邑且声且渠反右扶風鄠郷盩屋縣從邑赤声吼作反周文王所都在京邑桂陵西南從邑豐声臣鍇按春秋傳康有酆宫之朝杜預曰始平鄠縣東酆邑臺也臣鍇曰為許愼地名多見春秋左傳地名精考莫精于杜預比于今又近故春秋地名一取于杜預又艸木鳥獸之名莫近于爾雅及新修本草終古不刋故臣鍇曰一切以為凖的孚洪反京兆縣周厲王子友所封從邑奠声宗周之㓕鄭徒漕洧之上今新鄭是也臣鍇按鄭𥘉封在今華州杜預云後徙荥陽宛陵縣西南新鄭城劉熈釋名曰鄭町也其地町然平也直敬反左馮翊部陽縣從邑合声詩曰在郃之陽侯帀反京兆藍田郷也從邑口声懇走反京兆杜陵郷從邑樊声臣鍇曰此即樊川漢曰御宿在長安城南終南山北連芙蓉園曲江也父䦨反左馮翊縣從邑麃声臣鍇按秦穆公作鄜畤以祭包拂扶反左馮翊有䣝陽亭從邑屠声田吾反左馮翊高陵從邑由声田溺反左馮翊谷口也從邑年声讀若寕泥賢反隴西上邽也從邑圭声㳙兮反天水秋部從邑咅声臣鍇曰部屬也部之言簿也分簿之也故吕氏春秋曰黎丘北部大玄曰方州部分部諸縣或為四或為二也盤五反弘農縣庾地從邑豆声單頭反河南縣直城門官陌地也從邑辱声春秋傳曰成王定鼎于郟鄏儒曲反周邑也從邑輦声里典反周邑從邑祭声臣鍇按春秋公周公之子所封又春秋釋例鄭地祭在陳留長垣縣比祭城側戒反河南洛陽北止山上邑從邑止声蒙匡反周之邑從邑尋声臣鍇按杜預曰可南鞏縣西南有地名鄩徐林反周邑也在河内從邑希声臣鍇曰按杜預曰河内野王縣西南絺城是丑脂反河南泌水卿從邑軍声魯有鄆地臣鍇按鄆古嬴姓國又杜預曰魯叔孫帥師疆鄆田此東鄆莒魯所争者在城陽姑幕縣西南員亭又昭公居于鄆即西鄆東郡廩丘縣東有鄆城是也于藴反故啇邑自河内朝歌以北是也從邑比声臣鍇按字書紂都城北曰邶南曰鄘東曰䘙𥙷妹反周武王子所封在河内野王是也從邑于声讀又若區字是臣鍇曰杜預曰扶風雍縣東南䢴亭火于反殷諸侯國在上黨東北從邑声古文利字啇書西伯戡􅧰里西反晋邑也從邑召声食要反晋邑食也從邑冥声春秋傳曰伐鄍三門是也臣鍇按杜預闕之也民丁反晋邢侯邑從邑畜声臣鍇按杜預春秋釋例闕之也許六反晋之温地從邑矦声春秋傳曰爭鄇田胡遘反晋邑也從邑必声臣鍇按春秋晋楚戰于邲脾必反晋大夫叔虎之邑也從邑谷声丘逆反河東聞喜縣從邑非声歩雷反河東聞喜邑從邑䖍声其延及仲郎河東聞喜郷從邑匡声區王反河東臨汾地也從邑癸声即漢之所祭后土處臣鍇按杜預曰濟桓公㑹于葵丘葵丘宋地陳留外黄縣有葵丘九月乃盟晉為地主無縁欲㑹而不盟臣鍇按許慎直言鄈是河東臨汾鄈耳不言鄈是葵丘與杜預之言同也巨䂓反周公子所封地近河内懐從邑幵声臣鍇按杜預曰今廣平㐮國縣賢經反太原縣從邑烏声臣鍇曰今太原鄔縣烏古反太原縣從邑示声臣鍇按杜預曰太原祁縣巨夷反魏郡縣也從邑業声魚刼反鄭地有亭也從邑井声賢經反趙邯鄲縣從邑甘声胡安反邯鄲縣從邑單声得干反周武王子所封國從邑旬声讀若泓在晉地臣鍇曰文王弟所封伯爵詩所謂四國有王郇伯劳之也息倫反清河縣從邑俞声臣鍇曰史記欒布清河俞人是也式于反常山縣也從邑高声世祖所即位今為高邑臣鍇按字書常山鄗縣火屋反又大各反鉅鄜縣也從邑梟声臣鍇按史記孔子弟子有鄡單字子家吕幺反涿郡縣從邑莫声臣鍇按字書河間鄚縣北齊邢峙北河間鄚人也磨各反北地郁郅縣從邑至声臣鍇按裴駰漢書音義云郅至也司馬相如封禪書曰爰周郅隆之日反北方長狄國也在夏為防風氏殷為汪茫氏從邑声春秋傳曰瞞侵齊是也臣鍇按張華慱物志瞞長二丈也山尤反炎帝太岳之胤甫侯所封在潁川從邑無声讀若許臣鍇按史記鄭世家云許公惡鄭伯于楚許字作此無邑蓋諸書假借許字忻巨反潁川縣從邑亢声看浪反潁川縣從邑匽声于建反潁川縣從邑夾声臣鍇按杜預曰今鄭域㐮城郟縣古洽反新郪汝南縣從邑妻声臣鍇曰今廣漢有郪縣千私反姬姓之國在淮北從邑息声今汝南新息是也臣鍇曰即春秋息侯也司弋反汝南邵陵里從邑自声讀若奚臣鍇曰李陽氷云即許慎所居之里移雞反汝南鮦陽亭從邑㫄声薄皇反蔡邑也從邑臭声春秋傳曰鄓陽人女奔之臣鍇曰杜預衞地鄓氏又名垂葭髙平鉅野西南鄓亭又蔡地鄓陽杜預闕之也古役反曼姓之國今屬南陽也從邑登声徙亘反鄧國地也從邑憂声春秋傳曰鄧南鄙鄾人攻之也臣鍇按杜預曰鄧縣南河水之北有鄾城乙求反南陽清陽郷從邑号声臣鍇按字書卿在南陽戸髙反南陽棗陽郷從邑巢声助交反今南陽穣縣是從邑㐮声臣鍇曰即秦穣侯魏冉所封假借穣字耳張反南陽穣郷從邑婁声里于反南陽西鄂亭從作此沛假借也慱梅反宋下邑從邑丙声臣鍇曰按齊有邴意兹公羊傳以魯祊田作邴字郭璞注穆天子傳亦同許愼所不取也布定反沛國縣從邑虘声今鄼縣臣鍇曰即䔥何所封也粗何反地名也從邑少声升沼反地名也從邑臣声之忍反宋地從邑声讀若䜛臣鍇曰按春秋左傳宋有般士咸反宋魯間地從邑晋声臣鍇曰按杜預北海都縣西北有訾城子而反周文王子所封國從邑告声臣鍇按杜預云文王子那季之弟所封子爵又鄭師取郜宋邑濟隂城武縣東南有南郜城工督反又工到反衞地今濟隂鄄城從邑垔声臣鍇按杜預曰陳郡鄄城也鄭史記曰晋伐阿鄄當七國時屬齊也撃箭反卭地在濟隂縣從邑工声臣曰又蜀臨卭縣俱重反祝融之後妘姓所封潧洧之間鄭㓕之從邑㑹声臣鍇按杜預曰荣陽宻縣東鄶城是古㑹反鄭邑也從邑從元声臣鍇按春秋左傳圍邧新城杜預闕之也杜預云秦地此云鄭地傳冩誤擬逺反鄭地從邑延声臣鍇按春秋傳鄭地杜預闕之不可知也臣鍇曰以為杜預之没身于春秋而其地名有不知而闕者則後代雖有獨得者亦未可以取憑焉弋然反琅邪莒邑從邑更声春秋傳曰取郠臣鍇曰按杜預闕之也古横反妘姓之國從邑禹声春秋傳曰鄅人藉稲讀若䂓矩臣鍇按杜預鄅琅邪開陽縣子爵風姓于甫反魯縣也古邾國帝顓頊之後所封從邑芻声臣鍇按趙岐孟子題辝邾國至孟子時攺曰鄒側留反邾下邑地從邑余声魯東有䣄城讀若塗臣鍇曰古音涂今音徐大都反附庸國在東平亢父邿亭從邑寺声春秋傳曰取邿下臣鍇按杜預又齊地邿平隂城西有邿山申之反魯下邑孔子之郷從邑取声臣鍇按春秋左傳聊人紇是也側侯反魯孟氏邑也從邑成声臣鍇按杜預云姬姓國周公弟郕叔處之後在東平剛縣西南郕亭又魯縣邑於郕春秋及杜預但作郕在泰山鉅平縣東南郕是征反周公所誅䣍國在魯從邑奄声臣鍇按尚書春秋左傳皆作奄歐撿反下邑也從邑雚声春秋曰齊人來歸酄是臣鍇按春秋左傳作讙字假借也杜預曰濟北地丘縣西有下讙亭火桓反魯亭也從邑良声臣鍇按春秋桓公及齊人戰于郎又莊公築臺于郎杜預曰髙平郡髙平縣東有郁郎亭臣以為此字本因邑名而立故從邑他放此魯當反奚仲之後湯左相仲虺所封國在魯薛縣是也從邑丕声臣鍇按仲虺所封在魯薛縣部東萊安縣匀低反姒姓國在東海從邑曽声臣鍇按杜預鄫姬姓與說文同或冩作姒誤琅邪鄫縣又名鄫行自陵反琅邪郡名也從邑牙声臣鍇曰今沂州也又語未定之詞寅遮反琅邪縣一名純德從邑夫声弗無反齊地也從邑黍声此誤反齊之郭氏虚善善不能進惡悪不能退是以亡國從邑享声臣鍇按孔子家語云中行氏善善不能進悪悪不能退賢者知其不進巳踈之不肖者知其悪巳怨之怨讎並在於己鄰國講兵于郊中行氏不亡何待唯太公六韜周志三十六國云郭氏此云齊郭氏當是靖郭之後乎又按杜預虢一名郭都于上陽在弘農陜縣棗南虢或作郭古落反齊地從邑兒声春秋傳曰齊高厚定郳田臣鍇按杜預即小邾一名也東海昌盧縣東北有郳城擬低反郣地從邑孛声一曰地之起者曰郣臣鍇曰疑勃海近此字又周禮土有郣壌當作此假借勃字也歩勿反國也齊桓公之所滅從邑覃声臣鍇按杜預東海褰冥是也子爵魯莊十年滅杜檐反地名也從邑句声群許反陳留郷從邑亥声苟孩反故國在陳留從邑􅥘声臣鍇按春秋傳宋以伐載召蔡人即載國子戴反地名從邑燕声一遷反地名也從邑丘声起秋反地名從邑如声熱除反地名也從邑丑声女有反地名也從邑几声謹羙反地名從邑翕声臣鍇曰今作歙縣也忻急反地名從邑求声柔反地名從邑嬰声伊請反地名從邑尚声澄沆反地名從邑声臣鍇按杜預紀地東莞臨朐縣東南城脾并反地名也從邑虚声忽五反地名從邑火声呼朶反地名從邑翏声臣鍇疑此則春秋蓼國字里皎反地名也從邑為声居危反地名從邑屯声鹿孫反地名也從邑舎声申車反地名從邑盍声臘反地名從邑乾声骨安反地名從邑声讀若淫力甚反地名從邑山声色閑反地名從邑興声香應反地名從邑声古堂字特郎反姬姓之國從邑從馮声臣鍇曰今作馮也父重反汝南安陽鄉從邑省声庫拜反汝南上蔡亭從邑甫声分武反南陽縣從邑声臣鍇曰今為鄧州縣里反地名從邑声親延反南郡縣孝惠三年改名宜城从邑焉声于乾切从反字从此闕文一百八十二重六鄰道也從邑從凡􅣑之屬皆從􅣑臣鍇曰二邑為鄰也㑹意下降反國離邑民所封郷也嗇夫别治從􅣑皀声封圻之内六郷治之也臣鍇曰當許慎其時皀音香臣按周禮淮南子云甸有鄰有里有鄼有鄙有郡有縣有􅨕故曰國離邑離邑别邑也大夫所封周禮有卿大夫嗇夫秦漢已來官也鄭玄為郷嗇夫也漢書百官表云大率十里一亭亭有長十亭一郷郷有三老有䄮嗇夫游徼三老掌教化嗇夫職聽訟收賦稅㳺徼主盗賊軒良反邑中道從􅣑共言在邑中所共恨絳反篆文從􅣑省
