front:
  text: 亦象形字卑聿反棄除也從廾推􅻎棄采也官溥説似米而非米者矢字臣鍇曰此似米糞除也收豆恭反兩手似米字音瓣方問反捐也從收推􅻎棄也從㐬㐬逆子也臣鍇曰逆故推之也耎利反古文棄古文棄
  hash: sha256:55a3aed972fd85677ec2ec16d22d3c84ddc1538e56a7608723912021be967db7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_008-1a}
body:
  text: 文四重二小也象交積材也象對交之形凡冓之屬皆從冓臣鍇曰有搆造也對謂二􅻎相對交也格漚反一舉而二也從冓省臣鍇曰一言舉二也則代反并舉也從瓜冓省臣鍇曰一言舉二也文二重一纁纁絳也五入為緅緅紅也七入為緇注云爾雅一染謂之縓再染謂之頳頳玄色緅緇之間其六入者是黑而有赤色也班婕妤賦曰潛玄宫兮幽以清玄宫深宫也古文也螢先反古文玄黑也從二玄春秋傳曰何故使吾水茲臣鍇曰借為茲此也則欺反文二重一推豫也象相豫之形凡豫之屬皆從豫臣鍇曰上下相豫也裒多益寡損上益下百姓足君孰與不足故終下引也尹汝反伸也從舍豫聲一曰舒緩也臣鍇曰會意式魚反相詐感也從反豫周書曰無或譸張為幻引也從􅗸于籕文以為車轅字臣鍇曰爾雅爰粵于也會意羽元反丨治也么子相亂􅗸治之也讀若亂同一曰理也臣鍇曰坰坰界也吕無識也於外為姦於內為宄並生所謂亂亂必當理故受為亂亦訓理文王亂臣十人是也會意也魯彖反古文亂相付也從􅗸舟省聲臣鍇曰取上下相受也常帚反樶也從􅗸己聲臣鍇曰乙音甲乙之乙録設反引也從􅗸􅛣臣鍇曰􅛣所爭也指事側泓反所依㨜也從􅗸工讀興隱同臣鍇曰工正也會意急從此依謹反五指持也從􅗸一聲讀若律臣鍇曰埒鋝脟從此留筆反進取也從􅗸古聲臣鍇曰尚書曰敢用玄牡敢執壤莫進也古敢旁細也構菼反籕文敢古文敢古文歹臣鍇曰殘骨形也病也從歹委聲臣鍇曰痿也委為反瞀也從歹民聲臣鍇曰扎瘥天殙喧盆反胎敗也從歹賣聲臣鍇曰禮胎生不殰陀谷反終也從歹勿聲讀骨反歾或從殳大夫死曰從歹卒聲臣鍇按白虎通曰終也遵聿反死也從歹朱聲漢令曰蠻夷長有罪當殊之市臣鍇曰殊又異也故史云自刺不殊殊者定死也船區反胎敗也從歹昷聲烏骨反不成人也年十九至十六死為長殤十五至十二死為中殤十一至八歲死為下殤從歹傷省聲式陽反往死也從歹且聲虞書曰勛乃殂臣鍇曰若言所有往也勛堯也全徒反古文殂從歹作殊也從歹從亟聲虞書曰殛鯀于羽山已力反死也從歹一聲一戾反古文殪死宋募也從歹莫聲沒各反死在棺將遷葬柩賔遇之從歹賔賔亦聲夏后殯於阼階殷人殯於兩楹之間周人殯於賔階臣鍇曰夏后氏質居於主位殷人敬疑於賔主兩楹之間賔主夾而敬之周人文所以即逺賔於主位比刃反瘞也從歹隸聲羊媚反道中死人人所覆也從歹堇聲詩曰行有死人尚或殣之臣鍇曰僅能掩之也其櫬反腐氣也從歹臭聲臣鍇曰禹之葬也下不及泉上無泄殠赤狩反爛也從歹貴聲胡塊反腐也從歹丂聲臣鍇曰春秋左傳曰死且不㱙㱙腐也希首反㱙或從木危也從歹台聲殳在反咎也從歹央聲殷強反賊也從歹戔聲自闌反盡也從歹鬒聲臣鍇按春秋左傳曰俾殄其師徒顯反古文死如此臣鍇曰古歹字公侯也從死瞢省聲臣鍇按白虎通曰薨國失陽也薨之言奄也奄然亡也呼能反死人里也從死蒿省聲咍牢反戰見血曰傷亂或為惛死而復生為從死忺聲則四反文四重一剔人肉置其骨也象形頭隆骨也尺冎之屬皆從冎古且反分解也從冎從刀臣鍇曰刀所以解也會意鄙輟反别也從冎卑聲讀若罷臣鍇曰若骨肉之分也賔而反頰肉也從肉幾聲讀若畿臣希反口專也從肉辰聲是倫反古文脣從頁頂也從肉豆聲臣鍇按春秋左傳曰兩矢夾脰笛奏反心上鬲下也從肉亡聲春秋傳曰病在育之下忽光反水藏也從肉從臤聲臣鍇按腎主智藏精皆水之為也文子曰腎為雨食忍反金藏也從肉市聲臣鍇按肺主義藏魄義尚斷割主於金文子曰肺為氣弗乂反木藏也從肉干聲臣鍇按肝主仁藏魂仁生於木文子曰肝為雷骨安反土藏也從肉卑聲臣鍇按脾主信藏志信生於土也文子曰脾為風頻移反連肝之府也從肉詹臣鍇按白虎通府者六府也肝仁不忍故膽斷恩仁者必有勇人怒無不色青是其效也兜淡反榖府也從肉象形臣鍇按白虎通脾之府穀之委故脾稟氣于胃云貴反旁光也從肉孚聲臣鍇按白虎通膀胱肺之府肺斷決膽膀光亦常張有勢浦包反大小腸也從肉易聲臣鍇按白虎通心之府也膀為胃紀也心為支體心故有兩府宙良反肥也從肉高聲家毫反肥也從肉方聲臣鍇按本草有鴈肪鴈脂也玉書曰白如截肪府昌反胸也從肉聲臣鍇按詩謂馬當胸為鈎膺也倚氷反胸肉也從肉乙聲臣鍇按乙音乾依色反肊或從意眷也從肉北聲輔配反兩膀也從肉脅聲臣鍇按晉文公駢脅謂脅骨連若販也虗業反脅也從肉旁聲薄荒反膀或從骨脅肉也肉寽聲一曰脟腸間肥也一曰膫也臣鍇按相如子虛賦曰脟割輪淬注云脟臠也臣以為當是借為臠字録設反脅骨也從肉力聲郎成反夾脊肉也從肉申聲臣鍇曰易云艮其限裂其夤夤即當此胂字式人反背肉也從肉每聲易曰咸其脢莫堆反髆也從肉象形臣鍇曰象肩形指事也激賢反俗肩從户掖下也從肉各聲臣鍇曰按禮或作格莫反掖下也從肉去聲臣鍇按春秋左傳説聲師列敶之法有胠即取人兩腋之義又莊子有胠篋於腋下也羌脅反手上從肉辟聲畢置反臂羊矢也從肉需聲讀若𥜗臣鍇按史記龜前臑骨帶之入山林不迷蓋骨形象羊矢因名之也那到反臂節也從肉寸寸手寸口臣鍇曰寸口手腕動􅍺處也會意知有反肶齊也從肉齊聲自兮反厚也從肉夏聲方菊反腹下肥也從肉叟聲臣鍇按正克論衡桀紂膄是也羊朱反尻也從肉隹聲臣鍇按史記漢祭石土汾隂脽上注云脽者河之東岸特堆掘長四五里廣一里餘高十餘丈汾隂縣在堆之上后土祠在縣西汾在睢之北西流與河合臣以特堆象此為名也市隹反孔也從肉決省聲讀若決水之決鵙穴反髀也從肉殳聲昆覩反脛也從肉却聲己藥反胻也從肉巠聲户定反脛專從肉行聲臣鍇曰按史記龜䇿傳曰壯士斬其脯之間橫反脛腨也從肉非聲臣鍇按易曰咸其腓符飛反腓腸也從肉專聲臣鍇曰腳脛後腹也昌軟反體四肢也從肉只聲臣鍇曰肢支也文子曰天有四時五行九解三百三十六日人有四肢五臟九竅三百六十六節章移反肢或從支足大指毛也從肉亥聲苟孩反骨肉相似也從肉小聲不似其先故曰不肖也思妙反子孫相承續也從肉從八象其長也么亦象重纍也臣鍇曰會意異印反古文胤胤也從肉由聲臣鍇曰尚書曰教胄子分胄字從曰長宥反振也從肉八聲臣鍇曰佾從此希氣反益州鄙言人盛諱其肥謂之䑋從肉襄聲如往反肉膻也從肉亶聲詩曰膻裼暴虎臣鍇曰謂祖衣見肉也特坦反臞也從肉皆聲古諧切齊人謂臞脈也從肉求聲讀若休止虔柔反臞也從肉䜌聲一曰切肉臠也詩曰棘人臠臠蔞遣反瘦也從肉脊聲疾辟反古文膌從疒束束亦聲少肉也從肉瞿聲臣鍇按史記曰形容甚臞臣鍇曰臞者見之可驚瞿也從膌者脊骨兒也臠者小兒也脈者急兒不寬裕也者若草枯見核荄也羣阡反消肉臞也從肉兌聲臣鍇按爾雅肉曰脫之徒活反騃也從肉丞聲讀若丞臣鍇按儀禮曰脯醢無脀實也爼振丞反脣痬也從肉鬒聲臣鍇曰脣瘡則緊急也支允反籕文疹從疒跟胝也從肉垂聲臣鍇曰謂腳跟行多生胝皮也屯鬌反腄也從肉氐聲臣鍇按史記禹手足胼胝陟尼反贅也從肉尤聲焉秋反籕文疣從黑搔生釗也從肉丸聲臣鍇曰若言體癢頑也户岸反癰也從肉重聲之勇反骨差也從肉失聲讀若跌同亭結反創肉反出也從肉希聲許靳反瘢也從肉引聲曰遽也異印反冬至後三成臘祭百神從肉巤臣鍇按蔡雍獨斷殷曰清祀周曰蠟秦曰嘉平漢曰臘臣以為臘合也合祭祀諸神也盧合反之田謂不多也聽銑反古文腆牛羊曰肥豕曰腯從肉盾聲臣鍇按春秋左傳曰慱碩肥腯是也徒忽反肥肉也從肉必聲脾迭反牛頷垂也從肉古聲臣鍇曰牛頷下垂皮也言宛曲也又人言漫胡者謂漫裏其宛曲無稜利也又謂北狄為胡亦然也魂徒反牛百葉也從肉弦省聲臣鍇曰今俗言肚胘也形先反牛百葉也從肉聲一曰鳥膍脛臣鍇曰即毗字但囟在上耳百葉牛肚也周禮謂之脾祈借脾字祈者言其狀分祈也膍肚鳥之腸胃也鼻宜反膍或從比牛脅後髀前合革肉也從肉爂聲讀若繇臣鍇按詩傳下殺射中膘今謂馬肥為䑂肥也言最薄處故言合革肉言皮肉相合也頻小反血祭肉從肉帥聲留筆反帥或從率牛腸脂也從肉尞聲詩曰取其舊虔柔反乾魚尾䐹䐹也從肉肅聲周禮有腒䐹臣鍇曰言其尾乾冝􅊧􅊧猶歷歷也詩曰束矢其􅊧色酉反有骨醢也從肉耎聲臣鍇曰肉無骨即醢年玄反腝或從難生肉醬也從肉延聲臣鍇按齊民要術有作生脡法羊肉一斤豬白四兩豆醬潰之縷切生薑雞子和之春用穌蓼也敕連反豕肉醬也從肉否聲蒲升反􅌜也從肉賁聲房忿反􅌜也從肉雋聲讀若纂臣鍇按楚辝曰鵠酸臇鳬鴻鶬醉雋反臇或從火巽爛也從肉而聲臣鍇按春秋左傳宰夫胹熊蹯忍伊反切熟肉內於血中和也從肉員聲讀若還思欣反犬膏臭也從肉生聲一曰不熟也臣鍇按禮記曰飰勝而苴熟之息形反豕肉羹也從肉堯聲臣鍇曰禮曰膮醢曉么反字反薄切肉也從肉桑聲直輒反細切肉也從肉會聲古最反漬肉也從肉奄聲臣鍇曰五味漬之不曬也殷葉反小耎易斷也從肉紀省聲此芮反耎易破從肉毳聲餘絶反雜肉也從肉􅤖聲臣鍇曰今俗言散肉四旦反切肉也從肉專聲臣鍇按子虛賦脟割輪焠應作此字借脟字也殊反脯也從肉奚聲臣鍇曰古謂脯之屬為膎因通謂儲蓄食味為膎故南史孔靖飲宋高祖無膎取伏雞卵為肴又王儉云庚郎食膎有二十七種是也今俗言人家無儲蓄為無膎活侯叉反膎肉也從肉兩聲里敞反桃取骨間肉也從肉叕聲讀若詩曰啜其泣矣誄劣反食所遺也從肉仕聲易曰噬乾止阻史反楊雄説從􅙻食肉不取也從肉舀聲讀若陷寒蘸反犬肉也從犬肉讀若然臣鍇曰會意仁遷反古文然亦古文然起也從肉其聲齒真反肉汁滓也從肉宄聲臣鍇曰字從此他感反胒也作之以皮從肉翏聲臣鍇曰胒近也黏也加肴反或曰嘼名象形闕臣鍇曰從肉此外許氏闕義也羸嬴從此魯坐反蠅乳肉中也從肉且聲臣鍇曰今俗作蛆且渠反小蟲也從肉口聲一曰空也臣鍇曰涓從此鳥縣反爛也從肉府聲浮甫反骨間肉肯肯箸也從肉冎省一説骨無肉也臣鍇按莊子庖丁云肯綮之間也看等反古文多肉也從肉卪聲臣鍇曰疑當從已或從日不得去聲皆誤也符非反股也以肉夸聲苦故切文一百四十重二十肉之力也從力肉竹竹物之多筋者從力象筋也凡筋之屬皆從筋臣鍇曰會意幾欣反筋之本也從筋死省聲臣鍇曰筋之根結也其獻反筋或從肉建手足指節之鳴者也從筋省勺聲臣鍇曰手指節連綴之筋可屈伸者也曳之則鳴也通朔反筋或省文三重二兵也象形凡刀之屬皆從刀臣鍇曰刀皆與刃也得高反刀握也從刀缶聲臣鍇曰刀把付丑反刀劒刃也從刀聲臣鍇曰今俗作鍔五各反籕文從㓞各鞞也從刀肖聲一曰析也臣鍇曰今人音笑刀之匣也又周禮築氏為削書刀削簡牘者偃月形也息雀反鎌也從刀句聲梗尤反大鎌也一曰摩也從刀豈聲臣鍇曰摩謂摩刀也狗孩反剞􅕻曲刀也從刀竒聲居綺反剞􅕻也從刀屈聲居屈反鋸也從刀和然後利從禾省易曰利者義之和也臣鍇據曰義和即和也會意抑嗜反古文利鋭利也從刀炎聲臣鍇按周禮剡木為矢禮矢圭剡上削今上鋭也爾雅曰剡㗉利也有斂反始也從刀衣裁衣之始也臣鍇曰禮之𥘉拖衣以蔽形以刀裁衣會意測居反齊斷也從刀聲臣鍇曰詩曰實始剪啇子善反等畫物也從刀貝貝古之物貨也臣鍇曰則節也取用有節刀所以裁製也會意遭德反古文則籕文則從鼎亦古文則字強也從刀岡聲格康反古文剛如此斷齊也從力專聲顛歡反斷也從刀會聲古最反切也從刀七聲七屑反切也從刀寸聲臣鍇按儀禮云􅞟茅也粗損反斷也從刀㠔聲思列反劃傷也從刀氣聲一曰斷也讀若㱯一曰刀不利於瓦石上刏之臣鍇曰猶摩扢也古最反利傷也從刀歲聲俱稅反判也從刀畐聲周禮曰副事祭臣鍇按顔師古匡謬正俗云副二之副本作福字從衣後人借副字為福因不復作福字也披式反籕文副從㽬臣鍇曰今周禮作此字山海經云副以吳刀則作副鏤也從刀亥聲慳黑反判也從刀咅聲浦吼反判也從刀辡聲蒲莧反分也從刀半聲鋪喚反判也從刀叕聲臣鍇按商子曰有敢剟定法命者死吳越春秋曰削剟之利剟持有所刋也誅劣反分解也從刀聲良舌反剟也從刀干聲刻千反判也從刀度聲騰莫反破也從刀辟聲匹錫反剟也從刀册册書也臣鍇曰古以簡牘故曰孔子刪詩書言有取捨也會意師關反裂也從刀録聲一曰録剋割也逼朔反剝或從卜問也從刀害聲格曷反剝也劃也從刀􅫕聲臣鍇按史包奴聲而不哀利之反齊也從刀齊聲臣鍇按字書曰剪刀劑也寂帝反刮也從刀刷省聲禮布刷巾師子反掊把也從刀昏聲臣鍇曰掊音庖古獺反錐刀也從刀畫畫亦聲麾獲反挑取也從刀肙聲一曰窐也於旋反刮去惡創肉從刀矞聲周禮曰劀殺之齊古獺反砭刺也從刀聲一曰剽劫人也臣鍇曰砭以石針病也匹妙反刺也從刀圭聲易曰刲羊穹圭反折傷也從刀坐聲此左反絶也從刀噪聲周書曰天用劋絶其命即沼反絶也從刀月聲元伐反擊也從刀弗聲臣鍇按春秋左傳曰刜林雍附勿反傷也從刀漆聲秋月反斷也從刀毚聲一曰剽也釗臣鍇曰劖鑿也士街反剸也從刀元聲一曰齊也臣鍇曰印刓弊五桓反裁也從刀從未未物成有滋味可裁斷一曰止也臣鍇曰論語既冨矣教之故曰物成而裁斷也會意正曵反古文制如此缺也從刀占聲詩曰白圭之㓠臣鍇曰今詩作玷假借丁念反齗刮也從劫夬聲一曰畫堅也臣鍇曰畫堅物難之意也格八反刻也從㓞從木溪細反文三草蔡也象草生之散亂也凡丰之屬皆從丰讀若介苟差反枝格也從丰各聲臣鍇按庾信賦曰枝格相交今作格溝百反文二手耕曲木也從木推丰古者垂作耒耜以振民也凡耒之屬皆從耒臣鍇曰振猶起發之也魯內反撣角貌從角雚聲梁􅋣縣有䚭亭又讀若吁袁反角也從角樂聲張掖有觻得縣盧木反角中骨也從角思聲臣鍇曰玉部云䚡理自外可以知中是也先臺反曲角也從角􅫦聲臣鍇按爾雅注觠卷也衢真反角觬也從角兒聲西河有觬氏縣臣鍇曰觬猶邪倪也施米反一角仰也從角㓞聲易曰其牛觢臣鍇按爾雅牛角一俯一仰觭皆踴觢注云豎角也疑此注誤唱曳反角傾也從角虒聲臣鍇按太玄曰角觟䚦終以直之也池倚反角一俯一仰也從角竒聲牽冝反角貌也從角丩聲詩曰兕觥其斛臣鍇按詩傳斛弛貌今詩作觩臣鍇曰若弓之弛也其幽反角曲中也從角畏聲臣鍇按周禮考工記曰當弓之畏塢枝反角長貌也從角爿聲讀若租士嶽反角有所觸發也從角厥聲瞿月反抵也從角蜀聲以欲反用角低仰便也從羊牛角讀若詩曰觲觲角弓火玄反舉角也從角公聲溝龍反治角也從角學省聲胡角切牛觸橫大木其角從角大行聲詩曰設其楅衡臣鍇曰謂牛好抵觸以木闌制之也間橫反古文衡如此角􅗧獸也狀似豕角善為弓出胡休多國從角專聲顛歡反觰拏獸也從角者聲一曰下大者也陟茶反羊角不齊也從角危聲臣鍇按爾雅注云一角長一角短也溝委反牝牂羊生角者也從角圭聲臣鍇按準南子曰楚文王服觟冠高誘窪觟冠秀冠也如今御史臣以為冠奚冠有角故曰秀冠户把反骨角之名也從角各聲臣鍇曰禮角觟生溝曰反鴟奮頭上角觜也一曰觜觽也從角此聲臣鍇按爾雅注觜蠵靈龜也即冝反判也從刀判牛角一曰解豸獸也臣鍇曰莊子庖丁解牛也會意加買反佩角鋭專可以解結從角嶲聲詩曰童子佩觽勻迷反小觶也從角且聲特坦反兕牛角可以飲者也從角黃聲其狀觥觥故謂之觥臣鍇曰觥曲起之兒骨庚反俗觥從光鄉飲酒觶從角單聲禮曰一人洗舉觶觶受四升臣鍇按禮公罔之裘揚觶虛觶也真避反觶或從辰禮經觶觶實曰觴虛曰觶從角聲戎陽反籕文觴或從爵省鄉飲之爵也一曰觴受三升者曰觚從角瓜聲臣鍇按論語説所以節酉古乎反角匕也從角亘聲讀若歡欣袁反杖專角也從角敫聲臣鍇曰杖專柱地處羊狄反環之有舌者從角敻聲臣鍇曰言其環形玦詩曰觼軜今俗呼觼舌鵙穴反觼或從金矞臣鍇曰莊子曰胠篋者唯恐扃鐍緘縢之不固鐍篋箱前瑣處調弓也從角弱省聲乙卓反隿射收具也從角發聲臣鍇曰隿獵也生絲線以繫矢而射列仙傳有􅌳父賣􅌳也方喙反隿射收具從角酋聲讀若鰌字由反盛觥巵也一曰射具也從角殼聲讀若斛臣鍇曰又按觳實二斗也胡獨反羌人所吹角屠觱以驚馬也從角古文悖臣鍇曰今之栗栗其聲然也卑聿反文三十九重六説文解字通釋卷第八
