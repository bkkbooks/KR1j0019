front:
  text: 書曰文王惟正之供反正不供也故曰乏符法反
  hash: sha256:929d3ae4135fa407084ab3e5a479bbef3d4c14b568be80a9f223ec186fe8aa94
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_004-1a}
body:
  text: 文二重二直也從曰正凡是之屬皆從是臣鍇曰日中為正是一直不移也善𥿄反籕文是從古文正是也從是韋聲春秋傳曰犯五不韙于虺反籕文韙從心是少也鮮俱存也從是少賈侍中説臣鍇曰是亦正也正者少則鮮也思典反文三重二乍行乍止也從彡從止凡辵之屬皆從辵讀若春秋公羊傳曰辵階而走臣鍇曰辵行也故曰乍行乍止也今公羊傳辵作躇禇芍反步處也從辵亦聲子壁反籕文迹從朿或從足責無違也從辵舝聲讀若害恆艾反先道也從辵率聲踈密反逺行也從辵萬聲臣鍇曰尚書日月逾邁是逾逺也謀敗反邁或從蠆延行貌從辵川聲續倫反恭謹行也從辵㲃聲讀芳九幾栁反步行也從辵士聲田吾反行邎徑也從辵繇聲臣鍇曰路有所由也延秋反正行也從辵正聲臣鍇曰謂從正道行也若王者巡狩正也狩河陽非正行也乍行乍止偵也天子必五歲卜征詳習乃行真名反延或從彳臣鍇曰胤往征之正其罪也從也從辵隋聲似吹反行貌也從辵市聲步將反往也從辵王聲春秋傳曰子無我迋臣鍇按春秋傳伯有迋勞於黃屋于况反往也從辵折聲讀若誓時制反往也從辵且聲退齊語全徒反籕文從虘徂或從彳循也從辵木聲臣鍇按禮曰父作之子述之是也常出反籕文從秫循也從辵尊聲蹤民反之也從辵啻聲適宋魯語失易反度也從辵咼聲古多反習也從辵貫聲臣鍇按春秋左傳曰使盈其遦當作此字古患反媟䢱也從辵賣聲臣鍇曰不以禮自近也馳谷反登也從辵閵省聲子印反就也從辵告聲談長説造上士也臣鍇按禮有造士也雌報反古文造從舟臣鍇曰天子造舟越進也從辵俞聲周書曰無敢昏逾羊朱反䢔也從辵眔聲臣鍇按史記曰魚鱗雜遝煙至風起謂䢔遝並進也道合反遝也從辵合聲徔閣反迮迮起也從辵作省聲滓白反迹道也從辵昔聲操各反往來數也從辵專聲易曰以事遄往臣鍇曰遄猶摶也駛易也市緣反疾也從辵束聲孫卜反古文從敕言臣鍇曰言行速如言之易到也籕文從敕臣鍇按史記有魏遬其名如此疾也從辵卂聲思進反疾也從辵昏聲讀與括同古活反迎也從辵屰聲關東曰逆關西曰迎臣鍇曰春秋左傳莒慶來逆叔姬言碧反逢也從辵卭聲疑卿反會也從辵交聲臣鍇曰往來交會也如肴反逢也從辵禺聲臣鍇曰遇之言相偶也又諸矦冬見天子曰遇疑豫反遇也從辵􅔟聲一曰邐行臣鍇曰值也遭猶匝也若物匝相值也祖叨反遇也從辵冓聲臣鍇曰遘猶結構也理當相對也格漚反遇也從辵峯省聲臣鍇曰逢言若蜂飛奄忽相見附松反相遇驚也從辵咢咢亦聲臣鍇曰咢即遇也五各反道也從辵由聲臣鍇按尚書惠迪吉又為引道之道也田溺反更易也從辵虎聲笛計反逹也從辵甬聲士蒙反移也從辵止聲宵此反古文徙徙或從彳臣鍇曰從有所之也遷徙也從辵多聲臣鍇曰止士移居之移當用此以支反登也從辵䙲聲臣鍇曰身隨遷移故從辵先古文遷從手西移徙也從辵軍聲臣鍇按莊子曰天其運乎地其處乎天道回轉移易也于問反還也從辵反反亦聲啇書曰祖甲返臣鍇曰人行還也府曉反春秋傳返從彳復也從辵睘聲户剛反遣也從辵巽巽遣之巽亦聲一曰選擇也臣鍇曰亦選擇之意思篆反遣也從辵省臣鍇曰即送也峻弄反籕文不省縱也從辵聲喫善反行邐邐徔辵麗聲臣鍇曰漸迂邪也略迤反唐逮及也從辵隸聲臣鍇按爾雅逮及暨與也又遏遾逮也又曰逮及也義皆相通也徒再反徐行也從辵犀聲詩曰行道遲遲纒伊反籕文遲從屖遲或從􅊂臣鍇曰􅊂音夷聲徐也從辵黎省聲臣鍇曰傅毅舞賦曰邌收而拜謂徐收其舞勢也里西反去也從辵帶聲笛計反行貌從辵􅘢聲挾蓮反馬不行也從辵聲讀若住陟具反止也從辵豆聲臣鍇按史記漢軍法有逗留笛奏反曲行也從辵只聲起逆反逶迤邪去之貌從辵委聲委為反或從蟲為迥避也從辵矞聲臣鍇曰遹猶况也回沈之意涓律反回也從辵辟聲便詈反離也從辵韋聲字非反行難也從辵粦聲易曰以往遴里刃反或從人復也從辵夋聲七賔反恕不進也一曰鷙也徔辵氏聲的反行不相遇從辵幸聲詩曰佻兮逹兮騰剌反達或從大或曰迭臣鍇按王褒洞簫賦云順敘卑達行謹逯逯也從辵彔聲慮木反迵迭也從辵同聲頭貢反更迭也從辵失聲一曰迭亭結反惑也從辵米聲莫泜反邪行也從辵也聲夏書曰東迆北會于匯以爾反員連臣鍇按椘辭曰遒白露之為霜字由反逎或從酋附也從辵斤聲渠遴反古文近臣鍇曰此與歬同意搚也從辵巤聲律捷反近也從辵白聲不白反近也從辵􆃵聲臣鍇曰􆃵音日而吉反近也從辵爾聲而俾反古文邇微止也從辵曷聲讀若桑蟲之蝎臣鍇曰繳繞使止也故慱物志曰響遏行雲厄渴反遏也從辵庶聲之已反遮䢭也從辵羡聲余羡反迾也晉趙曰迣從辵世聲讀若置正曵反遮也從辵􅍌聲臣鍇按顔延之赭白馬賦曰進迫遮迾良舌反進也從辵干聲讀若干古寒反過也從辵侃聲豈虔反連遱也從辵婁聲臣鍇按淮南子有連遱之言猶參差零瓏若連若絶之意也勒兜反極也從辵􅩎聲則先反高平之野人所登從辵備録闕原臣鍇按水所出為原故即爾雅廣平曰邍今周禮有邍師猶此邍字爾雅則變為原也許慎闕之義不盡知臣鍇以為人所登故從辵登而上故從攴攴止也春秋左傳曰原田每每詩曰周原膴膴故從田未知何故從録也言袁反所行道也從辵首一逹謂之道臣鍇曰所行道此道字當作今導字之意餘則通論詳矣徒討反古文道從首寸傳也從辵豦聲一曰窘也臣鍇曰傳馹車也故禮曰大夫稱慱遽之言傳車尚速故又為窘迫也伎絮反獸迹也從辵亢聲臣鍇按爾雅逸迹為迒也恆湯反迒或從足更至也從辵弔聲臣鍇按尚書曰惟弔兹不于我正人得罪惟至茲也今文尚書借弔字顛逖反行垂崖也從辵臱聲辟涓反遷也一曰逃也從辵盾聲臣鍇按尚書敫髙宗曰既乃遁于荒野是遷于荒野也當作此遁今文尚書借遁字徒寸反文一百一十八重三十臣次立曰今重二十七輔遺蟡僯二字共重二十九小步也象人脛三屬相連凡彳之屬皆從彳臣鍇曰微步也故相連屬也丑赤反升也從彳㥁聲臣鍇曰內得於心曰德升聞曰德尚書曰玄德升聞通論詳矣多則反步道也從彳巠聲臣鍇曰小道不容車故曰步道今之移路故巫馬期行不由徑又趙襄以壷餐從徑又秦公曰𣣔為容車之徑以窺三川謂徑大時容車也居正反往來也從彳夏聲臣鍇曰往來為復故從彳相連也伐六反復也從彳柔柔亦聲臣鍇曰猶蹂也往來蹂踐之也人紂反徑行也從彳呈聲丑郢反之也從彳聲臣鍇口音皇丈兩反古文從辵行貌從彳瞿聲羣紆反往有所加也從彳皮聲臣鍇曰彼者據此而言故曰有所加郡是反循也從彳敫聲臣鍇曰循猶繞也堅蕭反急行也從彳及聲飢泣反行順也從彳盾聲臣鍇曰史記云拊循其民續倫反行貌從彳歰聲一曰此與馺同臣鍇曰今人言㒊沓是也速沓反隱行也從彳聲春秋傳曰白公其從微之臣鍇曰隱於物而行也曹植洛神賦曰蘭之芳藹兮步躊躇於山隅又國語曰晉公子駢脅鄭伯設微簿觀之也尾希反徥徥行貌也從彳是聲爾雅曰徥尾則也臣鍇按爾雅曰是則也注云是事可法則也今爾雅作是臣鍇曰行事則可為法則也是支反安行也從彳余聲臣鍇按詩曰其虛其徐又古國本從邑亦通作徐徐顓頊後其裔孫生大業大業生臯陶臯陶生伯益臯陶之後為士師為李氏伯益之後分封為徐在東海却東方仁方也有君子國故孔子欲居九夷至偃王一曰隱王王仁諸侯歸之王不能距遂君之周穆王聞而自西荒逃歸王不忍聞以太王之義而去之使周穆不失國隱王之力也乃東之海中潢池得地千里而居之以化其民為仁義故徐氏有四望高平北海彭城東海而以東海為上望也徐者舒緩之名也故其後雖為武未嘗無君子之風徐宣立盆子是也然則古徐字雖作䣄其義出於此字也似虗反行平易也從彳夷聲臣鍇曰老子曰大道具夷此字也寅之反使也從彳䛣聲臣鍇曰猶抨也篇丁反使也從彳夆聲讀若􅑣臣鍇曰猶夆也夆掣曵使之也甫蛩反迹也從彳戔聲寂衍反附行也從彳旁聲臣鍇按周禮牛有牽倣以載牽向前引之也倣自旁微驅之也盤浪反待也從彳奚聲臣鍇按尚書曰徯豫后是也亦啓反徯或從足也從彳寺聲投在反行宙宙也從彳由聲臣鍇曰行平易不止也田溺反匝也從彳扁聲臣鍇曰匝行之也比薦反至也從彳假聲臣鍇曰易曰王假有廟格雅反却也從彳曰攴一曰行遲臣鍇曰日日見攴是過也土妹反或從內古文從辵遲也從彳么攴者後也臣鍇曰么猶躓之也此會意與退同旱斗反古文後從辵久也從彳􅙈聲讀若遲敵圭反不聽從也一曰行難也從彳㫐聲一曰盩臣鍇曰盩戾也宋義曰狠如羊羊之性愈牽愈不進遐懇反相迹也從彳重聲臣鍇按莊子曰踵門而詫篇慶子是也之勇反行有所得從彳得聲多則反古文省彳舉脛有渡也從彳竒聲臣鍇曰爾雅石杠謂之徛注聚石水中為步渡彴也臣鍇按耶溪澗夏有水冬無水處橫木為之至冬則去今曰水彴橋牽其反行示也從彳勻聲司馬法斬以臣鍇曰且斬且行以令于衆也今人作徇詢順反均布也從彳聿聲臣鍇曰十二律均布節氣故有六律六均留茟反使馬也從彳卸臣鍇曰卸解車馬也彳行也或行或卸皆御者之職也會意午慮反古文馭從又馬臣鍇曰會意步止也從彳讀若畜臣鍇曰左思魏都賦曰澤馬亍􅎧丑録反文三十七重七長行也從彳引之凡廴之屬皆從廴臣鍇曰彳而引之故曰長行以矧反朝中也從廴壬聲臣鍇曰朝中其道長逺也故從廴由丁反行也從廴正聲臣鍇曰長行真名反立朝律也從聿從廴臣鍇曰聿律也定法也周禮曰惟王建國建長世之法惟曰欲至于萬年惟王子子孫孫永保民也機獻反文四安步􅵫㢟也從廴止凡􅵫之屬皆從􅵫臣鍇曰既引而止相莭調之故曰安行戴孚廣異記曰嵩陽觀西賦門閭洞達頭貢反迹也從行戔聲臣鍇按論語曰不踐迹亦不入于室也寂衍反行貌從行吾聲臣鍇按椘辭曰導飛廉之衙衙今謂列儀衛衙義同疑舉反行喜貌從行干聲騫罕反行且賣也從行言臣鍇按崔駰曰叫呼􅸹回茜反􅸹或從玄將衛也從行率聲踈律反宿衛也從韋匝行行列衛也臣鍇曰韋周圍也此會意干歲反文十二重一口齗骨也象口齒之形止聲凡齒之屬皆從齒臣鍇曰口齗骨齒也赤里反古文齒字臣鍇曰鼠字從此齒本也從齒斤聲語斤反毁齒也男八月生齒八歲而齔女七月生齒七歲而齔從齒匙聲楚近反齒相值也從齒責聲一曰齧也春秋傳曰晢齰臣鍇曰春秋左傳謂東郭晢而衣貍製謂齒縫上下相對也爰測反齒相齗也一曰開口見齒之貌從齒柴省聲讀若柴臣鍇曰齒不齊也測皆反齒相切也從齒介聲指夬反口張齒見從齒只聲擬件反齒差也從齒兼聲臣鍇曰齒左右出也五緘反齒搚也一曰馬口中糜也從齒芻聲一曰齰也側丘反齒不正也從齒禺聲臣鍇曰齒偏也五溝反齬齒也從齒虘聲臣鍇曰亦齒參差聲側已反齵也從齒取聲臣鍇曰齱齵是也側立反齒參差從齒差聲楚冝反齒差跌貌從齒佐聲春秋傳曰鄭有子殘他反缺齒也一曰曲齒從齒聲讀又若權衢貟反無齒也從齒軍聲愚藴反缺齒也從齒獻聲臣鍇曰今人言缺齾也五獺反齗腫也從齒巨聲俱取反老人齒從齒兒聲臣鍇按詩曰黃髮齯齒擬西反齧也從齒竒聲臣鍇按春秋傳有卜齮魚倚反齚齒也從齒出聲仕乙反齧也從齒昔聲鉏客反齰或從乍齧也從齒咸聲工咸切齧也從齒艮聲起簡反齒見貌從齒干聲五版反齚也從齒卒聲昨猝反齒分骨聲從齒列聲讀若剌勒遏反齧骨也從齒交聲五瓜反齒差也從齒屑聲讀若切七屑反齒堅聲從齒吉聲赫鎔反牙也從齒豈聲偶來反吐而噍也從齒台聲爾雅曰牛曰齝臣鍇曰齝將咽復吐出嚼之式其反齧也從齒氣聲臣鍇按禮曰食瓜庶人齕之胡兀反齒見貌從齒聮聲鄰延反噬也從齒㓞聲語挈反齒傷酢也從齒所聲讀若椘櫬訐反老人齒如􅍫從齒􅍫聲馬八歲齒􅍫也臣鍇曰今人謂馬齒為齒齨伎酒反齒不相值從齒吾聲疑舉反羊粻也從齒世聲臣鍇曰粻糧食也爾雅注江東呼齝曰臣鍇以為貯食于頰漸泄咽之私列反鹿麋粻從齒益聲臣鍇按爾雅注江東名咽為齸齸者齝食之所在臣以為近于咽也伊昔反齒堅從齒至聲知疾反齧骨聲從齒骨聲胡刮反噍聲從齒昏聲舌劼反噍堅也從齒慱省聲臣鍇按爾雅注或謂為本泊反文四十四重二牡齒也象上下相錯之形凡牙之屬皆從臣鍇曰比于齒為牡也古文牙武牙也從牙竒竒亦聲牽冝反齒蠧也從牙禹聲臣鍇按後漢書孫夀能齒笑曲矩反或從齒文三重二人之足也在下從止口凡足之屬皆從足臣鍇曰口象股脛也節栗反足也從足虒聲臣鍇按爾雅書􅕭字如此俗作蹄敵圭反足踵也從足艮聲茍痕反跟或從止足踝從足果聲户把反足下也從足石聲臣鍇曰足底也真石反一足春秋左傳曰舉趾髙心不固矣其雀反疾也長也從足攸聲臣鍇曰此亦倐忽字尺竹反動也從足倉聲臣鍇曰詩曰巧趨蹌兮猜常反跳也從足甬聲礜恐反登也從足齊聲啇書曰若豫顛躋臣鍇按尚書曰由賔階躋子泥反迅也從足翟聲㣧略反蹴也從足全聲一曰卑也絭也臣鍇按魯靈光殿賦曰狡兔跧伏于柎側鄒牷反躡也從足就聲臣鍇按張衡南都賦曰排揵陷局蹴踏咸陽音竹反踐也從足莫大羽聲徒盍反蹈也從足聶聲安懾反渡也從足夸聲苦夜反踐也從足舀聲徒號反踐也從足㕓聲臣鍇曰星之躔次星所履行也茶連反履也從足戔聲臣鍇按尚書序成三既伐東夷遂踐奄奄中國天子無所不賔亦無所剪滅故言踐若履行之而已寂衍反追也從足重聲一曰往來貌臣鍇曰猶言繼踵也之甬反踶也從足卓聲臣鍇曰踶亦當踏意也莊子曰夒踸踔一足踏地重也知教反踶也從足帶聲當奈反踶也從足敞聲一曰跛也臣鍇曰莊子曰蹩􅍷為仁小行也脾迭反䠟足也從足執聲臣鍇曰足燮䠟然連踏也顏延之赭白馬賦曰望朔雲而䠟足今俗作蹀田俠反尌也從足氏聲善𥿄反住足也從足啇聲或曰蹢躅賈侍中説足垢臣鍇按易曰羸豕蹢躅遲夕反蹢躅也從足蜀聲掾曲反躗也從足是聲臣鍇按左思魏都賦曰雲雀踶甍笛計反衛也從足衛聲于歲切觸也從足卒聲一曰駭也一曰蒼踤昨沒反僵也從足厥聲一曰跳也讀亦若橛臣鍇按吕氏春秋曰蹶痿之機此仆也又曰狐猿聞而蹶往遇之則跳也俱越反蹶或徔闕蹶也從足兆聲一曰躍也笛遼反動也從足辰聲止鄰反跱躇不前也徔足屠聲臣鍇曰詩云愛而不見搔首跱躇也陳諸反跳也從足弗聲附勿反椘人謂跳躍曰跖從足庶聲臣鍇曰淮南子曰獸跖實而走真石反馭也從足答聲他合反跳也從足䍃聲延朝反進足有所擷取也從足及聲爾雅曰趿謂之擷臣鍇曰擷摘也速呇反步行躐跋也從足具聲臣鍇曰躐礙也跋草行也輔會反跲也從足質聲詩曰載躓其尾臣鍇曰謂退則摺礙其尾也陟利反躓也從足合聲居怯反述也從足世聲臣鍇按漢書天馬歌曰超容與跇萬里此行也或從辵音逝丑世反讀若逵臣鍇曰􅶐音逵權雖反足跌也從足委聲烏過反足親地從足先聲思典反天寒足跔也從足句聲臣鍇曰筋遇寒不舒也卷于反瘃足也從足困聲臣鍇曰足遇寒裂曰瘃故漢書曰天寒士卒皸瘃墮指者什二二苦衮反雞距也從足巨聲求許反舞履也從足麗聲臣鍇屣履謂足根不正納履也長門賦曰屣履起而倣徨史記曰邯鄲女子跕屣履舞者足騰不正納也踈比反或徔革足所履也從足假聲痕加反跀也從足非聲讀若匪臣鍇曰剕也斧尾反斷足也從足月聲臣鍇曰足見斷為跀其刑名則刖也元伐反跀或從兀曲脛馬也徔足方聲讀與彭同曰亨反馬行貌從足決省聲臣鍇按班固西都賦曰要趹追蹤也橘穴反獸足企也從足幵聲臣鍇按爾雅騉􅕭趼善升甗注云騉蹄似牛臣以為指蹄駢而足跟企舉故能升甗從山形上大下小也魚見反道也從足各聲臣鍇曰通論詳矣勒妬反蹎跋也從足犮聲步捋反轢也從足粦聲力淮反足多指也從足支聲臣鍇曰莊子所謂枝指也翹移反文八十六重四足也上象腓腸下從止弟子職曰問匹何止古文以為詩大匹字亦以為足字或曰胥字一曰匹記也凡匹之屬皆從匹臣鍇曰腓脛中腸也弟子職禮篇也詩大匹即音雅匹記也則音疏師阻反門户疏窗也從匹囱囱象形讀若跙臣鍇曰古言綺疏也指事色居反通也徔爻匹亦聲臣
