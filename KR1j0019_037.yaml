body:
  text: 於從政乎何有騷曰山中人兮芳杜若此皆氣之轉也詩曰母也天只不諒人只語曰吾無隱乎爾此皆語之餘也文者心之圖以曲盡為能也君子之言也舒其節也審聽其音息而知其意况聞其言乎聞其嗚嘆足以感人之性况觀其行事乎是故周人觀晉使曰客容猛非祭焉而周公善聽不言之説也於者始也古之烏字也異盛氣以發言也故象氣之烏聚今試言烏則氣自口出而分散且衆者詞言之氣從鼻出與口相助故象口之氣左右出而上合也爾也者亦辭之助故從之爾者詞之必然猶云如此也若禮曰鼎鼎爾猶猶爾在句之下故象入而丨左右分今試言爾則口氣直出旁四散而盡也音枳者語巳辭也故象口氣下引之形在句之外今試言只則下脣收而氣下出而微也者曳詞之難若春秋曰公至河有疾乃復又曰郊牛之口傷乃免牲皆巾有事而攺非便止故加乃以緩之容有謀也故象氣之出難今試言乃則氣緩而迃也詞也故從口􅡊􅡊氣上出也與粵異粵於也上有所連曰直發端而已故氣自上出無所閡粵從亐亐上閡於一也故虞書之首云曰若稽古帝堯帝舜也或難曰漢洪範云曰雨曰霽豈是上無所連臣應之曰豈得不然此先言卜五占用二總舉其綱紀然後別發端云曰雨曰霽每一曰則文斷而自為首也粵於也故曰粵若來三月皆連上文難者曰王延壽云粵若稽古帝漢粵字豈有所連臣又應曰延壽之賦實摸引尚書本當作曰相承假借為粵非實字也丂者氣欲舒出丂上閡於一也古文以為兮字今試言丂則氣出口而上其聲上而不逺故欲舒而上閡也故今兮字從之兮者詞之所考也若言美人兮西方之人兮慎疑審事言必稽考用駐其詞義近於粵在句之中語之曲折也今試音訶則氣􅳵而無閡猶訶也故從可肯也既可則聲􅳵而通也故可從以言可之也者詞之舒也詩曰曽是莫聽曰者詞也今試言曽則氣直出口而分故象之也者詞之況也書曰矤內史友外史友况譬當徑疾故從矢矤亦抽引之詞故從引省今試言矤則氣直激而疾也者語巳詞也詩曰何嗟及矣誰昔然矣語曰賔不顧矣皆事之訣絶無所奈何者也矢者亦所以訣絶不復返之意也今試言矢則氣亦直而出也几此數者皆虛也激去不返而尤疾也者詞也憭也覺也覺知之欲其速故從矢心術之深非眀者不能見故以口則易知也今試言知則氣亦直而激也凡此數者皆虛也無形可象故擬其口氣之出入舒疾髙下聚散以為之制也若夫緩詞而象於箕云發語而本於氣夫扶為民夫之借焉有烏鳥之名爾同人體為兼禺屬何為負儋斯則析薪為薏為蛇巳若此之類皆兼實名則取象自别也然則詞之虛立與實相扶物之受名依詞取義云之出氣則紛然雲撓其之發口則哆矣箕張推此求之餘可知矣此皆詞之類也此六府也昔伏羲之卦文之𥘉也蒼頡沮誦知結繩之不可以久也仰觀俯察始為文蓋皆象形此六者是也五行者天之五佐德之大者也故皆象之米人所以生也則榖也者麻之類也人所以衣也故專象之水之則無復詰屈而流故犆象其凝結之形也火則無變矣合抱之木生於豪末故木生於木之𥘉也土為隂隂數二土以重厚為德張華曰凡土三尺已上為壤三尺已下為土故土必重所以名土者吐也能生萬物故象二之有所出也金生於土左右注皆金也米者象左右粟粒也不從於所以貴也此六者有形之主而六者之孳益不可勝載也後之賢者隨義而益之故有字凡物之大者略巳象之為文矣後之字皆孳合而為之亦不能及逺故也是之謂六府之類也夫地之所載土之自出土之鎮也萬物之育也精氣之宅也故象之出雲以利天下河潤九里餘三百步澤之大也故亦象之攺邑不攺井八家共井所以飬也故犆象也者山崖之可居也古始變穴居或依山而居重人之所居亦同象之亦宫室之象也此五者之孳化亦不可勝也是之謂地類也夫仰則觀象於天日月是巳皆不獨存皆上屬於天雲象其決鬱回復於天之下雨亦象其自雲而下也故犆象之是之謂天類也夫有生莫靈於人故手足皆象之亦象也覆者用瓜仰則見掌故反瓜為亦象其冠帶之形人之日月也人之體也人之元也故犒象之是之謂人類凡四者之類出之也夫鳥者羽族之通名也中有犆焉烏日中之禽也感孝而至舄者知歲之所在歲者福也俚語曰干舄噪則行人至然則祥鳥也燕者識啓閉之候鳯者百禽之長膺仁背義腹信翼順擇地而翔有德而下延首奮翼五光備舉詩曰鳯凰于飛翽翽其羽故象其羽翼森纚沃若之形也焉出江淮之際亦竒禽也則未知今為何鳥焉皆鳥之貴也故取象之是之謂羽族之屬凡羽族之類出之也十日者治曆之本也象東北十三月之時陽始欲出正其體然上有所冒者二月之後乾然已出矣冒險而出其出難故乁然詰屈也為四月已出而內外皆照炳然而正內外之分也為五月其體丁壯象其正身無所屈撓為六月戊象居中五方相句絞相成也巳正身在中四顧望也為七月萬物成實故象實之著乎枝幹也為八月物已成而未熟隂氣未極陽氣未萌無復象似萬物將收縮白露制物故取萬物之見焦殺若獲􅓧然也者十月十一月之交也隂陽𥘉交壬象物之上下相交受也者十二月之時也土反其宅水歸其壑土縮其壤水收其潦故象水自四方流入內也此十幹之類也古文酉右十二次也人含陽以生者人之𥘉也象陽之𥘉起於歲十一月嬰兒之象也為十二月陽氣彌長有為之時也天造草昧建侯而不寧象人之手有為陽用力為之隂用力以制之皆象用手也為十三月陽謀成而出隂惡甚而力擯之西伯戡黎之時耶故象陽衝隂而出上有冒也為二月陽逾強隂不能制故象陽開出也為三月陽氣長而未盛無可以象故從乙乙物出也人人加功之時也二上也星在上也二古上字上畫短下畫長為聲此形聲字也為四月巳為蛇蛇之變化成文章正陽之月文明之時故象蛇形也為五月隂之𥘉生忤逆陽氣一地也人陽也丨象隂出衝午之也為六月草木盛於五月故聚畜百藥木氣之盛也味主在和五月木雖盛純陽而已味一而未和至六月得隂氣委殺乃盛成而有味故象之為七月隂生三月矣三月一時隂體成矣成則自申固而收束故象之為八月萬物負隂而抱陽陽氣將潛萬物隨之以入故象門之閉也與同意為九月陽氣將滅土生於戊盛於戍言陽將入於土也故從戊一亦象之也為十月盛隂接陽絪緼遘精化育之象十一月而子生矣故象之也此十二支也故以配日曰幹也天地絪緼萬物化生天感而下地感而上隂陽交泰萬物咸亨陽以經之隂以緯之天地經之人實緯之故曰經天緯地之謂文説文解字繫傳第三十七
