  text: 説文解字疑義卷第三十九
  hash: sha256:5e2a119a76fb2d73297a86af636439260f1d500c1c64c730c0a29db8693fe851
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_039-1a}
body:
  text: 繫傳三十九文林郎守祕書省校書郎臣徐鍇撰古者文字少而民務寡是以古字多象形假借後代事繁字轉滋益形聲實象則不能紀逺故也始於八卦瞻天擬地日盈月虧山拔水曲金散土重木挺而上草聚而下皆象形也無形可載有勢可見則為指事上下之別起於互對有下而上上名所以立有上而下下名所以生無定物也故立一而下上引之以見指歸故曰指事會意者人事也無形無勢取義垂訓故作會意載戢干戈殺以止殺故止戈則為武君子先行其言而後從之去食存信故人言必信無形可象無勢可指無意可會故作形聲江河四瀆名以地分華岱五嶽號隨境異逶迤峻極其狀本同故立體於側各以聲韻别之六書之中最為淺末故後代滋益多附焉屬類成字而復於偏旁訓博喻近譬故為轉注人毛匙為老壽耆耋亦老故以老字注之受意於老轉相傳注故謂之轉注義近形聲而有異焉形聲江河不同灘溼各異轉注考老實同妙好無隔此其分也五者不足則假借之古人簡昜之意也出令所以使令或長於德或長於年皆可為長故因而假之若衣在體為衣巾車為巾之類也此聖人制字之大倫而中古之後師有愚智學有工拙智者據義而借令長之類是也淺者逺而假之若山海經以俊為舜列子以進為盡也又有本字湮沒假借獨行若春秋蒞盟本冝作蒞今則為蒞省者是也減女省之字本當從女今之女省字世所不行從便則假借雖移論義則冝有分別今於通釋之內各於本注注之以省疑釋滯成一家之説案説文有䉧瀏等字而無此字疑脫漏臣鍇以為爾雅劉殺也尚書曰重我民無盡劉當云從刀金丣聲或曰從刀鎦省聲案説文有志字而無此字亦脫誤臣鍇據詩序在心為志發言為詩當云從心之聲當在心部案説文垶字注云從土騂省聲而無騂字亦脫誤案説文有稀莃等字而無此字亦脫誤或疑稀字從禾從爻從巾爻巾皆象歷歷然稀疏貌莃字從稀省亦未審也案説文有摧漼等字而無此字此當是崔字之省也案説文有娩晚等字而無此字脫誤案説文有油宙軸等字而無此字亦脫誤李陽氷云即缶字同今按古有由字亦未審也周禮保氏掌教國子六書又曰司寇之屬掌通諸侯八歲屬瞽史諭書名此皆所以制天下御諸侯之經也故古者以鳥迹為始即古文也書有工拙或引筆為畫頭重而尾纎取類賦名謂之科斗孔子壁書滕公墓是也大篆史籀所作所謂籀文是也字體繁復蓋與古文並行故孔子時經復行古文也秦政嚴急務趣約易李斯頗刪籀文謂之小篆會稽山銘及今之篆文是也苛暴尤甚篆復不足以給故程邈作古隸以自贖字畫曲折點綴易成即今之隸文但無八法而已凡此五者皆正文也而鳥書蟲書刻符殳書之類隨事立制同於圗畫非文字之常也然而愚智不同師説或異豪端曲折不能不小有異同許慎所解解其義也點畫多少皆案程式李斯小篆隨筆增減所謂秦文或字體或與小篆為異其中亦多云此篆文此古文是也如衣之類本以覆二人為義本從三屬本從到亡皆本如此而小篆引筆乃有小異而李陽氷一改之使依秦刻石不亦疏乎今有所書寫則可依秦文者依之至於連篇按部一歸之説文本體故臣所書字體與小篆不異者或依小篆如字中畫本直小篆止偃之類其陽氷所説與説文乖異者並入袪妄篇又穆天子傳山海經諸子所有異字本皆篆體相承隸書重紕貤謬未始有極古文尚書足以證矣既未可深考所不取焉五體之外漢魏已來縣針倒薤偃波垂露之類皆字體之外飾造者可述而齊蕭子良王融韋仲庾元威之徒隨意增益妄施小巧以異為博以多為貴至於宋景之史秋胡之妻皆令撰書厚誣前人以成已學是以王融作七國時書皆成隸字其為虛誕不言可明是以一百二十文體臣所不敢言也説文解字疑義卷第三十九
