body:
  text: 文四百二十三重三十八動也從曰在木中凡東之屬皆從東臣鍇曰東方萬物所甲坼萌動平秩東作故為動也其字釋注論之詳矣得紅反二東曹從此闕臣鍇按説文舊本無音今字書音􅔟云闕者無聞焉爾祖叨反文二平土有􅓜木曰林從二木凡林之屬皆從林臣鍇曰叢木故從二木平土故二木齊力尋反豐也從林或説規模字從大􅕊數之積也林者木之多也􅕊與庶同意也商書曰庶草繁無臣鍇曰或説為規模之模字諸部無之者不審信也庶從草草亦衆意今人書繁無作蕪説文以蕪為繁蕪穢也音武夫反庶草繁蕪蕪盛也音武文區反木叢生者從林鬱省聲臣鍇曰此森鬱字鬱鬱鬯字迂拂反叢木一名荆也從林匹聲臣鍇曰荆性亦􅓜生聲謝眺詩曰平楚正蒼然平楚叢木廣逺也襯許反木枝條棽儷貌從林今聲臣鍇曰繁蔚之貌班固西都賦曰鳯蓋棽纚義同敕林反木盛也從林矛聲臣鍇曰故從林莫透反守山林吏也從林鹿聲一曰林屬於山為麓春秋左傳曰沙麓崩臣鍇按周禮虞衡掌山澤林麓士若于人春秋左傳曰山林之木衡鹿守之是也盧木反古文臣鍇曰録聲椱屋棟也從林分聲臣鍇曰復屋皆重梁也林木讀若曽參之參臣鍇曰木多故上出也師今反木多貌從林從木讀若曽參之參所今反文九重一説文解字通釋卷第十一
