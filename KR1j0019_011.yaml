front:
  text: 下均也東方陽氣所起主生木亦漸生東方主仁仁者柔木亦柔故詩曰荏苒柔木木盛於東成於西故藥用木多取東引枝根也門逐反果出江南從木矞聲居律反橘屬從木登聲澄庚反條也似橙而酢從木由聲夏書曰厥包橘柚臣鍇按爾雅柚一名條又詩云杼柚其空此亦用為杼柚字羊狩反果似梨而酢從木虘聲側巴反果名從木𥘉聲連脂反棗也似柿從木甹聲臣鍇曰此亦出上林賦即今之軟棗也以屏反赤實果從木􅙻聲鉏里反梅也從木冉聲臣鍇按爾雅梅一名楠又上林賦楩楠豫章此又音南而淹反楠也可食從木每聲莫堆反或從某果也從木可省聲臣鍇按今旁細可為細若曠反近杏古之聲韻為踈多此類根猛反果也從木示聲臣鍇曰亦假借為奈何也能大反果也從木子聲臣鍇按顓頊之後有逃難於伊侯之虛得李實而食遂以為姓又臯陶為堯大理後以為姓今按管子大理皆作李字臯陶復姓也六矣反古文果也從木兆聲特豪反冬桃從木敄聲莫候反實如小栗從木辛聲春秋傳曰女不過栗臣鍇按今五經皆作榛也側詵反木也孔子冢蓋樹之者從木皆聲臣鍇按史記注孔子卒弟子各持其鄉土之樹來種魯人世世無能名其樹者又曰孔子冢上時多楷樹其域中不生荆棘刺人草肯解反桂也從木侵省聲臣鍇曰書記多言梫桂爾雅云槾木桂注曰南方呼桂厚皮者為木桂七朕反江南木􅔣藥之長從木圭聲臣鍇按桂林郡以此為名又按本草桂心主通血脈利肺肝氣能宣導百藥無畏􅌲桂為諸藥先聘通使是為江南百藥之長也郭璞作桂讃曰桂生南裔拔華峯嶺廣莫熙葩凌霜津頴氣王百藥森然雲挺也古惠反牡曰棠牝曰杜從木尚聲臣鍇按爾雅杜甘棠木之性有牡壯者華而不實林中伐去其牡則牝者亦不實今楊梅為然棠即邵伯所聽男女之訟處必於野樹之下者其言隱不可宣慮有耳屬子垣者也特郎反甘棠也從木土聲從土反木也從木習聲臣鍇按字書槢堅木也似集反木也可以為􅌨從木單聲臣鍇按樿木似檀亦見於禮也旨闡反木也可屈為杅者從木韋聲臣鍇按椲柔木也杅即孟子所謂杯棬也若今屈栁器然于毀反柔木也工官以為耎輪從木酋聲讀若糗臣鍇曰工官即今周禮考工記所載是也耎輪謂車輪外固抱之才也傳曰冬取柞楢之火據此即木色黑也延秋反棕椐木也從木卭聲臣鍇按爾雅棕匱柳注曰未詳或曰似桞反可煮飮具從反母杶也從木侖聲謂若易卦屯是也臣鍇按爾雅棆無疪楩屬似豫章又周禮曰民入山林掄材則又音倫陟倫反木也從木胥聲讀若芟刈之芟臣鍇按左思吳都賦曰楈椰栟閭疑椰木亦名揟椰又按字書楈亦犂柄也仙吕反梅也從木央聲一曰江南橦材其實謂之柍臣鍇按爾雅時英梅注曰今之雀梅又按古謂木材之實者為章故曰豫章之材史記貨殖傳曰木干章漢書百官表有章曹椽近代變章言橦義亦同橦音鍾故舊長安有司農木橦渠即引木渠也今亦謂船拖幹為抱橦自古棟梁之木多出江南乙平反木也從木癸聲又度也臣鍇按書字楑木名也尚書曰納于百揆揆度也尺度用木虬癸反木也從木咎聲讀若皓臣鍇按字書音與果同姦皓反木也從木周聲讀若丩隻留反朴樕木從木欶聲臣鍇按爾雅樕朴心注曰樕别名臣鍇按即今小槲樹栗之類也孫卜反木也從木彝聲華攴切青皮木從木岑聲臣鍇按淮南子曰梣木色青治翳目之藥也髙誘注曰梣木苦歷木也生於山剝取其皮以水浸之正青用洗眼愈久目中膚翳也本草所謂秦皮也子林反或從􅹉省榴文木也從木叕聲益州有棳縣臣鍇按字書音與拙同木名也燭説反木也從木號省聲行髙反遬其也從木炎聲讀若三年導服臣鍇按爾雅注棪實似奈可食有斂反木也從木遄聲巿緣切即來也從木京聲吕張切木也從木禹聲臣鍇按詩楀惟師氏注云楀氏褒似之族黨也于甫反木也從木藟聲臣鍇按爾雅有山藟有虎藟注云江東呼藟為藤似葛而大草謂嬰奧為千歲藟即今人言萬歲藤大者如碗又冬不凋故從木其形蔓似草故從草在草木之間也柳水反籀文臣鍇曰木也象其屈盤􅣂聲赤梀也從木夷聲詩曰隰有托桋臣鍇按爾雅桋赤梀白者梀注云赤梀樹細而岐鋭皮理鍇戾好藂生山中中為車輞白梀葉貟而岐為大木也輞即車輪外圍也寅之反栟櫚也從木并聲臣鍇曰曰栟櫚棕櫚也比令反棕櫚也可作萆也從木㚇聲臣鍇曰萆音闢子紅反楸也從木賈聲春秋傳曰樹六檟於滿圃臣鍇按爾雅楸小而散曰檟伍貟曰樹吾墓檟檟可材也格雅反梓也從木宰省聲臣鍇按爾雅椅椅側詵反山樗也從木尻聲臣鍇按爾雅栲山樗色小白生山中因名云即樗也苦浩切木也從木屯聲夏書曰杶幹栝柏也臣鍇按字書杶木似樗中車轅實不堪食田巡反或從熏臣鍇曰熏聲古文臣鍇曰杶田旁細也杶也從木筍聲臣鍇按春秋左傳范獻子斬雍門之橁以為公琴今字書或云即桐也息寅反白桵棫從木妥聲臣鍇按爾雅棫白桵云山中木也藂生有刺實如耳璫紫赤可啖儒隹反白桵也從木或聲于憶反木也從木息聲臣鍇按字書㮩木名也消式反匱也從木居聲臣鍇按爾雅椐匱注曰木腫節可為杖遣如反椐也從木貴聲求位反杼也從木羽聲其實皂一曰樣臣鍇按爾雅栩杼注曰杼樹也皂赤曰皂斗俗謂之橡可染皂故曰皂杼赤栗之屬莊子曰狃公賦杼是也訓柱反栩也從木豫聲讀若杼直序反古文柔字栩實從木羕聲臣鍇曰今俗書作橡莊子徐旡鬼居于深山拾橡栗而食似獎反劉劉杙從木弋聲臣鍇按爾雅劉劉杙注曰劉子生山中實如梨酢甜核堅出交趾以即反枇杷從木比聲鼻冝反桔梗藥名從木吉聲臣鍇按本草桔梗主胸脅痛輔血氣除寒熱一莖直上三四葉相對似人參故曰直木經莭反木也從木乍聲增絡反木出槖山從木乎聲臣鍇按山海經云槖山多構木不言杼吐都反木也從木晉聲詩曰榛楛濟濟臣鍇按説文無榛字此即榛字也子賤反酸小棗從木然聲一曰柔也臣鍇按上林賦枇杷然柿橪之言柔也人善反欏也從木歲聲詩曰隰有樹臣鍇按爾雅赤羅注曰今楊檖實似梨而小酢可食夕醉反木可作牀几從木段聲讀若賈臣鍇按椵亦楸梓之屬古謂坐榻亦為几故言伏几伏几即人手所憑者也伏膺之几也格雅反木也從木惠岸回桂反木也從木苦聲詩曰榛楛濟濟臣鍇按周禮楛可為矢周武王克商肅慎氏來獻楛矢石砮桓土反木也從木乃聲讀若仍而冰反木也從木頻聲婢民反酸棗也從木二聲臣鍇按爾雅樲酸棗注實小味酢仁至反木也從木肖聲臣鍇按梢樹枝末也爾雅梢梢㰌注曰謂木無枝柯棹長而殺楚辝萷構橚慘之可傷氊巢反木也從木隸聲婁惠反木也從木乎聲録設反木也從木夋聲蘇徇反木也從木畢聲卑聿反木也從木剌聲動遏反書舍人令狐德芬弗羣反似茱茰出淮南從木殺聲臣鍇按爾雅汪榝似茱茰而小赤色疏快反木可作大車輮從木戚聲臣鍇按字書又木殞落貌臣按潘嶽秋興賦曰庭樹槭以灑落是也即肉反木也從木昜聲猶良反河柳也從木聖聲敕貞反小楊也從木丣聲丣古文酉力九反大木可為鉏柄從木聲詳遵反木似欄從木􅒋聲禮天子樹松諸侯柏大夫欒士楊臣鍇曰欄木蘭也樹皆謂家樹也兼反棠棣木從木多聲臣鍇按爾雅棠棣移注曰移似白楊江東呼夫移以支反白棣也從木隸聲臣鍇按爾雅唐棣注曰山中棣樹子似櫻桃可食笛帝反木似橘樅木只聲臣鍇按即藥家枳殼也古云枳棘非鸞鳳所棲潘嶽作間居賦曰芬枳樹離真彼反梓也從木竒聲於離反木厚葉弱枝善搖一名欇從木風聲臣鍇按爾雅楓欇欇山海經黃帝殺蚩尤棄其桎梏為楓木今人謂其上瘤為欇欇遇風雨則長或長三四尺亦曰楓人府通反黃華木從木雚聲臣鍇按爾雅權黃英郭璞云未詳衢貟反木也從木巨聲臣鍇按爾雅楥匱匱柳注未詳俱取反木也從木鬼聲户隈反楮也從木殼聲孤速反榖也從木者聲抽暑反或從寧作枸杞也從木繼省聲一曰監木也臣鍇按爾雅杞枸檵也已惠反枸杞也從木己聲臣鍇按枸杞多生荒域坂岸之上故春秋左傳曰我有圃生之杞兮言非其冝也乞以反木也從木牙聲一曰車軸會也臣鍇曰丫即丫木左思吳都賦所謂丫葉無隂又車軸會記車輪外輞也謂之牙以其穹隆相接若牙齒之相入也五加反木也從木亶聲特丹反木也從木樂聲連的反櫟實一曰鑿首從木求聲臣鍇按爾雅櫟實曰梂注云有梂彚自裹也鑿柄也虔柔反木也從木柬聲郎電反山桑也從木厭聲詩曰其檿其柘臣鍇按爾雅檿桑山桑中弓車轅國語檿弧箕服是也今人以為彈煙嗛反柘桑也從木石聲之射反木可為杖從木膝聲臣鍇曰即楖栗之屬息逸反味稔棗從木還聲臣鍇按爾雅注味短味也爾雅不從木邪沿反梧桐木從木吾聲一曰櫬阮孤反桐木從木榮省聲一曰屋梠之兩頭起者為榮子兵反榮也從木同聲田風反木也從木番聲讀若樊復喧反木白枌從木俞聲羊朱反榆也從木分聲臣鍇按爾雅榆白枌注曰枌榆先生葉却著莢皮色白西京雜記曰漢太上皇祭枌榆之杜也謂樹以枌榆枎云反山枌榆有朿莢可為蕪荑也從木更聲臣鍇曰朿音刺蕪荑即榆莢所為也根杏反散木也從木焦聲臣鍇曰散木不入子用也莊子曰樗散材也自超反木也從木公聲似逄反松或從容臣鍇曰從容聲松心木從木㒼聲臣鍇曰一名松心春秋左傳曰樠木之下沒團反柏葉松身從木會聲古最反松葉柏身從木從聲臣鍇按文子曰老子師常從子李暹注曰言如樅之常不凋思峯反鞠也從木白聲臣鍇按爾雅柏椈注曰禮記鬯曰以椈也不白反木也從木几聲臣鍇按山海經單狐山多機木注曰似榆可燒以糞稻田出蜀中音飢謹美反木也從木占聲先廉反木也從木弄聲益州有梇棟縣臣鍇曰益縣蓋因此木為名也許慎所稱縣名皆謂與字義相涉則引之皆後漢之制後代改易蓋非臣末學所能盡詳也魯棟反鼠梓木從木臾聲詩曰北山有楰臣鍇按爾雅注楸屬也羊朱反黃木可染者也從木危聲臣鍇按史記貨殖傳巵茜子又書記多言鮮支皆此旬委反杒也從木刃聲臣鍇按字書桎杒木名爾吝反榙􅳏木也從木遝聲臣鍇按字書榙􅳏木黑似李道合反榙􅳏木從木答聲讀若遝他合反酸果從甘闕臣鍇按尚書唯爾元孫某禮記曰孝王某某者未定之位宅也酸果故從木甘非聲蓋亦果之酸甘也許慎不聞于師故闕之也莫厚反古文某從口昆崘河隅之長木也從木繇聲臣鍇按穆天子傳曰天子乃釣于河水觀姑繇之木注曰大木也在昆崘哀淑人之丘齊謝莊宣貴妃誄曰涉姑繇而環回望樂池而顧墓或疑莊認木為水臣鍇按潘嶽射雉賦涉青林以遊覽是亦木也又尚書厥草惟蘨又國語曰栱木不生危又山海經顓頊太子長琴居搖山尺言柚皆木高大之名延秋反木生植之揔名從木尌聲臣鍇曰樹之言竪也故詩傳曰夏后樹鼓周禮有井樹謂井之周幹也時遇反籕文木下曰本從木一在其下臣鍇曰一記其處也與末同義指事也輔忖反古文臣鍇曰􅮎固其本也木根從木氐聲臣鍇曰華葉之根曰蒂樹之根曰柢音同也的替反赤心木松柏屬從木一在其中臣鍇曰赤心木之總也一者記其心棗木亦然此亦與木末同義指事也專扶反木株也從木艮聲狗痕反木根也從木朱聲臣鍇曰入土曰根在土上者曰株劉向列女傳曰智伯之園多株不便于馬范氏之子謂代之也輟須反木上曰末從本一其上也臣鍇曰指事也門撥反細理木也從木畟聲臣鍇按字書㮨木似松張衡南都賦亦言之也煎弋反木實也從木象果形在木之上臣鍇曰樹生曰果故在上也指事骨朵反木實也從木絫聲臣鍇按即果之一名也此鄭玄云無皮殼曰也絫力箠反杈枝也從木叉聲臣鍇曰岐枝木亦可以䟫船亦以刺魚潘嶽西征賦曰垂餌出入梃杈來往是也莊子曰杖拿逆立拿亦杈也𥘉牙反木别生條從木支聲臣鍇曰自本而分也故曰别生會意章移反木皮從木卜聲臣鍇曰今藥有厚朴一名厚皮是木之皮也古質朴字多作朴坡嶽反小枝也從木攸聲臣鍇曰自枝而出也笛遼反幹也從木支可為枝詩曰施于條枝臣鍇曰自條而出也故尚書曰枝卜功臣言一一卜之也今人言一枚二枚春秋傳曰以枝數闔枚馬鞭也言以馬鞭數門扇之版也此字會意莫惟反槎識也從木聲夏書曰隨山木讀若刋臣鍇曰木識謂隨所行林木斫其枝為道記識也蓋其斫木低折狀許慎言闕無聞于師也隨其行山路之也史記述黃帝披山通道是也指事刻二反篆文臣鍇曰亦指事也木葉搖白也從木聶聲臣鍇曰謂木遇風而翻見葉背背多白故曰搖白也楓木一名義出于此也真聶反弱貌從木住聲臣鍇按詩曰荏苒柔木又今人謂棖長行裊竹為栠音近拈字上聲是栠者橈弱之意也而沈反木少盛貌從木夭聲詩曰桃之枖枖詩曰愷風自南吹彼棘心棘心夭夭母氏劬勞言棘心所以枖枖臣鍇曰謂草木始生未幾得地力而先長大故詩曰愷風自南吹彼棘心棘心夭夭母氏劬勞言棘心所以速長者以得愷風也子所以速大者以母劬勞而養之也尚書曰厥草唯夭又詩曰桃之夭夭亦喻女子在家形體曰盛長也夫物禁越衆而速大故亦謂短折者為夭也殷喬反木也從木真聲一曰仆木也臣鍇按槇樹杪也按尚書若顛木之有白枿本作此作顛假借也仆顛仆也的煙反一枝也從木廷聲臣鍇曰梃者獨也梃然徑直之貌也留頂反衆盛也從木驫聲逸周書曰疑沮事闕所臻反木標末也從木爂聲臣鍇曰又平聲人多言標置言若樹杪之高置也標之言表也春秋左傳謂路旁樹為道表謂逺望其標以知其道也卑抄反木標末也從木少聲臣鍇曰杪之言抄小也彌小反樹木垂朵朵也從木象形此與采同意而下垂臣鍇曰今謂花為一朵亦取其下垂也此下從木其上几無音但象其垂形無聲非全象形權而言之則指事也采字亦下從木上從人手瓜采擷之言采字則木上實手瓜字有聲此朵則木上直象下垂耳旡聲故曰與采同意而下垂明下盡同也指事兜果反髙木也從木良聲臣鍇曰按嶺南有桄桹為木高又檳榔旡柯實生其專其名皆取高木之義高猶巖廊亦高屋也勒當反大木貌從木間聲臣鍇按春秋左傳晉人謂鄭曰執事橺然授兵登陴將以誰罪橺者徑戾之貌與此字同者然則此亦木之高徑也苟限反木貌從木號聲春秋傳曰歲在枵玄枵虛也臣鍇按爾雅玄枵虛星也子位之次始于女八度終危九度凡三十二度枵虛耗之名也北方主冬木皆虛盡故曰枵故從木色黑故曰玄至丑而陽著木生也尤嬌反樹搖貌從木召聲臣鍇曰亦樹動貌真遙反樹動從木䍃聲臣鍇曰物之易搖無易于木故木之動搖目為一字也延朝反下句曰樛從木翏聲臣鍇按詩南有樛木傳曰木下曲也爾雅作杋今松柏及桑臨崖岸者性多熱飢酬反高木也從木丩丩亦聲臣鍇按爾雅木下句曰朻上句曰喬詩樛木則作樛字按此則爾雅借朻為樛依詩為正也飢酬反邪曲從木聲臣鍇按荀卿子曰良醫之門多病人隱栝之側多曲木也隱栝即矯枉矯楺也謂楺曲使直也迂賞反曲也從木堯聲臣鍇按周易曰大過棟橈也棟橈棟曲也獰教反枎四布也從木夫聲臣鍇曰謂樹枝葉四布也凡無反木檹施從木旖聲賈侍中説檹即掎木可作琴于離反相高也從木小聲私兆反高貌從木曶聲呼兀反木長貌從木參聲詩曰槮差荇菜是也臣鍇按楚辝曰萷構橚槮之可哀參差荇菜不齊之貌非此槮字之義當言讀若詩曰無讀若字寫失之師今反長木貌從木肅聲吏卯反樹貌從木人聲臣鍇按詩傳樹特生貌故曰有杕之杜生于道左是也笛計反木葉隋從木㲋聲讀若薄臣鍇按詩曰十月殞籜古當用此字但古今字異此亦字今之所難行也他作反木長貌從木各聲臣鍇曰亦謂樹高長枝為格故庾信小園賦曰草樹混淆枝格相交又信詩長藤連格徙鈎索反木相摩從木藝聲臣鍇按爾雅木相磨曰槸注曰謂樹皮相切磨也魚世反或從藝作稿也從木古聲夏書曰唯􅙪輅木名也臣鍇曰稿音考困乎反木栝也從木高聲刻保反木素也從木菐聲臣鍇曰按土曰壞木曰朴尚書曰若作梓材既勤朴斫惟其塗丹雘于嶽反剛木也從木貞聲上郡有楨林縣臣鍇曰亦築墻兩頭橫木也尚書曰峙乃楨幹陟情反木曲直也從木矛聲然尤反判也從木斥聲易曰重門擊􅢎臣鍇曰柝亦􅢎也故云判春秋左傳曰魯擊柝聞于邾謂判兩木夾于門為機相擊以警夜也今荒戍多叩故以持更蓋其遺象他作反木之理也從木力聲平原有朸縣臣鍇按石之理解為泐與此義同郎忒反木梃也從木才聲臣鍇曰木之徑直堪入于用者故曰入山棆可為材者人之有才義出于此錢來反小木散材從木此聲臣鍇曰散材謂不入屋及器用也故春秋左傳曰輿曳柴又禮燔柴又勝國之杜柴其上故曰散無所朴斫也士佳反槫桑神木日所出也從木專聲臣鍇按吕氏春秋淮南子山海經漢武內傳東方朔十洲記皆曰槫主海東日所出山海經曰九日出下枝一日生上枝十洲記曰以其樹兩相扶故曰扶桑椹如中國桑椹而金色作扶字吕氏曰東至槫木臣鍇按淮南子曰鄉則作此槫字凡無反明也從日在木上讀若稿臣鍇按淮南子曰日拂于扶桑是謂晨明故東字日在木中登于扶桑是謂朏明匪故杲字曰在木上詩曰杲杲出日也史記天官書曰日晡則反景上照于桑榆間故杳字日在木下杳冥也會意姦皓反冥也從日在木下倚了反角械也從木卻聲一曰木下白也臣鍇曰以角為器也其逆反築牆長板從木􅥘聲春秋傳曰楚圍蔡里而栽臣鍇按春秋左傳曰土功之事水昏正而栽謂始立楨幹及版築之也又栽植也昨萊反搗也從木築聲陟祝反古文臣鍇曰畐愊竹聲臣鍇曰盈之言盈盈無對立之狀古詩曰迢迢牽牛星皎皎河漢女盈盈一水間脈脈不得語也亦征反邪柱也從木堂聲臣鍇曰樘之言䟫也王延壽靈光殿賦曰枝䟫杈牙而斜㯫是也澄庚反柱砥古用木今以石從木耆聲易榰恆凶是臣鍇曰即柱下根也按周易恆卦上六振恆凶王弼云振動也今許慎言榰則孟氏所注易文故不同章移反欂櫨也從木咨聲臣鍇按爾雅栭謂之楶謂梁上短柱上承屋脊者管仲山藻梲蓋刻此柱為山形畫兩旁枝梧木為水藻之又今尚謂此短柱為屋山也簷者直立之意即血反闌檻也從木盾聲樹忍反柱上柎也從木盧聲伊尹曰果之美者箕山之東青鳬之所有甘櫨焉夏熱也一曰有宅檻木出弘農山也臣鍇曰今謂草木枝專華房之蒂為樹此櫨象之即今之斗也自伊尹下出吕氏春秋一曰以下山海經所載也論孤反屋櫨也從木幵聲臣鍇曰斗上橫木承棟者橫之似笄也古兮反栭也從木􅍌聲詩曰其灌其良嶭反屋枅上標從木而聲爾雅曰栭謂之楶臣鍇按爾雅栭即楶也又字書小栗為栭栗忍伊反棼也從木㥯聲于靳反椽也從木燎聲臣鍇按史記禇少孫東方朔傳曰後重中有物出謂大屋廡下椽自上峻下則自其中棟假裝其一旁為椽使若合掌然故曰重有老察二音在車蓋上亦同也勒抱反榱也從木角聲春秋傳曰桓宫之桷椽方曰桷臣鍇按劉燾釋名曰桷確堅而直也江嶽反椽也從木彖聲纏專反秦名為屋椽周謂之榱齊謂之桷從木衰聲臣鍇按春秋刻桓官桷又在左傳曰齊子㞑抽桷擊扉三慶封將死猶援廟桷動于甍至宋伐鄭則曰取桓宫之椽歸為廬門之椽桓宫鄭廟也以此知齊魯謂之桷也所追反秦名屋櫋也齊謂之簷楚謂之梠從木睂聲臣鍇按爾雅楣謂之梁謂門上橫梁也睂猶際也閩之反楣也從木吕聲力舉反梠也從木聲讀若枇杷之枇臣鍇曰按㮰即連簷木也在椽之專際班固西都賦曰鏤檻文㮰是也臯冝反屋榜聮也從木邊省臣鍇曰櫋亦㮰也楚辝九歌曰擘蕙櫋兮既張是也㭉田反㮰也從木詹聲臣鍇按爾雅簷謂之樀今俗書作簷羊亷反屋耜前也從木聲一曰蠶槌田南反摘也從木啻聲爾雅曰簷謂之樀樀朝門讀與滴同臣鍇曰據許慎指曰朝門之簷也顛狄反戶植也從木直聲臣鍇按爾雅植謂之傳傳謂之揬注謂戶持鎖植也植即門户之橫鍵所穿木也鎖所拊焉故謂之揬揬者為橫杠所唐突也神息反或從置臣鍇曰植置亦聲戶樞也從木區聲尺夫反戶也從木兼聲若減反重屋從木婁聲勤兜反房室之疏也從木龍聲臣鍇曰疏即窗也櫳者言若禽獸之籠然臣以為小曰窗闊逺曰櫳來充反楯間子也從木霝聲臣鍇曰即今人闌楯下為橫櫺也故班固西都賦曰伏櫺檻而俯聽以版為之曰軒通名曰檻今人言窗櫺亦是也連丁反棟也從木亡聲爾雅曰杗廇謂之梁臣鍇按爾雅注屋大梁也勿強反短椽也從木束聲臣鍇曰今大屋重撩下四隅多為短椽即此也田録反所以塗也秦謂之杅關東謂之鏝從木于聲臣鍇按春秋左傳鄭子産説晉文公為政杅人以時塓館宫室秦晉鄰接也今江淮間杅為饅即關東也宛都反杅也從木曼聲臣鍇按今人猶謂為泥槾也沒團反門樞謂之椳從木畏聲烏恢反門樞之橫梁從木冒聲臣鍇曰門楣橫木門上樞鼻所附或亦連兩鼻為之以冒門楣也莫號反璧柱從木薄省聲臣鍇曰即壁中小柱西京雜記謂之壁帶班固西都賦謂之落帶所謂落帶金釭也今人謂之破間柱平碧反門橛也從木困聲臣鍇曰謂門兩旁挾門短限今人亦謂門限可以施其兩旁謂之簷限古者多乘車故門限必去之也古者君命將出師曰梱以外者將軍制之是也梱猶𣢾也𣢾如也謂人物出入多觸扣之也孟子曰陳仲子梱屨而食謂織屨畢必以木椎叩之使平易也苦衮反限也從木屑聲臣鍇曰榍所以為限閡也息切反木間從木且聲臣鍇曰間間也柤之言阻也側巴反歫也從木倉聲一曰槍攘也臣鍇按司馬遷書曰見獄吏而頭槍地楮常反限門也從木建聲臣鍇曰門關也所以限門之關也老子曰善閉旡關楗其獻反楔也從木韱聲臣鍇曰謂簮也榍也此即今俗從小上大下為㰇字精亷反櫼也從木契聲臣鍇按此即櫼也爾雅棖謂之楔注曰門兩旁木柣即今府署大門脫者兩旁斜柱兩木于橛之專是也蓋棖亦呼為楔與許慎所言櫼别也息切反編樹木從木册聲爰側反落也從木也聲讀又若他臣鍇按詩曰伐木椅矣折薪杝矣箋云杝謂觀其理不欲妄挫之也池倚反夜行所擊者從木橐聲易曰重門擊􅝵臣鍇按今周易作柝唯周禮作此柝字他作反亭郵表從木亘聲臣鍇曰亭郵立木為表交木于其專則謂之華表言若也華古者十里一長亭五里一短亭郵過也所以止過客也表雙立為桓周禮云執桓圭鄭玄以為若宫室象則謂若雙立之柱也桓又作瓛瓛則馬口吻旁雙纎此圭文亦似雙鐵也戶寒反木帳也從木屋聲臣鍇曰木為帳匡也乙卓反帳柱也從木童聲臣鍇曰亦謂旌旗之幹也宅邦反牀前橫木也從木工聲臣鍇曰即今人謂之牀桯也又對舉也溝尨反牀前几從木呈聲臣鍇曰几所憑也今言牀桯義出于此他寧反桱桯也東方謂之蕩從木巠聲臣鍇曰桯即橫木也桱徑梃之貌也今東方關東江淮謂杉木長而直為杉桱是也古零反安身之几座也從木爿臣鍇曰牀即以安身也春秋左傳曰薳子馮偽病掘地下冰而牀焉至今恭坐則榻也故從木爿則牀疾字之旁象人之斜身有所倚著實不成字至于牆牂戕並從牀字之省形並在右其左並曰聲李陽冰妄言木字右旁為片云爿音牆且説文並無爿字又爿從爿與字殊異又片字直而爿字斜欹則陽氷之謬妄不言可悉也會意乍莊反卧所薦首者從木冘聲之祍反楲窬褻器也從木威聲臣鍇按史記注楲窬即厠中行清器也窬音竇臣又按釋名行清即糞槽謂之清者言其穢汙當常清除之也一曰楲竇即虎子溲器也人君謂之虎子西京雜記李廣與兄射獵冥山之北見伏虎一矢中之以其頭為􅘞器今人鑄銅象之為􅘞器示服猛也又史記張騫傳胸奴破月支取其虜頭為飲器亦􅘞器也楲言穢也迂歸反匱也從木賣聲一曰木名又曰櫝木枕也臣鍇按論語曰有美玉於斯韞櫝而藏諸又韓子曰鄭人賣珠為薰之桂櫝是也駝谷反梳比之揔名也從木節聲臣鍇按周禮節作楖楖之言積也阻瑟反理髮也從木疏省聲臣鍇曰當言從木疏省疏亦聲傳寫脫脵梳之言導也色居反劒押也從木合聲臣鍇曰押匣字也亦謂之鋏楚辝曰帶長鋏之崔嵬是也芴搯反薅器也從木辱聲臣鍇曰薅音蒿即耘田也槈其器也以意作奴姤反或作從金㭉臿也從木入象形眀聲也臣鍇曰眀音懼也卷于反兩刃臿也從木􅘲象形宋魏曰㭉也臣鍇曰臿即鍬鍤字也兩刃形不成字此字難以象形又近于指事牙瓜反或從金于臣鍇曰于聲臿也從木以聲一曰從土輂齊人語臣鍇曰即以字也詳紀反或從里臣鍇曰里聲周禮曰周人輂加載一梩是也耒專從木台聲臣鍇曰即耜刃也弋之反或從金台聲籀文從辝臣鍇曰從木辝聲六義犂一曰犂上曲木犂轅從木軍聲讀若緯或如渾天之渾臣鍇曰今開荒之犂又有岐刃也轅即犂柄也戶昆反摩田器從木憂聲論語曰耰而不輟臣鍇曰謂布種後以此器摩之使土開發處復合以覆種也衣尤反斫也齊謂之鎡錤一曰斤柄性自曲者從木屬聲臣鍇按爾雅注掘钁也孟子雖有鎡錤不如待時趙岐注云鎡錤田器也孟子齊梁之人也周禮曰一宣有半謂之欘注云欘斫斤也柄長二尺輟續反斫謂之􅿛從木箸聲竹勺反收麥器從木巴聲臣鍇按杷者所以聚也字書曰一名渠拏蒲牙反種􅽍也一曰燒麥柃􅽍從木役聲臣鍇按字書又小矛也與辟反木也從木令聲連丁反擊禾連枷也從木弗聲臣鍇按國語管仲説農曰權節其用耒耜芟枷注曰枷柫也所以擊草附弗反柫也從木加聲淮南謂之柍間巴反舂杵也從木午聲臣鍇按㫪字注午杵也臣以為午者直㫪之意此當從言午午亦聲無亦字脫誤也嗔仲反杚斗斛從木既聲臣鍇曰杚戞摩之也此即斗斛量概也茍代反平也從木氣聲臣鍇曰即槩也摩之使平也之為槩其器名也古沒反木叄交以枝炊䉛者也從木省聲臣鍇按字書䉛所漉米也息永反禮有柶柶匕也從木四聲臣鍇曰禮柶所以楔齒也素次反㔶也從木否聲臣鍇按㔶音貢小杯之别名也脯隈反籕文承槃也從木般聲臣鍇按西京雜記中山王文木賦曰製為槃杆米既踟蹰也别安反古文臣鍇按春秋左傳季孫宿伐齊取其鍾以為公盤是盤亦以金為之也籕文從皿槃也從木虒聲臣鍇按爾雅榹亦桃名也則欺反几屬從木安聲臣鍇曰案所憑也烏旰反圜案從木睘聲臣鍇曰圜案謂案曲抱者邪沿反篋也從木咸聲臣鍇曰木篋也函屬于咸反勺也從木斗聲臣鍇按字書枓斗有柄所以斟水拙庾反枓柄從木勺聲臣鍇曰北斗之柄第一屋取此為名杓猶標也片么反龜目酒樽刻木作雲雷象施不窮也從木畾亦聲臣鍇曰龜目所以節畫也若今禮尊有黃目是也史記梁孝王有櫑尊誡後也菩保之靁者圜轉之義故曰不窮畾者本象其畫文故曰畾亦聲指事來堆反櫑或從缶臣鍇按爾雅盎謂之缶注曰盆也畾器之大者故又象作缶也春秋左傳曰瓶之罄矣惟罍之耻瓶常稟受于畾也櫑或從皿畾臣鍇曰皿其器也籕文櫑從缶回臣鍇曰回雷之象也圜榼也從木卑聲頻奚反酒器也從木盍聲臣鍇曰榼之為言盍也枯踏反車笭中橢橢器也從木隋聲臣鍇曰笭車底簀也隋者器長狹中廣而未殺也此器似之秃頗反關東謂之槌關西謂之持從木追聲臣鍇曰今江淮謂之槌此則架蠺薄之木也池瑞反槌也從木特省聲臣鍇曰特特近今之旁紐古者質也知白反槌之橫者也關西謂之撰從木灷聲臣鍇曰其立者謂之槌橫者謂之陳枉反瑚槤也從木連聲臣鍇按書傳夏之四璉殷之六瑚周之八簋周禮考工記夏人上匠殷人上梓周人上輿注曰上尊也湯放桀疾禮樂之壞而尊梓里典反所以几器從木廣聲一曰帷屏風之屬是也臣鍇曰壙之言橫也几者閣也齊謝惠連雪賦日月承幌而通輝幌即此櫎字胡晃反舉食者從木狊聲臣鍇曰如食牀兩頭有柄二人對舉之若今牀俱燭反繘專木也從木毄聲臣鍇曰繘井索也繘專木所以關汲桶也已惠反絡絲檷從木爾聲讀若柅臣鍇按字書絡絲柎也楷足也名洗反主發謂之機從木幾聲臣鍇曰尚書曰若虞機張往省栝于度栝箭受弦處也機弩牙戾也古或以木易曰知機其神乎機事之先見也理之微也一往而不可庶幾乎顔子改過為善不俟終日改也時乎時乎時不再來難得而易失者也故曰顔氏之子殆庶幾乎顔子改過為善不俟終日也故取象于弩牙子貢謂漢隂丈人曰有機于此一日灌百畦是也居希反機持經者也從木聲臣鍇曰此云機機杼之機也詩澄反機之持緯者從木豫聲直與反機持繒者從木聲臣鍇曰椱即軸符秀反履法也從木爰聲讀若檍臣鍇曰織履中模範侯執邾子囚諸門臺栫之以棘是也徂寸反筐當也從木國聲臣鍇曰當者底也韓子曰王巵無當天下足以水無當無底也今俗猶有匡當之言蜀史記諸葛亮與晉宣帝對壘亮欲挑戰遺之巾槶以激辱之然則槶妝奩筐篋之屬也古悔反木階也從木弟聲臣鍇按史記曰無為楇梯梯即階也又山海經曰西王母梯几而戴勝注曰梯憑也臣以為憑則若梯之斜倚著也他帝反杖也從木長聲一曰法也臣鍇按爾雅棖謂之楔今説文以字當之故以此棖為杖宅爭反牛鼻中檈也從不聲臣鍇曰以柔木為檈以穿牛鼻也俱便反箠也從木專聲一曰揣度也一曰剟也臣鍇曰剟刋削也兜果反弋也從木厥聲一曰門梱也臣鍇按爾雅樴謂之杙注橛也蓋直一段之木也其𥘉謂之橛弋樴及其入用各因隨所在為名故曰在地謂之臬臬門限也大者謂之栱長者謂之閣説文無杙字杙只作弋以此推之則其前所釋名古文式字注彌復有驗也瞿月反弋也從木戠聲章直反持也從木文聲直向反棓也從木友聲臣鍇以為此限詩所謂枝葉未有害本實先撥撥字如此北末反梲也從木杏聲步項反擊也齊謂之終葵從木隹聲臣鍇曰終葵椎之别名也故玉珽終葵首作椎形也直誰反斧柄也從木可聲臣鍇按周禮注伐木之柯柄長三尺又太公六韜有大柯斧也更和反木杖也從木兌聲他活切又之説切柯也從木丙聲鄙命反或從秉臣鍇按史記天官書斗柄字多作此或作秉攢也從木必聲臣鍇按櫕即矛戟柄亦謂之廬亦曰矜周禮考工記秦無廬非無廬也夫人人皆作也臣謂積竹木謂合竹木為之也若今之杖多然筆媚反積竹杖從木贊聲一曰穿一曰藂木臣鍇曰訓穿即鑽字也藂即音巑也全丸反蒦柄也從木尸聲臣鍇曰蒦即今絡絲篗也杘其柄也敕稚反杘或從木尼聲臣鍇按周易繫于金柅是也所以輔弓弩從木旁聲臣鍇曰正弓弩之躰也輔事反榜也從木敬聲臣鍇按禮曰操弓不反檠韓詩外傳曰道可以為人之輔檠是也虔迎反栝也從木隱省聲臣鍇按尚書有隱栝之也隱審也栝檢栝也此即正邪曲之器也荀卿子曰隱栝之側多曲木是也古今皆借隱字為之于靳反櫽也從木􅡜聲一曰矢桰築弦處臣鍇按尚書曰往省括于度是也古活反慱棊從木其聲臣鍇曰棊者方正之名也古通謂慱奕之字為棊故樗蒲之子用木為之也按楚辝菎蔽木付聲甫無反擊鼓杖也從木包聲甫無反五聲八音㧾名象鼓鞞木􅶅也臣鍇曰通論備矣逆捉反柷樂也從木空聲臣鍇曰古亦謂之椌楬也苦尨反樂木工用柷聲音為亨從木柷省聲臣鍇按字書柷之言始也隻逐反牘朴也從木斬聲臣鍇曰牘朴謂始削粗朴也自淡反牒也從木乙聲臣鍇曰牒亦木牘也側滑反書署也從木僉聲臣鍇曰書函之蓋也三刻其上繩緘之然後填以泥題書而印之也大唐開元封禪禮為石函以盛玉牒用石檢也其閃反二尺書從木敫聲臣鍇按檄徵兵之書也漢高祖曰吾以羽檄徴天下兵有急則插以羽也又爾雅木無枝為檄注檄棹直上也顛狄反傳書也從木啓省聲臣鍇按宋書王曇首曰臣不見白虎幡銀字棨是也然則棨幡也崔豹古今注有信幡以傳詔命一曰棨戟衣也溪稱反車歷録束交也從木敄聲詩曰五楘梁輈臣鍇曰謂車輈上木也門逐反行馬也從木互聲周禮曰設梐枑再重臣鍇按周禮掌舍之職也注曰若今之行馬也臣謂此所以為衛也漢魏三公門施行馬枑者交互其木也渾素反梐枑從木陛省聲比鬼反驢上負也從木反聲讀若急臣鍇按今人為木牀以跨驢首以負載物即古之極也古人多言負笈謂自負之也極即笈字極之言篋也其輒反極也從木去聲遣如反大車枙從木鬲聲臣鍇按張衡西京賦曰啇旅連槅是也溝厄反車轂中空也從木噪聲讀若藪臣鍇曰車轂中貫軸處也周禮作藪假借也數雛反盛膏器從木咼聲讀若過臣鍇按古者車行其軸當常滑易故常載脂膏以塗軸也此即其器也故春秋後語淳于髠説鄒忌曰豨膏棘軸所以為滑棘即棗亦堅緻滑易之木也周禮牛羊屬為脂豕屬為膏又齊人謂淳于髠為炙楇謂其言長而有味如炙楇器雖久而膏不盡也骨朵反馬柱從木卬聲一曰堅也臣鍇按陳壽蜀書督郵以公事詣蜀先主縣主謁之不見解綬縳督郵枊又晉王謐縳宋武帝于馬枊今京師有馬桞洲也謂之枊者旁有一􅍻卬起也我亢反棝斗可射鼠從木固聲臣鍇按此即今人鑿木為斗上施柄安弓為機以射鼠是也棝之言錮也護也骨度反山行所乘者從木纍聲虞書曰豫乘四載水行乘舟陸行乘車山行乘欙澤行乘輴臣鍇按經傳説四載甚多紛紜不定史記曰陸行乘車水行乘船泥行乘橇山行乘檋孟康注橇形如箕擲行泥上如淳曰橇音茅蕝之蕝謂以版置泥上以通行路徐廣曰檋一作橋音丘遙反如淳曰檋謂以鐡如錐頭長半寸施于履則不如跌此其顯也臣鍇按字書橇音趫踏蹢行臣以為今優戲有踏趫為木腳以行禹既為司空則不當如此履危苦版置泥上以通行器泥少則車能涉之泥長則運其版者不亦勞乎版上又當乘車孰若乘軌以行泥之易乎若如如淳所言履下施鐵錐即今之木履耳何謂乘乎以行山土猶可以行山石鐡錐復何以安之謝靈運古之巧性者世間器用多所改易以從蕳人好山行但作去齒之屐耳若橇為便易靈運便應為之而不作乎則孔安國所説許慎同山行乘欙臣謂以纝索系木以自固而行晉鄧艾伐蜀以氊自裹縣繩以墜是也輴即輴也若下棺車而無旁璧及蓋凡行深泥有輻即礙故此輴全木為輪而無輻利以行泥若今曵木石拖車然故周禮曰凡為輪行澤者欲杼注杼謂削薄其踐地曰杼以行澤則是刀以割塗也是故塗不附是也塗泥也是古有泥之車也故後漢馬少遊云下澤車臣鍇以為史記所言􅞬音枸即近周禮所言輂車謂以索木自周固使人輂之以行也則是安國所言欙也橇字從毳亦應不可音毳也此形聲言之亦音當近安國所言軓也如此則史記所説四載與安國同但師説口傳而文字異故致孟康如淳妄解之也臣又按仙書有乘毛車以渡弱水毛毳也又抱朴子有步蹻法故仙書有龍蹻經謂近天有剛氣可以勝人為術以步之也如此之説雖近終未可通于傳書曰臣鍇不敢𫐠也司馬遷在漢武帝時舊周之史氏其為學也最慱其遊行也最周又考以方國之語故老之記而孔安國親承聖人之後其為學也詳慎其為尚書傳曰與史遷異處而暗同其為説合今古之情理至唐太宗文武皇帝詔儒臣為孔氏尚書正義列于學官百家不能易臣以為許慎居後漢之末抑諸家之雜説從安國之雅言居七百年之前而暗合後聖自非沮誦降靈命世其孰與此乎力龜反水上橫木所以渡者也從木寉聲臣鍇曰此即今所謂水杓橋也榷之言罩也人謂粗略而舉之謂之楊榷也江嶽反水梁也從木喬聲臣鍇曰橋之言橇也矯然也又象人之趫捷能跨越也伎昭反水橋也從木從水刃聲臣鍇曰刃音創或曰石渡水為梁詩曰弊笱在梁此皆謂長岸入水或以之渡或以遏水取魚又詩造舟為梁即今浮橋也三者雖異其橫為梁之義則同古蓋未有跨水之橋故六韜有飛杠以越大水即今之橋可以施可以設者張衡思玄賦曰豆驪龍之飛梁是也又屋梁釋名曰梁者屋梁也其絶水之梁義同柳昌反古文臣鍇曰從兩木一梁之中橫象從水指事船揔名從木叟聲臣鍇曰今俗言船一也素叨反海中大船從木撥省聲扶月反舟棹也從木咠聲臣鍇曰棹音棖效反即橈也節攝反江中大船名從木蠡聲蓮弟反木因也從木交聲臣鍇按校者連木也易曰荷校滅耳此桎也荷校滅趾梏也又漢書校獵謂連接木以闌禽獸又軍中有校隊亦是也木缶者謂以木為缶形相連接也韓信以木􅎆渡軍義亦相類也角效反澤中守草樓從木巢聲臣鍇曰謂其高若鳥巢也今田中守稻屋然春秋左傳楚子登樔車以望是也事交反捋取也從木瓜臣鍇曰會意七海反削木札朴也從木聲陳楚謂之札林臣鍇曰札即木牘也後漢書方術楊方傳云風吹札林是也弗乂反闌木也從木黃聲户更反檢柙也從木夾聲臣鍇曰謂書封函之上恐磨滅文字更以一版於上柙護之今人作柙之封禪玉檢上用柙也今人言文書曰今謂棊局為枰亦言上平也韋昭慱奕論曰思不出乎一枰是也又枰仲木名左思吳都賦曰枰仲君遷是也弼兵反析木從木立聲臣鍇曰楬析之殺也魯公使公子彭生柆而殺之是也勒沓反邪斫也從木差聲春秋傳曰山木不槎臣鍇按此公羊傳之言傳寫脫兩字也仕鮓反斷也從木出聲讀若爾雅貀無前足之貀臣鍇曰柮之言兀也女滑反斷木也從木􅔧聲春秋傳曰柮臣鍇按孟子曰楚謂之檮杌晉謂之乘魯謂之春秋乘者無所不載也檮杌惡木也王于記惡以為戒也杌柮同特豪反破木從木斤聲一曰析也臣鍇按詩曰析薪柁矣是也星激反木薪也從木取聲臣鍇按禮記鳳皇騏麟皆在郊棷郊者薪米之所也側丘反㮯木薪也從木完聲臣鍇曰㮯混也不破之木也禮記説有虞氏謂之梡注曰斷木為之也臣鍇為亦混成而為之也胡本反梡木未析也從木圂聲胡昆反楄部方木也從木扁聲春秋傳曰楄部薦幹臣鍇按春秋左傳作楄柎足也又按周禮考工記謂車蓋上斗為部為方之名也屏堅反以木有所逼束從木畐聲詩曰夏而楅衡臣鍇桉楅衡以防牛觸人故以一木橫于角專也衡橫也彼即反編也葉薄也從木世聲臣鍇曰楄者闊也枼之言葉也如木葉之薄也亦接反積火燎之也從木從火酉聲詩曰薪之槱之周禮以槱燎祠司中司命臣鍇曰槱燎祭名也羊狩反柴祭天神或從示息止也從人依木喜彪反休或從廣竟也從木恆聲臣鍇曰竟者竟極之也橫亘之也都亘反古文臣鍇曰舟竟兩岸也詩曰造舟為梁梁橫亘也桎梏也從木戒聲一曰器之惣名一曰持一曰有盛為械無盛為器恆夫反械也從木手手亦聲臣鍇曰義取木在手手會意榖細反足械也從木至聲臣鍇曰桎之言躓也躓礙之也之曰反手械也所以告天也從木告聲臣鍇曰械之以告天也尚書曰天討有罪五刑五用哉骨僕反櫪㯕椑指也從木歷聲臣鍇曰以木椑十指而縳之也連的反櫪㯕也從木斯聲斯低反止也從木門臣鍇曰間猶闌也易曰間有家陶潛有間情賦謂自間止其情𣣔也候艱反櫳也從木監聲一曰圈臣鍇曰古謂檻車又舟檻又軒櫺之下為櫺曰闌以版曰軒曰檻以檻禽獸故曰圈寒犯反檻也從木龍聲來充反檻也以藏虎兕從木甲聲臣鍇按論語曰虎兕出于柙又穆天子傳曰七萃之士高奔戎捕虎生獻之天子命為柙養之于東虞謂其地曰虎牢今鄭州也鶯甲反古文柙從口臣鍇曰口匣之象也中其物也關也所以掩尸從木官聲古安反棺也從木親聲春秋傳曰士輿櫬是臣鍇按爾雅又木槿也𥘉僅反棺櫝也從木彗聲相衛反葬有木郭也從木聲昆霍反揭桀也從木曷聲春秋傳曰楬而書之臣鍇曰揭舉也周禮遺物者揭而書之此言春秋傳寫之誤其熱反不孝鳥也日至捕磔梟之從鳥在木上臣鍇按漢儀以夏至為梟羹以賜百官𣣔絶其類也夏至微隂始起育萬物梟害其母故以此日殺之也堅蕭反輔也從木非聲臣鍇按棐輔也輔即弓檠也故輔從木又木名按羊欣筆法云王羲之見其門生棐柷滑淨即書之臣鍇桉棐木似杉而細白也斧尾反木長也從木延聲詩曰松桷有梴敕連反木也可以為車軸材從木齊聲臣鍇按爾雅櫅白棗注曰白棗白熟者也子泥反棗也從木僕聲臣鍇按爾雅朴枹者注以詩棫朴言枹櫟也按爾雅釋木方説諸棗而連屬云朴枹者則注解者自然以此朴為棗也許慎所引爾雅注在張楫以前而今學官所列及臣鍇所引是晉郭璞注所以有與許愼不同也伏反
