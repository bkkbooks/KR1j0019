body:
  text: 繫傳二十八文林郎守秘書省校書郎臣徐鍇傳釋朝散大夫行祕書省校書郎臣朱翶反切四十二部文重小􅊟也象形凡􅎧之属皆从􅎧臣鍇曰再尸象推之漸進也都魁反危高也从􅎧屮声讀若臣鍇曰辥字从此知舌反吏事君也从宀从􅎧􅎧猶衆也此與師同意臣鍇曰按國語天子千品萬官也冖在屋下也師从􅎧亦取義于衆也㑹意古安反文三大陸山無石也象形凡􅊟之属皆从􅊟臣鍇曰彌高大也故从三尸符九反古文􅊟大􅊟也从􅊟夌声力膺反大􅊟也从􅊟鯀声胡本反地理也从􅊟力声臣鍇曰地之脈理也泐字从此郎忒反闇也水之南山之北也从􅊟侌声臣鍇曰山北水南日所不及都吟反高明也从􅊟易声猶良反髙平地从􅊟坴声栗菊反籕文陸如此大陵曰阿从􅊟可声一曰阿曲􅊟也鸎何反阪也从􅊟皮声一曰沱也彼移反坡者曰阪从􅊟反声一曰澤障也一曰山脅也福産反阪隅也从􅊟取声臣鍇按山海經曰海内西北陬側丘反陬也从􅊟禺声元無反阻難也从􅊟僉声香貶反阻也从􅊟㫐声一曰門榍侯産反險也从􅊟且声側所反陮隗高也从􅊟隹声臣鍇曰京高立也特賄反陮隗也从􅊟鬼声魚賄反高也一曰石也从􅊟允声與凖反磊也从􅊟􅑰声落凂反陖也从􅊟肖声臣鍇曰高竦也太玄曰豊牆阯七肖反陗高也从􅊟夋声蘇狗反仰也从􅊟登声徒亘反阸陜也从􅊟㔷声勒豆反隘也从􅊟夾下夾反登也从􅊟歩竹力反古文陟如此高下也从􅊟臽声一曰陟寒蘸反阪下湮也从􅊟㬎声似集反也从􅊟區声噐于反下隊也从􅊟䝿声徒崔反从高墮也从􅊟㒸声臣鍇曰顚隊字本無土也徒佩反下也从􅊟夅声艮巷反从高下也从􅊟員声易曰有隕自天雨牝反小崩也从􅊟也声臣鍇按左思吳都賦曰崩巒陁岑池倚反危也从􅊟从毀省徐巡臣為􅥳㐫也賈侍中說􅥳法度也班固說􅥳不安也周書邦之阢􅥳讀若虹蜺之蜺語挈反敗城􅊟曰隓从􅊟声臣鍇曰今俗作墮許規反臣次立按徐鉉曰說文無字蓋二左也衆力左之故从二左篆文隓如此仄也从􅊟頃声屈呈反落也从􅊟多声圖坐反閬也从􅊟亢声臣鍇曰阬閬高大而空楚辭曰導帝之乎九阬九州也此亦阬塹字看浪反通溝臣防水也从􅊟賣声讀若洞陁谷反古文􅭖从谷隄也从􅊟方声臣鍇按春秋左氏傳塹防門而守之浮長反防或从土塘也从􅊟是声的齊反基也从􅊟止声只耳反阯或从土山絶坎也从􅊟巠声臣鍇按尔雅山絶陘注連絶也堅經反附婁小土山也从􅊟巠声春秋傳婁無松栢臣鍇曰今左傳作培假借户經切秦謂陵阪曰阺从􅊟氐声臣鍇曰古言隴阺的米反石山載土也从􅊟几声五忽反崖也从􅊟兼声讀若儼牛檢反塞也从􅊟戹声晏索反障也从􅊟鬲声溝厄反隔也从􅊟童声止向反蔽也從􅊟㥯声依謹反水隈崖也从􅊟奥声嘔報反水曲隩也从􅊟畏声千枚反商小塊也从臾􅊟臣鍇曰遣字从此溪善反水衡官谷也从􅊟解声一曰小谿臣鍇曰古亦言荅也猴豸反天水大阪也从􅊟龍声吕恐反酒泉天䧇阪从􅊟衣声于機反弘農陜也虢國王季之子所封也从􅊟夾声收儼反弘農陜東陬也从􅊟無声文區反河東安邑陬也从􅊟卷声居逺反上黨陭氏阪也从􅊟竒声於竒反北陵西隃鴈門是也从􅊟俞声臣鍇按尔雅注即鴈門山失喻反代郡五阮關也从􅊟元声讀若昆擬逺反大􅊟也一曰右扶風郿有䧊􅊟从􅊟告声骨僕反丘名也从􅊟貞声陟情反丘名也从􅊟武声弗孺反丘名也从􅊟丁声讀若丁的冥反鄭地坂也从􅊟為声春秋傳曰将㑹鄭伯于䧦喧垂反如渚者丘从􅊟者声水中高者也諸與反宛丘也舜後嬀滿所封也从􅊟木申声値辰反古文陳省木壁危也从􅊟占声臣鍇按謝朓曰阽危頼宗羊亷反再成丘也在濟隂从􅊟匋声夏書曰東至于陶丘陶丘有堯城堯嘗所居故堯號陶唐氏也特豪反耕㠯臿浚出下壚土一曰耕休田也从土􅊟召声止要反殿陛也从􅊟余声臣鍇曰王粲賦云循階除而丁降也陳諸反陛也从􅊟皆声古鍇反主階也从􅊟乍声昨怒反升髙陛也从􅊟坒声頻啓反階次也从􅊟亥声臣鍇曰禮有陔夏樂謂擊鼓為登階之節筍孩反壁際孔也从􅊟􅮼声起逆反壁㑹也从􅊟祭声子歳反重土也一曰滿也後􅊟咅声一曰陪臣陪備也臣鍇曰諸侯之臣於天子曰陪臣歩雷反道邉􅋻垣也从􅊟彖声徒亂反築牆声也从􅊟耎声詩曰捄之陾陾而氷反城上女牆俾倪也从􅊟卑声頻移反籕文陴从􅴹城池也有水曰沱無水曰隍从􅊟皇声易曰城復于隍臣鍇按尚書曰若納諸隍也戸光反依山谷爲牛馬圈也从􅊟去声臣鍇按揚雄羽獵賦曰泰山爲阹遣如反危也从􅊟垂声是吹反小障也一曰􅋻城也从􅊟烏声臣鍇曰董卓爲郿隖隖堡障也宛古反堅也从􅊟完声俱便反水􅊟也从􅊟辰声臣鍇曰若漘岸也是倫反山􅊟䧟也从􅊟侖声勞存反力􅊟也从􅊟戔声慈竹反文九十二臣次立按說文文九十二𥙷遺䧖一字重九兩􅊟之間也从二􅊟凡􅤦之属皆从􅤦闕符九反􅊟也从􅤦夫声榮節反臣次立按說文曰从􅤦决省声陋也从􅤦声臣鍇曰詩曰誕寘之巷乙賣反篆文从􅊟塞上亭守㷭火者从􅤦从火从遂遂亦声夕位反篆文省文四重二累坂土為牆壁象形也凡厽之属皆从厽臣鍇曰叄字亦或从此力委反増也从糸厽厽亦声絫十黍之重也力委反累墼也从厽从土臣鍇曰今但作壘壘壁壘也力委反文三隂数也象四分之形凡凡四之属皆从四素次反古文四如此籀文四文一重二辨積物也象形凡宁之属皆从宁臣鍇曰辨分别也象上隆四周之形直與反㡒也所以載盛米从甾甾缶也从宁宁亦声臣鍇曰㡒音椿陟吕反五行也从二隂陽在天地間交午也凡五属之皆从五臣鍇曰交午更用事也二天地也隅古反古文五如此臣鍇曰但象交午而已文一重一易之數隂変於六正於八从入入凡六之属皆从六臣鍇曰象一变二也栗菊反文一陽之正也从一微隂从中邪岀也凡七之属皆从七秋日反文一篆文禸从足柔走獸緫名也頭象形从禸合声禽离兕頭相佀臣鍇曰㓙頭象也臣任反山神獸也从禽頭从禸屮声毆陽喬說离猛獸也臣鍇按春秋左傳曰魍魎离魅莫能逄之丑離反臣次立按徐鉉曰从􅋄義無所取疑象形蟲也象形从厹舞飯反周成王時州靡國獻人身反踵自笑笑即上脣弇其自食人北方謂之土螻尔雅曰如人𬒳髮象形从曰从禸讀若費一曰一名梟羊臣鍇曰反踵脚跟在前也符既反蟲也象形从禸臣鍇曰牙齒蟲病謂之齲齒牙甫反古文禹如此蟲也象形从禸讀若偰私列反古文卨如此文七重三也象耳頭足禸地之形古文嘼下禸也凡嘼之属皆从嘼臣鍇曰古文下从内作也楮又反守備也从犬嘼亦声臣鍇曰獸守山也詩救反文二位東方之孟陽气崩動从木載孚甲之象也大一經曰頭玄為甲甲為人頭凡甲之属皆从甲臣鍇曰甲在東北甲子陽气所起也自内而起故孚甲胄之地孚猶葭莩殻籜也其字形亦取象人頭也漢書律暦志曰申甲於甲溝呷反古文甲始一見于十歲成于木之象臣鍇曰申一也甲乙為榦其數十成于東方人象木也文一重一象春艸木冤曲而出隂气尚強其出乙乙也乙與丨同意乙承甲象人頸也凡乙之属皆从乙臣鍇曰此與燕燕乙之字音義皆别亦冝有分此甲乙字下迂曲也丨音徹同為出也乙乙未展也律暦志曰奮乹于乙殷筆反上出也从乙乙物之逹也倝声臣鍇按易曰夫乾確然又曰確乎其不可㧞潜龍也君子終日乾乾自強不息也故从乙乙冐難而出也其延反籕文乾如此治也从􅜆从乙乙治之也臣鍇曰乙者治之難也魯彖反異也从乙又声臣鍇曰乙者欲出而見閡見閡則顯其九異天同焉皆忠不知其所以殊靡然皆恱不知其所以異故必見閡見閡而為不已然後彰其特出焉明秋反文四重一位南方也萬物成炳然隂气𥘉起陽气将虧从一入冂一者陽也丙承乙象人也凡丙之属皆从丙臣鍇曰陽功就萬物皆成炳然彰著夫物極則衰功成則去明盛而晦陽極而隂物非隂不㝎夏之有秋所以揫歛焦殺萬物使成也冂猶門也易曰乾坤其易之門邪天地隂陽之門户陽功成將去冂也律暦志曰明炳於丙㑹意鄙永反文一夏時萬物皆丁壯成實象形也丁承丙象人心也凡丁之属皆从丁臣鍇曰物挺然成立之皃夫萬物方茂非成之謂衰殺乃見其成人也方剛之謂守柔乃見其剛隂气盛于外陽气營于内故萬物炳然非所謂成得一隂之賛揫歛之乃爲成故盛于丙成於丁其形正中故象心律暦志曰大成于丁的冥反文一中宫也象六甲三龍相拘絞也戊承丁象人脅也凡戊之属皆从戊臣鍇曰五土無㝎居主在中往來不相越故曰拘絞人脅亦相任也亦在中五象也律暦志曰豐楙于戊莫遘反就也从戊丁声臣鍇曰戊中宫成於中也丁成也㑹意示征及古文成从戊午臣鍇曰午南方亦物成之義文二重一中宫也象萬物辟藏詘之形也已承戊象人腹也凡已之属皆从巳臣鍇曰萬物與隂陽之气藏則歸土屈曲包含象人腹圜曲也人腹中央也律暦志曰理紀于已訖耳反古文已如此臣鍇曰孔子家語子夏間讀史記曰晉師以三豕渡河曰已亥也然則彼已之字當作此已字謹身有所承也从已从丞讀若詩曰赤舄已已已隠反長踞也从已其声讀若杞暨已反文三重一秋時萬物成而金剛味辛辛痡即泣出从一辛辛辠也辛承庚象人股凡辛之属皆从辛臣鍇曰言萬物方盛初見㫁制民難與慮始故辛痡也人股漸焦殺反故象之辛亦漸揫歛也律暦志曰悉新于辛㑹意息因反犯法也从自辛言辠人蹙自辛苦之憂秦㠯􅓧佀皇字改爲罪臣鍇曰㑹意造浼反辠也从辛古声古乎反古文辜从死辠也从辛声私列反不受也从受辛冝辤之也臣鍇曰㑹意夕兹反籕文辭从台辭訟也从􅜆辛􅜆猶理辜也臣鍇曰㑹意夕兹反籕文辭從司反文一冬時水土平可揆度象水从四方流入地中形也癸承壬象人足也凡癸之属皆从癸臣鍇曰冬萬物成焉羣動息焉故可為度故冬至律黃鍾𥘉九度量所起于黄鍾秋收潦而水清冬土几其宅水歸其壑也足最在下故取象也律暦志曰陳揆于癸見水反籕文癸从癶天声臣鍇曰足也文一重一十一月陽气動萬物滋入以為稱象形也凡子之属皆从子臣鍇曰十一月夜半陽气所起人承陽本其初故以為稱律暦志曰孳萌于子也通論詳矣津矣反古文從巛髪也籕文子从有髪臂脛在凡上也褢子也从子凡臣鍇曰几音殊草木之實垂亦取象于凡朶字是也人褢姙似之也㑹意以證反主子免身也从子免臣鍇曰㑹意美選反乳也愛也从宀子子亦声臣鍇曰易曰女子貞十年不字字乳也春秋左傳曰大不字小字愛也宀覆之也㑹意慈伺反乳也从子声或曰㝅瞀臣鍇按春秋左傳曰楚人謂乳為㝅故名子文曰㝅於菟㝅瞀愚闇也格漚反一乳兩子也从子􅒋声臣鍇曰孿猶連也數眷反乳子也一曰輪也輪尚小也从子需声臣鍇曰史記孺子可教礼大夫妻曰孺人猶言小童也閆務反少偁从子稚省稚亦声見翠反長也从子皿声莫更反古文孟如此庶子也从子辥声臣鍇曰通論詳矣魚滅反汲汲生也从子兹声臣鍇曰人生在勤故从子也則斯反籕文孳从絲無父也从子孤声臣鍇曰通論詳矣古乎反恤問也从子在声臣鍇曰在亦存也㑹意在坤反枚也从子爻声臣鍇曰教从此加肴反惑也从子止􅹆矢声臣鍇曰㓜子多惑也止不通也􅎅反比之也矢声硏之反文十五重四尦也从子無臂象形凡了之属皆从了臣鍇曰尦音鳥旁無輔了尦然也吕曉反無右臂也从了乚象形經節反無左臂象形從了声俱越反文三謹也从三子凡孨之属皆从孨讀若翦臣鍇曰三人同行必有師焉君子慎獨矢能三子同君而不散離必謹守者也職件反迮也从孨在尸下一曰孨声一曰呻吟也臣鍇曰尸屋象也士閑反盛皃也从孨从田讀若薿一曰若存臣鍇曰曰音越曰詞也今音女立反靈光殿賦曰芝栭櫕羅以戢孨曰牛以反籕文孴从二子一曰竒字晉文三重一不順怱出也从倒子易曰突如其來如不孝子突出不容於禸也即易突字也凡之属皆从云臣鍇曰反為人子之道也故文从反子字舜之事父烝烝乂不格姦瞽亦允若父求使之未嘗不在于側求殺之未嘗得也突然反道而出是悖也他骨反倒或从古文子養子使作善也从肉声虞書曰教育子臣鍇曰不順子也不順者尚教之况順者乎今尚書曰教胄子也融六反育或从毎通也从㐬从疋疋亦声臣鍇曰白虎通書之教也疋䟽也㑹色居反文三重二紐也十二月萬物動用事象手之形時加丑亦舉手時也凡丑之属皆从丑臣鍇曰卜所執不出于手也眛爽爲丑人皆起有爲也律曆志曰紐牙于丑敕紐反食肉也从肉五丑亦声女就反進獻也从羊羊所進也从丑丑亦声臣鍇曰丑手進也㑹意息抽反文三文二震也三月陽气動雷電振民農時也物皆生从乙匕象芸逹厂声也辰房星天時也从二二古文上也凡辰之属皆从辰臣鍇曰雷出舊豫之時也匕化也乙草大芒初出曲卷也爾雅云大辰房心尾也大火謂之大辰大火心也明者以為時候心在中最明故時候主焉尚書曰撫于五辰辰時也律暦志曰振羙于辰石倫反古文辰恥也从寸在辰下失耕時于封畺上戮之辰者農之時也故房星為辰田候也臣鍇按國語曰農祥晨正民于是耕農祥房星為大辰也儒曲反文二重一文二味也六月滋味也五行木老于未象木重枝葉也凡未之属皆从未臣鍇曰律暦志曰昧薆于未勿貴反文一神也七月隂气成体自申束从曰自持也吏㠯餔時聽事申旦政也凡申之属皆从申臣鍇曰七月三隂故曰隂气成九三陽成君子終日乾乾六三隂成律暦志曰申堅于申式人反古文申籕文申擊小鼓引樂声也从申東声周礼曰小樂事鼓讀若引臣鍇曰詩曰應縣鼓異印反束縳椊柮為臾从申从乙臣鍇曰申束縛也乙屈也㑹意羊朱反冡声母柬反熟􅯅也从酉甚声移今反醖也作酒曰醸从酉㐮声汝向反醸也从酉昷声迂郡反酒疾熟也从酉弁声服萬反酒母也从酉余声讀若廬臣鍇曰此盖酒之初和頭也田吾反䣺也从酉鬲声臣鍇曰醑甘羙也連的反下酒也从酉麗声一曰醇臣鍇曰釃猶籭也籭取之也踈此反酒也从酉肙声古縣反酒一宿熟也从酉豊声臣鍇按史記楚元玉為穆生設醴然則醴甜酒連弟反汁滓酒也从酉翏声闌刀反不澆酒也从酉享声是倫反厚酒也从酉需声詩曰酒醴維醹然柱反三重醇酒也从酉時省明堂月令曰孟秋天子飲酎臣鍇按春秋左傳曰見于甞酌西京雜記漢制甞以正月作酒八月乃熟以獻完廟長有反濁酒也从酉盎声臣鍇按周礼有盎齊晏亢反厚酒也从酉農声安重反酒也從酉茸聲乳逄反一宿酒也一曰買酒也从酉古声臣鍇曰謂造之一夜而熟若今鷄鳴酒也詩曰無酒酤我古呼反酒也从酉省声珍移反泛齊行酒也从酉監声臣鍇曰徧行以飲之也盧闞反酒味淫也从酉竷省声讀若春秋傳曰美而豔臣鍇曰淫長也欲敢反酒味苦也从酉今声臣鍇曰㱃字从此咽嗛反酒厚味也从酉告声闊毒反甛長味也从酉声声臣鍇按王褒洞簫賦曰良醰醰而有味徒紺反爵也一曰酒濁而㣲清也从酉戔声阻限反酒色也从酉帀声普末反酒色从酉已声臣鍇曰匹妃字古只作妃浦妹反酒色也从酉弋声以即反盛酒行觴也从酉勺声真若反冠娶禮祭也从酉焦声子妙反醮或从示㰱酒从酉㫮声臣鍇曰以曆少呷之也子荏反少少飲也从酉勻声余振反獻醻主人進客也从酉声巿柔反醻或从州客酌主人也从酉普声臣鍇按易曰可以醻醋才各反飲酒俱盡也从酉釂声彌畢反飲酒盡也从酉声臣鍇按史記郭觧姊子與人飲酒使之嚼子妙反酒樂也从酉甘声臣鍇曰飲洽也侯貪反樂酒也从酉冘声臣鍇曰酖酖然安且樂也覩貪反私宴飲也从酉區声臣鍇曰醧猶饇也於遽反㑹飲酒也从酉豦声臣鍇曰史記曰歳時無以進醵其虐反醵或从巨主德布大飲酒也从酉甫声臣鍇按史記曰天下酺五日注秦法吏民無故聚飲有刑今特許之也盆乎反醉飽也从酉咅声讀若𤏡盆反醉也从酉熏声詩曰公尸來燕醺醺臣鍇曰飲有酒气熏熏然謝君反䣱也从酉熒省声臣鍇曰酒失也于柄反醉醟也从酉句声勲戍反病酒也一曰醉而覺也从酉呈声臣鍇曰漢書樂志柘漿折朝酲直成反治病工也殹惡恣也醫之性然得酒而使从酉王育說一曰殹病声酒所以治病周礼有醫酒士者巫彭𥘉作醫臣鍇曰㑹意於其反薄酒也从酉离声讀若离鄰之反酢也从酉韱声臣鍇曰䤘䤘然酸七漸反酢也从酉夋声關關東謂酢曰酸素攅反籕文酸从畯禮祭束茅加于祼圭而灌鬯酒是爲莤象神歆之也从艸从酉春秋傳曰爾貢苞茅不入王祭不供無㠯茜酒一曰榼上塞也臣鍇曰㑹意危逐反酢漿也从酉􅥘声臣鍇曰周礼注有酨漿徒再反酢漿也从酉僉声𥘉减反醶也从酉乍声臣鍇曰今人以此爲酬醋字反以醋爲酒酢時俗相承之變也倉去反黍酒也从酉也声一曰甜也賈侍中㠯爲鬻清臣鍇曰猶今人言酒輭也以爾反鹽也从肉酉酒以和醬也爿声即亮反古文醤如此籕文醤如此肉醤也从酉声吼乃反籕文醢从鹵􅛙䤅榆醤也从酉敄声莫透反餟祭也从酉寽声勒㑹反􅛙䤅也从酉俞声田侯切檮榆醤也从酉畢声避翳反醤也从酉矞声㳙聿反卒也各卒其度量不至于亂也一曰酒潰也从酉卒将遂反雜味也从酉京声力狀反闕昨反說文解字通釋卷第二十八
