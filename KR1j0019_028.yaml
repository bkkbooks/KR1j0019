body:
  text: 繫傳二十八文林郎守祕書省校書郎臣徐鍇傳釋朝散大夫行祕書省校書郎臣朱翶反切四十二部文重小􅊟也象形凡􅎧之屬皆從􅎧臣鍇曰再尸象推之漸進也都魁反危高也從􅎧屮聲讀若臣鍇曰辥字從此知舌反吏事君也從宀從􅎧􅎧猶衆也此與師同意臣鍇曰按國語天子千品萬官也冖在屋下也師從􅎧亦取義于衆也會意古安反文三大陸山無石也象形凡􅊟之屬皆從􅊟臣鍇曰彌高大也故從三尸符九反古文􅊟大􅊟也從􅊟夌聲力膺反大􅊟也從􅊟鯀聲胡本反地理也從􅊟力聲臣鍇曰地之脈理也泐字從此郎忒反暗也水之南山之北也從􅊟侌聲臣鍇曰山北水南日所不及都吟反高明也從􅊟易聲猶良反髙平地從􅊟坴聲栗菊反籕文陸如此大陵曰阿從􅊟可聲一曰阿曲􅊟也鶯何反阪也從􅊟皮聲一曰沱也彼移反坡者曰阪從􅊟反聲一曰澤障也一曰山脅也福産反阪隅也從􅊟取聲臣鍇按山海經曰海內西北陬側丘反陬也從􅊟禺聲元無反阻難也從􅊟僉聲香貶反阻也從􅊟㫐聲一曰門榍侯産反險也從􅊟且聲側所反陮隗高也從􅊟隹聲臣鍇曰京高立也特賄反陮隗也從􅊟鬼聲魚賄反高也一曰石也從􅊟允聲與凖反磊也從􅊟􅑰聲落凂反陖也從􅊟肖聲臣鍇曰高竦也太玄曰豐牆址七肖反峭高也從􅊟夋聲蘇狗反仰也從􅊟登聲徒亘反厄陜也從􅊟𠥮聲勒豆反隘也從􅊟夾下夾反登也從􅊟步竹力反古文陟如此高下也從􅊟臽聲一曰陟寒蘸反阪下湮也從􅊟顯聲似集反也從􅊟區聲器于反下隊也從􅊟貴聲徒崔反從高墮也從􅊟歲聲臣鍇曰顚隊字本無土也徒佩反下也從􅊟降聲艮巷反從高下也從􅊟員聲易曰有隕自天雨牝反小崩也從􅊟也聲臣鍇按左思吳都賦曰崩巒陀岑池倚反危也從􅊟從毀省徐巡臣為􅥳凶也賈侍中説􅥳法度也班固説􅥳不安也周書邦之阢􅥳讀若虹霓之霓語挈反敗城􅊟曰隓從􅊟聲臣鍇曰今俗作墮許規反臣次立按徐鉉曰説文無字蓋二左也衆力左之故從二左篆文隓如此仄也從􅊟頃聲屈呈反落也從􅊟多聲圖坐反閬也從􅊟亢聲臣鍇曰坑閬高大而空楚辭曰導帝之乎九坑九州也此亦坑塹字看浪反通溝臣防水也從􅊟賣聲讀若洞陀谷反古文􅭖從谷隄也從􅊟方聲臣鍇按春秋左氏傳塹防門而守之浮長反防或從土塘也從􅊟是聲的齊反基也從􅊟止聲只耳反址或從土山絶坎也從􅊟巠聲臣鍇按爾雅山絶陘注連絶也堅經反附婁小土山也從􅊟巠聲春秋傳婁無松柏臣鍇曰今左傳作培假借户經切秦謂陵阪曰阺從􅊟氐聲臣鍇曰古言隴阺的米反石山載土也從􅊟几聲五忽反崖也從􅊟兼聲讀若儼牛檢反塞也從􅊟厄聲晏索反障也從􅊟鬲聲溝厄反隔也從􅊟童聲止向反蔽也從􅊟㥯聲依謹反水隈崖也從􅊟奧聲嘔報反水曲隩也從􅊟畏聲千枚反商小塊也從臾􅊟臣鍇曰遣字從此溪善反水衡官谷也從􅊟解聲一曰小溪臣鍇曰古亦言答也猴豸反天水大阪也從􅊟龍聲吕恐反酒泉天䧇阪從􅊟衣聲于機反弘農陜也虢國王季之子所封也從􅊟夾聲收儼反弘農陜東陬也從􅊟無聲文區反河東安邑陬也從􅊟卷聲居逺反上黨崎氏阪也從􅊟竒聲於竒反北陵西隃鴈門是也從􅊟俞聲臣鍇按爾雅注即鴈門山失喻反代郡五阮關也從􅊟元聲讀若昆擬逺反大􅊟也一曰右扶風郿有䧊􅊟從􅊟告聲骨僕反丘名也從􅊟貞聲陟情反丘名也從􅊟武聲弗孺反丘名也從􅊟丁聲讀若丁的冥反鄭地坂也從􅊟為聲春秋傳曰將會鄭伯于鄬喧垂反如渚者丘從􅊟者聲水中高者也諸與反宛丘也舜後媯滿所封也從􅊟木申聲值辰反古文陳省木壁危也從􅊟占聲臣鍇按謝朓曰阽危賴宗羊亷反再成丘也在濟隂從􅊟陶聲夏書曰東至于陶丘陶丘有堯城堯嘗所居故堯號陶唐氏也特豪反耕以臿浚出下壚土一曰耕休田也從土􅊟召聲止要反殿陛也從􅊟余聲臣鍇曰王粲賦云循階除而丁降也陳諸反陛也從􅊟皆聲古鍇反主階也從􅊟乍聲昨怒反升髙陛也從􅊟坒聲頻啓反階次也從􅊟亥聲臣鍇曰禮有陔夏樂謂擊鼓為登階之節筍孩反壁際孔也從􅊟􅮼聲起逆反壁會也從􅊟祭聲子歲反重土也一曰滿也後􅊟咅聲一曰陪臣陪備也臣鍇曰諸侯之臣於天子曰陪臣步雷反道邉􅋻垣也從􅊟彖聲徒亂反築牆聲也從􅊟耎聲詩曰救之陾陾而氷反城上女牆俾倪也從􅊟卑聲頻移反籕文陴從􅴹城池也有水曰沱無水曰隍從􅊟皇聲易曰城復于隍臣鍇按尚書曰若納諸隍也戶光反依山谷為牛馬圈也從􅊟去聲臣鍇按揚雄羽獵賦曰泰山為阹遣如反危也從􅊟垂聲是吹反小障也一曰􅋻城也從􅊟烏聲臣鍇曰董卓為郿塢塢堡障也宛古反堅也從􅊟完聲俱便反水􅊟也從􅊟辰聲臣鍇曰若漘岸也是倫反山􅊟陷也從􅊟侖聲勞存反力􅊟也從􅊟戔聲慈竹反文九十二臣次立按説文文九十二輔遺䧖一字重九兩􅊟之間也從二􅊟凡􅤦之屬皆從􅤦闕符九反􅊟也從􅤦夫聲榮節反臣次立按説文曰從􅤦決省聲陋也從􅤦聲臣鍇曰詩曰誕置之巷乙賣反篆文從􅊟塞上亭守烽火者從􅤦從火從遂遂亦聲夕位反篆文省文四重二纍坂土為牆壁象形也凡厽之屬皆從厽臣鍇曰叄字亦或從此力委反增也從糸厽厽亦聲絫十黍之重也力委反纍墼也從厽從土臣鍇曰今但作壘壘壁壘也力委反文三隂數也象四分之形凡凡四之屬皆從四素次反古文四如此籀文四文一重二辨積物也象形凡寧之屬皆從寧臣鍇曰辨分别也象上隆四周之形直與反㡒也所以載盛米從災災缶也從寧寧亦聲臣鍇曰㡒音椿陟吕反五行也從二隂陽在天地間交午也凡五屬之皆從五臣鍇曰交午更用事也二天地也隅古反古文五如此臣鍇曰但象交午而已文一重一易之數隂變於六正於八從入入凡六之屬皆從六臣鍇曰象一變二也栗菊反文一陽之正也從一微隂從中邪出也凡七之屬皆從七秋日反文一篆文禸從足柔走獸總名也頭象形從禸合聲禽離兕頭相似臣鍇曰凶頭象也臣任反山神獸也從禽頭從禸屮聲毆陽喬説離猛獸也臣鍇按春秋左傳曰魍魎離魅莫能逄之丑離反臣次立按徐鉉曰從􅋄義無所取疑象形蟲也象形從厹舞飯反周成王時州靡國獻人身反踵自笑笑即上脣弇其自食人北方謂之土螻爾雅曰如人𬒳髮象形從曰從禸讀若費一曰一名梟羊臣鍇曰反踵腳跟在前也符既反蟲也象形從禸臣鍇曰牙齒蟲病謂之齲齒牙甫反古文禹如此蟲也象形從禸讀若偰私列反古文卨如此文七重三也象耳頭足禸地之形古文嘼下禸也凡嘼之屬皆從嘼臣鍇曰古文下從內作也楮又反守備也從犬嘼亦聲臣鍇曰獸守山也詩救反文二位東方之孟陽氣崩動從木載孚甲之象也大一經曰頭玄為甲甲為人頭凡甲之屬皆從甲臣鍇曰甲在東北甲子陽氣所起也自內而起故孚甲胄之地孚猶葭莩殼籜也其字形亦取象人頭也漢書律曆志曰申甲於甲溝呷反古文甲始一見于十歲成于木之象臣鍇曰申一也甲乙為幹其數十成于東方人象木也文一重一象春草木冤曲而出隂氣尚強其出乙乙也乙與丨同意乙承甲象人頸也凡乙之屬皆從乙臣鍇曰此與燕燕乙之字音義皆别亦冝有分此甲乙字下迂曲也丨音徹同為出也乙乙未展也律曆志曰奮乾于乙殷筆反上出也從乙乙物之逹也倝聲臣鍇按易曰夫乾確然又曰確乎其不可拔潛龍也君子終日乾乾自強不息也故從乙乙冒難而出也其延反籕文乾如此治也從􅜆從乙乙治之也臣鍇曰乙者治之難也魯彖反異也從乙又聲臣鍇曰乙者欲出而見閡見閡則顯其九異天同焉皆忠不知其所以殊靡然皆恱不知其所以異故必見閡見閡而為不已然後彰其特出焉明秋反文四重一位南方也萬物成炳然隂氣𥘉起陽氣將虧從一入坰一者陽也丙承乙象人也凡丙之屬皆從丙臣鍇曰陽功就萬物皆成炳然彰著夫物極則衰功成則去明盛而晦陽極而隂物非隂不㝎夏之有秋所以揫斂焦殺萬物使成也坰猶門也易曰乾坤其易之門邪天地隂陽之門户陽功成將去坰也律曆志曰明炳於丙會意鄙永反文一夏時萬物皆丁壯成實象形也丁承丙象人心也凡丁之屬皆從丁臣鍇曰物挺然成立之貌夫萬物方茂非成之謂衰殺乃見其成人也方剛之謂守柔乃見其剛隂氣盛于外陽氣營于內故萬物炳然非所謂成得一隂之贊揫斂之乃為成故盛于丙成於丁其形正中故象心律曆志曰大成于丁的冥反文一中宫也象六甲三龍相拘絞也戊承丁象人脅也凡戊之屬皆從戊臣鍇曰五土無㝎居主在中往來不相越故曰拘絞人脅亦相任也亦在中五象也律曆志曰豐楙于戊莫遘反就也從戊丁聲臣鍇曰戊中宫成於中也丁成也會意示征及古文成從戊午臣鍇曰午南方亦物成之義文二重一中宫也象萬物辟藏詘之形也已承戊象人腹也凡已之屬皆從巳臣鍇曰萬物與隂陽之氣藏則歸土屈曲包含象人腹圜曲也人腹中央也律曆志曰理紀于已訖耳反古文已如此臣鍇曰孔子家語子夏間讀史記曰晉師以三豕渡河曰已亥也然則彼已之字當作此已字謹身有所承也從已從丞讀若詩曰赤舄已已已隱反長踞也從已其聲讀若杞暨已反文三重一秋時萬物成而金剛味辛辛痡即泣出從一辛辛罪也辛承庚象人股凡辛之屬皆從辛臣鍇曰言萬物方盛初見斷制民難與慮始故辛痡也人股漸焦殺反故象之辛亦漸揫斂也律曆志曰悉新于辛會意息因反犯法也從自辛言罪人蹙自辛苦之憂秦以􅓧似皇字改為罪臣鍇曰會意造浼反罪也從辛古聲古乎反古文辜從死罪也從辛聲私列反不受也從受辛冝辭之也臣鍇曰會意夕兹反籕文辭從台辭訟也從􅜆辛􅜆猶理辜也臣鍇曰會意夕兹反籕文辭從司反文一冬時水土平可揆度象水從四方流入地中形也癸承壬象人足也凡癸之屬皆從癸臣鍇曰冬萬物成焉羣動息焉故可為度故冬至律黃鍾𥘉九度量所起于黃鍾秋收潦而水清冬土几其宅水歸其壑也足最在下故取象也律曆志曰陳揆于癸見水反籕文癸從癶天聲臣鍇曰足也文一重一十一月陽氣動萬物滋入以為稱象形也凡子之屬皆從子臣鍇曰十一月夜半陽氣所起人承陽本其初故以為稱律曆志曰孳萌于子也通論詳矣津矣反古文從川髮也籕文子從有髮臂脛在凡上也褱子也從子凡臣鍇曰几音殊草木之實垂亦取象于凡朵字是也人褱妊似之也會意以證反主子免身也從子免臣鍇曰會意美選反乳也愛也從宀子子亦聲臣鍇曰易曰女子貞十年不字字乳也春秋左傳曰大不字小字愛也宀覆之也會意慈伺反乳也從子聲或曰㝅瞀臣鍇按春秋左傳曰楚人謂乳為㝅故名子文曰㝅於菟㝅瞀愚暗也格漚反一乳兩子也從子􅒋聲臣鍇曰孿猶連也數眷反乳子也一曰輪也輪尚小也從子需聲臣鍇曰史記孺子可教禮大夫妻曰孺人猶言小童也閻務反少稱從子稚省稚亦聲見翠反長也從子皿聲莫更反古文孟如此庶子也從子辥聲臣鍇曰通論詳矣魚滅反汲汲生也從子兹聲臣鍇曰人生在勤故從子也則斯反籕文孳從絲無父也從子孤聲臣鍇曰通論詳矣古乎反恤問也從子在聲臣鍇曰在亦存也會意在坤反枚也從子爻聲臣鍇曰教從此加肴反惑也從子止􅹆矢聲臣鍇曰幼子多惑也止不通也􅎅反比之也矢聲研之反文十五重四尦也從子無臂象形凡了之屬皆從了臣鍇曰尦音鳥旁無輔了尦然也吕曉反無右臂也從了隱象形經節反無左臂象形從了聲俱越反文三謹也從三子凡孨之屬皆從孨讀若翦臣鍇曰三人同行必有師焉君子慎獨矢能三子同君而不散離必謹守者也職件反迮也從孨在尸下一曰孨聲一曰呻吟也臣鍇曰尸屋象也士間反盛貌也從孨從田讀若薿一曰若存臣鍇曰曰音越曰詞也今音女立反靈光殿賦曰芝栭櫕羅以戢孨曰牛以反籕文孴從二子一曰竒字晉文三重一不順匆出也從倒子易曰突如其來如不孝子突出不容於禸也即易突字也凡之屬皆從云臣鍇曰反為人子之道也故文從反子字舜之事父蒸蒸乂不格姦瞽亦允若父求使之未嘗不在于側求殺之未嘗得也突然反道而出是悖也他骨反倒或從古文子養子使作善也從肉聲虞書曰教育子臣鍇曰不順子也不順者尚教之况順者乎今尚書曰教胄子也融六反育或從每通也從㐬從匹匹亦聲臣鍇曰白虎通書之教也匹疏也會色居反文三重二紐也十二月萬物動用事象手之形時加丑亦舉手時也凡丑之屬皆從丑臣鍇曰卜所執不出于手也眛爽為丑人皆起有為也律曆志曰紐牙于丑敕紐反食肉也從肉五丑亦聲女就反進獻也從羊羊所進也從丑丑亦聲臣鍇曰丑手進也會意息抽反文三文二震也三月陽氣動雷電振民農時也物皆生從乙匕象藝逹廠聲也辰房星天時也從二二古文上也凡辰之屬皆從辰臣鍇曰雷出舊豫之時也匕化也乙草大芒初出曲卷也爾雅云大辰房心尾也大火謂之大辰大火心也明者以為時候心在中最明故時候主焉尚書曰撫于五辰辰時也律曆志曰振美于辰石倫反古文辰恥也從寸在辰下失耕時于封疆上戮之辰者農之時也故房星為辰田候也臣鍇按國語曰農祥晨正民于是耕農祥房星為大辰也儒曲反文二重一文二味也六月滋味也五行木老于未象木重枝葉也凡未之屬皆從未臣鍇曰律曆志曰昧薆于未勿貴反文一神也七月隂氣成體自申束從曰自持也吏以餔時聽事申旦政也凡申之屬皆從申臣鍇曰七月三隂故曰隂氣成九三陽成君子終日乾乾六三隂成律曆志曰申堅于申式人反古文申籕文申擊小鼓引樂聲也從申東聲周禮曰小樂事鼓讀若引臣鍇曰詩曰應縣鼓異印反束縳椊柮為臾從申從乙臣鍇曰申束縛也乙屈也會意羊朱反冡聲母柬反熟􅯅也從酉甚聲移今反醖也作酒曰釀從酉襄聲汝向反釀也從酉昷聲迂郡反酒疾熟也從酉辨聲服萬反酒母也從酉余聲讀若廬臣鍇曰此蓋酒之初和頭也田吾反䣺也從酉鬲聲臣鍇曰醑甘美也連的反下酒也從酉麗聲一曰醇臣鍇曰釃猶籭也籭取之也踈此反酒也從酉肙聲古縣反酒一宿熟也從酉豐聲臣鍇按史記楚元玉為穆生設醴然則醴甜酒連弟反汁滓酒也從酉翏聲闌刀反不澆酒也從酉享聲是倫反厚酒也從酉需聲詩曰酒醴維醹然柱反三重醇酒也從酉時省明堂月令曰孟秋天子飲酎臣鍇按春秋左傳曰見于嘗酌西京雜記漢制嘗以正月作酒八月乃熟以獻完廟長有反濁酒也從酉盎聲臣鍇按周禮有盎齊晏亢反厚酒也從酉農聲安重反酒也從酉茸聲乳逄反一宿酒也一曰買酒也從酉古聲臣鍇曰謂造之一夜而熟若今雞鳴酒也詩曰無酒酤我古呼反酒也從酉省聲珍移反泛齊行酒也從酉監聲臣鍇曰遍行以飲之也盧闞反酒味淫也從酉竷省聲讀若春秋傳曰美而豔臣鍇曰淫長也欲敢反酒味苦也從酉今聲臣鍇曰飲字從此咽嗛反酒厚味也從酉告聲闊毒反甛長味也從酉聲聲臣鍇按王褒洞簫賦曰良醰醰而有味徒紺反爵也一曰酒濁而微清也從酉戔聲阻限反酒色也從酉匝聲普末反酒色從酉已聲臣鍇曰匹妃字古只作妃浦妹反酒色也從酉弋聲以即反盛酒行觴也從酉勺聲真若反冠娶禮祭也從酉焦聲子妙反醮或從示歃酒從酉眥聲臣鍇曰以曆少呷之也子荏反少少飲也從酉勻聲余振反獻酬主人進客也從酉聲巿柔反酬或從州客酌主人也從酉普聲臣鍇按易曰可以酬醋才各反飲酒俱盡也從酉釂聲彌畢反飲酒盡也從酉聲臣鍇按史記郭解姊子與人飲酒使之嚼子妙反酒樂也從酉甘聲臣鍇曰飲洽也侯貪反樂酒也從酉冘聲臣鍇曰鴆鴆然安且樂也覩貪反私宴飲也從酉區聲臣鍇曰醧猶飫也於遽反會飲酒也從酉豦聲臣鍇曰史記曰歲時無以進醵其虐反醵或從巨主德布大飲酒也從酉甫聲臣鍇按史記曰天下酺五日注秦法吏民無故聚飲有刑今特許之也盆乎反醉飽也從酉咅聲讀若𤏡盆反醉也從酉熏聲詩曰公尸來燕醺醺臣鍇曰飲有酒氣熏熏然謝君反酗也從酉熒省聲臣鍇曰酒失也于柄反醉醟也從酉句聲勳戍反病酒也一曰醉而覺也從酉呈聲臣鍇曰漢書樂志柘漿折朝酲直成反治病工也殹惡恣也醫之性然得酒而使從酉王育説一曰殹病聲酒所以治病周禮有醫酒士者巫彭𥘉作醫臣鍇曰會意於其反薄酒也從酉離聲讀若離鄰之反酢也從酉韱聲臣鍇曰䤘䤘然酸七漸反酢也從酉夋聲關關東謂酢曰酸素攢反籕文酸從畯禮祭束茅加于祼圭而灌鬯酒是為莤象神歆之也從草從酉春秋傳曰爾貢苞茅不入王祭不供無以茜酒一曰榼上塞也臣鍇曰會意危逐反酢漿也從酉􅥘聲臣鍇曰周禮注有酨漿徒再反酢漿也從酉僉聲𥘉減反醶也從酉乍聲臣鍇曰今人以此為酬醋字反以醋為酒酢時俗相承之變也倉去反黍酒也從酉也聲一曰甜也賈侍中以為鬻清臣鍇曰猶今人言酒軟也以爾反鹽也從肉酉酒以和醬也爿聲即亮反古文醬如此籕文醬如此肉醬也從酉聲吼乃反籕文醢從鹵􅛙䤅榆醬也從酉敄聲莫透反餟祭也從酉寽聲勒會反􅛙䤅也從酉俞聲田侯切檮榆醬也從酉畢聲避翳反醬也從酉矞聲涓聿反卒也各卒其度量不至于亂也一曰酒潰也從酉卒將遂反雜味也從酉京聲力狀反闕昨反説文解字通釋卷第二十八
