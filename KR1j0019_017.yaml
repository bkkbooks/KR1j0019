body:
  text: 説文解字通釋卷第十七繫傳十七文林郎守祕書省校書郎臣徐鍇傳釋朝散大夫行祕書省校書郎臣朱翶反切二十六部文五百二十三重六十三頭也從頁從人古文稽首如此凡頁之屬皆從頁頁者首字也臣鍇曰古文以為首字也羊截反首也從頁豆聲時婁反眉目之問也從頁彥聲臣鍇按史記漢高祖龍顔是也言關反籕文貌也從頁公聲臣鍇曰此容儀字歌頌者美盛德之形容頌故通作頌後人因爾亂之定以此為歌頌字然今世間詩本周頌亦或作訟與封反籕文顱也從夏乇聲臣鍇曰今併作髑字陀谷反顱首骨也從頁盧聲論孤反顛頂也從頁聲魚怨反頂也從頁真聲臣鍇蹎倒字作蹎的煙反顚也從頁丁聲顛茗反或從􅾪作籕文從鼎額也從頁桑聲蘇朗反額也從頁是聲臣鍇曰義見爾雅敵圭反顙也從頁各聲顔客反鼻莖也從頁安聲臣鍇按史記曰蔡澤蹙頞厄渴反或從鼻曷權也從頁􅶐聲臣鍇按莊子曰其顙頯頯塊然也權雖反面旁也從頁夾聲居俠反籕文從􅾪頰也從頁聲姦狠反也從頁合聲候坎反頥也從頁函聲侯貪反頭莖也從頁巠聲居反頂也從頁令聲里井反頭後也從頁工聲臣鍇按詩曰四牡項領馬領冝細領大而難制故舉項領非訓項為大也限蚌反項枕也從頁冗聲臣鍇曰謂頂後承枕骨也之祍反出額也從頁隹聲臣鍇曰言額如稚也真誰反曲頥也從頁不聲步雷反􅬺貌從頁僉聲失檢反面目不正貌從頁尹聲臣鍇曰頭大也主閔反頭頵也從頁君聲臣鍇曰頭大也宛旬反面色顛貌從頁員聲讀若隕臣鍇按詩云藝其黃矣古詩云黃華葉衰藝亦或音運與此義近也兩牝反頭頰長也從頁兼聲五緘反頭大也從頁石聲臣鍇曰詩曰碩大且儼神隻反大頭也從羔頁聲臣鍇按詩曰牂羊頒首作墳扶云反又口么反大頭也從頁分聲一曰鬢也詩曰有頒其首布還反大頭也從頁骨聲讀若魁臣鍇按張衡思玄賦顝羇旅而無友顝猶塊大而獨立貌誇訥反大頭也從頁原聲魚怨反髙長頭從頁堯聲臣鍇按靈光殿賦曰䫜顤顟而睢􅢦胡人貌也五呌反頭佳也從頁斤聲讀又若鬢臣鍇曰詩曰碩人其頎巨希反贅顙高也從頁敖聲五號反前靣嶽嶽也從頁嶽聲逆捉反昧前也從頁聲莫隊反靣瘐淺也從頁霝聲連丁反頭蒯也從頁歲聲臣鍇按字書書蒯作頭惡也五夬反㮯頭也從頁元聲臣鍇曰㮯椓也五還反小頭也從頁枝聲臣鍇曰顙猶規小貌堅隨反小頭也從頁果聲臣鍇曰今言物一顆猶一頭也苦墮反短靣也從頁􅡜聲戶刮反狹頭頲也從頁廷聲他挺反頭間習也從頁危聲臣鍇曰間習謂低仰便也語委反靣黃也從頁含聲候坎反靣不正也從頁爰聲魚怨反舉頭也從頁支聲詩曰有頍者辨頎箠反內頭水中從頁亦聲臣鍇曰音沒會意烏骨反還視也從頁雇聲骨度反理也從頁川聲殊問反顔色慎事也從頁鬒聲臣鍇曰䪾𩕔猶隱磷難分貌不見于色故曰慎事支允反䪾𩕔也從頁粦聲一曰頭少髮力凖反頭顓顓謹貌從頁專聲臣鍇按淮南子曰以害顓民顓謹也準旋反頭頊頊謹貌從頁王聲喧玉反低頭也從頁金聲春秋傳曰迎于門顉之而已臣鍇曰點頭以應也今左傳作頷假借五感反下首也從頁屯聲臣鍇曰頓首下首也都異反低頭也從頁逃省聲太史卜書俯仰字如此楊雄曰人靣俯分武反俗俯字從人免舉目視人貌從頁臣聲矢引反倨視人也從頁􅵗聲旨闡反直項也從頁吉聲羊截反頭頡䪼也從頁出聲讀又若骨之出反白貌從景頁楚詞曰天白皓皓南山四皓白首人也臣鍇按班固西都賦曰鮮皓氣之清英皓氣白氣也候抱反大醜貌從頁樊聲復喧反好貌從頁爭聲詩所謂首臣鍇曰詩言螓首此引詩以解誤作從爭疾性反頨妍也從頁翩省聲讀若翩臣鍇曰書傳多言孔子反字作此頨字云頭頂四崖峻起象厄丘山于甫反謹莊貌從頁豈聲魚豈反頭鬢少髮也從真肩聲周禮數目顅脰臣鍇曰顅脰少髮也苦間反無髮也一曰耳門也從頁困聲臣鍇曰猶髮也苦敦反秃也從頁氣聲誇訥反頭不正從頁耒耒頭傾亦聲讀又若春秋陳夏齧之齧魯內反傾首也從頁卑聲匹米反伺人一曰恐也從頁契聲讀若楔異契反頭不正也從頁鬼聲臣鍇曰䫥猶􅐑嵬也口猥反頭偏也從頁皮聲滂阿反顫也從頁尤聲延救反或從疒作頭不正也從頁亶聲臣鍇曰俗言顫掉不正定彥反飰不飽靣黃起行也從頁咸聲讀若贛臣鍇按楚詞長顑頜兮可傷口糝反靣䫲顲貌從頁聲臣鍇曰音力甚反勒敢反熱頭痛也從頁從火一曰從焚省聲臣鍇按宋玉風賦􅓹勃煩冤煩熱冤亂復喧反癡不聰明從頁聲臣鍇曰癡之狀見于頭靣也五隘反難曉也從頁米一曰鮮白貌從粉省臣鍇曰類從此勤會反憔悴也從頁卒聲臣鍇按楚詞曰形容憔悴勞苦見于見夕位反繫頭殟也從頁昏聲臣鍇曰殟屈頭死之也莫魂反醜也從頁亥聲候猜反頭也從頁其聲今逐疫有䫑頭臣鍇按靈光殿賦曰忔䫑􅓥以雕䫑頭方相四目也遣之反呼也從頁籥聲尚書曰率籲衆戚云遇反頭明飾也從頁聲臣鍇曰頁頭也若具列物數一頭二頭也會意呼衍反選具也從二頁士戀反大頭也從頁禺聲詩曰其大有顒魚容反憔悴也從頁焦聲昨焦切文九十三重八頭也象形几􅔣之屬皆從􅔣臣鍇曰髮也式九反靣和也從􅔣從肉讀若柔臣鍇曰爾雅戚施靣柔也肉物之柔者會意然尤反文二顔前也從􅔣象人面形凡面之屬皆從靣臣鍇曰顔額也弭釧反靣見也從靣見亦聲詩曰有􅌤靣目臣鍇曰凡人所視瞻心實見之故有别識無耻之人面見之而已心實否山國語范蠡曰雖􅌤然人面實禽獸也會意聽銑反或從旦頰也從面甫聲臣鍇按易曰咸其輔頰䩉與輔義相近浮甫反面焦枯小也從面焦聲前昭反倒首也賈侍中説此斷首倒縣縣字凡縣之屬皆從􅹁臣鍇曰漢律有􅹁首多借梟字堅簫反繫也從系持縣臣鍇按顔師古匡謬正俗云古書縣雍皆作此直縣挂字引説文為證此懸今人加心文二靣毛也從頁彡凡須之屬皆從須臣鍇曰會意四于反口上須也從須此聲即冝反頰須也從冉冉亦聲臣鍇曰今俗作髯而淹反須髮半白也從須卑聲賔而反短須髮貌從須否聲甫友反文五毛飾畫之文也象形凡彡之屬皆從彡臣鍇曰古多以羽旄為飾象彡彡然所咸反象形也從彡幵聲臣鍇曰彡以其冉弱委曲象之也賢星反稠從彡人聲詩曰鬒髮如雲臣鍇曰從人物之人今詩作鬒又一鬒鳥羽也從几音同而體小異也支允反或從髟真聲飾也從彡攸聲臣鍇曰尚書曰簡厥修息抽反文章也從彡章聲臣鍇曰文章飾也周良反瑑文也從彡周聲覩挑反飾也從彡青聲寂逞反細文也從彡􅮼省聲臣鍇曰􅮼音郤穆從此莫叔反撓也上象撓曲彡象毛氂撓弱也弱物并故從二臣鍇曰指事如約反駮文也從文辡聲臣鍇曰今作班也不攀反微畫也從文從􅫕聲利之反文四長髮猋猋也從長從彡凡髟之屬皆從髟所咸反根也從髟犮聲飛伐反或從首作古文頰髮也從髟賔聲比刃反髮長也從髟㒼聲讀若蔓沒團反髮長也從髟監聲讀若春秋黑以濫來籠三反髮好也從髟差聲千可反髮好也從髟卷聲詩曰其人美且鬈臣鍇曰髮柔好也衝貟反髮也從髟毛聲門髙反髮貌從髟臱米田反髮多也從髟周聲臣鍇曰詩曰綢道如髮陳收反髮貌從髟爾聲讀若江南謂酢母為臣鍇曰酢毋酢糟寧洗反髮貌從髟咅聲步矛反髮至眉也從髟敄聲詩曰䋩彼兩臣鍇曰今詩作髦莫浮反或從敄省漢令有髳長臣鍇曰髳羌地名髳地之長也女鬢垂貌從髟前聲臣鍇按楚辭曰盛鬋不同即連反鬋也一曰長貌從髟兼聲讀若慊連鹽反束髮少也從髟􅎒聲臣鍇按張衡西京賦曰朱鬕𩯰即血反髮也從髟易聲臣鍇按周禮追師掌王后之首服為副編次注云副覆首以為飾其遺象若今步搖服之從王祭祀編列髮為之若今假紒服之以桑也次次第髮長短為之若今髮鬄服以見王燕居則纚笄總而已詩所謂鬒髮如雲不屑鬄也臣以為副若今三叉先為髮髮覆首上叉為鳯雉形口銜步搖者也編若今編梳次第卷髮編列為之次即今髮也劉熙釋名鬄剔刑人為之髲則以續鬄則全假為之也思益反鬄或從髟也聲臣鍇曰春秋左傳衛公出見吕氏之妻髮美以為吕薑髢鬄也從髟皮聲平義反用梳比也從髟次聲臣鍇曰此即周禮所謂次今作次假借七恣反潔髮也從髟􅡜聲臣鍇曰禮所云組括髺作括假借儀禮鬠用組注古作括古括反卧髻也從髟般聲讀若槃臣鍇曰古今注所謂槃桓髻别安反髻也從髟付聲方娶反帶髻飾從髟莫聲悶亞反屈髮也從髟貴聲區師反簮髻也從髟介聲臣鍇曰簮髻即假髻也荀差反髮鬛鬛也從髟巤聲律捷反或從毛或從豕鬛也從髟盧聲論孤反也從髟並聲盤浪反佛若似也從髟弗聲臣鍇曰毛髮佛佛然似之分勿反亂髮也從髟茸省聲乳逄反髮墮從髟墮省聲直垂反鬌髮也從髟春聲矢閏反髮秃也從髟間聲苦間反佛髮也從髟剔聲他狄反􅚎髮也從髟兀聲苦敦反或從元􅚎髮也從髟弟聲大人曰髡小人曰剃盡及身毛曰􅚎他計反也忽見從髟録聲籕文魅亦忽見意芳未反喪髻禮女子髽哀弔則不髽魯臧武仲與齊戰于狐鮐魯人迎喪者始髽從髟坐聲鄒茶反文三十八重七繼體君也象人之形施令以告四方故􅛣之從一口發號者君后也凡后之屬皆從后臣鍇曰通論詳矣一專言也章移反小巵有耳蓋者從巵專聲殊剸反小巵也從巵專聲讀若捶擊之捶職仲反文三瑞信也守國者用玉卪守都鄙者用角卪使山邦者用虎節土邦者用人卪澤邦者用龍卪門關者用符卪貨賄用璽卪道路用旌卪象相合之形凡卪之屬皆從卪臣鍇曰周禮掌守邦節而别其用以輔王命注邦節鎮圭方璋穀圭琰圭也玉節之制如王以命數為大小角卪犀角為之山多虎平地多人澤多龍符卪如今宫中官詔符璽卪今之印章旌卪令使者所擁卪今皆作節字卪象半分之形守國者其卪半在內半在外即血反發號也從兮卩臣鍇曰號令者集而為之卩制會意力聘反輔信也從卪從比聲虞書曰弼成五服臣鍇曰今尚書作弼皮密反有大度也從卩多聲讀若移真避反宰之也從卪必聲彼至反高也從卩召聲食要反科厄木節也從卪廠聲賈侍中説以為厄裹也一曰巵蓋也臣鍇曰廠音移巵從此五果反脛頭也從卩漆聲臣鍇曰今俗作膝膝人之節也恖一反膝曲也從卩􅫦聲臣鍇曰詩有卷阿曲阿也俱兖反節欲也從卩谷聲期灼反二卩也巽從此闕助箭反舍車解馬也從卩止午聲讀若汝南人寫書之寫臣鍇曰御從此蘇夜反卩也闕則湊反文十三執政所持信也從瓜從卩凡印之屬皆從印臣鍇曰瓜手瓜以持印也會意伊鎮反按也從反印臣鍇曰者外向而印之反印為內自抑也會意憂仄反俗從手作文二重一顔氣也從人從卪凡色之屬皆從色臣鍇曰顔色人之儀卩也會意踈憶反古文色艴如也從色弗聲論語曰色艴如也臣鍇曰盛氣色也孟子曰曽西艴然其字如此步咄反縹色也從色并聲臣鍇按宋玉神女賦薄怒自以持曽不可乎犯干匹逈反文三重一事之制也從卩凡卯之屬皆從卯闕臣鍇曰反覆卩之也起明反章也六卿天官冢宰地官司徒春官宗伯夏官司馬秋官司寇冬官司空從卯皀聲臣鍇按白虎通曰卿章也章善明理也反覆節其事也皀又音香起明反文二法也從卩辛節制其􅓧也從口用法者也凡辟之屬皆從辟臣鍇曰口以理之會意卑僻反治也從辟井周書曰我之不臣鍇曰并法也與荆同意今尚書作辟卑僻反治也從辟乂聲虞書曰有能俾臣鍇曰今尚書作乂偶喙反飽也從包祭祀曰厭匓臣鍇曰禮有隂厭陽厭厭匓也今禮作飫于據反重也從包復聲伐六反或省彳高墳也從包豕聲臣鍇曰地高起若有所包也知悚反文十六重三象人裹妊巳在中象子未成形也元氣起于子子所生也男左行三十女右行二十俱立于已為大婦裹妊于巳巳為子十月而生男起巳至寅女起巳至申故男年始寅女年始申也凡包之屬皆從包臣鍇曰任懷任也巳為四月萬物含實故象人懷子也子在北方冬至夜半一陽所起故曰子人所生男自子左數次寅次卯為左行凡三十得巳女自子右數次亥次戍次酉凡二十亦得巳至此會合夫婦懷任之義巳為子謂所生子也巳𥘉懷子男左行午次未凡十二月得寅女右行自已次辰次卯凡十月得申寅在東北為夏正月物徹子甲而出陽𥘉出故為男年之始甲在西南為夏七月隂氣至此始出故為女年之始也北交反兒生裹也從肉包浦包反瓠也從夸包聲取其可包藏物也步交反文三自急敕也從羊省從包省徙口口猶慎言也從羊羊與義善美同意凡苟之屬皆從苟臣鍇按羊美物也人自美其身故目警敕云與善同意包者自束斂春秋左傳張骼輔躒曰公孫之亟當也作此苟作亟假借已力反古文不省肅也從攴苟臣鍇曰會意居竟反赤魃除牆星之物也詩曰旱魃為虐臣鍇按周禮犮氏掌除牆屋謂除自理之物若蛙及蝎之屬今周禮作犮步將反老精物也從鬼彡彡鬼毛密至反古文籕文魅從彖首從尾省聲或從未鬼服也一曰小兒鬼從鬼從支韓詩傳曰鄭交甫逢二女鬾服臣寄反鬼貌從鬼虎聲虎烏反鬼俗也從鬼幾聲淮南傳曰吳人鬼越人􆄈也居希反鬼魅聲䰰䰰不止也從鬼需聲奴詬反鬼變也從鬼化聲呼咵反見鬼驚詞從鬼難省聲讀若詩受福不儺臣鍇按歲終大儺娠子口呼􆃴􆃴也如何反鬼貌從鬼賔聲婢民反可惡也從鬼酉聲稱肘反神獸也從鬼隹聲杜回切文十七重四鬼頭也象形凡甶之屬皆從甶臣鍇曰靣髣佛之貌分勿反惡也從甶虎省臣鍇曰會意迃胃反古文省母猴屬頭似鬼從甶從禸臣鍇曰禸禽獸迹也疑預反文三重一姦邪也韓非曰蒼頡作字自營為某凡某之尸皆從某臣鍇曰此公某字今皆作私先兹反逆而奪取曰篡從某算聲臣鍇曰漢書曰篡取之測慣反相訹呼也從某臣鍇曰訹誘也夷説文解字通釋卷第十七
