body:
  text: 說文解字通釋卷第十七繋傳十七文林郎守祕書省校書郎臣徐鍇傳釋朝散大夫行祕書省校書郎臣朱翶反切二十六部文五百二十三重六十三頭也從頁從人古文䭫首如此凡頁之屬皆從頁頁者首字也臣鍇曰古文以爲首字也羊截反首也從頁豆聲時婁反眉目之問也從頁彦聲臣鍇按史記漢高祖龍顔是也言關反籕文皃也從頁公声臣鍇曰此容儀字歌頌者美盛德之形容頌故通作頌後人因爾亂之定以此為歌頌字然今世間詩本周頌亦或作訟與封反籕文顱也從夏乇聲臣鍇曰今併作髑字陁谷反顱首骨也從頁盧聲論孤反顛頂也從頁声魚怨反頂也從頁眞声臣鍇蹎倒字作蹎的烟反顚也從頁丁声顛茗反或從􅾪作籕文從鼎額也從頁桑聲蘇朗反額也從頁是聲臣鍇曰義見爾雅敵圭反顙也從頁各聲顔客反鼻莖也從頁安声臣鍇按史記曰蔡澤蹙頞厄渇反或從鼻曷權也從頁􅶐声臣鍇按莊子曰其顙頯頯塊然也權雖反面旁也從頁夾声居俠反籕文從􅾪頰也從頁声姦狠反也從頁合声候坎反頥也從頁圅声侯貪反頭莖也從頁巠声居反頂也從頁令声里井反頭後也從頁工声臣鍇按詩曰四牡項領馬領冝細領大而難制故舉項領非訓項為大也限蚌反項枕也從頁宂声臣鍇曰謂頂後承枕骨也之祍反出額也從頁隹声臣鍇曰言額如稚也眞誰反曲頥也從頁不声歩雷反􅬺皃從頁僉声失檢反面目不正皃從頁尹声臣鍇曰頭大也主閔反頭頵也從頁君声臣鍇曰頭大也宛旬反面色顛皃從頁員声讀若隕臣鍇按詩云芸其黄矣古詩云黄華葉衰芸亦或音運與此義近也兩牝反頭頰長也從頁兼声五緘反頭大也從頁石声臣鍇曰詩曰碩大且儼神隻反大頭也從羔頁声臣鍇按詩曰牂羊䫞首作墳扶云反又口幺反大頭也從頁分声一曰鬢也詩曰有頒其首布還反大頭也從頁骨声讀若魁臣鍇按張衡思玄賦顝覉旅而無友顝猶塊大而獨立皃誇訥反大頭也從頁原声魚怨反髙長頭從頁尭声臣鍇按靈光殿賦曰䫜顤顟而睢􅢦胡人皃也五呌反頭佳也從頁斤声讀又若鬢臣鍇曰詩曰碩人其頎巨希反贅顙高也從頁敖声五號反前靣岳岳也從頁岳声逆捉反昧前也從頁声莫隊反靣瘐淺也從頁霝声連丁反頭蒯也從頁㒸声臣鍇按字書書蒯作頭惡也五夬反㮯頭也從頁元声臣鍇曰㮯㭬也五還反小頭也從頁枝声臣鍇曰顙猶規小皃堅隨反小頭也從頁果声臣鍇曰今言物一顆猶一頭也苦墮反短靣也從頁􅡜声戸刮反狹頭頲也從頁廷声他挺反頭閑習也從頁危声臣鍇曰閑習謂低仰便也語委反靣黄也從頁含声候坎反靣不正也從頁爰声魚怨反舉頭也從頁支声詩曰有頍者弁頎箠反内頭水中從頁亦声臣鍇曰音没㑹意烏骨反還視也從頁雇声骨度反理也從頁川声殊問反顔色慎事也從頁㐱声臣鍇曰䪾䫰猶隠磷難分皃不見于色故曰慎事支允反䪾䫰也從頁粦声一曰頭少髪力凖反頭顓顓謹皃從頁耑声臣鍇按淮南子曰以害顓民顓謹也準旋反頭頊頊謹皃從頁王声喧玉反低頭也從頁金声春秋傳曰迎于門顉之而已臣鍇曰點頭以應也今左傳作頷假借五感反下首也從頁屯声臣鍇曰頓首下首也都異反低頭也從頁逃省声太史卜書頫仰字如此楊雄曰人靣頫分武反俗頫字從人免舉目視人皃從頁臣声矢引反倨視人也從頁􅵗声旨闡反直項也從頁吉声羊截反頭頡䪼也從頁出声讀又若骨之出反白皃從景頁楚詞曰天白顥顥南山四顥白首人也臣鍇按班固西都賦曰鮮顥气之清英顥气白气也候抱反大醜皃從頁樊声復喧反好皃從頁爭声詩所謂首臣鍇曰詩言螓首此引詩以解誤作從爭疾性反頨妍也從頁翩省声讀若翩臣鍇曰書傳多言孔子反字作此頨字云頭頂四崖峻起象厄丘山于甫反謹荘皃從頁豈声魚豈反頭鬢少髪也從真肩声周禮數目顅脰臣鍇曰顅脰少髮也苦閑反無髪也一曰耳門也從頁困声臣鍇曰猶髪也苦敦反秃也從頁气声誇訥反頭不正從頁耒耒頭傾亦声讀又若春秋陳夏齧之齧魯内反傾首也從頁卑声匹米反伺人一曰恐也從頁契声讀若楔異契反頭不正也從頁鬼声臣鍇曰䫥猶􅐑嵬也口猥反頭偏也從頁皮声滂阿反顫也從頁尤声延救反或從疒作頭不正也從頁亶声臣鍇曰俗言顫掉不正定彦反飰不飽靣黄起行也從頁咸声讀若贛臣鍇按楚詞長顑頜兮可傷口糁反靣䫲顲皃從頁声臣鍇曰音力甚反勒敢反熱頭痛也從頁從火一曰從焚省声臣鍇按宋玉風賦􅓹勃煩冤煩熱冤亂復喧反癡不聦明從頁声臣鍇曰癡之狀見于頭靣也五隘反難暁也從頁米一曰鮮白皃從粉省臣鍇曰類從此勤㑹反顦顇也從頁卒声臣鍇按楚詞曰形容顦顇劳苦見于見夕位反繫頭殟也從頁昏声臣鍇曰殟屈頭死之也莫魂反醜也從頁亥声候猜反頭也從頁其声今逐疫有䫏頭臣鍇按靈光殿賦曰忔䫏􅓥以鵰䫏頭方相四目也遣之反呼也從頁籥声尚書曰率籲衆戚云遇反頭明飾也從頁声臣鍇曰頁頭也若具列物數一頭二頭也㑹意呼衍反選具也從二頁士戀反大頭也從頁禺声詩曰其大有顒魚容反顦顇也从頁焦声昨焦切文九十三重八頭也象形几􅔣之屬皆從􅔣臣鍇曰髪也式九反靣和也從􅔣從肉讀若柔臣鍇曰爾雅戚施靣柔也肉物之柔者㑹意然尤反文二顔前也從􅔣象人面形凡面之属皆從靣臣鍇曰顔額也弭釧反靣見也從靣見亦声詩曰有􅌤靣目臣鍇曰凡人所視瞻心實見之故有别識無耻之人面見之而已心實否山國語范蠡曰雖􅌤然人面實禽獸也㑹意聽銑反或從旦頰也從面甫声臣鍇按易曰咸其輔頰䩉與輔義相近浮甫反面焦枯小也從面焦声前昭反倒首也賈侍中説此㫁首倒縣県字凡県之屬皆從􅹁臣鍇曰漢律有􅹁首多借梟字堅簫反繋也從系持県臣鍇按顔師古匡謬正俗云古書縣邕皆作此直縣挂字引説文為證此懸今人加心文二靣毛也從頁彡凡須之属皆從須臣鍇曰㑹意四于反口上須也從須此声即冝反頰須也從冄冄亦声臣鍇曰今俗作髥而淹反須髪半白也從須卑声賔而反短須髮皃從須否声甫友反文五毛飾畫之文也象形凡彡之屬皆從彡臣鍇曰古多以羽旄為餙象彡彡然所咸反象形也從彡幵声臣鍇曰彡以其冄弱委曲象之也賢星反稠從彡人声詩曰㐱髪如雲臣鍇曰從人物之人今詩作鬒又一㐱鳥羽也從几音同而體小異也支允反或從髟眞声飾也従彡攸声臣鍇曰尚書曰簡厥修息抽反文章也從彡章声臣鍇曰文章飾也周良反瑑文也從彡周声覩挑反飾也從彡青声寂逞反細文也從彡􅮼省声臣鍇曰􅮼音郤穆從此莫叔反撓也上象撓曲彡象毛氂撓弱也弱物并故從二臣鍇曰指事如約反駮文也從文辡声臣鍇曰今作班也不攀反微畫也從文從􅫕声利之反文四長髮猋猋也從長從彡凡髟之属皆從髟所咸反根也從髟犮声飛伐反或從首作古文頰髮也從髟賔声比刃反髮長也從髟㒼声讀若蔓没團反髪長也從髟監声讀若春秋黒以濫來籠三反髪好也從髟差声千可反髪好也從髟卷声詩曰其人羙且鬈臣鍇曰髪柔好也衝貟反髪也從髟毛声門髙反髪皃從髟臱米田反髪多也從髟周声臣鍇曰詩曰綢道如髮陳收反髪皃從髟爾声讀若江南謂酢母為臣鍇曰酢毋酢糟寜洗反髪皃從髟咅声歩矛反髪至眉也從髟敄声詩曰䋩彼两臣鍇曰今詩作髦莫浮反或從敄省漢令有髳長臣鍇曰髳羌地名髳地之長也女鬢垂皃從髟前声臣鍇按楚辭曰盛鬋不同即連反鬋也一曰長皃從髟兼声讀若慊連鹽反束髪少也從髟􅎒声臣鍇按張衡西京賦曰朱鬕䰏即血反髪也從髟易声臣鍇按周禮追師掌王后之首服為副編次注云副覆首以為餙其遺象若今歩揺服之從王祭祀編列髮為之若今假紒服之以桑也次次第髮長短為之若今髮鬄服以見王燕居則纚笄緫而已詩所謂鬒髪如雲不屑鬄也臣以為副若今三釵先為髪髪覆首上釵為鳯雉形口衘歩揺者也編若今編梳次第卷髮編列為之次即今髪也劉熈釋名鬄剔刑人為之髲則以續鬄則全假為之也思益反鬄或從髟也声臣鍇曰春秋左傳衞公出見吕氏之妻髪羙以為吕姜髢鬄也從髟皮声平義反用梳比也從髟次声臣鍇曰此即周禮所謂次今作次假借七恣反㓗髪也從髟􅡜声臣鍇曰禮所云組括䯺作括假借儀禮鬠用組注古作括古括反卧髻也從髟般声讀若槃臣鍇曰古今注所謂槃桓髻别安反髻也從髟付声方娶反帶髻餙從髟莫声悶亞反屈髪也從髟貴声區師反簮髻也從髟介声臣鍇曰簮髻即假髻也荀差反髪鬛鬛也從髟巤声律㨗反或從毛或從豕鬛也從髟盧声論孤反也從髟竝声盤浪反髴若似也從髟弗声臣鍇曰毛髮髴髴然似之分勿反亂髪也從髟茸省声乳逄反髪墮從髟墮省声直垂反鬌髮也從髟春声矢閏反髪秃也從髟間声苦閒反髴髮也從髟剔声他狄反􅚎髪也從髟兀声苦敦反或從元􅚎髮也從髟弟声大人曰髡小人曰鬀盡及身毛曰􅚎他計反也忽見從髟录声籕文魅亦忽見意芳未反䘮髻禮女子髽哀弔則不髽魯臧武仲與齊戰于狐鮐魯人迎䘮者始髽從髟坐声鄒茶反文三十八重七繼體君也象人之形施令以告四方故􅛣之從一口發號者君后也凡后之屬皆從后臣鍇曰通論詳矣一專言也章移反小巵有耳蓋者從巵專聲殊剸反小巵也從巵耑声讀若棰撃之棰職仲反文三瑞信也守國者用玉卪守都鄙者用角卪使山邦者用虎節土邦者用人卪澤邦者用龍卪門關者用符卪貨賄用璽卪道路用旌卪象相合之形凡卪之屬皆從卪臣鍇曰周禮掌守邦節而别其用以輔王命注邦節鎮圭方璋糓圭琰圭也玉節之制如王以命數為大小角卪犀角為之山多虎平地多人澤多龍符卪如今宫中官詔符璽卪今之印章旌卪令使者所擁卪今皆作節字卪象半分之形守國者其卪半在内半在外即血反發號也從兮卩臣鍇曰號令者集而為之卩制㑹意力聘反輔信也從卪從比聲虞書曰弼成五服臣鍇曰今尚書作弼皮宻反有大度也從卩多声讀若移真避反宰之也從卪必声彼至反高也從卩召声食要反科厄木節也從卪厂声賈侍中說以為厄裹也一曰巵蓋也臣鍇曰厂音移巵從此五果反脛頭也從卩桼声臣鍇曰今俗作膝膝人之節也恖一反膝曲也從卩􅫦声臣鍇曰詩有卷阿曲阿也俱兖反節欲也從卩谷声期灼反二卩也巽從此闕助箭反舍車解馬也從卩止午声讀若汝南人冩書之冩臣鍇曰御從此蘇夜反卩也闕則凑反文十三執政所持信也從瓜從卩凡印之屬皆從印臣鍇曰瓜手瓜以持印也㑹意伊鎮反按也從反印臣鍇曰者外向而印之反印為内自抑也㑹意憂仄反俗從手作文二重一顔气也從人從卪凡色之属皆從色臣鍇曰顔色人之儀卩也㑹意踈憶反古文色艴如也從色弗声論語曰色艴如也臣鍇曰盛气色也孟子曰曽西艴然其字如此歩咄反縹色也從色并声臣鍇按宋玉神女賦薄怒自以持曽不可乎犯干匹逈反文三重一事之制也從卩凡卯之属皆從卯闕臣鍇曰反覆卩之也起明反章也六卿天官冢宰地官司徒春官宗伯夏官司馬秋官司㓂冬官司空從卯皀声臣鍇按白虎通曰卿章也章善明理也反覆節其事也皀又音香起明反文二法也從卩辛節制其􅓧也從口用法者也凡辟之屬皆從辟臣鍇曰口以理之㑹意卑僻反治也從辟井周書曰我之不臣鍇曰并法也與荆同意今尚書作辟卑僻反治也從辟乂声虞書曰有能俾臣鍇曰今尚書作乂偶喙反飽也從勹祭祀曰厭匓臣鍇曰禮有隂厭陽厭厭匓也今禮作飫于㩀反重也從勹復声伐六反或省彳高墳也從勹豕声臣鍇曰地高起若有所包也知悚反文十六重三象人裹妊巳在中象子未成形也元气起于子子所生也男左行三十女右行二十俱立于已爲大婦裹妊于巳巳爲子十月而生男起巳至寅女起巳至申故男年始寅女年始申也凡包之属皆從包臣鍇曰任懐任也巳爲四月萬物含實故象人懐子也子在北方冬至夜半一陽所起故曰子人所生男自子左數次寅次卯爲左行凡三十得巳女自子右數次亥次戍次酉凡二十亦得巳至此㑹合夫婦懐任之義巳爲子謂所生子也巳𥘉懐子男左行午次未凡十二月得寅女右行自已次辰次卯凡十月得申寅在東北爲夏正月物徹子甲而出陽𥘉出故爲男年之始甲在西南爲夏七月隂气至此始岀故爲女年之始也北交反兒生裹也從肉包浦包反瓠也從夸包声取其可包藏物也歩交反文三自急敕也從羊省從包省徙口口猶慎言也從羊羊與義善羙同意凡苟之属皆從苟臣鍇按羊美物也人自美其身故目儆敕云與善同意包者自束歛春秋左傳張骼輔躒曰公孫之亟當也作此苟作亟假借已力反古文不省肅也從攴苟臣鍇曰㑹意居竟反赤魃除牆星之物也詩曰旱魃為虐臣鍇按周禮犮氏掌除牆屋謂除自理之物若鼃及蝎之屬今周禮作犮歩将反老精物也從鬼彡彡鬼毛宻至反古文籕文魅從彖首從尾省声或從未鬼服也一曰小兒鬼從鬼從支韓詩傳曰鄭交甫逢二女鬾服臣寄反鬼皃從鬼虎声虎烏反鬼俗也從鬼幾声淮南傳曰吴人鬼越人􆄈也居希反鬼鬽声䰰䰰不止也從鬼需声奴詬反鬼變也從鬼化声呼咵反見鬼驚詞從鬼難省声讀若詩受福不儺臣鍇按歲終大儺娠子口呼􆃴􆃴也如何反鬼皃從鬼賔声婢民反可惡也從鬼酉声稱肘反神獸也從鬼隹声杜回切文十七重四鬼頭也象形凡甶之屬皆從甶臣鍇曰靣髣髴之皃分勿反惡也從甶虎省臣鍇曰㑹意迃胃反古文省母猴屬頭似鬼從甶從禸臣鍇曰禸禽獸迹也疑預反文三重一姦邪也韓非曰蒼頡作字自營為厶凡厶之尸皆從厶臣鍇曰此公厶字今皆作私先兹反逆而奪取曰篡從厶算声臣鍇曰漢書曰篡取之測慣反相訹呼也從厶臣鍇曰訹誘也夷說文解字通釋卷第十七
