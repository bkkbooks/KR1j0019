body:
  text: 文五十五重四二山也凡之屬皆從闕所臻反會稽山一曰九江當塗也民以辛壬癸甲之日嫁娶也從余聲虞書曰豫娶嵞山臣鍇按尚書傳禹方治水以辛日娶甲日復往治水在家三日耳嵞山民其先俗以辛日嫁娶亦或後人見禹之聖其後有天下因以成俗也若巫之禹步然田吾反文二岸髙也從山廠廠亦聲凡屵之屬皆從屵臣鍇曰廠音罕會意顔遏反水涯而高者從屵干聲臣鍇按爾雅重崖岸注兩崖纍者也偶旰反高邊也從屵圭聲臣鍇曰水邉地有垠也無垠堮而平曰汀五佳反高也從屵佳聲臣鍇曰崔嵬高也今俗作崔省廠也都魁反崩也從屵肥聲匹鄙反崩也從屵配聲讀若費步咄反文六因廣為屋象對剌髙屋之形凡廣之屬皆從廣讀若儼然之儼臣鍇曰因廠為屋故但一邉不也今字書撫反籕文從舞厨也從廣包聲步交反庖屋也從廣尌聲纒區反兵車藏也從車在廣下寬步反馬舍從廣􅴸聲周禮曰馬有二百十四匹為廏有僕夫臣鍇按周禮馬四匹為乘乘馬一師四圉三乘為皂皂一趣馬三皂為繫一馭夫六繫為廏廏一僕夫凡二百十六應乾之莢此二百十四傳寫誤見岫反古文從九東西牆也從廣豫聲臣鍇按書傳所以序别內外夕與反牆也從廣辟聲臣鍇曰所謂廦雍卑僻反殿之大屋也從廣黃姑沆反廡也從廣虜聲讀若鹵勒古反芻藁之藏從廣會聲臣鍇按史記趙孝成王時邯鄲廥燒古最反水槽倉從廣臾聲一曰倉無屋者臣鍇按詩傳露積曰庾勻取反蔽也從廣并聲臣鍇曰蔽屏也吕氏春秋趙簡子立於屏蔽之下比郢反清也從廣則聲臣鍇曰此溷厠也古多謂之清者以其不潔常當清除之也清今俗字書或作圊測吏反一畒半一家之居從廣里八土臣鍇曰古百步為畒三畒為里一畒半半里也故從里里八土八半分也會意茶連反屋牝瓦下一曰維綱也從廣省聲讀若環臣鍇曰牝瓦仰瓦戶闕反屋階中會也從廣匆聲臣鍇曰階東四階也會者其中階相向處粗中反廣也從廣侈聲春秋國語曰俠溝而㢋我臣鍇曰㢋我牽曵之使勢分廣也昌妓反仄也從廣兼聲臣鍇曰廉稜也連兼反開張屋也從廣聲濟隂有縣臣鍇曰音文加反濟隂縣金日磾所封今音丁故反又著巴反高屋也從廣龍聲貧雙反山居一旦下也從廣氐聲的米反礙止也從廣至聲知疾反安止也從廣嬰聲巨鹿有陶縣伊請反舍也從廣友聲詩曰邵伯所臣鍇按周禮仲夏治兵為茇舍草止也詩周禮皆借茇字步將反中伏舍從廣卑聲一曰屋􅋻或讀若逋臣鍇曰低小屋也頻旨反蔭也從廣比聲必至反屋下衆也從廣古文光字臣鍇曰通論詳矣失著反行屋也從廣異聲臣鍇曰晉有王廙以即反屋廲樓也從廣婁聲臣鍇曰窗疏之屬廲樓猶玲瓏也漏明之象勒兜反屋從上傾下從廣隹聲都魁反屋傾也從廣發聲方喙反久屋朽木從廣酉聲周禮曰牛夜鳴則臭如朽木夷酒反少劣之居從廣堇聲臣鍇曰僅能居也春秋傳衛有治廑漢書董仲舒傳作僅字用伎殷反尊先祖貌也從廣朝聲臣鍇按古今注廟從此連的反石利也從廠異聲讀若枲辛子反美石也從廠古聲得古反唐石也從廠屖省聲敵圭反石聲也從廠立聲勒沓反石地惡也從廠兒聲臣鍇曰不煩易意倪激反石地也從廠金聲讀若襟巨金反石間見從廠甫聲讀若敷甫攴反厲石也從廠昔聲詩曰他山之石可以為厝臣鍇曰今詩借錯孝經借此為措字操各反石大也從廠尨聲臣鍇按詩曰為下國駮厖兔江反岸上見也從廠從之省聲讀若躍臣鍇曰滑從此略反側傾也從廠人在廠下臣鍇曰人在崖石之下不得安處也會意齋食反籕文從廠大大亦聲反也從廠辟聲臣鍇曰春秋左傳曰辟陋在夷當此􅷘字篇石反隱也從廠非聲臣鍇按楚辭曰隱忠文四在高而懼也從厃自卪止之凡危之屬皆從危臣鍇曰孝經曰在上不驕高而不危制節謹度滿而不溢故從卪虞為反嶇也從危支聲牽冝反文二山石也在廠之下口象形凡石之屬皆從石臣鍇曰囗音圍神隻反銅鐡朴石也從石黃聲讀若穬臣鍇曰銅鐡之生者多連石也周禮作草古猛反古文礦周石堅也從石吉聲一曰突也起八反石聲從石盍省聲苦盍反餘堅者從石堅省聲墾耕反磊砢也從石曆聲臣鍇按吳都賦玉石磊砢勤娜反礹石也從石斬聲臣鍇按詩曰嶄嶄之石當此字士衝反石山也從石嚴聲五監反堅也從石􅌛聲揩革反礊石也從石角聲臣鍇曰所謂磽確之地遐嶽反或從殼作礊石也從石堯聲口交切石巖也從石我聲偶和反嶄嵒也從石品聲周書曰畏于民嵒讀與巖同臣鍇按尚書傳嵒不齊也五反磨也從石卒聲蘇內反石碎也從石皮聲鋪卧反樂石也從石殸聲象縣虛之也形殳擊之古者母句氏作聲牽寧反籕文古文從巠止也從石疑聲偶代反上摘山巖空青珊瑚隨之從石折聲周禮有曰有硩蔟氏臣鍇曰吳都賦曰縹碧素玉硩陀山谷周禮硩蔟氏掌覆太鳥之巢耻列反磨也從石龍聲天子之桷椓而礱之來充反以石扞繒也從石延聲臣鍇曰今俗所謂碾也尺戰反磨也從石幵聲御堅反磨也從石豈聲古者公輸班作磑臣鍇按晉書王戎有水磑五對反舂也從石隹聲得悔反舂巳復搗之曰踏從石沓聲道合反以石著隿也從石番聲臣鍇曰亦見吳都賦又磻冢山名輔陀反斫也從石箸聲臣鍇曰爾雅作張略反石滑也從石見聲臣鍇按吳都賦緑苔蔘沙于硯上魚見反以石剌病也從石乏聲臣鍇按南史所謂石針逼廉反石地惡也從石鬲聲間隔反衆石也從三石臣鍇曰會意落浼反石磑也從石靡聲模卧反磊砢也從石可聲來可切文四十九重五久逺也從兀從匕兀者髙逺意也久則變化亡聲者倒亡也凡長之屬皆從長臣鍇曰兀高逺也亡音化寅良反古文長亦古文長極陳也從長隸聲臣鍇按春秋左傳斯肆其罔極素水反或從髟久長也從長爾聲臣鍇曰猶彌爾聲眼伊反蛇惡毒長也從長失聲臣鍇按爾雅镻蝁蝮屬大眼最有毒亭結反文四重三州里所建旗象其柄有三遊雜帛幅半異所以趣民故遽稱勿勿凡勿之屬皆從勿臣鍇曰今周禮作物假借無弗反或從作臣鍇曰􅻥旌旗故從音偃開也從日一勿一曰飛揚一曰長一曰強者衆貌臣鍇曰日所以開明勿旌旗得風開展一所以開也會意猶良反文二重一毛冉冉也象形凡冉之屬皆從冉臣鍇曰冉弱也象毛細而下垂柔檢反古文豕而三毛叢居者從豕者聲展魚反小豚也從豕殼聲臣鍇按爾雅曰狐之子也丁毒反生三月豚腹豯豯貌也從豕奚聲臣鍇曰奚腹大賢迷反生六月豚從豕從聲一曰一歲豵尚藂聚也臣鍇按爾雅又豕生三子為豵子紅反牝豕從豕巴聲一曰二歲能相把拏詩曰一發五豝不奢反三歲豕肩相及者從豕幵聲詩曰並驅從兩豜兮激賢反䩟豕也從豕賁聲扶云反牡豕也從豕假聲臣鍇按春秋左傳曰輿豭從已間巴反上谷名豬豛從豕役省聲與扶云辟反豬也從豕隋聲隋觜反齧也從豕㫐聲臣鍇曰􅝴字從此可佷反豕息也從豕一聲春秋傳曰生敖及豷臣鍇曰息喘息也許位反豕息從豕甫聲甫殳反以穀修毫獸一曰河內名豕也從下象毛足凡㣇之屬皆從㣇讀若弟臣鍇按爾雅作貄注㣇毫毛長也羊媚反古文籕文豕屬從彖聲臣鍇曰音忽呼𬋩反豕鬛如筆管者出兩郡從㣇髙聲臣鍇曰所謂豪豬行高反籕文從豕臣鍇等曰今俗别作毫非是蟲似豬從㣇胃省聲于貴反或從蟲作㣇屬從貮㣇素次反古文㣈虞書曰㣈類于上帝臣鍇曰今尚書作肆文五重五豕之頭象其鋭而上見也凡彑之屬皆從彑讀若罽居例反豕也後􅕭廢謂之彘從彑矢聲從二匕彘足與鹿足同臣鍇曰後􅕭頓廢直例反豕也從彑從豕讀若弛書爾反豕邊從彑下象足讀若瑕臣鍇曰指事䀶加反豕走也從彑從豕聲吐半反文五小豕也從彖省象形從又持肉以給祠祀也豚之屬皆從豚臣鍇曰禮豚曰腯肥徒昆篆文從肉豕豚屬從豚衛聲讀若罽于歲反文二重一獸長脊行豸豸然欲有所伺殺形凡豸之屬皆從豸臣鍇曰豸豸背隆長貌欲有所伺殺謂其行綴也池倚反似虎圜文從豸勺聲晡效反貙獌似貍者從豸區聲丑殊反貙屬也從豸單聲特丹反豹屬出貉國從豸聲詩曰獻其貔皮周書曰加虎如貔貔猛獸臣鍇按爾雅貔白狐毗字鼻冝反或從比作狼屬狗聲從豸才聲臣鍇按爾雅豺狗足腳似狗蟬齋反猰貐似貙虎瓜食人迅走從豸俞聲臣鍇按山海經猰貐蛇身人靣為二貟臣所殺淮南子曰堯之時㝣窳鑿齒皆為民害乃使羿上射十日下殺㝣窳注云狀若龍首一曰似貍善走食人勻取反似熊而黃黑色出蜀中從豸莫聲臣鍇按爾雅貘白豹注似熊而小頭􅋻腳黑白骹能嗜食鐡銅及竹沒白反猛獸也從豸庸聲與封反貜也從豸矍聲臣鍇按爾雅貜父善顧注似彌猴而大蒼黑能攫持人王若反獸無前足從豸出聲漢律能捕豺貀購百錢臣鍇按爾雅注似狗豹文或云似虎而黑胡勍反以狐善睡獸從豸舟聲論語曰狐貈之厚以居臣鍇按此音下各反而云從舟聲此古音當有異也間縳反胡地野狗從豸干聲臣鍇按爾雅注貙之大者也偶旰反犴或從犬詩曰宜犴宜獄鼠屬大而黃黑出胡丁零國從豸召聲臣鍇按古今注侍中冠以貂為飾取其和潤而有文覩桃反北方豸種從豸各聲孔子曰貉之為言惡也臣鍇曰古音鶴也沒白反貉之類從豸亘聲臣鍇按爾雅貉子也戶寒反伏獸似貙從豸里聲臣鍇曰貍善藏伏也利之反獸也從豸專聲讀若湍臣鍇按爾雅注貒豚一名貛士鑾反野豕也從豸雚聲呼寬反鼠屬善旋從豸穴聲臣鍇按所謂猿狖也羊狩反文二十重三如野牛而青象形與禽離頭同凡􅹌之屬皆從􅹌臣鍇按爾雅􅹌似牛注一角青色重千斤徐美反古文從几文一重一蜥易蝘蜓守宫也象形祕書説曰日月為易象隂陽也一曰從勿凡易之屬皆從易臣鍇曰祕書謂下
