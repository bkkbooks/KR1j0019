front:
  text: 東岱南霍西華北恆中泰室王者之所以巡狩至從山獄聲臣鍇曰白虎通嶽確也王者巡守確切德也尚書曰王乃時巡守考制度子四嶽逆捉反古文象高形太山也從山代聲臣鍇按白虎通東山萬物更伐之處也徒再反海中往往有山可依山曰島從山鳥聲讀若搗詩曰蔦與女蘿臣鍇曰釋名曰島到也人所奔到也得早反山在齊地從山狃聲詩曰遭我于峱之間兮能刀反葛嶧山東海下邳從山睪聲夏書曰嶧陽孤桐臣鍇曰即秦刻石處也在魯山積石絡繹而成也移尺反封嵎之山在吳楚之間從山禺聲臣鍇按國語孔子曰防風氏守封嵎之山者也元無反九嶷山舜所葬在零陵營道從山疑聲臣鍇曰言山九峯相似可疑也銀眉反山在蜀湔氐西徼外從山聲臣鍇曰徼在西南所以徼隔蠻夷湔水名今俗作岷眉均反山也或曰弱水之所出從山凡聲臣鍇曰山海經曰女几山謹美反巀嶭山在馮翊池陽從山􅎒聲臣鍇曰􅎒薛亦山短而峻形才葛反巀嶭山也從山嶭聲聲遏反山在弘農華隂從山華省聲戶化反山在鴈門從山聲昆霍反崵山在遼西從山昜聲一曰嵎鐵崵谷也臣鍇曰漢高祖所隱亦曰崵山尚書曰宅嵎夷崵谷古文尚書夷作鐵古文鐵金旁作夷作夷故與夷相亂後人訛作鐵猶良反山有草木也從山古聲詩曰陟彼岵兮桓土反山無草木也從山已聲詩曰陟彼屺兮乞以反山多大石也從山學省聲遐嶽反山多小石從山敖聲偶也反石戴土從山且聲詩曰陟彼岨矣且渠反山脊也從山网聲格康反山小而高從山今聲臣鍇曰張協七命曰陵黃岑助吟反崒峞高也從山卒聲津冝反山小而鋭從山􅒋聲魯剜反山如堂者從山宓聲美弼反山冗也從山由聲臣鍇曰自岵已下皆見爾雅解又反籕文從冗高也從山陖聲臣鍇曰􅳮音浚子閠反或從陖省山之嶞者從山憜省聲讀若相推落之墮臣鍇曰爾雅注山形狹長曰墮詩曰墮山喬嶽持妥反山之岑崟從山金聲臣鍇曰張協詩曰周文走崟銀欽反尤高也從山棧聲助眼反山短高也從山屈聲臣鍇曰靈光殿賦曰隆崛乎青雲崛音九物反瞿弗反巍高也從山蠆聲讀若厲里曵反山專也從山夆聲敷容反岸也從山嚴聲臣鍇曰古言巖廊者殿旁高廡也語醃反山巖也從山品聲讀若吟五監反巖也從山絫聲落浼反山貌從山聲造瓘反山貌一曰山名從山告聲古奧反山貌從山差聲時妥反嵯峨也從山我聲偶和反嶸也從山青聲臣鍇曰今俗作崢測亨反崝嶸貌從山榮聲戶庚反谷也從山巠聲臣鍇按驪山下谷秦坑儒處賢星反山壞也從山朋聲輔弘反古文從􅊟山脅道也從山弗聲臣鍇曰山半腹旁山而行也分勿反山名從山敄聲臣鍇按顔之推家訓魏郡有小山名嵇山名權古碑云土有權嵇王喬所仙也勿赴反焦嶢山高貌從山堯聲研梟反山􅳮也從山戕聲賤志反九嵏山在馮翊谷從山㚇聲子紅反陬隅高山之節從山卩讀若隅臣鍇曰按山之陬隅髙處田岊即血反嵬髙也從山宗聲助弓反山貌從山隓聲徒果反大高也從山隹昨回反
