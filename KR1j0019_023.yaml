body:
  text: 文二鳥飛從髙下至地也從一一猶地也象形不上去而至下來也人至之屬音從至臣鍇按禮曰玄鳥言之也戰媚反古文至至也從至刀聲都告反至也從至秦聲側詵反忿戾也從至至而復孫孫遁也周書曰有夏氏之民叨讀若摯同臣鍇曰今尚書作懫借也此會意陟利反到也從三至而吉反觀四方而高者也從至高省與室屋同意之聲臣鍇按春秋公羊傳曰諸侯臺門謂築土為門也兩觀于臺上更為重屋田咍反文六重一鳥在巢上也象形曰在西方而鳥西故因以為東西之西也凡西之屬皆從西臣鍇曰此本象鳥棲也斯低反古文西臣鍇曰卜亦象鳥也籕文西俗西從木妻姓也從西圭聲臣鍇按張説梁四公記有䙵勺迷反文二重三西方鹹地也從西省困象鹽形安定有鹵縣東方謂之西方謂之鹵凡鹵之屬皆從鹵臣鍇按史記曰大抵東方食鹽西方食鹽鹵春秋左傳晉有大鹵之地安定在晉也爾雅注齊有海濵廣斥也又河東解縣鹽池有印鹽方如印齒文也勒古反鹹也從鹵差省河內謂之沛人言若虛臣鍇按禮鹽曰殘陀反銜也北方味從鹵咸聲俟彡反文三鹹也從鹵監聲古者夙沙𥘉作煮海鹽凡鹽之屬皆從鹽臣鍇按夙沙黃帝臣也西方有鹽井也羊廉反古河東鹽池袤五十一里廣七里周百一十六里從鹽省古聲臣鍇按今靈慶也昆覩反鹵也從鹽省僉聲魚欠切文二護也半門為户象形凡户之屬皆從户臣鍇按禮曰將上堂聲必揚將入户視必下桓土反古文從木屝也從户翅省臣鍇曰象鳥之翅會意詩椽反户扇也從户非聲臣按春秋左傳曰入于扉中甫肥反室在旁也從户方聲臣鍇按秦築宫于驪山之旁曰阿房宫也浮長反輜車旁推户也從户大聲讀與釱同臣鍇曰謂車中狹不容轉扉傍壁為扇推而開閉也徒詩反隘也從户乙聲臣鍇曰戶小門也晏索反外閉之開也從户坰聲臣鍇曰古人言外户是也居屏反始開也從户聿聲臣鍇曰聲字從此與必反户牖之間謂之㦿從户衣聲臣鍇曰禮注云若今屏風也殷豈反閉也從户省聲枯踏反文十重一聞也從二户象形凡門之屬皆從門臣鍇按尚書闢四門明四目所以廣聞見也莫魂反天門也從門昌聲楚人名門閶闔臣鍇按楚詞叫帝閽使開關兮倚閶闔而望豫潘嶽賦夢良人來逰若閶闔兮洞開此則通名為閶闔今人或者但謂天門為閶闔誤矣醜將反宫中之門也從門韋聲字歸反䦲謂之樀樀廟門也從門詹聲臣鍇曰今俗作擔羊廉反巷門也從門尢聲臣鍇按春秋左傳曰高其閈閎混耕反特立之户也上員下方有似圭從門圭圭亦聲涓亐反門旁户也從門合聲苟合反樓上户也從門莫大羽聲他榼反門也從門干聲汝南平與里門曰閈侯玩反里門也從門吕聲周禮曰五家為比五比為閭閭侶也十五家相群侶也連于反里中門也從門臽聲臣鍇曰史記李斯以閭閻入事羊廉反閻或從土市外門也從門貴聲胡塊反城內重門也從門垔聲詩云出其闉闍臣鍇曰若今門外壅城門也伊倫反闉闍也從門者聲丁通反門觀也從門厥省聲臣鍇按中央闕而為道又古今注人臣至此則思其所闕蓋為二臺于門外人君作樓觀于上上貟下方以其闕然為道謂之闕以其上可逺觀以其縣法謂之象魏書名也區越反門欂櫨也從門辨聲皮變反門扉也從門介聲古拜反門扉也從門盍聲一曰閉也臣按春秋左傳曰旋于門中以枚數闔謂以鞭數扉之版也候臘反門梱也從門臬聲魚滅反門榍也從門或聲論語曰行不履閾臣鍇曰門限也于抑反古文閾從洫門高也從門良聲巴郡有閬中縣來宕反開也從門辟聲頻役反虞書曰闢四門從門從􅦁開也從門單聲易曰闡幽昌善反闢門也從門為聲國語曰䦱門而與之言于委反張也從門幵聲渴才反大也從門可聲大柸亦為閜臣鍇曰書傳多云豁閜也許下反開閉門也從門甲聲鶯甲反閉門也從門必聲春秋傳曰閟門而與之言筆媚反所以止扉者從門各聲臣鍇按爾雅弋長者謂之閣所以止扉即今云門頰扇所附著也根莫反隟也從門從月臣鍇曰夫門當夜閉閉而見月光是有間隙也豆間反古文間如此門傾也從門阿聲惡可反遮壅也從門於聲臣鍇曰按史記書壅閼字如此憂歇反開閉門户利也從門利也從門絲聲或曰縷十絃也職沇反門聲也從門曷聲乙轄反門響也從門鄉聲臣鍇按爾雅兩階間謂之䦳注人君南䦳當階間也許文反門遮也從門東聲勒餐反闌也從門中有木臣鍇按昜曰間邪存其誠陶潛有間情賦謂闌止其情𣣔也會意候艱反闔門也從門才所以距門臣鍇曰才木也會意辟桂反外閉也從門亥聲偶代反閉門也從門者聲歐欽反以木橫持門户從門􅳑聲古還反開下牡也從門􅕛聲臣鍇曰今人作鑰也胤略反盛貌也從門真聲臣鍇曰詩云振旅闐闐笛前反闛闛盛貌也從門堂聲特郎反竪也宫中閹閹閉門者也從門奄聲於劒反常以昏閉門隸也從門昏聲喧盆反閃也從門規聲去規反妄入宫掖也從門􅒋聲臣鍇曰律所謂闌入也勒餐反聲也從門古文下字讀若軍􅞽之􅞽臣鍇曰二字短下晝為字字從此遲誤反窺頭門中也從人在門中臣鍇曰會意施塹反具數于門中從門兊聲臣鍇曰春秋曰大閲簡車馬也具數一一數之也今人言伐閲謂歷數其門中之功伐也與缺反事巳閉門也從門癸聲傾雪反望也從門敢聲臣鍇按詩曰進厥武臣闞如哮虎闞進且望也苦濫反疏也從門活聲苦末反弔者在門也從門文聲眉引反古文閲從思馬出門貌從馬在門中讀若郴臣鍇按春秋公羊傳曰左右舉大􅐤而至開之闖然公子楊生也敕鴆反開也從門豈聲苦亥切文五十七重六主聽也象形凡耳之屬皆從耳柔以反耳垂也從耳下垂象形春秋傳曰秦公子耴耴者其耳垂也故以為名臣鍇曰以晉景公黑臀之類言之也此指事陟聶反小垂耳也從耳占聲丁添反耳大垂也從耳冘聲詩曰女之耽兮覩貪反耳曼也從耳冉聲臣鍇曰耳無輪郭也他甘反聃或從甘垂耳也從耳詹聲南方有瞻耳國多談反耳著頰也從耳炯省聲杜林説耿光也從光聖省聲凡字皆左形右聲耿光説非是臣鍇曰耿耿經侹昭著之貌故曰耿耿不寐又耿介也尚書以覲文王之耿光今按鳥部多右形左聲不知此言後人加之邪將傳寫失之邪根杏反連也從耳耳連于頰從絲絲連不絶也臣鍇曰周禮官府之聮事謂大事非一官所了者衆共成之也會意鄰延反耳鳴也從耳卯聲臣鍇曰楚辭曰耳聊耿而未止梨桃反通也從耳呈聲詩令反察也從耳忽聲粗中反聆也從㥁從耳從壬聲他寧反聽也從耳令聲連丁反記微也從耳哉聲臣鍇按周禮國有六職皆主記事之微也章直反歡語也從耳昏聲臣鍇曰春秋左傳太子痤聒而與之語古活反張耳有所聞也從耳禹聲俱取反音也從耳殸聲臣鍇曰通論詳矣識征反知聲也從耳門聲云反古文聞從昏訪也從耳甹聲臣鍇曰聘訪問之以耳也匹併反無聞也從耳龍聲來充反生而聾曰聳從耳從省聲思奉反益梁之州謂聾為聘秦晉聽而不聰聞而不逹謂之䏁從耳宰聲臣鍇曰不全聾也柤殆反生聾也從耳貴聲臣鍇曰謂從生即聾也五臾反聵或從㕟或從豙作無知意也從耳出聲讀若孽誅貀反墮耳也從耳月聲元伐反吳楚之外凡無耳者謂之􅫣從耳闋聲讀若斷耳為盟臣鍇曰言缺􅫣也五滑反安也從二耳寸帖反軍法以矢貫耳也從矢從耳司馬法曰小罪瞬之中罪刖之大罪剄之臣鍇按春秋左傳曰貫三人耳恥列反附耳私小語也從三耳臣鍇曰一耳就二耳也史記曰乃效兒女子呫聶耳語女懾反文三十二重四頷也象形凡臣之屬皆從臣臣鍇曰姬茞亦從此寅之反篆文臣從頁臣鍇曰指事籕文臣從廣臣也從臣已聲臣鍇曰熙字從此寅之反古文臣從户臣鍇曰今人言戺階戺也文二重三豈虔反舉手下手也從手一聲臣鍇按潘嶽賦率軍禮以長撎伊肆反推也從手襄聲然莊反首至地從手攀聲音忽具壞反臣鍇曰進趣之疾也故拜從之古文拜從二手揚雄説拜從兩手下拱也從手僉聲臣鍇曰按今人以此為撿字檢押從木作也留琰反斂手也從手共聲臣鍇曰尚書桑榖生太戊之朝七日大拱拱兩手大指頭指相住也矩悚反搯捾也從手官聲一曰援也烏末反搯捾也從手舀聲周書曰師乃搯搯者拔兵刃以習擊剌詩曰左旋右搯臣鍇曰今詩作左旋右抽偷力反擁也從手鞏聲矩悚反排也從手隹聲土回反推也從手夋聲春秋傳曰捘衛侯之手臣鍇曰排擠之也七賔反佐也從手夫聲凡無反卓反古文握如此提持也從手單聲讀若行遲驒驒持丹反握也從手巴聲輔寫反牽引也從手奴聲一曰巳也女加反提也從手巂聲勺迷反拈也從手耴聲丁帖反挈也從手是聲敵圭反也從手占聲年兼反舒也從手離聲臣鍇曰以手舒之也丑離反釋也從手舍聲式且反一指按也從手厭聲于帖反下也從手安聲恩肝反引也從手空聲詩曰控于大邦胸奴名引弓控弦寬宋反取易也從手寽聲一曰劣也魯掇反理也從手尞聲梨桃反剌內也從手臿臣鍇曰會意也楚反置也從手昔聲臣鍇曰周易曰茍措諸地可矣倉玄反擇也從手侖聲一曰從手貫也臣鍇按周禮入山林勞昆反摩也從手盾聲臣鍇曰史淮南王拊揗其民食尹反緣也從手彖與絠反拊也從手有聲普百反揗也從手付聲分武反把也從手咅聲今鹽官入水取鹽曰掊臣鍇曰詩曰曽是掊克步矛反掇也從手合聲常入反拾取也從手叕聲都撮反引取也從手孚聲詩曰原隰捊矣步侯反捊或從包自關以東謂取曰掩從手弇聲一曰覆也依漸反豫也從手受聲常岫反奉也受也從手卪取臣鍇曰卪節也上有節下承奉之尚書説命曰敢不承受君之明德視澄反給也一曰約也從手臣聲章信反拭也從手堇聲巳郡反朋羣也從手黨聲胡莽反交也從手聲節攝反㨷也從手市聲普未反􅗙引也從手同聲漢有挏馬官作馬酒臣鍇按漢書百官表謂取馬乳作酒頭貢反手呼也從手召聲也臣鍇按春秋左傳皮冠以招虞人真遙反安也從手無聲一曰掇也一曰循也臣鍇曰尚書撫于五辰循于五時分武反古文撫從亡辵簡選也從手睪聲澄赫反扼也從手足聲一曰握也臣鍇曰春秋左傳曰叔武聞君至投髮走出今或借作握氊嶽反捉也從手益晏索反長也從手延聲臣鍇按詩曰松桷有挻賖延反搣也從手前聲一曰竊也臣鍇按春秋左傳楚王曰姑揃搣此借翦字子善反批也從手滅聲彌恱反也從手此聲側抳反撮也從手鞫省聲堅祝反撮取也從手帶讀若詩螮煉之螮的替反摕或從折示兩手急持人也古文摕從止辵臣次立曰今説文井李舟竊韻下載徙字如此撫也從手昏聲一曰摹也眉均反量也度高下曰揣一曰捶之也從手專聲𥘉委反開也從手只聲讀若抵掌之抵真彼反習也從手貫聲春秋傳曰摜瀆鬼神古患反擲也從手殳聲特婁反搔也從手適聲一曰投也臣鍇按列子曰指擲無痕癢知白反括也從手蚤聲素叨反括也從手介聲工八反擊也從手爂聲一曰挈鑰壯也臣鍇按春秋左傳長水之斃無不摽也頻小反挑也從手夬聲縈節反撓也從手兆聲一曰摷爭也春秋國語曰郤至挑天土雕反戟狗也從手居聲臣鍇按詩豫手拮據傳曰戟拘也謂手執臂曲局如戟不可轉也堅踈反戟持從手局聲俱燭反揭也從手害聲間刮反刮也從手葛聲一曰撻也古轄反拓果樹實也從手啻聲一曰指近之也他狄反抲撝也從手可聲周書曰盡執柯獻虎何反暫也從手斬聲昨三反摺也從手劦聲一曰擸也虛業反敗也從手習聲之涉反束也從手秋聲詩曰百祿是揫臣鍇按爾雅束聚也即由反曵也聚也從手婁聲勒兜反有所失也從手云聲春秋傳曰抎子辱矣臣鍇按吕氏春秋秦穆公之甲抎者七禮今注傳作隕于惲反從旁持曰披從手皮聲臣鍇曰周禮曰哭執披史記無不披靡謂四向而散也坯卑反引也從手翟聲臣鍇曰謂拔擢也朱握反引縱曰􅪴從手聲臣鍇曰周易曰牛􅪴今作挈唱曵反積也從手此聲詩曰助我舉㧘一曰搣頰旁也贊寄反搖也從手卓聲春秋傳曰尾大不掉地料反動也從手聲延朝反動搈也從手容聲臣鍇曰溶動也淮南子動搈無形之域與恐反當也從手二聲直致反聚也從手酋聲即由反固也從手攺聲讀若詩曰赤舄掔掔臣鍇按史記倉公傳曰信即掔車轅未忍渡苦間反奉也從手夆聲甫反對舉也從手與聲臣鍇曰會意以盧反舉出也從手欣聲春秋傳曰掀公出于淖欣元反上舉也從手升聲易曰拯馬壯吉只磽反折或從登高舉也從手曷聲臣鍇曰周禮曰書而揭之豈例反舉救也從手辰聲一曰奮也章信反橫關對舉也從手工聲臣鍇按神仙子曰宋人患苗不長而揠之也厄戞反手推也從手壽聲一曰築也得早反係也從手􅒋聲以貟反拔也從手廷聲笛鼎反拔取也從手寒聲楚詞曰朝搴批之木蘭豈虔反逺取之也從手突聲臣鍇曰突音脫他含反探也從手覃聲臣鍇曰周禮有撣人陀暗反推也從手委聲一曰兩手相竊摩也臣鍇按詩注浣濯煩捼之事是也奴戈反別也從手敝聲一曰繫也僻噎反把也從手鬲聲讀若厄晏索反搹或從厄搖也從手咸聲侯坎反按也從手弱聲女伯反偏引一曰踦也從手奇聲臣鍇按春秋左傳譬如捕鹿諸戎掎之居綺反奮也從平軍聲火韋反伎也從手干聲侯玩反研也從手麻聲沒訛反摩也從手研聲禦堅反反手擊也從手聲臣鍇按春秋左傳􅔊而殺之篇兮反亂也從手覺聲詩曰祗攪我心根卯反推搗也從手茸聲而擁反卂搗也從手童聲臣鍇曰東方朔曰以莛撞宅邦反擠也從手崔聲一曰挏一曰折也臣鍇曰挏推動也徂回反擠也從手非聲步乖反排也從手齊聲子計反擠也從手氐聲的米反就也從手因聲臣鍇按易因而重之今此因扔字皆作因仍也伊倫反因也從手乃聲而應反潔也從手昏聲臣鍇按周易曰括囊無咎古活反撝也從手辟聲八麥反裂也從手為聲一曰手指撝喧垂反裂也從手赤聲麾擭反易筮再㧍而後卦從手力聲郎忒反巧也從手攴聲強倚反規也從手莫門胡反不巧也從手出聲燭恱反縫指㧺從手沓聲讀若眔一曰韋縚臣鍇曰今射㧺縫衣所用捍針也以韋為之也道合反圜也從手專聲杜酸反手推之也從手圂聲胡兀反四圭也從手最聲亦二指撮也臣鍇按漢律曆志以量者不失圭撮村奪反盛也于裡中也從手求聲一曰擾也詩曰救之陾陾臣鍇曰裡盛土之器也卷于反手口共有所作也從手吉聲詩曰豫手拮據臣鍇曰以手反口各舉衣䘳之一角也經節反掘也從手骨聲胡兀反搰也從手屈聲瞿弗反斂也小上曰掩從手奄聲依漸反滌也從手既聲詩曰溉之釡鬵苟代反取水沮也從手胥聲武威有壻次縣旁擊也從手敫聲牽料反疾擊也從手勺聲得了反笞擊也從手失聲臣鍇按春秋左傳曰歜以戈抶職暢七反側聲也從手民聲臣鍇按史記曰抵掌而談梁到溉見廣絶交論扺凡于地貞彼反以車鞅擊也從手央聲殷仰反衣上擊也從手保聲布偶反兩手擊從手卑聲北買反以杖擊也從手垂聲或曰摘也職纍反敲擊也從手崔聲刻學反中擊也從手竟聲一竟反過擊也從手弗聲臣鍇曰擊而過之也分勿反搗頭也從手堅聲讀若論語鏗爾舍琴而作懇耕反深擊也從手冘聲讀若告言不正曰抌竹甚反傷擊也從手毀聲吁委反攴也從手毄聲臣鍇曰攴撲也堅歷反扞也從手亢聲香浪反抌或文二百六十六重二十吕也象脅形也凡之屬皆從讀若乖徐鍇曰膐肉也呂即膂字骨淮反吕也從肉從津易反文二説文解字通釋卷第二十三
