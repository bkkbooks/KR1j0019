body:
  text: 繫傳三十五文林郎守袐書省校書郎臣徐鍇撰昔在太素清濁既敘三光宣其精五行播其形叄居鼎次亦各有成人者天地之化也力與天地並故於文一偶二為三天地之和人實敘之弗躬弗親庶民弗信詞之繹矣民之莫矣人與天地同功故亟成故於文一一人口又為亟又手也哀樂者萬物之本性也樂則思散越之故曰鳥烏之聲樂鍾鼓管磬所以飾喜也故於文口豈為喜豈箸陳樂立而上見也小言之曰喜大言之曰樂獨言之曰喜衆言之曰樂樂者出於人心布之於管弦也樂彌廣則備鼓鼙故於文木為樂象鼓形左右之應朄也應和也􅉧引也小鼓挂在大鼓之旁為引為和也夏后氏足鼓殷人楹鼓周人縣鼓樹鼓也在木上足之樹之之象也鼓者器之最大者也樂主於喜喜生於仁鼓東方之象也故二月女夷擊鼓以司天和春分之音也仁之聲也萬物之始生也故樂字象鼓也鍾者金也金斷而有制樂而無節則亂故以金斷制之太玄曰庚斷甲庚金也義也甲木也仁也庚斷甲義斷仁也書曰笙鏞以間言間隔其聲為之曲折之句也詩曰既和且平依我磬聲磬石也石有廉隅聲實而墜切而詣故以磬為之凖也立春則萬物畢出熙熙然泛泛然若將過溢焉至秋皆合於節制也金秋也文王受命始為靈臺萬民恱之故其詩曰經始勿亟庶民子來人民喜之也又曰經之營之不日成之不日猶言不及浹日也無風雨之暴以沮之天喜之也又曰麀鹿攸伏白鳥翯翯於牣魚躍鳥獸喜之也文王諸侯也民物皆喜而從之將有僣擬之事矣王於是乎作辟雍以教之為鼓鞀以和之擊金石以節之明臣節也故其詩曰於論鼓鐘於樂辟雍鼉鼓逢逢矇瞍奏公論者倫也言於是人心有倫理乎此辟雍也故曰小而言之曰喜大而言之曰樂又喜者主於心樂者無所不𬒳也恱者彌小也恱猶説也拭也解脫也若人心有欎結能解釋之也易曰恱以先民民忘其勞恱以犯難民忘其死傳曰陽門之介夫死司城子罕哭之哀而民恱本非無悶巳而心恱之也春秋傳曰殺子叢以悅行事有失以此自解説之自開釋其心也又曰公孫強獻白鴈曹伯陽恱之未形於言也故於文心兊為恱易曰兊説也決也心有不快忽自開決也詩曰蜉蝤掘閲掘閲者蜉蝤之掘土使解悶也故曰恱在心恱而不巳見於言貌故喜從口詩曰嗟嘆之不足故詠歌之詠歌之不足不知手之舞之足之蹈之故舞從足不知者不自覺知也手足之煩不可久故形於金石君子無故不徹縣也故曰恱主於心恱而不巳見於貌見於貌為喜喜而不巳發於聲故曰歌聲之不足以盡故成於詠詠者長言之也配之於詩也詠之不足則舞之蹈之故於文舛無為舞無舞聲也舛兩足左右也兩足左右蹈厲之也又無者廡也舞者巾袖繁廡也周禮有人舞帗舞也或曰手舞足蹈舞何以獨從足也曰略其可知也心見於貌貌化於口口聲於言言飾於詞詞宣於手手及於足由中以出自上而下足猶蹈之手可知矣故略之也或曰喜之言何也曰喜嚭也披也人心之恱則其靣目粹然而變矣及其喜也嚭然靣目皆披釋怒者恚也武也春秋傳曰奮其武怒又努也若強弩之發也人心之怒則靣目皆張起也莊子曰伏而喜仰而怒詩曰王赫斯怒爰整其旅孟子曰武王一怒而安天下之民心有所恚突然而發無所漸也武王怒不為暴退而整其旅故能安天下之民此君子之怒申舟為戮於宋楚莊王聞之投𬒮而起屨及於窒皇劒及於寢門之外車及於蒲胥之市不及納屨而走故不能成霸中國釋宋而歸師徒巳困此小人之怒也怒當以心節之故於文心奴為怒奴怒聲也哀者閔也閔痛之形於聲也故於文口衣為哀衣哀聲也狀其聲也人有所痛聲自然而出無復思慮此天性也故取法焉莊子曰強悲者雖哭不哀魯哀公曰寡人生於深宫之中未嘗知哀孔子對曰宗廟之中仰視榱桷俯察几筵其物具在其人巳亡以此思哀哀可知矣詩曰明發不寐有懷二人此文王之哀也桓魋奔宋宋公閉門泣之目盡腫此亂君之哀也哭無聲曰泣泣哭之細也微子過於殷墟欲哭則不可欲泣則以其似婦人故於文水立為泣水淚也立泣聲也哭主於哀宣於外也泣主於悲滯於內也詩曰不見復關泣涕漣漣故曰似婦人也悲者亦痛也在內故於文心非為悲非悲聲也又心之所非則悲矣淮南曰得之則喜失之則悲愛者惠也心愛之欲惠之也詩曰視爾如荍貽我握椒故於文心旡為愛旡愛聲飲食氣逆不得息曰愛人有所愛急食之則氣擁愛也心有所愛亦如之也又愛唈也氣咽也詩曰如彼遡風亦孔之愛向風而行則愛噯唈也故從愛今人氣擁則噯也今文愛嘉攴攴愛聲詩曰子惠思我褰裳涉溱子不我思豈無他人愛而思之也慕亦愛也愛在內而慕在外慕猶模也習也愛而習玩模範之也史記曰司馬相如慕藺相如之為人以其名為名常模範之是也於文心莫為慕莫慕聲也莫本音慕也莫亦模也愛者直愛之而巳無所放也禮曰愛之斯録之也好者好也愛而不釋也女子之性柔而滯有所好則愛而不釋也小子之性亦然好附著者也故於文女子為好孔子曰有顔回者好樂傳曰生好物也未有輕而捨其生者好物者控搏之好學者亦不捨也惡者惡也惡憎也傳曰死惡物也未有輕而迫死地也亞者醜也故於文心亞為惡也欲者貪欲也欲之言續也貪而不巳世傳曰人之所惡其氣熖以取之書曰無若火始熖熖言人抑其欲若火之𥘉發乍起乍伏進退之時也又曰天生蒸民有欲無主乃亂言君牧民救其欲也六韜曰義勝欲則從欲勝義則凶故於文欠谷為欲欠者開口也谷欲聲多才曰賢賢者賢臣也臤者執事也貝者貨也可以為用而寶之故曰財賢者亦用而寶之故於文貝臤為賢臤者臣執事也書曰所寶惟賢則適人安外傳曰趙簡子問於王孫圉楚之白珩猶在乎其為寶也幾何歲矣對曰楚之所寶觀射父左史倚相白珩先王之玩也非寶也愚者戇也戇猶椿也無所施為也愚之言寓也無所為若寄寓然也禺屬獸之愚者猿猴之類是也愚者之心似之故於文禺心為愚傳曰蟲莫智於龍莊子曰鳥莫智於鷾鴯驥不稱其力而稱其德由是言之則獸有愚智者也古之愚也直故曰憃愚憃猶憃若憃物直舂之無回慮故於文心舂為憃舂亦聲周禮三宥一宥曰憃愚賢者猶有過舉况在於愚故其過失所當宥之也今之愚也詐謂反覆回沈以行詐故殺之不以聽也勇者氣也力也勇者用也供用之謂勇勇則害上不登於明堂勇而不義亂也非勇也冉有用矛剌齊師故能入其軍孔子曰義也言能以義勇也夫子力翹門閞不以力聞夾谷之會威攝大國可謂勇矣故於文甬力為勇甬勇聲也古文心甬為勇見義而為也心主於義士不尚力也多畏曰怯怯脅也為人以威脅之不能動也犬性警而多畏駑犬之見猛獸垂尾而不能去故為文犬去為怯去怯亦聲也或心去為怯怯主於心也敬者肅也於文苟支為敬苟者亟也自急敕也支者執事也魏絳曰軍師不武執事不敬罪孰大焉恭亦肅也於文共心為恭非獨心而巳貌亦當恭共恭也共恭亦聲也語曰恭在貌敬在心洪範貌曰恭書曰接下思恭恭者取其供用敬者取其自警故曰恭在貌敬在心或曰敬在心何以從支恭在貌何以從心曰恭者龔慤其事釋曰見恭者貌行恭者心儻恭不由於心則幾於蘧蒢矣嫌其在貌故從心敬者自警嫌其慤於心而巳故從支支以執事也君子之心貌當相副所謂在貌在心有多少之差爾恭不得離心敬不得無用錯舉而名也洪範曰作肅執事振敬為肅故於文􅘢為肅執事也􅘢深水也回流也爾雅曰振者拭也亦振勵也詩曰戰戰兢兢如臨深淵如履薄氷肅之意也肅之為言夙也早也恆夙興也言日之早萬物莫不肅然孫子曰朝氣鋭晝氣惰暮氣歸又肅之言束也自申束也古文心日為肅日節也節其心也經曰節以制度髙而不危滿而不溢也慎者謹也慎之言身也恆存於身也故於文心真為慎真其心不鹵莽也真亦聲也古文屮火日為慎屮草也日暵之下有火故當慎之也慈者愛也廣愛也上安下之詞故曰飬老慈幼兹者滋廣也故於文心兹為慈慈之言字飬之也兹亦慈聲也心者直心而已心有所之為志詩者志之所之也天下之人其志不同各有所之也故於文心之為志也見之於外曰意季子佩寶劒見於徐君徐君欲而不言情見於色此意也故於文心音為意意猶抑也含其言欲出而抑之古詩曰盈盈一水間脈脈不得語此畜意也楚詞曰蓄怨兮積思心煩憺兮忘食事願一見兮導余意君之心兮與余異車既駕兮愒而歸不得見兮我心悲倚結軨兮太息涕潺湲兮霑軾慷慨絶兮不得中瞀亂兮迷惑私自憐兮何極意之謂也又心音者察音以知其心也出於口為言言行君子之所慎也詩曰哀哉不能言匪舌是出唯躬是瘁唯君子能言滿天下無口過孔子曰余欲無言也故於文口䇂為言䇂愆也言出禍入直言曰言無委曲故深戒之也禮曰王言如絲其出如綸王言如綸其出如綍書曰朕言不再惟口起羞也論難曰語語者午也言交午也故於文言吾為語詩曰于時言言于時語語吾語聲也言者直言語者相應答也易曰亂之作也則言語以為階階漸也起於言漸至於語也詞者音內而言外在音之內在言之外也何以言之惟也思也曰也兮也斯也若此之類皆詞也語之助也詩曰惟此文王又曰在城闕兮又曰神之格思不可度思矧可斁思書曰曰雨曰霽詩曰今我來斯皆詞也聲成文曰音此詞直音內之助聲不出於音故曰音之內聲成文之內一助聲也言之外者直言曰言又一字曰言惟思曰兮斯之類皆在句之外為助楚詞曰魂兮歸來些些亦詞也在句之外也故曰音之內言之外為詞故於文司言為詞司者臣主事於外也辭者訟也所以理也􅜆者亂也亂理也於文坰坰也外內之象也相引為亂也􅗸以理之也傳曰兵作於外為寇於內為亂也辛者辜也􅜆辛猶理辜也吕刑曰明清于單辭又單穆公曰告以文辭董之以武師又孔子曰晉為霸鄭入陳非文辭不為功慎辭也哉又晉趙盾伐邾欲立邾捷災率車八百乘以伐入國邾人拒之曰齊出玃且長趙盾曰其辭順犯順不祥乃去之詩曰詞之繹矣民之輯矣詞之莫矣民之釋矣又屈原雖放忠厚之至猶欲進言以救其國亂楚人録其意謂之楚辭辭之言孜也孜孜為辭也詩曰匪手攜之言示之事匪面命之言提其耳故楚辭之文下諷上也周公之作大誥上提其下之耳也或曰辭逹而已矣楚辭何為其豔也曰是非知之之言也玉之在佩必合於宫啇君子之言必成於文天何言哉星辰粲焉雲霞蔚焉言之無文行之不逺楚人之俗剽而疾險而激其草木也秀而麗其君子也炳而潔故因其俗以諷之使至於道也君子之文因麗以導其質故味而逾實故雖麗而無害也小人之文反質以行其麗故味而逾虛故雖質而無救也此深淺之分厚薄之别焉可同也籀文􅜆司為辭司者主於理亂也應和難詰首尾以終其事曰論論倫也同歸而殊塗一致而百慮語各有倫而同歸於理也倫理也著於心成已之性曰志志有所牽曰思思絲也猶物之牽挽也於文心囱為思囱人之頭囱信也囱通氣也思有所圖曰慮慮猶縷也如絲之有縷以成文也故於文思虍為慮虍慮聲也憂者愁也傳曰痛心疾首詩曰維憂用老故於文心頁為􅔣首也心㥑則髮白顔回思慮聖道心㥑而髮白謝莊繫刑一宿髮盡白㥑生也今文㥑從夂和之利也詩曰布政憂優優和也書曰臯陶邁種德邁行也行布其德也和氣亦行也和緩行遲故從夂夂夂者足有物曳之行遲患憂之深也有患必憂患之言貫也貫於心也憂者幽也子州支父有幽憂之病未任治天下是也憂之來幽幽然沉滯也患者慣也急慣人心也語曰擇福莫若重擇患莫若輕患關人心故於文心上串為患也重患也傳曰猶有患焉不早除之至於重纍乃為患也魏武帝詩曰明明如月何時可掇憂從中來不可斷絶此憂患也古文心臼臼為患􅍫挶人心也又心門丱為患門患之聲也丱者慣也關者心也洗心曰齋齋戒潔也於文示齊為齋示明也祇也齊者萬物之潔齊也籕文齋從省禱也齋心以禱也子曰丘之禱久矣能潔其心神據之也子所慎齋戰疾也防患曰戒戒警也書曰警戒無虞君子思患而豫防之莊子曰寇莫􅉃於隂陽而鏌釾為下義者金也金兵戈也以義斷情欲為戒若藥家之用甘草為國老大黃為將軍是也故於文持戈為戒諌者間也君所謂否而有可焉臣獻其可以間隔之也猶白黑相間以成文也故於文言東為諌東者分別也能分別善惡以陳於君也太史克之對魯宣公是也惟聖人能納諌宣公中庸以下里克能諌以止之此諌之善者也諂者陷也陷君於惡也始則陷於人陷於人者必及其身故於文言臽為諂臽陷也又言閻為讇閻諂聲也諛者言如物之腴也腴鳥獸腹之甘美者也諛者必以甘言入於君而巳故莊子謂之導諛焉諂言求進而有陷於人也故於文言臾為諛臾諛聲也譛者訴也論語公伯寮訴子路於季孫誣告之也意主於害人者也譛者簮也若簮之箸物切至也故易曰勿疑朋盍簮蓋合也簮也簮猶譛也故於文言替為譛佞者巧諂髙才也祝鮀之佞有才者也有小才不以正道近其君曰佞也詩曰媚兹一人應侯順德媚愛其君惟順德而已小慈大慈賊也老子謂陽朱曰彼其小言盡人毒也佞者女子之仁故於文女仁為佞恩者因也有所因也故於文心因為恩因亦聲也讎者怨也害起於微也易曰亂之興也則言語以為階詩曰亂之又生君子信讒言必讒也故於文言雔為讎雔者鳥之雙也人之讎怨不顧禮義者則如禽鳥之為也兩怒而有言在其間必溢惡之言也若禽鳥之聲也詭蠡之對公孫雄曰吾雖靦然人面其猶鳥獸孰知是諓諓者乎雔怨之謂也雔亦讎之聲也善者吉也美也繕也若物之已繕治者也文子曰聽善言便計愚者知恱之故於文言羊為善羊者美物也語曰爾愛其羊傳曰人之欲善誰不如我易曰出其言善千里之外應之故善從二言齊桓公謂畞丘之鄉人曰至德不孤善言必三故古善亦或從三言篆文善從一言一一也吉也傳曰一言而善也否者不也否也心有不可口必言之故於文口不為否説文解字繫傳三十五
