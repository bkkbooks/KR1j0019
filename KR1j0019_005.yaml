body:
  text: 文二重三語已詞也從口象气下引之形凡只之属皆從只臣鍇按詩曰母也天只不諒人只是只為語已詞也气下引也今試言只則气下引也真彼反聲也從只甹聲讀若馨顯丁反文二言之訥也從口内聲凡㕯之属皆從㕯臣鍇曰論語云其言㕯㕯然如不出諸其口也女滑反以錐有所穿也從矛㕯聲一曰满有所出臣鍇曰满有所出名汲井之綆為繘義近扵此與必反從外知内也從㕯章省聲臣鍇曰商略之也以内知外言不出也式陽反古文啇亦古文同籕文啇文三重三曲也從口丩聲凡句之属皆從句梗尤反止也從句手句亦聲臣鍇曰物去手䏻止之也卷于反曲竹捕魚笱從竹句句亦聲臣鍇曰爾雅嫠婦之笱謂之罶注謂以簿為魚笱毛詩傳曰曲梁也臣鍇以為為隄入水遏魚為梁此以竹為梁曲之也講吼反曲也従金句句亦聲臣鍇曰古兵有鉤有鑲引来曰鉤推去曰鑲故晏嬰曰曲兵将鉤之呉鉤也梗尤反文四相糾繚也一曰瓜瓠結丩起象形凡丩之属皆從丩臣鍇曰瓜蔓接續生為糾也朻木字從此飢酬反艸之相丩者從茻丩丩亦聲臣鍇曰藥有秦今古本作本當作此字飢酬反繩三合也從系丩聲臣鍇曰謂三股繩史曰禍福若糾纒也緊黝反文三故也從十口識前言者也凡古之属皆從古臣鍇曰古者無文字口相傳也昆覩反古文古大逺也從古叚聲臣鍇按詩曰錫爾純嘏大逺之福也格雅反文二重一數之具也一為東西丨為南北則四方中央僃矣凡十之属皆從十常入反十尺也從手持十臣鍇曰孔子云禹聲為律身為度故從手漢書律暦志竹為引一引一丈置敞反十百也從十人聲七先反響布也徔十䏌聲臣鍇按揚雄甘泉賦曰肸響豊融懿懿芬芬又呉都賦曰肸響布冩十者㪚扵四方也八者分也希乞反卙卙盛也従十甚聲汝南名蠶盛曰卙臣鍇按詩曰冝爾子孫蟄蟄于蟄衆也此卙義近之也姊入反大通也從十專專布也亦聲臣鍇曰十者成數本泊反材十人也從十力聲郎或反二十并也古文省多臣鍇曰自古来書二十字從省多併為此字也而集反詞之矣從十咠聲臣鍇曰此詩云詞之矣民之繹矣今詩緝字詩和集也故従十牆揖反文九三十并也古文省凡􅧁之属皆従卉臣鍇曰義與廿同速沓反三十年爲一世從卅而曵長之亦取其聲臣鍇曰大率三十世道一草尚書曰既歴三紀世變風移欲其相續故引長之詩𬒮反文二直言曰言論難曰語從口䇂聲几言之属皆從言臣鍇曰爾雅釋言注云直言也詩曰于時言言凡言者謂直言無所指引借譬也疑袁反聲也從言賏聲臣鍇按張衡思玄賦曰鳴玉鑾之譻譻恩行反欬也從言殸聲臣鍇按荘子曰聞謦欬之聲去梃反論也徔言語聲臣鍇按詩曰于時語語論難曰語也疑舉反語也從言炎聲臣鍇曰談者和懌而恱言之故公羊傳曰以爲羙談杜南反報也從言胃聲臣鍇曰謂之是報之也于貴反信也從言京聲力状反致言也從言先先亦聲詩曰螽斯羽詵詵兮臣鍇曰先致其言也所臻反謁也從言青聲臣鍇曰梁陳前官有奉朝請謂徒奉朝謁也士并反謁白也從言曷聲臣鍇按春秋左傳曰謁諸王是白扵王也憂歇反聽言從言午聲欣臣反譍也從言若聲臣鍇按爾雅注引禮男唯女俞是古者應對之辭有節文按古者大夫多言唯而衞出公及諸侯應其臣下皆曰諾又南朝有鳯尾諾爲尊者之言也能作反以言對也從言痽聲於證切辯也従言者聲臣鍇曰别異之辭也故曰能恱諸心又爾雅前弇諸果後弇諸獵掌扵反志也從言寺聲式其反古文詩省驗也從言韱聲臣鍇曰凡䜟緯皆言將来之驗也測浸反誦也從風言聲臣鍇按諸經注背文曰諷付宋反諷也從言甬聲臣鍇以為臨文為誦誦從也以口從其文也似共反誦書也從言賣聲臣鍇曰讀猶瀆也若四瀆之引水也馳谷反快也從言中聲臣鍇曰從此言貫中故為快會意休色反說教也從言川聲臣鍇曰訓者順其意以訓之也故太宗皇帝敎誡諸王見其立扵木則謂之曰汝知之乎此木雖曲從繩則正是也吁問反曉教也從言每聲臣鍇曰丁寜誨之若决晦昧也詩曰誨爾諪諪虎配反專教也從言巽聲此㳂反諭也從言辟聲臣鍇曰譬猶匹也匹而諭之也匹寄反徐語也從言原聲孟子曰故謜謜而来臣鍇曰謜謜愿也魚怨反早知也從言央聲隱餉反告也從言俞聲臣鍇曰及其未悟告之使暁若先諭之也玄遇反辨論也古文以為頗字從言皮聲臣鍇按詩序譣詖私謁之心孟子曰詖辭知其所蔽筆詈反告暁之熟也從言􅾱聲讀若庉臣鍇按詩曰誨爾諄諄主均反論訟也傳曰詻詻孔子容從言各聲臣鍇按周禮注曰軍旅之容儼儼詻詻顔各反和恱而諍也從言門聲臣鍇按論語曰冉有誾誾如也春秋左傳曰齊師伐魯季孫謂冉有曰若之何有曰一子守二子從公又曰當子之身齊人伐魯而不能戰子之耻也又對叔孫曰君子有逺慮小人何知皆和恱之諍也言陳反慮難曰謀從言某聲莫浮反古文謀亦古文臣鍇曰古文言字也議謀也従言莫聲虞書曰各繇謨臣鍇曰慮一事畫一計為謀汎議将定其謀曰謨大禹臯陶皆汎謨也門胡反古文謨從口汎謀曰訪從言方聲臣鍇曰此言汎謀謂廣問扵人也故春秋左傳曰王使訪申叔夫妄反聚謀也從言取聲臣鍇按詩曰周爰諮諏臣又按國語胥臣曰文王詢扵八虞而咨于二􅉑度扵閎夭而謀扵南宫諏扵蔡原而訪扵辛尹雖一時之文辭有所互出然大略亦盡如前觧煎吁反議也徔言侖聲臣鍇曰通論詳矣盧屯反語也從言義聲臣鍇曰定事之宜也魚智反平議也從言丁聲他頂反審議也從言羊聲似羊反理也從言是聲善𥿄反審也從言帝聲的替反常也一曰知也從言戠聲申力反問也從言卂聲思震反古文訊從鹵言微親察也從言祭省聲臣鍇曰論語云察言而觀色是也又黄帝每問事先問馬次及牛以微言察其情也測戞反慎也從言堇聲臣鍇按論語曰言惟謹爾己忍反厚也從言乃聲而氷反誠諦也從言甚聲詩曰天難諶斯臣鍇曰其言審必然也是任反誠也從人言思震反古文信省也古文信臣鍇曰三字皆會意也燕伐東齊謂信訦也從言冘聲臣鍇曰言可信也是吟反信也從言成聲示征反敕也從言戒聲苟差反告也從言告聲臣鍇曰以文言告暁之也故曰有文告之辞古到反古文誥告也從言從召召亦聲之紹切約束也從言折聲臣鍇曰與之為約誓也㤗誓曰予克受非予武惟朕文考無罪受克予非朕文考有罪惟予小子無良是爲約誓也時制反問也周書曰勿以譣人從言僉聲臣鍇曰譣猶險也先廉反訓故言也從言古聲詩詁訓臣鍇按爾雅謂言有古今也會意昆覩反臣盡力之羙詩曰藹藹王多吉士從言葛聲臣鍇按爾雅注梧桐茂實賢士衆地極化臣竭忠也思柰反餔旋促也從言束聲臣鍇曰言周旋促速也孫卜反知也從言胥聲臣鍇按周禮注有才智之稱也仙吕反諌也從言正聲讀若正月臣鍇按孔子曰諌有五然則証爲直諌也真性反深諌也從言念聲春秋傳曰辛伯諗周桓公臣鍇曰㩀辛伯之言簡而深故知爲深諌也施甚反用也從言式聲虞書曰明試以功臣鍇曰論語孔子云吾不試故藝也失吏反和也從言咸聲周書曰丕諴于小民侯彡反証也從言東聲溝鴈反試也從言果聲臣鍇按漢書云考課是也苦和反徒歌從言肉臣鍇按今說文本皆言徒也當言徒歌必脫誤也下云從言肉亦誤也延朝反具也從言全聲臣鍇曰其記言也七㳂反憘也從言斤聲臣鍇曰喜形扵言也希斤反說釋也一曰談說従言兊聲臣鍇曰說之亦使恱懌也通論詳矣失雪反㑹也筭也從言十臣鍇曰十者總成數會意己惠反詥也從言皆聲㾗皆反諧也從言合聲臣鍇按詥放肆說佞多合之言故陸機文賦曰務諧詥與妖治此少亦字後閤反和也從言周聲笛遼反合會善言也從言昏聲傳曰告之詁言户敗反籕文䛡從言㑹臣鍇曰會意也諈諉累也従言垂聲臣鍇曰謂不能自决而以属累扵人也竹至反累也從言委聲臣鍇按漢胡建擅誅監軍従史云執事不諉上是也女至反戒也從言敬敬亦聲臣鍇按禮曰先鼓以敬戒己皿反静語也從言聲一曰無聲臣鍇曰謐猶宻也羙弼反敬也從言兼聲臣鍇曰謙猶嗛也輕嫌反人所冝也從言宜亦聲也臣鍇按史記仁義字亦或作此魚智反大言也從言羽聲臣鍇按揚雄曰奢麗誇詡是也訓柱反善言從言戔聲一曰謔也臣鍇按國語范蠡曰吾安知是諓諓者乎寂衍反嘉善也從言我聲詩曰誐以謐我偶和反共也周書曰在后之詷一曰譀從言同聲臣鍇曰按今尚書作在後之侗也田風反施陳也從言殳使人也臣鍇曰殳所以驅遣指使人也此會意施子反救視召許也從言乎聲虎烏反􅨜謼也從言虖聲臣鍇曰山海經云鳥其鳴自謼謂自言其名也荒故反傳言也從言彦聲擬線反相迎也周禮曰諸侯有卿訝也從言牙聲臣鍇曰周禮使將至使卿訝謂以言辭迎而勞之也顏咤反訝或從辵候至也從言㫖聲臣鍇曰徑候而詣之也逆桂反和解也從言冓聲臣鍇曰古人言講觧猶和解也于項反迻書也從言朕聲臣鍇曰謂移冩之也從朋反頓也從言刃聲論語曰其言也訒臣鍇曰頓者多頓躓也爾吝反言難也從言内聲奴嗢反猶譍也從言雔聲臣鍇按詩曰無言不讎通論詳矣市柔反謯娽也從言虘聲側巴反待也從言伿聲讀若䭆臣鍇曰此亦與徯字義相通也亦啓反痛呼也從言敫聲臣鍇曰顏之推家訓引此見弔反恚呼也從言尭聲臣鍇曰聲高噪獰也女交反小聲也從言熒省聲詩曰謍謍音蠅臣鍇曰譻譻以鸞聲言之謍謍以蠅聲言之其異可察矣玄經反諎大聲從言昔聲讀若笮臣鍇按史記楮少孫曰漢武帝云諸夫姊何蔵之深也此義也其文如下字滓白反諎或從口臣鍇按史記曰晉鄙嚄啫宿將是也擾也從言喿聲臣鍇曰前史云師皷譟是也斯奥反謟也從言臾聲臣鍇曰此下三字通論詳矣羊朱反䛕也從言閻聲敕奄反讇或從函詐也從言爰聲臣鍇按詩曰有斐君子終不可諼兮吁袁反不肖人也從言敖聲一曰哭不止悲聲謷謷臣鍇曰不肖人其言煩苛也顏叨反誘也從言术聲臣鍇按賈誼鵩賦曰怵迫之徒兮或趨西東本騃也從言疑聲臣鍇曰言多凝也今人作儗五介反相誤也從言哭聲臣鍇曰相䧟誤也俱化反愬也從言替聲側賃反謗也從言山聲史患反誹也從言㡬聲居希反加也從言巫聲臣鍇曰以無爲有也文區反謗也從言非聲斧尾反詶也從言夀聲讀若醻周書曰無或譸張幻臣鍇曰此言語獻譸也譸張誑也則音輈陟求反譸也從言州聲市柔反詶也從言且聲即趣反詶也從言由聲長又反離别也從言多聲讀若論語跢予之足周景王作洛陽誃臺臣鍇按誃臺陸雲與兄書曰曹公所爲屋拆其謻塘不可壊直以斧斫之而已又劉孝綽上虞卿亭觀濤詩曰秋江涷甫絶反影照謻塘爾雅注云堂樓邉小屋為䔟今云䔟厨連觀臣鍇以為謻臺猶别館也陸雲所言即謂屋木相連接䖏也孝綽所言即别館也爾雅所言即連屋也此葢小屋連接大屋觀其来則連扵大屋體其實則别自為一區䖏也尺婢反亂也從言孛聲臣鍇曰辭气教也歩咄反籕文誖從二或臣鍇曰太玄曰天違人違而天下之事誖矣上下反覆皆或相成故為誖也誖或從心亂也一曰治也一曰不絶從言絲形臣鍇按春秋左傳祝鮀曰會同難嘖有繁言莫之治也繁亂也吕貟反古文􅒋臣鍇曰象絲亂而爪治之爪手反也謬也從言吴聲頑故反誤也從言圭聲臣鍇曰桂也古賣反可惡之辭從言矣聲一曰誒然春秋傳言誒誒出出臣鍇曰可畏惡矣今春秋左傳作誖假借軒其反痛也從言喜聲臣鍇曰痛而呼之言也軒其反瞻气滿聲在人譀也從言夸聲坤瓜反詞誕也從言延聲臣鍇曰又妄為大言也又大也特坦反籀文誕省正譀也從言萬聲臣鍇曰言過也謀敗反戯也從言虐聲詩曰善戲謔兮虗約反狠戾也從言艮聲臣鍇曰書狠戾也俟懇反䜋也從言工聲詩曰蟊賊内訌臣鍇按爾雅注云潰散也貢聦反聲也從言歳聲詩曰有其聲虎外反譁也從言雚聲臣鍇曰今人多作喧呼官反疾也從言咼聲呼恠反譟也從言魋聲徒崔反大呼也從言斗聲春秋傳曰或訆于宋太廟臣鍇按山海經說鳥其鳴其訆字如此見弔反號也從言虎臣鍇曰今人通作號遂無作此字者也行髙反讙也從言華聲忽奢反妄言也從言雩聲臣鍇曰訴子路扵季孫桑祚反訴或從言朔訴或從朔心謫問也從言遣聲喫絹反罰也從言啻聲臣鍇曰謫猶摘也張伯反數也一曰相譲也從言耑聲讀若專赤戀反相責譲從言㐮聲爾亮反嬈嬈也從言焦聲讀若嚼菽要反古文譙從言肖周書曰王亦未敢誚公數諌也從言朿聲臣鍇曰諷刺也七智反譲也從言卒聲國語曰䛨申胥臣鍇按國語曰呉王還自伐齊乃誶申胥胥自殺也星醉反問也從言吉聲輕質反責望也從言望聲臣鍇按史記張耳傳曰陳餘固望耳本此字也聞誑反責也從言危聲句委反告也從言登聲酌應反誥詘也一曰屈襞從言出聲臣鍇按周易曰失其守者其辭屈當作此誳字也區欻反誳或從屈尉也從言夗聲迂勸反知處告言之從言冋聲臣鍇按史記淮南王安使其女為中詗長安注詗詗候也即此義翾併反流言也從言夐聲古縣反荷也從言氐聲一曰訶的未反何也從言佳聲臣鍇按史記賈詛過秦曰陳利兵而誰何苛細也謂細詰間之市佳反飾也從言革聲讀若戒一曰更溝厄反詆讕也從言闌聲臣鍇曰以語防闌之也勒飡反讕或從問視也從言㐱聲臣鍇按史記倉公傳曰診脉言視脉也遅鎮反悲聲也從言斯省聲臣鍇曰今謂馬悲鳴為嘶也欺低反罪也從言尤聲周書曰報以庻訧臣鍇曰怨言扵言也焉秋反討也從言朱聲輟湏反治也從言寸臣鍇曰寸法也奉辭伐罪故從言此㑹意他老反悉也從言音聲恩甘反禱也累功徳以求福論語云讄曰禱爾于上下神祗從言畾聲臣鍇按尚書金縢之辭是也栁水反讄或從纍行之迹也從言兮皿闕臣鍇曰以行易其名也臣以為皿非聲子聲也疑脫誤常利反謚也從言耒聲桞水反誋也從言韋聲詡尉反耻也從言奚聲亦啓反謑或從奊謑詬耻也從言后聲臣鍇曰春秋傳曰吾不忍其詬是也呵透反詬或從句軍中反間也從言枼聲田扶反軍中約讀若心中滿該從言亥聲臣鍇按字書又備也荷孩反傳譯四夷之言者從言睪聲移尺反疾言也讀若沓從三言臣鍇曰吴都賦颯歰伋譶是也遺合反毁也從言㫄聲補盎反産使輿三十人遷里祈之柩知與又彌賤也臺猶跆在人下之稱也若所跆踐又益細也牧牛又卑扵馬也盤沃反古文従臣賦事也從菐從八八分之也八亦聲讀若頒一曰讀若非臣鍇曰此古頒字布山反文三重一竦手也從夕又凡􅦁之属皆從廾臣鍇曰併舉之也短竦反揚雄說從兩手承也從手從聲臣鍇曰丰音封附恐反翊也從從卩從山山髙奉承之義臣鍇曰㞯髙之状也故爲山髙隅爲山㞯視登反取奐也一曰大從廾夐省聲臣鍇曰羙㢤奐焉奐大也呼筭反葢也從合聲更堪反古文弇引給也一從睪聲移尺反舉也從由聲春秋傳曰晉人或以廣墜楚人卑之黄顥說廣車䧟楚人為舉之杜林以為騏驎字臣鍇曰由音菑今春秋左傳楚人惎之作惎杜預注惎教也健侍反舉也從巳聲虞書曰嶽曰异㢤余吏反玩也從王臣鍇曰詩曰載弄之璋璋玉也此㑹意魯棟反两手盛也従聲融六反摶飯也從釆聲釆古文辦字讀若書卷臣鍇曰卷眷從此俱辦反持弩拊從肉讀若逵臣鍇曰肉非聲疑脱誤春秋左傳曰王孫燕奔頯黄氏頯字從此權雖反警也從戈持以戒不虞臣鍇曰尚書曰儆戒無虞會意苟差反械也從持斤并力之貌臣鍇曰㑹意彼平反古文兵從人千籕文兵慤也從龍聲臣鍇曰左傳鄭子産曰苟有位扵朝無有不龔慤當作此龔矩重反圍棊也從亦聲論語曰不有博弈者乎臣鍇曰春秋左氏傳云弈者舉棊不定不勝其偶移尺反共置也從具省古以貝為貨臣鍇曰會意健芋反文十七重四引也從反卄凡􅦁之属皆從􅦁臣鍇曰引者自外引入也故反手向外引之潘蠻反􅦁或從手樊臣鍇曰此今人書攀字鷙不行也從􅦁棥亦聲臣鍇曰鷙猶縶也鷹隼之属見籠不得出以左右攀引外也復喧反樊也從􅦁􅒋聲臣鍇曰義同上吕員反文三重同也從廿廾凡共之属皆從共臣鍇曰廿音入二十共也此會意具縦反古文共臣鍇曰兩手共也給也從共龍聲臣鍇按春秋左傳曰其或不龔邦有常刑短重反文二重一分也從廾卑卑予也凡異之属皆從異臣鍇曰卑音俾將𣣔予物先分異之也禮曰賜君子小人不同日也會意余吏反分物得増益曰戴從異􅥘聲臣鍇曰是分物得益也史陳平分社肉曰使平宰天下如分此肉矣衆喜而戴之也會意都愛反籕文戴文二重一共舉也從曰廾凡舁之属皆從舁讀若余臣鍇曰舁用力也兩手及爪皆用也以虗反升高從舁囟聲臣鍇曰囟音信親延反或從卩臣鍇曰卩亦髙反古文黨與也從舁与臣鍇曰春秋左傳曰伯有聞子皮之甲不豫攻己也喜曰子皮與我矣會意尹汝反古文與起也從􅺢同同力也臣鍇曰周武王曰予有亂臣十人同心同徳周所以興也會意香澄反文四重三說文解字通釋卷第五
