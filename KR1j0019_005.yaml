front:
  text: 谷或如此谷或從豦肉舌貌象形從谷省聲臣鍇曰西谷省也人告出西西然靈光殿賦曰玄熊西舕也他暗反古文西讀若三年導服之導一曰竹上皮讀若沾一曰讀若誓弼字從此臣鍇曰古文從即谷之省三年禫服古借導字弼字中即此字也
  hash: sha256:24e5fcf77a654af711e56fdea566ff1c1dfd157f752389593ab134622c02785a
