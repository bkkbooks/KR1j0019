front:
  text: 谷或如此谷或從豦肉舌貌象形從谷省聲臣鍇曰㐁谷省也人告出㐁㐁然靈光殿賦曰玄熊㐁舕也他暗反古文㐁讀若三年導服之導一曰竹上皮讀若沾一曰讀若誓弼字從此臣鍇曰古文從即谷之省三年禫服古借導字弼字中即此字也
  hash: sha256:de12efda37b3f815b485aeef112ea948936483172e28bfa339a8252f9423aa97
  markers:
