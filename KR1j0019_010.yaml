body:
  text: 繫傳十文林郎守祕書省校書郎臣徐鍇傳釋朝散大夫行祕書省校書郎臣朱翺反切三十二部二百二十四文重六十八有所絶止丨而識之也凡丨之屬皆從丨臣鍇曰丨猶點柱之柱若漢武讀書止輒乙其處也輟乳反鐙中火主也從象形從丨丨亦聲臣鍇曰即脂燭也鐙瓦豆也郭璞曰即膏鐙古𥘉以人執燭後易之以鐙物為主令人作炷蘭膏明燭華燈拙庾反相與語唾而不受也從否從丨否亦聲臣鍇曰唾而不受止其言也丨柱止也故從丨棓部倍陪菩箁從此他豆反咅或從豆欠文三重一巴越之赤右也象采丹井丹形也凡丹之屬皆從丹臣鍇曰史記曰寡婦清其先得丹穴而冨也穴即井也荀卿曰南有曽青丹子山海經有曰丹黑丹丹以赤為主黑白皆丹之類非正丹也得干反古文丹亦古文丹善丹也從丹蒦聲周書曰惟其􅖏丹雘讀若同臣鍇案山海經衡山出丹雘鳥郭反丹飾也從丹彡彡其畫彡亦聲臣鍇曰尚書有彤几杜紅反文三重二東方色也木生火從生丹丹青之信言必然凡青之屬皆從青臣鍇曰凡逺視之明莫若丹與青黑則昧矣阮籍詠懷詩曰丹青著盟誓言若丹青之分明也猶詩云有如皎日倉經反古文青審也從青爭聲臣鍇曰丹青明審也又音清寂逞反文二重一八家一井象構形􅜍象也古者伯益𥘉作井凡井之屬皆從井臣鍇曰井垣也周禮謂之井樹古者以瓶甕汲故易曰繘井羸其瓶莊子漢隂文人抱甕而出準南子曰益作井而籠登天言知鑿之不已也即頃反鍇曰春秋傳曰日有食之既盡食之也居意反飯剛柔不調相著從皀坰聲讀若適失易反文四以秬釀鬱草芬芳攸服以降神也從凵凵器也中象米匕所以扱之易曰不喪匙鬯凡鬯之屬皆從鬯臣鍇曰秬黑黍也服服事也周人尚臭灌用鬱鬯乂象中秬反鬱形丑向反芳草也十葉為貫百廾貫築以煮之為鬱從曰坰缶鬯彡其飾也一曰鬱鬯百草之華逺方鬱人所貢芳草合釀之以降神鬱今鬱材郡臣鍇曰築春也周禮宗伯屬鬱人掌和鬱以實彛注鬱為草若蘭也彡彛之飾也古或飾以羽故逸詩曰羽觴隨波迂拂反禮器也象爵之形中有鬯酒又持之也所以飲器象爵者取其鳴節節足足也臣鍇曰小象爵頭􅹆其盛酒處􅛣其尾柄也即約反古文爵如此象形臣鍇曰爵正居形其後尾坰其翅也黑黍也一桴二米以釀從鬯矩聲臣鍇曰春秋左傳黑牡秬黍以享司寒分伹作秬求許反或從禾列也從鬯吏聲讀若迅臣鍇曰􅤩猶纚也羅列意色厠反文五重二一米也從皀今或説亽皀也凡食之屬皆從食讀若粒臣鍇曰亽音集食食也卞食字音飯神隻反滫飯也從食聲臣鍇曰音詩曰泂酌彼行潦挹彼注兹可以饙饎水滫之也翻云反臣次立按説文徐鉉云非聲疑字之悮或從賁或從飯氣蒸也從食留聲良秀反書峙乃餱粻臣鍇曰乾餱以愆今人謂飯乾為餱何溝反餱也從食非聲陳楚之間相謁而食麥飯曰餥斧尾反酒食也從食喜聲詩曰可以饙饎昌意反饎或從臣臣鍇曰周禮有人字作此饎或從米臣鍇曰商頌曰大糦是承作此字具食也從食算聲臣鍇按漢書饌堂或如此助箭反饌或從巽供養也從食羊聲以像反古文養食也從食反聲服萬反雜飯也從食丑聲女有反糧也從食人慈例反以羹澆飯也從食贊聲臣鍇曰今人云饡飯也箭鴈反畫食也從食象聲式文反􅴱或從餔也從夕食素昆反日加申時食也從食甫聲不吾反籕文餔從皿浦聲臣鍇曰皿所以食也其香臣鍇曰飶猶苾苾頻必反燕食也從食芙聲詩曰飲酒之臣鍇曰詩曰如食冝於橡反猒也從食包聲輔巧反古文飽從聲臣鍇曰音保亦古文飽從卯聲猒也從食肙聲烏縣反饒飽也從食堯聲耳焦反饒也從食余聲臣鍇曰老子曰餘食贅行以虛反食臭也從食艾聲爾雅曰饅請之喙海艾反送去也從食戔聲詩曰顯父餞之臣鍇曰以酒食送也餞猶羡也引也寂羡反野饋曰餫從食軍聲臣鍇曰春秋左傳宣伯餫諸穀于問反客舍也從食官聲周禮五十里有市有館館有積以待朝聘之客古翰反貪也從食號聲偷勞反籕文叨從號省俗叨從口刀聲貪也從食鬒聲春秋傳是謂叨飻聽切反飯傷熱也從食歲聲遷廢反飯傷溼也從食一聲乙器反飯餲也從食曷聲論語曰食饐而餲厄介反榖不熟為飢從食幾聲居希反𬞞不熟為饉從食堇聲其吝反飢也從食厄聲讀若楚人言恚人晏革反飢也從食委聲一曰魚敗曰餧也那漼反餓也從食几聲居希反飢也從食我聲岸播反吳人謂祭曰餽從食鬼鬼亦聲矩遂反祭酹也從食叕聲誅稅反小餟也從食兌聲輸𬒮反馬食榖多氣流四下也從食夌聲輦孕反食馬榖也從食末聲臣鍇按詩曰芻之秣之借秣字門撥反文六十二重十九三合也從入一象三合之形凡集之屬皆從集讀若集牆揖反合口也從集從口臣鍇曰集口合口也會意後閣反皆也從集從吅從從虞書曰僉曰伯夷臣鍇曰僉曰衆共言之也集集也從相從也會意七占反思也從集從册臣鍇曰思思理也册册書也集集册書也會意吕辰反籕文侖是時也從集􅗵􅗵古文及臣鍇曰集􅗵皆今也會意居斟反市居曰舍從集􅋄象屋也口象築也臣鍇曰集衆集也􅋄立柱栭梲之形口音圍會意詩夜反文六重一合也從集從曽省曽益世凡會之屬皆從會户兊反內也象從上俱下也凡入之屬皆從入臣鍇曰從土俱下入而散也隂陽氣入地則流散而集反入也從坰自外而入也臣鍇曰坰音垌會意能未反入山之深也從山從入闕臣鍇曰會意助吟反市穀也從入䊮臣鍇曰春秋左傳請糴於宋衛陳鄭田溺反完也從入工臣鍇曰工所為也會意族延反篆文同從玉曰全臣鍇按周禮玉人之事圭天子用全注純用王也會意古文同二入也兩從此闕里養反文六重二瓦器所以盛酒漿秦人鼓之以節歌象形凡缶之屬皆從缶臣鍇曰史記黽池之會藺相如進盆缶曰竊謂鐙為釭本作此字侯邦反瓦器也從缶或聲于逼反瓦器也從缶薦聲失見反瓦器也從缶肉聲臣鍇曰䔄䍃從此延秋反瓦器也從缶霝聲連丁反缺也從缶占聲丁念反器破也從缶決省聲傾穴反裂也從缶呼聲缶燒菩裂也臣鍇曰爾雅翥醜罅注罅剖背而生呼音呼吼迓反器中空也從缶殸聲詩云瓶之罄矣苦定反器中盡也從缶􅌛聲溪細反受錢器也從缶后聲古以瓦今以竹臣鍇曰漢書趙廣漢傳曰投缿謂入而不能出之器也限蚌反文二十一重一弓弩矢也從入象鏑括羽之形古者夷牟𥘉作矢凡矢之屬皆從矢臣鍇按吕氏春秋夷羿作弓弓矢當同時􅕶象括羽周禮矢人謂枉矢潔矢利矢鍭矢矰矢茀矢恆矢庳矢失止反弓弩發於身而中於逺從矢身臣鍇曰射者身平躰正然后能中也神隻反篆文射從寸寸法度也亦手也楺箭箱也從矢喬聲臣鍇曰矯以矢之曲也故曰矯枉梁庾肩吾詩曰騰㣪疑矯箭己少反隿射矢也從矢曽聲臣鍇曰矰矢亦曰田矢也前增反春饗所射矦也從人從􅛣象張矢在其下天子射熊虎豹服猛也諸侯射熊豕虎大夫射麋惑也士射鹿為田除害也其祝曰母若不寧侯不朝于王所故抗而射汝也臣鍇曰周禮梓人為侯張皮侯而樓鵠則春以功張五采之侯則逺國屬張獸侯則王以燕息注天子以九為節侯九十弓弓二寸侯以布為之鵠以度又曰王大射則供虎侯熊侯豹侯諸侯供熊侯豹侯卿大夫供麋侯麋示討迷惑也儀禮曰天子熊侯白質諸侯麋侯赤質大夫布畫虎豹士布畫鹿豕祭侯之禮以酒脯醢其辭曰惟若寧侯母惑若不寧侯不屬于王所故抗而射汝強飲強食詒爾曾孫諸侯百福若汝也寧安也或有也屬朝會也抗舉也河溝反古文矦傷也從矢易聲式陽反有所長短以矢為正從矢豆聲臣鍇曰若以弓為度也都𣢾反况也詞也從矢引省聲從矢取詞之所之如矢也臣鍇按尚書曰矧乃外庶子訓人諸侯族乃况如矢之疾也矢引反詞也從口矢臣鍇曰凡知理之速如矢之疾也會意珍移反語已詞也從矢以聲臣鍇曰矢氣直疾今試言矣則口出氣直而疾也會意延耳反文十重二崇也象臺觀高之形從坰口與倉舍同意凡高之屬皆從高臣鍇按易曰崇效天卑法地崇高口音韋與倉舍同意謂皆室屋垣墻周匝之意家豪反小堂也從高省坰聲去挺反高或從廣頃民所安定也亭有樓從高省丁聲臣鍇按漢書百官表曰大率十里一亭十亭一鄉天子亭凡二萬九千六百三十五也曰丁反京兆杜陵亭也從高省乇聲臣鍇曰按湯都亳杜預釋例在梁國蒙澤縣比薄城中有湯冡凡三亳也盆鄂反文四重一邑外謂之郊郊外謂之野野外謂之林林外謂之坰象逺界也凡坰之屬皆從坰臣鍇曰此皆爾雅之言也注云假令百里之國五十里之界界各十里之界禮注王者近郊五十里逺郊百里又引司馬法王國百里為郊二百里州三百里野四百里縣五百里都眀爾雅所言諸侯之國也又周禮載師職國地無征則地諸侯之邑也圜㕓二十而稅一則近郊也近郊十一則野也逺郊二十而三則林也稍旬縣都皆無過十二則坰也居屏反古又坰象國邑從口也臣鍇曰從此坰或從土買賣所之也市有垣從坰了象物相及也之者聲了古文及也臣鍇曰會意辰止反淫淫行貌也從人出坰臣鍇曰九竒字人也會意也沈妉莐耽抌從此移今反中央也從大在坰之內大人也與旁同意一曰久臣鍇曰凡大字皆象人之正立也故央字從大取其正中也旁字象四出故曰與旁同會意殷強反高至也從隹上欲出坰易曰夫乾隺然臣鍇曰隹鳥也出外也隺然高簡故也胡僕反文五重二度也民所度居也從回象城之重兩亭相對也或但從口凡之屬皆從臣鍇曰重城也城外亭也昆霍反缺也古者城闕其南方謂之從史聲讀若拔物為夾引也傾雪反文二聲臣鍇曰又厚也多但反嗇也從口廩廩受也臣鍇曰口音韋周韋周干也入皆受之廩而復口之為嗇吝積而不散也兵几反古文啚如此文四重二愛澀也從來廩聲來者廩而藏之故田夫謂之􅞋夫一曰棘省聲凡􅞋之屬皆從􅞋臣鍇曰音瀝漢百官表卿有秋􅞋夫職聽訟收賦稅也會意踈憶反古文􅞋從田垣蔽也從􅞋爿聲臣鍇曰亦當言牀省牆臤愛􅞋自護也賤忘反籕文牆從二禾籕文亦從二來文二重三周所受瑞麥來牟一來二縫象其芒來之形天所來也故為行來之來詩曰貽我來牟凡來之屬皆從來臣鍇曰今小麥也婁才反詩曰不不來從來矣聲臣鍇曰此爾雅之言也不可俟是不復來也鉏耳反或從彳文二重一芒榖秋穜厚薶故謂之麥麥金也金王而生火王而死從來有穗者從攴凡麥之屬皆從麥臣鍇曰麥之言幕也理之意久若穗自後屣之也莫獲反來牟麥也從麥牟聲臣鍇曰今大麥也莫浮反牟或從草堅麥也從麥氣聲臣鍇曰麥之磨不碎者舂磨之久而堅老也佷沒反小麥屑之核從麥􅩏聲臣鍇曰核亦屑中滓不細者猶果核也先火反磨麥也從麥􅐔聲一曰搗也殘阤反小麥屑皮也從麥夫聲甫殳反麩或從甫麥末也從麥丐聲彌釧反麥核屑也十斤為三斗從麥啻聲遲夕反煮麥也從麥豐聲讀若馮臣鍇按周禮籩豆之實有麷蕡注曰熬麥曰麷麻曰蕡稻曰白黍曰黑臣鍇以為麷糗類也糗磨之麷不磨也鄭玄云河間以此煮麥賣之名曰麷孚空反麥甘鬻從麥去聲臣鍇按劉熹釋名曰煮麥曰麮麮之言也煮熟壞遣舉反餅􅯅也徒夌殼聲讀若庫袴祿反餅也從麥穴聲呼八反餅也從麥才聲錢來反文十三重三行遲曵夂夂象人兩脛有所屣也凡夂之屬皆從夂斯唯反行夋夋也從夂允聲一曰倨也臣鍇曰夋夋舒遲也故從夂俊浚從此七賔反行故道也從夂畐省聲臣鍇曰易曰七曰來復之義復復從此伐六反越也從夂高大也一曰夌􅯎也臣鍇曰越超越也音陸􅯎音遲麥􅯎漸卑迆也史記曰泰山之高跛牂牧其上􅯎夌故也今作陵遲功􅈾反送詣也從久從至臣鍇曰春秋左傳叔孫如宋致女久齊使來致郈皆送致之也會意陟利反和之行也從夂息聲詩曰布政優優臣鍇曰夂行也和布也古憂心字作息故以憂為和德憂心也不尤反行貌也從夂愛聲臣鍇曰古以愛為慈愛故以此為行貌晏再反行也從夂闕讀若僕臣鍇曰不知元之義也又卜反繇也舞也樂有章從降從章從夂詩曰竷竷舞我臣鍇曰降猶降也今作坎坎假借此會意口糝反堖蓋也象皮包覆堖下有兩臂而夂在下讀若范臣鍇曰漢制乘輿馬金㚇㚇在馬頭上如金華義出此此亦象形明范反中國之人也從夊頁從曰曰兩手夂兩足也臣鍇曰象有威儀文飾備具行紓遲也會意恨具反古文憂治稼畟畟進也從田人從夂詩曰畟畟良耜臣鍇按爾雅畟畟耜也稷從此察色反斂足也鵲鵙醜其飛也㚇從夂凶聲臣鍇曰夂其手足臣鍇曰爾雅之言也稷葼從臣鍇按詩間關車之牽兮所以礙車轂之出也間刮反文三重二草也楚謂之葍秦謂之藑蔓地連華象形從舛亦聲凡舜之屬皆從舜臣鍇曰藑茅也詩曰顔如蕣華在草部失閏反古文舜華榮也從舜生聲讀若皇爾雅曰華也户荒反或從草皇文二重二相背也從舛口聲獸皮之韋可以束枉戾相韋背故偕以為皮韋氏韋之屬皆從韋臣鍇曰皮柔孰為韋韘或從弓弓衣也從韋蜀聲臣鍇按禮月令曰帶以弓韣專玉反弓衣也從韋長聲詩曰交韔二弓丑向反履也從韋假聲臣鍇曰帖後跟也䀶加反履後帖也從韋假聲都伴反𩏇或從糸足衣也從韋蔑聲臣鉉等曰今俗作襪非是丐發反軌裏也從韋専聲普惡反革中辨謂之韏從韋聲臣鍇曰爾雅之言也革中絶謂之辨中斷皮也韏者復半分也音眷區怨反牧東也從韋􅧤聲讀若酋臣鍇按漢書律曆志杕􅒫也即由反􅒫或從要􅒫或從秋手井垣也從韋取其市也倝聲䀶安反文十六重五韋束之次第也從古字之象凡弟之屬皆從弟臣鍇曰積之而順不相戾者莫近於韋故取名於韋束之次弟笛計反古文弟從韋省古文韋聲臣鍇曰丿音曵周人謂兄曰從弟眔臣鍇曰眔音沓沓弟為會意古論反文二重一從後至也象人兩脛後有致之者凡夂之屬皆從夂讀若黹胝雉反相遮要害也從夂丰聲南陽新野有降亭臣鍇曰丰音械手蓋反牾也從夂丰聲讀若縫臣鍇曰牾相逆牾也逢峯從此甫蛩反服也從攴跨相承不敢並也臣鍇曰跨服文也會意侯邦反秦曰市買多得為夃從了從攴益至也詩曰我夃酌彼金罍臣鍇曰今詩作姑盈字從此古乎反跨步也從反攴􅰍從此臣鍇曰步闊步也反屯是不致閡故反攴為跨口瓦反文六從後灸之象人兩脛後有距也周禮曰久諸牆以觀其橈凡久之屬皆從久臣鍇曰今言炙以艾注之也周禮廬人試廬炙諸牆以視其橈之均廬茅戟柄也謂柱於兩牆挽而內之本末勝負可知言𥘉本貫未徑也炙爰疚從此幾柳反
