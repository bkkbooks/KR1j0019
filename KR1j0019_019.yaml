body:
  text: 繫傳十九文林郎守祕書省校書郎臣徐鍇傳釋朝散大夫行祕書省校書郎臣朱翶反切十八部文八百二十重九十三怒也武也象馬頭髦尾四足之形凡馬之屬皆從馬臣鍇按劉熙釋名馬武也韋昭曰以其健行莫者反古文籕文馬與同有髦牡馬也從馬陟聲臣鍇曰按爾雅牡曰隲又借訓定也之曰反馬一歲也從馬一絆其足讀若絃一曰環臣鍇曰指事户刪反馬二歲曰駒三歲曰騑從馬句聲卷于反馬八歲也從馬八聲北拔反馬一目白曰二目白曰魚從馬間聲臣鍇按詩曰有驔有魚注曰似魚目臣鍇曰為今馬環目候艱反馬青驪文如博棊也從馬其聲臣鍇曰慱棊子也相如賦曰射遊綨虞知反馬深黑色從馬麗聲臣鍇按爾雅小領盜驪臣以為盜驪淺黑鄰之反青驪馬從馬肙聲詩曰駜彼乘駽大玄反馬淺黑色從馬鬼聲臣鍇按漢儀丞相見免乘騩馬自府歸也矩遂反赤馬黑毛尾從馬留聲里求反馬赤白雜毛從馬假聲謂色似蝦魚臣鍇曰駮馬痕加反馬蒼黑雜毛從馬隹聲臣鍇曰蘆隼色專唯反馬白色黑鬛尾也從馬各聲臣鍇曰詩曰嘽嘽駱馬勒託反馬青白雜毛也從馬恖聲倉紅反馬隂黑喙從馬因聲伊倫反驪馬白跨也從馬矞聲詩曰有驈有騜常出反馬靣顙皆白從馬尨聲臣鍇按史記曰胸奴東方皆青駹馬餘馬名多見詩頌江反黃馬黑喙從馬咼聲古加反籕文騧􅸮黃馬發白色一曰白髦尾也從馬􅰈聲匹妙反黃馬白毛也從馬丕聲浦冝反馬赤黑色從馬􅨖聲詩曰四驖孔阜汀切反馬頭有白發色從馬岸聲臣鍇曰所謂白發言色有淺處若將起然隅旰反馬白額也從馬的省聲一曰駿也易曰馬馰顙顚狄反馬色不純從馬爻聲逼朔反馬後左足白從馬二其足讀若注易曰為馵足指事支處反驪馬黃脊從馬覃聲讀若簟定聲詩曰騋牝驪牡婁才反馬名從馬雚聲呼寬反馬名從馬僉聲臣鍇曰今亦云效也魚窆反馬名從馬此聲七里反馬名從馬休聲喜彪反馬赤鬛縞身因若黃金名曰吉皇之乘周文王時犬戎獻之從馬文文亦聲春秋傳曰馬百駟畫馬也西伯獻紂以全其身臣鍇按山海經一名吉量乘之夀千歲淮南子謂之飛黃亦曰乘黃太公六韜紂拘文王牖里散宜生之徒求吉黃以獻紂以免無外反馬強也從馬攴聲章移反馬飽也從馬必聲臣鍇曰駜彼乘黃頻必反馬盛肥也從馬光聲詩曰四牡駫駫臣鍇曰今詩作彭居屏反馬盛也從馬旁聲詩曰四牡騯騯白亨反駠䭹馬怒貌從馬卬聲我亢反馬之低仰也從馬襄聲臣鍇按潘嶽藉田賦龍驥騰􅋮修翔反上馬也從馬莫聲臣鍇曰左思賦曰驀六駮沒白反跨馬也從馬竒聲臣離反軛中從馬加聲臣鍇曰慱物志黃帝臣相土作乘馬千乍反籕文驂旁馬從馬非聲甫肥反駕二馬從馬聲臣鍇曰顔延之赭白馬賦紫燕駢衡屏堅反駕三馬也從馬參聲七南反一乘也從馬四聲臣鍇曰四馬也素次反副馬也從馬付聲一曰近也一曰疾也符注反馬和也從馬皆聲臣鍇曰詩曰六轡如組兩驂如舞和也䀶皆反馬搖頭也從馬我聲頻左反駊騀也從馬皮戶鋪妥反馬行貌從馬舀聲臣鍇曰猶滔滔也詩曰滔滔不歸偷勞反馬行遲從馬竹聲臣鍇曰詩曰篤公劉論語曰行篤敬皆當作笁假借此篤字得酷反馬行堅祝反馬尾也從馬介聲苟差反優也一曰摩馬從馬蚤聲臣鍇曰詩曰徐方驛騷素叨反絆馬也從馬口其足春秋傳曰韓厥執􅎗前讀若輒臣鍇曰指事知習反或從執系馬銜脫也從馬台聲臣鍇曰銜脫即放散故古謂春色舒放為駘蕩曰台反犗馬也從馬乘聲食陵反牡馬也從馬且聲一曰馬蹲駔也臣鍇曰駔駿子廣反廄御也從馬芻聲側丘反置䮷也從馬睪聲移尺反驛傳也從馬日聲臣鍇曰春秋左傳楚子乘馹而質反傳也從馬聲一曰騰犗馬也從朋反苑名一曰馬白額從馬寉聲間慱反牧馬苑也從馬坰聲詩曰在駉之野居屏反馬衆多貌從馬先聲所臻反獸如馬鋸牙食虎豹從馬交聲臣鍇曰詩云隰有六駮六駮亦木名皮斑駮也見陸璣詩草木疏逼朔反駃騠馬父騾子也從馬決省聲臣鍇按史曰燕王食蘇秦以駃騠鶗冗反駃騠也從馬是聲敵圭反驢父馬母從馬羸省聲魯戈反或不省似馬長耳從馬盧聲連於反驢子也從馬冡聲母東反驒騱野馬屬從馬單聲一曰青驪白驎文如魚臣鍇按史記曰胸奴之竒畜也的煙反驒騱馬也從馬奚聲賢迷反騊駼北野之良馬也從馬陶聲臣鍇按史亦胸奴之畜相如賦曰􅗗騊駼特豪反騊駼也從馬余聲田吾反衆馬也從三馬彼虬反文一百十五重八麠屬從鹿㶾省聲薄交切麋屬也從鹿主聲拙庾反狻猊獸從鹿兒聲臣鍇曰即今獅子國語曰獸長麑應作麛擬西反山羊而大者細角從鹿咸聲按山海經出月氏國顔咸反大羊而細角從鹿霝聲連丁反鹿屬也從鹿圭聲有兮反如小麋臍有香從鹿射聲臣鍇按爾雅麝父麋足嵇康論曰麝食柏而香時卸反似鹿而大也從鹿與聲玄怒反旅行也鹿之性見食急則必旅行從鹿麗聲禮麗皮納聘蓋鹿皮也臣鍇曰所謂儔儷婁惠反古文篆文牝鹿也從鹿牝省聲臣鍇曰詩曰麀鹿攸伏伊虬反或從幽文二十六重六行超逺也從三鹿凡粗屬皆從粗村呼反鹿行楊土也從粗從土臣鍇曰會意值辰反籕文文二重一獸也似兔青色而大象形頭與兔同足與鹿同凡之屬皆從㲋臣鍇曰象形丑略反籕文狡兔也兔之駿者從兔臣鍇曰詩曰躍躍毚兔會意岑嵒反獸名從吾聲息夜反獸也似狌狌從夬聲賜穴反文四重一獸名象踞後其尾形兔頭與頭同凡兔之屬皆徒兔土路反失也從辵兔兔謾記善逃失也臣鍇曰會意移弋反屈也從坰兔兔不得走益屈折臣鍇曰獸善屈折會意迂言反兔子也婏疾也從女兔臣鍇曰會意符萬反疾也從三兔弗孺反文五山羊細角者從兔足苜聲凡莧之屬皆從莧讀若丸寬字從此臣鍇按本草注莧羊似麢羊角有又俗作羱户寒反文一狗之有縣􅕭者也象形孔子曰視犬之字如畫狗也凡犬之屬皆從犬臣鍇曰蹄足趾高象犬之長體垂耳也畎反孔子曰狗叩也叩氣吠以守從犬句聲臣鍇曰叩者聲有節若扣物論語曰仲尼之玄狗講吼反南越人名犬獶獀從犬聲色酋反犬之多毛者從犬彡詩曰無使尨也吠或曰尨狗也臣鍇曰彡毛長也會意兔江反少狗也從犬交聲胸奴地有狡犬巨口而黑身臣鍇曰淮南子曰狡狗之死也刻之若濡言血脈潤也根卯反犬惡毛也從犬農聲臣鍇曰濃而亂也奴聰反短喙犬也從犬曷聲詩曰載獫猲獢爾雅曰短喙犬謂之猲軒謁反長喙犬一曰黑犬黃頭從犬僉聲香貶反猲獢也從犬喬聲許嬌反黃犬黑頭從犬主聲讀若注反處反短脛狗從犬卑聲臣鍇曰春秋左傳人名史猈鶯解反犗犬也從犬竒聲臣鍇曰犗形之也借為美也于奇反犬視貌從犬目聲臣鍇曰會意涓寂反竇中犬聲從犬從音音亦聲臣鍇曰犬吠穴中鼠歐彡反犬暫逐人也從犬黑聲讀若墨臣鍇曰犬默無聲逐人沒墨反犬從草暴出逐人也從犬卒聲臣鍇曰今人言猝暴村訥反猩猩犬吠聲從犬星聲臣鍇曰又爾雅猩猩小而好啼太玄曰交于鸚猩息形反犬吠不正也從犬兼聲讀若檻一曰兩犬爭也臣鍇曰謂小犬學吠聲未正也下斬反小犬吠從犬敢聲南陽新亭有㺖鄉臣鍇曰小犬聲米暢也荒檻反犬吠聲從犬畏聲塢賄反獶㺒也從犬憂聲臣鍇曰獶雜也獰交反犬容頭進也從犬參聲一曰賊疾也臣鍇曰言犬進狹處山檻反犬食也從犬舌聲讀若比目魚鰈之鰈臣鍇曰以舌吞物會意他合反犬可習也從犬甲聲臣鍇曰獸之可習者唯犬甚也侯甲反犬性忲也從犬丑聲臣鍇曰忲慣習也春秋左傳莫敖狃于蒲騷之役女有反侵也從犬已聲浮檻反狡獪也從犬會聲臣鍇曰獪多所會合也古最反恨賊也從犬青聲臣鍇曰犬性多猜害七開反健犬也從犬孟聲梅冷反健犬也從犬亢聲看浪反多畏也從犬去聲臣鍇曰駑犬性易怯羌脅反桂林説怯從心健也從犬粦聲詩曰盧獜獜臣鍇曰今詩作令里神反疾跳也一曰急也從犬瞏聲古縣反走也從犬攸聲讀若叔臣鍇曰倐忽也張衡賦曰倏眩眩兮返常閭假作倏假借尸竹反犬行也從犬豆聲周書曰尚狟狟臣鍇曰今尚書作桓户寒反過弗取也從犬巿聲讀若孛步咄反犬開張耳貌從犬易聲知白反犬張齗怒也從犬來聲讀又若銀臣鍇曰慗字從此牛吝反走犬貌從犬而丿之曵其足則剌犮也臣鍇曰祓茇跋從此指事蒲撥反曲也從犬出户下戻者身曲戾也臣鍇曰犬善出卑户也會意婁惠反犬相得而鬪也從犬蜀聲羊為群犬為獨也一曰北嚻山有獨𤞞獸如虎白身豕鬛尾如馬臣鍇曰北嚻山出山海經陀谷反獨𤞞獸從犬谷聲余足反秋田也從犬璽聲經義􅿘少也取禽獸少也息衍反或從豕作宗廟曰也故從豕示畋獵也逐禽也從犬鼠聲良涉反獵也從犬聲臣鍇按爾雅宵曰為獠力照反犬田也從犬守聲易曰明夷于南狩詩救反禽走臭而知其迹者犬也故從犬從自臣鍇曰自鼻也會意赤狩反獵所獲也從犬蒦聲户麥反頓仆也從犬敝聲春秋曰與犬犬斃避制反或從死宗廟犬名羮獻犬肥者以獻從犬鬳聲臣鍇曰禮犬曰羮獻希建反獟犬也從犬幵聲一曰逐虎犬也臣鍇曰獟猶驍也魚見反犬也從犬堯聲五呌反狂犬也從犬折聲春秋傳曰狾犬入華臣氏之門正曳反狾犬也從犬聲倦反古文從心種類相似唯犬為甚故從犬頪聲臣鍇曰類音耒戀位反犬獶獶咳吠也犬翏聲火包反赤狄本犬種狄之為言淫辟也從犬亦省聲曰溺反狻麑如貓食虎豹者從犬夋聲見爾雅素攢反母猴也從犬矍聲爾雅云玃父善顧攫持人也俱縳反玃屬從犬酋聲一曰隴西謂犬子為猷臣鍇曰又可止之言今怍猶延秋反玃屬從犬且聲一曰狙犬也暫齧人者一曰犬不齧人也臣鍇曰莊子狙公養群狙親去反夔也從犬矦聲何溝反犬類腰已上黃腰已下黑食母猴從犬殼聲讀若構或曰似牂羊出蜀北嚻山中犬首而馬尾呼屋反似犬鋭頭頰高前後廣從犬良聲勒當反如狼善驅羊從犬白聲讀若寧嚴讀之淺泊晉惡反反狼屬從犬曼聲爾雅曰貙獌似貍舞販反妖獸也鬼所乘之有三德其色中和小前豐後死則丘首從犬瓜聲魂徒反小狗也食魚從犬賴聲他割反獺屬從犬扁聲臣鍇按慱物志頭如馬頭腰已下似蝙蝠毛嫩大可五斤俗作獱辟涓反或從賔犬走貌從三犬臣鍇曰飈從此會意必遙反文八十三重五兩犬相齧也從二犬凡㹜之屬皆從㹜臣鍇曰會意語殷反司空也從㹜臣聲復説獄司空臣鍇曰臣頥同息兹反確也從㹜言聲二犬所以守也元旭反文三穴蟲之揔名也象形凡鼠之屬皆從鼠臣鍇曰上象齒下腹瓜尾鼠好齧傷故象齒叔吕反鼠也從鼠番聲讀若樊或曰鼠婦臣鍇曰爾雅作蟠復喧反鼠出胡地皮可作裘從鼠各聲臣鍇曰狐䶅間慱反地行鼠伯勞所作也一曰偃鼠從鼠分聲臣鍇曰伯勞百舌也敷粉反或作蟲分臣鍇白漢有田蚡䶄令鼠從鼠平聲頻寧反鼠也從鼠虒聲臣鍇按爾雅注曰夏小正曰鼶鼬則穴辛兹反竹鼠也如犬從鼠而聲臣鍇曰鼠齧竹者里由反五技鼠也能飛不能過屋能緣不能窮木能遊不能渡谷能穴不能掩身能走不能先人從鼠石聲臣鍇曰按古今注以為今螻蛄也神隻反豹文鼠也從鼠冬聲臣鍇按爾雅豹文鼮鼠又注云未詳疑此説文本脫誤隻公反籕文從攴作鼠之屬也從鼠益聲晏索反或從豸作小鼠也從鼠奚聲臣鍇曰春秋左傳鼷鼠食郊牛角賢迷反精鼩鼠也從鼠句聲臣鍇曰爾雅注小鼱鼩也群吁反䶃也從鼠兼聲臣鍇按爾雅注鼠以頰內藏物也丘點反鼸屬從鼠今聲讀若含侯貪反如鼦赤黃色尾大食鼠者從鼠由聲羊狩反胡地風鼠從鼠勺聲真若反鼠屬也從鼠聲臣鍇曰如勇反而擁反鼠似雞鼠尾從鼠此聲即冝反鼠出先零胡皮可作袋從鼠軍聲戶昆反獑鼠黑身白腰若帶手有長白毛似握版之狀類猿蜼之屬從鼠胡聲臣鍇曰西都賦曰獲獑胡版手版也魂徒反文二十重三熊屬足似鹿從肉以聲能獸堅中故稱賢能而強壯稱能傑也凡能之屬皆從能臣鍇曰骨節實也奈登反火也從火毁聲春秋傳曰衛侯燬吁委反火也從火豩聲吁位反然也從火夋聲周禮曰遂炊其焌焌火在前以焞焯龜翠卒反柴祭天也從火慎慎古文慎字祭天所以慎也臣鍇曰慎敬慎也力照反燒也從火肰聲臣鍇曰音然仁遷反或從草難燒也從火蓻聲臣鍇按春秋傳曰爇僖負羈儒拙反爇也從火番聲復喧反爇也從火堯聲式遙反火猛也從火􅍌聲臣鍇曰詩曰如火烈烈良舌反火光也從火出聲啇書曰豫亦炪謀讀若巧拙之拙臣鍇曰今尚書作拙燭恱反熚炥火貌從火畢聲畢聿反熚蹙也從火聲古文悖字分勿反火氣也從火丞聲臣鍇曰蒸從此手承反乾貌從火􅭑聲詩曰我孔熯矣爾件反火貌從火弗聲普末反火貌從火翏聲逸周書曰味辛而不熮利挑反火貌從火省聲讀若粦里刃反火色從火雁聲讀若鴈臣鍇曰雁音鴈迎諌反火光也從火頃聲居迥反火飛也從火籥聲一曰爇也臣鍇曰東京賦曰遺光煜爚胤略反火飛也從火􅰈聲讀若瘭彼消反火熱也從火高聲詩曰多將熇熇火酷反交木然也從火交聲臣鍇曰架而燒之也根卯反小熱也從火干聲詩曰憂心㶣㶣臣鍇曰從此長廉反所以然持火也從火焦聲周禮曰以明火爇燋也煎昭反燒木木灰也從火屵聲他旦反束炭從火差省聲讀若齹楚宜反交灼木也從火教省聲讀若狡根卯反火氣也從火犮聲步將反死灰餘燼從火又又手也火既滅可以執持臣鍇曰會意呼回反灰炱煤也從火台聲臣鍇曰火煙所生也田咍反盆中火也從火畏聲塢板反畜火也從火息聲臣鍇按史多用為息字消式反行竈也從火圭聲讀若坰臣鍇按爾雅注今三隅竈也烏攜反烓也從火甚聲氏吟反炊也從火單聲春秋傳曰燀之以薪昌善反爨也從火吹省聲叱為反尞也從火共聲詩曰卬烘于煁呼弓反炊餔疾從火齊聲寂帝反蒸也從火孚聲詩曰蒸之烰烰臣鍇曰蒸氣上出吕氏春秋有侁氏得嬰兒命烰人養之烰人庖人也附柔反炙也從火喜聲欣宜反炙肉也從肉在火上臣鍇曰會意之射反又按炙字别有部注云炮肉也從肉在火上凡炙之屬皆從炙之石反此疑誤炙也從火夕聲旨石反敖也從火前聲臣鍇按楚辭曰煎鴻鶬即然反乾煎也從火敖聲顔叨反或從麥作毛炙肉從火包聲臣鍇曰詩曰毛炮胾羮步交反炮肉也微火溫肉也從火衣聲愛根反置魚䇶中炙也從火曽聲走稜反以火焙肉從火稫聲臣鍇按周禮注鮑魚於稫火室作之稫音普逼反皮抑反灼也從火暴聲蒲速反炙燥也從火昜聲臣鍇曰暘也胤亮反灼也從火崔聲臣鍇曰霍音礭胡撲反熟也從火蘭聲婁粲反或從間爛也從火靡聲美支反從上按下也從􅊂又持火所以尉繒也臣鍇曰􅊂音夷安平也此會意迂胃反灼龜不兆也從火龜聲春秋傳曰龜不兆讀若焦臣鍇曰今春秋左傳作焦會意煎昭反灼也從火久聲幾柳反炙也從火勺聲真若反鑠治金也從火柬聲郎電反庭燎火燭也從火蜀聲專玉反然麻蒸也從火匆聲子菶反燭㶳也從火也聲似下反火餘也從火聲一曰薪也曰盡字從此今俗作燼夕晉反堅刀刃也從火卒聲臣鍇曰王褒聖主得賢臣頌曰清水焠其鋒也此退反屈申木也從火柔柔亦聲臣鍇曰周禮煣輻必齊以火揉木如紂反燒田也從火樊樊亦聲臣鍇曰復喧反火輮車網絶也從火兼聲周禮曰輮牙外不熑力鹽反放火也從火尞聲臣鍇曰春秋左傳若火之燎于原力表反火飛也從火與􅞳同意闕臣鍇曰􅰈從囟農從囟䢅從臼取其共捧以上之意此會意力么反焦也從火曹聲祖叨反火所傷也從火雥聲臣鍇曰雥音雜旁所謂古字音與今小異煎昭反或省天火曰災從火􅥘聲臣鍇曰􅥘音走該反或從宀火曰宀室屋也籕文從曰音災也古文從才臣鍇曰才聲火氣也從火垔聲伊田反籕文從宀古文或從因焆焆煙貌從火肙聲因恱反鬱煙也從火昷聲臣鍇按易曰天地煙煴相蒸也迂分反望火貌從火皀聲讀若馰顙之馰臣鍇曰皀音都歷切火熱也從火覃聲似猒反明也從火􅙯聲春秋傳曰焞耀天地他門反蒸也一曰赤貌一曰溫潤也從火昫聲動戍反明也從火丙聲鄙未反明也從火卓聲周書曰焯見三有俊心真若反明也從昭從火止要反盛赤也從火韋聲詩曰􅊮管有煒于虺反盛火也從火多聲昌婢反盛光也從火習聲詩曰熠耀逸入反耀也從火昱聲以反照也從火翟聲異召反光也從火軍聲吁袁反光也從火坰聲居逈反盛也從火曅聲詩曰燁燁震電筠輒反火門也從火閻聲羊廉反爓耀也從火玄聲預顯反煌煌也從火皇聲戶光反煌也從火昆聲孤損反明也從火在人上光明意也臣鍇曰通論備矣國昌反古文古文溫也從火藝聲爾絶反盛也從火戠聲昌意反古文熱在中也從火奧聲臣鍇曰尚書時燠嘔報反溫也從火爰聲呼逺反溫也從火耎聲奴短反見也從火曰聲臣鍇曰古又借為桂會意居迥反乾也從火亢聲臣鍇按爾雅曰晝聶宵炕看藏反乾也從火噪聲則耗反滅也從火戍火死於戍陽氣至戍而盡詩曰赫赫宗周褒姒滅之臣鍇曰會意火恱反旱氣也從火告聲闊毒反漙覆照也從火壽聲臣鍇按春秋左傳如天之無不燾徒號反取火于曰官名從火雚聲舉火曰爟周禮曰司掌行火之政令古煥反燧候表也邊有警則舉火從火逢聲甫蛩反苣火祓也從火爵聲吕不韋曰湯得伊尹爝以爟火釁以犧豭臣鍇按莊子曰許由云曰月出矣爝火不息子妙反暴乾也從火彗聲臣鍇曰太公六韜曰日中少熭于歲反或與爟同臣鍇按説文烜字在爟字下注曰或從亘今此特出而注云或與爟同又别無切音疑傳寫之誤燥也從火聲臣鍇曰何晏賦重熙纍盛軒其反文一百十二重十五火光上也從重火凡炎之屬皆從炎延占反火行微焰𦦨也從炎臽聲臣鍇曰尚書曰無若火始𦦨焰羊染反炎光也從炎舌聲透點反侵也從炎廩聲讀若桑椹字施甚反火行也從炙占聲羊染反于湯中爚肉從炎熱省聲臣鍇曰儀禮有司曰乃燅于俎以猒反或從炙作火熟也從又持火辛辛者物熟味也臣鍇曰辛音新相聶反兵死及牛馬之血為粦粦鬼火也從炎舛聲臣鍇按慱物志戰鬪死亡之處有人馬血積年化為粦粦著地入草木皆如霜露不可見有觸者著人體便有光拂拭便散無數又有吒聲如煼豆舛者人足也言光行著人里岡反文八重一火所熏之色也從炎上出凡黑之屬皆從黑臣鍇曰古窗字享勒反齊謂黑為黸從黑盧聲臣鍇曰尚書曰黸弓借旅字論孤反沃黑色從黑會聲烏最反深黑也從黑音聲臣鍇曰黯然銷魂言思深下也歐減反中黑也從黑厭聲臣鍇曰春秋左傳晉史墨字黶歐減反小黑子從黑殹聲幽雞反白而有黑也從黑旦聲五原有莫䵣縣臣鍇曰雖白而色滋多幹反雖晢而黑也從黑針聲古人名字晢干咸反赤黑也從黑易聲讀若焬胤亮反淺青黑色從黑參聲臣鍇按陸機漢功臣贊曰上黲下黷此反青黑也從黑奄聲歐減反微青黑色從黑幼聲爾雅曰地謂之黝伊糾反黃濁黑從黑屯聲他衮反黃黑也從黑金聲于咸反黑有文也從黑冤聲讀若飴字臣鍇曰色經溽暑而變班色迂厥反黃黑而白從黑箅聲一曰短黑讀若以芥為名曰芥荃也篡刮反黑皺也從黑幵聲堅殄反小黑也從黑占聲多忝切堅黑也從黑吉聲䀶札反黧也從黑今聲秦謂民為黔首謂黑色周謂之黎民易曰為黔喙臣鍇曰黧黑淺黑帶黃勤濳反澤垢也從黑冘聲臣鍇曰楚辭曰或黕點而汙之得坎反不鮮也從黑尚聲臣鍇曰莽黨然登沆反握持垢也從黑賣聲易曰再三黷陀谷反大汙也從黑詹聲口敢反中久雨青黑從黑微省聲臣鍇按楚辭黛黎以沮敗閩之反貶下也從黑出聲剌密反一色從黑般聲别安反畫眉也從黑聲臣鍇按古人云衛之處子粉白黱黑今俗作黛字徒再反青黑繒發白色也從黑攸聲尸竹反羔裘之縫從黑或聲臣鍇按詩曰羔羊之以黑為縫也于抑反謂之垽垽滓也從黑殿省聲庭硯反桑椹之黑從黑甚聲臣鍇按詩曰食我桑黮徒坎反果實黭黯黑也從黑弇聲烏感反黑刑在靣也從黑京聲臣鍇曰黑涅靣也虔京反或從刀作黑敢者忘而怠也從黑敢聲歐減反黑木也從黑多聲丹陽有黟縣幽雞反淺黃黑也從黑甘聲讀若染繒中束緅黚巨淹切文三十七重一在牆曰牖在屋曰囱象形凡囱之屬皆從囱臣鍇曰象交疏形楚尨反古文或從冗臣鍇曰會意多遽匆匆也從心囱囱亦聲粗中反文二重二火華也從三火凡焱之屬皆從焱臣鍇曰火所生也羊染反屋下燈燭之光從焱坰臣鍇曰秦嘉詩曰熒熒華燭坰猶室也會意玄經反盛貌從焱在木上讀若詩莘莘征夫莘古文胄一曰嶷一曰役臣鍇曰會意所臻反文三炮肉也從肉在火上凡炙之屬皆從炙真石反籀文臣鍇曰今東京文作此字宗廟火熟肉從炙番聲春秋傳曰天子有事膰焉以饋同姓諸侯臣鍇曰詩曰膰炙芬芬今春秋左傳作膰復喧反炙也從炙尞聲讀若燎臣鍇曰後漢書光武于竈下爒衣今人作燎力照反文三重一南方色也從火凡赤之屬皆從赤臣鍇曰南方之星其中一者最赤名大火會意昌夕反古文從炎土臣鍇曰尚書厥土赤埴赤色也從赤蟲省聲杜紅反日出之赤從赤榖省聲呼屋反靣慙赤也從赤反聲周失天下於赧王臣鍇曰赧王入秦為家人無諡謂其慙故謂之赧𬒳竊鈇之言也􅭋音女展反會意尼綰反赤色從赤巠聲詩曰魴魚赬尾恥呈反或從貞或從丁赬棠棗之汁或從水浾或從正赤土也從赤者聲臣鍇曰張衡賦赭堊流黃煮也反赤也從赤倝聲讀若浣從此朝旱反火赤貌從二赤臣鍇曰會意歇宅反文八重五説文解字通釋卷第十九
