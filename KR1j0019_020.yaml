seq: 20
body:
  text: 兩髀之間從大圭聲臣鍇按爾雅釋草云茥蒛盆奎亦人蒛盆骨天文奎亦取象也穹圭反持也從大俠二人苟掐反覆也大有餘也又欠也從大申申展也臣鍇按詩奄有鳬繹會意依漸反奢也從大于聲臣鍇按老子曰服文采帶利劒是謂盜夸焉瓜反空大也從大歲聲讀若詩施罟歡活反大也從大聲讀若詩􅨖􅨖大猷臣鍇曰今詩借秩又按山海經海外東有􅨖國又曰民不績衣不耕食也鐡從此遲匹反奢也從大亘聲戶寒反大也從大爪聲烏瓜反大也從大卯聲臣鍇曰又地名漢公孫賀封南奅侯匹孝反大也從大云聲讀若于惲反大也從大氐聲讀者氐的齊反大也從大介聲讀若蓋苟差反大也從大此聲七盜竊懷物也從亦有所持俗謂人俾夾是也弘農陜字從此臣鍇曰入入字也牧儼反文二傾頭也從大象形凡矢之屬皆從矢臣鍇曰矢傾其首也齊食反頭傾也從矢吉聲讀若孑臣鍇按春秋左傳齊有慶字繩亦用此為結字也經節反頭斜骫奊態也從矢圭聲臣鍇曰骫音委羊截反姓也亦郡也吳大言也從矢口臣鍇曰大言故矢口以出聲也詩頌曰不吳不揚不告于訩今寫詩者擅攺吳作㕦又音作華其謬甚矣會意阮孤反古文如此日西也從天日聲臣鍇按易曰日昊之離作此字會意齊食反文五重二屈也從大象形凡夭之屬皆從夭臣鍇曰夭矯其頭頸也依少反髙而曲也從夭從高省臣鍇曰按爾雅木上句曰喬上曲也故詩曰南有喬木不可休息會意伎昭反吉而免凶也從屰從夭夭死之事故謂死之不臣鍇曰國語曰偷居幸生春秋左傳曰幸而不死猶可恱屰反也反夭不夭也故曰屰吾逆會意恨耿反走也從夭卉聲走同意俱從夭臣鍇曰夭曲也走則夭其趾故走從夭卉非聲疑走于草卉於坤反文四交脛也從大象交形凡交之屬皆從交加肴反衮也從交韋聲臣鍇曰所謂僻違宇歸反縊也從交系聲臣鍇曰春秋左傳絞縊以戮會意根卯反文二跛曲脛也從大象偏曲之形凡尢之屬皆從尢臣鍇曰大一足破曲也烏光反古文從臣鍇曰春秋左傳焚巫音皇膝病從尢骨骨亦聲胡兀反蹇也從尢皮聲臣鍇曰春秋公羊曰晉使跛俗作跛晡顆反跛㝾行不正從尢左聲臣鍇曰行左則箇反行不正也從尢㫐聲讀若曜臣鍇曰㫐音杳力照反不正也從尢兼聲干咸反􅾎􅴃也從尢介聲苟差反行脛相交也從尢勺聲力照反跛不能行為人所引曰從尢爪是聲臣鍇曰詩曰言提之耳的齊反也從尢從爪嶲聲勺迷反股㝼也從尢于聲臣鍇曰股曲也沉于反膝中疾也從尢羸聲魯坐反文十二重一昆吾圜器也象形從大象其蓋也凡壷之屬皆從壷臣鍇曰昆吾紂臣作瓦器大掩之也魂孤反一壷也從凶從壷不得泄凶也易曰天地一壷臣鍇曰氣擁􅓹也今易作絪緼會意迂分反司視也從橫目從㚔令吏將目捕罪人也臣鍇曰澤繹懌釋驛圛從此會意移赤反捕罪人也從丮㚔㚔亦聲臣鍇曰丮音掬持也會意之習反囹圉所以拘罪人從口㚔臣鍇曰會意疑舉反引繫也從㚔攴見血也扶風有盩屋縣臣鍇曰攴音撲擊也盩字從此會意陟求反當罪也從㚔從􅭋􅭋服罪也臣鍇曰尚書曰報以庶尤史記曰張湯爰書論訊鞠報􅭋音展服也會意輔號反窮理罪人也從㚔人言竹聲臣鍇曰以言之也漢書音義窮也居逺反或省言文七重一張也從大者聲凡奢之屬皆從奢申嗟反籕文當奲奲貌從奢單聲臣鍇曰謂重而垂也當去聲兜果反文二重一人頸也從大省象頸脈形凡亢之屬皆從亢臣鍇曰亢喉嚨也故鮑昭舞鶴賦曰引員吭之纖婉本作此字格康反或從頁作直項莽貌從亢從夋夋倨也亢亦聲解黨反文二重一進趨也從大十大十猶兼十人也凡之屬皆從讀若滔臣鍇曰大奄有之義也會意偷勞反疾也從卉聲拜從此呼兀反疾有所趣也從臣鍇曰暴曬暴字與此别盆操反進也從屮從允聲易曰升大吉臣鍇曰今易作允與凖反奏進也從從草從屮屮上進義臣鍇曰史記曰藺相如前奏出會意則漚反古文亦古文氣臯白之進也從白從禮祝曰皋登歌曰奏故臯奏同從周禮曰詔來鼓皋舞皋吉之也臣鍇曰臯猶皡也家豪反文六重二放也從大而入分也凡夰之屬皆從夰臣鍇曰大人也分舒散也會意姦皓反舉目驚然也從瞿從夰臣鍇曰禮曰見似目瞿夲此字九遇反嫚也從􅔣從夰夰亦聲虞書曰者丹朱奡讀若傲論語奡蕩舟臣鍇曰今文尚書作傲五號反春為昦天元氣昦昦從日夰夰亦聲臣鍇曰舒和廣夫貌會意候抱反驚走也一曰往來貌從夰臦周書書曰伯臩古文臦古文囧字也臣鍇曰臦背也今文尚書作具往反文五籕文大攺古文亦象人形凡大之屬皆從大臣鍇曰中作八字象與大殊也他末反大也從大亦聲詩曰奕奕梁山臣鍇曰新廟奕奕移赤反駔大也從大壯聲臣鍇曰亦見爾雅勒泱反大白澤也從大白古文以為澤字臣鍇曰澤和潤也會意姦皓反大腹也從大省聲縣古文系字臣鍇曰亦羌名賢迷反稍前大也從大而聲讀若畏偄之偄爾件反大貌從大􆄢聲或曰拳勇字讀若傿臣鍇曰願字從此其獻反牡大也從三大三目二目為􆄢三目為益大也一曰也讀若易虙羲氏詩曰不醉而怒謂之辨利反文八大夫也從大一以象簮也周制以八寸為尺十尺為丈人長八尺故曰丈夫凡夫之屬皆從夫臣鍇曰通論詳矣甫殳反有也從夫見聲臣鍇曰言為可聞行為可見言有規矩也會意堅隨反並行也從二夫輦字從此讀若伴侣之伴臣鍇曰會意步滿反文三住也從大立一之上凡立之屬皆從立臣鍇按周禮注云古借此為位字里汲反臨也從立隸聲臣鍇曰春秋左傳如齊涖盟今俗作涖借也隸音逮柳嗜反磊䇏重聚也從立􅙯聲臣鍇􅙯音純都罪反直也從立專聲臣鍇曰春秋左傳曰太伯端委端委禮衣之幅正者顚歡反等也從立專聲春秋國語曰竱本肇末職件反敬也從立束束自申束也亦聲臣鍇曰立自竦也會意思奉反亭安也從立爭聲臣鍇曰亭孤直也寂逞反立也從立靑聲一曰細貌寂逞反待也從立矣聲臣鍇曰立而待之也特史反或從巳健也一曰匠也從立句聲讀若齲逸周書有竘匠臣鍇曰蒟從此也俱取反不正也從立􅸮聲臣鍇曰􅸮音過昆柴反負舉也從立曷聲臣鍇曰負而立也其熱反待也從立須聲臣鍇曰立而待也春秋左傳寡君􅓄矣四于反或從芻痿也從立􅢓聲魯坐反偓竣也從立夋聲國語曰有司巳事而竣臣鍇曰退立也七賔反見鬼魅貌從立録聲籕文魅字讀若虙羲氏之虙音伏臣鍇曰録祿代六反驚貌從立昔聲七削反短人立䇑䇑貌從立卑聲傍把反北地高樓無屋者從立曽聲臣鍇曰立為高也作滕反文十九重二併也從兩立凡並之屬皆從並也頻靜反廢一偏下也從並白聲臣鍇曰並立而一下也白音自他計反或從曰臣鍇曰曰音越或從兟文二重二頭會腦蓋也象形凡囟之屬皆從囟臣鍇曰頭囟也思震反古文囟字或從宰肉毛巤象形髮在囟上及毛髮巤巤之形此與籕文字同臣鍇鍇按曰虎通人之六情所以扶成五性喜怒哀樂愛惡也自成反人之陽氣性善者也從心生聲臣鍇曰五性仁義禮知信屬陽所以五五陽數情屬隂所以六六隂數息令反意也從心之聲職吏切志也察言而知意也從心音聲臣鍇曰通論詳矣乙記反意也從心旨聲臣鍇曰指手指也旨甘美也準此為意恉字古今假借多致紛雜職美反外得於人內得于己從直從心臣鍇曰通論詳矣多則反古文當也從心聲臣鍇曰鷹字于陵反謹也從心真聲臣鍇曰通論詳矣時印反古文敬也從心中聲珍蒙反謹也從心殼聲刻學反美也從心貌聲臣鍇曰爾雅曰借藐字尨璞反喜也從心夬聲苦夬反康也從心豈聲臣鍇按詩曰愷樂飲酒刻海反快也從心聲臣鍇曰今多作愜輕帖反常思也從心今聲臣鍇按尚書曰我念爾祖常念之也寧虛反思也從心付聲臣鍇曰甫殳反敏也從心目害省聲臣鍇按禮曰發慮憲目與心應為敏希建反平也從心登聲臣鍇曰北史有薛憕纏陵反敬也從心難聲臣鍇曰今詩作熯我孔熯矣尼綰反闓也從心斤聲司馬法曰善者欣民之善閉民之惡希斤反重厚也從心軍聲迂吻反厚也從心􅙯聲得昏反慨也從心亢聲一曰易慷龍有悔看浪反慷慨壯士不得志也從心既聲臣鍇曰內自高亢憤激也苦蓋反愊也從心囷聲苦衮反誠志也從心畐聲坡式反謹也從心原聲臣鍇曰尚書願而和魚怨反儇也從心彗聲臣鍇曰儇敏也回桂反慧也從心尞聲臣鍇按詩曰佼人憭兮吕曉反憭也從心交聲臣鍇曰佼人本此字根卯反靜也從心㾜聲臣鍇曰列女傳曰后婉瘱伊閉反敬也從心折聲臣鍇曰古以此字為哲字知苦反樂也從心宗聲臣鍇曰謝惠連詩曰瞻塗意小悰存公反安也從心甜省聲臣鍇曰莊子曰以恬養智亭嫌反大也從心夾聲臣鍇老子曰天網恢恢庫推反肅也從心共聲臣鍇曰通論詳矣矩容反敬也從心敬敬亦聲巳皿反仁也從心如聲失箸反古文和也從心台聲寅之反愛也從心兹聲秦思反愛也從心氏聲臣鍇按爾雅忯忯愛也翹移反謹也從心全聲七沿反惠也從心因聲愛根反高也從心帶聲一曰極也一曰困劣臣鍇按禮曰音沾慸笛計反問也謹敬也從心猌聲一曰説也一曰甘也春秋傳曰昊天不憖又曰兩君之士皆未憖臣鍇曰猌音牛吝反皆未憗皆未甘也言意未甘止也魚晉反闊也一曰廣也大也從心廣廣亦聲一曰寬也臣鍇按漢書武帝詔曰庶僚久懬會意困盎反飾也從心戒聲司馬法曰有虞氏悈于中國苟差反謹也從心聲臣鍇曰爰穩隱字從此於靳反行賀人也從心夂吉禮以鹿皮為摯臣鍇曰攴行也會意丘病反寬嫺心腹貌從心宣聲詩曰赫兮愃兮呼逺反順也從心孫聲唐書曰五品不遜臣鍇曰今文尚書作遜蘇困反實也從心塞省聲虞書曰剛而塞臣鍇按詩曰其心㥶泉今皆作塞借也四再反信心也從心旬聲臣鍇曰詩恂美旦都信美也今借洵息寅反誠也從心冘聲詩曰天命匪忱是吟反思也從心隹聲與追反念思也從心褱聲臣鍇曰褱音懷抱也户埋反欲知之貌從心侖聲勞存反冀思也從心相聲臣鍇曰希冀所思之故史記司馬遷曰讀其書想見其為人息仰反深也從心歲聲夕位反起也從心畜聲詩曰能不我慉臣鍇曰與起同許郁反滿也從心啻聲一曰千萬曰啻臣鍇曰從此依色反籕文又省憂也從心官聲古翰反摎然也從心翏聲梨桃反敬也從心客聲春秋傳曰以陳備三愙臣鍇曰經義三恪在二王後之上其禮轉降示敬而已今皆作恪客各反懼也從心雙音聲春秋傳曰駟氏愯臣鍇按漢書刑法志曰愯之以思奉反恐也從心瞿聲健芋反古文恃也從心古聲桓土反賴也從心恃聲辰上反慮也從心曹聲存公反覺也從心吾聲頑乎反古文悟愛也韓鄭曰憮一曰不動從心無聲臣鍇曰今爾雅作憮勿撫反惠也從心旡聲臣鍇曰愛字從此先音既晏再反古文知也從心胥聲臣鍇曰有才智也仙吕反安也從心聲一曰恚怒也迂胃反謹也從心聲讀若毳臣鍇曰音山芮反此芮反箸也從心聲臣鍇曰悲回思慮之也陳收反朗也從心由聲詩曰憂心且怞長宥反􅤷撫也從心某聲讀若侮臣鍇曰撫愛之也勿撫反強也從心文聲臣鍇曰自強也眉均反勉也從心莫聲臣鍇按爾雅注自勉強也莫度反勉也從心面聲彌件反習也從心曵聲余制反勉也從心楙聲虞書曰惟時懋哉臣鍇曰楙音茂莫透反或省習也從心莫聲臣鍇曰通論詳矣莫度反止也從心聲七沿反肆也從心隸聲他沒反趣步㦛㦛從心與聲臣鍇曰㦛㦛美也尹女反説也從心舀聲臣鍇按春秋左傳曰日不悛以樂慆憂偷勞反安也從心厭聲詩曰懕懕夜飲臣鍇曰今詩作厭於潛反安也從心詹聲臣鍇曰梁有蕭憺梁武兄弟徒㺖反無為也從心白聲臣鍇曰按相如子虛賦曰怕乎無為憺乎自持潘客反憂也收也從心血聲臣鍇曰通論詳矣相聿反極也從心干聲骨安反喜欵也從心雚聲爾雅曰􅌚􅌚愮愮憂也臣鍇按爾雅注賢者憂懼無所告也古翰反􅌚也琅琊朱虛有媀亭從心禹聲元無反飢餓也從心叔聲一曰憂也詩曰惄如朝飢覔反勞也從心郤聲臣鍇曰􅿣猶郤也其雀反憸詖也憸利于上佞人也從心僉聲七廉反息也從心曷聲臣鍇曰愒猶憩豈例反精戇也從心毳聲呼骨反疾利口也從心册聲詩曰相時􅧴民臣鍇曰今皆作憸册所言衆也會意先廉反褊也從心及聲飢泣反憂也從心辡聲一曰急必撚反疾也從心亟聲一曰謹重貌已力反急也從心瞏聲讀若絹臣鍇曰睘音珣均戰反恨也從心巠聲其頸反急也從心弦聲河南密縣有亭形先反悔恨也從心每聲虎配反小怒也從心壴聲臣鍇曰壴音駐唱曵反忿也從心肙聲一曰憂臣鍇曰悁猶狷也于旋反籕文不服懟也從心央聲隱唱反煩也從心滿聲免困反悶也從心賁聲臣鍇曰孔子曰不憤不啓俟其滿乃啓之也符訓反悶也從心門聲免困反失意也從心周聲丑羞反望恨也從心長聲田向反太息也從心氣氣亦聲詩曰愾我寤歎許意反愁不安也從心噪聲詩曰念子懆懆此誥反傷也從心倉聲初訪反􅉃也從心旦聲臣鍇曰宋玉風流賦曰中心􅉃怛多幹反從心且詩曰信誓􅘔􅘔臣鍇曰今詩作旦冕散反痛也從心替聲七感切毒也從心參聲此嗿反痛也從心妻聲七低反痛也從心同聲一曰呻吟臣鍇按詩曰神罔時恫土蒙反痛也從心非聲府眉反痛也從心則聲蔡色反痛也從心昔聲思益反痛也從心暋聲眉引反痛也從心殷聲臣鍇按詩曰憂心殷殷本作此字意斤反痛聲也從心依聲孝經曰哭不㥋臣鍇曰聲之曲引也今孝經作偯殷豈反蕄存也從心簡省聲讀若簡臣鍇曰若尚書云簡在上帝之心艮限反動也從心蚤聲曰起也素叨反動人心也從心咸聲臣鍇按易曰聖人感人心而天下和平詩曰無感我帨兮感動也苟坎反不動也從心尢聲讀若祐延救反怟㥴不憂事也從心虒聲讀若移書爾反怨仇也從心咎聲臣鍇曰若春秋左傳楚人以咎子上伎酒反憂貌也從心貟聲羽文反憂貌從心幼聲伊紏反憂也從心羊聲胤亮反憂也從心介聲冝介反憂懼也從心專聲詩曰惴惴其栗支瑞反憂也從心鈞聲常倫反憂也從心丙聲詩曰憂心怲怲兵永反憂也從心炎聲詩曰憂心如惔臣鍇曰如火熱也憂而心熱也秋南反憂也從心叕聲詩曰憂心惙惙一曰意不定也誅劣反憂也從心殤省聲庶錫反憂也從心秋聲燀搜反憂貌從心弱聲讀與惄同泥覔反憂困也從心舀聲苦感切憂也從心攸聲臣鍇按春秋左傳曰悠悠乎深思而淺謀深思而憂也延秋反憂也從心卒聲讀與易萃卦同奉醉反憂也從心圂聲一曰擾臣鍇按春秋左傳曰主不恩賔胡頓反楚潁之間謂憂曰從心􅫕聲臣鍇曰􅫕音釐柳嗜反憂也從心于聲讀若吁呪于反憂也從心中聲詩曰憂心忡忡臣鍇曰憂而心動也敕戎反憂也從心肖聲詩曰憂心悄悄臣鍇曰憂思低下也干眇反憂也從心戚聲臣鍇曰春秋左傳晉人戚憂以重我憂近心之切也今作戚同干僻反愁也從心頁聲􅡣心形于顔靣故從頁臣鍇曰一本愁憂字憂從此與憂別衣仇反憂也從心上貫吅吅亦聲臣鍇曰通論詳矣户慣反古文從關省亦古文從􅍫心怯也從心匡匡亦聲區王反思貌從心夾聲去涉反火氣也從心聶聲一曰服也真聶反忌難也從心單聲一曰難也徒岸反懼也從心卓聲陳楚謂懼曰悼徒號反
