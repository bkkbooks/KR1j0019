  text: 說文解字系述卷第四十
  hash: sha256:e95c2187a51be7d4e387d8b5ef7b2139f1323fddee9aea786953758e40e3e95e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_040-1a}
body:
  text: 繫傳四十文林郎守袐書省校書郎臣徐鍇撰說文之學逺矣時歴九代年移七百保氏弛教學人墮業聖人不作神旨幽沫故臣附其本書作通釋第一至三十分部相屬因而繹之觸類而長之以究竟天下之事久則不昭昧則無次抽其緒作部叙第三十一至三十二文字者聖人之所以極深而研㡬也天地日月之經也忠孝仁義之本也朝廷上下之法也禮樂法度之規也人君能明之立四極包四海之道也人臣能明之事君理下之則也字別有義具之則繁㳂流索潤以反其原舉其要作通論三十三至三十五字指澄深學者不曉譏者皆妄作祛妄第三十六禀受有義朋友有群譬諸草木區别是分萬類紛糅不相奪倫作類聚第三十七文有不得盡言言有不得盡意曼者失真拘者多滯或同或異推極其情皦如也繹如也以成作錯綜第三十八書闕簡脫傳者異詞述者不明後人洞疑作疑義第三十九昔在伏羲設卦興統去聲黄帝作書蒼頡沮誦周宣中興史籀是承爰及許慎維綱振繩勒成一家大義以弘傳非其人訛僞相仍聖皇紹祚粤若稽古通幽洞冥萬物咸覩實生下臣是經是綸作系述第四十說文解字繫傳卷第四十
  hash: sha256:6cc1520f09497fef89e7d8928e4416f8d83c6874fa94430f4d121d3eedc68d61
