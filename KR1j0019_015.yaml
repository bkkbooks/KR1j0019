front:
  text: 未冠也從人童聲臣鍇曰禮十五成僮僮子也而童即罪人之子沒官供給使者也僮子字從罪人之童者古者質但取其幼小爾美惡不嫌同辭曰風反養也從人省聲曰夫赤子有􅍖􅍖其身之動靜飲食衣服也孚字與孚􅍖反之字為旁紐古者反音為踈故得與􅍖為聲然疑多聲字孚信也義與􅍖同輔老反古文􅍖古文親也從人二聲曰并下二字通論詳矣爾申反古文從千心作古文仁從尸二舉蹱也從人止聲臣鍇曰止即踵也當言亦聲會意字山海經有企踵國其人足跟不著地去寄反古文從足臣鍇曰足義與止同伸臂一尋八尺從人刃聲爾吝反學也從人士聲曰會意字鉏里反交也從人交聲臣鍇按詩曰佼人憭兮下巧反具也從人聲臣鍇曰與撰義相近士反冠飾貌從人求聲詩曰戴辨俅俅也虔柔反大帶也從人凡巾佩必有巾從巾巾謂之飾臣鍇曰人凡巾為佩會意也蒲妹反柔也術士之稱者也從人需聲臣鍇曰柔弱也又儒之言愞也禮曰君子難進而易退老子曰知其雄守其雌似於愞也而攻堅強莫之能勝夾谷之會是也荀况謂周公為大儒張華曰有通儒碩儒愚儒竪儒鄙儒臣鍇以為通儒道無不通則聖人也仲尼之謂也碩儒其學廣大孟軻之儔也腐儒講誦其説至于熟腐而道則不類此莊周所謂糟粕也愚儒守一不移孔子所謂古之愚也直能肆而不能詘也竪儒猶章句之學儒家之役使也竪伇使之名也子夏之門人灑掃應對進退可矣本之則無如之何鄙儒所見僻狹所謂窮鄉多異曲學多論諸子之中有按尚書曰湯聿求元聖與之戮力元聖謂伊尹也阿倚也衡平也依倚而取平也尹正也所倚正人也俗夲有聲字誤也因之反古文伊從死死亦聲臣鍇曰古文死字婦官也從人豫聲臣鍇曰婦官謂倢妤也以虛反志及衆也從人公聲之松反慧也從人睘聲臣鍇曰諸輕薄察慧小才也故荀卿子曰鄉曲之儇子張衡南都賦曰儇才齊敏授爵傳觴虛全反安也從人炎聲讀若談臣鍇曰倓猶憺然平安之意杜南反倓或從剡疾也從人旬聲臣鍇按史記曰黃帝幼而殉齊猶疾也蘇徇反宋衛之間謂華僷僷從人葉聲臣鍇曰亦輕薄之貌也華音驊僷猶估占也亦接反善也從人圭聲占膎反竒賅非常也從人亥聲臣鍇按史記苟孩反偉也從人鬼聲周禮曰大傀異災臣鍇按周禮大傀異災謂日月食山川崩壅也公恢反傀或從玉褱聲臣鍇曰謂瓌寶也竒也從人韋聲臣鍇曰人材傀偉也于毀反文質備也從人分聲論語曰文質份份臣鍇曰文質相半也彼囷反古文份從彡林從焚省聲好貌從人尞聲臣鍇曰詩曰佼人僚兮力反威儀也從人必聲詩曰威儀佖佖頻必反具也從人孨聲讀若汝南潺水虞書曰方鳩僝功也臣鍇曰此已具之具非方將具之之具也助服反長壯儠儠也從人巤聲春秋傳曰長儠者相之是也臣鍇按杜預左傳注長鬣多須也左氏春秋但許愼在杜預左傳注長鬣前故所引則義或與今注有異也力涉反行貌從人聲詩曰行人臣鍇曰行動之貌彼消反行有節也從人難聲詩曰佩玉之儺臣鍇曰佩玉所以節步奴何反順兒從人委聲詩曰周道倭遲也於佳反􅈺貌從人貴聲臣鍇曰嫺間雅也順也簡易也通猥反高也從人喬聲伎昭反大也從人矣聲詩曰伾伾俟俟曰此直訓大也佇俟字牀史反大貌從人同聲詩曰神時侗臣鍇按字書長大也又未成器之名又痛也土蒙反正也從人吉聲詩曰既佶且間臣鍇曰方正也臣乙反大也從人吳聲詩曰碩人俁俁元羽反大腹也從人工聲讀若紅臣鍇曰人言禮身體仜大也負聰反病也從人單聲周禮曰句兵欲無僤臣鍇曰速疾也徒岸反㐾也從人建聲其獻反強也從人京聲渠命反倨也從人敖聲五號反勇壯也從人氣聲也周書曰聲詩曰倬彼雲漢也臣鍇曰卓然高明也著音竹慮反輟角反長貌一曰著地一曰代也從人廷聲臣鍇曰著亦竹慮反笛頲反輔也從人朋聲讀若陪位之陪臣鍇曰義取于明輔寫誤多聲字又人姓漢書有南山羣盜倗宗薄弘反熾盛也從人扇聲詩曰傓方熾臣鍇曰人權力相成若火之相扇也當言扇亦聲詩掾反戒也從人敬聲春秋傳曰警宫臣鍇按尚書警戒無虞巳皿反善也從人叔聲詩曰令終有俶一曰始也臣鍇按爾雅曰俶落權輿始也昌伏反均直也從人庸聲臣鍇按詩曰昊天不傭敕容反仿佛也從人愛聲臣鍇曰見之不明也禮曰僾然有見乎其位晏反相似貌從人方聲臣鍇曰不明也分敝反籕文從丙見不諟也從人弗聲臣鍇曰諟諦也分勿反聲也從人悉聲讀若屑臣鍇曰僁屑有聲也先列反精謹也從人幾聲明堂月令曰數將僟終臣鍇曰幾近月也功也故為精詳數將僟終此僟即切也近也明堂月令即今禮記月令未刪定前也古天子居明堂布政每月告朔班一月之政令故曰明堂月令居希反負何也從人它聲臣鉉等按史記胸奴竒畜有橐他今俗訛誤謂之駱駝非是徒何切何也從人詹聲臣鍇曰此即儋何字齊田儋是也兜貪反儋也從人可聲一曰誰也臣鍇曰商頌百祿是何又爾雅河鼓謂之牽牛注云謂之儋鼓儋是何為負何也今俗多上去聲音不必爾也間俄反誤也從人共聲一曰供給也臣鍇曰春秋左傳曰君謂許不供是也矩重反待也從人待聲臣鍇曰漢書張忠為孫寶設儲偫物以待須索也直里反起也從人乍聲臣鍇按周禮曰坐作進退是也憎記反非真也從人假聲一曰至也虞書曰假于上下臣鍇曰訓至亦同音賈而已無煩音格也格雅反假也從人音聲資昔切漸進也從人又持帚若掃之進也會意按史記封禪書曰稍侵尋漸進之意也七林反見也從人聲臣鍇曰周禮借為貨賣字賣音育融六反伺望也從人矦聲臣鍇曰候守封疆吏也周禮郊有候館國語候不在疆寒豆反還也從人賞聲臣鍇按史記曰伐王償債是也庶張反才能也從人堇聲臣鍇曰僅能如此是財能如此則才才裁皆財借為始字才始詞也本借無正字推覆象義用才則義皆可才最為疏也其櫬反更也從人弋聲臣鍇曰迭代也弋音近特故得以弋為聲也徒再反度也從人義義亦聲威儀之形臣鍇曰度法度也孔子曰禹聲為律身為度布指知尺舒肱知尋周旋中規折旋中矩頭圜象天足方象地􅤑方枕繩趨中釆齊行中陔夏聲中黃鐘會朝言知聞于表著上天之載無聲無臭儀刑文王萬邦作孚人者天地之靈聖人之靈也唯人可為法度義者事之宜也故言從人義義亦聲研之反近也從人旁聲曰近之也薄荒反象肖也從人吕聲臣鍇曰肖即似也今人於其右加人也詳紀反安也人有不便更之故從人更臣鍇曰此會意婢篇反􅍖也從人任聲曰相保任也爾音反譬論也一曰聞見從人見聲詩曰俔天之妹臣鍇按詩篇譬猶天有姊也此會意苦硯反饒也從人憂聲一曰倡也又俳優者臣鍇曰饒寬𥙿也衣尤反樂從人喜聲臣鍇曰至于從女即為嬉戲也軒其反完也逸周書曰不明以俒伯父從人完臣鍇曰逸周書在三百篇之外也胡頓反冨也從人春聲此準反約也從人僉聲其閃反善也從人介聲詩曰價人維藩苟瘵反習也從人谷聲臣鍇曰俗之言續也傳相習也夕燭反克也從人子聲臣鍇按詩曰佛時仔肩則欺反安也從人聲臣鍇曰億猶抑也安也依色反鄉也從人靣聲禮少儀曰尊壼者偭其鼻臣鍇曰鄉謂微向非正向也故史記本紀曰項籍謂司馬童曰卿非我故人乎馬童面之注云面謂微背之也弭釧反今也從人吏聲瑟耳反左右兩視從人癸聲帔季反送也從人灷聲吕不韋曰有侁氏以伊尹媵女古文以此為訓字以證反緩也從人余聲曰與徐字義同遽也從人僭也子念反頗也從人扁聲僻連反狂也從人長聲一曰仆臣鍇曰狂妄也韓詩外傳曰老而不學者如無燭而夜行倀倀然是也禇良反惛也從人薨聲呼能反翳也從人夀聲臣鍇曰儔古與翿同義隱翳也今人音稠匹儷也陳收反有壅蔽也從人舟聲詩曰誰侜豫美陵求反淺也從人戔聲臣鍇按詩曰小戎俴收也寂衍反中也從人田聲春秋傳曰乘中佃一轅車臣鍇曰佃訓中也古載物大車雙轅乘車一轅當中也庭硯反小貌從人囟聲詩曰彼有屋七紫反小貌從人光聲春秋國語曰侊飰不及一食是侊侊然小也骨庚反愈也從人兆聲詩曰視民不佻臣鍇曰輕佻苟且也土雕反辟也從人辟聲詩曰宛然左僻一曰從旁牽也臣鍇曰辟避也佚民從人失聲一曰佚忽按忽者猶倐忽也秋七反善也從人謠聲自關以西物大小不同謂之徭臣鍇曰物大小不同則􆄍逺也延朝反僥􅵍受屈也從人郤聲臣鍇曰􅵍困劇也言見傲遮困劇則受屈也此許愼全引司馬相如上林賦之文其雀反行頃也從人我聲詩曰側辨之俄臣鍇按張衡曰曜靈俄景則是斜景也偶和反醉舞貌從人欺聲詩曰屢舞僛僛臣鍇曰僛欹傾也遣之反醉舞貌從人􅐔聲詩曰屢舞傞臣鍇曰傞猶參差也先多反傷也從人每聲臣鍇曰侮慢昜字也勿甫反古文從母臣鍇曰從母聲也輕也從人易聲一曰交易臣鍇曰人所為輕易也引義反妎也從人􅍚聲一曰毒也臣鍇曰㑵害也秦室反或從女作臣鍇曰女無美惡入宫見妬士無賢不肖入朝見嫉訟靣相是也從人希聲臣鍇曰靣從相質正也疑當言從稀省聲赩豈反偃也從人疆聲九商反僵也從人賁聲臣鍇曰春秋左傳曰鄭伯也車僨子濟也符訓反頓也從人卜聲弗儒反僵也從人匽聲衣逺反剌也從人肴聲一曰毒之臣鍇曰􅍚害也秦交反創也從人省聲式陽反備詞從人夸聲坤瓜反相搗也從人崔聲詩曰室人交偏催我臣鍇曰搗相迫蹙也此灰反痛也從人甬聲土蒙反伺也從人犬伺人也臣鍇曰會意也伐六反迫也從人足聲超欲反比也從人􅍌聲里曵反潔束也從人系聲已惠反擊也從人持戈一曰敗也亦斫也扶月反人召聲臣鍇曰説者多言晉已前言昭自晉文帝名昭故改昭穆為紹穆據説文則為紹文作韶則非晉已後改明矣士遙反神也從人身聲式人反長生者仙去也從人䙲聲息遷反人在山上貌從人山許延反牛為蠻夷也從人棘聲臣鍇按周禮北方曰𤏡也朋比反南方焦僥人長三尺短之極也從人堯聲臣鍇曰夫子之言也研梟反匝也從人對聲得悔反逺行也從人狂聲臣鍇曰此與廷義同也溝唱反分也從人從牛牛大物故可分其輦切
