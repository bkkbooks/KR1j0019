front:
  text: 手執之時乎時不可失疾也㑹意气至反常也從心舟在二之間上下一心以舟施恒也臣鍇曰二十一下也心當有常易恒曰四時變化而能久成注曰長陽長隂合而相與可乆之道也胡㾗反古文恒從月詩曰如月之恒求豆也从二從回古文回象亘回形上下所求物也臣鍇曰宣字従回風回轉所以宣隂陽也詢全反厚也從二竹聲臣鍇曰二厚也得酷反最括而言也從二二偶其也從了弓古文及字臣鍇曰一一垂及字也符芝反
  hash: sha256:a08e0f5d43cf7c60c3ca6adffaa48b5a3468ff8c1b700f8c4ca963b4f1daac28
