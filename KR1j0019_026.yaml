  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_026-1a}
body:
  text: 文六重二地之吐生萬物者也二象地之下地之中丨物出形也凡土之屬皆從土臣鍇曰通論詳矣元氣𥘉分輕清陽為天重濁隂為地萬物所陳列也從土也聲臣鍇曰通論詳矣田至反籀文地從􅊟土彖聲地也易之卦也從土申土位在申苦敦反兼垓入極地也從土亥聲春秋國語曰天子居九垓之曰苟孩反四方上下可居者從土奧聲臣鍇按尚書曰四墺既宅嘔報反古文墺如此堣夷在兾州暘谷立春之日值之而出從土禺聲尚書曰宅堣夷元無反朝歌南七十里地也從土母聲周書曰武王與紂戰坶野臣鍇按爾雅注百里之國十里為郊王畿千里郊當百里尚書曰奮于商郊門逐反阪也從土皮聲臣鍇曰謂坂陀也浦何反地平也從土平聲皮命反平遍也從土勻聲堅鄰反柔土也從土襄聲臣鍇按孔安國曰無塊曰壤爾往反堅不可拔也從土高聲臣鍇曰所謂塙埆之地也口肴反磽也從土敫聲臣鍇曰磽謂多小石地口肴反剛土也從盧土聲臣鍇曰尚書下土墳壚然則壚也論孤反赤剛土也從土華省聲悉并反黏土也從土直聲臣鍇曰埏埴用黏土也神息反摩土也從土婁聲臣鍇曰爬螻之使歷歷然勒兜反土塊坴坴也讀若速一曰坴梁地從土走聲臣鍇曰按史奉使賈人贅壻伐南越略取坴梁之地也音六栗菊反土也從土軍聲洛陽有大里户昆反塊也從土菐聲臣鍇按國語楚靈王出亡野人枕之以墣披嶽反墣或從卜墣也從土凵凵屈象形也臣鍇曰指事苦配反俗凷從土鬼􅒘也從土畐聲披式反種也從土㚇聲一曰內其中臣鍇曰種內子于土中也子紅反稻田畦也從土聲臣鍇曰言其直應繩也時興反治也一曰臿土謂之坺詩云武王載坺一曰塵貌從土犮聲臣鉉曰按今詩作伐字步捋反陶竈窗也從土役省聲臣鍇按儀禮曰為投于西墻下今俗作垼與僻反牆姑也從土其聲居而反牆也從土亘聲臣鍇曰垣猶院周繞之意羽元反籀文垣從牆高貌也詩曰崇墉圪圪從土氣聲其氣反垣也五版為堵從土者聲也臣鍇曰一版五尺也得古反籀文堵從􅴹垣也從土辟聲早僻反周垣也從土尞聲臣鍇曰按西都賦㙩以周垣力照反壁間隟也從土曷聲讀若謁魚滅反􅋻垣也從土寽聲臣鍇曰晉王濟馬埒謂于外作短垣繞之也録設反地突歷反棄掃除也讀與糞同從土辨聲翻文反棄也從土帚聲止鍇曰會意思討反存也從土才聲此與坐同意前來反止也從留省從土所止也臣鍇曰會意徂可反古文坐如此著也從土氏聲臣鍇按春秋左傳曰物乃坻伏真彼反塞也從土真聲臣鍇曰毛詩傳箋曰填與鎮同陟陳反安也從土旦聲他但反地相次坒也衛大夫貞子名丘從土比聲臣鍇曰鄰比若今人言毗田也頻至反滯也從土是聲的米反樂器也以土作六孔從土熏聲吁袁反爵諸侯之上也從土之寸寸其制度也公侯百里伯七十里子男五十里臣鍇曰此會意各之其土也敷客反籕文封從半土古文封省王者印也所以王土從土爾聲宥此反籕文璽從王書墨也從土黑臣鍇曰會意沒黑反以黍和炭丸而髹也從土完聲一曰補垣也户反鑄器之法也從土刑聲臣鍇曰鑄器之範俗謂之撲賢星反射臬也從土􅙯聲讀若凖臣鍇曰所謂的也今多借凖蟲閔反雞棲于垣為塒從土時聲臣鍇曰爾雅云鑿垣而棲也市之反以盛民也從土成成亦聲臣鍇按古今注曰城盛也所以盛受人物此會意示征反籕文城從􅴹城垣也從土庸聲臣鍇曰通呼曰城築土壘甓曰墉興封反古文墉如此城土女垣也從土葉聲徒叶反陷也從土欠聲口糝反下也從上執聲舂秋傳曰墊隘臣鍇曰尚書曰下民昏墊丁念反小渚也從土氐聲詩曰宛在水中坁纒伊反坻或從水從久坻或從水耆下入也從土顯聲長立反水乾也從土各聲一曰堅也行赫反以土增大道上從土次聲臣鍇曰字書云此即今瓷字疾咨反古文垐從土即虞書曰龍朕堲讒説殄行堲疾惡也益也從土曽聲走稜反增也從土卑聲頻移反益也從土付聲符注反隔也從土聲叟代反汝潁之間謂致力于地曰聖從又土讀若兔鹿窟臣鍇曰又手也會意怪字從此誇訥反堅土也讀若臮從土自聲其䔬反氣出于土也一曰始也從土叔聲昌伏反堅土也讀若朵從土垂聲兜果反地也從土侵省聲七材反土積也從土聚省聲臣鍇曰今爾雅注書聚字多如此寂煦反保也一曰高土也讀若毒從土壽聲得早反培土田山川從土咅聲臣鍇按春秋左傳分之土田陪敦命以伯禽封于少昊之虛注培增也詩曰錫之山川土田附庸此總兩説也步雷反治也從土爭聲臣鍇曰若今人言屏淨也寂逞反擁也從土章聲止向反過遮也從土則聲察色反地垠也從土㫐聲一曰岸也語殷反或從土斤野土也從土單聲臣鍇按周禮除地為墠石遣反恃也從土多聲天氏反軍璧也從土畾聲柳水反毁垣也從土危聲詩曰乘彼垝句委反垝或從􅊟毁也從土巳聲虞書曰方命圮族方鄙反圮或從手配省非聲塞也從土西聲書曰鮌垔洪水臣鍇按古賦多呼西為先叶韻故得與垔為聲伊倫反西或從􅊟古文垔如此坑土也一曰大也從斬聲七驗反塹穴也一曰大也從土廣聲困盎反秦謂坑為埂從土更聲讀若井汲綆根橫反高燥也從土豈聲臣鍇曰所謂爽塏也刻海反缺也從土毇省聲阡委反古文毁從壬壞也一曰塞輔也從土厭聲馬甲反敗也從土襄聲胡介反籀文壞從文臣鉉云支部有􅭔次立按徐此重出古文壞省坎坷也亭臣鍇從土可聲梁國寧陵有坷曰坎坷不通也則箇反也從土呼聲吼迓反罅或從􅊟裂也從土斥聲詩曰不􅠂不疈欶赫反塵埃也從土夫聲隱唱反塵也從土麻聲臣鍇按楚楚辭曰涉氛霧兮如塺莫播反塵也從土分聲一曰坌大防也臣鍇曰防隄也敷粉反塵也從土非聲符既反塵也從土矣聲遏開反塵埃地從土殹聲幽雞反澱也從土沂聲臣鍇曰按爾雅澱謂之垽注云澤澱也疑斬反濁也從土后聲講吼反天隂塵也詩云㙪㙪其隂從土一聲伊閉反丘再成者也一曰瓦未燒從土不聲臣鍇曰爾雅云也普杯反蟻封也從土至聲詩曰鸛鳴于垤臣鍇按晉史王湛乘王濟馬于蟻封中試之是也亭結反益州部謂蚓埸曰坥從土且聲臣鍇曰蚓場謂曲壇所吐樓地且渠反徒隸所居也一曰女一曰亭部讀若敻從土冒聲激犬反囚突出也從土聲䀶札反喪葬不下土也從土朋聲春秋傳曰朝而堋禮謂之封周官謂之窆虞書曰堋淫于家亦如是此懵反幽薶也從土疾聲于許反畔也為四時界祭其中從土兆聲周禮曰跳五帝于四郊臣鍇曰今周禮作兆假借池沼反墓也從土營省亦聲玄經反丘也從土莫聲莫度反墓也從土賁聲扶去反丘壟也從土龍聲吕恐反祭壇場也從土亶聲特丹反東楚謂橋從土巳聲臣鍇按史記張良所見老父墮其履圯下寅之反祭神道也一曰山田不耕者一曰治榖田從土易聲臣鍇按應璩書述祈雨云拜請靈埸又詩曰十月築場圃寅良反逺邉也從土􅑰聲是吹反瑞玉也上員下方公執桓圭九寸侯執信圭伯執躬圭皆七寸子執穀璧男執蒲璧皆五寸圭以封諸侯從重上楚爵有執圭者臣鍇按周禮注桓圭作雙柱或以為雙瓛形信圭蓋刻為人形躬圭亦為人形榖璧皆為穀蒲形所謂丑玉亦曰五瑞既分之土田又以玉為信也消兮反古文圭從玉兔堀也從土聲臣鍇曰文子兔走歸堀閲字從屈此堀字從九勿反文一百三十二重二十五土之高也從三土几壵之屬皆從壵臣鍇曰纍土故高也研梟反高也從壵在兀上高逺也臣鍇曰帝堯堯德髙逺之意也會意研梟反古文堯文二重一秥土也從黃省從土兄董之屬皆從堇臣鍇曰黃土乃黏也今人謂水中泥黏者為堇伎殷反古文堇亦古文土難治也從重㫐聲亘間反籕文艱從喜文二重三居也從田從土一曰土聲也凡里之屬皆從里臣鍇按尚書曰百姓里居六矣反家福也從里􅫕聲臣鍇按史記曰受釐坐宣室利之反郊外也從里豫聲拽者反古文野從林文三重一陳也樹穀曰田象四口十阡陌之形制也凡田之屬皆從田笛前反田踐處曰可從田丁聲臣鍇曰言平訂訂也王充論衡曰町町若之閭他挺反城下田也一曰田耎郤也從田耎聲臣鍇按史記申屠嘉侵廟田耎垣汝綿反耕治之田也從田􅴣象耕溝田詰屈也陳收反疇或省燒種也從田翏聲漢律田疁田茠草里由反三嵗治田也從田余聲昜曰不畨畬以虛反和田也從田柔柔亦聲也鄭有㽥地名也臣鍇按國語曰依㽥歷華四色名也然尤反殘田也從田竒聲臣鍇曰謂田竒零也斤離反殘田也從田差聲詩曰天方薦㽨殁也昨何反六尺為步百步為畝秦田二百四十步為畝從田每聲莫厚反畝或從十久臣鍇曰十其制久聲天子五百里內田從田包省聲臣鍇曰所謂五百里甸服庭硯反天子千里地􅎧逮近言之則言畿從田幾省聲臣希反田五十畝從田圭聲勻迷反田三十畝從田宛聲臣鍇按楚辭曰余既滋蘭之九畹蔚逺反田界也從田半聲臣鍇按列子曰聽逰于強畔者蒲腕反境也從田介聲苟差反境也一曰陌也趙魏謂陌為䴚從田亢聲格康反兩陌間道也廣六尺從田叕聲臣鍇按西都賦曰畛畷無數禮大蠟祭郵表畷誅説反井田間陌也從田鬒聲支允反經略土地從田各聲臣鍇按春秋左傳曰封畛土略又曰侵敗王略留腳反田相值也從田尚聲得郎反天地五帝所基止祭地也從田寺聲右扶風雍有五畤好畤鄜畤皆黃帝時祭或云秦文公立臣鍇曰祭地所祭之地也直里反農夫也從田夋聲臣鍇曰詩曰田畯至饎于閏反田民也從田亡聲臣鍇曰按詩曰氓之蚩蚩沒宏反轢田也從田粦聲里刃反土也從田丣聲臣鍇曰田猶土也里由反田畜也淮南王曰玄田為畜臣鍇曰畜飬起於微也敕六反魯郊禮畜從兹田兹益也禽獸所踐地處詩曰町疃鹿場從田童聲土卵反不生也從田昜聲臣鍇曰今借此為􅳵茂字丑向反文二十九重三比田也從二田兄畕之屬皆從畕闊九商反界也從畕三其界畫臣鍇曰今周禮疆字如此指事九商反疆或從土弓聲母之兄弟為舅妻之父為外舅從男􅍫聲伎酒反謂我舅者吾謂之甥從男生色行反文三筯也象人筋之形治功曰力能禦大災也凡力之屬皆從力臣鍇曰象人筋竦其身作力徑健之形留置反能成王功也從力聲臣鍇曰按周禮司勳職王功曰勳注輔成王業若周公國功曰功注保全國家若伊尹人功曰庸注法施于人若后稷事功曰勞注以勞定國若禹功治功曰力注制治成法若皋陶戰功曰多注克敵出竒若韓信陳平也詡君反古文勳從員力臣鍇曰古文尚書作此以勞㝎國也從力工聲尹聰反佐也從力且聲牀詛反助也從力非慮聲留御反勞勑也從力來聲臣鍇按詩序曰勞來安集之也勒葉反愼也從力吉聲或曰非力刀也周書曰劼毖殷獻臣讀若覃起八反趣也從力敄聲臣鍇曰言趣赴此事也勿赴反強也從力厥聲瞿月反勉力也從力萬聲周書曰用勱相我邦家讀與厲同謀致反強也春秋傳曰勍敵之人從力京聲虔迎反強也從力巠聲居正反強也從力免聲美選反勉也從力召聲讀若舜樂韶食要反勉也從力胃聲周書曰朂哉夫子臣鍇曰勉其事胃犯而為之也喧六反勉也從力雚聲區怨反任也從力朕聲失稱反發也從力徹徹亦聲恥列反并力也力翏聲臣鍇按春秋左傳曰戮力一必力付反繇綬也從力象聲讀若演以象反作也從力重聲待㧾反古文動從辵推也從力靁省聲臣鍇曰書史謂宋城于城推木石下推木石下推敵謂之㔣魯內反弱也從力少臣鍇曰會意録設反劇也從力熒省熒火燒坰也用力者勞臣鍇曰會意闌刀反古文勞如此務也從力豦聲求許反尤劇也從力聲臣鍇按春秋左傳伐例得雋曰克謂用力多也慳黑反勞也從力賁聲詩曰莫知我豫契反勞也從力巢聲春秋傳曰安用勦民即君反勞也從力類聲臣鍇曰今用倦字無復作此也俱便反勞也從力堇聲伎殷反語相增加也從力口臣鍇按史曰惡聲之加人也會意間巴反健也從力敖聲讀若豪顔叨反氣也從力甬聲臣鍇曰通論詳矣與恐反古文勇從心勇或從戈用排也從力孛聲臣鍇曰勃然興起有所排擠也步咄反劫也從力爂聲臣鍇曰令人言剽劫匹妙反人欲去以力脅止曰劫或曰以力去曰劫臣鍇曰會意居怯反致堅也從人力食聲讀若敕臣鍇按周禮曰審曲面勢以飾五材飾修整之也修飾從巾今俗人多同之由不曉故也暢陟反法有􅓧也從力亥聲侯耐反廣求也從力莫聲莫度反迫也從力強聲巳賞反古文勥從疆文四十重六同力也從三力山海經曰惟號之山其風若劦凡劦之屬皆從劦羊帖反同心和也從劦心臣鍇按尚書曰三后協心羊帖反同思之和從劦思臣鍇曰春秋左傳曰謀協乃行本此字也羊怗反衆之同和從劦十聲古文協從口十叶或從曰臣鍇曰昔越亦發言也已上五字皆會意文一重五説文解字通釋卷第二十六
