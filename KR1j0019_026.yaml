front:
  text: 手執之時乎時不可失疾也會意氣至反常也從心舟在二之間上下一心以舟施恆也臣鍇曰二十一下也心當有常易恆曰四時變化而能久成注曰長陽長隂合而相與可久之道也胡䀶反古文恆從月詩曰如月之恆求豆也從二從回古文回象亘回形上下所求物也臣鍇曰宣字從回風回轉所以宣隂陽也詢全反厚也從二竹聲臣鍇曰二厚也得酷反最括而言也從二二偶其也從了弓古文及字臣鍇曰一一垂及字也符芝反
  hash: sha256:172b447af6ac04356f117533b7aefa6b5bdd0abdfcc2da4fffb771cff4b2813a
