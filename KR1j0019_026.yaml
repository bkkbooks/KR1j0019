body:
  text: 文六重二地之吐生萬物者也二象地之下地之中丨物岀形也凡土之屬皆從土臣鍇曰通論詳矣元气𥘉分輕清陽為天重濁隂為地萬物所陳列也从土也声臣鍇曰通論詳矣田至反籀文地从􅊟土彖声地也易之卦也从土申土位在申苦敦反兼垓入極地也从土亥声春秋國語曰天子居九垓之曰苟孩反四方上下可居者从土奥声臣鍇按尚書曰四墺既宅嘔報反古文墺如此堣夷在兾州暘谷立春之日值之而出从土禺声尚書曰宅堣夷元無反朝歌南七十里地也从土母声周書曰武王與紂戦坶野臣鍇按爾雅注百里之國十里為郊王畿千里郊當百里尚書曰奮于商郊門逐反阪也从土皮声臣鍇曰謂坂陀也浦何反地平也從土平声皮命反平徧也從土匀声堅鄰反柔土也从土襄声臣鍇按孔安國曰無塊曰壤尔往反堅不可拔也从土高声臣鍇曰所謂塙埆之地也口肴反磽也从土敫声臣鍇曰磽謂多小石地口肴反剛土也从盧土声臣鍇曰尚書下土墳壚然則壚也論孤反赤剛土也從土華省声悉并反黏土也从土直声臣鍇曰埏埴用黏土也神息反摩土也从土婁声臣鍇曰爬螻之使歴歴然勒兠反土塊坴坴也讀若速一曰坴梁地从土走声臣鍇曰按史奉使賈人贅壻伐南越略取坴梁之地也音六栗菊反土也从土軍声洛陽有大里户昆反塊也从土菐声臣鍇按國語楚靈王出亡野人枕之以墣披岳反墣或從卜墣也从土凵凵屈象形也臣鍇曰指事苦配反俗凷從土鬼􅒘也从土畐声披式反種也从土㚇声一曰内其中臣鍇曰種内子于土中也子紅反稻田畦也从土声臣鍇曰言其直應䋲也時興反治也一曰臿土謂之坺詩云武王載坺一曰塵皃从土犮声臣鉉曰按今詩作伐字歩捋反陶竈䆫也从土役省声臣鍇按儀禮曰為投于西墻下今俗作垼與僻反牆姑也从土其声居而反牆也從土亘声臣鍇曰垣猶院周繞之意羽元反籀文垣從牆高皃也詩曰崇墉圪圪从土气声其气反垣也五版為堵从土者声也臣鍇曰一版五尺也得古反籀文堵從􅴹垣也從土辟声早僻反周垣也从土尞声臣鍇曰按西都賦㙩以周垣力照反壁間隟也从土曷声讀若謁魚㓕反􅋻垣也从土寽声臣鍇曰晋王濟馬埒謂于外作短垣繞之也錄設反地突歴反棄埽除也讀與糞同从土弁声翻文反棄也从土帚声止鍇曰㑹意思討反存也从土才声此與坐同意前来反止也从留省从土所止也臣鍇曰㑹意徂可反古文坐如此著也从土氏声臣鍇按春秋左傳曰物乃坻伏眞彼反塞也从土眞声臣鍇曰毛詩傳箋曰塡與鎭同陟陳反安也從土旦聲他但反地相次坒也衞大夫貞子名㘳从土比声臣鍇曰鄰比若今人言毗田也頻至反滯也从土是声的米反樂器也以土作六孔從土熏声吁袁反爵諸侯之上也从土之寸寸其制度也公侯百里伯七十里子男五十里臣鍇曰此㑹意各之其土也敷客反籕文封从半土古文封省王者印也所以王土从土爾声宥此反籕文璽從王書墨也从土黒臣鍇曰㑹意没黒反㠯黍和炭丸而䰍也从土完声一曰補垣也户反鑄器之法也从土刑声臣鍇曰鑄器之範俗謂之撲賢星反射臬也从土􅙯声讀若凖臣鍇曰所謂的也今多借凖虫閔反鷄棲于垣為塒从土時声臣鍇曰尔雅云鑿垣而棲也市之反㠯盛民也从土成成亦声臣鍇按古今注曰城盛也所以盛受人物此㑹意示征反籕文城從􅴹城垣也从土庸声臣鍇曰通呼曰城築土壘甓曰墉興封反古文墉如此城土女垣也从土葉声徒叶反䧟也从土欠声口糝反下也从上執声舂秋傳曰墊隘臣鍇曰尚書曰下民昏墊丁念反小渚也从土氐声詩曰宛在水中坁纒伊反坻或从水从乆坻或从水耆下入也从土㬎声長立反水乾也从土各声一曰堅也行赫反以土増大道上从土次声臣鍇曰字書云此即今瓷字疾咨反古文垐从土即虞書曰龍朕堲讒說殄行堲疾悪也益也从土曽声走稜反増也从土卑声頻移反益也从土付声符注反隔也从土声叟代反汝潁之間謂致力于地曰圣从又土讀若兔鹿窟臣鍇曰又手也㑹意怪字从此誇訥反堅土也讀若臮从土自声其䔬反气出于土也一曰始也从土叔声昌伏反堅土也讀若朶从土垂声兠果反地也从土侵省声七材反土積也从土聚省声臣鍇曰今尔雅注書聚字多如此寂煦反保也一曰高土也讀若毒从土壽声得早反培土田山川从土咅声臣鍇按春秋左傳分之土田陪敦命以伯禽封于少昊之虚注培増也詩曰錫之山川土田附庸此緫兩說也歩雷反治也从土爭声臣鍇曰若今人言屏净也寂逞反擁也从土章声止向反過遮也从土則声察色反地垠也从土㫐声一曰岸也語殷反或从土斤野土也从土單声臣鍇按周礼除地為墠石遣反恃也从土多声天氏反軍璧也从土畾声柳水反毁垣也从土危声詩曰乗彼垝句委反垝或从􅊟毁也从土巳声虞書曰方命圮族方鄙反圮或从手配省非声塞也从土西声書曰鮌垔洪水臣鍇按古賦多呼西為先叶韻故得與垔為声伊倫反西或從􅊟古文垔如此坑土也一曰大也从斬声七驗反塹穴也一曰大也从土廣声困盎反秦謂坑爲埂从土㪅声讀若井汲䌄根横反高燥也从土豈声臣鍇曰所謂爽塏也刻海反缺也從土毇省声阡委反古文毁從壬壞也一曰塞𥙷也从土厭声馬甲反敗也从土襄声胡介反籀文壊从文臣鉉云支部有􅭔次立按徐此重出古文壊省坎坷也亭臣鍇从土可声梁國寧陵有坷曰坎坷不通也則箇反也从土虖声吼迓反㙤或从􅊟裂也从土㡿声詩曰不􅠂不疈欶赫反塵埃也从土夫声隠唱反塵也从土麻声臣鍇按楚楚辭曰涉氛霧兮如塺莫播反塵也从土分声一曰坋大防也臣鍇曰防隄也敷粉反塵也从土非声符既反塵也从土矣声遏開反塵埃地从土殹声幽雞反澱也从土沂声臣鍇曰按尔雅澱謂之垽注云澤澱也疑斬反濁也从土后声講吼反天隂塵也詩云㙪㙪其隂从土壹声伊閉反丘再成者也一曰瓦未燒从土不声臣鍇曰尔雅云也普杯反螘封也从土至声詩曰鸛鳴于垤臣鍇按晋史王湛乗王濟馬于螘封中試之是也亭結反益州部謂螾埸曰坥从土且声臣鍇曰螾場謂曲壇所吐樓地且渠反徒隷所居也一曰女一曰亭部讀若夐从土冐声激犬反囚突出也从土声㾗札反喪葬不下土也从土朋声春秋傳曰朝而堋禮謂之封周官謂之窆虞書曰堋淫于家亦如是此懵反幽薶也從土疾声于許反畔也為四時界祭其中從土兆声周禮曰跳五帝于四郊臣鍇曰今周礼作兆假借池沼反墓也从土營省亦声玄經反丘也從土莫声莫度反墓也从土賁声扶去反丘壟也從土龍声吕恐反祭壇場也從土亶声特丹反東楚謂橋從土巳声臣鍇按史記張良所見老父堕其履圯下寅之反祭神道也一曰山田不耕者一曰治榖田从土易声臣鍇按應璩書述祈雨云拜請靈埸又詩曰十月築場圃寅良反逺邉也从土􅑰声是吹反瑞玉也上員下方公執桓圭九寸侯執信圭伯執躬圭皆七寸子執糓璧男執蒲璧皆五寸圭㠯封諸侯從重上楚爵有執圭者臣鍇按周礼注桓圭作雙柱或以爲雙瓛形信圭蓋刻為人形躬圭亦為人形榖璧皆為糓蒲形所謂丑玉亦曰五瑞旣分之土田又以玉為信也消兮反古文圭從玉兔堀也從土声臣鍇曰文子兔走歸堀閱字從屈此堀字從九勿反文一百三十二重二十五土之高也從三土几壵之屬皆從壵臣鍇曰累土故高也研梟反高也从壵在兀上高逺也臣鍇曰帝堯尭徳髙逺之意也㑹意研梟反古文尭文二重一秥土也從黄省從土兄董之属皆從堇臣鍇曰黄土乃黏也今人謂水中泥黏者為堇伎殷反古文堇亦古文土難治也從重㫐声亘閑反籕文艱從喜文二重三居也從田從土一曰土声也凡里之属皆從里臣鍇按尚書曰百姓里居六矣反家福也從里􅫕声臣鍇按史記曰受釐坐宣室利之反郊外也從里予声拽者反古文野從林文三重一陳也樹糓曰田象四口十阡陌之形制也凡田之属皆從田笛前反田踐處曰可从田丁声臣鍇曰言平訂訂也王充論衡曰町町若之閭他挺反城下田也一曰田耎郤也从田耎声臣鍇按史記申屠嘉侵廟田耎垣汝綿反耕治之田也從田􅴣象耕溝田詰屈也陳收反疇或省焼種也従田翏声漢律田疁田茠艸里由反三嵗治田也從田余声昜曰不畨畬以虚反和田也從田柔柔亦声也鄭有㽥地名也臣鍇按國語曰依㽥歴華四色名也然尤反殘田也从田竒声臣鍇曰謂田竒零也斤離反殘田也從田差声詩曰天方薦㽨殁也昨何反六尺為歩百歩為畮秦田二百四十歩為畮从田毎声莫厚反畮或從十久臣鍇曰十其制乆声天子五百里内田从田包省声臣鍇曰所謂五百里甸服庭硯反天子千里地􅎧逮近言之則言畿從田幾省声臣希反田五十畮從田圭声匀迷反田三十畮從田宛声臣鍇按楚辭曰余旣滋蘭之九畹蔚逺反田界也從田半声臣鍇按列子曰聽逰于彊畔者蒲腕反境也從田介声苟差反境也一曰陌也趙魏謂陌為㽘從田亢声格康反兩陌間道也廣六尺从田叕声臣鍇按西都賦曰畛畷無數礼大蜡祭郵表畷誅說反井田間陌也從田㐱声支允反經略土地從田各声臣鍇按春秋左傳曰封畛土略又曰侵敗王略留脚反田相値也從田尚声得郎反天地五帝所基止祭地也從田寺声右扶風雝有五畤好畤鄜畤皆黄帝時祭或云秦文公立臣鍇曰祭地所祭之地也直里反農夫也從田夋声臣鍇曰詩曰田畯至饎于閏反田民也從田亾声臣鍇曰按詩曰甿之蚩蚩没宏反轢田也從田㷠声里刃反土也從田丣声臣鍇曰田猶土也里由反田畜也淮南王曰玄田為畜臣鍇曰畜飬起於微也敕六反魯郊禮畜從兹田兹益也禽獸所踐地處詩曰町疃鹿場從田童声土卵反不生也從田昜声臣鍇曰今借此為􅳵茂字丑向反文二十九重三比田也從二田兄畕之屬皆從畕闊九商反界也從畕三其界畫臣鍇曰今周禮畺字如此指事九商反畺或從土弓声母之兄弟為舅妻之父為外舅從男􅍫声伎酒反謂我舅者吾謂之甥從男生色行反文三筯也象人筋之形治功曰力能禦大灾也凡力之属皆從力臣鍇曰象人筋竦其身作力勁徤之形畱置反能成王功也從力声臣鍇曰按周礼司勲職王功曰勲注輔成王業若周公國功曰功注保全國家若伊尹人功曰庸注法施于人若后稷事功曰劳注以劳定國若禹功治功曰力注制治成法若皐陶戰功曰多注克敵出竒若韓信陳平也詡君反古文勲從員力臣鍇曰古文尚書作此㠯劳㝎國也從力工声尹聦反佐也从力且声牀詛反助也从力非慮声畱御反劳勑也从力來声臣鍇按詩序曰勞來安集之也勒葉反愼也从力吉声或曰非力刀也周書曰劼毖殷獻臣讀若覃起八反趣也从力敄声臣鍇曰言趣赴此事也勿赴反強也从力厥声瞿月反勉力也从力萬声周書曰用勱相我邦家讀與厲同謀致反強也春秋傳曰勍敵之人从力京声䖍迎反強也从力巠声居正反強也从力免声羙選反勉也从力召声讀若舜樂韶食要反勉也从力胃声周書曰朂哉夫子臣鍇曰勉其事胃犯而為之也喧六反勉也从力雚声區怨反任也从力朕声失稱反發也从力徹徹亦声恥列反并力也力翏声臣鍇按春秋左傳曰戮力一必力付反繇綬也从力象声讀若演以象反作也从力重声待㧾反古文動从辵推也从力靁省声臣鍇曰書史謂宋城于城推木石下推木石下推敵謂之㔣魯内反弱也从力少臣鍇曰㑹意録設反劇也从力熒省熒火燒冂也用力者勞臣鍇曰㑹意闌刀反古文劳如此務也从力豦声求許反尤劇也从力声臣鍇按春秋左傳伐例得雋曰克謂用力多也慳黒反劳也从力賁声詩曰莫知我予契反劳也从力巢声春秋傳曰安用勦民即君反劳也从力类声臣鍇曰今用倦字無復作此也俱便反勞也从力堇声伎殷反語相増加也从力口臣鍇按史曰悪声之加人也㑹意間巴反健也從力敖声讀若豪顔叨反气也從力甬声臣鍇曰通論詳矣與恐反古文勇從心勇或從戈用排也從力孛声臣鍇曰勃然興起有所排擠也歩咄反刼也從力爂声臣鍇曰令人言剽刼匹妙反人欲去㠯力脅止曰刼或曰㠯力去曰刼臣鍇曰㑹意居怯反致堅也從人力食声讀若敕臣鍇按周礼曰審曲面勢以飾五材飾修整之也修飾从巾今俗人多同之由不暁故也暢陟反法有􅓧也从力亥声侯耐反廣求也从力莫声莫度反迫也從力強声巳賞反古文勥从疆文四十重六同力也從三力山海經曰惟號之山其風若劦凡劦之属皆從劦羊帖反同心和也从劦心臣鍇按尚書曰三后恊心羊帖反同思之和從劦思臣鍇曰春秋左傳曰謀勰乃行本此字也羊怗反衆之同和从劦十声古文協從口十叶或從曰臣鍇曰昔越亦發言也已上五字皆㑹意文一重五說文解字通釋卷第二十六
