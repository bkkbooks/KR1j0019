  text: 􅀃文解字叙目第二十九
  hash: sha256:e074bc31f136d186138a04970aeb1127da836034139df3fc903f590efe44c998
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_029-1a}
body:
  text: 繫􅀓二十九文林郎守祕書省校書郎臣徐鍇傳釋古者庖犧氏之王天下也仰則觀􅁚於天俯則觀法於地視鳥獸之文與地之冝近取諸身逺取諸物於是始作易八卦㠯垂憲􅁚及神農氏結繩爲治而統其事庶業其繁飭僞萌生黃帝之史蒼頡見鳥獸􅕭迒之迹知分理之可相别異也初造書契百工以乂萬品以察蓋取諸夬夫􅀭于王庭言文者宣教明化於王者朝廷君子所以施祿及下居徳則忌也臣鍇曰按易伏羲氏之王天下始作八卦以田為漁又曰上古結䋲以理後世聖人易之以書契又曰伏羲氏没神農氏作神農氏没黄帝氏作􅀃易者以伏羲為上古然則伏羲雖畫八卦猶結䋲以理諸書皆云倉頡為黄帝史後世聖人即黄帝也而孔氏尚書序云伏羲氏之王天下始畫八卦造書契以代結蝇之政由是文籍生焉伏羲神農黄帝之書謂之三墳蓋孔氏略述書起之由言因伏羲畫八卦視河洛之圗而後文籍孳生其剏文字始自黄帝爾揔迹三皇之道故并言之􅀃者言以結䋲大事以大結小事以小結也獸足通曰號爾雅狐狸迹内麋迹􅄤鹿迹速狼迹迒是鳥獸之足迹各異也作事在於謀始謀始在於作契契之不明乱之所生也故文字為書契而作止訟於未萌然後百官理而万事眀也夫以剛决柔以陽變隂三陽􅀄起剏制理乱之象也故取法焉蒼頡之初作書蓋依􅀋􅁚形故謂之文其後形聲相益即謂之字字者孳乳而寖多也著於竹帛謂之書書者如也臣鍇曰如謂如其事也㠯迄五帝三王之世改易殊體臣鍇曰按黄帝爲五帝首蒼頡所作日月之字即其文歴代必有攺変故周宣王大史籕作大􅂐大體蓋不甚相逺年代縣邈不可盡知按齊蕭子良所撰五十二家書又好奇者随意増之致逺則泥皆妄穿鑿臣不敢言也封丂泰山者七十有二代靡有同焉臣鍇按白虎通王者受命必封禪因高以事天刻石箸已之功業史記封禪書自無懐氏而下則七十二君故其文字随世不同也周禮八􅀊入小學保氏教國子先以六書一曰指事者視而可識察而可見上下是也二曰􅱺形􅱺形者畫成其物隨體詰詘日月是也三曰形聲形聲者以事爲名取譬相成江河是也四曰㑹意㑹意者比􅀋合誼以見指撝武信是也五曰轉注轉注者建􅀋一􅈡同意相受考老是也六曰假􅑅假􅑅者本無其字依聲記事令長是也臣鍇按周礼司徒之属保氏下大夫堂養國子以道乃教之六藝其五曰六書古謂八􅀊􅀄學甲子子方名然後書計少年所學因謂文字為小學及宣王太史籕著大􅂐十五篇與古文或同或異至孔子書六經左丘明述春秋傳皆以古文厥意可得而􅀃其後諸侯力政不統於王臣鍇曰謂周之末世也惡禮樂之害已而皆去其典籍分爲七國田疇異畮車涂異􅁤律法異令衣冠異制言語異聲文字異形秦始皇帝初兼天下丞相李斯乃奏同之罷其不與秦文合者斯作蒼頡篇中車府令趙髙作爰歴篇太史令胡母敬作􅀶學篇臣鍇按漢書藝文志史籕大􅂐十五篇至建武時亡六篇蒼頡一篇上七章李斯作爰歴六章􅀶學七章也皆取史籕大􅂐或頗改所謂小􅂐者也是時秦焼滅經書滌除舊典大發隸卒興役戍官獄職務繁初有隸書以􅃐約易而古文由此絶矣臣鍇曰王僧䖍云秦獄吏程邈善大􅂐得􅓧始皇囚于雲陽増減大􅂐躰去其繁􅃨始皇善之出為御史名其書曰隸書按班固云謂施之于徒隸也如今之隸書而無􅀧畫俯仰之􅀔故曰古隸杜陵秋胡善古隸是也自爾秦書有八體一曰大􅂐二曰小􅂐三曰刻符四曰蟲書臣鍇曰案漢書注蟲書即鳥書以書幡信首􅱺鳥形即下云鳥蟲是也五曰摹印臣鍇按䔥子良以刻符摹印合爲一體臣以爲符者内外之信􅀂晉鄙奪魏王兵符又云借符以罵宋然則符者竹而中剖之字形半分理應别爲一躰摹印屈曲塡宻秦璽文是子良誤合之六曰暑書臣鍇按蕭子良云署書漢高六年蕭何所定以題蒼龍白虎二闕羊欣云䔥何覃恩累月然後題之七曰殳書臣鍇按蕭子良云殳書伯氏之職而古旣記笏亦書殳臣以爲古盤盖有銘几杖有誠故殳有題殳躰八觚隨其􅀔而書之也八曰􅀠書漢興有艸書臣鍇曰按書傳多云張芝作艸又云齊相杜操所作據􅀃文則張芝之前已有矣但不知誰所剏䔥子良云藁書者董仲舒欲言災異藁艸未上即為藁書藁者艸之初也但史記言上官奪屈原藁今亡漢興有艸書知所言藁繫傳藁字並作藁艸是剏詞非是艸書也尉律臣鍇曰尉律漢律篇名學僮十七已上始試諷籕書九千乃得爲吏又以八體試之郡移太史并課最者以爲尚書史書或不正輒舉劾之今雖有尉律不課小學不修莫􅓤其􅀃乆矣孝宣皇帝時召通蒼頡讀者張敞從受之臣鍇案漢書蒼頡多古字俗師失其讀宣帝時徴齊人能正讀者張敞从受之傳至外孫孫子杜林為作訓也凉州剌史杜業沛人爰禮講學大夫秦近亦能言之孝平皇帝時徴禮等百餘人令􅀃文字未央庭中以禮爲小學元士黃門侍􅀰楊雄采以作訓纂篇凡蒼頡已下十四篇凢五千三百四十字群書所載略存之矣臣鍇案蒼頡爰暦慱學通謂之三蒼故并訓纂為四篇又按漢書門里師合三蒼断六十字為一章凢五十五章并為蒼頡篇武帝時司馬相如作凢􅀅篇元帝時黄門令史游作急就篇成帝時􅀅作大匠李長作元尚篇皆蒼頡中正字凢􅀅則頗有出矣雄訓纂者順續蒼頡又易蒼頡中重􅃨之字凢八十九章班固又績楊雄作十三章凢一百二篇及亡新居攝使大司空甄豐等校文書之部自以爲應制作頗改定古文時有六書一曰古文孔子壁中書也臣鍇按前所言自秦興􅀠書古文从此絕矣故此古文是魯恭王壊孔子宅所得世間無之二曰竒字即古文而異者也臣鍇按蕭子良云籕書即大􅂐新臣甄豐謂之奇字史籕増古文為之故與古文異也三曰􅂐書即小􅂐秦始皇帝使下杜人程􅊬所作也臣鍇案漢書李斯等作蒼頡爰暦多取史籕篇而􅂐躰復頗異所謂秦篆然則斯等雖攺史篇而程􅊬復同作也四曰佐書即秦􅀠書五曰繆􅂐所以摹印也六曰鳥虫書所以書幡信也臣鍇曰此即前所謂虫書也壁中書者魯恭王壊孔子宅而得禮記尚書春秋論語孝經又北平矦張倉獻春秋左氏傳郡國亦往往於山川得鼎彛其銘即歬代之古文臣鍇曰若漢汾隂巫得鼎文張敞云􅨈邑得尸臣之鼎有文也彛宗廟之常器樽罍是也皆自相佀雖叵復見逺沬臣鍇曰沬音䏞其詳可得略􅀃也而世人太共非訾以爲好奇者也故詭㪅正文郷壁臣鍇曰郷音向虚造不可知之書變亂常行以燿於世諸生竟逐􅀃字解經􅁩稱秦之􅀠書爲蒼頡時書云父子相􅀓何得攺易乃猥一本作曰馬頭人爲長人持十爲斗䖝者屈中也廷尉􅀃律至以字断法苛人受錢苛之字止句也臣鍇曰言不知而􅀃之也􅀂此者甚衆皆不合孔氏古文繆於史籕俗儒鄙夫翫其所集蔽所希聞不見通學未常覩字例之條怪舊埶而善野言以其所知爲袐妙究洞聖人之微恉又見蒼頡篇中㓜子承詔因曰古帝之所作也其辭有神僊之術焉其迷誤不諭豈不悖哉書曰予欲觀古人之􅁚言必遵修舊文而不穿鑿孔子曰吾猶及史之闕文今亡矣夫蓋非其不知而不問人用已私是非無正巧􅀃邪辭使天下學者疑蓋文字者經藝之本王政之始前人所以垂後後人所以識古故曰本立而道生知天下之至􅄨而不可亂也今叙􅂐文合以古籕􅀶釆通人至亏小大信而有證稽􅁧其􅀃將以理羣􅀋解縁誤暁學者逹神恉臣鍇曰恉音􅈲意􅈲也分别部居不相雜厠也臣鍇曰謂分部相從自慎爲始也萬物咸覩靡木兼載厥􅁩不昭爰明以諭臣鍇曰謂注中多引詩書爲證也其偁易孟氏臣鍇按漢書易有施孟梁丘三家又有周氏服氏楊氏韓氏壬氏丁氏之􅀃今慎取孟氏爲證不同書孔氏詩毛氏禮周官春秋左氏論語孝經皆古文也其於所不知蓋闕如也􅀃文解字通釋第一􅀃文解字通釋第二􅀃文解字通釋第三􅀃文解字通釋第四􅀃文解字通釋第五􅀃文解字通釋第六􅀃文解字通釋第七􅀃文解字通釋第十􅀃文解字通釋第十一􅀃文解字通釋第十二􅀃文解字通釋第十三􅀃文解字通釋第十四􅀃文解字通釋第十五􅀃文解字通釋第十六􅀃文解字通釋第十七􅀃文解字通釋第十八􅀃文解字通釋第十九􅀃文解字通釋第二十􅀃文解字通釋第二十一􅀃文解字通釋第二十二􅀃文解字通釋第二十三􅀃文解字通釋第二十四􅀃文解字通釋第二十五􅀃文解字通釋第二十六􅀃文解字通釋第二十七􅀃文解字通釋第二十八􅀃文解字叙目第二十九
