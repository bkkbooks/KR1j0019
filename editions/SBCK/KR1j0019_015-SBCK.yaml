front:
  text: 未冠也從人童声臣鍇曰禮十五成僮僮子也而童即罪人之子没官供給使者也僮子字從罪人之童者古者質但取其㓜小爾美惡不嫌同辭曰風反養也從人省声曰夫赤子有􅍖􅍖其身之動靜飲食衣服也孚字與孚􅍖反之字為旁紐古者反音為踈故得與􅍖為声然疑多声字孚信也義與􅍖同􅀘老反古文􅍖古文親也從人二声曰并下二字通論詳矣爾申反古文從千心作古文仁從尸二舉蹱也從人止声臣鍇曰止即踵也當言亦声㑹意字山海經有企踵國其人足跟不著地去􅀉反古文從足臣鍇曰足義與止同伸臂一㝷八尺從人刃声爾吝反學也從人士声曰㑹意字鉏里反交也從人交聲臣鍇按詩曰佼人憭􅀆下巧反具也從人声臣鍇曰與􅁧義相近士反冠餙皃從人求声詩曰戴弁俅俅也䖍柔反大帶也從人凡巾佩必有巾從巾巾謂之飾臣鍇曰人凡巾爲佩㑹意也蒲妹反柔也術士之稱者也從人需声臣鍇曰柔弱也又儒之言愞也禮曰君子難進而易退老子曰知其雄守其雌似於愞也而攻堅強莫之能勝夾谷之㑹是也荀况謂周公爲大儒張華曰有通儒碩儒愚儒竪儒鄙儒臣鍇以爲通儒道無不通則聖人也仲尼之謂也碩儒其學廣大孟軻之儔也腐儒講誦其􅀃至于熟腐而道則不􅁼此荘周所謂糟粕也愚儒守一不移孔子所謂古之愚也􅀡能肆而不能詘也竪儒猶章句之學儒家之役使也竪伇使之名也子夏之門人灑掃應對進退可矣本之則無如之何鄙儒所見僻狹所謂窮郷多異曲學多論諸子之中有按尚書曰湯聿求元聖與之戮力元聖謂伊尹也阿􅀝也衡平也依􅀝而取平也尹正也所􅀝正人也俗夲有声字誤也因之反古文伊從死死亦声臣鍇曰古文死字婦官也從人予声臣鍇曰婦官謂倢伃也以虚反志及衆也從人公声之松反慧也從人睘声臣鍇曰諸輕薄察慧小才也故荀卿子曰郷曲之儇子張衡南都賦曰儇才齊敏授爵傳觴虚全反安也從人炎声讀􅀂談臣鍇曰倓猶憺然平安之意杜南反倓或從剡疾也從人旬声臣鍇按史記曰黄帝㓜而侚齊猶疾也蘇徇反宋衛之間謂華僷僷從人葉声臣鍇曰亦輕薄之皃也華音驊僷猶估佔也亦接反善也從人圭声占膎反竒侅非常也從人亥声臣鍇按史記苟孩反偉也從人􅄦声周禮曰大傀異災臣鍇按周禮大傀異災謂日月食山川崩壅也公恢反傀或從玉褢声臣鍇曰謂􅅛寳也竒也從人韋声臣鍇曰人材傀偉也于毀反文質備也從人分声論語曰文質份份臣鍇曰文質相半也彼囷反古文份從彡林从焚省声好皃從人尞声臣鍇曰詩曰佼人僚􅀆力反威儀也從人必声詩曰威儀佖佖頻必反具也從人孨声讀􅀂汝􅀯潺水虞書曰方鳩僝功也臣鍇曰此已具之具非方􅀅具之之具也􅂇服反長壮儠儠也從人巤声春秋傳曰長儠者相之是也臣鍇按杜預左傳注長鬣多湏也左氏春秋但許愼在杜預左傳注長鬣前故所引則義或與今注有異也力涉反行皃從人声詩曰行人臣鍇曰行動之皃彼消反行有節也從人難声詩曰佩玉之儺臣鍇曰佩玉所以節歩奴何反順兒從人委声詩曰周道倭遲也於佳反􅈺皃從人䝿声臣鍇曰嫺閑雅也順也簡易也通猥反高也從人喬声􅇊昭反大也從人矣声詩曰伾伾俟俟曰此􅀡訓大也竚俟字􅇃史反大皃從人同声詩曰神時侗臣鍇按字書長大也又未成器之名又痛也土蒙反正也從人吉声詩曰既佶且閑臣鍇曰方正也臣乙反大也從人呉声詩曰碩人俁俁元羽反大腹也從人工声讀􅀂紅臣鍇曰人言禮身体仜大也􅀒聦反病也從人單声周禮曰句兵欲無僤臣鍇曰速疾也徒岸反㐾也從人建声其獻反強也從人京声渠命反倨也從人敖声五號反勇壮也從人气声也周書曰声詩曰倬彼雲漢也臣鍇曰卓然高明也著音竹慮反輟角反長皃一曰著地一曰代也從人廷声臣鍇曰著亦竹慮反􅅇頲反輔也從人朋声讀􅀂陪位之陪臣鍇曰義取于明輔冩誤多声字又人姓漢書有南山羣盗倗宗薄弘反熾盛也從人扇声詩曰傓方熾臣鍇曰人􅁠力相成􅀂火之相扇也當言扇亦声詩􅁺反戒也從人敬声春秋傳曰儆宫臣鍇按尚書儆戒無虞巳皿反善也從人叔声詩曰令終有俶一曰始也臣鍇按爾雅曰俶落􅁠輿始也昌伏反均􅀡也從人庸声臣鍇按詩曰昊天不傭敕容反仿佛也從人愛声臣鍇曰見之不明也禮曰僾然有見乎其位晏反相似皃從人方声臣鍇曰不明也分敝反籕文從丙見不諟也從人弗声臣鍇曰諟諦也分勿反声也從人悉声讀􅀂屑臣鍇曰僁屑有声也先列反精謹也從人幾声明堂月令曰數􅀅僟終臣鍇曰幾近月也功也故為精詳數􅀅僟終此僟即切也近也明堂月令即今禮記月令未刪定前也古天子居明堂布政毎月告朔班一月之政令故曰明堂月令居希反負何也從人它声臣鉉等按史記匈奴竒畜有橐佗今俗譌誤謂之駱駝非是徒何切何也從人詹声臣鍇曰此即儋何字齊田儋是也兠貪反儋也從人可声一曰誰也臣鍇曰商頌百禄是何又爾雅河鼓謂之牽牛注云謂之儋鼓儋是何為􅀒何也今俗多上去声音不必爾也閑俄反誤也從人共聲一曰供給也臣鍇曰春秋左傳曰君謂許不供是也矩重反待也從人待声臣鍇曰漢書張忠為孫寳設儲偫物以待須索也􅀡里反􅁸也從人乍声臣鍇按周禮曰坐作進退是也憎記反非眞也從人叚声一曰至也虞書曰假于上下臣鍇曰訓至亦同音賈而已無煩音格也格雅反假也從人音声資昔切漸進也從人又持帚􅀂埽之進也㑹意按史記封禪書曰稍侵㝷漸進之意也七林反見也從人声臣鍇曰周禮借為貨賣字賣音育融六反伺望也從人矦声臣鍇曰􅃸守封疆吏也周禮郊有􅃸館國語􅃸不在􅆠寒豆反還也從人賞声臣鍇按史記曰伐王償債是也庻張反才能也從人堇声臣鍇曰僅能如此是財能如此則纔才裁皆財借為始字才始詞也本借無正字推覆象義用才則義皆可纔最為䟽也其櫬反更也從人弋声臣鍇曰迭代也弋音近特故得以弋為声也徒再反度也從人義義亦声威儀之形臣鍇曰度法度也孔子曰禹聲爲律身爲度布指知尺舒肱知㝷周旋中規折旋中榘頭圜象天足方象地􅤑方枕䋲趨中釆齊行中陔夏声中黄鐘㑹朝言知聞于表著上天之載無声無􅆨儀刑文王萬􅀖作孚人者天地之靈聖人之靈也唯人可爲法度義者事之宜也故言從人義義亦声研之反近也從人旁声曰近之也薄荒反象肖也從人吕声臣鍇曰肖即似也今人於其右加人也詳紀反安也人有不便更之故從人更臣鍇曰此㑹意婢篇反􅍖也從人任声曰相保任也爾音反譬論也一曰聞見從人見声詩曰俔天之妺臣鍇按詩篇譬猶天有姉也此㑹意苦硯反饒也從人憂声一曰倡也又俳優者臣鍇曰饒寛􅁉也衣􅀹反樂從人喜声臣鍇曰至于從女即爲嬉戯也軒其反完也逸周書曰不明以俒伯父從人完臣鍇曰逸周書在三百篇之外也胡頓反冨也從人春声此準反約也從人僉声其閃反善也從人介声詩曰价人維藩苟瘵反習也從人谷声臣鍇曰俗之言續也傳相習也夕燭反克也從人子声臣鍇按詩曰佛時仔肩則欺反安也從人声臣鍇曰億猶抑也安也依色反郷也從人靣声禮少儀曰尊壼者偭其鼻臣鍇曰郷謂微向非正向也故史記本紀曰項籍謂司馬童曰卿非我故人乎馬童面之注云面謂微背之也弭釧反今也從人吏声瑟耳反左右兩視從人癸声帔季反送也從人灷声吕不韋曰有侁氏以伊尹㑞女古文以此為訓字以證反緩也從人余声曰與徐字義同􅃍也從人􅆫也子念反頗也從人扁声僻連反狂也從人長声一曰仆臣鍇曰狂妄也韓詩外傳曰老而不學者如無燭而夜行倀倀然是也禇良反惛也從人薨声呼能反翳也從人夀声臣鍇曰儔古與翿同義隠翳也今人音稠匹儷也陳収反有壅蔽也從人舟声詩曰誰侜予羙陵求反淺也從人戔声臣鍇按詩曰小戎俴􅀵也寂衍反中也從人田声春秋傳曰乗中佃一轅車臣鍇曰佃訓中也古載物大車雙轅乗車一轅當中也庭硯反小皃從人囟声詩曰彼有屋七紫反小皃從人光聲春秋國語曰侊飰不及一食是侊侊然小也骨庚反愉也從人兆声詩曰視民不佻臣鍇曰輕佻苟且也土彫反辟也從人辟声詩曰宛然左僻一曰從旁牽也臣鍇曰辟避也佚民從人失声一曰佚忽按忽者猶倐忽也秋七反善也從人䚻声自􅀜以西物大小不同謂之㑾臣鍇曰物大小不同則􆄍逺也延朝反儌􅵍受屈也從人郤声臣鍇曰􅵍困劇也言見傲􅃒困劇則受屈也此許愼全引司馬相如上林賦之文其雀反行頃也從人我声詩曰側弁之俄臣鍇按張衡曰曜靈俄景則是斜景也偶和反醉舞皃從人欺声詩曰屢舞僛僛臣鍇曰僛欹傾也遣之反醉舞皃從人􅐔声詩曰屢舞傞臣鍇曰傞猶參差也先多反傷也從人毎声臣鍇曰侮慢昜字也勿甫反古文從母臣鍇曰從母声也輕也從人易声一曰交㑥臣鍇曰人所為輕易也引義反妎也從人􅍚声一曰毒也臣鍇曰㑵害也秦室反或從女作臣鍇曰女無羙惡入宫見妬士無賢不肖入朝見嫉訟靣相是也從人希声臣鍇曰靣從相質正也疑當言從稀省声赩豈反偃也從人畺声九商反僵也從人賁声臣鍇曰春秋左傳曰鄭伯也車僨子濟也符訓反頓也從人卜声弗儒反僵也從人匽声衣逺反剌也從人肴声一曰毒之臣鍇曰􅍚害也秦交反創也從人省声式陽反備詞從人夸声坤􅀲反相擣也從人崔声詩曰室人交偏催我臣鍇曰擣相迫蹙也此􅁅反痛也從人甬声土蒙反伺也從人犬伺人也臣鍇曰㑹意也伐六反迫也從人足声超欲反比也從人􅍌声里曵反絜束也從人系声已惠反擊也從人持戈一曰敗也亦斫也扶月反人召聲臣鍇曰􅀃者多言晋已前言昭自晋文帝名昭故改昭穆為佋穆據􅀃文則為佋文作韶則非晋已後改明矣士遥反神也從人身聲式人反長生者僊去也從人䙴声息遷反人在山上皃從人山許延反牜為蠻夷也從人􅁄声臣鍇按周禮北方曰􅈎也朋比反南方焦僥人長三尺短之極也從人堯声臣鍇曰夫子之言也研梟反帀也從人對聲得悔反逺行也從人狂聲臣鍇曰此與廷義同也溝唱反分也從人從牛牛大物故可分其輦切
