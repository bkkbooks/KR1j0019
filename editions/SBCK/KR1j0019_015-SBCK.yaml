body:
  text: 文二百四十五重十四變也從到人凡匕之屬皆從􅎅臣鍇曰通論僃矣呼跨反未定也從匕声古矢字臣鍇曰多聞闕疑也銀眉反仙人變形而登天也從􅎅目􅎅􅡊隱字也八所以乗載之臣鍇曰通論僃矣止鄰反古文眞聲臣鍇曰亦所乗載也敎行也從人從匕匕亦聲臣鍇曰匕變匕也化敎化也匕之在人也呼跨反文四重一相與比叙也从反人􅎅亦所以用比取飯一名柶凡匕之屬皆从匕卑履切􅎅也從􅎅是声是支反相次也從􅎅十鴇字從此一曰十臣鍇曰保即保飬也即官有保傅字五家為也使之相次比也十其揔率也此㑹意􅀘老反傾也從􅎅支声詩曰彼織女臣鍇曰傾側其首而望也􅀂言有頍者冠則者頭不正言織女常傾首以冠也去􅀉反頭不正也從匕從頁臣鉉等曰􅎅者有所比附不正也去營切頭髓也從􅎅􅎅相著也巛以象髮囟象形奴道反望也欲有所及也從􅎅卩詩曰高山仰止曰此匕亦傾首望也卩亦庻也㑹意顔當反高也早匕為㔬􅎅阝為卭背同義竹角切古文㔬狠也從􅎅目􅎅目猶目相匕不相下也易曰㫐其限􅎅目為㫐為眞臣鍇按周易止也狠戾不進之意也以目􅎅相齊不相下也此㑹意姦恨反文九重一相聽許也從二人凡从之屬皆從从臣鍇曰言計相聽也許謂從諌也自邕反乖也從二人相背凡北之屬皆從北臣鍇曰乖者相背違也古人云追奔逐北逐其亡者􅀘或反北方也從北異声臣鍇曰冀州北方之州也訖示反文二土之高非人所為也從北從一一地也人居在丘南從北中􅀖之居在崑崙之東南一曰四方髙中央下為丘象形凡丘之屬皆從丘臣鍇曰天地自然也起秋反古文從土臣鍇曰土亦地也大丘也崑崙丘謂之崑崙虚古者九夫為井四井為邑四邑為丘丘為之虚丘声忻余反反項受水丘也從丘從泥省泥亦声臣鍇曰反頂謂凡地人頂當高今反下故曰反頂白虎通曰孔子反宇象尼丘山謂四方高中央窊下也尼即泥也禰倪反文三重一衆立也從三人凡乑之屬皆從乑臣鍇曰今謂衆立不動為乑也銀欽反多也從乑從目目衆意臣鍇按國語曰人三為衆衆數成於三止宋反㑹也從􅏨取聲一曰邑落曰聚臣鍇按漢地理有郷有聚也寂煦反衆辭與也從􅏨自聲虞書曰臮咎繇也其冀反古文文四重一厚也從壬東声凡重之屬皆從重臣鍇曰壬者人在土上故為厚也柱用切稱輕重也從重省曏省声臣鍇曰曏音向枝昌反古文文二重一休也從人臣取其伏也凡臥之屬皆從臥臣鍇曰人臣之事君俯僂也所謂䇿名委質禮曰寢不尸展四體避不祥也㑹意吳貨反臨下從臥省声臣鍇曰安居以臨下監之也文帝謂汲黯曰誠得君臥而治之姦巖反古文監從言監臨從臥品声臣鍇曰與監同意力㝷反楚謂小兒􅈸飱從臥食臣鍇曰謂不樂於食也今俗人謂􅈸爲此㑹意女革反文四重一躬也象人之身從人􅛣聲凡身之屬皆從身式人反軆也從身區聲臣鍇曰泛言曰身舉四軆曰軀軀猶區域也器于反文二歸也從反身凡之屬皆從臣鍇曰人之身有爲常外向趣外事故反身爲歸也古人多反身修道㑹意於機反臣鍇曰樂由中出人心和然後樂和故從從殳意斤反文二􅀃文解字通釋卷第十五
