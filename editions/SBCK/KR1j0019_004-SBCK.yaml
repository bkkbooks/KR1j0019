front:
  text: 書曰文王惟正之供反正不供也故曰乏符法反
  hash: sha256:929d3ae4135fa407084ab3e5a479bbef3d4c14b568be80a9f223ec186fe8aa94
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_004-1a}
body:
  text: 文二重二直也從曰正凡是之属皆從是臣鍇曰日中爲正是一直不移也善􅁓反籕文是從古文正是也從是􅅊聲春秋傳曰犯五不韙于虺反籕文韙從心是少也尟俱存也從是少賈侍中說臣鍇曰是亦正也正者少則尟也思典反文三重二乍行乍止也從彡從止凡辵之属皆從辵讀􅀂春秋公羊傳曰辵階而走臣鍇曰辵行也故曰乍行乍止也今公羊傳辵作躇禇芍反歩處也從辵亦聲子壁反籕文迹從朿或從足責無違也從辵舝聲讀􅀂害恒艾反先道也從辵率聲踈宻反逺行也從辵萬聲臣鍇曰尚書日月逾邁是逾逺也謀敗反邁或從蠆延行皃從辵巛聲續倫反恭謹行也從辵㲃聲讀芳九㡬栁反歩行也從辵士聲田吾反行邎徑也從辵䌛聲臣鍇曰路有所由也延秋反正行也從辵正聲臣鍇曰謂从正道行也􅀂王者巡狩正也狩河陽非正行也乍行乍止偵也天子必五歳卜征詳習乃行眞名反延或從彳臣鍇曰胤往征之正其罪也從也從辵隋聲似吹反行皃也從辵市聲歩􅀅反往也從辵王聲春秋傳曰子無我迋臣鍇按春秋傳伯有迋勞於黄屋于况反往也從辵折聲讀􅀂誓時制反往也從辵且聲退齊語全徒反籕文從虘䢐或從彳循也從辵木聲臣鍇按禮曰父作之子述之是也常出反籕文從秫循也從辵尊聲蹤民反之也從辵啻聲適宋魯語失易反度也從辵咼聲古多反習也從辵貫聲臣鍇按春秋左傳曰使盈其遦當作此字古患反媟䢱也從辵賣聲臣鍇曰不以禮自近也馳谷反登也從辵閵省聲子印反就也從辵告聲譚長􅀃造上士也臣鍇按禮有造士也雌報反古文造從舟臣鍇曰天子造舟越進也從辵俞聲周書曰無敢昏逾羊朱反䢔也從辵眔聲臣鍇按史記曰魚鱗雜遝煙至風起謂䢔遝並進也道合反遝也􅀙辵合聲徔閤反迮迮起也􅀙辵作省聲滓白反迹道也􅀙辵昔聲操各反往来數也􅀙辵耑聲易曰以事遄往臣鍇曰遄猶摶也駛易也市縁反疾也􅀙辵束聲孫卜反古文􅀙敕言臣鍇曰言行速如言之易到也籕文􅀙敕臣鍇按史記有魏遬其名如此疾也􅀙辵卂聲思進反疾也􅀙辵昏聲讀與括同古活反迎也􅀙辵屰聲関東曰逆関西曰迎臣鍇曰春秋左傳莒慶来逆叔􅁎言碧反逢也􅀙辵卭聲疑卿反會也􅀙辵交聲臣鍇曰往来交㑹也如肴反逢也􅀙辵禺聲臣鍇曰遇之言相偶也又諸矦冬見天子曰遇疑豫反遇也􅀙辵􅔟聲一曰邐行臣鍇曰值也遭猶帀也􅀂物帀相值也祖叨反遇也􅀙辵冓聲臣鍇曰遘猶結構也理當相對也格漚反遇也􅀙辵峯省聲臣鍇曰逢言􅀂蠭飛奄忽相見附松反相遇驚也􅀙辵㖾㖾亦聲臣鍇曰㖾即遇也五各反道也􅀙辵由聲臣鍇按尚書惠迪吉又為引道之道也田溺反更易也􅀙辵虎聲笛計反逹也􅀙辵甬聲士􅀩反迻也􅀙辵止聲宵此反古文徙徙􅂉􅀙彳臣鍇曰􅀙有所之也遷徙也􅀙辵多聲臣鍇曰止士移居之迻當用此以支反登也􅀙辵䙴聲臣鍇曰身隨遷移故􅀙辵先古文遷􅀙手西迻徙也從辵軍聲臣鍇按荘子曰天其運乎地其處乎天道回轉迻易也于問反還也􅀙辵反反亦聲啇書曰祖甲􅝭臣鍇曰人行還也府暁反春秋傳􅝭從彳復也􅀙辵睘聲户剛反遣也􅀙辵巽巽遣之巽亦聲一曰選擇也臣鍇曰亦選擇之意思􅂐反遣也􅀙辵省臣鍇曰即送也峻弄反籕文不省縦也􅀙辵聲喫善反行邐邐徔辵麗聲臣鍇曰漸迂邪也略迤反唐逮及也􅀙辵隶聲臣鍇按爾雅逮及曁與也又遏遾逮也又曰迨及也義皆相通也徒再反徐行也􅀙辵犀聲詩曰行道遲遲纒伊反籕文遲􅀙屖遲􅂉從􅊂臣鍇曰􅊂音夷聲徐也􅀙辵􅀺省聲臣鍇曰傅毅舞賦曰邌収而拜謂徐収其舞勢也里西反去也􅀙辵􅅁聲笛計反行皃􅀙辵􅘢聲挾蓮反馬不行也􅀙辵聲讀􅀂住陟具反止也􅀙辵豆聲臣鍇按史記漢軍法有逗留笛奏反曲行也􅀙辵只聲起逆反逶迤邪去之皃従辵委聲委為反􅂉􅀙虫為迥避也􅀙辵矞聲臣鍇曰遹猶况也囘沈之意㳙律反囘也􅀙辵辟聲便詈反離也􅀙辵韋聲字非反行難也􅀙辵粦聲易曰以往遴里刃反􅂉􅀙人復也􅀙辵夋聲七賔反恕不進也一曰鷙也徔辵氏聲的反行不相遇􅀙辵幸聲詩曰佻􅀆逹􅀆騰剌反達或􅀙大􅂉曰迭臣鍇按王褒洞簫賦云順叙卑达行謹逯逯也􅀙辵彔聲慮木反迵迭也􅀙辵同聲頭貢反更迭也􅀙辵失聲一曰迭亭結反惑也􅀙辵米聲莫泜反邪行也􅀙辵也聲夏書曰東迆北㑹于匯以爾反員連臣鍇按椘辭曰遒白露之為霜字由反逎或􅀙酋附也􅀙辵斤聲渠遴反古文近臣鍇曰此與歬同意搚也􅀙辵巤聲律捷反近也􅀙辵白聲不白反近也從辵􆃵聲臣鍇曰􆃵音日而吉反近也従辵爾聲而俾反古文邇微止也􅀙辵􅂚聲讀􅀂桑虫之蝎臣鍇曰繳繞使止也故慱物志曰響遏行雲厄渇反遏也􅀙辵庻聲之已反􅃒䢭也􅀙辵羡聲余羡反迾也􅀳趙曰迣從辵世聲讀􅀂寘正曵反􅃒也􅀙辵􅍌聲臣鍇按顔延之赭白馬賦曰進迫􅃒迾良舌反進也􅀙辵干聲讀􅀂干古寒反過也従辵侃聲豈䖍反連遱也從辵婁聲臣鍇按淮􅀯子有連遱之言猶參差零瓏􅀂連若絶之意也勒兠反極也從辵􅩎聲則先反高平之野人􅀁登従辵备录闕原臣鍇按水􅀁出為原故即爾雅廣平曰邍今周禮有邍師猶此邍字爾雅則變為原也許慎闕之義不盡知臣鍇以為人􅀁登故従辵登而上故􅀙攵攵止也春秋左傳曰原田毎毎詩曰周原膴膴故従田未知何故􅀙录也言􅀽反所行道也從辵首一逹謂之道臣鍇曰􅀁行道此道字當作今導字之意餘則通論詳矣徒討反古文道従首寸傳也従辵豦聲一曰窘也臣鍇曰傳馹車也故禮曰大夫􅁛慱遽之言傳車尚速故又爲窘迫也伎絮反獸迹也􅀙辵亢聲臣鍇按爾雅􅇣迹為迒也􅁪湯反迒或従足更至也従辵弔聲臣鍇按尚書曰惟弔兹不于我正人得罪惟至茲也今文尚書借弔字顛逖反行垂崖也從辵臱聲辟涓反遷也一曰逃也従辵盾聲臣鍇按尚書敫髙宗曰旣乃遁于荒野是遷于荒野也當作此遁今文尚書借遯字徒寸反文一百一十八重三十臣次立曰今重二十七􅀘遺蟡僯二字共重二十九小歩也象人脛三属相連凢彳之属皆從彳臣鍇曰微􅇍也故相連属也丑赤反升也􅀙彳㥁聲臣鍇曰内得於心曰徳升聞曰徳尚書曰玄徳升聞通論詳矣多則反􅇍道也􅀙彳巠聲臣鍇曰小道不容車故曰􅇍道今之移路故巫馬期行不由徑又趙㐮以壷飡従徑又秦公曰􅁒爲容車之徑以窺三川謂徑大時容車也居正反往来也從彳夏聲臣鍇曰往来爲復故􅀙彳相連也伐六反復也􅀙彳柔柔亦聲臣鍇曰猶蹂也往来蹂踐之也人紂反􅈳行也􅀙彳呈聲丑郢反之也􅀙彳聲臣鍇口音皇丈两反古文􅀙辵行皃從彳瞿聲羣紆反往有􅀁加也􅀙彳皮聲臣鍇曰彼者據此而言故曰有􅀁加郡是反循也􅀙彳敫聲臣鍇曰循猶繞也堅蕭反急行也􅀙彳及聲飢泣反行順也􅀙彳盾聲臣鍇曰史記云拊循其民續倫反行皃􅀙彳歰聲一曰此與馺同臣鍇曰今人言㒊沓是也速沓反􅀮行也􅀙彳聲春秋傳曰白公其􅀙微之臣鍇曰􅀮於物而行也曹植洛神賦曰蘭之芳藹􅀆􅇍躊躇於山隅又􅀦語曰􅀳公子駢脅鄭伯設微簿􅀚之也尾希反徥徥行皃也􅀙彳是聲爾雅曰徥尾則也臣鍇按爾雅曰是則也注云是事可法則也今爾雅作是臣鍇曰行事則可為法則也是支反安行也􅀙彳余聲臣鍇按詩曰其虚其徐又古􅀦本􅀙邑亦通作徐徐顓頊後其裔孫生大業大業生臯陶臯陶生伯益臯陶之後為士師為李氏伯益之後分封為徐在東海却東方仁方也有君子􅀦故孔子欲居九夷至偃王一曰􅀮王王仁諸侯歸之王不􅀎距遂君之周穆王聞而自西荒逃歸王不忍聞以太王之義而去之使周穆不失􅀦􅀮王之力也乃東之海中潢池得地千里而居之以化其民為仁義故徐氏有四望高平北海彭城東海而以東海為上望也徐者舒緩之名也故其後雖為武未嘗無君子之風徐宣立盆子是也然則古徐字雖作䣄其義出於此字也似虗反行平易也􅀙彳夷聲臣鍇曰老子曰大道具夷此字也寅之反使也􅀙彳䛣聲臣鍇曰猶抨也篇丁反使也􅀙彳夆聲讀若􅑣臣鍇曰猶夆也夆掣曵使之也甫蛩反跡也􅀙彳戔聲寂衍反附行也􅀙彳旁聲臣鍇按周禮牛有牽徬以載牽向前引之也徬自旁微驅之也盤浪反待也􅀙彳奚聲臣鍇按尚書曰徯予后是也亦啓反徯或従足也􅀙彳寺聲􅄬在反行㣙㣙也􅀙彳由聲臣鍇曰行平易不止也田溺反帀也􅀙彳扁聲臣鍇曰帀行之也比薦反至也􅀙彳叚聲臣鍇曰易曰王假有廟格雅反却也􅀙彳曰攵一曰行遲臣鍇曰日日見攵是過也土妹反􅂉􅀙内古文􅀙辵遲也􅀙彳幺攵者後也臣鍇曰幺猶躓之也此㑹意與􅅲同旱斗反古文後􅀙辵乆也􅀙彳􅙈聲讀若遅敵圭反不􅃪􅀙也一曰行難也􅀙彳㫐聲一曰盭臣鍇曰盭戾也宋義曰狠如羊羊之性愈牽愈不進遐懇反相迹也􅀙彳重聲臣鍇按荘子曰踵門而詫篇慶子是也之勇反行有所得􅀙彳㝵聲多則反古文省彳舉脛有渡也􅀙彳竒聲臣鍇曰爾雅石杠謂之徛注聚石水中為􅇍渡彴也臣鍇按耶溪澗夏有水冬無水䖏横木為之至冬則去今曰水彴橋牽其反行示也􅀙彳匀聲司馬法斬以臣鍇曰且斬且行以令扵衆也今人作徇詢順反均布也􅀙彳聿聲臣鍇曰十二律均布節􅂔故有六律六均留茟反使馬也􅀙彳卸臣鍇曰卸解車馬也彳行也􅂉行􅂉卸皆御者之職也㑹意午慮反古文馭􅀙又馬臣鍇曰㑹意􅇍止也􅀙彳讀若畜臣鍇曰左思魏都賦曰澤馬亍􅎧丑録反文三十七重七長行也􅀙彳引之凡廴之属皆􅀙廴臣鍇曰彳而引之故曰長行以矧反朝中也從廴壬聲臣鍇曰朝中其道長逺也故􅀙廴由丁反行也􅀙廴正聲臣鍇曰長行眞名反立朝律也􅀙聿􅀙廴臣鍇曰聿律也定法也周禮曰惟王䢖􅀦䢖長世之法惟曰欲至于萬年惟王子子孫孫永保民也機獻反文四安􅇍􅵫㢟也􅀙廴止凡􅵫之属皆􅀙􅵫臣鍇曰旣引而止相莭調之故曰安行戴孚廣異記曰嵩陽􅀚西賦門閭洞達頭貢反跡也􅀙行戔聲臣鍇按論語曰不踐迹亦不入扵室也寂衍反行皃􅀙行吾聲臣鍇按椘辭曰導飛廉之衙衙今謂列儀衛衙義同疑舉反行喜皃􅀙行干聲騫罕反行且賣也􅀙行言臣鍇按崔駰曰叫呼􅸹廻茜反􅸹或􅀙玄􅀅衞也從行率聲踈律反宿衛也􅀙􅅊帀行行列衛也臣鍇曰韋周圍也此㑹意干􅀊反文十二重一口齗骨也象口齒之形止聲凡齒之属皆􅀙齒臣鍇曰口齗骨齒也赤里反古文齒字臣鍇曰䑕字􅀙此齒本也從齒斤聲語斤反毁齒也男八月生齒八歳而齔女七月生齒七歳而齔􅀙齒􅍰聲楚近反齒相值也􅀙齒責聲一曰齧也春秋傳曰晢䶦臣鍇曰春秋左傳謂東郭晢而衣貍製謂齒縫上下相對也爰測反齒相齗也一曰開口見齒之皃􅀙齒柴省聲讀若柴臣鍇曰齒不齊也測皆反齒相切也􅀙齒介聲指夬反口張齒見􅀙齒只聲擬件反齒差也􅀙齒兼聲臣鍇曰齒左右出也五緘反齒搚也一曰馬口中糜也􅀙齒芻聲一曰齰也側丘反齒不正也從齒禺聲臣鍇曰齒偏也五溝反齬齒也􅀙齒虘聲臣鍇曰亦齒參差聲側已反齵也􅀙齒取聲臣鍇曰齱齵是也側立反齒參差􅀙齒差聲楚冝反齒差跌皃􅀙齒佐聲春秋傳曰鄭有子殘他反缺齒也一曰曲齒􅀙齒聲讀又若權衢貟反無齒也􅀙齒軍聲愚藴反缺齒也從齒獻聲臣鍇曰今人言缺齾也五􅆩反齗腫也從齒巨聲俱取反老人齒􅀙齒兒聲臣鍇按詩曰黄髮齯齒擬西反齧也從齒竒聲臣鍇按春秋傳有卜齮魚􅀝反齚齒也􅀙齒出聲仕乙反齧也􅀙齒㫺聲鉏客反齰􅂉從乍齧也從齒咸聲工咸切齧也􅀙齒艮聲起簡反齒見皃􅀙齒干聲五版反齚也從齒卒聲昨猝反齒分骨聲從齒列聲讀􅀂剌勒遏反齧骨也從齒交聲五􅀲反齒差也從齒屑聲讀􅀂切七屑反齒堅聲從齒吉聲赫鎔反牙也􅀙齒豈聲偶来反吐而噍也􅀙齒台聲爾雅曰牛曰齝臣鍇曰齝將咽復吐出嚼之式其反齧也從齒气聲臣鍇按禮曰食􅀲庻人齕之胡兀反齒見皃􅀙齒聮聲鄰延反噬也􅀙齒㓞聲語挈反齒傷酢也􅀙齒􅀁聲讀􅀂椘櫬訐反老人齒如􅍫􅀙齒􅍫聲馬八歳齒􅍫也臣鍇曰今人謂馬齒為齒齨􅇊酒反齒不相值􅀙齒吾聲疑舉反羊粻也􅀙齒世聲臣鍇曰粻粮食也爾雅注江東呼齝曰臣鍇以為貯食扵頰漸泄咽之私列反鹿麋粻􅀙齒益聲臣鍇按爾雅注江東名咽為齸齸者齝食之􅀁在臣以為近扵咽也伊昔反齒堅􅀙齒至聲知疾反齧骨聲􅀙齒骨聲胡刮反噍聲􅀙齒昏聲舌劼反噍堅也􅀙齒慱省聲臣鍇按爾雅注或謂為本泊反文四十四重二牡齒也象上下相錯之形凡牙之属皆􅀙臣鍇曰比扵齒為牡也古文牙武牙也􅀙牙竒竒亦聲牽冝反齒蠧也􅀙牙禹聲臣鍇按後漢書孫夀􅀎齒􅀏曲矩反􅂉􅀙齒文三重二人之足也在下従止口凡足之属皆従足臣鍇曰口象股脛也節栗反足也從足虒聲臣鍇按爾雅書􅕭字如此俗作蹄敵圭反足踵也従足艮聲茍痕反跟或從止足踝􅀙足果聲户把反足下也􅀙足石聲臣鍇曰足底也真石反一足春秋左傳曰舉趾髙心不固矣其雀反疾也長也􅀙足攸聲臣鍇曰此亦倐忽字尺竹反動也􅀙􅁕倉聲臣鍇曰詩曰巧趨蹌􅀆猜常反跳也􅀙􅁕甬聲礜恐反登也􅀙􅁕齊聲啇書曰若予顛躋臣鍇按尚書曰由賔階躋子􅅺反迅也􅀙􅁕翟聲㣧畧反蹴也􅀙􅁕全聲一曰卑也絭也臣鍇按魯靈光殿賦曰狡兎跧㐲扵柎側鄒牷反躡也􅀙􅁕就聲臣鍇按張衡南都賦曰排揵䧟局蹴蹋咸陽音竹反踐也􅀙足􅛑聲徒盍反蹈也􅀙􅁕聶聲安懾反渡也􅀙􅁕夸聲苦夜反踐也􅀙􅁕舀聲徒號反踐也􅀙􅁕㕓聲臣鍇曰星之􅄤次星􅀁􅂂行也茶連反􅂂也􅀙足戔聲臣鍇按尚書序成三旣伐東夷遂踐奄奄中􅀦天子無􅀁不賔亦無􅀁剪㓕故言踐􅀂履行之而已寂衍反追也􅀙􅁕重聲一曰往来皃臣鍇曰猶言繼踵也之甬反踶也􅀙􅁕卓聲臣鍇曰踶亦當蹋意也荘子曰夒踸踔一􅁕蹋地重也知敎反踶也􅀙足帶聲當柰反踶也􅀙足敞聲一曰跛也臣鍇曰荘子曰蹩􅍷為仁小行也脾迭反䠟􅁕也􅀙􅁕執聲臣鍇曰足爕䠟然連蹋也顏延之赭白馬賦曰望朔雲而䠟足今俗作蹀田俠反尌也􅀙􅁕氏聲善􅁓反住足也􅀙足啇聲􅂉曰蹢躅賈侍中􅀃足垢臣鍇按易曰羸豕蹢躅遅夕反蹢躅也􅀙足蜀聲􅁺曲反躗也􅀙􅁕是聲臣鍇按左思魏都賦曰雲雀踶甍笛計反衞也􅀙足衞聲于歳切觸也􅀙􅁕卒聲一曰駭也一曰蒼踤昨沒反僵也􅀙􅁕厥聲一曰跳也讀亦若橜臣鍇按吕氏春秋曰蹷痿之機此仆也又曰狐猨聞而蹶往遇之則跳也俱越反蹷或徔闕蹷也􅀙足兆聲一曰躍也笛遼反動也􅀙􅁕辰聲止鄰反跱䠧不前也徔􅁕屠聲臣鍇曰詩云愛而不見搔首跱䠧也陳諸反跳也􅀙􅁕弗聲附勿反椘人謂跳躍曰蹠􅀙足庻聲臣鍇曰淮南子曰獸蹠實而走眞石反馭也􅀙􅁕荅聲他合反跳也􅀙􅁕䍃聲延朝反進足有􅀁擷取也􅀙􅁕及聲爾雅曰趿謂之擷臣鍇曰擷摘也速呇反歩行躐跋也􅀙􅁕具聲臣鍇曰躐礙也跋草行也􅀘㑹反跲也􅀙足質聲詩曰載躓其尾臣鍇曰謂􅅲則摺礙其尾也陟利反躓也􅀙􅁕合聲居怯反述也􅀙足世聲臣鍇按漢書天馬歌曰超容與跇萬里此行也􅂉􅀙辵音逝丑世反讀􅀂逵臣鍇曰􅶐音逵權雖反足跌也􅀙足委聲烏過反足親地􅀙足先聲思典反天寒足跔也􅀙足句聲臣鍇曰䈥遇寒不舒也卷于反􅏿足也従足困聲臣鍇曰足遇寒裂曰􅏿故漢書曰天寒士卒皸􅏿堕指者什二二苦衮反雞距也従足巨聲求許反舞履也􅀙足麗聲臣鍇躧履謂足根不正納履也長門賦曰躧履起而彷徨史記曰邯鄲女子跕躧履舞者足騰不正納也踈比反或徔革足􅀁履也􅀙􅁕叚聲痕加反跀也􅀙􅁕非聲讀若匪臣鍇曰剕也斧尾反斷足也從足月聲臣鍇曰足見断為跀其刑名則刖也元伐反跀􅂉従兀曲脛馬也徔足方聲讀與彭同曰亨反馬行皃􅀙足決省聲臣鍇按班固西都賦曰要趹追蹤也橘穴反獸足企也從足幵聲臣鍇按爾雅騉􅕭趼善升甗注云騉蹏似牛臣以為指蹏駢而足跟企舉故能升甗従山形上大下小也魚見反道也􅀙足各聲臣鍇曰通論詳矣勒妬反蹎跋也􅀙足犮聲歩捋反轢也從足粦聲力淮反足多指也􅀙􅁕支聲臣鍇曰荘子􅀁謂枝指也翹移反文八十六重四足也上象腓膓下􅀙止弟子職曰問疋何止古文以為詩大疋字亦以為足字􅂉曰胥字一曰疋記也凡疋之属皆從疋臣鍇曰腓脛中膓也弟子職禮篇也詩大疋即音雅疋記也則音䟽師阻反門户䟽窓也􅀙疋囱囱象形讀􅀂跙臣鍇曰古言綺䟽也指亊色居反通也徔爻疋亦聲臣
