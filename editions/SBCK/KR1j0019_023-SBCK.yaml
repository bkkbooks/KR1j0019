body:
  text: 文二鳥飛從髙下至地也從一一猶地也象形不上去而至下来也人至之属音從至臣鍇按禮曰玄鳥言之也戰媚反古文至至也從至刀声都告反至也從至秦声側詵反忿戾也從至至而復孫孫遁也周書曰有夏氏之民叨讀若摯同臣鍇曰今尚書作懫借也此㑹意陟利反到也從三至而吉反􅀚四方而高者也從至高省與室屋同意之声臣鍇按春秋公羊傳曰諸侯臺門謂築土為門也兩􅀚于臺上更為重屋田咍反文六重一鳥在巢上也象形曰在西方而鳥西故因㠯為東西之西也凡西之属皆從西臣鍇曰此本象鳥棲也斯低反古文西臣鍇曰􅁲亦象鳥也籕文西俗西從木妻姓也從西圭声臣鍇按張􅀃梁四公記有䙵勺迷反文二重三西方鹹地也從西省困象鹽形安定有鹵縣東方謂之西方謂之鹵凡鹵之属皆從鹵臣鍇按史記曰大抵東方食鹽西方食鹽鹵春秋左傳晋有大鹵之地安定在晋也爾雅注齊有海濵廣斥也又河東解縣鹽池有印鹽方如印齒文也勒古反鹹也從鹵差省河内謂之沛人言若虚臣鍇按禮鹽曰殘陀反衘也北方味從鹵咸声俟彡反文三鹹也從鹵監声古者夙沙􅀄作煑海鹽凡鹽之屬皆從鹽臣鍇按夙沙黄帝臣也西方有鹽井也羊㢘反古河東鹽池袤五十一里廣七里周百一十六里從鹽省古声臣鍇按今靈慶也昆覩反鹵也从鹽省僉声魚欠切文二護也半門爲户象形凡户之属皆從户臣鍇按禮曰􅀅上堂声必􅀭􅀅入户視必下桓土反古文從木屝也從户翅省臣鍇曰象鳥之翅㑹意詩椽反户扇也從户非声臣按春秋左傳曰入于扉中甫肥反室在旁也從户方声臣鍇按秦築宫于驪山之旁曰阿房宫也浮長反輜車旁推户也從户大声讀與釱同臣鍇曰謂車中狹不容轉扉傍壁為扇推而開閉也徒詩反隘也從户乙声臣鍇曰戸小門也晏索反外􅐬之開也從户冋声臣鍇曰古人言外户是也居屏反始開也從户聿声臣鍇曰声字􅀙此與必反户牖之間謂之㦿從户衣声臣鍇曰禮注云若今屏風也殷豈反閉也從户省声枯蹋反文十重一聞也從二户象形凡門之属皆從門臣鍇按尚書闢四門明四目所以廣聞見也莫魂反天門也從門昌声楚人名門閶闔臣鍇按楚詞叫帝閽使開􅀜􅀆􅀝閶闔而望予潘岳賦夢良人來逰若閶闔􅀆洞開此則通名爲閶闔今人或者但謂天門為閶闔誤矣醜􅀅反宫中之門也從門韋声字歸反䦲謂之樀樀廟門也從門詹声臣鍇曰今俗作擔羊廉反巷門也從門尢声臣鍇按春秋左傳曰高其閈閎混耕反特立之户也上員下方有似圭從門圭圭亦声㳙亐反門旁户也從門合声苟合反樓上户也從門􅛑声他榼反門也從門干声汝南平與里門曰閈侯玩反里門也從門吕声周禮曰五家爲比五比爲閭閭侶也十五家相群侶也連于反里中門也從門臽声臣鍇曰史記李斯以閭閻入事羊廉反閻或從土市外門也從門䝿声胡塊反城内重門也從門垔声詩云出其闉闍臣鍇曰若今門外壅城門也伊倫反闉闍也從門者声丁通反門􅀚也從門厥省声臣鍇按中央闕而爲道又古今注人臣至此則思其所闕盖爲二臺于門外人君作樓􅀚于上上貟下方以其闕然爲道謂之闕以其上可逺􅀚以其縣法謂之象魏書名也區越反門欂櫨也從門弁声皮變反門扉也從門介声古拜反門扉也從門盍声一曰閉也臣按春秋左傳曰旋于門中以枚數闔謂以鞭數扉之版也􅀱臘反門梱也從門臬声魚滅反門榍也從門或声論語曰行不履閾臣鍇曰門限也于抑反古文閾從洫門高也從門良声巴郡有閬中縣来宕反開也從門辟声頻役反虞書曰闢四門從門從􅦁開也從門單声易曰闡幽昌善反闢門也從門為声國語曰䦱門而與之言于委反張也從門幵声渇才反大也從門可声大柸亦為閜臣鍇曰書傳多云豁閜也許下反開閉門也從門甲声鸎甲反閉門也從門必声春秋傳曰閟門而與之言筆媚反所以止扉者從門各声臣鍇按爾雅弋長者謂之閣所以止扉即今云門頰扇所附著也根莫反隟也從門從月臣鍇曰夫門當夜閉閉而見月光是有間隙也豆閑反古文閒如此門傾也從門阿声􅁖可反􅃒壅也從門於声臣鍇曰按史記書壅閼字如此憂歇反開閉門户利也從門利也從門絲声或曰縷十絃也職沇反門声也從門􅂚声乙鎋反門響也從門郷声臣鍇按爾雅兩階間謂之䦳注人君南䦳當階閒也許文反門􅃒也從門東声勒湌反䦨也從門中有木臣鍇按昜曰閑邪存其誠陶潜有閑情賦謂闌止其情􅁒也㑹意候艱反闔門也從門才所㠯距門臣鍇曰才木也㑹意辟桂反外閉也從門亥声偶代反閉門也從門者声歐欽反㠯木横持門户從門􅳑声古還反開下牡也從門􅕛声臣鍇曰今人作鑰也胤略反盛皃也從門眞声臣鍇曰詩云振旅闐闐􅅇前反闛闛盛皃也從門堂声特郎反竪也宫中閹閹閉門者也從門奄声於劒反常㠯昏閉門􅀠也從門昏声喧盆反閃也從門䂓声去䂓反妄入宫掖也從門􅒋声臣鍇曰律所謂闌入也勒飡反声也從門古文下字讀若軍􅞽之􅞽臣鍇曰二字短下晝為字字從此遅悞反闚頭門中也從人在門中臣鍇曰㑹意施塹反具數于門中從門兊声臣鍇曰春秋曰大閱簡車馬也具數一一數之也今人言伐閱謂歴數其門中之功伐也與缺反事巳閉門也從門癸声傾雪反望也從門敢声臣鍇按詩曰進厥武臣闞如哮虎闞進且望也苦濫反䟽也從門活声苦末反弔者在門也從門文声眉引反古文閲從思馬出門皃從馬在門中讀若郴臣鍇按春秋公羊傳曰左右舉大􅐤而至開之闖然公子楊生也敕䲴反開也从門豈声苦亥切文五十七重六主聴也象形凡耳之属皆從耳柔以反耳垂也從耳下垂象形春秋傳曰秦公子耴耴者其耳垂也故㠯為名臣鍇曰以晋景公黒臋之􅀋言之也此指事陟聶反小垂耳也從耳占声丁􅄈反耳大垂也從耳冘声詩曰女之耽􅀆覩貪反耳曼也從耳冉声臣鍇曰耳無輪郭也他甘反聃或從甘垂耳也從耳詹声南方有瞻耳國多談反耳著頰也從耳烱省声杜林􅀃耿光也從光聖省声凡字皆左形右声耿光􅀃非是臣鍇曰耿耿經侹昭著之皃故曰耿耿不􅄰又耿介也尚書以覲文王之耿光今按鳥部多右形左声不知此言後人加之邪􅀅傳冩失之邪根杏反連也從耳耳連于頰從􅁝􅁝連不絶也臣鍇曰周禮官府之聮事謂大事非一官所了者衆共成之也㑹意鄰延反耳鳴也從耳卯声臣鍇曰楚辭曰耳􅂓耿而未止梨桃反通也從耳呈声詩令反察也從耳忽声麤中反聆也從㥁從耳從壬声他寧反􅃪也從耳令声連丁反記微也從耳哉声臣鍇按周禮國有六職皆主記事之微也章􅀡反讙語也從耳昏声臣鍇曰春秋左傳太子痤聒而與之語古活反張耳有所聞也從耳禹声俱取反音也從耳殸声臣鍇曰通論詳矣識征反知声也從耳門声云反古文聞從昏訪也從耳甹声臣鍇曰聘訪問之以耳也匹併反無聞也從耳龍声来充反生而聾曰聳􅀙耳從省声思奉反益梁之州謂聾爲聘秦晋􅃪而不聦聞而不逹謂之䏁從耳宰声臣鍇曰不全聾也柤殆反生聾也從耳䝿声臣鍇曰謂從生即聾也五臾反聵或從㕟或從豙作無知意也從耳出声讀若孽誅貀反墮耳也從耳月声元伐反呉楚之外凡無耳者謂之􅫣從耳闋声讀若斷耳為盟臣鍇曰言缺􅫣也五滑反安也從二耳寸帖反軍法㠯矢貫耳也從矢從耳司馬法曰小罪䀢之中罪刖之大罪剄之臣鍇按春秋左傳曰貫三人耳恥列反附耳􅀻小語也從三耳臣鍇曰一耳就二耳也史記曰乃效兒女子呫聶耳語女懾反文三十二重四頷也象形凡􅒳之属皆從􅒳臣鍇曰􅁎􅊉亦從此寅之反篆文􅒳從頁臣鍇曰􅃌事籕文􅒳從廣􅒳也從􅒳已声臣鍇曰􅄉字從此寅之反古文􅒳從户臣鍇曰今人言戺階戺也文二重三豈䖍反舉手下手也從手壹声臣鍇按潘岳賦率軍禮以長撎伊肆反推也從手㐮声然荘反首至地從手攀声音忽具壞反臣鍇曰進趣之疾也故拜從之古文拜從二手􅀭雄說拜從两手下拱也從手僉声臣鍇曰按今人以此為撿字檢押從木作也留琰反歛手也從手共声臣鍇曰尚書桑榖生太戊之朝七日大拱拱兩手大指頭指相住也矩悚反搯捾也從手官声一曰援也烏末反搯捾也從手舀声周書曰師乃搯搯者㧞兵刃以習擊剌詩曰左旋右搯臣鍇曰今詩作左旋右抽偷力反擁也從手巩声矩悚反排也從手隹声土回反推也從手夋声春秋傳曰捘䘙侯之手臣鍇曰排擠之也七賔反佐也從手夫声凡無反卓反古文握如此提持也從手單声讀若行遲驒驒持丹反握也從手巴声􅀘冩反牽引也從手奴声一曰巳也女加反提也從手巂声勺迷反拈也從手耴声丁帖反挈也従手是声敵圭反也從手占声年兼反舒也從手离声臣鍇曰以手舒之也丑离反釋也從手舍声式且反一指按也從手厭声于帖反下也從手安声㤙肝反引也從手空声詩曰控于大􅀖匈奴名引弓控弦寛宋反取易也從手寽声一曰劣也魯掇反理也從手尞声梨桃反剌内也從手臿臣鍇曰㑹意也楚反置也從手昔声臣鍇曰周易曰茍措諸地可矣倉玄反擇也從手侖声一曰從手貫也臣鍇按周禮入山林劳昆反摩也從手盾声臣鍇曰史淮南王拊揗其民食尹反縁也從手􅂏與絠反拊也從手有声普百反揗也從手付声分武反把也從手咅声今鹽官入水取鹽曰掊臣鍇曰詩曰曽是掊克歩矛反掇也從手合声常入反拾取也從手叕声都撮反引取也從手孚声詩曰原隰捊矣歩侯反捊或從包自􅀜㠯東謂取曰揜從手弇声一曰覆也依漸反予也從手受声常岫反奉也受也從手卪取臣鍇曰卪節也上有節下承奉之尚書􅀃命曰敢不承受君之明德視澄反給也一曰約也從手臣声章信反拭也從手堇声巳郡反朋羣也從手黨声胡莽反交也從手声節攝反㨷也從手市声普未反􅗙引也從手同声漢有挏馬官作馬酒臣鍇按漢書百官表謂取馬乳作酒頭貢反手呼也從手召声也臣鍇按春秋左傳皮冠以招虞人眞遥反安也從手無声一曰掇也一曰循也臣鍇曰尚書撫于五辰循于五時分武反古文撫從亡辵簡選也從手睪声澄赫反搤也從手足声一曰握也臣鍇曰春秋左傳曰叔武聞君至投髮走出今或借作握氊岳反捉也從手益晏索反長也從手延声臣鍇按詩曰松桷有挻賖延反搣也從手前声一曰竊也臣鍇按春秋左傳楚王曰姑揃搣此借翦字子善反批也從手烕声彌恱反也從手此声側抳反撮也從手鞫省声堅祝反撮取也從手帶讀若詩螮煉之螮的替反摕或從折示兩手急持人也古文摕從止辵臣次立曰今􅀃文井李舟竊韻下載徙字如此撫也從手昬声一曰摹也眉均反量也度高下曰揣一曰捶之也從手耑声􅀄委反開也從手只声讀若抵掌之抵眞彼反習也從手貫声春秋傳曰摜瀆􅀑神古患反擿也從手殳声特婁反搔也從手􅃴声一曰􅄬也臣鍇按列子曰指擿無痕痒知白反括也從手蚤声素叨反括也從手介声工八反擊也從手爂声一曰挈鑰壯也臣鍇按春秋左傳長水之斃無不摽也頻小反挑也從手夬声縈節反撓也從手兆声一曰摷争也春秋國語曰郤至挑天土彫反㦸狗也從手居声臣鍇按詩予手拮据傳曰㦸拘也謂手執臂曲局如㦸不可轉也堅踈反㦸持從手局声俱燭反掲也從手害声閑刮反刮也從手葛声一曰撻也古鎋反拓果􅀣實也從手啻声一曰􅃌近之也他狄反抲撝也從手可声周書曰盡執柯獻虎何反蹔也從手斬声昨三反摺也從手劦声一曰擸也虛業反敗也從手習声之渉反束也從手秋声詩曰百禄是揫臣鍇按爾雅束聚也即由反曵也聚也􅀙手婁声勒兠反有所失也從手云声春秋傳曰抎子辱矣臣鍇按吕氏春秋秦穆公之甲抎者七禮今注傳作隕于惲反從旁持曰披從手皮声臣鍇曰周禮曰􅂘執披史記無不披靡謂四向而散也坯卑反引也從手翟声臣鍇曰謂㧞擢也朱握反引縱曰􅪴從手声臣鍇曰周易曰牛􅪴今作挈唱曵反積也從手此声詩曰􅂇我舉㧘一曰搣頰旁也賛􅀉反搖也從手卓声春秋傳曰尾大不掉地料反動也從手声延朝反動搈也從手容声臣鍇曰溶動也淮南子動搈無形之域與恐反當也從手貳声直致反聚也從手酋声即由反固也従手攺声讀若詩曰赤舄掔掔臣鍇按史記倉公傳曰信即掔車轅未忍渡苦閑反奉也從手夆声甫反對舉也從手與声臣鍇曰㑹意以盧反舉出也從手欣声春秋傳曰掀公出于淖忻元反上舉也從手升声易曰抍馬壯吉只磽反折或從登高舉也從手􅂚声臣鍇曰周禮曰書而揭之豈例反舉救也從手辰声一曰􅁬也章信反横􅀜對舉也從手工声臣鍇按神僊子曰宋人患苗不長而揠之也厄戞反手推也從手壽声一曰築也得早反係也從手􅒋声㠯貟反抜也從手廷声􅅇鼎反拔取也從手寒声楚詞曰朝㩃批之木蘭豈䖍反逺取之也從手突声臣鍇曰突音脫他含反探也從手覃声臣鍇曰周禮有撣人陀闇反推也從手委声一曰兩手相竊摩也臣鍇按詩注澣濯煩捼之事是也奴戈反別也從手敝声一曰繫也僻噎反把也從手鬲声讀若戹晏索反搹或從戹揺也從手咸声侯坎反按也從手弱声女伯反偏引一曰踦也從手奇声臣鍇按春秋左傳譬如捕鹿諸戎掎之居綺反􅁬也從平軍声火韋反伎也從手干声侯玩反研也從手麻声没訛反摩也從手研声禦堅反反手擊也從手声臣鍇按春秋左傳􅔊而殺之篇􅀆反亂也從手覺声詩曰祗攪我心根夘反推擣也從手茸声而擁反卂擣也從手童声臣鍇曰東方朔曰以莛撞宅􅀖反擠也從手崔声一曰挏一曰折也臣鍇曰挏推動也徂回反擠也從手非声歩乖反排也從手齊声子計反擠也從手氐声的米反就也從手因声臣鍇按易因而重之今此㧢扔字皆作因仍也伊倫反因也從手乃声而􅀿反絜也從手昏声臣鍇按周易曰括囊無咎古活反撝也從手辟声八麥反裂也從手爲声一曰手指撝喧垂反裂也從手赤声麾擭反易筮再㧍而後卦從手力声􅀰忒反巧也從手攴声強􅀝反䂓也従手莫門胡反不巧也從手出声燭恱反縫指㧺從手沓声讀若眔一曰韋縚臣鍇曰今射㧺縫衣所用捍鍼也以韋為之也道合反圜也從手專声杜酸反手推之也從手圂声胡兀反四圭也從手最声亦二指撮也臣鍇按漢律暦志以量者不失圭撮村奪反盛也于􅂻中也從手求声一曰擾也詩曰捄之陾陾臣鍇曰􅂻盛土之器也卷于反手口共有所作也從手吉声詩曰予手拮据臣鍇曰以手反口各舉衣䘳之一角也經節反掘也從手骨声胡兀反搰也從手屈声瞿弗反歛也小上曰掩從手奄声依漸反滌也從手旣声詩曰摡之釡鬵苟代反取水沮也從手胥声武威有婿次縣旁擊也從手敫声牽料反疾擊也從手勺声得了反笞擊也從手失声臣鍇按春秋左傳曰歜以戈抶職暢七反側声也從手民声臣鍇按史記曰抵掌而談梁到漑見廣絶交論扺凡于地貞彼反以車鞅擊也從手央声殷仰反衣上擊也從手保声布偶反兩手擊從手卑声北買反以杖擊也從手垂声或曰摘也職累反敲擊也從手崔声刻學反中擊也從手竟声一竟反過擊也從手弗声臣鍇曰擊而過之也分勿反擣頭也從手堅声讀若論語鏗􅈛舎琴而作懇耕反􅀷擊也從手冘声讀若告言不正曰抌竹甚反傷擊也從手毀声吁委反攴也從手毄声臣鍇曰攴撲也堅歴反扞也從手亢声香浪反抌或文二百六十六重二十吕也象脅形也凡之屬皆從讀若乖徐鍇曰膐肉也呂即膂字骨淮反吕也從肉從津易反文二􅀃文解字通釋卷第二十三
