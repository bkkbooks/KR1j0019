body:
  text: 於從政乎何有騷曰山中人􅀆芳杜若此皆氣之轉也詩曰母也天只不諒人只語曰吾無隱乎爾此皆語之餘也文者心之圖以曲盡爲能也君子之言也舒其節也審聽其音息而知其意况聞其言乎聞其嗚嘆足以感人之性况觀其行事乎是故周人觀晉使曰客容猛非􅀕焉而周公善聽不言之􅀃也於者始也古之烏字也異盛氣以發言也故象氣之烏聚今試言烏則氣自口出而分散且衆者詞言之气從鼻出與口相助故象口之氣左右出而上合也爾也者亦辭之助故從之􅈛者詞之必然猶云如此也􅀂禮曰鼎鼎􅈛猶猶􅈛在句之下故象入而丨左右分今試言􅈛則口氣直出旁四散而盡也音枳者語巳辭也故象口氣下引之形在句之外今試言只則下脣収而气下出而微也者曳詞之難􅀂春秋曰公至河有疾乃復又曰郊牛之口傷乃免牲皆巾有事而攺非便止故加乃以緩之容有謀也故象气之出難今試言乃則气緩而迃也詞也故從口􅡊􅡊氣上出也與粤異粤於也上有所連曰直發端而已故气自上出無所閡粤從亐亐上閡於一也故虞書之首云曰若稽古帝堯帝舜也或難曰漢洪範云曰雨曰霽豈是上無所連臣應之曰豈得不然此先言卜五占用二緫舉其綱紀然後別發端云曰雨曰霽每一曰則文斷而自爲首也粤於也故曰粤若來三月皆連上文難者曰王延壽云粤若稽古帝漢粤字豈有所連臣又應曰延壽之賦實摸引尚書本當作曰相承假借爲粤非實字也丂者气欲舒出丂上閡於一也古文以爲􅀆字今試言丂則氣出口而上其聲上而不逺故欲舒而上閡也故今􅀆字從之􅀆者詞之所考也􅀂言羙人􅀆西方之人􅀆慎疑審事言必稽考用駐其詞義近於粤在句之中語之曲折也今試音訶則气􅳵而無閡猶訶也故從可肯也既可則聲􅳵而通也故可從以言可之也者詞之舒也詩曰曽是莫聽曰者詞也今試言曽則气直出口而分故象之也者詞之況也書曰矤内史友外史友况譬當勁疾故從矢矤亦抽引之詞故從引省今試言矤則气直激而疾也者語巳詞也詩曰何嗟及矣誰昔然矣語曰賔不頋矣皆事之訣絶無所奈何者也矢者亦所以訣絶不復返之意也今試言矢則气亦直而出也几此數者皆虚也激去不返而尤疾也者詞也憭也􅁴也􅁴知之欲其􅄩故從矢心術之深非眀者不能見故以口則易知也今試言知則气亦直而激也凢此數者皆虚也無形可象故擬其口气之出入舒疾髙下聚散以爲之制也若夫緩詞而象於箕云發語而本於气夫扶為民夫之借焉有烏鳥之名􅈛同人體爲兼禺屬何爲􅀒儋斯則析薪爲薏爲蛇巳􅀂此之􅀋皆兼實名則取象自别也然則詞之虚立與實相扶物之受名依詞取義云之出气則紛然雲撓其之發口則哆矣箕張推此求之餘可知矣此皆詞之􅀋也此六府也昔伏羲之卦文之􅀄也蒼頡沮誦知結繩之不可以乆也仰觀俯察始爲文盖皆象形此六者是也五行者天之五佐德之大者也故皆象之米人所以生也則榖也者麻之􅀋也人所以衣也故專象之水之則無復詰屈而流故犆象其凝結之形也火則無變矣合抱之木生於豪末故木生於木之􅀄也土爲隂隂數二土以重厚爲德張華曰凢土三尺已上爲壤三尺已下爲土故土必重所以名土者吐也能生萬物故象二之有所出也金生於土左右注皆金也米者象左右粟粒也不從於所以貴也此六者有形之主而六者之孳益不可勝載也後之賢者隨義而益之故有字凢物之大者略巳象之爲文矣後之字皆孳合而爲之亦不能及逺故也是之謂六府之􅀋也夫地之所載土之自出土之鎮也萬物之育也精气之宅也故象之出雲以利天下河􅃳九里餘三百歩澤之大也故亦象之攺邑不攺井八家共井所以飬也故犆象也者山崖之可居也古始變􅔙居或依山而居重人之所居亦同象之亦宫室之象也此五者之孳化亦不可勝也是之謂地􅀋也夫仰則觀象於天日月是巳皆不獨存皆上屬於天雲象其決鬱回復於天之下雨亦象其自雲而下也故犆象之是之謂天􅀋也夫有生莫靈於人故手足皆象之亦象也覆者用􅀲仰則見掌故反􅀲爲亦象其冠帶之形人之日月也人之體也人之元也故犒象之是之謂人􅀋凡四者之􅀋出之也夫鳥者羽族之通名也中有犆焉烏日中之禽也感孝而至舄者知􅀊之所在􅀊者福也俚語曰干舄噪則行人至然則祥鳥也燕者識啓閉之候鳯者百禽之長膺仁背義腹信翼順擇地而翔有德而下延首􅁬翼五光備舉詩曰鳯凰于飛翽翽其羽故象其羽翼森纚沃若之形也焉出江淮之際亦竒禽也則未知今爲何鳥焉皆鳥之貴也故取象之是之謂羽族之屬凡羽族之􅀋出之也十日者治暦之本也象東北十三月之時陽始欲出正其體然上有所冒者二月之後乹然已出矣冒險而出其出難故乁然詰屈也爲四月已出而内外皆炤炳然而正内外之分也爲五月其體丁壯象其正身無所屈撓爲六月戊象居中五方相句絞相成也巳正身在中四顧望也爲七月萬物成實故象實之著乎枝幹也爲八月物已成而未熟隂气未極陽气未萌無復象似萬物將収縮白露制物故取萬物之見焦殺􅀂獲􅓧然也者十月十一月之交也隂陽􅀄交壬象物之上下相交受也者十二月之時也土反其宅水歸其壑土縮其壤水収其潦故象水自四方流入内也此十幹之􅀋也古文酉右十二次也人含陽以生者人之􅀄也象陽之􅀄起於􅀊十一月嬰兒之象也爲十二月陽氣彌長有爲之時也天造草昧建侯而不寜象人之手有爲陽用力爲之隂用力以制之皆象用手也爲十三月陽謀成而出隂惡甚而力擯之西伯戡􅀺之時耶故象陽衝隂而出上有冒也爲二月陽逾強隂不能制故象陽開出也爲三月陽气長而未盛無可以象故從乙乙物出也人人加功之時也二上也星在上也二古上字上畫短下畫長爲聲此形聲字也爲四月巳爲蛇蛇之變化成文章正陽之月文明之時故象蛇形也爲五月隂之􅀄生迕逆陽气一地也人陽也丨象隂出衝午之也爲六月草木盛於五月故聚畜百藥木气之盛也味主在和五月木雖盛純陽而已味一而未和至六月得隂氣委殺乃盛成而有味故象之爲七月隂生三月矣三月一時隂體成矣成則自申固而収束故象之爲八月萬物􅀒隂而抱陽陽气將潜萬物随之以入故象門之閉也與同意爲九月陽氣將滅土生於戊盛於戍言陽將入於土也故從戊一亦象之也爲十月盛隂接陽絪緼遘精化育之象十一月而子生矣故象之也此十二支也故以配日曰榦也天地絪緼萬物化生天感而下地感而上隂陽交泰萬物咸亨陽以經之隂以緯之天地經之人實緯之故曰經天緯地之謂文􅀃文解字繫傳第三十七
