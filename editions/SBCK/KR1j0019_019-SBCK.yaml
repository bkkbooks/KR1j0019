body:
  text: 繫傳十九文林郎守祕書省校書郎臣徐鍇傳釋朝散大夫行祕書省校書郎臣朱翶反切十八部文八百二十重九十三怒也武也象馬頭髦尾四足之形凡馬之屬皆從馬臣鍇按劉熈釋名馬武也韋昭曰以其徤行莫者反古文籕文馬與同有髦牡馬也從馬陟声臣鍇曰按爾雅牡曰隲又借訓定也之曰反馬一􅀊也從馬一絆其足讀􅀂絃一曰環臣鍇曰􅃌事户删反馬二歳曰駒三歳曰騑從馬句声卷于反馬八􅀊也從馬八声北㧞反馬一目白曰二目白曰魚從馬間声臣鍇按詩曰有驔有魚注曰似魚目臣鍇曰爲今馬環目􅀱艱反馬青驪文如􅀶棊也從馬其声臣鍇曰慱棊子也相如賦曰射遊綨虞知反馬深黒色從馬麗声臣鍇按爾雅小領盗驪臣以爲盗驪淺黒鄰之反青驪馬從馬肙声詩曰駜彼乗駽大玄反馬淺黒色從馬􅀑声臣鍇按漢儀丞相見免乗騩馬自府歸也矩遂反赤馬黒毛尾從馬留声里求反馬赤白雜毛從馬叚声謂色似鰕魚臣鍇曰駮馬痕加反馬蒼黒雜毛從馬隹声臣鍇曰蘆鵻色專唯反馬白色黒鬛尾也從馬各声臣鍇曰詩曰嘽嘽駱馬勒託反馬青白雜毛也從馬恖声倉紅反馬隂黒喙從馬因声伊倫反驪馬白跨也從馬矞声詩曰有驈有騜常出反馬靣顙皆白從馬尨声臣鍇按史記曰匈奴東方皆青駹馬餘馬名多見詩頌江反黄馬黒喙從馬咼声古加反籕文騧􅸮黄馬發白色一曰白髦尾也從馬􅰈声匹妙反黄馬白毛也從馬丕声浦冝反馬赤黒色從馬􅨖声詩曰四驖孔阜汀切反馬頭有白發色從馬岸声臣鍇曰所謂白發言色有淺處􅀂􅀅起然隅旰反馬白額也從馬的省声一曰駿也易曰馬馰顙顚狄反馬色不純從馬爻声逼朔反馬後左足白從馬二其足讀􅀂注易曰為馵足指事支處反驪馬黄脊從馬覃声讀􅀂簟定声詩曰騋牝驪牡婁才反馬名從馬雚声呼寛反馬名從馬僉声臣鍇曰今亦云效也魚􅉎反馬名從馬此声七里反馬名從馬休声喜彪反馬赤鬛縞身囙􅀂黄金名曰吉皇之乗周文王時犬戎獻之從馬文文亦声春秋傳曰馬百駟畫馬也西伯獻紂以全其身臣鍇按山海經一名吉量乗之夀千􅀊淮南子謂之飛黄亦曰乗黄太公六韜紂拘文王牖里散宜生之徒求吉黄以獻紂以免無外反馬彊也從馬攴声章移反馬飽也從馬必声臣鍇曰駜彼乗黄頻必反馬盛肥也從馬光声詩曰四牡駫駫臣鍇曰今詩作彭居屏反馬盛也從馬旁声詩曰四牡騯騯白亨反駠䭹馬怒皃從馬卬声我亢反馬之低仰也從馬襄声臣鍇按潘岳藉田賦龍驥騰􅋮脩翔反上馬也從馬莫声臣鍇曰左思賦曰驀六駮没白反跨馬也從馬竒声臣離反軛中從馬加声臣鍇曰慱物志黄帝臣相􅁟作乗馬千乍反籕文驂旁馬從馬非声甫肥反駕二馬從馬声臣鍇曰顔延之赭白馬賦紫燕駢衡屏堅反駕三馬也從馬參声七南反一乗也從馬四声臣鍇曰四馬也素次反副馬也從馬付声一曰近也一曰疾也符注反馬和也從馬皆声臣鍇曰詩曰六轡如組兩驂如舞和也㾗皆反馬揺頭也從馬我声頻左反駊騀也從馬皮戸鋪妥反馬行皃從馬舀声臣鍇曰猶㴞滔也詩曰滔滔不歸偷劳反馬行遟從馬竹声臣鍇曰詩曰篤公劉論語曰行篤敬皆當作笁假借此篤字得酷反馬行堅祝反馬尾也從馬介声苟差反􅅰也一曰摩馬從馬蚤声臣鍇曰詩曰徐方驛騷素叨反絆馬也從馬口其足春秋傳曰韓厥執􅎗前讀􅀂輙臣鍇曰􅃌事知習反或從執系馬銜脫也從馬台声臣鍇曰銜脫即放散故古謂春色舒放為駘蕩曰台反犗馬也從馬乗声食陵反牡馬也從馬且声一曰馬蹲駔也臣鍇曰駔駿子廣反厩御也從馬芻声側丘反置䮷也從馬睪声移尺反驛傳也從馬日声臣鍇曰春秋左傳楚子乗馹而質反傳也從馬声一曰騰犗馬也從朋反􅁐名一曰馬白額從馬寉声閑慱反牧馬苑也從馬冋声詩曰在駉之野居屏反馬衆多皃從馬先声所臻反獸如馬鋸牙食虎豹從馬交声臣鍇曰詩云隰有六駮六駮亦木名皮斑駮也見陸璣詩草木䟽逼朔反駃騠馬父騾子也從馬决省声臣鍇按史曰燕王食蘇秦以駃騠鶗宂反駃騠也從馬是声敵圭反驢父馬母從馬羸省声魯戈反或不省似馬長耳從馬盧声連於反驢子也從馬冡声母東反驒騱野馬属從馬單声一曰青驪白驎文如魚臣鍇按史記曰匈奴之竒畜也的煙反驒騱馬也從馬奚声賢迷反騊駼北野之良馬也從馬匋声臣鍇按史亦匈奴之畜相如賦曰􅗗騊駼特豪反騊駼也從馬余声田吾反衆馬也從三馬彼虬反文一百十五重八麠属從鹿㶾省声薄交切麋属也從鹿主声拙􅁃反狻猊獸從鹿兒声臣鍇曰即今獅子國語曰獸長麑應作麛擬西反山羊而大者細角從鹿咸声按山海經出月氏國顔咸反大羊而細角從鹿霝声連丁反鹿属也從鹿圭声有兮反如小麋臍有香從鹿射声臣鍇按爾雅麝父麋足􅄞康論曰麝食栢而香時卸反似鹿而大也從鹿與声玄怒反旅行也鹿之性見食􅇥則必旅行從鹿丽声禮麗皮納聘盖鹿皮也臣鍇曰所謂儔儷婁惠反古文􅂐文牝鹿也從鹿牝省声臣鍇曰詩曰麀鹿攸伏伊虬反或從幽文二十六重六行超逺也從三鹿凡麤屬皆從麤村呼反鹿行楊土也從麤從土臣鍇曰㑹意值辰反籕文文二重一獸也似兔青色而大象􅄱頭與兔同足與鹿同凡之屬皆從㲋臣鍇曰象形丑略反籕文狡兔也兔之駿者從兔臣鍇曰詩曰趯趯毚兔㑹意岑嵒反獸名從吾声息夜反獸也似狌狌從夬声賜穴反文四重一獸名象踞後其尾形兔頭與頭同凡兔之屬皆徒兔土路反失也從辵兔兔謾記善逃失也臣鍇曰會意移弋反屈也從冂兔兔不得走益屈折臣鍇曰獸善屈折㑹意迂言反兔子也婏疾也從女兔臣鍇曰㑹意符萬反疾也從三兔弗孺反文五山羊細角者從兔足苜声凡莧之屬皆從莧讀􅀂丸寛字從此臣鍇按本草注莧羊似麢羊角有又俗作羱户寒反文一狗之有縣􅕭者也象形孔子曰視犬之字如畫狗也凡犬之屬皆從犬臣鍇曰蹏足趾高象犬之長體垂耳也畎反孔子曰狗叩也叩氣吠以守從犬句声臣鍇曰叩者声有節􅀂扣物論語曰仲尼之玄狗講吼反南越人名犬獶獀從犬声色酋反犬之多毛者從犬彡詩曰無使尨也吠或曰尨狗也臣鍇曰彡毛長也㑹意兔江反少狗也從犬交声匈奴地有狡犬巨口而黒身臣鍇曰淮南子曰狡狗之死也刻之􅀂濡言血脈潤也根卯反犬悪毛也從犬農声臣鍇曰濃而亂也奴聦反短喙犬也從犬􅂚声詩曰載獫猲獢爾雅曰短喙犬謂之猲軒謁反長喙犬一曰黒犬黄頭從犬僉声香貶反猲獢也從犬喬声許嬌反黄犬黒頭從犬主声讀􅀂注反處反短脛狗從犬卑声臣鍇曰春秋左傳人名史猈鸎解反犗犬也從犬竒声臣鍇曰犗形之也借為美也于奇反犬視皃從犬目声臣鍇曰㑹意㳙寂反竇中犬声從犬從音音亦声臣鍇曰犬吠穴中䑕歐彡反犬暫逐人也從犬黒声讀􅀂墨臣鍇曰犬黙無声逐人没墨反犬從艸􅁀出逐人也從犬卒声臣鍇曰今人言猝􅁀村訥反猩猩犬吠声從犬星声臣鍇曰又爾雅猩猩小而好啼太玄曰交于鸚猩息形反犬吠不正也從犬兼声讀􅀂檻一曰兩犬争也臣鍇曰謂小犬學吠声未正也下斬反小犬吠從犬敢声南陽新亭有㺖郷臣鍇曰小犬声米暢也􅂽檻反犬吠声從犬畏声塢賄反獶㺒也從犬憂声臣鍇曰獶雜也獰交反犬容頭進也從犬參声一曰賊疾也臣鍇曰言犬進狹處山檻反犬食也從犬舌声讀􅀂比目魚鰈之鰈臣鍇曰以舌呑物㑹意他合反犬可習也從犬甲声臣鍇曰獸之可習者唯犬甚也侯甲反犬性忲也從犬丑声臣鍇曰忲慣習也春秋左傳莫敖狃于蒲騷之役女有反侵也從犬已声浮檻反狡獪也從犬㑹声臣鍇曰獪多所㑹合也古最反恨賊也從犬青声臣鍇曰犬性多猜害七開反徤犬也從犬孟声梅冷反健犬也從犬亢声看浪反多畏也從犬去声臣鍇曰駑犬性易㹤羗脅反桂林說㹤從心徤也從犬粦声詩曰盧獜獜臣鍇曰今詩作令里神反疾跳也一曰急也從犬瞏声古縣反走也從犬攸声讀􅀂叔臣鍇曰倐忽也張衡賦曰儵眩眩􅀆返常閭假作儵假借尸竹反犬行也從犬豆声周書曰尚狟狟臣鍇曰今尚書作桓户寒反過弗取也從犬巿声讀􅀂孛歩咄反犬開張耳皃從犬易声知白反犬張齗怒也從犬來声讀又􅀂銀臣鍇曰慗字從此牛吝反走犬皃從犬而丿之曵其足則剌犮也臣鍇曰祓茇䟦從此􅃌事蒲撥反曲也從犬出户下戻者身曲戾也臣鍇曰犬善出卑户也㑹意婁惠反犬相得而􅋐也從犬蜀声羊為群犬為獨也一曰北嚻山有獨􅜧獸如虎白身豕鬛尾如馬臣鍇曰北嚻山岀山海經陁谷反獨􅜧獸從犬谷声余足反秋田也從犬璽声經義􅿘少也取禽獸少也息衍反或從豕作宗廟曰也故從豕示畋獵也逐禽也從犬䑕声良涉反獵也從犬声臣鍇按爾雅宵曰為獠力照反犬田也從犬守声易曰明夷于南狩詩救反禽走臭而知其迹者犬也故從犬從自臣鍇曰自鼻也會意赤狩反獵所獲也從犬蒦声户麥反頓仆也􅀙犬敝声春秋曰與犬犬斃避制反或從死宗廟犬名羮獻犬肥者以獻從犬鬳声臣鍇曰禮犬曰羮獻希䢖反獟犬也從犬幵声一曰逐虎犬也臣鍇曰獟猶驍也魚見反犬也從犬堯声五呌反狂犬也從犬折声春秋傳曰狾犬入華臣氏之門正曳反狾犬也從犬声倦反古文從心種􅀋相似唯犬為甚故從犬頪声臣鍇曰􅀋音耒戀位反犬獶獶咳吠也犬翏声火包反赤狄本犬種狄之為言淫辟也􅀙犬亦省声曰溺反狻麑如貓食虎豹者從犬夋声見爾雅素攅反母猴也從犬矍声爾雅云玃父善顧攫持人也俱縳反玃属從犬酋声一曰隴西謂犬子爲猷臣鍇曰又可止之言今怍猶延秋反玃属從犬且声一曰狙犬也暫齧人者一曰犬不齧人也臣鍇曰莊子狙公養群狙親去反夔也從犬矦声何溝反犬􅀋􅆎已上黄􅆎已下黒食母猴從犬㱿声讀􅀂構或曰似䍧羊出蜀北嚻山中犬首而馬尾呼屋反似犬銳頭頰高前後廣從犬良声勒當反如狼善驅羊從犬白声讀􅀂寗嚴讀之淺泊晋悪反反狼屬從犬曼声爾雅曰貙獌似貍舞販反妖獸也􅀑所乗之有三徳其色中和小前豊後死則丘首從犬􅀲声魂徒反小狗也食魚從犬頼声他割反􅆩屬從犬扁声臣鍇按慱物志頭如馬頭􅆎已下似蝙蝠毛嫰大可五斤俗作獱辟㳙反或從賔犬走皃􅀙三犬臣鍇曰飈從此㑹意必遥反文八十三重五兩犬相齧也從二犬凡㹜之屬皆􅀙㹜臣鍇曰㑹意語殷反司空也從㹜􅒳声復􅀃獄司空臣鍇曰􅒳頥同息兹反确也從㹜言聲二犬所以守也元旭反文三穴蟲之揔名也象形凡䑕之屬皆從䑕臣鍇曰上象齒下腹􅀲尾䑕好齧傷故象齒叔吕反䑕也從䑕番声讀􅀂樊或曰䑕婦臣鍇曰爾雅作蟠復喧反䑕出胡地皮可作裘從䑕各声臣鍇曰狐䶅閒慱反地行䑕伯劳所作也一曰偃䑕從䑕分声臣鍇曰伯劳百舌也敷粉反或作虫分臣鍇白漢有田蚡䶄令䑕從䑕平声頻寜反䑕也從䑕虒声臣鍇按爾雅注曰夏小正曰鼶鼬則穴辛兹反竹䑕也如犬從䑕而声臣鍇曰䑕齧竹者里由反五技䑕也能飛不能過屋能縁不能窮木能游不能渡谷能穴不能掩身能走不能先人從䑕石声臣鍇曰按古今注以為今螻蛄也神􅃗反豹文䑕也從䑕冬声臣鍇按爾雅豹文鼮䑕又注云未詳疑此􅀃文本脱誤隻公反籕文從攵作䑕之属也從䑕益声晏索反或從豸作小䑕也從䑕奚声臣鍇曰春秋左傳鼷䑕食郊牛角賢迷反精鼩䑕也從䑕句声臣鍇曰爾雅注小鼱鼩也群吁反䶃也從䑕兼声臣鍇按爾雅注䑕以頰内藏物也丘􅀧反鼸屬從䑕今声讀若含侯貪反如鼦赤黄色尾大食䑕者從䑕由声羊狩反胡地風䑕從䑕勺声真􅀂反䑕屬也從䑕声臣鍇曰如勇反而擁反䑕似雞䑕尾從䑕此声即冝反䑕出先零胡皮可作袋從䑕軍声戸昆反獑䑕黑身白腰􅀂帶手有長白毛似握版之狀􅁼蝯蜼之屬從䑕胡声臣鍇曰西都賦曰獲獑胡版手版也魂徒反文二十重三熊属足似鹿從肉㠯声能獸堅中故稱賢能而彊壯稱能傑也凡能之屬皆從能臣鍇曰骨節實也柰登反火也從火毁声春秋傳曰衞侯燬吁委反火也從火豩声吁位反然也從火夋声周禮曰遂炊其焌焌火在前以焞焯􅀛翠卒反柴􅀕天也􅀙火昚昚古文慎字祭天所以慎也臣鍇曰慎敬慎也力照反燒也從火肰声臣鍇曰音然仁遷反或從艸難燒也從火蓻声臣鍇按春秋傳曰􅅡僖􅀒羈儒拙反􅋹也從火番声復喧反􅋹也從火堯声式遥反火猛也從火􅍌声臣鍇曰詩曰如火烈烈良舌反火光也從火出声啇書曰予亦炪謀讀􅀂巧拙之拙臣鍇曰今尚書作拙燭恱反熚炥火皃從火畢声畢聿反熚蹙也從火声古文悖字分勿反火气也從火丞声臣鍇曰蒸從此扌承反乾皃從火􅭑声詩曰我孔熯矣爾件反火皃從火弗声普末反火皃􅀙火翏声逸周書曰味辛而不熮利挑反火皃從火省声讀􅀂粦里刃反火色􅀙火雁声讀􅀂鴈臣鍇曰雁音鴈迎諌反火光也從火頃声居迥反火飛也從火龠声一曰爇也臣鍇曰東京賦曰遺光煜爚胤略反火飛也從火􅰈声讀􅀂瘭彼消反火熱也􅀙火高声詩曰多􅀅熇熇火酷反交木然也從火交声臣鍇曰架而燒之也根卯反小熱也􅀙火干声詩曰憂心㶣㶣臣鍇曰從此長廉反所以然持火也從火焦声周禮曰以明火爇燋也煎昭反燒木木􅁅也從火屵声他旦反束炭從火差省声讀􅀂齹楚宜反交灼木也從火敎省声讀􅀂狡根卯反火气也從火犮声歩􅀅反死􅁅餘燼從火又又手也火旣滅可以執持臣鍇曰㑹意呼􅅆反􅁅炱煤也從火台声臣鍇曰火煙所生也田咍反盆中火也從火畏声塢板反畜火也從火息声臣鍇按史多用為息字消式反行竈也從火圭声讀若冋臣鍇按爾雅注今三隅竈也烏􅂝反烓也從火甚声氏吟反炊也從火單声春秋傳曰燀之以薪昌善反爨也從火吹省声叱為反尞也從火共声詩曰卬烘于煁呼弓反炊餔疾從火齊声寂帝反烝也從火孚声詩曰烝之烰烰臣鍇曰蒸气上出吕氏春秋有侁氏得嬰兒命烰人養之烰人庖人也附柔反炙也從火喜声忻宜反炙􅁏也從􅁏在火上臣鍇曰㑹意之射反又按炙字别有部注云炮肉也􅀙􅁏在火上凡炙之属皆從炙之石反此疑誤炙也從火夕声㫖石反敖也從火前声臣鍇按楚辭曰煎鴻鶬即然反乾煎也從火敖声顔叨反或從麥作毛炙肉從火包声臣鍇曰詩曰毛炮胾羮歩交反炮肉也微火温肉也􅀙火衣声愛根反置魚䇶中炙也􅀙火曽声走棱反以火焙肉􅀙火稫声臣鍇按周禮注鮑魚於稫火室作之稫音普逼反皮抑反灼也從火暴声蒲速反炙燥也􅀙火昜声臣鍇曰暘也胤亮反灼也􅀙火崔声臣鍇曰霍音礭胡撲反熟也從火蘭声婁粲反或從間爛也從火靡声羙支反􅀙上按下也從􅊂又持火所以尉繒也臣鍇曰􅊂音夷安平也此㑹意迂胃反灼􅀛不兆也從火􅀛声春秋傳曰􅀛不兆讀􅀂焦臣鍇曰今春秋左傳作焦㑹意煎昭反灼也從火乆声㡬柳反炙也從火勺声眞􅀂反鑠治金也從火柬声郎電反庭燎火燭也從火蜀声專玉反然麻蒸也從火怱声子菶反燭㶳也從火也声似下反火餘也從火声一曰薪也曰盡字從此今俗作燼夕晋反堅刀刃也從火卒声臣鍇曰王褒聖主得賢臣頌曰清水焠其鋒也此退反屈申木也從火柔柔亦声臣鍇曰周禮煣輻必齊以火揉木如紂反燒田也從火棥棥亦声臣鍇曰復喧反火輮車網絶也從火兼声周禮曰輮牙外不熑力鹽反放火也從火尞声臣鍇曰春秋左傳􅀂火之燎于原力表反火飛也從火與􅞳同意闕臣鍇曰􅰈從囟䢉從囟䢅從臼取其共捧以上之意此㑹意力幺反焦也從火曹声祖叨反火所傷也從火雥声臣鍇曰雥音雜旁所謂古字音與今小異煎昭反或省天火曰烖從火􅥘声臣鍇曰􅥘音走該反或從宀火曰宀室屋也籕文從曰音灾也古文從才臣鍇曰才声火气也從火垔声伊田反籕文從宀古文或從因焆焆煙皃從火肙声因恱反鬱煙也從火昷声臣鍇按易曰天地烟煴相烝也迂分反望火皃從火皀声讀􅀂馰顙之馰臣鍇曰皀音都歷切火熱也從火覃声似猒反明也從火􅙯声春秋傳曰焞燿天地他門反烝也一曰赤皃一曰温􅃳也從火昫声動戍反明也從火丙声鄙未反明也從火卓声周書曰焯見三有俊心真􅀂反明也從昭從火止要反盛赤也從火韋声詩曰􅊮管有煒于虺反盛火也從火多声昌婢反盛光也從火習声詩曰熠燿逸入反燿也從火昱声以反照也從火翟声異召反光也從火軍声吁􅀽反光也從火冋声居逈反盛也從火曅声詩曰爗爗震電筠􅂺反火門也從火閻声羊廉反爓燿也從火玄声預顯反煌煌也從火皇声戸光反煌也從火昆声􅀌損反明也從火在人上光明意也臣鍇曰通論備矣國昌反古文古文温也從火埶声爾絶反盛也從火戠声昌意反古文􅀬在中也從火奥声臣鍇曰尚書時燠嘔報反温也從火爰声呼逺反温也從火耎声奴短反見也從火曰声臣鍇曰古又借為桂㑹意居㢠反乾也從火亢声臣鍇按爾雅曰晝聶宵炕看藏反乾也從火喿声則耗反滅也從火戍火死於戍陽气至戍而盡詩曰赫赫宗周褒姒烕之臣鍇曰㑹意火恱反旱氣也從火告声闊毒反漙覆照也從火壽声臣鍇按春秋左傳如天之無不燾徒號反取火于曰官名從火雚声舉火曰爟周禮曰司掌行火之政令古煥反燧􅀱表也邊有警則舉火從火逢声甫蛩反苣火祓也從火爵声吕不韋曰湯得伊尹爝以爟火釁以犧豭臣鍇按荘子曰許由云曰月出矣爝火不息子妙反暴乾也從火彗声臣鍇曰太公六韜曰日中少熭于歳反或與爟同臣鍇按􅀃文烜字在爟字下注曰或從亘今此特出而注云或與爟同又别無切音疑傳冩之誤燥也從火声臣鍇曰何晏賦重熈累盛軒其反文一百十二重十五火光上也從重火凡炎之屬皆從炎延占反火行微燄􅆋也從炎臽声臣鍇曰尚書曰無􅀂火始􅆋燄羊染反炎光也從炎舌声透􅀧反㑴也從炎㐭声讀􅀂桑椹字施甚反火行也從炙占声羊染反于湯中爚肉􅀙炎􅀬省声臣鍇曰儀禮有司曰乃燅于俎以猒反或從炙作火熟也從又持火辛辛者物熟味也臣鍇曰辛音新相聶反兵死及牛馬之血爲粦粦􅄦火也從炎舛声臣鍇按慱物志戰􅋐死亡之處有人馬血積年化爲粦粦著地入草木皆如霜露不可見有觸者著人體便有光拂拭便散無数又有吒声如煼豆舛者人足也言光行著人里冈反文八重一火所熏之色也從炎上出凡黒之屬皆從黒臣鍇曰古䆫字享勒反齊謂黒爲黸從黒盧声臣鍇曰尚書曰黸弓借旅字論􅀌反沃黒色從黒㑹声烏最反深黒也從黒音声臣鍇曰黯然銷魂言思深下也歐减反中黒也從黒厭声臣鍇曰春秋左傳晋史墨字黶歐減反小黒子從黒殹声幽雞反白而有黒也從黒旦声五原有莫䵣縣臣鍇曰雖白而色滋多幹反雖晢而黒也從黒箴声古人名字晢干咸反赤黒也從黒易声讀􅀂焬胤亮反淺青黒色從黒參声臣鍇按陸機漢功臣賛曰上黲下黷此反青黒也從黒奄聲歐減反微青黒色從黒㓜声爾雅曰地謂之黝伊糾反黄濁黒從黒屯声他衮反黄黒也從黒金声于咸反黒有文也從黒冤声讀􅀂飴字臣鍇曰色經溽暑而變班色迂厥反黄黑而白從黒箅声一曰短黒讀􅀂以芥為名曰芥荃也􅆲刮反黒皺也從黒幵声堅殄反小黒也從黒占声多忝切堅黒也從黒吉声㾗札反黧也從黒今声秦謂民為黔首謂黒色周謂之􅀺民易曰為黔喙臣鍇曰黧黒淺黒帶黄勤濳反澤垢也從黒冘声臣鍇曰楚辭曰或黕􅀧而汙之得坎反不鮮也從黒尚声臣鍇曰莽黨然登沆反握持垢也從黒賣声易曰再三黷陁谷反大汙也從黒詹声口敢反中乆雨青黒從黒微省声臣鍇按楚辭黛􅀺以沮敗閩之反貶下也從黒出声剌宻反一色從黒般声别安反􅀞眉也從黒声臣鍇按古人云衞之處子粉白黱黒今俗作黛字徒再反青黒繒發白色也從黒攸声尸竹反羔裘之縫從黒或声臣鍇按詩曰羔羊之以黒為􅒌也于抑反謂之垽垽滓也從黒殿省声庭硯反桑葚之黒從黒甚声臣鍇按詩曰食我桑黮徒坎反果實黭黯黒也從黒弇声烏感反黒刑在靣也從黒京聲臣鍇曰黒湼靣也䖍京反或從刀作􅗼者忘而怠也從黒敢声歐減反黒木也􅀙黒多声丹陽有黟縣幽雞反淺黄黒也从黒甘声讀若染繒中束緅黚巨淹切文三十七重一在牆曰牖在屋曰囱象形凡囱之属皆􅀙囱臣鍇曰象交䟽形楚尨反古文或從宂臣鍇曰㑹意多遽怱怱也􅀙心囱囱亦声麤中反文二重二火華也從三火凡焱之屬皆􅀙焱臣鍇曰火所生也羊染反屋下燈燭之光從焱冂臣鍇曰秦嘉詩曰熒熒華燭冂猶室也㑹意玄經反盛皃從焱在木上讀􅀂詩莘莘征夫莘古文伷一曰嶷一曰役臣鍇曰㑹意所臻反文三炮肉也從肉在火上凡炙之属皆從炙眞石反籀文臣鍇曰今東京文作此字宗廟火熟肉從炙番声春秋傳曰天子有事㸋焉以饋同姓諸侯臣鍇曰詩曰㸋炙芬芬今春秋左傳作膰復喧反炙也從炙尞声讀􅀂燎臣鍇曰後漢書光武于竈下爒衣今人作燎力照反文三重一南方色也從火凡赤之屬皆從赤臣鍇曰南方之星其中一者最赤名大火㑹意昌夕反古文從炎土臣鍇曰尚書厥土赤埴赤色也從赤蟲省声杜紅反日出之赤從赤榖省声呼屋反靣慙赤也從赤反声周失天下於赧王臣鍇曰赧王入秦為家人無謚謂其慙故謂之赧􅀍竊鈇之言也􅭋音女展反㑹意尼綰反赤色從赤巠声詩曰魴魚䞓尾恥呈反或從貞或從丁䞓棠􅀥之汁或從水浾或從正赤土也從赤者声臣鍇曰張衡賦赭堊流黄煑也反赤也從赤倝声讀􅀂浣從此朝旱反火赤皃從二赤臣鍇曰㑹意歇宅反文八重五􅀃文解字通釋卷第十九
