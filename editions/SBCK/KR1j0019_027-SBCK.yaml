  text: 古文金臣鍇曰􅎧上皆象金形白金也從金㫐声言陳反白金从金尞声臣鍇曰尔雅其羙者謂之鐐梨桃反白金也從金沃声臣鍇按詩曰隂靷鋈續晼毒反青金也從金㕣声與川反錕􅉢之間也從金易声臣鍇曰銀色而􅉢質也星激反錫也从金引声臣鍇曰尔雅云也異印反赤金也從金同声田風反銅属也从金連声臣鍇按史記曰長沙出連錫􅀰此也鄰延反黒金也従金􅨖声聽切反鐡或省古文鐡從夷九江謂鐡曰鍇從金皆声臣鍇曰張衡南都賦曰銅錫􅉢鍇南陽與九江雖遥俱爲楚地也字書曰鐡好也一曰白鐡也夫鐡精則白肯駭反鐡也一曰轡首銅也従金攸声臣鍇曰今人言鈭錔也延秋反剛鐡也可以刻鏤从金婁声夏書曰梁州貢鏤金也一曰鏤釡也勒丑反鐡􅀋也从金賁声讀􅀂訓父文反金之澤者也从金先声一曰小鑿一曰鐘下兩角其間謂之銑臣鍇按國語曰玦之以金者銑寒甚矣胡可恃也注曰銑猶洒也洒然寒皃言無和潤也思典反剛也从金臤声臣鍇曰淬刀劒刃便堅也經硯反金属也一曰剥也从金􅀺声里西反金色从金柔声臣鍇曰借為領録字劣束反銷金也从金夀声支處反鑠金也从金肖声息超反銷金从金樂声書􅁍反治金也从金柬声郎電反錬鉼黃金也从金丁声的􅄀反鑄塞也从金固声臣鍇曰鑄銅鐡以塞隙也後漢注有黨錮寒其仕進之路也骨度反作中腸也从金襄声臣鍇曰鑄鍾鑄属使內空者于型範中更作土模所以後􅁍流銅也又􅀂果實之穣釋名云銄鑲兵也兩頭曰銄中央曰鑲或推攘或銄引也臣鍇按晏子云直兵將推之曲兵將銄之即此也然荘反可㠯持冶器鑄鎔者也从金夾声讀􅀂漁人筴魚之筴一曰􅀂挾持臣鍇曰今鐡夾持鑄鍋者居狹反冶器法也从金容声臣鍇曰亦樓範也古言鎔栽岀于此與封反銅鐡朴也从金廷声笛頲反小冶也从金叚声臣鍇曰推之而已不銷故曰小冶都半反鐡文也从金曉声喜杳反景也从金竟声居􅔡反曲鉹也一曰鬵鼎也从金多声讀􅀂擿一曰􅀂詩曰侈􅀆之移同臣鍇按爾雅鬵鉹也注凉州呼曰鉹昌婢反佀鐘而頸長从金幵声賢星反酒器也从金重声之松反大盆也从金監声一曰鍳諸也可㠯取明水于月臣鍇按周礼曰春始治鑒注曰如甀大口鍳諸鏡也一曰石也各摲反佀鼎而長足从金喬声伎昭反陽也从金隊声臣鍇按周礼司烜民掌以夫遂取明火于曰以鑑取明水于月注云夫遂陽燧也鍳鏡属也取水者世謂之方諸夕位反温器也圜直上从金巠声臣鍇曰所以燠物賢星反瓽也从金嶲声户迷反鐫也从金􅃗声户廓反釡而大口者从金夏声分副反釒属也从金敄声莫浮反朝鮮謂釜曰錪从金典声􅃪銑反也从金坐声泉和反銼􅟋也从金羸声魯戈反器也从金刑声臣鍇曰鉶􅃵器也賢星反温器也从金高声武王所都鎬在長安西上林苑中字亦如此候抱反温器也一曰金器从金麀声讀􅀂奥阿高反温器也从金兆声一曰田噐臣鍇按詩傳曰錢銑也延朝反酒器也从金象器形徒斗反或省金鐎斗也从金焦声臣鍇曰史記注刁斗云以銅作鐎器受二升晝炊飯夜擊持行也煎昭反小盆也从金肙声火玄反鉉也从金建声一曰車轄其獻反鼎也从金彗声讀􅀂慧于歳反舉鼎具也从金玄声易謂之鉉礼謂之鼏預􅂋反可㠯句鼎耳及鑪炭也从金谷声讀若洛一曰銅屑余足反器也从金熒省声讀􅀂銑玄經反鐡器也从金韱声一曰鐫精亷反錠也从金登声臣鍇按尔雅瓦梪謂之鐙注即膏鐙也臣鍇以此楚辭所謂蘭膏明燭華鐙錯丹増反鐙也从金定声顛定反鍱也从金集声牆揖反鏶或从咠鏶也从金産声一曰平鐡臣鍇曰鮑昭賦云鏟利銅山􅀄簡反鏶也齊謂之鍱从金枼声臣鍇曰今言鐡葉也亦接反方鑪也从金盧声論􅀌反圜鑪也从金旋声似戀反器也从金虒声敵圭反煎膠器也从金虜声勒古反金餙器口从金口口亦声臣鍇曰􅀂今金銀􅏢器也懇走反金塗也从金㫺声臣鍇曰詩曰約軧錯衡操各反鉏也从金御声臣鍇曰鉏猶犬牙也疑舉反或从吾鉏也从金竒声江淮之間謂釡錡臣鍇曰春秋左傳筐筥錡釡之器注有足曰錡魚􅀝反郭夜鍼也从金臿声丑輒反綦緘也从金木声臣鍇曰剌余之緘也綦履履底也常岀反所以縫也从金咸声正沈反大鍼也从金皮声一日劒而刀装者臣鍇按春秋左傳曰夾之以鈸杯卑反鋭也从金毚声岑嵒反印鼻也从金丑声女有反古文鈕从玉斤斧穿也从金声臣鍇曰柄孔受柯處六韜曰大柯斧銎長八寸曲恭反鈭錍斧也从金此声即宜反鈭錍也从金卑声賔而反小鑿也从金斬斬亦声昨三反破木鐫也从金雋声一曰琢石也讀若韯津宣反穿木也从金省声自莫反臿属也从金舌声讀􅀂掞桑欽讀􅀂鎌先亷反臿属也从金冘声讀􅀂沈池心反臿金也从金危声一曰䤥􅉷鐡也讀􅀂毁行溝委反河内謂臿頭金也从金敝声僻噎反銚也古者田器从金戔声曰庤乃錢鏄一曰貨也自僊反大鈕也从金矍声俱躍反鈐􅣾大犁也一曰􅁼耜从金今声勤潜反鈐􅣾也从金隋声特安反兩刃有木􅧇可㠯刘艸从金發声讀若撥普末反耜属也从金蟲省声杜冬反立薅所用也从金且声蟬于反耜属也从金罷声讀若媯彼移反鍥也从金兼声力鹽反鎌也从金契声經節反大鎌也从金召声鎌或謂之鉊張胤􅀃眞遥反穫禾短鎌也从金至声臣鍇按尔雅曰鑊也知疾反慱壓也从金眞声陟陳反鐵銸也从金占声一曰膏專鐡鉆敕淹反鉆也从金取声臣鍇曰猶籋也陟聶反㠯鐡有所刼束也从金甘声勒潜反鐡鉗也从金大声臣鍇按字書在足曰釱笛計反䅮唐也从金居声釠御反可㠯綴著物者从金㬱声祖堪反鋭也从金隹声專唯反芒也从金兑声與􅀊反籕文銳從剡鐡杇也从金曼声臣鍇曰所以泥也役團反鏝或从木臣次立按徐鉉云木部有此重岀所㠯穿也从金賛声祖半反䥘銅鐡也从金慮声臣鍇曰摩錯之也留御反衡也从金全声七㳂反􅁠十分黍之重从金朱声臣鍇曰二十四銖爲一兩也船區反十銖二十五分之十三也从金寽声周禮曰重三鋝北方二十兩爲鋝録設反鋝也从金爰声虞書曰罰百鍰户刪反六銖也从金甾声側持反八銖也从金垂声􅀡垂反三十斤也从金匀声堅鄰反古文鈞从旬兵車也从金巴声一曰鐡也司馬法曰晨夜内鈀車不奢反鉦也从金蜀声軍法司馬執鐲臣鍇按周礼注形如小鐘軍行鳴之以爲皷節木渥反鈐釘也从金今声連丁反鐃也从金正声佀鈴柄中上下通真名反小鉦也从金堯声軍法卒長執鐃獰交反大鈴也从金睪声軍法五人爲伍五伍爲兩兩司馬執鐸騰莫反大鐘謂之鏞从金庸声與封反大鐘淳于之属所以􅀿鍾声也堵以二金樂則皷鏄􅀿之从金薄声匹各反方鍾也从金方声府昌反樂鐘也秌分之音也物種成从金童声古者垂作鍾之松反鍾或从甬鏄鱗也鍾上横木上金華也从金專声一曰田器也詩曰庤乃錢鏄臣鍇曰鍾筍上飾今儀制令所謂慱山也又詩傳曰鏄鎒也本泊反鍾声也从金皇声詩曰鍾皷鍠鍠户荒反鐘声也从金倉声測彭反繚金声也从金爭声測彭反鍾皷之声也从金堂声詩曰擊皷其鏜呑匡反鎗鍯也从金忽声一曰大鑿平木者麤中反金声也从金輕声讀􅀂春秋傳曰􅚢而乗他車寗反劒鼻也从金覃声臣鍇按荘子曰周宋以為鐔劒鐔􅈹也人握處之下也移金反鏌釾大㦸也从金莫声臣鍇曰又劒名門落反鏌釾也从金牙声延車反鈹有鐔也从金殺声臣鍇按嵇康曰鸞翮有時鎩師壞反刀削末銅也从金㶾声臣鍇曰削音肖刀匣也片妖反鋋也从金及声臣鍇曰鈒戟也飾吸反小矛也从金延声示川反从侍臣所執兵从金允声周書曰冕執鈗與凖反短矛也从金它声臣鍇曰今又音蛇晋書曰丈八鉈矛左右盤亦牙反矛也从金从声取蚣反鏦或从􅂏長矛也从金炎声讀􅀂老􅆅杜南反兵耑也从金声甫蛩反矛㦸祕下銅鐏从金声詩曰厹矛沃臣鍇曰祕柄也得昏反祕下銅也从金尊声徂寸反弩眉也从金翏声一曰黄金之羙者里由反甲也从金豈声苦蓋反鎧也从金于声臣鍇曰管子曰桓公方田弛弓脫釪公羊曰而鋟其版侯旿反錏鍜頸鎧也从金亞声歐􅀲反錏鍜也从金叚声痕加反車軸鐡也从金間声臣鍇按釋名曰鐧間也間釭軸之間使不相摩也溝鴈反車轂中鐡也从金工声君聦反車結也从金折声讀􅀂誓一曰銅生五色時制反乗輿馬頭上防釳挿㠯翟尾鐡翮象角所㠯防羅去之也从金气声疑瑟反莝斫刀也从金夫声甫殳反人君車四馬鑣八鑾鈴象鵉鳥之声和即敬也从金鸞省声臣鍇按古今注竹朱鳥口衘鈴礼所謂行前朱雀也臣鍇以爲行歩中度則声和也魯剜反車鑾声也从金戉声詩曰鑾声􅃏􅃏臣鍇曰戊即古之斧􅃏字今皆用此􅃏虎㑹反馬頭飾也从金陽声詩曰鉤膺鏤鐊一曰鍱車輪鐡也臣鍇按刻金華當馬額也淮南子曰鍜鐊文鐃乍晦明猶良反馬勒口中也从金行衘者行馬者也臣鍇曰馬衘所以制馬之行也㑹意侯彡反馬衘也从金麃声彼消反鑣或从角組帶鐡也从金刼声讀􅀂刼居怯反羊箠也端有鐡从金執声讀􅀂至弘利反鉤魚也从金勺声的糶反鋃鐺鎻也从金良声勒當反鋃鐺也从金當声得郎反大鎻也一環貫二者从金毎声詩曰盧重鋂莫堆反銀鑸不平也从金畏声塢賄反不平也从金壘声落浼反怒戰也从金氣声春秌傳曰諸侯敵王所鎎許意反箸門鋪首也从金甫声噴摸反所㠯鈎門户樞一曰治户器也从金巽声七㳂反扠取也从金少声側嘲反㠯金有所冐也从金沓声他合反斷也从金􅡜声古􅆩反􅚎也从金各声勒託反伐擊也从金亶声旨闡反利也从金族声作木反剌也从金夫声縈節反利也从金欶声色透反殺也从金留声臣鍇按春秋左傳䖍劉我邊垂本此字里由反業也賈人占錉从金昏声臣鍇曰謂使自隠度其家之所有也史記曰楊可方為告緍眉均反大剛也从金巨声臣平也象二千對構上平也几幵之屬皆從幵臣鍇曰幵但象物平也無音義激賢反
