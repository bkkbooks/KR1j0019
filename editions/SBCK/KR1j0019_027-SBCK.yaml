body:
  text: 文一挹取也象形中有实與包同意凡勺之属皆從勺臣鍇曰禮曰今夫水一勺之多少也真􅀂反賜予也一勺為与此即與同臣鍇曰不患少而患不均故從一勺尹汝反文二踞几也象形周禮五几玉几彫几形几䰍凡素几凡几之屬皆從几臣鍇曰人所凭坐几也謹羙反依几也從几從任周書曰凭玉几讀􅀂馮臣鍇曰㑹意皮凌反處也從尸得几而止也孝經曰仲尼凥閑凥如此臣鍇曰㑹意九魚反止也從夂得几而止臣鍇按詩曰爰居爰處以爲居者定居處者暫止而已㑹意嗔佇反處或從虍声文四重一薦也從凡足有二横一其下地凡且之屬皆從且七賈反古文臣爲且又㠯爲凡字禮俎也從半肉在且上臣鍇曰指事側所反旦往也従且豦声昨怒反文三重二斫木斧也象形凡斤之属皆從斤臣鍇曰尸象木也幾欣反斫也從斤父声浮甫反方銎斧也從斤爿声詩曰又􅆙我斨倩常反擊也從斤石声眞若反斫也從斤句声臣鍇按尔雅劬斸謂之注鉏屬羣吁反斫也從斤屬声輟蜀反斫也從斤声輟角反臣次立曰徒斗切非声又按徐鉉曰器也斤以斲之斲或從丮晝劑也從金從斤宜謹反伐木声也從斤户声詩曰伐木所所師阻反析也從斤其声詩曰斧以斯之息移反斬也從斤㫺声臣鍇曰尚書曰斮朝涉之脛側削反截也從斤􅓟􅓟古文絶字都件反古文斷從古文叀周書曰猗無佗技亦古文斷柯擊也從斤良声勒可反取木也從斤亲声息鄰反二斤也闕臣次立按􅀃文曰從二斤語斤切文十五重三十升也象形有柄凡斗之属皆從斗都厚反十斗也從斗􅊁声胡谷反玉爵也夏曰醆殷曰斝周曰爵從斗門象形吅也爵同意或􅀃斝表六升臣鍇曰然則如亦􅁚形也格雅反量也從米在斗中讀􅀂遼梨桃反量也從斗􅁷声周禮曰求三斞臣鍇曰周禮考工記之言注曰未聞勻取反蟸柄也從斗斡声楊雄杜林􅀃皆㠯為軺車輪斡臣鍇曰蟸所以㧒也烏末反羹斗也從斗􅀑声臣鍇曰謂斗杓為魁柄為摽也庫摧反平斗斛量也從斗冓声臣鍇曰斠量之今作較江岳反匀也從斗甚声止沈反杼也從斗余声讀􅀂荼似車反挹也從斗奭声臣鍇按張衡思玄賦曰􅆽白水為􅄴卷朱反量物分半也從斗半亦声脯漫反量物溢也從斗旁声破郎反杼滿也從斗􅒋声俱戀反相易物俱等為從斗蜀声昌六反斛旁有從斗庣声一曰突也曰􅳍利也爾雅曰􅳍謂之疀古田器也臣鍇按漢書量其旁有􅳍注耳也周禮耳三寸實一升爾雅所謂􅳍今俗作鍬字土彫反十籥也從升亦象形失稱反文十七臣次立曰今文十六􅀘遺斣一字酋矛也䢖于兵車長二文象形凡矛之屬皆從矛臣鍇曰鉤兵也酋矛長牙也矛也其上所注旄屬建者邪迆立之也周禮酋矛常有四尺十六尺爲常也莫浮反古文矛從戈矛属也從矛良声勒當反矛屬也從矛㫺声讀􅀂苲臣鍇按史記曰矠魚鼈測索反矛柄也從矛今声臣鍇按史記曰鉏耰􅁄矜機仍反刺也從矛曰声女有反矛属從矛害声恒夬反文六重一輿輪之揔名也夏后時奚仲所作象形凡車之属皆从車臣鍇按周礼曰一器而工聚者惟車為多山海經番禺生奚仲奚仲生吉光吉光是始以木為車注云父子共作也稱㭨反籕文車曲輈轓事也从車干声臣鍇曰載物則􅀡輈軒大夫以上車也􅙲兩旁壁也忻元反軿車前衣車後也从車甾声臣鍇曰所謂庫車側持反輶車也从車并声頻寕反卧車也从車昷声塢門反卧車也从車京声柳昌反小車也从車召声延朝反輕車也从車巠声牽并反輕車也从車酋声詩曰輶車鑾鑣延秋反兵車也从車朋声臣鍇曰史記曰淮南王造輣車部行反兵車也从車屯声徒論反䧟􅞽車也从車童声臣鍇曰臨􅓘閑閑􅓘假借未重反兵高車加巢㠯望敵也从車巢声春秋傳曰楚子登轈車事交反車和輯也从車咠声牆揖反車輿也从車声臣鍇按輿車底也以虛反衣車蓋也从車曼声悶半反車軾前也从車凡声周礼曰立當前軌浮檻反車前也从車式声臣鍇按周礼兵車軾高三尺三寸人所凭也申力反車軨前横木也从車各声臣鍇曰史記婁敬脫輓輅勒妬反臣次立按徐鉉云各非声當从路省車輢上曲銅也从車爻声臣鍇按古今注車䡈車耳也在車輦上重起如牛魚詩曰猗重䡈兮江岳反車耳反出也从車反声府晚反車横也从車對声周礼曰參分軹圍去一㠯爲轛圍臣鍇按周礼注軾之植者衡者又曰車軨輿立者爲轛横者爲軹轛以其向人爲名追􅁼反車旁也从車竒声于綺反車兩輢也从車耴声陟聶反車約䡅也从車川声周礼曰􅀌乗夏䡅一曰下棺車曰䡅臣鍇曰約謂為節約刻飾之也今人俗作軔丑廵反車籍交錯也从車嗇声臣鍇按枚乗七發曰中􅀂結轖踈憶反車轖間橫木也从車令声連丁反司馬相如軨从霝軺車前横木也讀􅀂羣从車君声一曰讀􅀂禈愚藴反車後横木也从車㐱声支引反車伏兔也从車菐声周礼曰加軫與轐焉已伏反車伏兔下革也从車声古文昏字讀􅀂閔眉引反持輪也从車由声陳六反臣次立按􅀃文引徐鉉曰當从冑省車軸􅅞也从車声易曰車脫方菊反車靭也从車柔声臣鍇曰車輪外㒺木一曰牙一曰渠如紂反輻所凑也从車声􅀌速反車輮規也一曰一輪車从車熒省声讀􅀂煢蔡名反有輻曰輪無輻曰輇从車侖声吕辰反轂齊等皃也从車昆声周礼曰望真轂欲其輥􅀌損反長轂軝也以朱約之从車氐声詩曰約軧錯衡翹移反軝或从革車輪小穿也从車只声眞彼反車軸耑也从車象叀之形杜林􅀃臣鍇曰指事于歳反叀或作彗輪轑也从車畐声方菊反車輨也从車大声笛計反轂耑錔也从車官声古椀反輈也从車􅀽声羽元反轅也从車舟声陟求反籕文輈􅀡轅車也从車具声臣鍇曰載物之車俱燭反車轅耑特衡者从車元声臣鍇曰重􅅞在衡上也元伐反轅前也从車戹声晏索反軶軥也从車軍声户昆反軶下曲也从車句声臣鍇按春秋左傳射其下兩軥而還格漚反車衡載轡者从車義声臣鍇曰尔雅軶上鐶轡所貫也研之反轙或从金獻臣鍇按尔雅鏕謂之钀載轡謂之轙然則钀與轙異疑此􅀃文本脫誤春秋傳曰輔車相依从車甫声人頰車也浮甫反驂馬内轡繫軧前者从車内声詩曰鋈以觼軜奴合反蓋弓也一曰輻也从車声臣鍇曰車椽也乗車二十八勒抱反車搖也从車从衒省声古縣反軺車後登也从車承声讀􅀂易拯馬之抍臣鍇曰从後上也視澄反乗也从車􅥘声則代反圜圍也四千人為軍从包省从車軍兵車也俱勲反範軷也从車范省声讀與犯同浮檻反出􅀅有事于道必先告其神立壇四通樹茅㠯依神為軷既􅀕犯轢牲而行為範軷从車友声詩曰取羝以軷彭札反載高皃也从車獻声臣鍇曰何晏景福殿賦曰反宇䡾䡾顔遏反車声也从車害声一曰轄鍵也閑刮反還也从車專声智箭反委輸也从車俞声臣鍇曰以車委輸也施迂反重也从車周声􅃗留反若軍發車百兩為輩从車非声􅀘配反􅱢也从車乙声尼戞反轢也从車􅭋声尼展反車所踐也从車樂声連的反車徹也从車元声臣鍇曰古車徹从車也俱皮反車跡也从車從省臣鍇曰今俗作蹤子龍反車相出也从車失声臣鍇按春秋左傳懼其侵軼我也移七反車䡩声也从車眞声讀若論語鏗尒舎瑟而作一曰讀若掔若閑反抵也从車執声臣鍇曰潘岳曰如如軒軒舉也涉利反車戻也从車匡声倦臣反礙車也从車刃声臣鍇曰止輪之轉其物名軔楊雄賦曰車不安軔尔吝反車小􅆙復合者也从車叕声誅劣反臣次立按徐鉉曰門部輟與罬同此重出礙也从車多声溪祢反車轄相擊也从車毄毄亦声周礼曰舟輿轚玄者也已惠反治車軸也从車声率眷反接軸車也从車可声可貨反車堅也从車殸声􅛮耕反反推車今有所付者从車付讀􅀂胥臣鍇按春秋後語􅀑谷子曰牽受推軵儀不如秦也乳恕反藩車下􅋻輪也从車全声讀若饌一曰無輻也臣鍇曰無輻謂直斫木為之􅀂推輪乎丑旬反大車轅耑持衡者也从車兒声臣鍇曰論語所謂大車無輗擬西反輗或从宜輗又从木大車後也从車氐声的米反大車簀也从車秦声讀􅀂臻側詵反淮陽名車穹隆轒从車賁声臣鍇按六韜曰大攻城圍邑則有轒䡝臨􅓘䡝作輼扶云反大車後壓也从車宛声迂分反大車駕馬也从車共声俱燭反連車也一曰卻車抵堂為从車从差省声讀􅀂遲臣鍇按春秋左傳曰車鮑􅀧車官名士佳反輓車也从車㚘在車前引之也里典反引車也从車免声武反反紡車也从車声讀􅀂狂一曰一輪車也倦匡反車裂人也从車睘声春秋傳曰轘諸栗門户刪反臣次立按徐鉉曰睘音渠營切非声當从環省截也从車斤斬法車裂側减反喪車忍从車而声忍伊反羣事声从三車臣鍇曰㑹意昏耕反文九十九重八臣次立曰今重六􅀘遺棿二字􅀃文解字通釋卷苐二十七
