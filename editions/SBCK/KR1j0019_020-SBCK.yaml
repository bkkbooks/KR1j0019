seq: 20
body:
  text: 兩髀之間從大圭声臣鍇按爾雅釋草云茥蒛盆奎亦人蒛盆骨天文奎亦取象也穹圭反持也從大俠二人苟掐反覆也大有餘也又欠也從大申申展也臣鍇按詩􅍕有鳬繹㑹意依漸反奢也從大于声臣鍇按老子曰服文采帶利劒是謂盗夸焉􅀲反空大也從大歳声讀􅀂詩施罟歡活反大也從大声讀􅀂詩􅨖􅨖大猷臣鍇曰今詩借秩又按山海經海外東有􅨖國又曰民不績衣不耕食也鐡從此遲匹反奢也從大亘声戸寒反大也從大爪声烏􅀲反大也從大卯声臣鍇曰又地名漢公孫賀封南奅侯匹孝反大也從大云声讀􅀂于惲反大也從大氐声讀者氐的齊反大也從大介声讀􅀂蓋苟差反大也從大此声七盗竊懐物也從亦有所持俗謂人俾夾是也弘農陜字從此臣鍇曰入入字也牧儼反文二傾頭也從大象形凡矢之属皆從矢臣鍇曰矢傾其首也齊食反頭傾也從矢􅁻声讀􅀂孑臣鍇按春秋左傳齊有慶字䋲亦用此為結字也經節反頭斜骫奊態也從矢圭声臣鍇曰骫音委羊截反姓也亦郡也呉大言也從矢口臣鍇曰大言故矢口以出声也詩頌曰不吳不􅀭不告于訩今寫詩者擅攺呉作㕦又音作華其謬甚矣㑹意阮􅀌反古文如此日西也從天日声臣鍇按易曰日昊之離作此字㑹意齊食反文五重二屈也從大象形凡夭之属皆從夭臣鍇曰夭矯其頭頸也依少反髙而曲也從夭從高省臣鍇曰按爾雅木上句曰喬上曲也故詩曰南有喬木不可休息㑹意􅇊昭反吉而免凶也從屰從夭夭死之事故謂死之不臣鍇曰國語曰偷居幸生春秋左傳曰幸而不死猶可恱屰反也反夭不夭也故曰屰吾逆㑹意恨耿反走也從夭卉声走同意俱從夭臣鍇曰夭曲也走則夭其趾故走從夭芔非声疑走于艸芔於坤反文四交脛也從大象交形凡交之屬皆從交加肴反衮也從交韋声臣鍇曰所謂僻違宇歸反縊也從交系声臣鍇曰春秋左傳絞縊以戮㑹意根卯反文二跛曲脛也從大象偏曲之形凡尣之属皆從尣臣鍇曰大一足破曲也烏光反古文從臣鍇曰春秋左傳焚巫音皇􅂰病從尣骨骨亦声胡兀反蹇也從尣皮声臣鍇曰春秋公羊曰晋使㝿俗作跛晡顆反㝿㝾行不正從尣左声臣鍇曰行左則箇反行不正也從尣㫐声讀􅀂曜臣鍇曰㫐音杳力照反不正也從尣兼声干咸反􅾎􅴃也從尣介声苟差反行脛相交也從尣勺声力照反㝿不能行爲人所引曰從尣爪是声臣鍇曰詩曰言提之耳的齊反也從尣從爪嶲声勺迷反股㝼也從尣于声臣鍇曰股曲也沉于反􅂰中疾也從尣羸声魯坐反文十二重一昆吾圜器也象形從大象其蓋也凡壷之屬皆從壷臣鍇曰昆吾紂臣作瓦器大掩之也魂􅀌反壹壷也從凶從壷不得泄凶也易曰天地壹壷臣鍇曰气擁􅓹也今易作絪緼㑹意迂分反司視也從横目從㚔令吏􅀅目捕罪人也臣鍇曰澤繹懌釋驛圛從此㑹意移赤反捕罪人也從丮㚔㚔亦声臣鍇曰丮音掬持也㑹意之習反囹圉所以拘罪人從口㚔臣鍇曰㑹意疑舉反引繋也從㚔攴見血也扶風有盩屋縣臣鍇曰攴音撲撃也􅉦字從此㑹意陟求反當罪也從㚔從􅭋􅭋服罪也臣鍇曰尚書曰報以庶􅀹史記曰張湯爰書論訊鞠報􅭋音展服也㑹意􅀘號反窮理罪人也從㚔人言竹声臣鍇曰以言之也漢書音義窮也居逺反或省言文七重一張也從大者声凡奢之屬皆從奢申嗟反籕文當奲奲皃從奢單声臣鍇曰謂重而垂也當去声兠果反文二重一人頸也從大省象頸脉形凡亢之屬皆從亢臣鍇曰亢喉嚨也故鮑昭舞鶴賦曰引員吭之纖婉本作此字格康反或從頁作􅀡項莽皃從亢從夋夋倨也亢亦声解黨反文二重一進趨也從大十大十猶兼十人也凡之屬皆從讀􅀂滔臣鍇曰大奄有之義也㑹意偷劳反疾也從􅥊声拜從此呼兀反疾有所趣也從臣鍇曰􅁀曬􅁀字與此别盆操反進也從屮從允声易曰升大吉臣鍇曰今易作允與凖反奏進也從從艸從屮屮上進義臣鍇曰史記曰藺相如前奏岀㑹意則漚反古文亦古文气臯白之進也從白從禮祝曰皐登謌曰奏故臯奏同從周禮曰詔來皷皐舞皐􅁻之也臣鍇曰臯猶皡也家豪反文六重二放也從大而入分也凡夰之屬皆從夰臣鍇曰大人也分舒散也㑹意姦皓反舉目驚然也從䀠從夰臣鍇曰禮曰見似目瞿夲此字九遇反嫚也從􅔣從夰夰亦声虞書曰者丹朱奡讀􅀂傲論語奡盪舟臣鍇曰今文尚書作傲五號反春爲昦天元气昦昦從日夰夰亦声臣鍇曰舒和廣夫皃㑹意候抱反驚走也一曰徃来皃從㚏臦周書書曰伯臩古文臦古文囧字也臣鍇曰臦背也今文尚書作具徃反文五籕文大攺古文亦象人形凡大之屬皆從大臣鍇曰中作八字象與大殊也他末反大也從大亦声詩曰奕奕梁山臣鍇曰新廟奕奕移赤反駔大也從大壯声臣鍇曰亦見爾雅勒泱反大白澤也從大白古文以爲澤字臣鍇曰澤和􅃳也㑹意姦皓反大腹也從大省声縣古文系字臣鍇曰亦􅆧名賢迷反稍前大也從大而声讀􅀂畏偄之偄爾件反大皃從大􆄢声或曰拳勇字讀􅀂傿臣鍇曰願字從此其獻反牡大也從三大三目二目為􆄢三目為益大也一曰也讀􅀂易虙羲氏詩曰不醉而怒謂之辨利反文八大夫也從大一以象簮也周制以八寸為尺十尺為丈人長八尺故曰丈夫凡夫之屬皆從夫臣鍇曰通論詳矣甫殳反有也從夫見声臣鍇曰言為可聞行為可見言有規矩也㑹意堅隨反並行也從二夫輦字從此讀若伴侣之伴臣鍇曰㑹意歩滿反文三住也從大立一之上凡立之属皆從立臣鍇按周禮注云古借此為位字里汲反臨也從立隶声臣鍇曰春秋左傳如齊涖盟今俗作涖借也隶音逮柳嗜反磊䇏重聚也從立􅙯声臣鍇􅙯音純都罪反直也從立耑声臣鍇曰春秋左傳曰太伯端委端委禮衣之幅正者顚歡反等也從立專声春秋國語曰竱本肈末職件反敬也從立束束自申束也亦声臣鍇曰立自竦也㑹意思奉反亭安也從立爭声臣鍇曰亭􅀌直也寂逞反立也從立靑声一曰細皃寂逞反待也從立矣声臣鍇曰立而待之也特史反或從巳徤也一曰匠也從立句声讀若齲逸周書有竘匠臣鍇曰蒟從此也俱取反不正也從立􅸮声臣鍇曰􅸮音過昆柴反􅀒舉也從立曷声臣鍇曰􅀒而立也其􅀬反待也從立須声臣鍇曰立而待也春秋左傳寡君􅓄矣四于反或從芻痿也從立􅢓声魯坐反偓竣也從立夋声國語曰有司巳事而竣臣鍇曰退立也七賔反見􅀑鬽皃從立录声籕文鬽字讀若虙羲氏之虙音伏臣鍇曰录禄代六反驚皃從立㫺声七削反短人立䇑䇑皃從立卑声傍把反北地高樓無屋者從立曽声臣鍇曰立爲高也作􅅬反文十九重二併也從兩立凡竝之屬皆從竝也頻靜反廢一偏下也從竝白声臣鍇曰並立而一下也白音自他計反或從曰臣鍇曰曰音越或從兟文二重二頭㑹匘蓋也象形凡囟之屬皆從囟臣鍇曰頭囟也思震反古文囟字或從宰肉毛巤象形髪在囟上及毛髪巤巤之形此與籕文字同臣鍇鍇按曰虎通人之六情所以扶成五性喜怒哀樂爱悪也自成反人之陽气性善者也從心生声臣鍇曰五性仁義禮知信属陽所以五五陽數情屬隂所以六六隂數息令反意也從心之声職吏切志也察言而知意也從心音声臣鍇曰通論詳矣乙記反意也從心旨声臣鍇曰指手指也旨甘羙也准此爲意恉字古今假借多致紛雜職美反外得於人内得于己從􅀡從心臣鍇曰通論詳矣多則反古文當也從心声臣鍇曰鷹字于陵反謹也從心眞声臣鍇曰通論詳矣時印反古文敬也從心中声珎􅀩反謹也從心㱿声刻學反美也從心䫉声臣鍇曰爾雅曰借藐字尨璞反喜也從心夬声苦夬反康也從心豈声臣鍇按詩曰愷樂飲酒刻海反快也從心声臣鍇曰今多作惬輕帖反常思也從心今声臣鍇按尚書曰我念爾祖常念之也寜虚反思也從心付声臣鍇曰甫殳反敏也從心目害省声臣鍇按禮曰發慮憲目與心應爲敏希建反平也從心登声臣鍇曰北史有薛憕􅆞陵反敬也從心難声臣鍇曰今詩作熯我孔熯矣尼綰反闓也從心斤声司馬法曰善者忻民之善閉民之惡希斤反重厚也從心軍声迂吻反厚也從心􅙯声得昏反􅁣也從心亢声一曰易忼龍有悔看浪反忼􅁣壯士不得志也從心旣声臣鍇曰内自高亢憤激也苦蓋反愊也從心囷声苦衮反誠志也從心畐声坡式反謹也從心原声臣鍇曰尚書愿而和魚怨反儇也從心彗声臣鍇曰儇敏也􅅆桂反慧也從心尞声臣鍇按詩曰佼人憭􅀆吕曉反憭也從心交声臣鍇曰佼人本此字根卯反靜也從心㾜声臣鍇曰列女傳曰后婉瘱伊閉反敬也從心折声臣鍇曰古以此字為哲字知苦反樂也從心宗声臣鍇曰謝惠連詩曰瞻涂意小悰存公反安也從心甜省声臣鍇曰荘子曰以恬養智亭嫌反大也從心夾声臣鍇老子曰天網恢恢庫推反肅也從心共声臣鍇曰通論詳矣矩容反敬也從心敬敬亦声巳皿反仁也從心如声失箸反古文和也從心台声寅之反愛也從心兹声秦思反愛也從心氏声臣鍇按爾雅忯忯愛也翹移反謹也從心全声七㳂反惠也從心因声愛根反高也從心帶声一曰極也一曰困劣臣鍇按禮曰音沾慸􅅇計反問也謹敬也從心猌声一曰􅀃也一曰甘也春秋傳曰昊天不憖又曰兩君之士皆未憖臣鍇曰猌音牛吝反皆未憗皆未甘也言意未甘止也魚晋反闊也一曰廣也大也從心廣廣亦声一曰寛也臣鍇按漢書武帝詔曰庻僚乆懬㑹意困盎反飾也從心戒声司馬法曰有虞氏悈于中國苟差反謹也從心声臣鍇曰爰穩隱字從此於靳反行賀人也從心夂吉禮以鹿皮為摯臣鍇曰攵行也㑹意丘病反寛嫺心腹皃從心宣声詩曰赫􅀆愃􅀆呼逺反順也從心孫声唐書曰五品不愻臣鍇曰今文尚書作遜蘇困反實也從心塞省声虞書曰剛而塞臣鍇按詩曰其心㥶泉今皆作塞借也四再反信心也從心旬声臣鍇曰詩恂羙旦都信羙也今借洵息寅反誠也從心冘声詩曰天命匪忱是吟反思也從心隹声與追反念思也從心褱声臣鍇曰褱音懷抱也户埋反欲知之皃從心侖声劳存反冀思也從心相声臣鍇曰希冀􅀁思之故史記司馬遷曰讀其書想見其為人息仰反深也從心㒸声夕位反起也從心畜声詩曰能不我慉臣鍇曰與起同許郁反滿也從心啻声一曰千萬曰啻臣鍇曰從此依色反籕文又省憂也從心官声古翰反摎然也從心翏声梨桃反敬也從心客声春秋傳曰以陳備三愙臣鍇曰經義三恪在二王後之上其禮轉降示敬而已今皆作恪客各反懼也從心􅀟音声春秋傳曰駟氏愯臣鍇按漢書刑法志曰愯之以思奉反恐也從心瞿声徤芋反古文恃也從心古声桓土反頼也從心恃声辰上反慮也從心曹声存公反覺也從心吾声頑乎反古文悟愛也韓鄭曰憮一曰不動從心無声臣鍇曰今爾雅作憮勿撫反惠也從心旡声臣鍇曰愛字從此先音既晏再反古文知也從心胥声臣鍇曰有才智也仙吕反安也從心声一曰恚怒也迂胃反謹也從心声讀􅀂毳臣鍇曰音山芮反此芮反箸也從心声臣鍇曰悲回思慮之也陳􅀵反朗也從心由声詩曰憂心且怞長宥反􅤷撫也從心某声讀􅀂侮臣鍇曰撫愛之也勿撫反強也從心文声臣鍇曰自強也眉均反勉也從心莫声臣鍇按爾雅注自勉強也莫度反勉也從心面声彌件反習也從心曵声余制反勉也從心楙声虞書曰惟時懋哉臣鍇曰楙音茂莫透反或省習也從心莫声臣鍇曰通論詳矣莫度反止也從心声七㳂反肆也從心隶声他沒反趣歩㦛㦛從心與声臣鍇曰㦛㦛美也尹女反􅀃也從心舀声臣鍇按春秋左傳曰日不悛以樂慆憂偷劳反安也從心厭声詩曰懕懕夜飲臣鍇曰今詩作厭於潜反安也從心詹声臣鍇曰梁有蕭憺梁武兄弟徒㺖反無為也從心白声臣鍇曰按相如子虚賦曰怕乎無為憺乎自持潘客反憂也􅀵也從心血声臣鍇曰通論詳矣相聿反極也從心干声骨安反喜欵也從心雚声爾雅曰􅌚􅌚愮愮憂也臣鍇按爾雅注賢者􅁨懼無所告也古翰反􅌚也琅琊朱虛有媀亭從心禹声元無反飢餓也從心叔声一曰憂也詩曰惄如朝飢覔反劳也從心郤声臣鍇曰􅿣猶郤也其雀反憸詖也憸利于上佞人也從心僉声七廉反息也從心曷声臣鍇曰愒猶憩豈例反精戇也從心毳声呼骨反疾利口也從心􅁽声詩曰相時􅧴民臣鍇曰今皆作憸􅁽所言衆也㑹意先廉反褊也從心及声飢泣反憂也從心辡声一曰急必撚反疾也從心亟声一曰謹重皃已力反急也從心瞏声讀􅀂絹臣鍇曰睘音珣均戰反恨也從心巠声其頸反急也從心弦声河南宻縣有亭形先反悔恨也從心毎声虎配反小怒也從心壴声臣鍇曰壴音駐唱曵反忿也從心肙声一曰憂臣鍇曰悁猶狷也于旋反籕文不服懟也從心央声隠唱反煩也從心滿声免困反懣也從心賁声臣鍇曰孔子曰不憤不啓俟其滿乃啓之也符訓反懣也從心門声免困反失意也從心周声􅐫羞反望恨也從心長声田向反太息也從心氣氣亦声詩曰愾我寤歎許意反愁不安也從心喿声詩曰念子懆懆此誥反傷也從心倉声初訪反􅉃也從心旦声臣鍇曰宋玉風流賦曰中心􅉃怛多幹反從心且詩曰信誓􅘔􅘔臣鍇曰今詩作旦冕散反痛也從心㬱声七感切毒也從心參声此嗿反痛也從心妻声七低反痛也從心同声一曰呻吟臣鍇按詩曰神罔時恫土蒙反痛也從心非声府眉反痛也從心則声蔡色反痛也從心㫺声思益反痛也從心敃声眉引反痛也從心殷声臣鍇按詩曰憂心殷殷本作此字意斤反痛声也從心依声孝經曰􅂘不㥋臣鍇曰声之曲引也今孝經作偯殷豈反䉍存也從心􅂤省声讀􅀂簡臣鍇曰􅀂尚書云簡在上帝之心艮限反動也從心蚤声曰起也素叨反動人心也從心咸声臣鍇按易曰聖人感人心而天下和平詩曰無感我帨􅀆感動也苟坎反不動也從心尢声讀􅀂祐延救反怟㥴不憂事也從心虒声讀若移書爾反怨仇也從心咎声臣鍇曰􅀂春秋左傳楚人以咎子上􅇊酒反憂皃也從心貟声羽文反憂皃從心㓜声伊紏反憂也從心羊声胤亮反憂也從心介声冝介反憂懼也從心耑声詩曰惴惴其慄支瑞反憂也從心鈞声常倫反憂也從心丙声詩曰憂心怲怲兵永反憂也從心炎声詩曰憂心如惔臣鍇曰如火􅀬也憂而心􅀬也秋南反憂也從心叕声詩曰憂心惙惙一曰意不定也誅劣反憂也􅀙心殤省声庶􅃬反憂也􅀙心秋声燀搜反憂皃從心弱声讀與惄同􅅺覔反憂困也從心舀声苦感切憂也從心攸声臣鍇按春秋左傳曰悠悠乎深思而淺謀深思而憂也延秋反憂也從心卒声讀與易萃卦同奉醉反憂也從心圂声一曰擾臣鍇按春秋左傳曰主不恩賔胡頓反楚潁之間謂憂曰從心􅫕声臣鍇曰􅫕音釐柳嗜反憂也從心于声讀􅀂吁呪于反憂也從心中声詩曰憂心忡忡臣鍇曰憂而心動也敕戎反憂也從心肖声詩曰憂心悄悄臣鍇曰憂思低下也干眇反憂也從心戚声臣鍇曰春秋左傳晋人戚憂以重我憂近心之切也今作戚同干僻反愁也從心頁声􅡣心形于顔靣故從頁臣鍇曰一本愁憂字憂從此與憂別衣仇反憂也從心上貫吅吅亦声臣鍇曰通論詳矣户慣反古文從􅀜省亦古文從􅍫心怯也從心匡匡亦声區王反思皃從心夾声去渉反火气也從心聶声一曰服也眞聶反忌難也從心單声一曰難也徒岸反懼也從心卓声陳楚謂懼曰悼徒號反
