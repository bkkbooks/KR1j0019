front:
  text: 臣鍇曰竹青也迷牝反竹裏也從竹本聲臣鍇曰竹白也􅀘忖反竹兒也從竹翁聲臣鍇曰翁然並出也烏公反差也從竹參聲臣鍇曰今無復用此字師今反引書也從竹􅂏聲臣鍇曰􅂐書著於竹竹箋簡也直選反讀書也從竹橊聲春秋傳曰卜􅘴云臣鍇曰諷誦書也卜􅘴謂讀卦爻詞也顔氏臣謬正俗曰詩不可抽也注抽讀也司馬􅁶曰細文記長宥反書也一曰關西謂榜篇從竹扁聲臣鍇按詩書之義一篇一義聮也榜笞掠也僻連反簿書也從竹耤聲臣鍇曰史記云尺籍伍符然則籍簡長天也疾辟反竹田也從竹皇聲臣鍇按漢書皇竹之區戸荒反剖竹未去節謂之蔣從竹將聲子兩反籥也從竹枼聲亦接反書僮竹笞也從竹􅕛聲臣鍇曰謂編竹以習書尚書云啓籥見書即今鑰字胤略反竹聲也從竹劉聲臣鍇曰猶言瀏然聲清也里由反牒也從竹間聲艮限反竹列也從竹亢聲臣鍇按爾雅􅀃仲無笐注云未詳格康反䓣爰也從竹部聲臣鍇按字書䓣爰簡牘也盆帚反齊簡也從竹寺寺官曹之等平也臣鍇曰簡簡牘也官曹之書也㑹意都肯反法也從竹氾聲竹簡書也古法有竹刑浮檻反表識書也從竹戔聲臣鍇曰今作牋於書中有所表記之也故張華博物志鄭玄􅀰毛萇之郡人謙敬不敢言注是也言但表識其不明者耳則千反信也漢制以竹長六寸分而相合從竹付聲臣鍇按史記漢文帝三年始與郡國守相為銅虎符竹使符注云銅虎符一至五國家當發兵遣使至都合符符合乃聴受之竹使符皆以竹箭五枚長五寸旁鐫􅂐書第一至第五以代古之珪璋從簡易也凡無反易卦用蓍也從竹古文巫字楚辝曰帝告巫陽有人在下我欲輔之魂魄離散汝筮與之巫主筮也會意時制反簮也從竹幵聲臣鍇曰女子十五而笄許嫁而筓也其端刻雞形古􅀆反取蟣北也從竹􅒳聲居而反収絲者也從竹蒦聲王若反蒦或從角閒繀絲筦也從竹廷聲臣鍇曰竹片挺也故東方朔曰以筳撞鍾曰丁反筟也從竹完聲古椀反筳也從竹孚聲讀若春秋魯公子彄逋呉反笿也可熏衣從竹冓聲宋楚謂竹篝牆以居也臣鍇曰竹籠也覆之可熏衣史記陳渉世家曰夜篝火以籠覆火也􅀛䇿傳亦然梗􅀹反迫也在瓦之下棼上從竹乍聲臣鍇曰爾雅注屋上簿謂之屋笮也滓白反堂簾也從竹廉聲臣鍇按尚書注戺堂􅄕曲隅也即謂兩階欲下隅曲處今此從竹即簾惟據此書刀蘀名簾惟皆作慊疑慊或與簾别或者此簾字後人所加之乎所不能决也連閻反牀􅳞也從竹責聲側􅉺反牀簀也從竹􅙻聲臣鍇曰春秋左傳曰牀第聲言是阻史反竹席也從竹延聲周禮度堂以筵一丈㭨然反竹席也從竹覃聲定嗛反籧篨粗竹席也從竹遽聲臣居反籧篨也從竹除聲除諸反竹器也可㠯取粗去細從竹麗聲色離反犬箕也從竹潘聲一曰蔽也臣鍇曰古亦謂車兩壁為藩作轓義同分軒反漉米籔也從竹奥聲於目反炊䉛也從竹數聲臣鍇曰木耳圜生似盤􅁼此楊憚云䑕不容穴銜窶籔也蘇走反蔽也所以蔽甑底從竹卑聲必至反飯筥從竹襄聲尔徃反可㠯􅀵也從竹象形中象人手所推握也渾素反䇘或省臣鍇曰此直象形周禮百梐􅔰盖以木作之交互以爲遮間也宗廟盛肉竹噐也從竹聲周禮供盆簝以待事梨挑反飲牛筐也從竹豦聲方言曰筐圓曰􅞠巳吕反飲馬器也從竹兠聲臣鍇曰藥有馬兠苓此也單頭反積竹矛㦸矜也從竹盧聲春秋國語朱儒扶盧論􅀌反籋也從竹拑聲臣鍇按漢書曰箝語燒書勒潜反箱也從竹爾聲臣鍇曰今俗作鑷女攝反笠篕也從竹登聲臣鍇按史記虞卿躡屩擔簦丹増反簦無抦也從竹立聲里泣反大車牝服也從竹相聲臣鍇按詩皖彼牽牛不以服箱修翔反車笭也從竹匪聲臣鍇按尚書曰惟厥士女篚厥􅀇黃昭我周王言出其處為驗也七占反榜也從竹殿聲徒論反綴衣箴也從竹咸聲止沉反㠯竿擊人也從竹削聲虞舜樂曰箾韶色捉反管三十六黃也從竹亏聲員湏反十三簧象鳯之身也笙正月之音物生故謂之笙大者謂之巢小者謂之和從竹生聲古者随作笙臣鍇按爾雅注大笙十九簧小者十三簧色行反笙中簧也從竹黄聲古者女媧作簧臣鍇按穆天子傳曰吹笙皷簧􅁑洪神僊傳僊人王遥篋中取竹簧與人對皷之也户徃反簧属也從竹是聲是支反篸差管樂象鳯之翼從竹肅聲臣鍇按爾雅注大者長尺四寸編二十三管小者十六管楚辝曰吹參差􅃓誰思參差簫也先么反通簫也從竹同聲臣鍇曰通洞無底也漢書成帝能吹洞簫頭貢反三扎籥也大者謂之筑陟祝反鼓弦竹身樂也從竹爭聲臣鍇曰古以竹為之秦樂也側泓反吹鞭也從竹􅀌聲臣鍇曰盖於鞭王作孔馬上吹之􅈱􅈱然古乎反吹筩也從竹秋聲􅍰肖反壷夭也從竹夀聲臣鍇曰􅄬壷之矢也其制似箸人以之筭數也踈􅀵反行棊相塞謂之簺從竹塞塞亦聲臣鍇曰今愽蒲馬箸其采有簺也四載反局􅃧也六箸十二棊也從竹慱聲古者烏胄作簙臣鍇按韓子秦昭王使人以鈎梯上華山以松栢之心為慱箭刻曰昭王與天神慱於此箭即心箸也本泊反藩落也從竹畢聲春秋傳曰篳門圭窬卑聿反蔽不見也從竹愛聲晏􅂯反隿射所蔽者也從竹嚴聲臣鍇曰射雉之所以自鄣也語淹反禁苑也從竹御聲春秋傳曰澤之自篽臣鍇按漢書注池篽謂於水邊作小屋落鄣魚鳥臣以爲篽禁苑之􅃒衛故張衡曰禁禦不若篽禦也疑舉反篽或作􆀦從又魚聲長六寸計歷數者從竹弄言常筭乃不誤也臣鍇曰㑹意蘇判反數也從竹具讀若筭臣鍇按春秋左傳不可算也蘇纂反此字本闕臣鉉等案孫愐唐韻引說文云喜也從竹從大而不􅄒其義今俗皆從犬又按李陽氷刋定􅀃文從竹從夭義云竹得風其體天屈如人之􅀏未知其審􅀻妙切
