body:
  text: 文百四十五重十五簸也從竹甘象刑下其丌也凡箕之属皆從箕臣鍇曰丌其下也居而反古文箕臣鍇曰此􅀡象刑皆台文臣鍇曰象舌刑乎持之籕文箕古文箕臣鍇曰已上皆象形籕文箕揚米去糠也從箕從皮聲臣鍇按詩曰維南有箕不可以􅉫揚布火切文二重五下基也薦物之丌象形凡丌之属皆從丌讀若箕臣鍇曰薦下籍以進之也居而反古之道人以木鐸記詩言從辵從丌丌亦聲讀與記同臣鍇按尚書春秋左傳皆曰每歳仲春道人以木鐸徇于路以求詩言行而求之故從辵辵行也丌也丌薦而進之也進之於上也㑹意故曰亦聲居意反五帝之書也從册在丌上尊閣之也荘都􅀃典大册也臣鍇按五帝經傳之說不同諸儒多引易繫所云作者然易通論古者聖人之制作未必盡舉五帝據孔子家語黄帝顓頊堯舜禹爲五帝尚書序少昊顓頊高辛唐虞為五帝史記與家語同國語次序黄帝以下凡五黄帝顓頊帝嚳堯舜也典言常道也言百也常行之道也尚書所謂大訓在東序司馬遷所謂金匱石室之書顛睓反古文典從竹巽也從丌顛此易卦為長女為風者蘇困反相付與之約在閣上也從丌田聲臣鍇曰閣所以承物禮曰天子之閣左逹五右逹五春秋左傳曰執曹伯㫒宋人卤之字左音信必至反具也從丌聲臣鍇曰具謂僎具而進之也音􅂫困反古文巽􅂐文巽置􅀕也從酋酋酒也下其丌也禮有奠􅀕者臣鍇曰􅀕進也奠置也置物而進之故尚書曰敢執壤奠尚書奠高山大川奠置定也庭硯反古文工從彡臣鍇曰彡音髟反法也從工弋聲臣鍇曰尚書百官承式規榘也申力反巧技也從工丂聲肯飽反䂓巨也從工象手持之形臣鍇曰今獨音炬􅃌事水許反古文巨巨或從木矢矢者其中正也文四重三極巧視之也從四工凡㠭之属皆從㠭臣鍇按周禮考工云展角之道展察視也四㠭同視也陟􅄛反室也從㠭從升窐宀中㠭猶齊也臣鍇曰塞從此叟或反文二音歷稀踈匀調也㑹意晉書有郭庚堪反飽也從甘肰臣鍇曰肰音然犬肉也㑹意於潜反猒或從㠯􅀹安樂也從甘甘匹耦也臣鍇曰禮曰子甚冝其妻㑹意神朕反古文甚文五重二詞也從口凡聲亦象口气出也凡曰之属皆從曰臣鍇曰今試言曰則口開而气出也凡稱詞者虚也語气之助也予厥反告也從册曰臣鍇曰曰告之也㑹意側麥反何也從曰匃聲臣鍇曰詩曰􅂚不肅雍􅂚詞助曰随徃也讀􅀂仍臣鍇按㤗刻石文書乃字􅁼此而冰反古文气行貌從了聲讀若攸臣鍇曰音條尚書曰柜鬯一􅓒爾雅曰􅒾中尊也延秋反文三重三气欲舒出勹上礙於一也丂古文㠯為亐字又㠯為巧字凡丂之属皆從丂臣鍇曰丂猶稽丂之意也刻保反亟詞也從丂從由或曰甹俠也三輔謂輕財者為甹臣鍇曰俠任俠也俠者便棲任气自由之為也㑹意篇丁反願詞也從丂寧聲臣鍇曰今人言寧可如此是願如此也古人云寧飲建業水是也彌丁反反丂也讀若呵獻他反文四肎也從口亦聲也凡可之属皆從可臣鍇曰可是肎也丂气躓閡可則不復疑間故反丂反丂不閡也㑹意肯我反異也一曰不偶從大從可臣鍇曰大可是異也巨離反可也從可加聲詩曰哿矣冨人閉果反聲也從二可古文㠯為謌字臣鍇曰可亦气道也故二可為聲哥猶歌也或借此為歌字更和反文四語所稽也從丂八象气越亐也凡􅀆之属皆從􅀆臣鍇曰舜歌曰南風之薰􅀆是也為有所稽考未便言之也言􅀆則語當駐駐則气越亐也賢迷反驚辝也從􅀆旬聲臣鍇曰􅀆亦气也息允反􆁎或從心气也從􅀆義聲許移反乎者語之餘也從􅀆象聲上越􅀭之形也臣鍇曰凡言乎皆上句之餘聲也故曰從我者子乎去我者鄙己乎皆聲之餘也了餘聲气上出而盡也􅃌事魂徒反文四重一痛聲也從口在丂上凡号之属皆從号臣鍇曰丂者痛聲不舒楊也指事候到反呼也從号虎聲臣鍇按詩曰誰之永號行高反文二於也象气之舒亐從丂從一一者其气乎之也凡亏之屬皆從亏臣鍇曰試言予則口气直平出也員湏反气損也從亏雐聲臣鍇曰气闕則其出舒遲故從亏起為反虧或從􅀆􅃓也審慎之辝者從宩從􅀆周書曰粤三日丁亥臣鍇曰凡言粤皆在事端句首未便言之駐其言以審思之也粤三日是也心中暗數其日數然后言之宩審字也其聲气舒乆故從亏㑹意予厥反驚語也從口從亏亏亦聲臣鍇曰口部已有疑誤重也况于反語平舒也從亏從八八分也爰禮説臣鍇曰指事爰禮即序所謂沛人印爰禮也古爰􅀽通備明反古文平字文五重二羙也從甘匕聲凡㫖之屬皆從㫖臣鍇曰禮曰調以滑㫖㫖甘也職羙反古文㫖口味之也從旨尚聲臣鍇曰口試其味也射强反文二重一樂也從壴從口凡喜之屬皆從喜臣鍇按春秋左傳曰公喜而後可知也形於言色虚已反古文喜從欠與歡同恱也從心喜喜亦聲臣鍇曰喜在心喜見爲此事是恱爲此事也㑹意忻記反大也從喜否聲春秋傳呉有太宰嚭披鄙反文三重一陳樂立而上見也從􅋄豆凡壴之屬皆從壴臣鍇曰豆􅀣鼓之象㞢其上羽葆也象形陟具反立也從壴從寸持之也讀若駐臣鍇曰此樹鼓字樹木字從木時遇反夜戒守鼓也從壴蚤聲禮昏鼓四通爲大鼓夜半三通爲戒晨旦五通爲發明讀若戚臣鍇曰周禮曰凡軍旅夜鼔􅿏一歇爲一通千益反鼓聲也從壴彡聲白亨反羙也從壴加聲間牙反文五郭也春秋之音萬物郭皮甲而出故謂之鼓從壴支象其手擊之也周禮六鼓靁鼓八面靈鼓六面路鼓四面鼖鼓臯鼓晉鼓皆兩面凡鼓之屬皆從鼓臣鍇曰郭者覆冐之意又鼓木也故為春周禮鼓人掌教六鼓以雷鼓鼓神祀以靈鼓鼓社􅀕以路鼓鼓􅀑享以鼖鼓鼓軍事以鼛鼓鼓役事昆覩反籕文鼓從古臣鍇曰古聲大鼓也從鼓咎聲詩曰鼛鼓不勝家豪反大鼓謂之鼖鼖八尺而兩面以鼓軍事從鼓卉聲扶云反臣次立曰當從說文云鼓賁聲鼖或從革賁聲騎鼓也從鼓卑聲頻奚反鼓聲也從鼓隆聲杜冬反鼓聲也從鼓􅘢聲詩曰鼗鼓鼘鼘扶蓮反鼓聲也從鼓堂聲詩曰擊鼔其鼞吞匡反鼓聲也從鼓合聲臣鍇按相如賦曰鏗鏘鼞䶀洞心駭耳道合反古文䶀從革鼓無聲也從鼓咠聲逿輙反鼓鼙聲從鼓岳聲他合反文十重三還師振旅旅樂也一曰欲也登也從豆省聲凡豈之属皆從豈臣鍇曰周禮師大捷獻愷作愷今借此為詞也丘里反康也從心豈豈亦聲刻海反也訖事之樂也從豈幾聲臣鍇按爾雅􅠟汔也故為訖巨希反文三古食肉器也從口象形凡豆之屬皆從豆臣鍇曰周禮斻人爲簋實一觳崇尺厚半寸豆實三而成觳又曰豆中縣汪縣繩以正豆之柄觳三斗也人曰食一豆肉飲一豆酒中人之食也注云一豆酒當一升酒也笛奏反古文豆臣鍇曰象形木豆謂之梪從木豆蠡也從豆䒱省聲臣鍇曰今婚禮合用匏謂之已􅀮反豆属也從豆聲俱卷反豆飴也從豆夗聲臣鍇曰飴餳也今豆名宛桓反禮器也從升持肉在豆上讀若鐙同臣鍇曰㑹意也丹増反文六重一行禮之器也從豆象形凡豊之屬皆從豊讀與禮同臣鍇曰禮軆澧字從此蓮弟反爵之次第也從豊弟虞書曰平豑東作臣鍇曰令尚書作秩運匹反文二豆之豐滿者也從豆象形一曰郷飲酒有豐俠者凡豐之屬皆從豐臣鍇曰象豆中所盛也䵄􅾈灃從此孚弓反古文豐好而長也從豐豐大也盇聲春秋傳曰羙而􅃩臣鍇曰容色豐滿也羊染反文二重一古祠器也從豆虍聲凡䖒之屬皆從䖒臣鍇曰戯亦從此許移反土鍪也從䖒号聲讀若鎬臣鍇曰鍪金屬􅁟瓦也侯􅂁反器也從䖒㿾㿾亦聲闕真與反文三虎文也象􅄱凡虍之屬皆從虍讀若春秋傳曰虍有餘臣鍇曰象文章屈曲也虎烏反騶虞也白虎黒文尾長於身仁獸食自死之肉從虍呉聲詩曰于嗟乎騶虞臣鍇按六韜慱物志林氏國經曰以鐻貫耳則耳環屬也篆文文九重三山獸之君從䖈虎足象人足象形凡虎之属皆從虎忽五反古文虎亦古文虎虎聲也從虎毄讀若隔溝厄反白虎也從虎昔省聲讀若鼏臣鍇按今人多音酣准隋曹憲作爾雅音云音見又云梁有顧䖑費䖑不知其名音爲酣民的反䖑属也從虎去聲詞暫反黒虎也從虎儵聲臣鍇按爾雅注漢宣帝南郡獲白虎獻其皮骨􅀲牙晉永嘉四年䢖平秭歸縣檻得黒虎如小虎而黒毛深為班尸竹尺虎竊毛謂之虦貓從虎戔聲􅀼淺也臣鍇按爾雅注引詩有貓有虎也昨閑反虎文也從虎彡象其文也彼虬反虎皃也從虎乂聲偶蝎反虎皃也從虎气聲疑反虎嗚也一曰師子從虎九聲臣鍇曰詩曰闞如虓虎享茅反虎聲也從虎斤聲語殷反易履虎尾􅊒􅊒恐懼一曰蠅虎也從虎􅽘聲臣鍇曰易曰震來􅊒􅊒軒逆反虎所攫盡明文也從虎寽聲古獲反委虒虎之有角者也從虎􅛣聲臣鍇曰春秋時􅀳有虒祁之官禠箎禠從此辛兹反黑虎也從虎騰聲徒朋反文十五重二虎怒也從二虎凡虤之属皆從虤眼閑反兩虎爭聲也從虤從曰讀若憖臣鍇曰曰音越㑹意言陳反分别也從虤對爭具讀􅀂囘臣鍇按左思魏都賦曰蒹葭贙㑹意預顯反文三飲食之用器也象􅄱與豆同凡皿之屬皆從皿讀􅀂猛羙而反飲器也從皿􅃓聲臣鍇按史記田蚡學孔甲盤盂諸書謂盤盂之刻銘也貟湏反小盂也從皿夗聲烏管反􅁰稷在器中也從皿成臣鍇曰春秋左傳奉盛以告曰㓗齋豊盛示征及􅁰稷在器以祀者從皿齊聲子思反小甌也從皿有聲讀若􅁅或曰若賄延􅎁反䀁或從右飯器也從皿聲論􅀌反籀文盧器也從缶皿古聲昆覩反器也從皿弔聲眞遥反盆也從皿央聲臣鍇曰漢長安城有覆盎門晏亢反盎或從瓦盎也從皿分聲歩門反器也從皿宁聲臣鍇曰從此眞與反盨􅀒戴器也從皿湏聲臣鍇按顔師古漢書注謂盨􅃺如盤如今賣食物者所戴楊憚傳作藪率武反器也從皿漻聲根卯反械器從皿必聲臣鍇曰謐從此彌畢反酸也作醯以㠯酒從酒並省從皿皿器也臣鍇曰㑹意顯繄反調味也從皿禾聲臣鍇曰詩曰亦有盉羹今詩作和借也户歌反饒也從水皿皿益之意也臣鍇曰㑹意伊昔反蒲器也從皿夃臣鍇等曰夃古乎切益多之義也古者以買物多得為夃故從夃以成反器中空也從皿㶳聲臣鍇曰㶳音盡寂泯反器虛也從皿中聲老子曰道盅而用之臣鍇曰盅而用之虚而用之也今作冲假借直柬反覆盖也從皿酓聲思甘反仁也從皿㠯食囚也官漙􅀃臣鍇曰韞從此㑹意塢門反澡也從􅍫水臨皿春秋傳曰奉匜沃盥臣鍇曰㑹意古翰反滌器也從皿湯聲臣鍇曰易云入卦相盪從廣反文二十五重三凵盧飰器目柳條之象形凡凵之属皆從凵遣如反凵或從竹去聲文一重一人相違也從大凵聲凡去之屬皆從去臣鍇曰凵即飯器也大象人也論語曰違之之一􅀖違之去也氣恕反去也從去􅂚聲臣鍇曰張衡賦曰囬至朅來朅來去來也丘絶反去也從去夌聲讀若􅁄陵力膺反文三􅀕所薦牲血也從皿一象血形也凡血之屬皆從血臣鍇曰􅀕薦毛血也翾迭反血也從血亡聲春秋傳曰士刲羊亦無􅎺也臣鍇曰心上血也怱光反凝血也從血不聲臣鍇曰衃猶肧也普杯反气液也從血􅩎􅩎亦聲臣鍇曰今作津借也將親反定息也從血甹省聲讀若亭臣鍇曰春秋左傳曰不敢寧居今作寧借也寧從此田丁反鼻岀血也從血丑聲而叔反腫血也從血䢉省聲奴聦反俗䢉從肉䢉聲血醢從血䏙聲禮記有醢㠯牛乾脯梁麴鹽酒也臣鍇曰周禮加豈之實醢他感反醢也從血菹聲齋居反蕰或從缶㠯血有所刉涂祭也從血㡬聲臣鍇按周禮肆師掌祈或為􅤀成廟則釁之雍人舉羊升屋自中屋南面刲羊血流于前乃降是􅤀為羊血也夾室則用鷄為衈士師職則云刏珥明當刏也作祈假借本作􅤀也臣希反憂也從血卩聲一曰鮮少也臣鍇按春秋傳曰君命寡君同卹社禝卹者言憂之切至也相室反傷痛也從血聿皕聲周書曰民罔不衋傷心讀􅀂憘希式反羊凝血也從血舀聲臣鍇案陶氏本草注云宋時大官作䘓削藕皮落其中血不凝知藕之散血然則䘓血羹也慳闇反䘓或從覆也從血大聲侯臘反汚血也從血蔑聲彌恱反文十五重三說文解字繫傳第九
