  text: 􅀃文解字疑義卷第三十九
  hash: sha256:c9f404aecfc753ae453ed0c146e5fed725cc33f8b402711f1c2210ba432dd67e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_039-1a}
body:
  text: 繫傳三十九文林郎守祕書省校書郎臣徐鍇撰古者文字少而民務寡是以古字多象形假借後代事繁字轉滋益形聲實象則不能紀逺故也始於八卦瞻天擬地日盈月虧山抜水曲金散土重木挺而上草聚而下皆象形也無形可載有􅀔可見則爲指事上下之別起於互對有下而上上名所以立有上而下下名所以生無定物也故立一而下上引之以見指歸故曰指事㑹意者人事也無形無􅀔取義垂訓故作㑹意載戢干戈殺以止殺故止戈則爲武君子先行其言而後從之去食存信故人言必信無形可􅁚無􅀔可􅃌無意可㑹故作形聲江河四瀆名以地分華岱五岳號隨境異逶迤峻極其狀本同故立體於側各以聲韻别之六書之中最爲淺末故後代滋益多附焉属􅀋成字而復於偏旁訓􅀶喻近譬故爲轉注人毛􅍰爲老壽􅂄耋亦老故以老字注之受意於老轉相傳注故謂之轉注義近形聲而有異焉形聲江河不同灘溼各異轉注考老實同妙好無隔此其分也五者不足則假借之古人簡昜之意也出令所以使令或長於德或長於年皆可爲長故因而假之若衣在體爲衣巾車爲巾之􅀋也此聖人制字之大倫而中古之後師有愚智學有工拙智者據義而借令長之􅀋是也淺者逺而假之􅀂山海經以俊爲舜列子以進爲盡也又有本字湮没假借獨行􅀂春秋莅盟本冝作䇐今則爲莅省者是也減􅰶之字本當從女今之􅰶字世所不行從便則假借雖移論義則冝有分別今於通釋之内各於本注注之以省疑釋滯成一家之􅀃案􅀃文有䉧瀏等字而無此字疑脫漏臣鍇以爲􅈛雅劉殺也尚書曰重我民無盡劉當云從刀金丣聲或曰從刀鎦省聲案􅀃文有誌字而無此字亦脫誤臣鍇據詩序在心爲志􅀤言爲詩當云從心之聲當在心部案􅀃文垶字注云從土騂省聲而無騂字亦脫誤案􅀃文有稀莃等字而無此字亦脫誤或疑稀字從禾從爻從巾爻巾皆象歴歴然稀䟽皃莃字從稀省亦未審也案􅀃文有摧漼等字而無此字此當是崔字之省也案􅀃文有㝃晩等字而無此字脫誤案􅀃文有油宙軸等字而無此字亦脫誤李陽氷云即􅇲字同今按古有由字亦未審也周禮保氏掌教國子六書又曰司宼之属掌通諸侯八歳属瞽史諭書名此皆所以制天下御諸侯之經也故古者以鳥迹爲始即古文也書有工拙或引筆爲畫頭重而尾纎取􅀋賦名謂之科斗孔子壁書滕公墓是也大􅂐史籀所作所謂籀文是也字體繁􅃨蓋與古文竝行故孔子時經復行古文也秦政嚴急務趣約易李斯頗刪籀文謂之小􅂐㑹稽山銘及今之􅂐文是也苛􅁀􅀹甚􅂐復不足以給故程邈作古􅀠以自贖字畫曲折􅀧綴易成即今之􅀠文但無八法而已凢此五者皆正文也而鳥書蟲書刻符殳書之􅀋隨事立制同於圗畫非文字之常也然而愚智不同師􅀃或異豪端曲折不能不小有異同許慎所解解其義也􅀧畫多少皆案程式李斯小􅂐隨筆増减所謂秦文或字體或與小􅂐爲異其中亦多云此􅂐文此古文是也如衣之􅀋本以覆二人爲義本從三屬本從到亡皆本如此而小􅂐引筆乃有小異而李陽氷一改之使依秦刻石不亦䟽乎今有所書冩則可依秦文者依之至於連篇按部一歸之􅀃文本體故臣所書字體與小􅂐不異者或依小􅂐如字中畫本直小􅂐止偃之􅀋其陽氷所􅀃與􅀃文乖異者並入袪妄篇又穆天子傳山海經諸子所有異字本皆􅂐體相承􅀠書重紕貤謬未始有極古文尚書足以證矣既未可深攷所不取焉五體之外漢魏已來縣鍼倒䪥偃波垂露之􅀋皆字體之外飾造者可述而齊蕭子良王融韋仲􅁃元威之徒隨意増益妄施小巧以異爲􅀶以多爲貴至於宋景之史秋胡之妻皆令撰書厚誣前人以成已學是以王融作七國時書皆成􅀠字其爲虚誕不言可明是以一百二十文體臣所不敢言也􅀃文解字疑義卷第三十九
