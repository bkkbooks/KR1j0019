body:
  text: 繫傳六文林郎守祕書省校書郎臣徐鍇傳釋朝散大夫行祕書省校書郎臣朱翶反切三十部文三百重七十八义手也從彐凡臼之屬皆從臼臣鍇曰兩手相义也俱燭反身中也象人要自臼之形從曰交省聲臣鍇曰要猶要也腰爲中關所以自曰持也於消反古文要文二重一早昧爽也從臼辰辰時也亦聲丮夕爲臼辰為晨皆同意凡晨之属皆從䢅臣鍇曰凡自夜半子以後為晝昧爽為寅於􅀊為正月夏正之始也二陽􅀄生和气之始羙莫甚焉君子以行事春秋左傳曰昧旦丕顯後世猶怠人君未明求衣孟子曰鷄鳴而起孜孜為善者舜之徒歟臼者自臼持也石淪反耕也從䢅囟聲臣鍇曰晨耕也囟當為凶字乃得聲疑非聲奴聦反籕文䢉從林古文䢉亦古文䢉婦人􅂉能刺韋為繡也求位反大帶也易曰􅂉錫之鞶帶男子帶鞶婦人帶絲從革般聲臣鍇曰以革為之也别安反以韋束也易曰鞏用黄牛之革故從革巩聲矩竦反履空也從革免聲臣鍇曰履空猶言履慤也吕氏春秋曰宋子罕之􅀯家為鞔者强也沒團反小兒履也讀若沓從革及聲速沓反􅜬角鞮屬也従革卬聲臣鍇曰鞮亦履今胡人履連脛謂之絡鞮顏當反革履也從革是聲臣鍇曰周禮有鞮鞻氏的齊反鞮䩡沙也從革從夾夾亦聲苟掐反鞮属也從革徙聲臣鍇曰延徒字也此字今俗作屣蔡邕倒屣所習反革生鞮也從革奚聲臣鍇曰今俗作鞋􅀱􅁫反􅀘履下從革丁聲臣鍇曰今履底下以綫為結謂之釘底是也的􅁳反蹋鞠也從革匊聲臣鍇按蹋鞠以革為圜囊實以毛蹵蹋為􅃧亦曰蹋鞠堅祝反鞠􅂉從蓻鞀遼也從革召聲臣鍇按淮南子曰武王有戒慎之鞀髙誘注曰欲戒君令愼疑者鞀摇皷臣以為皷有柄也特豪反鞀􅂉從兆聲臣鍇按論語曰播鼗武鞀􅂉從兆鼓籕文鞀從殸召量物之從革冤聲一曰抒井古以革臣鍇曰猶宛也量物之圜也抒井今言陶井也取􅅺之噐迃言反􅂉從宛刁室也從革卑聲臣鍇按春秋左傳藻率鞞琫注云刀削也邉弭反車革前曰鞎從革艮聲臣鍇按爾雅注以韋鞎與前也臣以爲鞎猶垠以革縁之為垠堮也與車底也侯恩反車軾也從革弘聲詩曰鞹鞃淺幭讀􅀂穹臣鍇曰鞹鞃以革褁車軾也古弘反車軸束也從革敄聲臣鍇曰以革束車軸製其裂也門遂反車束也從革必聲臣鍇曰車上凡束之處頻􅄒反車衡三束也曲轅縳直轅縳從革爨聲讀若論語鑚燧之鑚臣鍇曰乘車當中為一曲轅木為衡又縳軛於上乗車别鎻孔縳之大車雙直轅衡執都縳之而已不鑚也祖端反或從革賛葢杠絲也從革㫖聲臣鍇曰蓋車蓋也杠柄也絲其繫系也戰媚反車駕具也從革皮聲臣鍇曰猶今人言鞁馬也平義反轡鞥從革弇聲讀􅀂譍一曰龍頭繞者臣鍇曰猶今人言轡鞥結也梁史云元帝乗車夾􅂰頭上有蛇是也烏合反轡革也從革巴聲臣鍇曰御人所把處也左思呉都賦曰囘靶平行睨奔化反著腋鞥也從革顯聲臣鍇按劉熈釋名經也經其腹下也䦧峴反當膺也從革斤聲臣鍇曰靳固也靳制其行也春秋左傳曰如􅆖之曰鞙縣音玄也從以縣縳軶也作字非也徼犬反勒靼也従革面聲臣鍇曰其鐡曰勒其革曰彌善反鞮也従革今聲臣鍇曰鞻􅂂也巨任反所以戢弓矢􅀙革䢖聲臣鍇曰所謂櫜鞬也機元反弓矢韇也從革賣聲臣鍇曰韇所以盛弓矢也馳谷反緌也􅀙革巂聲臣鍇按禮注緌纓之餙也式垂反急也従革亟聲臣鍇曰束物之急莫若革也己力反驅也従革聲賔延反古文鞭頸靻也從革央聲􅀮唱反佩刀絲也従革蒦聲臣鍇曰荘子曰外内韄者烏白反馬尾從革它聲今之般緧臣鍇曰謂今馬後鞦連綌馬尾後者也股者槃謂屈槃繞之也緧今鞦字豆科反繫牛脛也従革見聲馨頶反鍇按詩曰誰能烹魚溉之釡􅑄似侵反古文􅑄􅑄属也從鬲曾聲臣鍇曰今俗作甑甗無底曰䰝子孕反鍑属也從鬲甫聲臣鍇曰量六斗四升曰鬴分武反鬴或從父金聲鬲属從鬲虍聲臣鍇曰虍音呼於獻為旁細也俱願反炊气上出也從鬲虫省聲臣鍇曰鎔也气上融散也春秋左傳曰明而未融孫綽曰融而為川瀆以弓反籕文融不省炊气貌也從鬲􅅝聲臣鍇曰气盛也欣消反煑也從鬲羊聲式陽反涫也從鬲沸聲臣鍇曰沸也相如上林賦湁潗鼎􅑄如此作也方未反文十三重五鬻或從食束鬻也從􅦧毓聲臣鍇曰麋即鬻也融六反或省從米凉州謂糜為從􅦧聲彌悅反省或從末粉餅也從􅦧耳聲臣鍇按周禮羞籩之實有糗餌粉餈注云粉稻米餅之曰餈又劉熈釋名云蒸燥屑餅之曰餈臣鍇以為皆非也夫粉米蒸屑皆餌也非餈也許慎曰餈稻餅也臣謂炊稻米爛乃擣之如黏然後蒸之不為粉也粉餈以豆為粉以糝餈上也餌則先屑米為粉然後溲之故許愼云餌餅也餈之言滋也熈也欲其柔釋其大也餌之言珥也欲其堅潔而浄􅀂玉珥然也諸家之􅀃莫精於􅀃文也然侍反或從食耳熬也從􅦧芻聲臣鍇曰謂熬米麥也今俗作煼為齒沼反内肉及菜湯中薄出之從􅦧翟聲臣鍇曰今諸書多作瀹禮注云新春菜可瀹故謂春􅀕曰禴鬻闕職想反文四重二持也象手有所丮據也凡丮之属皆從丮讀若也臣鍇曰出象手也已逆反種也從坴丮持種之詩曰我埶􅁰稷臣鍇曰坴土也今俗作藝魚􅀕反食餁也從丮􅙯聲易曰孰餁臣鍇曰􅙯音純孰也從手凡取是執也會意成育反設餁也從丮食才聲讀􅀂載則代反抱也從丮工聲臣鍇曰恐巩筑字從此矩悚反巩或從手相踦􅒵也從丮谷聲臣鍇按相如上林賦曰儌􅒵受屈謂以力栢踦角儌要極而受屈也其雀反繫踝也從丮戈讀若踝臣鍇曰亦謂相闘也踝脚脛下骨也春秋左傳傳以戈刜林雍斷足此㑹意户把反亦持也從反丮闕臣鍇曰凡皆手用力相佐使之許慎傳其義不憭故闕疑也俱燭反文八重一兩士相對兵仗在後象鬥之形凡鬥之屬皆從鬥臣鍇曰乙為兵也當豆反遇也從鬥斵聲臣鍇按孟子曰鬨小也當豆反鬬也從鬥共聲孟子曰鄒與魯閧恨綘反經繆殺也從門翏聲臣鍇曰經繆縊也里由反鬬取也從門􅀛聲讀􅀂三合䋲糾臣鍇按荆楚歳時記曰俗有藏鈎戲起鈎弋夫人劇此字義則不引鈎弋之梗尤反智力少劣也從門爾聲臣鍇按彌慢意也寜洗反鬬連結紛相牽也從門燹聲臣鍇曰一作音紛此今俗書紛字弗羣反鬬也從鬥賔省聲讀􅀂􅌭臣鍇曰今俗作􅌭字匹人反恒訟也詩云兄弟䦧于牆從鬥兒兒善訟者也臣鍇曰兒小兒也許壁反試力士錘也從鬥從戈或從戰省讀􅀂縣臣鍇曰謂為錘以試力士舉之較其彊弱故從鬥豫犬反文十手也象形三指者手之列多略不過三也凡又之属皆從又臣鍇曰凡手拇指頭指力之率其後二指佐佑之不動故略為三也延救反手口相􅂇也從又口臣鍇曰以謀以力也會意延救反臂上也從又從古文厶臣鍇曰臂上一節也指事吉弘反古文厷象形臣鍇曰此既象形直學人曲肱而冩之乃得其實不爾即多相亂也厷或從􅁏手指相也從又象义之形臣鍇曰所义也指事􅀄牙反手足甲也從又象义形臣鍇曰指事側狡反矩也家長率教者從又舉杖臣鍇曰指事通論詳矣浮甫反老也從义灾蘇走反籕文從寸叜或從人臣鍇按春秋左傳曰趙在後字作此和也從言又炎聲籕文從􅥷音餁字讀􅀂溼臣鍇曰又手也任力也雍雍喈喈心和形於言也子入也相聶反引也從又冐聲臣鍇曰古士樂有曼聲是長之聲也舞飯反引也從又申聲古文申臣鍇日引而申之也式人反分决也從又象决形臣鍇曰物也所以决之之噐也易曰夫决也此指事右賣反治也從又握事者也臣鍇曰周公尹天下治天下也此指事與凖反古文尹叉取也從又虘聲臣鍇按任昉彈劉整文曰舉手查范臂當作此字側巴反引也從又􅫕聲臣鍇曰􅫕音僖利之反拭也從又持巾在尸下臣鍇按左思魏都賦曰㕞馬江洲所子反逮也從又人臣鍇曰及前人也會意其急反古文及秦刻石及如此臣鍇曰此字以甲乙之乙字頭曲下叙甲乙下屈也秦嶧山㑹稽山碑也古文及臣鍇曰似已字但少曲身亦古文及禾束也從又持禾臣鍇按春秋左傳曰或取一秉秆焉詩曰彼有遺秉鄙永反覆也從又丁反􅄱臣鍇曰又反手也厂象物之反覆此指事府晚反古文反治也從又卪卪事之節臣鍇曰服字從此伐六反滑也詩云􅠭􅀆逹􅀆從又􅋄一曰取也臣鍇曰􅋄枝順也順則滑也指事偷勞反楚人謂卜問吉凶曰從又持祟讀􅀂贅臣鍇曰祟神禍也此會意振稅反拾也從又尗聲汝南名収芌為叔臣鍇曰収拾之也尸竹反叔或從寸入水有所敢也從又在下古文囘回淵水也讀􅀂沬臣鍇曰入水底取也孔子曰吕梁之水回流九十里曰状之為難入也會意謀骨反捕取也從又耳周禮獲者取左耳司馬法曰載獻聝聝者耳臣鍇曰會意此矩反埽竹也從又持臣鍇曰指事也似􅃑反古文彗從竹習臣鍇曰埽於尊加帚於箕上以袂拘而退其塵不及長者子夏之門人當灑掃􅀿對可也當習之也彗或從竹借也闕臣鍇曰遐騢從此格雅反古文叚譚長􅀃叚如此同志為友從二又相交臣鍇曰二手相順延九反古文友亦古文友法制從又庶省聲臣鍇曰布指知尺舒肱知尋故從手特路反文二十八重十六左手也象形凡􅚀之属皆從􅚀臣鍇曰􅚀佐也右手之佐也則可反賤也執事者從􅚀甲臣鍇曰右重而左卑也在甲之下㑹意賔而反文二記事者也從又持中中正也凡史之属皆從㕜臣鍇曰記事當主於中正也會意瑟耳反職也從㕜之省聲臣鍇曰亦取於正也側字反古文事臣鍇曰此則之字不省也文二重一去竹之枝也從手持半竹凡支之属皆從支臣鍇曰竹葉下垂也章移反古文支持去也從支竒聲牽竒反文二重一手之疌巧從又持巾凡之属皆從臣鍇曰巾所持也指事女㒤反習也從聿㣇聲臣鍇按春秋左傳寗俞曰臣以爲肄業及之也羊媚反籕文􅂐文臣鍇曰疑字之左也持事振敬也從聿在􅘢上戰戰兢兢臣鍇曰通論詳矣息六反古文肅從心卪文三重三所以書也楚謂之聿吴謂之不律燕謂之弗從聿一聲凡聿之属皆從聿臣鍇曰筆尚便捷故王羲之筆經曰筆尚輕重則躓矣會意與必反秦謂之筆從聿竹臣鍇曰會意碑乙反聿飾也從聿從彡俗語以書好爲􅩎讀若也臣鍇曰筆經曰世人多以流離象牙為筆管麗飾則有之然筆尚輕也凡飾物通用彡字也將親反著也從聿者聲臣鍇曰著於竹帛曰書也式魚反文四界也象田四界聿所以畫之凡畫之属皆從畫臣鍇曰若筆畫之也其界也指事户麥反古文畫亦古文畫臣鍇曰刀所以割制之也日之出入與夜為界從畫省從曰臣鍇曰會意論語曰今汝畫畫止也􅀂夜至畫而止也貞狩反籀文晝文二重三及也從又尾省又特尾者從後及之也凡隶之屬皆從隶徒再反反也從隶枲聲詩曰天之未隂雨徒再反附著也從隶柰聲婁惠反􅂐文􅀠從古文之體臣鍇曰今人書用此字文三重一堅也從又臣聲凡臤之屬皆從臤讀若鏗锵古文以為臤字臣鍇按白虎通曰臣者繵堅也屬志自堅固㑹意苦閑反纒絲急也從臤絲省聲糺忍反剛也從臤從土臣鍇曰剛土也㑹意激賢反堅立也從臤豆聲臣鍇曰豆噐也故為堅立韶乳反籕文堅從殳文四重一牽也事君也象屈服之形凡臣之屬皆從臣臣鍇曰通論詳矣石眞反乖也從二臣相違讀若誑臣鍇曰臣不叶力爭於事乖也句唱反善也從臣戕聲走張反籕文文三重一以杸殊人也禮殳以積竹八觚長丈二只䢖於兵車旅賁以先驅從又凡聲凡殳之屬皆從殳臣鍇口斷絶分㭊為殊積竹謂削去白取其青處合為之取其有力也漢昌邑王買積竹杖是也詩云伯也執殳為王前驅觚稜也殳音􅊋舩區反殳也從殳示聲或說城郭市里髙縣羊皮有不當入而欲入者暫下以驚牛馬曰祋故從示殳詩曰何戈與祋臣鍇按馮翊有祋詡縣丁最反軍中士所持殳也從木從殳司馬法曰執羽以杸臣鍇曰以木為之質賤也舡區反相撃中也如車相撃故從殳從也臣鍇曰厶車軸也此指事堅歷反從上撃下也從殳􅿢聲一曰素也臣按􅿢音口江反又刻學反下撃上也從殳冘聲竹甚反繇撃也從殳豆聲古文杸如此臣鍇曰繇遥也特婁反縣物撃也從殳聲臣鍇曰音儔市柔反推􅌛物也從殳豕聲臣鍇曰推音丈追反丁燭反捶毄物也從殳區聲臣鍇曰以枚撃也恩斗反撃頭也從殳髙聲臣鍇按春秋左傳曰奪其枚以㪣之也口卓反撃聲也從殳聲庭硯反撃中聲也從殳医聲臣鍇曰醫翳從此於計反推物也從殳耑省聲臣鍇曰推音直推反徒亂反撃空聲也從殳官聲臣鍇曰謂噐外無􅂩内空撃之其聲然杜紅反相雜錯也從殳肴聲臣鍇曰殳所以表物今則雜錯故爲殽也侯交反妄怒也一曰毅有决也從殳聲臣鍇曰春秋左傳殺敵爲果致果爲毅辛豕毅怒也言旣反揉屈也從殳古叀字廏字從此臣鍇曰叀順也見岫反戍邉也從殳從彳臣鍇曰彳行也會意與辟反古文役從人㱾改大剛新生羽而飛從彡從臣鍇曰短羽故云新生羽又彡部㐱字從彡人人物之人也與此相似但字左畫上出字右畫上出也支允反舒鳬鶩從鳥几聲臣鍇曰鳬短羽也名舒鳬凡無反文三十分也人手郤一寸動衇謂之寸口從又一凡寸之屬皆從寸臣鍇曰一者記手腕下一寸此指事也麤巽反廷也有法度者也從寸之聲臣鍇曰守寺也寸法度也辭伺反帥也從寸省聲子長反澤理也從二口從又寸二口亂也又寸分理之彡聲此與同意度人之兩臂為尋八尺也臣鍇曰口言也工爲噐也詩曰如彼築室于道謀是用不潰于成謀夫孔多是用不售故云亂也又手也寸法度理之也彡音芟似侵反六寸簿也從寸軎聲一曰􅌹紡􅌹臣鍇曰簿文簿也詩曰乃生女子載弄之瓦注云紡塼也臣以爲今絡絲之塼也凖旋反布也從寸甫聲臣鍇曰布以法度也相如子虚賦曰專結縷法云布也專字如此甫殳反導引也從寸道聲臣鍇曰以寸引之也徒號反文七剥取獸革者謂之皮從又爲省聲凡皮之属皆從皮臣鍇曰又手也生曰皮理之曰革柔之曰韋貧知反古文皮臣鍇曰禮如竹箭之有筠筠從皮也籀文皮靣生氣也從皮包聲臣鍇曰靣瘡也皮豹反靣黒气也從皮于聲臣鍇曰今醫方云皯也根旱反文三重二柔韋也從北皮省夐省凡㼱之属皆從㼱讀􅀂耎一曰􅀂雋臣鍇按周禮考工記注云攻皮之工蒼頡篇有㼱也此觧脫誤爾件反古文㼱籀文㼱從夐省羽獵韋絝從㼱灷聲乳􅂲反虞書曰鳥獸毛從從衣臣鍇曰此亦字鳥以柔毳爲衣故從衣當言從衣從朕皆脫誤文二重三正也子帥以正孰敢不正周官司馬掌邦政謂九伐之法也攴撃也眞性反敷也從攴也聲讀與施同臣鍇按尚書曰翕受敷施今作施申而反􅴬也從攴專聲周書曰用敷遺後人甫丈反主也從攴典聲臣鍇曰今作典顛腆反數也從攴麗聲臣鍇按詩曰啇之孫子其不億今詩借麗字蓮弟反計也從攴婁聲率武反辟潄鐡也從攴涷臣鍇曰涷錬字也攴椎鍜之也會意郎電反汲汲也從攴子聲周書曰孜孜無怠則欺反分也從攴分聲周書曰乃惟孺子攽讀與虨同臣鍇曰今尚書曰乃惟孺子頒朕不暇當作攽也今借頒不攀反止也從攴旱聲周書曰㪋我干艱臣鍇曰今尚書借扞字侯玩反有所治也從攴豈聲讀􅀂􅛮臣鍇按春秋左傳十六族有隤敳又􅀳有􅁃敳偶來反平治高土可以逺望也從攴尚聲臣鍇按史記韓信行營高敞地會意赤攴反理也從攴伸聲式人反更也從攴已聲李陽氷曰己有過攴之即改臣鍇曰從戊己之己古亥反更也從攴䜌聲臣鍇曰攴有為也秘􅒋反改也從攴丙聲干諍反誠也臿地曰敕從攴束聲臣鍇按春秋左傳注曰執鞭以出敎令也暢陟反使也從攴取省聲而攝反􅀵也從攴僉聲留琰反擇也從攴鹵聲周書曰乃甲胄梨桃反繫連也從攴喬聲周書曰敿乃干讀若矯臣鍇曰干盾也尚書注曰連盾絲也臣鍇以為紛小組帶所以繫盾􅈹己少反合會也從攴合聲茍合反列也從攴陳聲臣鍇曰古書軍敶多如此遟慎反仇也從攴啻聲臣鍇曰啻式䜴反田溺反曰多蔵必厚亡貝貨也故從貝㑹意歩拜反籕文敗從賏臣鍇曰積貝也煩也從攴􅜆聲魯􅂏反暴也從攴完臣鍇曰當其完聚而欲冦之也可候反剌也從攴􅃖聲眠雉反閉也從攴度聲讀􅀂杜臣鍇曰今借杜宇徒􅁟反􅖏或從刀塞也從攴念聲周書曰敜乃穽奴輙反㪤盡也從攴畢聲畢聿反捕也從攴丩聲申立反撃皷也從攴壴壴亦聲讀􅀂屬臣鍇曰鼔撃之鼓也壴陳樂也故云亦聲此㑹意昆覩反敂也從攴丂聲臣鍇曰今周禮考功字如此刻保反撃也從攴句聲讀􅀂扣臣鍇曰周禮敂􅀜字如此可􅀱反撃也從攴工聲昆戎反横擿從攴高聲臣鍇曰從旁横撃也口交反撃也從攴豕聲輟角反㪏也從攴兒聲逆計反放也從攴聲迂徃反坼也從攴從厂厂之性圻果熟有味亦坼故謂之􅫕從未聲臣鍇曰攴撃取也厂厓岸也未草重葉有滋味也軒其反去隂之形也從攴蜀聲周書曰刖劓􅢴黥輟角反冐也從攴昏聲周書曰不畏死眉引反禁也一曰樂噐控掲也形如木虎從攴吾聲臣鍇曰控口江反掲口八反如虎背有鉏鋙也疑舉反研治也從攴果聲舜女弟名㪙首臣鍇按漢書古今人表云㪙手若墮持也從攴金聲讀􅀂琴巨任反棄也從攴􅔧聲周書以為討詩云無我􅀆市柔反平田也從攴田周書曰畋爾田笛前反㱾改大剛卯以逐􅀑鬽也從攴己聲讀􅀂㠯古亥反次弟也從攴余聲夕與反毁也從攴褱聲臣鍇曰人毁之也孔安國曰壞孔子宅當作此字古賣反毁也從攴卑聲辟米反養牛人也從攴牛詩曰牧人乃夢臣鍇曰會意莫叔反撃馬也從攴束聲測麥反小春也從攴聲臣鍇曰去小麥皮也又萬反䚫田也從攴尭聲牽􅂓反文七十八重六上所施下所効也從攴􅍿凡敎之属皆従敎臣鍇曰攴所執以敎道人也􅍿音敎效也㑹意角效反古文敎臣鍇曰古言字以言敎之古文覺悟也從敎從冂冂尚朦也臼聲遐嶽反􅂐文斆省文二重三灼剥􅀛也象灸􅀛之形一曰象􅀛兆之從横也凡卜之属皆從卜己伏反古文卜臣鍇曰兆有如此者筮也從卜圭聲古賣反卜以問疑也從口卜讀與稽同臣鍇曰尚書曰明用稽疑今文借稽字古􅀆反􅁲問也從卜貝以為贄一曰鼎省聲京房所􅀃臣鍇曰周禮有大貞之禮謂卜大事也齎以卜詩曰握粟出卜㑹意陟情反易卦之上體啇書曰貞曰􅩔臣鍇曰尚書曰曰貞曰􅩔今借悔字虎配反視兆問也從卜口臣鍇曰㑹意之廉反卜問也從卜召聲食犬反灼􅀛坼也從卜象形臣鍇曰兆有如此者指事池沼反古文兆省􅂐文爽文三重一􅀃文解字通釋卷第六
