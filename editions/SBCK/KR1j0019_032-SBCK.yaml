body:
  text: 繫傳三十二文林郎守祕書省校書郎臣徐鍇撰人天成地平人生其間盈天地之間惟人人乆則􅎅故次之以匕而比之乆而不遺也故次之以􅎅比而相从故次之以反道相从爲比故次之以有比必有背故次之以北背也背而求衆故次之以依衆也衆依於丘故次之以丘土之厚也故次之以壬者厚也故次之以裘衣之重也故次之以童子不衣裘故次之以老則毛髮先變故次之以毳細毛也故次之以尸者毛所主也故次之以尸者身也以身爲尺度故次之以㞑尸之後故次之以􅃦不尸故次之以卧以安身故次之以反身必有依故次之以衣者身之飾故次之以衣所以明禮故次之以履禮也履所以載人故次之以大夫方舟故次之以舟在人之下几亦在下故次之以兄以口敎其下故次之以旡人所以飾也故次之以所以爲容故次之以夗所以蔽皃故次之以擁蔽者有先也故次之以先者勞故次之以秃者有所見故次之以覞並見也故次之以見而欲之故次之以敬近於事􅀑故次之以􅀑者狀仿佛而私故次之以故次之以仿佛者景嵬然故次之以嵬然而髙者山故次之以故次之以山屵然而髙故次之以屵山岸也依山而居故次之以故次之以旁巖而居者其地反仄故次之以反仄而危故次之以形危者石故次之以石之乆也故次之以長而動揺者勿故次之以勿旗也動而冊弱故次之以冄冄者人之􅁂故次之以而􅁂也畜之多而鬣者豕故次之以㣇其屬也故次之以豕之屬鼻卷故次之以豕性爲豚故次之以獸之長脊似於豚故次之以豸強獸也獸之強者兕故次之以兕野獸也虫獸之畏人也虺易故次之以野獸之大者􅁚故次之以􅁚者大可像也馬亦大獸也故次之以黙之神者廌故次之以鹿亦旅行群食義獸也故次之以鹿之群行爲麤故次之以獸之善走㲋故次之以兎㲋属也故次之以獸之似兎者莧故次之以莧善走犬亦善走故次之以犬好爭故次之以犬以捕獸獸之穴者䑕故次之以獸之強者能能熊之属也熊属穴居故次之以故次之以熊陽物也熊熊然火之盛也故次之以故次之以炎煙所箸者黒故次之以通黒者囱故次之以熖火之􅆋故次之以故次之以故次之以火者光炎大也故次之以大人形也故次之以亦人掖也掖蛘而側故次之以夨者夭矯也故次之以夭相交故次之以脛劣而交故次之以介者气不至於足也气在腹不通􅀂壷故次之以壷者中一鬱故次之以壹以防盜故次之以盜爲盜夸故次之以奢必亢故次之以亢進之以進也進而不巳必放故次之以放髟而大故次之以介古文大也亦人形故次之以三十而立爲丈夫也故次之以􅀟立爲竝故次之以竝者㑹也頭葢所會爲囟故次之以囟气所通也故次之以思生於心故次之以心生疑故次之以惢疑也心大火也火水之妃也故次之以二水故次西方所食者鹵故次之以鹵所以爲塩故次之以塩者門到而户食之故次之以故次之以耳者人之門也故次之以􅒳耳之輔也故次之以􅒳􅃌相應故次之以手臂所連爲故次之以在人之後人之後隨人者也女亦隨人故次之以女以一自守故次之以民人之􅀩暗民隂也女亦隂也故次之以民閑則自放故次之以夭夭然自融曵故次之以亦右曵也故次之以圡之附山將陁落爲氏阤乙也也故次之以阤必有所止故次之以氐戈者㦸之平頭所以抵故次之以戊戈之主也故次之以戊所執以主断我亦所執稱也故次之以鉤啄也所以鉤制留􅀃文解字部叙第三十二
