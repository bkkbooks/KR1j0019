seq: 24
body:
  text: 大霓繞斗星而生黃帝顓頊母感瑶光賁月而生顓頊也會意息正反神農居薑水因以為姓從女羊聲九啇反黃帝居姬水因水為姓從女臣聲居而反黃帝之後伯䱔姓也后稷妃家從女吉聲臣鍇曰春秋左傳姞吉人也后稷之元妃也伯鯈南燕伯也巨乙反帝少皡之姓也從女羸省聲以征氏虞舜居姚虛因以為姓從女兆聲或以為姚嬈也史篇以為姚易也延朝反人姓也從女然聲年霓反虞舜居媯汭因以為姓從女為聲俱為反祝融之後姓也從女云聲羽文反籕文妘從殷諸侯為亂疑姓也從女先聲春秋傳曰啇有姺邳思典反也從女田聲啇書曰無有作􅤋吼號反人姓也從女其聲杜林説娸醜也或曰讀若近遣之反少女也從女乇聲張迓反謀也謀合二姓從女某聲莫堆反酌也斟酌二姓也從女勺聲臣鍇按毛詩注曰媒妁之言是也實削反女適人從女家聲干乍反取婦也從女取聲七駐反婦家也從女昏禮娶婦以昏時婦人隂故曰婚喧盆反籕文婚如此壻家也女之所因故曰姻從女因聲伊倫反籕文姻從􅘢婦與巳齊者也從女從􅋄從又又持事妻職也􅋄聲七低反臣次立按徐鉉曰􅋄進也齊之義也古文妻從女古文貴字服也從女持帚灑掃也臣鍇曰自此以上通論詳矣符九反匹也從女巳聲芳非反妃也從女聲匹計反孕也從女壬壬亦聲而沈反女妊身動也從女春秋傳曰后緡方娠一曰官婢女隸曰娠章信反婦人妊身也從女芻聲周書曰至媰婦臣鍇曰今尚書曰至于屬婦側秀反生子齊均也從女聲讀若幡符販反臣次立按説文曰從女從生免聲婗也從女殹聲幽雞反嫕婗也從女兒聲一曰婦惡貌臣鍇曰嫕婗嬰兒貌也擬西反牧也從女象懷子形一曰象乳臣鍇曰通論詳矣莫厚反母也從女區聲迓注反母老稱也從女昷聲讀若奧武威有媪闈縣晏考反嫗也從女句聲臣鍇曰史記吕娥姁吕后也勳成反蜀人謂母曰姐淮南謂之社從女且聲讀若左即瓦反夫母也從女古聲古呼反姑也從女戌聲律曰婦告威姑臣鍇曰借為威權也迂歸反臣次立按説文曰從女從戍徐鍇曰土盛于戍土隂之主也故從戍神潢步捋反女隸也從女奚聲臣鍇按周禮曰奚八人借奚字賢迷反女之卑者從女卑卑亦聲臣鍇曰會意頻旨反婦官也從女弋聲以即反奴婢皆古罪人從女又聲周禮曰其奴男人于罪隸女人于春藁內都反臣次立曰又非聲按徐鉉云又手也持事者也當云從反古文奴從人甘氏星經曰太白號上公妻曰女媊居南牛食厲天下祭之謂之明星從女前聲臣鍇曰甘氏史記張耳傳所謂甘公太白隂也故為上公妻山海經西王母司天之厲厲癘氣也即然反古之神聖女化萬物者也從女咼聲古雖反籕文媧從帝高辛之妃卨母號也從女戎聲詩曰有娀方將臣鍇曰吕氏春秋女娀高辛之妃吞燕邜所生契也昔中反帝堯之女舜妻娥皇也從女我聲秦晉謂好曰也從女耳聲然侍反女之𥘉也從女台聲臣鍇按易曰有天地然後有萬物然後有夫婦有夫婦然後有上下人曰至哉坤元萬物資始坤母道也會意施起反説也從女睂聲容至反媚也從女無聲臣鍇曰相如上林賦曰嫵媚冉弱然柱反色好也從女美聲免鄙反媚也從女畜聲許郁反南楚之外謂好曰媠從女隋省聲吐破反好也從女朱聲尺朱反美也從女子臣鍇曰子者男子之美稱也會意蒿老反説也從女興聲香孕反好也從女厭聲于潛反好也從女殳聲詩曰靜女其􅩱臣鍇曰今詩作妹尺朱反好也從女交聲臣鍇按史記曰秦後有長姣美人根卵反好也從女聲讀若蜀郡布名臣鍇曰此今人所書娟字也于旋反好也從女兊聲吐祋反目裏好也從女苖聲夢梢反靜好也從女畫聲麾獲反體德好也從女官聲讀若楚卻宛宛桓反長好也從女巠聲擬鏗反白好也從女贊聲或曰不謹也箭鴈反順也從女􅜆聲詩曰婉兮􅸸兮蔞遣反籕文􅸸如此順也從女宛聲春秋傳太子痤婉蔚逺反婉也從女卯聲迓券反項直貌也從女同聲它奉反長貌也從女焉聲臣鍇曰漢有韓嫣倚健反弱長貌從女冉聲柔撿反姌也從女弱聲臣鍇按楚辭曰嫋兮秋風禰了反鋭細也從女韱聲先亷反嬰嫇也從女冥聲一曰嫇嫇小人貌民甹反曲肩行貌從女聲延朝反材緊也從女睘聲春秋傳曰嬛嫁在疚臣鍇曰張衡賦所謂嬛材也虛全反間體行􅛭􅛭也從女危聲臣鍇曰間體體間放也丑果反􅛭也從女果聲一曰果敢也一曰女侍曰婐讀若騧一曰若委孟軻曰舜為天子二女婐烏禍反委隨也從女禾聲臣鍇按春秋左傳曰女子從人者也醖纍反臣次立曰禾菲聲按徐鉉曰委曲也敢禾榖垂穗委而之貌當云從禾婐􅛭也一曰弱也從女巵聲臣鍇曰巵音一果反奴埵反小弱也從女占聲一曰女輕薄善走讀若占一曰多技藝齒摺反妗也從女沾聲敕淹反妗也從女今聲一曰善笑貌處占反竦身也從女簋聲讀若詩曰糾糾葛履巳少反竦立也從女靑聲一曰有才讀若韭菁臣鍇按劉向列女傳齊有女婧此併反靜也從女并聲從性反婦人貌從女乏聲匹之反好女也從女旋聲旋延反材也從女齊聲子泥反靣醜也從女􅡜聲户刮反直好貌從女翟聲一曰嬈也徒了反媞也從女規聲讀若癸秦晉謂細要曰蚪葵反諦也從女是聲一曰研黠也一曰江淮之間謂母曰媞善𥿄反不繇也從女敄聲勿赴反雅也從女間聲臣鍇曰謂間雅逶迤若女子也候艱反説樂也從女巸聲臣鍇按春秋左傳鄭有公子媐軒其反樂也從女吳聲元于反也從女矣聲一曰卑賤名也過在反樂也從女甚聲貪反順也從女尾聲讀若媚亡斐反孎也從女啻聲顛狄反謹也從如屬聲讀若人不孫為不孎輟蜀反宴􅾴也從女冤聲迂眷反女有心媕市也婆婆先多反耦也從女有聲讀若佑延救反姷或從人鈞適也謂男女併也從女旬聲讀若旬堅鄰反婦人小物也從女此聲詩曰屢舞姕姕即冝反婦人小物也從女攴聲讀若跋行臣鍇曰物猶言人物也強倚反頸飾也從女賏賏其連也臣鍇曰會意又女曰嬰通論詳矣伊貞反三女為美也從女聲臣鍇按國語人三為衆女三為美物也今借粲字七贊反美女也人所欲援也從女爰聲詩曰邦之媛兮臣鍇曰援援助也王化之基始于內德也干靣反問也從女專聲扁令反隨從也從女録聲劣束反飾也從女牀省聲臣鍇曰今俗作粧側羊反慕也從女􅒋聲蔞遣反嬻也從女枼聲和列反媟嬻也從女賣聲陀谷反短靣也從女聲詄貀反便辟也愛也從女辟聲臣鍇按春秋左傳云嬖人之子也辟桂反難也從女毄聲起賣反妒也從女介聲恆艾反婦妒夫也從女户聲得兔反夫妒婦也從女胃聲讀若胞一曰梅目相視也臣鍇按史記曰妒媦生患莫號反巧也詩曰桃之􅯾􅯾女子笑貌從女芺聲臣鍇曰少而速壯也殷喬反巧讇髙材也從女仁聲年徑反臣次立曰仁非聲按説文曰從信省徐鉉曰女子之信近于佞也小心態也從女熒省聲恩行反婟也從女翏聲勞到反嫪也從女固聲渾素反態也從女次聲子私反驕也從女虘聲臣鍇按嵇康詩曰母兄鞠育有慈無威恃受肆㜘不訓不師借姐字也即絮反害也從女方臣鍇曰若女之性相妨也弗啇反亂也從女亡聲聞誰反巧黠也從女俞聲臣鍇按春秋左傳趙孟丨丨偷甚矣忒婁反鹵貪也從女汚聲渾素反小小侵也從女肖聲息約反量也從女朵聲兜果反動也從女由聲臣鍇曰詩曰憂心且妯甲溺反不平于心也從女兼聲一曰疑也臣鍇曰女子多嫌疑賢兼反減也從女省聲臣鍇按顔之推家訓作此女省字息永反不順也從女若聲春秋有叔孫婼禇芍反狠也一曰見親從女幸聲楚詞曰鯀嬌直賢頂反昜使怒也從女敝聲讀若撇擊劣反好枝格人語也一曰靳也從女善聲方闡反疾悍也從女叕聲讀若唾誅反含怒也一曰難知也從女酓聲詩曰碩大且媕臣鍇曰今詩云碩大且儼此當云讀若也丑感反媕婀也從女阿聲鶯何反技也一曰不省録事也從女並聲一曰難侵讀若研一曰慧也一曰安也禦堅反圜深目貌也從女圭聲或曰吳楚之間謂好娃臣鍇曰吳有館娃宫娃宫深意也思崖反不􅎱前却從女陜聲臣鍇曰乍進乍退無姿製也收儼反鼻目間克從女夬聲讀若煙火蚗炔縈節反愚戇多態也從女巂聲讀若隓式垂反不説貌也從女恚聲于棄反怒貌也從女黑聲亨勒反輕也從女成聲于厥反輕也從女䙳聲片祅反訬疾也從女垔聲古多反女人自稱姎我也從女央聲晏亢反不説貌恣也後女韋聲字歸反如婎姿也一曰醜也從女惟聲翾惟反有守也從女弦聲形先反輕貌也從女扁聲僻連反悔昜也從女曼聲謀患反疾言失次也從女臿聲讀若懾丑輒反弱也一曰不妻也從女需聲四于反不肖也從女否聲讀若竹皮箬浦吼反遲鈍也從女臺聲闒嬯亦如此田咍反下志貪頑也從女覃聲讀若深乃簟反婪也從女參聲此嗿反貪也從女林聲杜林説卜者黨相許驗為婪讀若談臣鍇田女性多貪婁參反懈怠也從女賴聲一曰卧食臣鍇曰女性多怠也勒但反空也從母中女婁空之意也一曰婁務愚也臣鍇曰毋一作毋皆無也口中空也女心無事者也務婁愚故從女勒兜反籕文婁從人中女曰聲古文婁如此娎㛍也從女折聲許列反得志㛍㛍也從除也從女并聲漢律曰齊人與妻婢姦曰姘披彭反犯淫從女干干亦聲臣鍇曰春秋左傳曰臣姦旗鼓姦不以犯道也骨安反婦人汚見也從女半聲漢律曰見姅變不得侍祠晡漫反女出病也從女廷聲笛頲反女病也從女卓聲獰教反諉也從女聲竹至反有所恨痛也從女省聲今汝南人有所恨言大惱臣鍇曰事過而好恨痛者婦人之性也奴道反慙也從女鬼聲臣鍇曰易慙愧女子也短遂反愧或從恥省訟也從二女女還反私也從三女箇山反古文姦從旱心美也從女臤聲苦間切文二百五十八重十四右戾也象左引之形凡丿之屬皆從丿臣鍇曰其為文舉首而申體也夭字從此依必反芟草也從相交臣鍇曰象刈草之刀形偶喙反乂或從刀嬌也從韋省從臣鍇曰弗者違也分勿反左戾從反讀與弗同皮密反文四重一抴也明也象抴引之形凡􅛣之屬皆從􅛣虒字從此臣鍇曰曵物形象􅛣而不舉首也延世反檿也象折木鋭邪著形􅛣象物挂之也臣鍇按爾雅橛謂之禍弋也以即反文二上諱擊也臣鍇曰後漢孝和帝名也當言始也故從戈肁聲池沼反兵也從戈古文甲字臣鍇曰會意如融反周制侍臣執戣立于東垂兵也從戈癸聲揆推反盾也從戈旱聲侯玩反有枝兵也從戈倝聲周禮戟長丈六尺巳逆反戟也從戈百讀若棘根察反販也從戈則聲臣鍇曰販猶害也殘忒反守邉也從人持戈臣鍇曰會意失格反鬪也從戈單聲正彥反三軍之偏也一曰兵也從戈虞聲臣鍇曰史記所謂戲下也欣智反利也一曰剔也從戈呈聲臣鍇曰山海經有氏國不續不耕服也不稼不穡食也亭結反邦也從口戈以守一一地也臣鍇曰口音圍此會意于抑反或或從土斷也從戈雀聲情鐵反殺也從戈今聲啇書曰西伯既黎臣鍇曰爾雅堪殺也慳南反槍也他國臣來弒君曰戕從戈爿聲臣鍇按春秋左傳邾人戕鄫子賤忘反殺也從戈翏聲栗菊反刺也從戈甚聲臣鍇曰今以此為􅨹也慳南反長槍也從戈寅聲春秋傳有搗戭異展反傷也從戈才聲臣鍇曰哉災裁載栽之類字從此走該反滅也從戈晉聲詩曰實始戬商子善反絶也從從持戈一曰田器古文讀若咸一曰讀若詩云攕攕女手臣鍇曰從二人也會意韱從此精亷反楚莊王曰夫武定功戢兵故止戈為武文甫反藏兵也從戈咠聲詩曰載戢干戈臻邑反闕職從此古職字古之職役皆執于戈臣鍇曰闕者不知所以從音也章直反賊也從二戈周書曰戔戔巧言臣鍇曰兵多則殘也會意自間反文二十六重一大斧也從戈聲司馬法曰夏執玄戊殷執白戚周左杖黃戉右記白旄凡戉之屬皆從戉臣鍇曰音厥今作鉞鉞音劌于厥反戉也從戉叔聲千益反文二施身自謂也或説我頃頓也從戈古文垂也一曰古文殺字凡我之屬皆從我臣鍇曰所以從戈者取戈自持也或説則為傾側之俄故云垂也顔左反古文我已之威儀也從我從羊臣鍇曰通論詳矣魚智反墨翟書義從弗魏郡有羛陽鄉讀若錡今屬鄴本丙黃北二十里鄉也文三重一鈎逆者謂之丨象形凡亅之屬皆從亅讀若臣鍇曰鉤喙之曲芒今曰逆須從此翟月反鉤識也從反丨讀若窡臣鍇曰鈎柄之表識戉從此俱越反文二禁也神農所作洞越練朱五弦周加二弦象形也凡珡之屬皆從珡臣鍇曰君子所以自禁制也越竅也巨今反古文珡從金庖犧所作弦樂也從珡必聲臣鍇曰弘廣也吳扎觀樂曰聖人之弘也史記黃帝使素女鼓五十弦珡黃帝悲乃分之為二十五弦然則五十弦庖犧所為也師訖反古文瑟文二重二匿也象􅲖曲隱蔽形凡之屬皆從讀若隱依謹反正見也從十目臣鍇曰隱也今十目所見是直也春秋左傳曰叔向古之遺直也會意陳力反古文直或從木如此文二重一逃也從入凡亡之屬皆從亡臣鍇曰􅡊音隱魯昭公逃于齊稱亡人也會意勿強反止也一曰亡也從亡一一有所礙也臣鍇曰出亡得一則止暫止也指事愁亞反出亡在外望其還也從亡望省聲臣鍇曰望音望聞誑反竒字無通于無者虛無道也王育説天屈西北為無臣鍇曰無者虛無也無者對有之稱自有而無無謂萬物之始未始有有始也道者蒙帝之先道者始𥘉之為也實無也無則不容立言故強名之曰道強者非得意而樂受之言欲明其趣故強引而名之以為立言之本夫天地之𥘉天籀文匸木工也從匚斤斤所作器也自障反緘藏也從匚夾聲輕帖反篋或從竹飯器也筥也從匸聲臣鍇曰音皇區昌反匡或從竹盝米籔也從匚算聲臣鍇曰藪水中盝米竹器也蘇纂反小杯也從匚贛聲􅫦控反㔶或從木如篋從匚非聲逸周書曰實玄黃于匪斧尾反古器也從匚倉聲竊陽反田器也從匚攸聲笛遼反田器也從匚異聲以即反古器也從匚聲臣鍇曰音忽呼兀反甌匬器也從匚俞聲持婁反匣也從匚貴聲求位反匱也從匚甲聲侯甲反匱也從匚賣聲陀谷反器也從匚淮聲苦罪反棺也從匚木久聲其究反籕文柩如此臣鍇曰古文災􅝁也古田器從災疌聲臣鍇按爾雅􅝁謂之疀注謂今俗鍬與此異楚貶反蒲器也屬所以盛種從災并聲輔忖反忣也從災井聲杜林以為竹器揚雄以為蒲器讀若軿車頻丁反甀也從災虍聲讀若盧同臣鍇曰盧字從此論孤反籕文如此篆文文五重三土器巳燒之總名象形也凡瓦之屬皆從瓦臣鍇曰象乙乙交相任受也五寡反周家摶埴之工也從瓦方聲讀若抸破之抸臣鍇曰摶團也埴黏土也周禮摶埴之工陶也旊也陶人為甗旊人為簋夫兩反陶也從瓦垔聲臣鍇曰甄化之也居然反屋棟也從瓦夢省聲臣鍇曰所以承瓦也沒彭反甗也從瓦曽聲子孕反籀文甑從甑也從瓦鬳聲一曰穿也讀若言臣鍇曰春秋左傳紀公之甗擬件反甌瓿謂之瓵從瓦台聲臣鍇曰按史記寅之反大盆也從瓦尚聲晏亢反小盆也從瓦區聲殷婁反􅑥也從瓦公聲彎桐反似􅎆長頸受十升從瓦工讀若翁侯降反小盂也從瓦卯聲烏管反甕也以瓶從瓦令聲臣鍇曰史記云髙屋之上建瓴水也連丁反罌謂之㼰從瓦卑聲頻兮反以小瓿大口而卑從瓦扁聲辟涓反甂也從瓦咅聲盆慕反器也從瓦容聲與封反瓴甋也從瓦聲詩云中唐有甓讀若檗臣鍇曰磚也萍覓反井壁也從瓦秋聲側秀反康瓠破罌也從瓦臬聲臣鍇曰康之言倥也破則空也賈誼曰寶康瓠魚滅反甈或從磋垢瓦石也從瓦爽聲臣鍇曰以碎瓦石㼽去瓶內垢山海經有玄磢又爽反蹈瓦㼲也從瓦耎聲零帖反治橐輪也從瓦今聲侯貪反碎也從瓦卒聲蘇內反敗瓦也從瓦反聲輔綰反文二十五重二以近窮逺也象形古者揮作弓周禮六弓王弓弧弓以射甲革甚質夾弓庾弓以射干侯鳥獸唐弓大弓以授學射者凡弓之屬皆從弓臣鍇曰揮黃帝臣也周禮弓往體多來體寡謂之夾庾之屬合五成規此弱弓也往體寡來體多謂之弓之屬合九而成規強弓也往體來體若一謂之唐弓之屬利射深合七而成規也堅終反畫弓也從弓􅙯聲臣鍇曰所謂雕弓也淂昏反弓無緣可以解㘘紛者從弓耳聲臣鍇曰緣者綵纏飾之也春秋左傳右執鞭弭靣侈反弭或從兒角弓也雒陽名弩曰弲從弓肙聲火玄反木弓也從弓瓜聲一曰往體寡來體多曰弧臣鍇曰昜曰弦木為弧魂徒反弓反也從弓召聲詩曰彤弓弨兮臣鍇曰弓弛強而體反也充招反弓曲也從弓瞿聲衢貟反弓弩端弦所居也從弓區聲可留反弓便利也從弓聲讀若燒延朝反施弓弦也從弓長聲竹陽反弓急張也從弓矍聲俱縳反弓強貌從弓朋聲普鶯反弓有力也從弓疆聲其央反持弓關矢也從弓􅒋聲臣鍇曰春秋左傳曰將注則又關矣烏關反開弓也從弓丨聲臣鍇曰丨音衮以矧反滿弓有所鄉也從弓于聲臣鍇曰山海經曰人有方㢨弓射黃蛇哀都反弓聲也從弓聲臣鍇曰醓字也户明反弓解也從弓也聲臣鍇曰去弦也書爾反弛或從虒弓衣也從弓𠬢𠬢垂飾與鼓同意臣鍇按春秋左傳曰中項伏韜偷勞反弓有臂者從弓奴聲周禮四弩夾弩庾弩唐弩大弩挼户反張弩也從弓殼聲臣鍇曰漢金吾彀騎騎執弓矢也弩待射而為亂又山海經曰非仁莫能上與蕩舟之别為主射之官居此官者不一也格漚反滿弩也從弓黃聲讀若郭昆霍反射也從弓畢聲楚辭曰夫焉彃曰也卑聿反行丸也從弓單聲特丹反或説彈從弓打丸如此帝嚳射官也夏少康滅之從弓幵聲論語曰善射逆桂反射發也從弓癹聲方伐切弛弓也從弓璽聲斯民切文二十七重三強也從二弓凡弜之屬皆從弜闕其繈反輔也重也從弜西聲臣鍇曰西皮密反臣次立按説文引徐鍇云西舌也非聲舌柔而弜剛以柔從剛輔􅱶之意古文􅱶如此亦古文􅱶􅱶或如此文二重三弓弦也從弓象絲軫之形凡弦之屬皆從弦臣鍇曰軫重也形先反􅱶戾也從弦省從盩盩引戾之也讀若戾臣鍇按漢書用此為戾字婁惠反急戾也從弦省少聲于堯反不成遂急戾也從弦省曷聲讀若瘞葬于計反文四繫也從系丿聲凡系之屬皆從系臣鍇曰丿音曳異契反籕文系從瓜絲系或從􅌛處子之子也從子系續也臣鍇曰會意素昆反聮微也從系帛名連反從隨也從系聲延朝反文四重二説文解字繫傳卷第二十四
