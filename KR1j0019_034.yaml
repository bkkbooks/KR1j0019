front:
  text: 説文解字通論中第三十四
  hash: sha256:093b892b16c55cce3be9f4cb351045b7efc09b603fbd33887b5b7429377078db
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_034-1a}
body:
  text: 繫傳三十四文林郎守祕書省校書郎臣徐鍇撰在昔太始萬物資起飛揚積墆各受其紀或熾或氷各以類凝一不自固故二生焉二者一之任也土者二之幹也故於文一偶為土土受化以生天柔而地剛剛柔相和其精為金故金柔則可揉也剛則可折也剛柔和則能斷故金可斷斷者成也故金在西方西方成熟之方物熟而見割必辛故西為辛成則反質質則不飾故其色白故於文土左右注上廉起鋭以成為金金星為奎婁婁為溝溝成則精精為水故金生水承金之斷故水善利萬物稟義故不爭幾於道不顯其利故水在北方北方晦方也萬物之積積必有生水究竟也故於文衆屈為水至柔能攻堅堅陽在內柔隂衛其外故莫之能勝故水一其內也一中也水非土不處水土之氣相謀而生木故木含津承水之究竟故丕冒海隅蒼生物之𥘉生常以柔弱故曰荏苒柔木稟水紆直故木曲直惟仁者能曲直而不失於道仁者兼愛故木枝幹扶踈仁者不忘本故木根荄逺故於文上有枝幹下有根荄為木仁者和而善成和極則熱火能孰物故木生火火曰炎上故於文上出為火名山含魄五行具山所以鎮地出雲雨以宣地氣故曰山宣也故於文形隆而髙疏宣為山山之拗窊為谷故曰竅於山川谷亦以引水故於文上水半見為谷人因五方之風山川之氣以生故曰性者生也既生象人屈服之狀也故漢陳平謝曰主臣恐懼屈服之意也故於文君則正身以出令君既正矣臣擎跽曲拳以事之而巳無勞復諍也民者氓也萌而無識也詩曰氓之蚩蚩抱布貿絲民者象其蒙然衣服憧憧而行之貌也天下有道庶民不議故民字無口也古文民上為髻形下其足行中象蒙然衣𬒳之狀衣食而巳今文民象之也或曰人何以省民何以煩答曰人者其總名也有精有粗舉其精也民其別也王者之牧民必使衣食足而倉廪實民在下嫌其不足故民字象其衣服充𥙿形體豐實之形也於文君字正而民字偏也易之訟曰君子以作事謀始訟者爭也亂也止爭在於作契作契在於謀始契之不明亂之所生也故有德司契而不責於人猶有患焉是以古之王者先民之心弦木為弧剡木為矢弧矢之利以威天下解民之暌故曰先張之弧後脫之弧不至於用也易曰聰明神物而不殺也夫及其後也刑期於無刑辟以止辟兵者刑也刑者侀也一成而不變刑者形也一受而不易故於文刀井為井者法也易曰攺邑不攺井王者攺政不攺刑刑罰世輕世重而務所以生之一也或曰井者井田也古者百畒為夫九夫為井百畒為公田民田不熟則罰吏公田不治則罰民刀所以守也君子曰鞭撲不可廢於家刑罰不可廢於國家人有嚴君焉父母之謂也故於文又舉丨為父又者手也丨杖也舉而威之也母生之於文女垂乳為母母生之父教之母主愛而父尚嚴故曰父義而母慈義者事之冝也父雖愛之猶當以義斷恩也故曰君子之逺其子也妻者齊也治內職也故於文女又屮為妻又持事也屮所持也妻者判合也夫者天也故於字夫正而妻遍也禮曰姻不失其親故古文故曰女子衣則綢繆閉固是也不從力者力在內不宣歸於男也兄者況也能以言況其弟也事有隱避不可正言則譬况之而巳矣故於文口几為兄几者人在下者也以口教其下也下弟也弟者弟也相次弟也古謂韋束之相次壓為弟言如積疊柔韋順後前不相戾也故於文弟從韋又弟者易也順兄之教則易也夫者扶也既壯曰夫於文大貫一為夫大人象也一其笄簮也男子二十而冠婦人十五而笄箸一為笄者通言婦人也男子冠而成人女子笄而成人國君十五而冠則娶也故傳曰國君十五而生子冠而生子禮也故曰夫曰丈夫仕曰大夫也故曰夫人曰君夫人相扶以成家也又口壻壻者胥也胥有才智之稱也知為人父之道也故於文士胥為胥詩曰女也不爽士二其行士也罔極二三其德士者夫也故夫之從一亦其義也或從女胥為壻胥者長也周官徒十人胥一人徒中有才智者為之長曰胥古諸侯一娶九女壻者女之長也太玄曰女不女其心豫覆夫諝諝美也男曰兒女曰嬰嬰者纓也又癭也皆擁於徑前之名也故於文女賏為嬰嬰賏聲又胡人連貝以飾頸曰賏女子之飾也兒者倪也女曰嬰其聲細嚶嚶然兒猶其聲倪倪然差壯犬也倪者專倪也人之始也如木之有專倪也又兒者提也兒則提攜之女則擁抱之從母言之也於文几臼為兒與古文齒相類囟未合之象也貴曰子或上從川川髮也上有髮下猶襁抱之兒者踈鄙故囟未合而足展也貴而言之故曰世子公子胃子賤而言之故曰羽林孤兒健兒乞兒也咳者小兒之笑也咳咳然笑聲也三月而咳故於文口亥為咳亥咳聲或從子亦同也孫者遜也彌遜順也逮事於父見其子道遜順當續而行之故於文子系為孫系繼也詩曰無念爾祖聿修厥德嫡者滴也若櫩霤之滴專諦也取貴於庶也至於女故從女傳曰荀偃立後曰鄭甥可子以母貴也庶衆也嫡子一人餘為庶也屋下衆為庶史曰太任十子周以宗強叔向曰吾母多而庶鮮言當衆也故於文廣為庶炗光也其光景衆也書曰庶殷丕作又曰庶民子來經始靈臺比屋為庶廣屋覆之也庶者恕也嫡者當恕之也妾隸之子曰孽孽之言蘖也有罪之女沒廢役之而已得見於君有所生若木既伐而生枿猶顛木之有由蘖也母以子貴也故從子故於文子孽為孽辥者罪也少而無父曰孤於又子瓜為孤爪聲也書曰豫娶于塗山辛壬癸甲啓􅈱􅈱而泣豫不子惟荒度土功子不見父則泣􅈱􅈱也善事父母曰孝故於文子承老為孝孝子能錫其類故過稿木必趍之見老者必敬承之也省之者省老之匕也匕者變也氣壯則變白衰髮盛則變白衰又將化孝子之心不忍言其匕故省之也經曰父母之年不可不知一則以喜一則以懼父在恆言不稱老也善兄弟為友又同志為友友右也相佐佑也故於文又乂為友兩手相順也兄弟之齒鴈行也兩手相承為收異志相成也兩手相順為友兄弟一體也朋友雖切磋其志歸於順也易曰天地睽而其道同也親九族曰睦書曰敦睦九族睦從目順之也九族之內心不一者猶當目順之也孟子曰象恆以殺舜為事舜恆欲見之故源源而來封之於鼻不及以政猶欲見之此敦睦之意也書曰虞賔在位群后德讓帝朱亦德讓也彼丹朱者淫放之人也罔水行舟晝夜額額𬒳堯之教不及於亂漸止其放心但無聖人之才百姓弗與能降心以為虞賔以濟其世而能德讓是亦和矣故曰堯能敦睦九族也故於文目坴為睦坴睦聲也古文冏為睦冏古文目也坴省也親於外姻曰姻爾雅曰壻之父曰姻傳曰外姻至又曰夫猶無族姻乎姻者女之所因也女因媒而親父母因女而親也詩曰惟酒食是議無父母貽罹故於文女因為姻古文女􅘢為姻􅘢姻聲也又􅘢回水也女子有歸宗之義不忘本也詩曰泉原在左淇水在右女子有行逺兄弟父母曷浣曷否歸寧父母信於朋友曰任任者可保任也君子既壯名譽不聞友之罪也君亦當任用之故於文人壬為任物之犬牙相制為壬也振貧老曰恤恤者憂也收也心戍然而慘惻之也心哀痛而收之若已身之有患焉故於文心血為恤血恤聲也血亦心之至也通而先識曰聖無所不通也於文耳呈為聖呈聖聲也又聖則萬物皆呈其情也從耳者非任耳也言心通萬物之情若耳之通聲也天子黈纊充耳何任之有或曰聖人多能歟曰聖人通天地之情逹人物之性一以貫之何多能之有百工之事也皆聖之作也又何不多能之有聖人之多能治其法也小人之多能為其巧也傳曰如有博施於民而能濟衆者必也聖乎堯舜其猶病諸所謂施者非取而施之也聖人在位修元精之本練隂陽之和均天地之利出細大之用行役不淹笄冠不過內無怨而外無曠壽天得中故父無泣子之痛兄無哭弟之哀夫山之薯也手種手形足植足形太平之丗土地調矣寒燠和矣風氣徐矣日月明矣人力間矣民心適矣民手勸矣又合和氣以成其穀穀則堅好而和沈君子食之以平其心故壽考而無疾侵也堯之骨節入耳年齒長而聰明衰不及節民洚水警豫倦勤而弗能治也舜乃舉禹於罪人之家禹親自操橐耜而九雜天下之山川大川三百支川三千甽澮無數稷降播種民於是乎粒食禽獸多則害人民踐禾稼智吞愚強捕小皆不得自全於是乎刊山槎木驅其猛獸取其衆者以佐民食民於是乎鮮食至今賴之此之謂博施易曰雲行雨施品物流形言施普則萬物支派以成其形也及至紂釀民之膏澤以為藏有年數矣然武王散鹿臺之錢人不得數文傾巨橋之粟人不得數升而民恱之曰聚者猶散之况復取乎此所謂大賚而天下服也夫水之為沴也人皆走丘陵赴樹木孰若乎無水殛其父而任其子孰若乎不殛故曰堯舜其猶病諸也今天子睿明而不自有通徹而不自任罷聲色而樂典蓻斥苑囿而任民事苟利於民也不拘於細大以為不一勞者不久逸不暫費者不永寧上下光明宗枝膠固有唐虞湯武之德而無共故五月夏至一隂生隂陽爭七月二隂生隂氣勝八月隂氣雖壯猶有陽氣存焉微陽助隂以成熟萬物隂陽亦適和猶君任臣以刑罰行義以斷以化成天下地曰剛克之義臣道之盛也至九月三隂生無復陽氣未十一月而隂氣盈溢隂極而陽生故十一月冬至一陽生周而復始違則為沴故傳曰隂不孤立陽不獨存故曰禾二月生八月熟得時之中和中和而生中和而成夫和氣動於中而形於言鳯凰鳴矣于彼髙岡梧桐生矣于彼朝陽菶菶噰噰喈喈草木暢茂而鳥鳴和也記曰鸞鳥自歌鳯鳥自舞言有所感動和氣浹其心自然而舞也禹拜昌言臯陶賡歌九功之德皆可歌也人心和矣故移之於金石八音克諧無相奪倫金石和矣故曰笙鏞以間鳥獸蹌蹌鳥獸和矣故曰蕭韶九成鳯皇來儀政之和必以人聲為效聲之和必以金石為效金石之和必以鳥獸為效鳥獸之和必以鳯皇為效鳯者羽族之長而天地之靈也無所誘慕非和不至故不和其本而欲金石之和伶倫不能為也故傳曰得時之禾機疏而穗大其粟圜而糕薄其米多而沃食之者強太平之丗人含和氣以食和榖故於文口禾為和和者不可名也謂之剛則柔矣謂之柔則剛矣言宫則含啇矣言啇則存宫矣察而聽之莫此之調矣為辛則鹹矣疑鹹則甘矣舉而食之莫此之冝矣故曰和易曰黃者中之色也淮南子曰色有五章以黃為主夫黃有近於白舉火而視黃似白也可以青可以朱可以玄故曰黃裳元吉堯之盛也不知天下之治歟不治歟百姓之願戴巳歟不願戴巳歟問於在朝在朝不知問於在野在野不知乃微服而之康衢聞逰童子之歌於疆畔者曰立我蒸民莫匪爾極不識不知順帝之則問誰為此歌者曰聞於長老問諸長老曰古詩也此和之極也和之始也損益之切劘之剛
