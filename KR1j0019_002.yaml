front:
  text: 見稱於世也尹彤當時說文字者所謂慱采通人也恥列反難也象艸木之𥘉生屯然而難從􅋄貫一地也尾曲易曰屯剛柔始交而難生臣鍇曰易屯卦象辭也陟倫反艸盛上出也從􅋄母聲臣鍇曰􅋄則象上出也梅櫑反厚也害人之艸徃往而生從􅋄毐聲臣鍇曰害人艸若江東荼莽冶葛之屬毐音毒嫪毐字從士音仕下母音無言其毒厚也特沃反古文毒從刀葍臣鍇曰竹亦毒有南方有竹傷人則死葍聲也艸𥘉生其香分布從􅋄分分亦聲臣鍇曰𥘉出莩甲又葉𥘉生故香苦今採荼皆𥘉生者弗群反㞣或從艸菌地蕈叢生曰中從屮六聲臣鍇曰從􅋄者象三菌叢生也易夬卦曰莧陸夬夫陸即也與莧皆爲柔脆之物坴字從此粟菊反籀文從三火煙上出也從􅋄從黒􅋄黒熏象臣鍇曰物之受煙者唯艸爲甚無根故從􅋄詩曰穹窒熏䑕以艸熏之也黒非白黒之黒字四象穴火炎上出礙於艸故爲熏此言黒熏象故知非白黒字詡君反
