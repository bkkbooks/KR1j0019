body:
  text: 文七重三百芔也從二􅋄凢艸之屬皆從艸臣鍇曰總名也艸叢生故從二屮此討反上諱臣鍇曰後漢孝明帝諱故許愼不解說而最在前也臣鍇以爲莊盛飾也故從艸壯聲壯亦盛也又道路六逹謂之莊亦道路交會之盛也側羊反古文莊在木曰果在地曰蓏從艸㼌聲臣鍇大荳根黃而香蔓延生女有反禾粟之􅣴生而不成者謂之蕫節從艸郎聲臣鍇按爾雅稂蕫梁注云莠類也勤當反節或從禾禾粟下揚生莠從艸秀聲讀若酉臣鍇曰粟下揚謂禾粟實下播揚而生出於粟秕左傳曰其莠猶在乎史曰飬莠敗禾夷酒反枲實也從艸肥聲臣鍇按儀禮苴麻之有子者然則萉麻子也扶云反萉或從麻賁桂荏蘇從艸任聲臣鍇按荏白蘇也桂荏紫蘇也而沈反菜也從艸矢聲也匕反菜之羙者雲夢之䔇從艸豈聲臣鍇曰此吕氏春秋伊尹對湯之辭也其爲狀未聞丘尾反菜也從艸􅱳聲揆惟反郤溼之菜也從艸彊聲臣鍇曰䕬可以止腹病治脚下溼伊尹對湯曰陽樸之薑九啇反辛菜薔虞也從艸翏聲臣鍇按爾雅薔蓼注藼艸臣鍇按本草即今之鹿葱也吁袁反或從煖或從宣营藭香艸也從艸宫聲臣鍇按藭即江蘺根也又名蘼蕪又薇蕪其根名芎藭臣鍇按本艸療頭痛寒痺諸寒冷氣腹痛故司馬叩曰有山芎藭乎欲使逃泥水中故問有禦寒及腹痛之藥也牽弓反司馬相如說菅從芎臣鍇曰司馬相如續李斯倉頡篇作凡將一篇解說文字許愼所采故云司馬相如說也营藭也從艸窮聲渠中反香艸也從艸闌聲臣鍇按本艸蘭葉皆似澤蘭方莖蘭員莖白華紫蕚皆生澤畔八月華楚辭曰浴蘭湯兮沐芳華本艸蘭艸辟不祥故潔齋以事大神也臣又按本草蘭入藥四五月採謂采枝葉也春秋左氏傳鄭穆公曰蘭死吾其死乎吾所以生也刈蘭而卒按鄭穆公曰十月卒彼時十月今之八月非本草采用之時者蓋常人候其華實成然後刈取之也勒飡反艸出呉林山從艸姦聲臣鍇曰此山海經所云也箇山反薑屬可以香口從艸俊聲斯唯反芄蘭莞也從艸丸聲諸曰芄蘭之枝臣鍇按本艸芄蘭蘿藦也葉似女青味辛主虚勞户寒反楚謂之蘺晉謂之虈齊謂之茞從艸嚻聲臣鍇按本艸白芷一名虈一名芳香一名茞一名莞一名符離一名澤芳葉一名蒿麻可作脂及爲浴湯故内則云遺之茞蘭則受而獻諸舅姑欣消反江蘺蘼蕪從艸離聲鄰之反虈也從艸臣聲昌亥反蘪蕪也從艸麋聲閩之反香艸也從艸熏聲臣鍇按薫草蘼蕪又慱物志云東方君子國薫草華朝朝生華也許君反水篇茿從水毒聲讀若督臣鍇按郭璞注爾雅竹篇蓄似小藜亦莖節生道旁可殺蟲此云水篇茿蓋别名也此即爾雅作竹者得酷反篇茿也從艸扁聲比兖反芞與也從艸聲臣鍇按離騷經畦留夷輿藒車注藒車芞輿芳艸也去絶反芞輿也從艸气聲欺訖反馬莓也從艸母聲臣鍇按爾雅蔍藨注曰藨即苺盆華紫俗名蠶苺可食即蓬累殷王女所食又有地苺黄華子小異食之傷人爾雅又有葥一名山苺注云即木苺似藨苺而大亦可食今俗亦云虵藨蠶麃莫隊反艸也從艸各聲臣鍇按爾雅茖山葱注曰茖葱細莖大葉管子曰齊桓公伐山戎出其山葱戎菽也勾索反甘艸也從艸甘聲臣鍇按爾雅蘦大苦注云即甘艸也蔓延生葉似荷青黄莖赤有節枝枝相植葉葉相當鈎諳反艸也從艸予聲可以爲䋲陳君反艸也從艸盡聲夕晉反艸也從草𫐠聲臣鍇按藥有蓬莪蒁常出反荵冬艸從艸忍聲臣鍇按本草忍冬蔓生繞覆草水上莖赤紫色宿者有薄白皮幕之嫩莖有毛葉似胡豆上下有毛華白蘃凌冬不凋治寒熱耳引反萇楚銚弋一名羊桃從艸長聲臣鍇按爾雅萇楚銚弋注曰葉似桃華白子如小麥亦似桃臣按詩曰隰有萇楚也直良反芺也從艸魝聲臣鍇按爾雅芺薊其寳荂然則薊芺之屬即今刺薊是又木一名山薊其形相似但華别似杜鵑而青紫耳又有楊枹薊一名馬薊似薊而肥大一名赤木也已惠反艸也從艸里聲讀若釐臣鍇字書朔濯草一名荲利之反釐艸也一曰拜商藋從艸翟聲臣鍇按爾雅商藋赤似藜臣以爲俗所謂灰藋也地料反堇艸也從艸及聲臣鍇按爾雅注即烏頭也飢泣反山苺也從艸歬聲臣鍇曰所謂大苺也子飬反毒艸也從艸婺聲臣鍇按周禮注瘍醫以五毒攻之其一也莫透反卷耳也從艸務聲亡考切人蓡藥艸出上黨從艸􅒓聲臣鍇按本草作麥字異者人形也師今反鳬葵也從艸攣聲臣鍇按郎茆也詩所謂薄采其茆也本草注曰江南人名豬蓴堪食魯剜反艸也可以染留黃從艸戾聲臣鍇按爾雅藐紫草注草可染紫一名䓞臣以爲史儀制多言緑綟綅即此草所染也又按經䟽五方之間色有留黃其紫赤黃之間古詩所謂佳人贈我䇶中綺何以報之流黃素是也婁惠反蚍􅗶也從艸収聲臣鍇按荍今佳蜀葵也詩曰視爾如荍𡵨遥反蒿也從艸毗聲鼻冝反艸也從艸禹聲臣鍇按漢書遊俠有萭草字子夏萭姓也十甫反艸從艸夷聲臣鍇按丘遲詩輕荑承玉輦荑𥘉生草也敵圭反艸也從艸嶭聲私列反大苦苓也從艸古聲臣鍇按爾雅蘦大苦甘草也口魯反艸也從艸音聲臣鍇按字書黄菩草又漢有菩陽天子更衣之别舘也因地爲名菩山之陽也歩乃反薏苢從艸啻聲一曰英臣鍇按今謂之薏未是也堅者曰幹珠依色反菅也從艸矛聲夢梢反茅也從艸官聲臣鍇按詩曰雖有絲麻無棄菅蒯是也箇山反艸也從艸聲江夏有蘄春亭臣鍇按爾雅書馬芹字或如此也臣希反艸也可以作席從艸完聲户寒反莞屬也從艸閵聲臣鍇按劦也一名馬藺里刄反董蒢職也從艸除聲直魚反水艸也或以作席從艸浦聲盆乎反蒲子可以爲平席從艸弱聲臣鍇曰按蒻蒲下入泥白處今俗呼蒲白尚書曰敷重蒻席注蒻苹是也臣鍇以爲蒻即根上𥘉生萌也從艸尋聲臣鍇按本草即知母藥也形似昌蒲而柔潤葉至難死掘出随生湏枯燥乃止味苦寒一名堤母田南反蕁或從爻臣鍇按今本草作此􅙛字艸也從艸毄聲堅歴反艸也從艸區聲臣鍇按爾雅注江東呼細藋爲烏蓲音丘起秋反艸也從艸固聲骨度反艸也從艸幹聲臣鍇按本草注書珠字如此也根旱反藷蔗也從艸諸聲臣鍇按今之甘蔗也掌於反藷蔗也從艸庶聲之射反䍧蘘可以作縻綆從艸聲臣鍇曰芒之屬可為汲綆也女庾反艸也從艸豬聲臣鍇按爾雅苿荎藸展魚反艸也從艸賜聲先刺反艸也從艸中聲珍䝉反王萯也從艸負聲臣鍇按吕氏春秋殷王孔甲田于萯山之陽大風迷惑入于民室山海經萯山神秦逢所居符九反艸也味苦江南食以下氣從艸夭聲臣鍇曰今苦芺也安浩反艸也從艸弦聲形先反艸也從艸聲臣鍇曰古囿字也延救反艸也從艸孚聲芳于反兎瓜也從艸寅聲臣鍇按爾雅注似土瓜翼真反馬帚也從艸并聲臣鍇按爾雅注似蓍可爲帚也頻寕反水邉艸也從艸猶聲臣鍇按爾雅似莤一名蔓于注一名軒于生水中臣鍇今按似細蘆蔓生水上随水高下汎汎然也故曰蕕也延秋反艸也從艸安聲思旰反纂月爾也從艸綦聲臣鍇按爾雅月爾似蕨可食即紫藄也䖍知反兎葵也從艸希聲臣鍇按爾雅注似葵而小葉狀如藜有毛汋啖之滑本草注云苩似石龍芮華白似梅蘂紫者堪啖忻祈反灌渝從艸夢聲讀若萌臣鍇按爾雅蕍蕮注云澤舄本草澤舄一名芒芋生池澤夢即草莾之名名又近芒灌莾即澤也疑夢即澤舄也木空反盗庚也從艸復聲臣鍇按爾雅盗庚旋獲藥也戒六反卷耳也從艸令聲臣鍇按爾雅苓耳卷耳也形似䑕耳叢生如盤臣鍇曰菌屬生朽潤木根連丁反艸也從艸贛聲一曰薏苡臣鍇按本草薏苡一名米卷控反茅葍也一名蕣從艸夐聲臣鍇按爾雅葍華有赤者爲藑也葵名反葍也從艸冨聲臣鍇按爾雅葍䔰注大葉白華根如指心白可啖詩曰言采其葍也分溜反䔰也從艸畐聲方菊反苗也從艸脩聲徒聊切又湯雕切蓨也從艸由聲臣鍇曰苖音迪爾雅釋草有之注云未詳徒歴切又他六反艸枝枝相值葉葉相當從艸昜聲臣鍇按爾雅蓫薚馬尾又草枝枝相值葉葉相當唯甘草耳吞臣反蘡莫從艸奥聲臣鍇按詩云食䖇及薁於目反馬藍也從艸咸聲臣鍇按爾雅注今大葉冬藍也止沉反艸也可以束從艸魯聲臣鍇按爾雅作履苴草也勒古反或從鹵艸也從艸㕟聲臣鍇按詩曰雖有絲麻無棄菅是也庫拜反艸也可以烹魚從艸婁聲臣鍇曰今人所食蔞蒿也力殊反艸也從艸畾聲詩曰莫莫葛藟一曰秬鬯臣鍇曰葛蔓也桞水反棘蒬也從艸冤聲臣鍇按爾雅本草逺志也葉名小草過言反茈艸也從艸此聲臣鍇曰即今染紫草也司馬相如上林賦書茈薑字如此津矣反茈艸也從艸貌聲尨璞反鳥喙也從艸則聲臣鍇按本草即烏頭也有大毒故蘇秦云飢食烏喙與餓死同患齋石反茅蒐茹藘人血所生可以染絳從艸鬼臣鍇按今醫方家謂蒐爲地血食之𥙷血是也故從鬼色酋反茅蒐也從艸西聲七縣反赤也從艸􅲁聲素次反牡賛也從艸辟聲臣鍇按爾雅有之注云未詳避契反杜榮也從艸忘聲臣鍇按爾雅注云爲繩索莣也勿强反艸也南陽以爲麁履從艸包聲臣鍇按此草名尚書包匭菁茅又草木漸包又詩方如竹包矣皆當作包不從艸也此交反冰臺也從艸又聲臣鍇即今炙艾也五蓋反艸也從艸章聲周良反楚葵也從艸斤聲臣鍇曰今水芹也伎殷反豕首也從艸甄聲臣鍇按爾雅注即今地菘草也止鄰反寄生也從艸烏聲詩曰蔦與女羅臣鍇按本草云蔓草木生黃絲爲赤網色淺文爲兔虆又一名免縷一名蓎一名蒙一名王女一名兎絲得了反蔦或從木臣鍇曰附子木故從木艸也似目宿從艸云聲淮南說芸艸可以死復生臣鍇按芸草著於衣書辟蠧漢種之於蘭臺石室藏書之所羽文反艸也從艸聲麁最反艸也從艸律聲留筆反䓶也從艸束聲臣鍇按爾雅注即草木之刺也測麥反䒷婁果羸也從艸􅡜聲古活反蕦蓯也從艸封聲臣鍇按爾雅有之注云未聞敷容反蒺藜也從艸齊聲詩曰牆有薺臣鍇曰此今藥家所用蒺藜也今人以此字爲薺菜疾咨反茦也從艸刺聲臣鍇曰此爲草木之莿爲斫之刺七智反薡蕫也從艸童聲杜林曰藕根臣鍇按爾雅蘋薡蕫也似蒲而細今人以織履符動反狗毒也從艸繫聲臣鍇按爾雅注樊光云俗語苦如蘻蓋非的識今藥有狼毒忌惠反艸也從艸㛮聲臣鍇曰今繁縷草思討反地黃也從艸下聲禮曰鈃毛牛藿羊芐豕薇是臣鍇曰鈃羮噐也其中菜謂之芼桓古反白薟也從艸僉聲臣鍇按本草白蘝藥也一名兎荄作藤生根似天門冬一株下有十許爾雅云菄兎荄注乃云未詳也留琰反薟或從歛黄菳也從艸金聲臣鍇按本草葉細長兩葉相對作叢生藥草也却林反艸也從艸今聲詩曰食野之芩巨任反鹿靃也從艸麃聲讀若剽一曰􅸬屬臣鍇按爾雅鹿靃鹿豆也一名蔨爾雅藨麃注云即苺也與鹿豆相近疑說文注誤以藨麃爲鹿藿字也平表反綅也從艸鵙聲詩曰卭有㫖是臣鍇按爾雅注小草雜色似綬也許璧反芰也從艸淩聲楚謂之芰秦曰薢茩臣鍇按爾雅蔆蕨攗注云今水中芰也齊民要術有種芰法亦同一名蔆池中種之爾雅别有薢茩决光注云决光明也葉銳黄赤華實如山茱茰或曰蔆関西謂之薢茩今按决明藥菜也馬蹄者葉鋭下而實與山茱茰亦良似華深黃色爾雅注所云関西即秦地其或曰蔆則謂决光水中之蔆矣又按國語楚屈到嗜芰則許慎云楚謂之芰也屈到死将以芰祭其子去之以爲芰非祭用也今按蓤邉豆之實也則屈到嗜芰則决明之菜非水中芰審蔆矣祭不用故去之今按决明菜治目故以光明爲名又以屈䢖之言分之則慎所注全是菜也但菜一名决光薢茩又名水中蔆同蔆凡三名菜有其二所異者蕨攗耳所以致惑也力􅈾反司馬相如說蔆從遴臣鍇按漢書司馬相如續倉頡篇作凡将一篇亦解說文字許慎采其異者著於比也蔆也從艸支聲臣記反杜林說芰從多薢茩也從艸解聲問蟹反薢茩也從艸后聲講吼反鷄頭也從艸欠聲其閃反曰精也似秋華從艸鞠聲臣鍇按本草蘜即九月黃華者也一名女精一名女華也居逐反蘜或省爵麥也從艸龠聲臣鍇按即燕麥也漢魏以前雀字多作爵假借也㣧畧反牡茅也從艸遫聲臣鍇按爾雅注曰茅屬也孫卜反茅秀也從艸私聲臣按此即今茅華未放者也今人食之謂之茅椻詩所謂手如柔荑荑秀也先兹反雚之未秀者從艸兼聲臣鍇按爾雅薕也注云似藋而細髙數尺臣今見江之西岸多有之高如此今人以爲簾薄疑因此名薕也未秀謂其小耳結添反􅫠也從艸亂聲八月薍爲葦也臣鍇按爾雅菼薍也注云似葦而小實中江東呼爲烏蓲臣今見海瀆有之葦即大蘆也八月薍亦長大也亦猶蒿有數種至秋老皆名爲蒿也五晏反雚之𥘉生一曰薍一曰鵻從艸剡聲忒敢反􅫠或從炎臣鍇按爾雅釋言云菼鵻下注云菼草色如鵻在青白之間臣以爲此帛色名染之如生菼色染之如今人所染麥緑也盖此菼亦名爲鵻非獨其色也簾也從艸廉聲連塩反青薠似莎者從艸煩聲臣鍇按相如上林賦薛莎青薠復喧反昌蒲也從艸卭聲益州生臣鍇按本草昌蒲一寸九節生蜀郡又有葉無脊者名蓀即蘭蓀也顔當反􅟏䓉也從艸邪聲臣鍇曰今人書䓉蒿字也延遮反葦華也從艸刀聲臣鍇按爾雅葦醜苕注其類皆芀秀醜即類也臣謂苕者抽條摇逺生華而無莩萼也今人取之以爲帚曰苕菷是也笛遼反芀也從艸􅍌聲臣鍇以爲禮云桃茢常用此爲桃帚非徒黍穰也良舌反䓿􅣿也從艸圅聲臣鍇曰菡猶含也未吐之意候坎反菡􅣿芙蓉華未發爲菡􅣿已發爲芙蓉從艸閻聲臣鍇曰芙之言敷也蓉之言動容也特感反芙蕖之實也從艸連聲落妍反芙蕖莖從艸加聲臣鍇曰夫渠即芙蓉此又藥五茄也間巴反芙蓉葉從艸何聲閑俄反芙蕖本從艸密聲臣鍇謂藕節上𥘉生莖時萌牙殻也在泥中者羙弼反芙蕖根從艸水禺聲五斗反天蘥也從艸龍聲臣鍇按爾雅有之注云未聞也來充反蒿葉屬生千歳三百莖易以爲數天子蓍九尺諸侯七尺大夫五尺士三尺從艸耆聲臣鍇按白虎通蓍之言耆也陽之老也故其数竒言九尺七尺也申離反香蒿也從艸臤聲臣鍇按爾雅注今謂青蒿香饀者爲菣祛胤反菣或從堅臣鍇曰堅亦聲蘿莪蒿屬也從艸我聲臣鍇曰爾雅注今呼爲莪蒿亦曰䕲蒿偶和反莪也從艸羅聲婁何反蒿屬也從艸林聲臣鍇此即上䕲蒿字亦作此力甚反牡蒿也從艸尉聲臣鍇按爾雅即䕲蒿之無子者也一名牡菣迂胃反艾蒿也從艸肅聲臣鍇按爾雅蕭萩汪即蒿也古人言蕭斧則謂芟艾之斧也齊斧剪齊之斧也先幺反蕭也從艸秋聲臣鍇按春秋左氏傳或借此爲楸字七牛反鳧茈也從艸勺聲臣鍇曰今人所食鳬茈也堅鳥反王彗也從艸前聲臣鍇曰今落帚草也自先反艸也從艸爲聲于委反艸也從艸冘聲臣鍇曰按爾雅􅙛䒞藩是也池心反治蘠也從艸鞠聲臣鍇按本草菊有十名不言治蘠爾雅注即今之秋華鞠居逐反蘠靡釁冬也從艸牆聲臣鍇按爾雅注虋冬一名滿冬今本草有天門冬麥門冬並無滿冬之名賊忘反芪母也從艸氏聲臣鍇按本草芪母即知母之一名也是支反茈菀出漢中房陵從艸宛聲臣鍇按本草紫菀生陸山谷也鬱逺反貝母也從艸明省聲臣鍇按本草云貝母一名莔根彩如聚貝子安五蔵治目眩項直不得返顧故許穆公夫人思歸衛不得而作詩曰言米其莔也没彭反山薊也從艸术聲臣鍇按今菜苗似薊也柱黜反析􅕴大薺也從艸冥臣鍇按爾雅注似薺葉細俗呼老薺莫歴反荎藸也從艸味聲臣鍇按爾雅五味子也勿貴反荎藸也從艸至聲直而反絺綌艸也從艸曷聲格曷反葛屬也從艸曼聲臣鍇曰葛之緫名也無飯反葛屬也白華從艸鼻聲家豪反菨餘也從艸杏聲臣鍇按爾雅注則今之莕菜也限猛反莕或從行同臣鍇按詩參差荇菜也菨餘也從艸妾聲節攝反艸也從艸聲古論反魚毒也從艸元聲臣鍇按本草芫華也可用毒魚一名杭魚毒爾雅杭字從木注即云大木也不知爾雅别有本名杭又名魚毒將誤書從艸因入木中注者詳之也言袁反大苦也從艸霝聲臣鍇按本草即藥甘草也連丁反蕛苵也從艸稊聲臣鍇按爾雅注似稗布地生穢草敵圭反蕛苵也從艸失聲亭結反艼熒朐也從艸丁聲臣鍇按爾雅有之注云未詳他寧反苽蔣也從艸將聲臣鍇曰苽草也青謂之苽蔣枯謂之芻茭子甫反又子良反雕苽一名蔣從艸瓜聲臣鍇曰雕苽西京雜記及古詩多作雕胡枚乗云雕胡之飯按即今所食茭苗米也古胡反艸也曰彼茁者葭鄒滑反枝柱從艸巠聲臣鍇曰枝主於莖故云枝柱候宏反莖也從艸廷聲臣鍇按東方朔曰以莛橦鍾莛枝莖也田丁反艸木之葉也從艸枼聲亦接反艸之小者從艸㓹聲㓹古文銳字讀若芮居例反華盛從艸不聲一曰芣苢臣鍇以爲慎意以此爲棠棣之華萼芣韡韡之芣也附柔反華也從艸皅聲臣鍇按葩草木華𥘉坼也故木華海賦曰葩華踧意同也浦瓜反艸之葟榮也從艸尹聲臣鍇按爾雅蕍芛葟華榮注云華葟也今俗謂草木華𥘉生者爲芛蕍猶敷蕍亦草木華之皃所未詳營跬反華黃從艸黊聲讀若墮壊臣鍇按謂草木之黃華者也乎瓦反苕之黃華也從艸爂聲一曰末臣鍇按史記趙武靈王夢處女歌曰美人熒熒兮顏若苕之華注云苕紫華草也又郭璞遊仙詩曰潜穎怨青陽陵苕哀素秋又爾雅注陵苕一名陵時故曰黃華蔈白華茇也今本草注證云陵霄也此眇反艸榮而不實者一曰黄英從艸央聲臣鍇按爾雅釋木有權黄英注未詳也又平反華盛從艸爾聲詩曰彼薾惟何臣鍇曰薾猶彌漫意也而俾反艸盛從艸妻聲詩曰菶菶萋萋臣鍇按萋深切之意也言其色深切也七低反艸盛從艸奉聲臣鍇按菶菶散亂也𥙷冗反茂也從艸疑聲詩曰黍稷薿薿臣鍇曰薿薿苗盛之皃牛以反艸木華垂皃從艸𬎼聲臣鍇按嵇康琴賦曰飛英㽔於昊蒼儒佳反青齊兖兾謂木細枝曰葼從艸㚇聲子紅反艸萎䔟從艸移聲以支反艸木形從艸原聲言袁反艸實從艸夾聲臣鍇按周禮其植艸冝莢物是也尺俠反聲莫透反艸茂也從艸畼聲臣鍇按史記夏以木徳青龍出於郊草木􅳵茂上向反艸隂地從艸隂聲臣鍇曰草所庇也衣任反艸皃從艸造聲臣鍇曰草相次也𥘉狩反艸禾多益從艸絲省聲臣鍇曰此草木之茲盛也則私反艸旱盡也從艸椒聲詩曰􅣛􅣛山川他狄反艸皃從艸㪣聲周禮曰轂雖蔽不藃臣鍇按周禮注謂藃暴隂柔後必撓減轉革暴起爲藃欣消反艸多皃從艸旣聲臣鍇曰蔇猶宻也訖示反艸多皃從艸資聲臣鍇曰薋猶積也疾兹反艸盛皃從艸秦聲臣鍇曰蓁蓁相凑也側詵反惡艸皃從艸肖聲羶枲反芮芮艸生皃從艸内聲若汭臣鍇曰芮芮細皃若言蚊蚋也汝歲反艸皃從艸在聲濟北有茬平縣仕淄反艸多皃從艸會凡艸曰零木曰落從艸洛聲臣鍇曰木曰落而從艸者也但葉落耳其枝幹勁與草零無異故從艸勒託反蔽蔽小艸也從艸敝聲臣鍇按詩曰蔽芾甘裳比𬒮反艸木皮葉落堕地爲蘀從艸擇聲詩曰十月殞蘀臣鍇曰此言草木而從艸者木蘀與草同也他作反積也從艸温聲春秋傳曰蕰利生孽臣鍇曰春秋左傳曰芟夷蕰崇之但積之低爲藴堆之高爲崇迂吻反菸也從艸焉聲爲焉反鬱也從艸於聲一曰􅖖也郁諸反艸旋皃也從艸榮聲詩曰葛藟之臣鍇曰謂縈繞也於反艸也從艸祭聲蒼大反艸葉多從艸伐聲春秋傳曰晉糴茷臣鍇曰糴茷人名也符發反艸之可食者從艸采聲臣鍇曰采亦聲少亦字此載反艸多葉皃從艸而聲沛城父有楊荋亭臣鍇曰古謂頰毛爲耏此草似之也然知反艸浮水中皃從艸乏声孚凡反林薄也一曰蠶薄從艸溥声臣鍇曰木曰林草曰薄故云叢薄盆各反所以養禽獸從艸夗聲臣鍇曰苑猶院也鬱逺反大澤從艸數声九州之藪揚州具區荆州雲夢豫州圃田青州孟諸兖州大野雍州弦蒲幽州奚飬冀州楊紆并州昭余祁是也臣鍇按周禮注大澤曰藪具區五湖也雲夢夢澤也其地跨江圃田在中牟今鄭州孟諸在睢陽東北大野在鉅鹿東北弦蒲在汧奚飬在長廣昭余祁在太原鄔楊紆爾雅注在扶風汧縣西蘇走反不耕田也從艸􆁙易曰不菑畬臣鍇曰此爲從艸從田凡三文合之舊解從艸甾傳冩誤以田合爲甾亦無声字何以言之若實從艸下甾則下不合别有甾字云或省艸省艸則與東楚名缶曰甾同声同體而别出名缶之甾在第二十四卷也臣以爲當言從從田田不耕則草塞之故從艸者川壅也但許慎約文後人不曉誤以田人成甾字因誤加聲字耳學者所冝詳之側持反菑或省艸臣鍇曰從田􆁙此會意此即甾水出太山梁父縣西北入海也艸盛皃從艸䌛聲夏書曰厥艸惟䌛臣鍇曰草高大也延朝反除艸明堂月令曰季夏焼薙從艸雉聲他計反耕名從艸耒耒亦聲魯内反艸大也從艸致聲陟利反艸相蔪苞從艸斬聲書曰艸木蔪包臣鍇曰蔪相入也就冉反蔪或從槧道多艸不可行從艸弗聲臣鍇按國語曰陳道茀不可行也分匆反馨香也從艸必聲臣鍇曰詩云苾苾芬芬是也頻术反香艸也從艸設聲臣鍇按楚辭曰褱椒聊之蔎蔎施子反香艸也從艸方声弗啇反雜香艸從艸賁聲臣鍇按詩有蕡其實扶云反治病艸從艸樂聲㣧畧反艸木相附䕻土而生從艸麗聲易曰百穀艸木麗於土臣鍇按䕻者相分布屬著也在草故從艸鄰之反廣多也從艸席聲臣鍇按爾雅席大也尚書丕冐海隅蒼生蒼生草木也辝尺反刈艸也從艸殳聲所監反薦蓆也從艸存聲臣鍇曰與栫相似荐猶踐也在片反祭藉也一曰艸不編狼藉從艸耤聲臣鍇按易曰藉用白茅慈乍反茅藉也從艸租聲禮曰封諸侯以土蒩以白茅臣鍇曰此亦包蒩字且渠反朝會束茅表位曰蕝從艸絶聲春秋國語曰致茅蕝表坐子雪反以茅葦蓋屋從艸次聲臣鍇曰次第茅以蓋之也疾茲反茨也從艸咠聲臣鍇按春秋左傳葺其牆屋七十反苫也從艸盇聲溝艾反葢也從艸占聲臣鍇曰編茅也春秋左傳曰披苫葢設炎反葢也從艸渇聲思大反㕞也從艸屈聲臣鍇曰猶掘也瞿弗反屏也從艸潘聲臣鍇按班固西都賦曰突荆藩分軒反酢菜也從艸沮聲臣鍇曰以米粒和酢以漬菜也周礼醢人掌七菹韭菹菁菹茒菹葵菹芹菹菭菹筍菹齊民要術有酢漿煑菜爲菹也齋居反或從皿或從缶芥脃也從艸全聲臣鍇按荃亦香草也材㳂反韭鬱也從艸酤聲臣鍇曰治韭之名也寛歩反瓜菹也從艸監聲籠三反臣次立按前已有藍注云染青艸也此文當從艸濫聲傳冩之誤也菹也從艸泜聲纏伊反䓜或從皿皿噐乾梅之屬從艸撩聲周礼曰饋食之籩其實乾䕩後漢長沙王始煑艸爲䕩臣鍇曰今白梅也勒抱反䕩或從潦煎茱茰從艸䫉聲漢律㑹稽獻􅱣一斗臣鍇按齊民要術調食使茱茰也言沸反羮菜也從艸宰聲臣鍇按字書辛菜也荘里及阻史反擇菜也從艸右右手也一曰杜若香艸臣鍇曰擇之順手也故訓左右手也一本草杜若苗似䕬根似旋覆也此㑹意如約反蒲叢也從艸專是倫反以艸𥙷缺從艸㐁聲讀若俠或以爲綴一曰約空也臣鍇曰約空謂今木工以直木附於曲木並之有空不合處則以物附墨筆中以物亞開之隨曲木畫之使如曲木然後隨所畫斵之則附合謂此也直例反叢艸也從艸尊聲臣鍇曰按張衡南都賦森䔿䔿而刺天祖木反艸田噐從艸條省聲論語曰以杖荷蓧地料反雨衣一曰蓑衣從艸卑聲一曰萆歴似烏韭臣鍇按春秋左傳齊師遇雨陳成子衣製杖戈注云製雨衣製與萆聲相近烏韭即麥門冬頻役反艸也從艸是臣鍇按即今之知母是攴反履中艸從艸且聲臣鍇按履中屈也津於反艸履也從艸麤聲村呼反艸噐也從艸貴聲求位反古文蕢象形論語曰有荷蕢而過孔氏之門艸覆地從艸㑴省聲七朕反車重席從艸因聲臣鍇按劉熈釋名茵因也因與下相連也伊倫反司馬相如說茵從革刈艸也象包束艸之形臣鍇曰此雖從艸葢是象形字阻虞反乾芻從艸交聲一曰蔪艸臣鍇曰其草名曰苽刈取以用曰芻故曰生芻一束乾之曰茭故尚書曰峙乃芻茭加肴反亂艸從艸歩聲臣鍇曰部歛之也盤怖反斬芻從艸巢聲詩曰于以采藻子草反藻或從澡也王芻從艸录聲詩曰菉竹猗猗臣鍇按爾雅注云鴨脚莎也劣束反艸也從艸曹聲殘高反艸也從艸聲延秋反艸也從艸沼聲前焦反艸也從艸吾聲楚詞有䓊蕭艸阮孤反篇茿也從艸茿省聲臣鍇按今人呼篇竹是也陟祝反艸從艸汜聲浮檻反艸也從艸乃聲臣鍇按字書艿草陳新相積也而冰反艸也從艸血聲翾迭反艸也從艸匋聲特豪反白苗嘉穀從艸已聲气以反水舄也從艸賣聲詩曰言采其藚臣鍇按爾雅藚牛脣也似續断寸寸有節拔之復生夕燭反艸也從艸冬聲都農反薔虞蓼從艸嗇聲臣鍇按爾雅注澤蓼也踈憶反艸也從艸召聲臣鍇按爾雅注陵苕也古來亦通謂草木翹秀者為苕故江淹云青苕日夜黄也留遼反艸也從艸楙聲莫透反艸從艸冐聲莫号反鳬葵也從艸丣聲詩曰言采其􅛄連丑反蓨也從艸由聲臣鍇曰下從由即爾雅注云未詳也田溺反臣次立曰前已有此重出萐蒲也從艸甫聲分武反苦荼也從艸余聲臣鍇按爾雅荼苦菜即今荼茗也又菜名今野苦苣也故詩曰誰謂荼苦又茅秀也詩曰出其闉闍有女如荼周禮有掌荼下士掌聚荼國語曰白羽之矰望之如荼荆楚歳時引􅛳爲舎人曰杏華如荼可耕白沙則此字或音大加反或音度都反田吾反白蒿也從艸緐聲臣鍇曰所謂蘋蘩藴藻也復喧反菣也從艸高聲治牢反蒿也從艸逢聲貧容反籕文蓬省艸也從艸黎聲臣鍇按今落帚或謂落黎𥘉生可食藜之類也里西反薺食實也從艸歸聲臣鍇按爾雅紅籠古其大者蘬下句云蒫薺實若非許慎時以蒫字連上句則是冩說文者相承蒫字也驅歸反艸盛皃從艸保聲臣鍇按史記云掌葆旅事𥙷老反艸茂也從艸番聲臣鍇按春秋左傳云其必蕃昌也復喧反艸茸茸皃從艸聦省聲乳逢反艸多皃從艸隹聲專唯反艸皃從艸津聲自先反艸叢生皃從艸叢聲臣鍇曰常叢字不從艸全通反草斗櫟實一曰橡斗從艸早聲臣鍇曰此則今人書草木字隨慱士曹憲亦云也自保反麻蒸也從艸取聲一曰蓐臣鍇按潘岳西征賦白感市閭之菆井也側丘反積也從艸畜聲臣鍇曰蓄糓米芻茭𬞞菜以為備也詩曰我有㫖蓄蓄菜也敕六反推也從艸從日艸春時生也屯聲臣鍇曰春陽也故從日屯草生之難也故云亦聲川匀反艸多皃從艸狐聲江夏平春有亭古孤反艸木倒從艸到聲臣鍇按莊子曰草木之倒殖者半謂已耕發遇雨後倒生也都告反文四百四十臣次立曰今文四百三十九文按說文曰文四百四十五𥙷遺莒蓩蒢蓨萃六字共文四百四十五重三十一臣次立曰今重三十𥙷遺蕿一字共重三十一陳草復生從艸辱聲一曰蔟也凡蓐之屬皆從蓐臣鍇曰陳根更生繁縟也史記曰晨炊蓐食以茭蒲為薦席也蔟猶蠶蔟也儒曲反籕文蓐從茻同臣鍇曰言草繁多也披田草也從蓐好省聲治牢反籕文薅省薅或從休詩曰旣茠荼蓼文二重三衆艸也從四􅋄凡茻之屬皆從茻讀若與同臣鍇按春秋左氏傳曰莽之中不足以蓐從者假借莽字也謀晃反日且冥也從日在茻中茻亦聲臣鍇曰平野中望日且莫將落如在草中也今俗作暮莫度反南昌謂犬善逐兎艸中為莽從犬從茻茻亦聲臣鍇曰會意謀晃反藏也從死在茻中一其中所以薦之易曰古之葬者厚衣之以薪茻亦聲臣鍇曰一狀其薦耳賛宕反文四說文解字通釋卷第二
