seq: 2
body:
  text: 見稱於世也尹彤當時説文字者所謂慱采通人也恥列反難也象草木之𥘉生屯然而難從􅋄貫一地也尾曲易曰屯剛柔始交而難生臣鍇曰易屯卦象辭也陟倫反草盛上出也從􅋄母聲臣鍇曰􅋄則象上出也梅櫑反厚也害人之草往往而生從􅋄毐聲臣鍇曰害人草若江東荼莽冶葛之屬毐音毒嫪毐字從士音仕下母音無言其毒厚也特沃反古文毒從刀葍臣鍇曰竹亦毒有南方有竹傷人則死葍聲也草𥘉生其香分布從􅋄分分亦聲臣鍇曰𥘉出莩甲又葉𥘉生故香苦今採荼皆𥘉生者弗群反芬或從草菌地菌叢生曰中從屮六聲臣鍇曰從􅋄者象三菌叢生也易夬卦曰莧陸夬夫陸即也與莧皆為柔脆之物坴字從此粟菊反籀文從三火煙上出也從􅋄從黑􅋄黑熏象臣鍇曰物之受煙者唯草為甚無根故從􅋄詩曰穹窒熏鼠以草熏之也黑非白黑之黑字四象穴火炎上出礙於草故為熏此言黑熏象故知非白黑字詡君反文七重三百卉也從二􅋄凡草之屬皆從草臣鍇曰總名也草叢生故從二屮此討反上諱臣鍇曰後漢孝明帝諱故許愼不解説而最在前也臣鍇以為莊盛飾也故從草壯聲壯亦盛也又道路六逹謂之莊亦道路交會之盛也側羊反古文莊在木曰果在地曰蓏從草㼌聲臣鍇大豆根黃而香蔓延生女有反禾粟之􅣴生而不成者謂之蕫節從草郎聲臣鍇按爾雅稂蕫梁注云莠類也勤當反節或從禾禾粟下揚生莠從草秀聲讀若酉臣鍇曰粟下揚謂禾粟實下播揚而生出於粟秕左傳曰其莠猶在乎史曰飬莠敗禾夷酒反枲實也從草肥聲臣鍇按儀禮苴麻之有子者然則萉麻子也扶云反萉或從麻賁桂荏蘇從草任聲臣鍇按荏白蘇也桂荏紫蘇也而沈反菜也從草矢聲也匕反菜之美者雲夢之䔇從草豈聲臣鍇曰此吕氏春秋伊尹對湯之辭也其為狀未聞丘尾反菜也從草􅱳聲揆惟反郤溼之菜也從草強聲臣鍇曰薑可以止腹病治腳下溼伊尹對湯曰陽朴之薑九啇反辛菜薔虞也從草翏聲臣鍇按爾雅薔蓼注萱草臣鍇按本草即今之鹿蔥也吁袁反或從暖或從宣營藭香草也從草宫聲臣鍇按藭即江蘺根也又名蘼蕪又薇蕪其根名芎藭臣鍇按本草療頭痛寒痺諸寒冷氣腹痛故司馬叩曰有山芎藭乎欲使逃泥水中故問有禦寒及腹痛之藥也牽弓反司馬相如説菅從芎臣鍇曰司馬相如續李斯倉頡篇作凡將一篇解説文字許愼所采故云司馬相如説也營藭也從草窮聲渠中反香草也從草闌聲臣鍇按本草蘭葉皆似澤蘭方莖蘭員莖白華紫蕚皆生澤畔八月華楚辭曰浴蘭湯兮沐芳華本草蘭草辟不祥故潔齋以事大神也臣又按本草蘭入藥四五月採謂采枝葉也春秋左氏傳鄭穆公曰蘭死吾其死乎吾所以生也刈蘭而卒按鄭穆公曰十月卒彼時十月今之八月非本草采用之時者蓋常人候其華實成然後刈取之也勒餐反草出吳林山從草姦聲臣鍇曰此山海經所云也箇山反薑屬可以香口從草俊聲斯唯反芄蘭莞也從草丸聲諸曰芄蘭之枝臣鍇按本草芄蘭蘿藦也葉似女青味辛主虛勞户寒反楚謂之蘺晉謂之虈齊謂之茞從草嚻聲臣鍇按本草白芷一名虈一名芳香一名茞一名莞一名符離一名澤芳葉一名蒿麻可作脂及為浴湯故內則云遺之茞蘭則受而獻諸舅姑欣消反江蘺蘼蕪從草離聲鄰之反虈也從草臣聲昌亥反蘪蕪也從草麋聲閩之反香草也從草熏聲臣鍇按薰草蘼蕪又慱物志云東方君子國薰草華朝朝生華也許君反水篇茿從水毒聲讀若督臣鍇按郭璞注爾雅竹篇蓄似小藜亦莖節生道旁可殺蟲此云水篇茿蓋别名也此即爾雅作竹者得酷反篇茿也從草扁聲比兖反芞與也從草聲臣鍇按離騷經畦留夷輿藒車注藒車芞輿芳草也去絶反芞輿也從草氣聲欺訖反馬莓也從草母聲臣鍇按爾雅蔍藨注曰藨即莓盆華紫俗名蠶莓可食即蓬纍殷王女所食又有地莓黃華子小異食之傷人爾雅又有葥一名山莓注云即木莓似藨莓而大亦可食今俗亦云蛇藨蠶麃莫隊反草也從草各聲臣鍇按爾雅茖山蔥注曰茖蔥細莖大葉管子曰齊桓公伐山戎出其山蔥戎菽也勾索反甘草也從草甘聲臣鍇按爾雅蘦大苦注云即甘草也蔓延生葉似荷青黃莖赤有節枝枝相植葉葉相當鈎諳反草也從草豫聲可以為繩陳君反草也從草盡聲夕晉反草也從草𫐠聲臣鍇按藥有蓬莪蒁常出反荵冬草從草忍聲臣鍇按本草忍冬蔓生繞覆草水上莖赤紫色宿者有薄白皮幕之嫩莖有毛葉似胡豆上下有毛華白蘃凌冬不凋治寒熱耳引反萇楚銚弋一名羊桃從草長聲臣鍇按爾雅萇楚銚弋注曰葉似桃華白子如小麥亦似桃臣按詩曰隰有萇楚也直良反芺也從草魝聲臣鍇按爾雅芺薊其寶荂然則薊芺之屬即今刺薊是又木一名山薊其形相似但華别似杜鵑而青紫耳又有楊枹薊一名馬薊似薊而肥大一名赤木也已惠反草也從草里聲讀若釐臣鍇字書朔濯草一名荲利之反釐草也一曰拜商藋從草翟聲臣鍇按爾雅商藋赤似藜臣以為俗所謂灰藋也地料反堇草也從草及聲臣鍇按爾雅注即烏頭也飢泣反山莓也從草歬聲臣鍇曰所謂大莓也子飬反毒草也從草婺聲臣鍇按周禮注瘍醫以五毒攻之其一也莫透反卷耳也從草務聲亡考切人參藥草出上黨從草􅒓聲臣鍇按本草作麥字異者人形也師今反鳬葵也從草攣聲臣鍇按郎茆也詩所謂薄采其茆也本草注曰江南人名豬蓴堪食魯剜反草也可以染留黃從草戾聲臣鍇按爾雅藐紫草注草可染紫一名䓞臣以為史儀制多言緑綟綅即此草所染也又按經疏五方之間色有留黃其紫赤黃之間古詩所謂佳人贈我䇶中綺何以報之流黃素是也婁惠反蚍􅗶也從草收聲臣鍇按荍今佳蜀葵也詩曰視爾如荍𡵨遙反蒿也從草毗聲鼻冝反草也從草禹聲臣鍇按漢書遊俠有萭草字子夏萭姓也十甫反草從草夷聲臣鍇按丘遲詩輕荑承玉輦荑𥘉生草也敵圭反草也從草嶭聲私列反大苦苓也從草古聲臣鍇按爾雅蘦大苦甘草也口魯反草也從草音聲臣鍇按字書黃菩草又漢有菩陽天子更衣之别館也因地為名菩山之陽也步乃反薏苡從草啻聲一曰英臣鍇按今謂之薏未是也堅者曰幹珠依色反菅也從草矛聲夢梢反茅也從草官聲臣鍇按詩曰雖有絲麻無棄菅蒯是也箇山反草也從草聲江夏有蘄春亭臣鍇按爾雅書馬芹字或如此也臣希反草也可以作席從草完聲户寒反莞屬也從草閵聲臣鍇按劦也一名馬藺里刃反董蒢職也從草除聲直魚反水草也或以作席從草浦聲盆乎反蒲子可以為平席從草弱聲臣鍇曰按蒻蒲下入泥白處今俗呼蒲白尚書曰敷重蒻席注蒻蘋是也臣鍇以為蒻即根上𥘉生萌也從草尋聲臣鍇按本草即知母藥也形似昌蒲而柔潤葉至難死掘出隨生須枯燥乃止味苦寒一名堤母田南反蕁或從爻臣鍇按今本草作此􅙛字草也從草毄聲堅歷反草也從草區聲臣鍇按爾雅注江東呼細藋為烏蓲音丘起秋反草也從草固聲骨度反草也從草幹聲臣鍇按本草注書珠字如此也根旱反薯蔗也從草諸聲臣鍇按今之甘蔗也掌於反薯蔗也從草庶聲之射反牂蘘可以作縻綆從草聲臣鍇曰芒之屬可為汲綆也女庾反草也從草豬聲臣鍇按爾雅茉荎藸展魚反草也從草賜聲先刺反草也從草中聲珍蒙反王萯也從草負聲臣鍇按吕氏春秋殷王孔甲田于萯山之陽大風迷惑入于民室山海經萯山神秦逢所居符九反草也味苦江南食以下氣從草夭聲臣鍇曰今苦芺也安浩反草也從草弦聲形先反草也從草聲臣鍇曰古囿字也延救反草也從草孚聲芳于反兔瓜也從草寅聲臣鍇按爾雅注似土瓜翼真反馬帚也從草并聲臣鍇按爾雅注似蓍可為帚也頻寧反水邉草也從草猶聲臣鍇按爾雅似莤一名蔓于注一名軒于生水中臣鍇今按似細蘆蔓生水上隨水高下泛泛然也故曰蕕也延秋反草也從草安聲思旰反纂月爾也從草綦聲臣鍇按爾雅月爾似蕨可食即紫藄也虔知反兔葵也從草希聲臣鍇按爾雅注似葵而小葉狀如藜有毛汋啖之滑本草注云苩似石龍芮華白似梅蘂紫者堪啖欣祈反灌渝從草夢聲讀若萌臣鍇按爾雅蕍蕮注云澤舄本草澤舄一名芒芋生池澤夢即草莾之名名又近芒灌莾即澤也疑夢即澤舄也木空反盜庚也從草復聲臣鍇按爾雅盜庚旋獲藥也戒六反卷耳也從草令聲臣鍇按爾雅苓耳卷耳也形似鼠耳叢生如盤臣鍇曰菌屬生朽潤木根連丁反草也從草贛聲一曰薏苡臣鍇按本草薏苡一名米卷控反茅葍也一名蕣從草敻聲臣鍇按爾雅葍華有赤者為藑也葵名反葍也從草冨聲臣鍇按爾雅葍葍注大葉白華根如指心白可啖詩曰言采其葍也分溜反葍也從草畐聲方菊反苗也從草修聲徒聊切又湯雕切蓨也從草由聲臣鍇曰苖音迪爾雅釋草有之注云未詳徒歷切又他六反草枝枝相值葉葉相當從草昜聲臣鍇按爾雅蓫薚馬尾又草枝枝相值葉葉相當唯甘草耳吞臣反櫻莫從草奧聲臣鍇按詩云食䖇及薁於目反馬藍也從草咸聲臣鍇按爾雅注今大葉冬藍也止沉反草也可以束從草魯聲臣鍇按爾雅作履苴草也勒古反或從鹵草也從草㕟聲臣鍇按詩曰雖有絲麻無棄菅是也庫拜反草也可以烹魚從草婁聲臣鍇曰今人所食蔞蒿也力殊反草也從草畾聲詩曰莫莫葛藟一曰秬鬯臣鍇曰葛蔓也桞水反棘蒬也從草冤聲臣鍇按爾雅本草逺志也葉名小草過言反茈草也從草此聲臣鍇曰即今染紫草也司馬相如上林賦書茈薑字如此津矣反茈草也從草貌聲尨璞反鳥喙也從草則聲臣鍇按本草即烏頭也有大毒故蘇秦云飢食烏喙與餓死同患齋石反茅搜茹藘人血所生可以染絳從草鬼臣鍇按今醫方家謂搜為地血食之輔血是也故從鬼色酋反茅搜也從草西聲七縣反赤也從草􅲁聲素次反牡贊也從草辟聲臣鍇按爾雅有之注云未詳避契反杜榮也從草忘聲臣鍇按爾雅注云為繩索莣也勿強反草也南陽以為麁履從草包聲臣鍇按此草名尚書包匭菁茅又草木漸包又詩方如竹包矣皆當作包不從草也此交反冰臺也從草又聲臣鍇即今炙艾也五蓋反草也從草章聲周良反楚葵也從草斤聲臣鍇曰今水芹也伎殷反豕首也從草甄聲臣鍇按爾雅注即今地菘草也止鄰反寄生也從草烏聲詩曰蔦與女羅臣鍇按本草云蔓草木生黃絲為赤網色淺文為兔虆又一名免縷一名蓎一名蒙一名王女一名兔絲得了反蔦或從木臣鍇曰附子木故從木草也似目宿從草云聲淮南説藝草可以死復生臣鍇按藝草著於衣書辟蠧漢種之於蘭臺石室藏書之所羽文反草也從草聲麁最反草也從草律聲留筆反藾也從草束聲臣鍇按爾雅注即草木之刺也測麥反䒷婁果羸也從草􅡜聲古活反蕦蓯也從草封聲臣鍇按爾雅有之注云未聞敷容反蒺藜也從草齊聲詩曰牆有薺臣鍇曰此今藥家所用蒺藜也今人以此字為薺菜疾咨反茦也從草刺聲臣鍇曰此為草木之朿為斫之刺七智反薡蕫也從草童聲杜林曰藕根臣鍇按爾雅蘋薡蕫也似蒲而細今人以織履符動反狗毒也從草繫聲臣鍇按爾雅注樊光云俗語苦如蘻蓋非的識今藥有狼毒忌惠反草也從草嫂聲臣鍇曰今繁縷草思討反地黃也從草下聲禮曰鈃毛牛藿羊芐豕薇是臣鍇曰鈃羮器也其中菜謂之芼桓古反白蘞也從草僉聲臣鍇按本草白蘝藥也一名兔荄作藤生根似天門冬一株下有十許爾雅云菄兔荄注乃云未詳也留琰反蘞或從斂黃菳也從草金聲臣鍇按本草葉細長兩葉相對作叢生藥草也却林反草也從草今聲詩曰食野之芩巨任反鹿靃也從草麃聲讀若剽一曰􅸬屬臣鍇按爾雅鹿靃鹿豆也一名蔨爾雅藨麃注云即莓也與鹿豆相近疑説文注誤以藨麃為鹿藿字也平表反綅也從草鵙聲詩曰卭有旨是臣鍇按爾雅注小草雜色似綬也許璧反芰也從草淩聲楚謂之芰秦曰薢茩臣鍇按爾雅菱蕨攗注云今水中芰也齊民要術有種芰法亦同一名菱池中種之爾雅别有薢茩決光注云決光明也葉鋭黃赤華實如山茱茰或曰菱關西謂之薢茩今按決明藥菜也馬蹄者葉鋭下而實與山茱茰亦良似華深黃色爾雅注所云關西即秦地其或曰菱則謂決光水中之菱矣又按國語楚屈到嗜芰則許慎云楚謂之芰也屈到死將以芰祭其子去之以為芰非祭用也今按蓤邉豆之實也則屈到嗜芰則決明之菜非水中芰審菱矣祭不用故去之今按決明菜治目故以光明為名又以屈建之言分之則慎所注全是菜也但菜一名決光薢茩又名水中菱同菱凡三名菜有其二所異者蕨攗耳所以致惑也力􅈾反司馬相如説菱從遴臣鍇按漢書司馬相如續倉頡篇作凡將一篇亦解説文字許慎采其異者著於比也菱也從草支聲臣記反杜林説芰從多薢茩也從草解聲問蟹反薢茩也從草后聲講吼反雞頭也從草欠聲其閃反曰精也似秋華從草鞠聲臣鍇按本草蘜即九月黃華者也一名女精一名女華也居逐反蘜或省爵麥也從草籥聲臣鍇按即燕麥也漢魏以前雀字多作爵假借也㣧略反牡茅也從草遫聲臣鍇按爾雅注曰茅屬也孫卜反茅秀也從草私聲臣按此即今茅華未放者也今人食之謂之茅椻詩所謂手如柔荑荑秀也先兹反雚之未秀者從草兼聲臣鍇按爾雅薕也注云似藋而細髙數尺臣今見江之西岸多有之高如此今人以為簾薄疑因此名薕也未秀謂其小耳結添反􅫠也從草亂聲八月薍為葦也臣鍇按爾雅菼薍也注云似葦而小實中江東呼為烏蓲臣今見海瀆有之葦即大蘆也八月薍亦長大也亦猶蒿有數種至秋老皆名為蒿也五晏反雚之𥘉生一曰薍一曰隼從草剡聲忒敢反􅫠或從炎臣鍇按爾雅釋言云菼隼下注云菼草色如隼在青白之間臣以為此帛色名染之如生菼色染之如今人所染麥緑也蓋此菼亦名為隼非獨其色也簾也從草廉聲連鹽反青薠似莎者從草煩聲臣鍇按相如上林賦薛莎青薠復喧反昌蒲也從草卭聲益州生臣鍇按本草昌蒲一寸九節生蜀郡又有葉無脊者名蓀即蘭蓀也顔當反􅟏䓉也從草邪聲臣鍇曰今人書䓉蒿字也延遮反葦華也從草刀聲臣鍇按爾雅葦醜苕注其類皆芀秀醜即類也臣謂苕者抽條搖逺生華而無莩萼也今人取之以為帚曰苕菷是也笛遼反芀也從草􅍌聲臣鍇以為禮云桃茢常用此為桃帚非徒黍穰也良舌反菡􅣿也從草函聲臣鍇曰菡猶含也未吐之意候坎反菡􅣿芙蓉華未發為菡􅣿已發為芙蓉從草閻聲臣鍇曰芙之言敷也蓉之言動容也特感反芙蕖之實也從草連聲落妍反芙蕖莖從草加聲臣鍇曰夫渠即芙蓉此又藥五茄也間巴反芙蓉葉從草何聲間俄反芙蕖本從草密聲臣鍇謂藕節上𥘉生莖時萌牙殼也在泥中者美弼反芙蕖根從草水禺聲五斗反天蘥也從草龍聲臣鍇按爾雅有之注云未聞也來充反蒿葉屬生千歲三百莖易以為數天子蓍九尺諸侯七尺大夫五尺士三尺從草耆聲臣鍇按白虎通蓍之言耆也陽之老也故其數竒言九尺七尺也申離反香蒿也從草臤聲臣鍇按爾雅注今謂青蒿香饀者為菣祛胤反菣或從堅臣鍇曰堅亦聲蘿莪蒿屬也從草我聲臣鍇曰爾雅注今呼為莪蒿亦曰𦾰蒿偶和反莪也從草羅聲婁何反蒿屬也從草林聲臣鍇此即上𦾰蒿字亦作此力甚反牡蒿也從草尉聲臣鍇按爾雅即𦾰蒿之無子者也一名牡菣迂胃反艾蒿也從草肅聲臣鍇按爾雅蕭萩汪即蒿也古人言蕭斧則謂芟艾之斧也齊斧剪齊之斧也先么反蕭也從草秋聲臣鍇按春秋左氏傳或借此為楸字七牛反鳧茈也從草勺聲臣鍇曰今人所食鳬茈也堅鳥反王彗也從草前聲臣鍇曰今落帚草也自先反草也從草為聲于委反草也從草冘聲臣鍇曰按爾雅􅙛莐藩是也池心反治蘠也從草鞠聲臣鍇按本草菊有十名不言治蘠爾雅注即今之秋華鞠居逐反蘠靡釁冬也從草牆聲臣鍇按爾雅注虋冬一名滿冬今本草有天門冬麥門冬並無滿冬之名賊忘反芪母也從草氏聲臣鍇按本草芪母即知母之一名也是支反茈菀出漢中房陵從草宛聲臣鍇按本草紫菀生陸山谷也鬱逺反貝母也從草明省聲臣鍇按本草云貝母一名莔根彩如聚貝子安五藏治目眩項直不得返顧故許穆公夫人思歸衛不得而作詩曰言米其莔也沒彭反山薊也從草术聲臣鍇按今菜苗似薊也柱黜反析􅕴大薺也從草冥臣鍇按爾雅注似薺葉細俗呼老薺莫歷反荎藸也從草味聲臣鍇按爾雅五味子也勿貴反荎藸也從草至聲直而反絺綌草也從草曷聲格曷反葛屬也從草曼聲臣鍇曰葛之總名也無飯反葛屬也白華從草鼻聲家豪反菨餘也從草杏聲臣鍇按爾雅注則今之莕菜也限猛反莕或從行同臣鍇按詩參差荇菜也菨餘也從草妾聲節攝反草也從草聲古論反魚毒也從草元聲臣鍇按本草芫華也可用毒魚一名杭魚毒爾雅杭字從木注即云大木也不知爾雅别有本名杭又名魚毒將誤書從草因入木中注者詳之也言袁反大苦也從草霝聲臣鍇按本草即藥甘草也連丁反蕛苵也從草稊聲臣鍇按爾雅注似稗布地生穢草敵圭反蕛苵也從草失聲亭結反艼熒朐也從草丁聲臣鍇按爾雅有之注云未詳他寧反苽蔣也從草將聲臣鍇曰苽草也青謂之苽蔣枯謂之芻茭子甫反又子良反雕苽一名蔣從草瓜聲臣鍇曰雕苽西京雜記及古詩多作雕胡枚乘云雕胡之飯按即今所食茭苗米也古胡反草也曰彼茁者葭鄒滑反枝柱從草巠聲臣鍇曰枝主於莖故云枝柱候宏反莖也從草廷聲臣鍇按東方朔曰以莛橦鍾莛枝莖也田丁反草木之葉也從草枼聲亦接反草之小者從草鋭聲鋭古文鋭字讀若芮居例反華盛從草不聲一曰芣苡臣鍇以為慎意以此為棠棣之華萼芣韡韡之芣也附柔反華也從草皅聲臣鍇按葩草木華𥘉坼也故木華海賦曰葩華踧意同也浦瓜反草之葟榮也從草尹聲臣鍇按爾雅蕍芛葟華榮注云華葟也今俗謂草木華𥘉生者為芛蕍猶敷蕍亦草木華之貌所未詳營跬反華黃從草黊聲讀若墮壞臣鍇按謂草木之黃華者也乎瓦反苕之黃華也從草爂聲一曰末臣鍇按史記趙武靈王夢處女歌曰美人熒熒兮顏若苕之華注云苕紫華草也又郭璞遊仙詩曰潛穎怨青陽陵苕哀素秋又爾雅注陵苕一名陵時故曰黃華蔈白華茇也今本草注證云陵霄也此眇反草榮而不實者一曰黃英從草央聲臣鍇按爾雅釋木有權黃英注未詳也又平反華盛從草爾聲詩曰彼薾惟何臣鍇曰薾猶彌漫意也而俾反草盛從草妻聲詩曰菶菶萋萋臣鍇按萋深切之意也言其色深切也七低反草盛從草奉聲臣鍇按菶菶散亂也輔冗反茂也從草疑聲詩曰黍稷薿薿臣鍇曰薿薿苗盛之貌牛以反草木華垂貌從草𬎼聲臣鍇按嵇康琴賦曰飛英㽔於昊蒼儒佳反青齊兖兾謂木細枝曰葼從草㚇聲子紅反草萎䔟從草移聲以支反草木形從草原聲言袁反草實從草夾聲臣鍇按周禮其植草冝莢物是也尺俠反聲莫透反草茂也從草畼聲臣鍇按史記夏以木德青龍出於郊草木􅳵茂上向反草隂地從草隂聲臣鍇曰草所庇也衣任反草貌從草造聲臣鍇曰草相次也𥘉狩反草禾多益從草絲省聲臣鍇曰此草木之茲盛也則私反草旱盡也從草椒聲詩曰􅣛􅣛山川他狄反草貌從草敲聲周禮曰轂雖蔽不藃臣鍇按周禮注謂藃暴隂柔後必撓減轉革暴起為藃欣消反草多貌從草既聲臣鍇曰蔇猶密也訖示反草多貌從草資聲臣鍇曰薋猶積也疾兹反草盛貌從草秦聲臣鍇曰蓁蓁相湊也側詵反惡草貌從草肖聲羶枲反芮芮草生貌從草內聲若汭臣鍇曰芮芮細貌若言蚊蚋也汝歲反草貌從草在聲濟北有茬平縣仕淄反草多貌從草會凡草曰零木曰落從草洛聲臣鍇曰木曰落而從草者也但葉落耳其枝幹徑與草零無異故從草勒託反蔽蔽小草也從草敝聲臣鍇按詩曰蔽芾甘裳比𬒮反草木皮葉落墮地為蘀從草擇聲詩曰十月殞蘀臣鍇曰此言草木而從草者木蘀與草同也他作反積也從草溫聲春秋傳曰蕰利生孽臣鍇曰春秋左傳曰芟夷蕰崇之但積之低為藴堆之高為崇迂吻反煙也從草焉聲為焉反鬱也從草於聲一曰􅖖也郁諸反草旋貌也從草榮聲詩曰葛藟之臣鍇曰謂縈繞也於反草也從草祭聲蒼大反草葉多從草伐聲春秋傳曰晉糴茷臣鍇曰糴茷人名也符發反草之可食者從草采聲臣鍇曰采亦聲少亦字此載反草多葉貌從草而聲沛城父有楊荋亭臣鍇曰古謂頰毛為耐此草似之也然知反草浮水中貌從草乏聲孚凡反林薄也一曰蠶薄從草溥聲臣鍇曰木曰林草曰薄故云叢薄盆各反所以養禽獸從草卯聲臣鍇曰苑猶院也鬱逺反大澤從草數聲九州之藪揚州具區荆州雲夢豫州圃田青州孟諸兖州大野雍州弦蒲幽州奚飬冀州楊紆并州昭余祁是也臣鍇按周禮注大澤曰藪具區五湖也雲夢夢澤也其地跨江圃田在中牟今鄭州孟諸在睢陽東北大野在巨鹿東北弦蒲在汧奚飬在長廣昭余祁在太原塢楊紆爾雅注在扶風汧縣西蘇走反不耕田也從草􆁙易曰不災畬臣鍇曰此為從草從田凡三文合之舊解從草災傳寫誤以田合為災亦無聲字何以言之若實從草下災則下不合别有災字云或省草省草則與東楚名缶曰災同聲同體而别出名缶之災在第二十四卷也臣以為當言從從田田不耕則草塞之故從草者川壅也但許慎約文後人不曉誤以田人成災字因誤加聲字耳學者所冝詳之側持反災或省草臣鍇曰從田􆁙此會意此即災水出太山梁父縣西北入海也草盛貌從草繇聲夏書曰厥草惟繇臣鍇曰草高大也延朝反除草明堂月令曰季夏燒剃從草雉聲他計反耕名從草耒耒亦聲魯內反草大也從草致聲陟利反草相蔪苞從草斬聲書曰草木蔪包臣鍇曰蔪相入也就冉反蔪或從槧道多草不可行從草弗聲臣鍇按國語曰陳道茀不可行也分匆反馨香也從草必聲臣鍇曰詩云苾苾芬芬是也頻术反香草也從草設聲臣鍇按楚辭曰褱椒聊之蔎蔎施子反香草也從草方聲弗啇反雜香草從草賁聲臣鍇按詩有蕡其實扶云反治病草從草樂聲㣧略反草木相附䕻土而生從草麗聲易曰百穀草木麗於土臣鍇按䕻者相分布屬著也在草故從草鄰之反廣多也從草席聲臣鍇按爾雅席大也尚書丕冒海隅蒼生蒼生草木也辝尺反刈草也從草殳聲所監反薦席也從草存聲臣鍇曰與栫相似荐猶踐也在片反祭藉也一曰草不編狼藉從草藉聲臣鍇按易曰藉用白茅慈乍反茅藉也從草租聲禮曰封諸侯以土蒩以白茅臣鍇曰此亦包蒩字且渠反朝會束茅表位曰蕝從草絶聲春秋國語曰致茅蕝表坐子雪反以茅葦蓋屋從草次聲臣鍇曰次第茅以蓋之也疾茲反茨也從草咠聲臣鍇按春秋左傳葺其牆屋七十反苫也從草盍聲溝艾反蓋也從草占聲臣鍇曰編茅也春秋左傳曰披苫蓋設炎反蓋也從草渴聲思大反刷也從草屈聲臣鍇曰猶掘也瞿弗反屏也從草潘聲臣鍇按班固西都賦曰突荆藩分軒反酢菜也從草沮聲臣鍇曰以米粒和酢以漬菜也周禮醢人掌七菹韭菹菁菹茒菹葵菹芹菹菭菹筍菹齊民要術有酢漿煮菜為菹也齋居反或從皿或從缶芥脆也從草全聲臣鍇按荃亦香草也材沿反韭鬱也從草酤聲臣鍇曰治韭之名也寬步反瓜菹也從草監聲籠三反臣次立按前已有藍注云染青草也此文當從草濫聲傳寫之誤也菹也從草泜聲纏伊反䓜或從皿皿器乾梅之屬從草撩聲周禮曰饋食之籩其實乾䕩後漢長沙王始煮草為䕩臣鍇曰今白梅也勒抱反䕩或從潦煎茱茰從草貌聲漢律會稽獻􅱣一斗臣鍇按齊民要術調食使茱茰也言沸反羮菜也從草宰聲臣鍇按字書辛菜也莊里及阻史反擇菜也從草右右手也一曰杜若香草臣鍇曰擇之順手也故訓左右手也一本草杜若苗似薑根似旋覆也此會意如約反蒲叢也從草專是倫反以草輔缺從草西聲讀若俠或以為綴一曰約空也臣鍇曰約空謂今木工以直木附於曲木並之有空不合處則以物附墨筆中以物亞開之隨曲木畫之使如曲木然後隨所畫斫之則附合謂此也直例反叢草也從草尊聲臣鍇曰按張衡南都賦森䔿䔿而刺天祖木反草田器從草條省聲論語曰以杖荷蓧地料反雨衣一曰蓑衣從草卑聲一曰萆歷似烏韭臣鍇按春秋左傳齊師遇雨陳成子衣製杖戈注云製雨衣製與萆聲相近烏韭即麥門冬頻役反草也從草是臣鍇按即今之知母是攴反履中草從草且聲臣鍇按履中屈也津於反草履也從草粗聲村呼反草器也從草貴聲求位反古文蕢象形論語曰有荷蕢而過孔氏之門草覆地從草侵省聲七朕反車重席從草因聲臣鍇按劉熙釋名茵因也因與下相連也伊倫反司馬相如説茵從革刈草也象包束草之形臣鍇曰此雖從草蓋是象形字阻虞反乾芻從草交聲一曰蔪草臣鍇曰其草名曰苽刈取以用曰芻故曰生芻一束乾之曰茭故尚書曰峙乃芻茭加肴反亂草從草步聲臣鍇曰部斂之也盤怖反斬芻從草巢聲詩曰于以采藻子草反藻或從澡也王芻從草録聲詩曰菉竹猗猗臣鍇按爾雅注云鴨腳莎也劣束反草也從草曹聲殘高反草也從草聲延秋反草也從草沼聲前焦反草也從草吾聲楚詞有䔡蕭草阮孤反篇茿也從草茿省聲臣鍇按今人呼篇竹是也陟祝反草從草汜聲浮檻反草也從草乃聲臣鍇按字書艿草陳新相積也而冰反草也從草血聲翾迭反草也從草陶聲特豪反白苗嘉穀從草已聲氣以反水舄也從草賣聲詩曰言采其藚臣鍇按爾雅藚牛脣也似續斷寸寸有節拔之復生夕燭反草也從草冬聲都農反薔虞蓼從草嗇聲臣鍇按爾雅注澤蓼也踈憶反草也從草召聲臣鍇按爾雅注陵苕也古來亦通謂草木翹秀者為苕故江淹云青苕日夜黃也留遼反草也從草楙聲莫透反草從草冒聲莫號反鳬葵也從草丣聲詩曰言采其􅛄連丑反蓨也從草由聲臣鍇曰下從由即爾雅注云未詳也田溺反臣次立曰前已有此重出萐蒲也從草甫聲分武反苦荼也從草余聲臣鍇按爾雅荼苦菜即今荼茗也又菜名今野苦苣也故詩曰誰謂荼苦又茅秀也詩曰出其闉闍有女如荼周禮有掌荼下士掌聚荼國語曰白羽之矰望之如荼荆楚歲時引􅛳為舍人曰杏華如荼可耕白沙則此字或音大加反或音度都反田吾反白蒿也從草繁聲臣鍇曰所謂蘋蘩藴藻也復喧反菣也從草高聲治牢反蒿也從草逢聲貧容反籕文蓬省草也從草黎聲臣鍇按今落帚或謂落黎𥘉生可食藜之類也里西反薺食實也從草歸聲臣鍇按爾雅紅籠古其大者蘬下句云蒫薺實若非許慎時以蒫字連上句則是寫説文者相承蒫字也驅歸反草盛貌從草保聲臣鍇按史記云掌葆旅事輔老反草茂也從草番聲臣鍇按春秋左傳云其必蕃昌也復喧反草茸茸貌從草聰省聲乳逢反草多貌從草隹聲專唯反草貌從草津聲自先反草叢生貌從草叢聲臣鍇曰常叢字不從草全通反草斗櫟實一曰橡斗從草早聲臣鍇曰此則今人書草木字隨慱士曹憲亦云也自保反麻蒸也從草取聲一曰蓐臣鍇按潘嶽西征賦白感市閭之菆井也側丘反積也從草畜聲臣鍇曰蓄穀米芻茭𬞞菜以為備也詩曰我有旨蓄蓄菜也敕六反推也從草從日草春時生也屯聲臣鍇曰春陽也故從日屯草生之難也故云亦聲川勻反草多貌從草狐聲江夏平春有亭古孤反草木倒從草到聲臣鍇按莊子曰草木之倒殖者半謂已耕發遇雨後倒生也都告反文四百四十臣次立曰今文四百三十九文按説文曰文四百四十五輔遺莒蓩蒢蓨萃六字共文四百四十五重三十一臣次立曰今重三十輔遺萱一字共重三十一陳草復生從草辱聲一曰蔟也凡蓐之屬皆從蓐臣鍇曰陳根更生繁縟也史記曰晨炊蓐食以茭蒲為薦席也蔟猶蠶蔟也儒曲反籕文蓐從茻同臣鍇曰言草繁多也披田草也從蓐好省聲治牢反籕文薅省薅或從休詩曰既茠荼蓼文二重三衆草也從四􅋄凡茻之屬皆從茻讀若與同臣鍇按春秋左氏傳曰莽之中不足以蓐從者假借莽字也謀晃反日且冥也從日在茻中茻亦聲臣鍇曰平野中望日且莫將落如在草中也今俗作暮莫度反南昌謂犬善逐兔草中為莽從犬從茻茻亦聲臣鍇曰會意謀晃反藏也從死在茻中一其中所以薦之易曰古之葬者厚衣之以薪茻亦聲臣鍇曰一狀其薦耳贊宕反文四説文解字通釋卷第二
