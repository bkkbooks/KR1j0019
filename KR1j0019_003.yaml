front:
  text: 為也姊薛反
  hash: sha256:3aa676e3a28952836a887fe3052b0674d065d7a339fb3eb65299dfe5afe078f2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0019_SBCK_003-1a}
body:
  text: 文三别也象分别相背之形凡八之屬皆從八臣鍇曰數之八兩兩相偶背之是别也北技反别也從八從刀刀以分别物臣鍇曰天地始分高下相背若有刀刑以制之也翻文反必然也從八丨八八象氣之分散臣鍇曰尓詞者言之助也禮曰鼎鼎爾悠悠爾是必然凡今試言爾則敷土脣收下脣氣向下而分散也指事而俾反辭之舒也從八從曰四聲臣鍇按詩曰曾是掊克緩氣言之故曰舒前增反曽也庶幾也從八向聲臣鍇按春秋左傳曰尚克知之庶幾知之也曾尚氣皆分散也時怏反從意也從八豕聲夕醉反多言也從言從八從厃臣鍇曰詹亦省也故為多言八分别也厃音牛毀反仰也故為詹此會意之炎反畫也從八從人人各有介茍差反分也從重八八别也亦聲孝經説曰故上下有别臣諧曰分之甚明也或本音兆鄙輟反平分也從八從某八猶背也韓非曰背某為公臣鍇曰某不公也會意君聰反分極也從八弋聲臣鍇按孔子曰母固母必必分别之極也畢聿反語之舒也從人舍省聲臣鍇曰與爾意同以徐反二余也讀與余同文十二重一辨别也象獸指瓜分别也凡釆之屬皆從釆讀若辨臣鍇曰象獸五指其下八八此中畫曲也蒲莧反古文釆同獸足謂之番從釆田象其掌臣鍇曰本造北字為獸足掌也象形復喧反番或從足從煩古文番臣鍇曰象獸掌形也悉也知宷諦也從宀釆臣鍇曰宀覆也釆别也能包覆而深别之釆悉者也已下數字皆同施甚反蒃文審從田臣鍇曰言從番字也詳盡也從心釆息逸反古文悉解也從釆釆取其分别物也從睪睪聲失易反文五重四物中分也從八牛牛為物大可以分也凡半之屬皆從半臣鍇曰大則分之也會意脯慢反半體肉一曰廣肉從肉從半半亦聲臣鍇按周禮曰供其膴胖鋪換反半也從牛反聲臣鍇者其外亦各隨事分例不滯而拘執雌雄牝牡之類不可一槩而不分又不得偏滯而拘執君子所以貴夫通儒也莫厚反特牛也從牛岡聲臣鍇曰特一牛也一牲牛也格康反特牛也從牛寺聲頭墨反牛子也從牛瀆省聲駝谷反二歲牛從牛市聲臣鍇按爾雅云牬犢體長也輔會反三歲牛從牛參聲四參反四歲牛從牛四四亦聲素次反籀文牭從二仁至反騬牛也從牛害聲臣鍇曰犗健也苟荖反白黑雜毛牛從牛尨聲免江反牻牛也從牛京聲春秋傳曰牻㹁臣鍇按春秋左傳曰牻㹁冬殺然尨駮雜之稱也涼亦寒熱相半不純也柳昌反牛白脊也從牛厲聲郎蔡反黃牛虎文從牛余聲讀若塗田吾反駁牛也從牛勞省聲吕卓反牛白脊也從牛寽聲録設反牛駁如星從牛平聲普鶯反牛黃白色從牛麃聲臣鍇按周禮曰鳥犥色也片妖反黃牛黑脣也從牛􅙯聲詩曰九十其犉然勻反白牛也從牛隺聲臣鍇曰按詩曰白鳥義通於此逆捉反牛長脊從牛疆聲九商反牛徐行也從牛𠬢聲讀若滔偷勞反牛息聲從牛雔聲一曰牛名赤周反牛鳴也從牛象其聲氣從口出臣鍇曰指事也莫浮反畜牲也從牛産聲所簡切牛完全從牛生聲所庚反牷牛純色從牛全聲旋延反引前也從牛象引牛之縻也玄聲臣鍇曰指事也棄妍反畜母也從牛匕聲易曰畜牝牛吉毗忍切牛馬牢也從牛告聲周書曰今惟淫牿牛馬骨僕反間飬牛馬圈也從牛冬省聲取其四同匝臣鍇曰指事闌刀反以芻莖飬牛也從牛芻芻亦聲春秋國語曰犓豢幾何阻虞反牛柔謹也從牛夒聲爾小反易曰犕牛乘馬從牛葡聲辨利反耕也從牛黎聲里西反兩壁耕也從牛非聲一曰覆耕種也讀若匪斧尾反牛羊無子也從牛􅔧聲讀若糗糧之糗特豪反觸也從牛氏聲的米反牛踶也從牛衛聲于歲反牛狠不從引也從牛臤臤亦聲一曰大貌讀若賢喫善反牛膝下骨也從牛巠聲春秋傳曰宋司馬牼字牛懇耕反牛舌病也從牛今聲極朕反南徼外牛一角在鼻一角在頂似豕從牛尾聲斯低反牣滿也從牛刃聲語曰於牣魚躍臣鍇曰牛人物也故為滿爾吝反萬物也牛為大物天地之書銜恨字如此候彡反咽也從口會聲或讀若快一曰饞噲也苦夬反含味也從口且聲前吕反小也從口毚聲一曰喙也士銜反嘗也從口叕聲一曰喙也昌蹶反啖也喙也從口筮聲時制反噍也從口集聲讀若集姊入反嘗也從口齊聲周書曰太保受同祭嚌寂帝反齧也從口焦聲寂要反噍或從爵嗽也從口允聲自遍反小飲也從口率聲讀若刷師子反食也從口臽聲讀與含同稻槧反小食也從口幾聲臣鍇按相如大人賦曰嘰瓊華居希反噍免從口專聲本反咽也從口天聲逖痕反銜也從口今聲侯貪反哺咀也從口甫聲盤怖反滋味也從口未聲勿貴反食辛嚛也從口樂聲火酷反口滿食從口窡聲誅貀反飽食息也從口意聲臣鍇按莊子曰大塊噫氣其名曰風烏怪反喘息也一曰喜也從口單聲詩曰嘽嘽駱馬通看反口液也從口垂聲吐破反唾或從水南陽謂大呼曰咦從口夷聲寅之反東夷謂息為呬從口四聲詩曰犬夷呬矣羊媚反疾息也從口專聲昌轉反外息從口乎聲臣鍇曰氣出為外虎烏反內息也從口及聲希立反吹也從口虛聲欣余反噓也從口欠叱為反大息從口胃聲區帥反喟或從貴臣鍇按韓詩外傳嘳然太息作此字口氣也從口􅙯聲詩曰大車他門反悟解氣也從口疐聲詩曰願言則嚏臣鍇曰腦鼻中氣壅塞噴嚏則矣欣記反笑也從口亞聲易曰笑言啞啞鴉赫反大笑也從口豦聲其虐反笑也從口希聲一曰哀痛不泣曰唏虛斐反笑貌從口斤聲臣鍇按相如上林賦無是公聽然而笑冝引反多言也從口世聲詩曰無然呭呭延世反聲嘄嘄也從口梟聲堅蕭反相謂也從口出聲都突反應也從口矣聲讀若塵埃遏開反言之間也從口哉聲臣鍇按春秋左傳曰逺哉遙遙孔子曰君子哉若人是哉為間隔之詞也走該反聚語也從口尊聲詩曰噂􅊱背憎祖本反聶語也從口從耳詩曰咠咠幡幡七入反吸呷貌從口甲聲呼甲反小聲也從口彗聲詩嘒彼小星呼計反彗或從慧語聲也從口然聲仁遷反大笑也從口奉聲讀若詩曰瓜瓞菶菶蒲蠓反盛氣也從口真聲詩曰振旅嗔嗔笛前反疾也從口􅰈聲詩曰匪車嘌嘌兮片妖反號也從口呼聲虎烏反音聲喅喅然從口昱聲融六反吹聲也從口肅聲息呌反籕文嘯從欠恱也從口吕聲臣鍇按史記序傳曰諸吕不台作此字言不為人所怡恱也偷咍反臣次立曰又與之反喜也從口䍃聲臣鍇按禮記曰喜斯陶陶斯詠詠斯猶爾雅注云猶即嗂也延朝反開也從户口臣鍇按詩曰東有啓明爾雅明星為啓明言晨見東方為開明之始也會意溪禰反聲也從口貪聲詩曰有嗿其饁他感反皆也悉也從口戍聲臣鍇曰其口同也侯彡反平也從口壬聲直成反助也從口又聲臣鍇曰言不足以佐又手助之詩曰匪面命之言示之事匪口誨之言提其耳會意延九反語時不啻也從口帝聲一曰啻諟也讀若鞮叱智反善也從士口臣鍇曰口無擇言也會意經栗反密也從用口臣鍇曰忠信為周詩曰嗟我懷人置彼周行言用之也雙留反古文周字從古文反大言也從口庚聲臣鍇曰鼓聲盛為鼞與此意同時郎反古文唐從口昜誰也從口􅴣又聲臣鍇曰口問為誰也尚書曰咨若豫采誰順我事者咨問之也陳收反含深也從口覃聲特感反飲窒也從口一聲伊結反咽也從口昷聲烏骨反不歐而吐也從口見聲臣鍇曰醫方有小兒哯乳也易顯反㵼也從口土聲他魯反氣牾也從口歲聲遷厥反違也從口弗聲周書曰咈其者長臣鍇曰見於言也附勿反語未定貌從口憂聲衣尤反言蹇難從口氣聲臣鍇曰揚雄口吃也幾迄反嗜欲喜之也從口耆聲食利反噍啖也從口炎聲一曰噉稻槧反語為舌所介礙也從口更聲讀若井絞綆根杏反誇語也從口翏聲加肴反啁嘐也從口周聲摘抄反諂聲也從口圭聲讀若醫臣鍇曰古人言淫哇之聲也户媧反語相訶相歫也從口䇂䇂惡聲也讀若櫱顔過反囁吺多言也從口殳聲臣鍇按古文尚書書歡兜字作吺單侯反苛也從口氐聲臣鍇曰今人謂詰難之為呧呵的未反苛也從口此聲臣鍇按後漢書郭泰傳衛文生買物呰呵減價乃售是也將此反遮也從口庶聲之射反妄語也從口夾聲讀若莢居俠反多言也從口盍聲讀若甲候臘反歌聲嗙喻也從口旁聲司馬相如説淮南來蔡歌舞嗙喻臣鍇曰此相如上林賦之文也此行反高氣多言也從口蠆省聲春秋傳曰噧言訶介反高氣也從口九聲臨淮有厹猶縣臣鍇曰吕氏春秋有厹猶國智伯欲伐者也虞柔反嚾聲也從口奴聲詩曰載號載呶獰交反噴也叱怒也從口毛聲臣鍇曰蜀書諸葛亮奏彭羕舉頭視屋噴吒作聲是也陟駕反吒也從口賁聲一曰鼓鼻鋪奔反訶也從口七聲瞋密反危也從口矞聲臣鍇按爾雅噊殆危也注云未詳與必反嘮呶歡也從口勞聲丑交反驚也從口􅌰聲此退反驚也從口辰聲止鄰反驚也從口亐聲臣鍇曰亐語之舒也當言亐亦聲脫誤也又按亏字部復有亏字云驚語也從口從亏亏亦聲臣鍇以為在亏部當言從亏從口今既與口部之亏同形同義而在兩處疑一處誤多之尚書群臣舉鯀帝曰吁咈哉驚怪群臣舉此人也吁亏也况亏反懼也從口堯聲詩曰唯豫音之嘵嘵曉么反大呼也從口責聲臣鍇按春秋左傳曰嘖有繁言然則嘖又訓至也故太玄經探賾索隱之賾皆作嘖而説文無賾字也鉏客反嘖或從言衆口愁也從口敖聲詩曰哀鳴嗸嗸臣鍇按詩曰鴻鴈于飛哀鳴嗸嗸鴈鳴聲象也顔叨反㕧也從口念聲詩曰民之方念㕧丁念反念㕧呻也從口尸聲欣冝反呻也從口嚴聲五彡反吟也從口申聲臣鍇曰聲引氣也式人反呻也從口今聲臣鍇曰吟申氣之聲也銀欽反吟或從音或從言嗟也從口兹聲臣鍇曰嗟咨字本如此咨訓問也則欺反喔也從口厄聲臣鍇按易曰笑言呝呝晏索反哤異之言從口尨聲一曰雜語讀若尨臣鍇按國語曰四民雜處則其言哤哤雜異也免江反呼也從口丩聲臣鍇曰直聲呼也見弔反嘆也從口既聲詩曰慨其嘆矣臣鍇曰意氣有所欎慨然也苦蓋反語唌嘆也從口延聲臣鍇曰按唌謾也夕連反吞歎也從口歎省聲一曰太息臣鍇曰欲言不能吞恨而太息也但旦反渴也從口曷聲臣鍇按上林賦榜人歌聲流喝喝聲長而轉也殷介反不容也從口肖聲臣鍇按投壼禮曰枉矢哨壼謙言壼小不足容也且醮反動也從口化聲詩曰尚寐無吪鍇曰臥既覺必有聲氣又曰或寢或吪五陀反嗛也從口潛省聲臣鍇按文子曰蚉虻噆膚作雜反恨惜也從口文聲易曰以往吝臣鍇曰恨惜形於言故從口里刃反古文吝從彣異辝也從口夂夂者有行而止之不相聽意臣鍇曰夂音竹凡反象人足欲行從後躓之故各字從之也會意振莫反不也從口不聲臣鍇曰不本音缶侯又反又府丑反弔生也從口言聲詩曰歸唁衛侯擬線反閔也從口衣聲遏間反號也從口虒聲臣鍇曰今俗人作啼敵圭反歐貌也從口殼聲春秋傳曰君將嗀之臣鍇曰心惡未至於歐因嗀出之也刻學反口戾不正也從口冎聲臣鍇曰咼音寡苦柴反嗼也從口叔聲臣鍇曰子虛賦曰寥無聲前狄反嗼也從口莫聲聞落反塞口也從口氒省聲氒古文厥字臣鍇曰􅱗字從此古活反古文從甘臣鍇曰甘為口實也使犬聲從口族聲春秋傳曰公嗾夫􅋙臣鍇曰獎使之進也食候反犬鳴從口犬臣鍇曰會意或云從犬扶穢反嘷也從口包聲臣鍇按詩云咆哮于中國也步交反咆也從口臯聲行高反談長説嘷從犬臣鍇按春秋左傳曰豺狼所嗥豺狼犬屬嗥其聲髙大也鳥鳴聲也從口皆聲一曰鳯凰鳴聲喈喈臣鍇曰聲衆且和也古諧反豕驚聲也從口孝聲烹茅反雞鳴也從口屋聲江嶽反鳥口也從口朱聲臣鍇按爾雅咮謂之柳注云朱鳥之口也專扶反鳥鳴也從口嬰聲臣鍇按詩曰鳥鳴嚶嚶思行反鳥食也從口豖聲輒角反唬聲也從口虎一曰虎聲讀若皓嘰訝反鹿鳴聲也從口幼聲臣鍇按詩曰􅊯􅊯鹿鳴伊虬反幼或從欠麋鹿群口相聚貌從口虞聲詩曰麀鹿􅢕􅢕無羽反魚口上見從口禺聲臣鍇按淮南子曰水濁則魚喁庾肩吾詩曰江鱏乍噞喁魚口出水上也元鍾反促也從口在尺下復局之一曰慱所以行棊象形臣鍇曰人之無涯者唯口耳故君子重無擇言故口在尺下則為局又人言幹局取象於慱局外有垠堮周限可用故謂人材為幹局口在尺下則為會意象慱局形廣異聞也瞿束反山間陷泥地從口從水敗貌讀若兖州之兖九州之渥地也故以兖名焉臣鍇曰口以象山間也兒半水也象土上有少水也尚書濟河惟兖州九河既道厥土黑墳又云十有三載乃同厥草惟繇厥木惟條是必肥美之地也渥者澤潤也與件反古文沿文一百八十二重二十一臣次立曰今重二十輔遺訡一字共重二十一張口也象形凡凵之屬皆從凵臣鍇曰口字無橫畫也丘犯反文一驚呼也從二口凡叩之屬皆從叩讀若歡臣鍇曰衆人並呼吁袁反亂也從爻工交叩一曰窰讀若穰臣鍇曰二口噂􅊱也爻物相交也工人所作為也己象交構其間也女庚籕文教命急從吅􅫏聲臣鍇曰急則從二口也語醃反右文嚴臣鍇曰從三口也譁訟也從吅屰亦聲臣鍇曰屰音逆五各反大也從吅卑吅亦聲闕臣鍇曰言大則吅吅即喧也許慎闕義至今未有能知之者也待干反呼雞重言之從吅從州聲讀若祝臣鍇曰重言之故從二口列仙慱有祝雞翁後人或作喌隻逐反文六重二哀聲也從吅獄省聲凡哭之屬皆從哭臣鍇曰哭聲繁亂故從二口閏毒反亡也從哭云聲臣鍇按淮南子曰羿妻恆娥竊不死藥開然有喪凡失物則為喪蘇湯反文二趨也從夭止夭止者屈也凡走之屬皆從走臣鍇曰止則趾也趾是也春秋左傳曰君親舉玉趾走則足屈故從夭止會意則口反走也從走芻聲切于反趨也從走仆省聲臣鍇曰一心趨向之也弗孺反疾從走取聲臣鍇按史記曰欒布使趣湯七駐反跳也從走召聲臣鍇按漢書甘延夀超踰羽林亭樓耻朝反善緣木走之才從走喬聲讀若王子蹻臣鍇曰趫足捷也起嚻反輕徑有材力也從走丩聲臣鍇曰詩曰赳赳武夫也緊黝反緣大木一曰行貌從走支聲臣鍇按蟲行曰蚑行謂四足隨高下逶迤其背豸豸然人之緣木有似於此故曰趨走則足屈亦有類也翹移反疾也從走噪聲則到反躍也從走翟聲臣鍇曰詩躍躍􅎧螽􅎧螽善跳躍躍胤略反跖也從走厥聲臣鍇曰謂足蹈地深也俱多反度也從走戊聲于厥反也從走鬒聲讀若塵臣鍇曰自後反之也丑儐反趁也從走亶茶連反趬趞也從走昔聲一曰行貌七削反行輕貌從走堯聲一曰趬舉足牽遙反急走也從走弦聲形先反蒼卒也從走􅙻聲讀若資七茨反輕行也從走垔聲片妖反行貌從走臤聲讀若菣棄忍反行貌從走酋聲千牛反行貌從走蜀聲讀若燭臣鍇曰每步舉足之意也專王反行貌從走匠聲讀若匠自障反走貌從走睿聲讀若紃績倫反走意從走薊聲讀若髽結之結經節反走意從走囷聲丘忿反走意也從走坐聲宣訛反走意也從走憲聲希建反走意從走臱省聲辟涓反走也從走􅪝聲讀若詩威儀秩秩遲匹反走也從走有聲讀若又延救反足輕也從走烏聲讀若塢宛古反走顧貌從走瞿聲讀若劬群計反走貌從走蹇省聲機善反疑之等䞗䞗而去也從走才聲臣鍇曰謂嶷其不齊使之並而往以察驗之也七開反淺渡也從走此聲七里反獨行也從走勻聲讀若煢臣鍇曰詩云獨行煢煢本作此赹字葵名反安行也從走與聲尹汝反能立也從走已聲氣以反古文起從辵留意也從走里聲讀若小兒孩猴猜反行也從走臭聲沓夢反低頭疾行也從走金聲牛錦反趌􅨤怒赱也從走吉聲臣鍇曰直去不低視也輕質反趌􅨤從走曷聲鳩歌反疾也從走睘聲讀若歡吁袁反直行也從走氣聲臣鍇曰去無回慮也幾氣反趨進􅱸如也從走翼聲臣鍇曰趨進便駛復有儀容如鳥之翼也今論語作翼字假借也以即反踶也從走決省聲臣鍇曰踶猶踏也鵙冗反趨從走氐聲的替反趨趙久也從走多聲陳知反趙趨也從走肖聲他沼反行難也從走斤聲讀若堇已郡反走意也從走敻聲讀若繘涓出反逺也從走卓聲臣鍇曰跨步逺也敕渥反趠䟑也從走從􅕛􅕛亦聲臣鍇曰猶躍也㣧灼反大步也從走矍聲俱莫反超特也從走契聲臣鍇按漢書天馬歌曰超踰蹀猶蹀也耻滯反走從走幾聲呼璣反走也從走岪聲防勿反狂走也從走矞聲臣鍇曰急疾之貌也葵橘反行遲也從走曼聲墨班反從走出聲讀若無尾之屈瞿弗反窮也從走掬聲臣鍇曰步所窮也堅祝反趦趄行不進也從走次聲臣鍇曰易曰其行趑趄也七茨反趑趄也從走且聲七余反蹇行也從走虔聲讀若愆豈虔反行䟒趢也從走雚聲一曰行曲脊衢員反䟒趢也從走録聲劣束反行速䞭䞭從走夋聲七賔反側行也從走束聲詩曰謂地蓋厚不敢不趚臣鍇曰若行險恐陷墜也津易反半步也從走圭聲讀若跬同臣鍇曰一舉足也傾觜反䞾隲輕薄也從走虒聲讀若地陳知反僵也從走咅聲朋北反距也從走斥聲漢令曰赾張百人臣鍇曰𧻀張蓋謂以足踏張弩也充舍反動也從走樂聲讀若春秋傳曰輔䟏連的反動也從走佳聲春秋傳曰盟于趡趡地名取誅反􅧱田易居也從走亘聲臣鍇按春秋左傳晉於是乎作爰田國語作轅田皆假借此乃正字也謂以田相換易也羽先反走頓也從走真聲讀若顛臣鍇曰頓倒也的煙反喪劈從走甬聲臣鍇曰今借踊字與恐反止行也一曰竈上祭名也從走畢聲臣鍇曰周禮作此字春秋左傳曰不蹕漢出警入蹕卑聿反進也從走斬聲淡反趧婁四夷之舞各自有曲從走是聲的齊反雀行也從走兆聲臣鍇曰鳥雀跳行也笛遼反舉尾走也從走千聲巨言反行聲也從走異聲讀若敕一曰不行貌暢陟反文八十五重一下基也象草木出有址故以止為足凡止之屬皆從止臣鍇曰草木𥘉生根幹也只耳反跟也從止重聲臣鍇曰足踶也故從止即跟也之勇反距也從止尚聲臣鍇曰若草木之根枝直旁柱其上也周禮曰必䟫其角緾行反躇也從止寺聲臣鍇曰猶躊躇也直里反止也從止巨聲一曰搶也一曰超距臣鍇按史記云拔距注謂兩人以手共據地為力而能拔起之也又曰超距搶頭撞也求許反不行而進謂之歬從止在舟上臣鍇曰莊子曰坐而至越者舟也自先反過也傳也從止曆聲臣鍇曰止行止也連的反至也從止叔聲昌伏反人不能行也從止辟聲臣鍇曰不能行故止史記曰有躄者盤􅘐行汲卑僻反女嫁也從止婦省自聲臣鍇曰婦人謂嫁曰歸止者止於此也舉韋反籕文歸從止疾也從又又手也從止屮聲臣鍇曰止足也又手也足共為之故疾也徢定從此疾接反機下足所履者疾從止從又入聲臣鍇曰今人作䌰也女懾反蹈也從反止讀若撻臣鍇曰蹈行也止為行也他刮反不滑也從四止臣鍇曰四皆止故為歰也師及反文十四重一足刺也從止凡之屬皆從讀若撥臣鍇曰兩足相背不順故刺也北末反上車也從豆象登車形臣鍇曰登車亦刺難也豆非爼豆字象形耳丹增反籕文登臣鍇曰兩手捧車之物也登車之物王謂之乘石以足踏夷草從殳春秋傳曰夷藴崇之臣鍇曰會意也普未反文三重一行也從止少相背凡步之屬皆從步臣鍇曰尚書王朝步自宗周行自宗周也盤怖反木星也越歷二十八宿宣遍隂陽十二月一次從步戍聲律曆書名五星為五步臣鍇曰木星為歲星亦曰龍星自子至巳為陽午至亥為隂一次三十二度十二次凡三百六十度也夏曰歲取名於此也相苪反文二止也從止從匙相比次也凡此之屬皆從此臣鍇曰匕近也近在此也七里反窳也闕將此反職也從此束聲一曰藏也臣鍇曰或書禽觜作此于纍反文三説文解字通釋卷第三
