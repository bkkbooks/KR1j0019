front:
  text: 四時也從日寺声神持反古文從日之作臣鍇曰之声日之晨也從日在甲上古文甲字臣鍇曰甲十干之首又象人頭子草反尚冥也從日勿声臣鍇曰今史記作昒同呼兀反昧爽旦明也從日未声一曰䦣也莫隊反旦眀也從日者声得古反昭晰明也從日折声禮曰晰明行事臣鍇曰今禮記作質明假借之列反明也從日堯声呼皎反旦也明也日将出也從日斤声讀若忻臣鍇曰昕猶焮也日炙物之皃禮曰大昕之朝讀若希所斤反日明也從日召声真遥反明也從日吾声詩曰晤辟有摽臣鍇按詩曰可與晤言傳云晤對也考之説文則當作捂字牾相當也盖詩假借晤字宋謝惠連詩曰晤對無厭倦今相承皆作晤字頑于反明也從日廣声臣鍇按漢光武帝詔曰庶僚乆廢也故此嚝為明也困盎反明也從日勺声易為的顙臣鍇曰光的然也的音滴臣鍇曰水之一滴不廣顛歴反明也從日光光亦声胡莾反日旦出皃從日九声讀若朂臣鍇按詩旭日始旦一也喧玉反進也日出而萬物進從日臸声易曰明出地上晋㑹意子印反日出也從日昜声虞書曰至于暘谷臣鍇按尚書洪範乂時暘若晹曰暴之也猶良反雨而晝夝也從日啓省声臣鍇曰啓開也今人言開夝也溪禰反日覆雲暫見從日昜声臣鍇曰日暫見為晹與此義同移尺反日出温也從日句声北地有朐衍縣况于反日見也從日見見亦声詩曰見晛曰消年電反天清也從日安声臣鍇按史記封禪書曰色晏温是也殷訕反星無雲暫了反白虎宿星從日卯声免狡反不乆也從日郷声春秋傳曰曏役之三月臣鍇曰不乆猶言未乆也若今人言適來也若今人言已過之言也許仗反曏也從日襄声臣鍇曰曩犹攘也相攘却成故舊也莊子罔兩責影曰曩子行今子止也能朗反累日也從日作省声自莫反閑也從日叚聲限乍反不乆也從日斬声祖澹反喜樂皃從日弁声皮變反羙言也從日從曰曰亦声昌亦曰日光也又詩曰東方昌矣臣鍇按詩曰猗嗟揚兮羙目昌兮昌羙也尚書曰禹拜昌言昌言即當言也曰亦言也此㑹意字言亦声後人妄加之非許慎本言也昌即明也東方昌也即東方明矣故晋孝武帝以東方明時生名曰昌明也醜將反籀文省作臣鍇曰從口義與從同羙光也從日徃声臣鍇按爾雅日暀暀皇皇羙也于相反大也從日反声臣鍇按詩曰爾土宇昄章注昄大也昄訓大當作昄作昄亦假借𥙷綰反明日也從日立声融六反温濕也從日𧹞省声讀若𧹞尼綰反傷熱暑從日曷声臣鍇按荘子曰暍者反冬乎冷風憂歇反熱從日者声叔吕反安㬮温也從日難声那旦反衆微杪也從日中視絲古文以為顯字或以為衆口皃讀若唫唫或以為繭繭者絮中往往有小繭是也臣鍇曰衆而㣲眇者日中視絲也今謂精者曰綿繭内衣護蛹者與其外膜縮雜為之曰絮小繭助蛹衣乃蠶口也五沓反晞也從日從出從從米臣鍇按南史宋時嘗議廢餞尚書孔琳議曰姦偽之人競溼糓以要利然則将糶必先曰暴之也者以手㩁聚反覆之意也盆操反古文從日声色介反暴也從日麗声所智反乾也耕暴田曰從日堇声易曰燥萬物者莫乎火火離也臣鍇按周禮曰旱暵之事是也喝散反乾也從日希声臣鍇按古詩曰青青園中葵朝露待日晞希亦少也物朝則少也忻沂反乾肉也從殘肉日以晞之與俎同說臣鍇曰者肉開祈之象俎左旁亦象切肉也指事思益反籕文從肉臣鍇曰下更象肉胾也今人作腊即此也上同日近也從日匿声春秋傳曰私降暱燕臣鍇曰日月相近也女室反或從尼作臣鍇曰尼亦声日狎習相嫚也從日執声臣鍇按詩曰左右御義與媟同私列反不見也從日否省声美弼上同也從日比声臣鍇曰䖵音昆蟲衆䖵也故如此昆亦訓同曰比之是同也古論反兼眩也從日亥声臣鍇曰日之光兼覆也苟孩反日無色從日竝声臣鍇曰日無光則近逺皆同故從竝有声字傳冩誤多之也㑹意拍戸反
