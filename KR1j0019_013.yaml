body:
  text: 文七十重六明也從日見一上一地也凡旦之屬皆從旦臣鍇曰日出于地也兜散反日頗見從日既聲其兾反文二日始出光也從旦偃聲凡之屬皆從臣鍇曰翰幹幹乾皆從此也根炭反闕且從三日在偃中臣鍇按李陽氷云從三日旦在於中蓋籕文許慎闕義且字下後人加同上反旦也從舟聲臣鍇曰此朝旦字知潮反文二重一旌旗之遊偃蹇之貌從曲而下垂偃相出入也讀若偃古人名偃字子遊凡偃之屬皆從偃臣鍇曰旌旗之斿綴屬偃旌旗故有九斿士斿象其兩斿皆下垂從風偃蹇逶迤之狀􅋄其綴屬處也依逺反古文偃字如此象旌旗之遊及偃之形臣鍇曰兩專下垂中相連也上同一熊旗五斿以象伐星士卒以為期從偃其聲周禮曰率都建旗臣鍇按天文參星旁有伐星五將有征伐士卒期於其下也熊勇士之象尚書牧誓曰如熊如羆何晏景福殿賦曰參旗九斿從風飄掦參星旁又有九斿星非參旗有九斿也師都六鄉六遂民所聚也虔知反龜蛇四斿以象營室悠悠而長也從偃兆聲周書曰縣鄙建旐臣鍇按周禮注龜蛇象其扞難辟害也營室北方七宿也其星象龜形池沼反繼旐之旗沛然而垂也從偃木聲臣鍇按爾雅繼旐曰斾蒲會反遊車載旌析羽注旄者也所以精進士卒也從偃生聲臣鍇按春秋壽子載其旌是也析羽謂分析鳥羽連屬為之故曰王斿旌至偃軫其竿頭則綴以旄牛尾也春秋所謂范宣子假羽旄于齊者也漢書有鸞旗注謂以鳳羽為旌也津貞反錯革畫鳥其上所以進士旟衆也從偃與聲周禮曰州里建旟臣鍇按爾雅鳥隼曰旟革鳥隼之皮革也錯雜也詩曰衆惟魚矣旐惟旟矣室家臻臻旟衆也周禮注則州里之官平約信也鳥隼猛健之象也以虗反有鈴曰旗以令衆從偃斤聲臣鍇按爾雅注縣鈴於竿頭畫交龍于旗上巨希反導車所以載全羽以為允允進也進也從偃遂聲臣鍇按全羽全剝鳥羽也道車象路也夕位反或從遺作臣鍇曰從遺聲建大木置石其上發其機以磓敵從偃會聲春秋傳曰旝動而鼓詩曰其旝如林臣鍇按諸書旝旌旗也唯許慎言潘嶽間居賦謂之駮古最反旗曲柄也以所旃表士衆從偃丹聲周禮曰通帛為旃臣鍇曰旃猶言甄也周禮通帛為旃爾雅因革為旃注謂以練為旃因其文章不復畫也遮延反或從亶臣鍇曰亶旜聲旌旗之斿也從偃攸聲臣鍇曰今俗或作斿延秋反旗屬從偃要聲倚了反旗貌從偃也聲齊欒施字子旗知施者旗臣鍇曰旗之逶迤也臣鍇按白虎通古人為字使人聞其字則知其名率皆如此許慎言欒施知施字訓旗所以字子旗也孔子弟子巫馬施亦字子旗申而反旗之旖施從偃竒聲臣鍇曰猶言旖旎也於竒反旌旗旚搖也從偃㶾聲臣鍇曰搖也片妖反旗旗飛掦貌從偃猋聲必搖反旌旗披靡貌從偃皮聲臣鍇曰披靡四散貌也壞卑反旌旗斿也從偃汓聲汓古文泅臣鍇曰旌旗邊所綴也爾雅曰練斿九春秋公羊曰若贅斿又敖斿也延秋反古文臣鍇曰子古文子字蓋從古文汓省此正敖遊字周旋旌旗之指麾從偃匹匹足也臣鍇按尚書曰王秉白旄以麾以進之也匹者足也故偃匹為旋人足隨旌旗也推沿反幢也從偃毛聲臣鍇按爾雅注旄首曰旌注謂載旄竿頭如今之幢以旄牛尾結為之也亦謂之眊注綴屬也􅓚即今道家之􅓚節象也門髙反幅胡也從偃番聲臣鍇按魏晉巳來有幡所以為信晉制東方以青龍幡西方白武幡南方朱雀幡北方玄武幡中央黃龍幡齊竟陵王子良五十二體書曰信幡以鳥書也分軒反軍之五百人從偃從從旅俱也故從從臣鍇曰周制一鄙之衆也旅者衆也師克以和故必相順從也衆出則旅寓故謂在外為旅也鄰語反古文旅古文以為魯衛之魯臣鍇按説春秋左傳者謂魯仲子有文在手曰為魯夫人魯字當作此也矢鋒也束之族族也從偃從矢昨木切文二十四重五幽也從日六坰聲日數十十六日而月數始虧幽也坰聲凡冥之屬皆從冥臣鍇曰當言坰亦聲傅寫脫民誤甹反從冥黽聲臣鍇曰又春秋時魯地名左傳曰一人門于句鱦是也沒彭反文二精光也從三日凡晶之屬皆從晶臣鍇曰以山海經注言之以為天常有十日迭送一日為畨次出之也天無二日不並出耳津貞反萬物之精上列為星從晶從生聲一曰星象形從古復注中故與日同臣鍇曰據今地上生于天一説本象星形注其中偶與晶字同記此者廣異聞也息形反古文臣鍇曰以此證之也或省有文章也從有聲臣鍇按論語郁郁乎文哉本作此􅖢假借郁字或者川流也宋玉彧字景文又假借彧字皆非本文要須作􅖢爾􅖢有蔚也文章之意于目反兼有也從有龍聲讀若籠臣鍇按字書云又馬襱頭也來充反文三昭也從囧月聲凡明之屬皆從明臣鍇曰當言囧亦聲眉平反古文從日臣鍇曰通論備矣翌也從明亡聲臣鍇曰尚書言翌日者明日也忽強反文二重一加之也會意眉平反古文從明臣鍇曰此足以􅰀字從血非聲也籕文文二重二暮也從月半見凡夕之屬皆從夕臣鍇日月字之半也月𥘉生則暮見西方故半月為夕辝易反寂也從夕莫聲臣鍇曰此則寂寞之㱳沒白反舍也天下休舍從夕亦省羊舍反不明也從夕省聲臣鍇曰當言亦聲寫少亦字木空反轉卧也從夕卧有卪臣鍇曰卪訓節也蔚逺反敬惕也從夕寅聲易曰夕惕若夤臣鍇曰夕者人意懈怠也故孫武曰晝氣歸國語魯公文伯之毋曰事多而計過無憾而後即安是也翼真反籕文雨而夜除星見也從夕生聲臣鍇曰此即今日作晴字自成反逺也卜尚平旦也今若夕卜于事外矣臣鍇曰古者君子重卜者決疑于神明當尚早今夕卜是於事踈外也五會反古文早敬也從丮持事雖夕不休早敬者也臣鍇曰言夕者持明日之事也息竹反古文亦古文從人丙聲宿字從此文九重四重也從重夕夕相繹也故為多重夕為多重日為疊凡多之屬皆從多臣鍇曰周禮又謂戰功曰多尚書文侯之命曰汝多修是也繹之言尋也不絶之意也又夏謂祭之明日又祭為繹謂尋前日之事也今夕復尋前夕之事是為多者事之過多也疊者重積前日之事以成公也不為過多也故重日則為疊重夕則為多夕者萬物息其字形亦與陽冰所説同但傳寫浸訛以下曰字兩齒相連與中竪畫相合自然其中成今正書之則與此同但是輔頰之象非正牙齒之字也舌體􅝟􅝟謂舌之出口如華之出柎籜也胡甘反俗從肉今木生條也從􅝟由聲啇書曰若顛木之有枿臣鍇曰謂之巳倒之木更生孫枝也者猶可也止之言也枿者餘也延秋反草木華甬角然也從􅝟用聲臣鍇曰甬之言涌也若水涌出也又周禮鐘柄為甬通勇湧踊誦從此與恐反草木􅝟盛也從二􅝟闕臣鍇曰華盛重纍也詩曰鄂不韡韡韡韡照也熒先反文五重一木垂華實也從木􅝟􅝟亦聱棗凡之屬皆從棗闕臣鍇曰􅝟即􅝟字也字亦從此候坎反文三重三禾麥吐穗上平也象形凡齊之屬皆從齊臣鍇曰生而齊者莫若禾麥也二地也兩旁在低處也淮南子曰居髙不可以為修修長也居下不可以為短也以二節其地形以髙卑則之形下齊而實齊也故善為國者使吐世其職農安其畝工樂其業啇便其肆其地勢不同而其志樂同也莊子曰蟪蛄不知春秋冥靈以八千歲為春此年壽不同而其生齊也大鵬摶扶搖而上者九萬里斯搶榆枋而不至此大小不同而其行止齊也此莊周齊物之意也自兮反等也從齊妻聲臣鍇按妻者齊也故等齊之字從妻也自兮反為公案也陀谷反禮也從片枼聲臣鍇按劉協文心雕龍曰議政未定短牒咨謀曰牒簡也葉在枝也田俠反木版也從片扁聲讀若邊婢篇反穿壁以木為交忩也從片戶甫聲談長以為甫上日也非户也牖所以見日也臣鍇曰忩但穿明則為忩牖者更以木為交櫺故老子曰鑿戶牖以為室先言戶後言牖彌文飾也古音甫蓋與父同聲故云甫聲也古有一室一忩一戶也談長亦當時説文字者記其言廣異聞也其言以為戶字當作日字也夷酒反築短版也從片俞聲讀若俞一曰紐也臣鍇曰兩頭版也史記萬石君傳曰取親裙厠牏浣滫注謂于築牆短版而浣滌也特婁反文八三足兩耳和五味之寶器也昔禹收九牧之金鑄鼎荆山之下入山林川澤螭魅蛧蜽莫能逢之以協承天休易卦巽木于下者為鼎象析木以炊鼎也從貞省聲古文以貞為鼎籕文以鼎為貞凡鼎之屬皆從鼎臣鍇按周易巽下離上為鼎巽木也彖曰鼎以木巽大烹飪也春秋左傳曰鑄鼎使民知神姦然後不逄不若也顛茗反鼎之圓掩上者從鼎才聲詩曰鼐鼎及鼒臣鍇按爾雅注云弇上小上也則欺反俗鼒從金妶聲鼎之絶大者從鼎乃聲魯詩説鼐小鼎也臣鍇按爾雅鼎絶大者為鼐注曰最大圜者也自孔子刪詩為三百篇以授子夏自後分散傳授其説不同故有魯詩齊詩燕詩毛詩也都㧡切以木橫貫鼎耳舉之從鼎坰聲周禮廟門容六冪七箇即易玉鉉大吉臣鍇曰按周禮亦謂之扄也民的反文一重二嘉穀也從二月始生八月而熟得時之中和故謂之禾也禾木王而生金王而死從木從􅑰省􅑰象其木也凡禾之屬皆從禾臣鍇曰禾垂穗顧本也故張衡思玄賦曰發昔夢于木禾既垂潁而顧本淮南子曰金勝木故禾春生秋死髙誘云禾木也菽火也菽故夏生冬死水王而死也麥金也故麥秋生夏死火王而死也薺水也故薺冬生夏死土王而死也戶哥反上諱臣鍇曰禾實也有實之象下垂也漢光武帝諱故許慎闕而不書也息就反禾之秀實為稼莖節為禾從禾家聲稼家也一曰禾在野為稼也臣鍇按一曰種之為稼反乍反榖可收曰穡從禾􅞋聲臣鍇曰􅞋收也故田夫為􅞋吝􅞋之意也當言􅞋亦聲誤脫亦字踈億反藝也從禾童聲臣鍇曰布之也之用反早種也從禾直聲詩曰稙稚菽珍食反先種後孰也從禾重聲直容切疾孰也從禾坴聲詩曰黍稷穜稑臣鍇曰古者繆穆稑陸聲相亂故秦繆公亦呼秦穆公從翏聲也栗菊反或從翏聲幼禾從未屖聲晚種後孰者臣鍇按爾雅長婦謂稚婦為弟婦故後漢豫章處士字孺子直致反種穊也從禾真聲周禮曰稹理而堅也臣鍇曰穊密也周禮考工記相木之言稹亦微密也友允反多也從禾周聲陳收反禾也從禾㣎聲臣鍇曰㣎音穆莫叔反禾也從禾某聲北道名禾主人曰私主人臣鍇曰某私漢制縣有蠻夷北道先兹反稻紫莖不黏也從禾糞聲讀若靡臣鍇曰即今紫華稻符既反齊也五榖之長也從禾畟聲臣鍇按本草梁貞曰先生八穀黍稷稻梁禾麻菽麥俗人尚不能分况芝英乎臣今按本草新注黍有數種有黑有黃此今人所易知爾雅秬黑黍秠一稃二米詩曰天降嘉穀維秬維秠注曰皆赤黑黍但其中米異耳稷即穄一名粢字亦作齋楚人謂之稷關中謂之麋呼其米為黃米稻即常食有粳有􅟙梁即粟之粗者有青梁穗有毛粒青米亦微青細於白梁黃梁出蜀漢南閩浙間亦種之穗大毛長榖米俱粗於白梁而叔少子不耐水旱食之香美逾于諸梁人號為竹根黃梁陶隱居所謂襄陽竹根梁白梁爾雅謂之苞白苗穗大多毛且長諸梁多相似而白梁榖粗扁長不似粟圓也米白且大食之香美黃梁之亞爾雅云虋赤苗今人赤穀粟有數種皆細于諸梁北土常食與梁有别禾即􅏘即苴荢二種也菽豆也麥有二牟大麥也來小麥也又有穬麥陶云穬麥馬食者楚辭曰穱麥拿黃梁煎弋反古文稠也從禾既聲臣鍇曰稠密也古人云深耕穊種故從禾訖示反疏也從禾希聲臣鍇曰穊既以禾為凖稀亦同也當言從禾爻巾無聲字後人加之爻者希疏之義與爽同意巾亦足其希象至莃與晞皆從稀省何以知之説文巾部爻部並無希字以是知之欣祈反禾也從禾蔑聲名噎反稷從禾齊聲臣鍇曰此即齋盛字其米為齋在器曰盛今典亦通借齊字為之稷字注巳詳子思反或從次作臣鍇曰次聲稷之黏者從禾术聲臣鍇曰黏者柔懦也术者象其體柔撓八其米也言聲傳寫誤加之下有八字不當言聲若許愼不知則當言闕常出反或不從禾作臣鍇曰但象其禾體柔弱也􅙥術怵述從此糜也從禾祭聲子歲反稌也從禾舀聲臣鍇按爾雅稌注曰今沛國呼稌徙討反稌稻也從禾余聲周禮曰牛冝稌臣鍇曰冝謂體性相冝也按本草牛肉甘平安中益氣主消渴稻米亦暖中稻令人熱牛肉性平相和為冝也他魯反沛國謂稻為糯從禾耎聲臣鍇曰糯懦也許愼謂稷為秫稻為糯今則同之奴贊反稻不黏者也從禾兼聲讀若風廉臣鍇曰即今稻也賢兼反稻也從禾亢聲臣鍇曰亢聲根橫反俗粳臣鍇曰更聲稻屬從禾毛聲伊尹曰飯之美者玄山之禾南海之耗臣鍇曰此吕氏春秋載伊尹説湯之辭也吼號反􅉭粟也從禾廣聲古猛反稻今年落來年自生謂之秜從禾尼聲臣鍇曰即今云穭生稻也利之反禾别也從禾卑聲琅琊有稗臣鍇曰似禾而别也孔子曰是用秕稗也稗生水田中故謝靈運詩曰蒲稗相因依旁賣反禾相倚移也從禾多聲一曰移禾名故相倚則移也以支反禾末也從禾頃聲詩曰禾潁穟臣鍇曰謂禾穗之端也非謂􅉭為潁故尚書曰唐叔得禾異畝同白虎通曰唐叔之禾大幾盈車長幾充箱潁者鋭也故謂錐之末為潁余郢反齊謂麥為䅘從禾來聲臣鍇按詩曰貽我來牟來即䅘也婁才反禾成秀從禾瓜聲臣鍇曰瓜禾為釆會意也夕位反俗從禾惠聲或從草遂作或從禾遂聲詩曰禾潁穟穟也禾危穗也從禾勺聲臣鍇曰危謂獨出之穗也今言了䄪也得了反禾垂貌也從禾專聲讀若端臣鍇曰禾之垂者即專也兜果反禾舉出苗也從禾曷聲臣鍇曰藒字從此鳩歇反禾􅉭也從禾少聲臣鍇曰抄之言妙也微妙也彌小反禾穖也從禾幾聲臣鍇曰按吕氏春秋曰得時之禾疏機而惠大也機莖也訖耳反一稃二米從禾丕聲詩曰誕降嘉穀惟秬惟秠天賜后稷之嘉穀也臣鍇曰后稷勤于稼穡天降此稷尚書曰稷降播種浦冝反也從禾孚聲臣鍇曰稃即米殼也草木華房為柎麥之皮為麩音義皆同也芳于反或從米附禾繇貌從禾乍聲讀若昨臣鍇曰繇動搖也自莫反耕禾間從禾麃聲春秋傳曰是穮是蓘臣鍇曰若今人種以長大復鉏其間草也彼消反轢禾也從禾安聲臣鍇曰車行禾上也思旰反禾本從禾子聲臣鍇曰古人言耘耔是也以工壅根也耔之言字也飬之也津矣反穫刈也一曰撮也從禾齊聲臣鍇曰古文齊聲臣鍇按爾雅穧穫也炷今以穫禾為穧寂帝反刈榖也從禾蒦聲胡郭切積禾也從禾資聲詩曰䆅之秩秩臣鍇曰堆積巳刈之禾也疾兹反聚也從禾責聲臣鍇曰今人言稻積是也津亦反積也從禾失聲詩曰䆅之秩秩臣鍇曰秩秩有敘之貌也遲匹反絭束也從禾囷聲臣鍇曰絭繩也今束禾也國語曰諸侯之使于齊稇載而歸是也若衮反榖之善者從禾果聲臣鍇曰今人言稞會聲若裏者儈反舂粟不潰也從禾􅡜聲戶幹反也從禾氣聲居氣反粳也從禾會聲讀若裏若檜反禾皮從禾從羔聲臣鍇按吕氏春秋得時之禾圜粒而薄䅵是也真若反榖之皮也從禾庾聲臣鍇曰爾雅云康空也從禾米米皮去其內以空之意也彄莊反或省作臣鍇曰唯從禾康聲禾稿去其皮祭天以為席從禾皆聲臣鍇曰謂禾華蒂之榖取其靜莖祭天視天下之物無足以稱之尚儉而貴質也根察反禾莖也從禾旱聲春秋傳曰或投一秉稈臣鍇曰即秸之和皮者投稈謂楚囊瓦焚郤宛時也根旱反或從千作稈也從禾髙聲臣鍇曰比于稈又彌粗亂古之時罪者稿飲水今人言稿草謂書之不謹若禾稿之亂然又文章之未修治也姦皓反不成粟從禾比聲並止反麥莖也從禾從肙聲臣鍇按潘嶽射雉賦曰窺覘䅌葉是也弓玄反黍穰也從禾􅍌聲臣鍇曰巫祝䄻茢謂以黍穰為帚治灑桃湯以除不祥也良舌反黍巳治者從禾襄聲臣鍇曰巳經擇治也詩曰降福穰穰降福穰穰多也然莊反禾若秧穰也從禾夾聲殷強反䅭䅣穀名從禾旁聲臣鍇曰亦有名如鳴蟬之類是也白良反䅭䅣也從禾皇聲戶荒反榖熟也從禾千聲春秋傳曰大有年臣鍇曰周曰年取禾一熟也泥賢反續也百榖之總名也從禾􅟤聲臣鍇按前注云粟之言續也義與此同春秋傳曰年榖和熟禮曰祈榖于上帝是􅉭實之總名也孤速反穀熟也從禾念聲春秋傳曰不五稔是臣鍇按春秋傳曰五稔惡之日也言其積惡成熟也而沈反田賦也從禾且聲臣鍇曰史記趙奢至田租之吏也尊吾反租也從禾兌臣鍇按春秋公羊傳曰稅畝者何履畝而稅也古者什而稅天下之中正也注履踐案行之擇其善畝穀最好者稅取之度不足故履擇苖之善者計其一畒之收數孟子曰夏人百畒而百徹殷人七十而助周人什一而稅莫善于稅莫不善于徹轍𬒮反禾也從禾道聲司馬相如云䆃一莖六穗也臣鍇曰禾之名也徒號反虛無食從禾荒聲臣鍇曰此飢荒字古多借荒字忽光反把取禾若也從禾魚聲臣鍇曰把音把若即竹若也穌猶部斂之也孫呼反出物有漸也從禾肖聲臣鍇曰周禮謂群臣之祿食為稍食稍稍給之也史掉反木榖熟也從禾省聲臣鍇曰音焦七牛反籕文臣鍇曰不省也伯益之後所封國也地冝禾從禾春省一曰秦禾名也臣鍇曰伯益禹之臣也為舜虞按史記秦本紀顓頊之裔孫曰女修吞玄鳥之卯生子大業大業娶少典之子曰女華生大費大費與禹平水土巳成舜曰咨爾費贊禹功賜女皂遊後嗣將大出乃妻之姚姓之玉女大費佐舜調馴鳥獸鳥獸多馴服是為柏翳賜姓嬴氏費生二子曰大廉實鳥俗氏二曰若木實費氏玄孫曰費昌昌去桀歸湯為御以敗桀于鳴條大廉玄孫曰中衍大戊御而妻之遂世佐殷為諸侯玄孫曰中潏保西垂生蜚廉蜚廉生惡來俱事紂蜚亷與紂俱死惡來在外歸無所報葬霍太山蜚廉子曰季勝勝生孟增幸于周成王是為宅臯狼臯狼生衡父衡父生造父以御幸於穆王封於趙趙襄其後也蜚廉子曰惡來革早死有子曰女防女防生旁臯旁皋生太几太几生大駱大駱生非子皆姓趙氏非子居犬丘為孝王主馬􅊈渭之間孝王分之上為附庸又邑之秦徐廣云天水隴西秦亭也續嬴氏後號曰秦嬴生秦侯秦侯生公伯公伯生秦仲見於詩與杜預春秋釋例同大唐天潢玉諜云伯翳即伯益也故云是為伯翳春禾為秦會意字也少昊即黃帝之子玄囂青陽也𥘉為已姓後為嬴姓顓頊昌意之子即少昊弟之子同姓故史記秦承顓頊伯翳之後為嬴姓春秋郯莒皆少昊後嬴姓按淮南子洛水輕利冝禾洛水即出秦地自人反籕文從秝臣鍇曰從二禾也程也從禾斗斗者量也臣鍇曰會意也若何反銓也從禾爯聲春分而禾生夏至晷景可度即禾有秒秋分而秒定律數十二秒而當一分十分而寸其以為重十二粟為一分十二分為一銖故謂程品皆從禾臣鍇曰此又去聲即權衡之稱故曰銓也夏至日極北故曰晷景可度禾有秀實則􅉭生􅉭秒也秋萬物成定之時物皆揫緒故曰秒定律皆以分寸數十二秒為一分長短也齒仍反程品也十髮為程一程為分十分為寸從禾呈聲臣鍇曰程權衡斗斛律曆也故史記曰漢興張蒼定章程謂歷數之屬也莫成反布之八十縷從禾㚇聲臣鍇曰此即十筥稯也子紅反籕文五稯也從禾巿聲一曰億數至萬曰秭臣鍇曰二萬四千斤也又按爾雅秭數也注曰今巳十億為秭津矣反秭也從禾乇聲周書曰二百四十斤為秉四秉為莒十莒為稯十稯曰秅四百秉謂之一秅臣鍇曰周禮行人之職也論語曰與之粟五秉莒竹器也或從米著巴反百二十斤也一䄷為粟二十斤禾黍一䄷者為粟十六斤太半升也從禾石聲臣鍇曰二十斗其量一百二十斤也黍粗而輕也神隻反復其時也從禾其聲唐書曰稘三百有六旬臣鍇曰從禾其則期年之期亦當從禾復其時謂之一周時也居知切文八十七重十三稀疏適也從二禾凡秝之屬皆從秝讀若歷臣鍇曰適者冝也禾人手種之故其稀踈等也速約反兼持二禾秉持一禾臣鍇曰可兼持者莫若禾也會意結添反又曰兼并也從又手也秝二禾也文二禾屬而黏也以大暑而穜故謂之黍從禾雨省聲孔子曰黍可以為酒禾入水也凡黍之屬皆從黍臣鍇曰此秝黍也叔吕反穄也從黍􅏘聲美皮反黍屬也從黍卑聲邊弭反相著也從黍占聲聶炎反黏也從黍古聲户吳反或從米作黏也從黍日聲春秋傳曰不義不䵒臣鍇曰當言續少兩字而吉反䵒或從刃履黏從黍省聲古以為利字作履黏以黍米也臣鍇曰履以糊黏之也黍黏也里西反治粟麥禾豆下潰葉也從黍畐聲臣鍇曰謂禾豆上長則下葉漸黃爛也治謂除掃之也朋北反從黍尼聲臣鍇按有樹出之如漆可以黏蟬雀黍亦黏物也勑其反文九重二芳也從黍從甘春秋傳曰黍稷馨凡之屬皆從臣鍇按尚書洪範稼穡作甘黍甘為會意也軒良反香之逺聞也從香殸聲臣鍇曰殸籕文馨字聲之逺聞香殸為馨亦會意也顯青反文二且聲臣鍇曰疏即粗也故爾雅注多謂粗為粗金魯反惡米從米比聲周書曰有粊誓臣鍇按古文尚書費誓如此春秋作費魯地名今沂州費縣筆媚反牙米也從米嶭聲臣鍇曰麥糵麥牙也魚洃反糂也從米立聲臣鍇曰尚書蒸民乃粒里汲反古文從食潰米也從米睪聲臣鍇曰釋猶散也漢書曰振兵釋旅振整也失昜反以米和羹也從米甚聲一曰粒也臣鍇曰孔子厄于陳蔡藜羮不糝也息感反古文糂從參籕文從替炊米者謂之糪從米辟聲臣鍇按爾雅飯中有勝米曰糪勝先定反米勝定下變也今謂豆不􅶊為檗豆也羆麥反糝也從米􅏘聲臣鍇曰糜即粥也羮反反糜和也從米聲讀若談持感反潰米從米尼聲交趾有冷縣臣鍇曰潰漫也眠伊反酒母從米省聲臣鍇曰麴糵也酒主于麴故曰酒母牽六反或從麥鞠省聲曰俗作臣鍇曰今鞠字也酒滓也從米曹聲作曹切籕文從酉乾也從米聲平祕切熬米麥也從米臭聲臣鍇曰煼乾米麥也去酉反舂糗也從米􅍫聲伎酒反糧也從米胥聲臣鍇曰今或借為祭神之糈也仙吕反榖食也從米量聲桞昌反雜飰也從米丑聲臣鍇按史多言漢粈之霸道也女就反穀也從米翟聲臣鍇曰糶糴字皆從此地料反䴲也從米蔑聲門撥反不雜也從米卒聲雖遂切饋客之芻米從米氣聲春秋傳曰齊人來氣諸侯臣鍇曰古云乞字直乞而巳許意反氣或從既氣或從食陳臭米從米工聲臣鍇按漢史曰太倉之粟紅腐而不可食多借紅字為之米久則紅也户聰反傳面者從米分聲臣鍇按周禮饋食有粉餈米粉也古傅面亦用米粉故齊民要術有傳面英粉漬粉為之也又紅染之為紅粉燒鉛為粉始自夏桀也弗吻反或從卷作􅔁也從米悉聲私列反䊝􅔁散之也從米殺聲臣鍇按春秋左傳曰殺管叔而􅔁蔡叔言放之若散米尚書曰囚蔡叔于郭鄰也桑怛反碎也從米靡聲臣鍇曰謂糜米麥也磨米謂之糜其石謂之磨莫播反盜自中出曰竊從冗米禼草皆聲也草古文􅍚字禼偰字也臣鍇按春秋左傳曰在外為姦在內為宄宄從冗竊從冗彌小所謂鼠竊狗盜也此形聲字七屑反文三十五重八糲米一斛舂為八斗也從䊆從殳凡毇之屬皆從毇毇糙米臣鍇曰此會意也毁字從毇呼委反糲米一斛舂為九斗曰從毇丵省聲臣鍇曰糲米從毇也春秋左傳粢食不鑿字當作此丵音仕朔反子落反自莫反文二舂也古者掘地為􅍫其後穿木石象形中象米也凡􅍫之屬皆從􅍫臣鍇按昜繫曰剡木為杵掘地為􅍫􅍫杵之利萬民以濟也舊舅字皆從此函字下鼠字上皆偶相似非從杵􅍫之􅍫又古文齒字作􅍫亦復相似亦非此字杵􅍫字中四注古文齒左右三注也伎酒反搗米也從廾持杵以臨􅍫杵省古者雍父𥘉作舂臣鍇曰雍父黃帝臣也會意輸容反齊謂舂從􅍫屰聲讀之若膊字臣鍇曰屰音屰惡厝反舂去麥皮從􅍫于聲臣鍇曰會意也插字從此焚箑反杼􅍫從瓜􅍫聲詩曰或簸或舀臣鍇曰會意也杼向下取之也滔韜稻之類音近舀者皆從如此以紹反或從手冗臣鍇按周言有女舂抭謂抭􅍫中米也反或從􅍫冗小也從人在􅍫上舂地坎可舀又臣鍇曰若今人作阮以舀虎也會意陷蓞啖閻之類聲近舀者從此寒蘸反文六重二惡也象地穿交陷其中凡凶之屬皆從凶臣鍇曰惡不可居象地之塹也惡可以陷人也昜曰入坎凶也吁封反擾恐也從人在凶下春秋傳曰曹人凶懼臣鍇曰象亂而懼也會意朂恐反文二分莖皮也從屮八象枲皮凡􅜨之屬皆從􅜨讀若􅩋臣鍇曰剝􅏘之剝也剝之則莖經手故一求也列子曰鄉人有甘枲莖是匹儐反􅏘子也從􅜨台者從辝省聲臣鍇曰枲􅏘有子若周官有典絲枲淮南子曰位賤尚枲辛子反
