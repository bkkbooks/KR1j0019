front:
  text: 四時也從日寺聲神持反古文從日之作臣鍇曰之聲日之晨也從日在甲上古文甲字臣鍇曰甲十干之首又象人頭子草反尚冥也從日勿聲臣鍇曰今史記作曶同呼兀反昧爽旦明也從日未聲一曰䦣也莫隊反旦眀也從日者聲得古反昭晰明也從日折聲禮曰晰明行事臣鍇曰今禮記作質明假借之列反明也從日堯聲呼皎反旦也明也日將出也從日斤聲讀若欣臣鍇曰昕猶焮也日炙物之貌禮曰大昕之朝讀若希所斤反日明也從日召聲真遙反明也從日吾聲詩曰晤辟有摽臣鍇按詩曰可與晤言傳云晤對也考之説文則當作捂字牾相當也蓋詩假借晤字宋謝惠連詩曰晤對無厭倦今相承皆作晤字頑于反明也從日廣聲臣鍇按漢光武帝詔曰庶僚久廢也故此嚝為明也困盎反明也從日勺聲易為的顙臣鍇曰光的然也的音滴臣鍇曰水之一滴不廣顛歷反明也從日光光亦聲胡莾反日旦出貌從日九聲讀若朂臣鍇按詩旭日始旦一也喧玉反進也日出而萬物進從日臸聲易曰明出地上晉會意子印反日出也從日昜聲虞書曰至于暘谷臣鍇按尚書洪範乂時暘若晹曰暴之也猶良反雨而晝夝也從日啓省聲臣鍇曰啓開也今人言開夝也溪禰反日覆雲暫見從日昜聲臣鍇曰日暫見為晹與此義同移尺反日出溫也從日句聲北地有朐衍縣况于反日見也從日見見亦聲詩曰見晛曰消年電反天清也從日安聲臣鍇按史記封禪書曰色晏溫是也殷訕反星無雲暫了反白虎宿星從日卯聲免狡反不久也從日鄉聲春秋傳曰嚮役之三月臣鍇曰不久猶言未久也若今人言適來也若今人言已過之言也許仗反嚮也從日襄聲臣鍇曰曩猶攘也相攘却成故舊也莊子罔兩責影曰曩子行今子止也能朗反纍日也從日作省聲自莫反間也從日假聲限乍反不久也從日斬聲祖淡反喜樂貌從日辨聲皮變反美言也從日從曰曰亦聲昌亦曰日光也又詩曰東方昌矣臣鍇按詩曰猗嗟揚兮美目昌兮昌美也尚書曰禹拜昌言昌言即當言也曰亦言也此會意字言亦聲後人妄加之非許慎本言也昌即明也東方昌也即東方明矣故晉孝武帝以東方明時生名曰昌明也醜將反籀文省作臣鍇曰從口義與從同美光也從日往聲臣鍇按爾雅日暀暀皇皇美也于相反大也從日反聲臣鍇按詩曰爾土宇昄章注昄大也昄訓大當作昄作昄亦假借輔綰反明日也從日立聲融六反溫濕也從日赧省聲讀若赧尼綰反傷熱暑從日曷聲臣鍇按莊子曰暍者反冬乎冷風憂歇反熱從日者聲叔吕反安㬮溫也從日難聲那旦反衆微杪也從日中視絲古文以為顯字或以為衆口貌讀若吟吟或以為繭繭者絮中往往有小繭是也臣鍇曰衆而微眇者日中視絲也今謂精者曰綿繭內衣護蛹者與其外膜縮雜為之曰絮小繭助蛹衣乃蠶口也五沓反晞也從日從出從從米臣鍇按南史宋時嘗議廢餞尚書孔琳議曰姦偽之人競溼穀以要利然則將糶必先曰暴之也者以手榷聚反覆之意也盆操反古文從日聲色介反暴也從日麗聲所智反乾也耕暴田曰從日堇聲易曰燥萬物者莫乎火火離也臣鍇按周禮曰旱暵之事是也喝散反乾也從日希聲臣鍇按古詩曰青青園中葵朝露待日晞希亦少也物朝則少也欣沂反乾肉也從殘肉日以晞之與俎同説臣鍇曰者肉開祈之象俎左旁亦象切肉也指事思益反籕文從肉臣鍇曰下更象肉胾也今人作臘即此也上同日近也從日匿聲春秋傳曰私降昵燕臣鍇曰日月相近也女室反或從尼作臣鍇曰尼亦聲日狎習相嫚也從日執聲臣鍇按詩曰左右御義與媟同私列反不見也從日否省聲美弼上同也從日比聲臣鍇曰䖵音昆蟲衆䖵也故如此昆亦訓同曰比之是同也古論反兼眩也從日亥聲臣鍇曰日之光兼覆也苟孩反日無色從日並聲臣鍇曰日無光則近逺皆同故從並有聲字傳寫誤多之也會意拍戶反
