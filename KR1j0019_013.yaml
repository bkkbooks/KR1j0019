body:
  text: 文七十重六明也從日見一上一地也凡旦之屬皆從旦臣鍇曰日出于地也兠散反日頗見從日既声其兾反文二日始出光也從旦㫃声凡之屬皆從臣鍇曰翰幹幹乾皆從此也根炭反闕且從三日在㫃中臣鍇按李陽氷云從三日旦在於中盖籕文許慎闕義且字下後人加同上反旦也從舟声臣鍇曰此朝旦字知潮反文二重一旌旗之游㫃蹇之皃從曲而下垂㫃相出入也讀若偃古人名偃字子游凢㫃之屬皆從㫃臣鍇曰旌旗之斿綴屬㫃旌旗故有九斿士斿象其兩斿皆下垂從風偃蹇逶迤之状􅋄其綴属處也依逺反古文㫃字如此象旌旗之游及㫃之形臣鍇曰兩耑下垂中相連也上同一熊旗五斿以象伐星士卒以為期從㫃其声周禮曰率都建旗臣鍇按天文參星旁有伐星五將有征伐士卒期於其下也熊勇士之象尚書牧誓曰如熊如羆何晏景福殿賦曰參旗九斿從風飄掦參星旁又有九斿星非參旗有九斿也師都六郷六遂民所聚也䖍知反龜蛇四斿以象营室悠悠而長也從㫃兆声周書曰縣鄙建旐臣鍇按周禮注龜蛇象其扞難辟害也營室北方七宿也其星象龜形池沼反継旐之旗沛然而垂也從㫃木声臣鍇按爾雅繼旐曰斾蒲㑹反游車載旌析羽注旄者也所以精進士卒也從㫃生声臣鍇按春秋壽子載其旌是也析羽謂分析鳥羽連屬為之故曰王斿旌至㫃軫其竿頭則綴以旄牛尾也春秋所謂范宣子假羽旄于齊者也漢書有鸞旗注謂以鳳羽為旌也津貞反錯革畫鳥其上所以進士旟衆也從㫃與声周禮曰州里建旟臣鍇按爾雅鳥隼曰旟革鳥隼之皮革也錯雜也詩曰衆惟魚矣旐惟旟矣室家臻臻旟衆也周禮注則州里之官平約信也鳥隼猛徤之象也以虗反有鈴曰旂以令衆從㫃斤声臣鍇按爾雅注縣鈴於竿頭畫交龍于旂上巨希反導車所以載全羽以為允允進也進也從㫃遂声臣鍇按全羽全剥鳥羽也道車象路也夕位反或從遺作臣鍇曰從遺声建大木置石其上發其機以磓敵從㫃㑹声春秋傳曰旝動而鼓詩曰其旝如林臣鍇按諸書旝旌旗也唯許慎言潘岳閑居賦謂之駮古最反旗曲柄也以所旃表士衆從㫃丹声周禮曰通帛為旃臣鍇曰旃猶言甄也周禮通帛為旃爾雅因革為旃注謂以練為旃因其文章不復畫也遮延反或從亶臣鍇曰亶旜声旌旗之斿也從㫃攸声臣鍇曰今俗或作斿延秋反旗屬從㫃要声倚了反旗皃從㫃也声齊欒施字子旗知施者旗臣鍇曰旗之逶迤也臣鍇按白虎通古人為字使人聞其字則知其名率皆如此許慎言欒施知施字訓旗所以字子旗也孔子弟子巫馬施亦字子旗申而反旗之旖施從㫃竒声臣鍇曰猶言旖旎也於竒反旌旗旚搖也從㫃㶾声臣鍇曰搖也片妖反旗旗飛掦皃從㫃猋声必搖反旌旗披靡皃從㫃皮声臣鍇曰披靡四散皃也坏卑反旌旗斿也從㫃汓声汓古文泅臣鍇曰旌旗邊所綴也爾雅曰練斿九春秋公羊曰若贅斿又敖斿也延秋反古文臣鍇曰㜽古文子字盖從古文汓省此正敖游字周旋旌旗之指麾從㫃疋疋足也臣鍇按尚書曰王秉白旄以麾以進之也疋者足也故㫃疋為旋人足隨旌旗也推㳂反幢也從㫃毛声臣鍇按爾雅注旄首曰旌注謂載旄竿頭如今之幢以旄牛尾結為之也亦謂之眊注綴屬也􅓚即今道家之􅓚節象也門髙反幅胡也從㫃番声臣鍇按魏晋巳來有旛所以爲信晋制東方以青龍旛西方白武旛南方朱雀旛北方玄武旛中央黄龍旛齊竟陵王子良五十二體書曰信旛以鳥書也分軒反軍之五百人從㫃從从旅俱也故從从臣鍇曰周制一鄙之衆也旅者衆也師克以和故必相順從也衆出則旅寓故謂在外爲旅也鄰語反古文旅古文以爲魯衞之魯臣鍇按說春秋左傳者謂魯仲子有文在手曰爲魯夫人魯字當作此也矢鋒也束之族族也從㫃從矢昨木切文二十四重五幽也從日六冂声日數十十六日而月數始虧幽也冂声凡冥之屬皆從冥臣鍇曰當言冂亦声傅冩脫民誤甹反從冥黽声臣鍇曰又春秋時魯地名左傳曰一人門于句鱦是也没彭反文二精光也從三日凡晶之屬皆從晶臣鍇曰以山海經注言之以爲天常有十日迭送一日爲畨次岀之也天無二日不並出耳津貞反萬物之精上列爲星從晶從生声一曰星象形從古復注中故與日同臣鍇曰據今地上生于天一說本象星形注其中偶與晶字同記此者廣異聞也息形反古文臣鍇曰以此證之也或省有文章也從有声臣鍇按論語郁郁乎文哉本作此􅖢假借郁字或者川流也宋玉彧字景文又假借彧字皆非本文要湏作􅖢爾􅖢有蔚也文章之意于目反兼有也從有龍声讀若籠臣鍇按字書云又馬襱頭也來充反文三昭也從囧月声凡朙之屬皆從朙臣鍇曰當言囧亦声眉平反古文從日臣鍇曰通論備矣翌也從明亾声臣鍇曰尚書言翌日者朙日也忽強反文二重一加之也㑹意眉平反古文從朙臣鍇曰此足以􅰀字從血非声也籕文文二重二暮也從月半見凡夕之屬皆從夕臣鍇日月字之半也月𥘉生則暮見西方故半月為夕辝易反寂也從夕莫声臣鍇曰此則寂寞之㱳沒白反舎也天下休舎從夕亦省羊舎反不朙也從夕省声臣鍇曰當言亦声冩少亦字木空反轉卧也從夕卧有卪臣鍇曰卪訓節也蔚逺反敬惕也從夕寅声易曰夕惕若夤臣鍇曰夕者人意懈怠也故孫武曰晝氣歸國語魯公文伯之毋曰事多而計過無憾而後即安是也翼眞反籕文雨而夜除星見也從夕生声臣鍇曰此即今日作晴字自成反逺也卜尚平旦也今若夕卜于事外矣臣鍇曰古者君子重卜者决疑于神朙當尚早今夕卜是於事踈外也五㑹反古文早敬也從丮持事雖夕不休早敬者也臣鍇曰言夕者持朙日之事也息竹反古文亦古文從人丙声㝛字從此文九重四重也從重夕夕相繹也故為多重夕為多重日為疊凡多之屬皆從多臣鍇曰周禮又謂戰功曰多尚書文侯之命曰汝多脩是也繹之言㝷也不絶之意也又夏謂祭之朙日又祭為繹謂㝷前日之事也今夕復㝷前夕之事是為多者事之過多也疊者重積前日之事以成公也不為過多也故重日則為疊重夕則為多夕者萬物息其字形亦與陽冰所說同但傳冩浸訛以下曰字兩齒相連與中竪畫相合自然其中成今正書之則與此同但是輔頰之象非正牙齒之字也舌体􅝟􅝟謂舌之出口如華之岀柎籜也胡甘反俗從肉今木生條也從􅝟由声啇書曰若顛木之有枿臣鍇曰謂之巳倒之木更生孫枝也者猶可也止之言也枿者餘也延秋反草木華甬角然也從􅝟用声臣鍇曰甬之言涌也若水涌出也又周禮鐘柄爲甬通勇湧踊誦從此與恐反草木􅝟盛也從二􅝟闕臣鍇曰華盛重累也詩曰鄂不韡韡韡韡照也熒先反文五重一木垂華實也從木􅝟􅝟亦聱棗凡之屬皆從棗闕臣鍇曰􅝟即􅝟字也字亦從此候坎反文三重三禾麥吐穗上平也象形凡齊之屬皆從齊臣鍇曰生而齊者莫若禾麥也二地也兩旁在低處也淮南子曰居髙不可以爲脩脩長也居下不可以爲短也以二節其地形以髙卑則之形下齊而實齊也故善爲國者使吐世其職農安其畆工樂其業啇便其肆其地勢不同而其志樂同也荘子曰蟪蛄不知春秋冥靈以八千歳爲春此年壽不同而其生齊也大鵬摶扶摇而上者九萬里斯搶榆枋而不至此大小不同而其行止齊也此荘周齊物之意也自兮反等也從齊妻声臣鍇按妻者齊也故等齊之字從妻也自兮反為公案也陁谷反禮也從片枼声臣鍇按劉勰文心雕龍曰議政未定短牒諮謀曰牒簡也葉在枝也田俠反木版也從片扁声讀若邊婢篇反穿壁以木為交忩也從片戸甫声譚長以為甫上日也非户也牖所以見日也臣鍇曰忩但穿明則為忩牖者更以木為交櫺故老子曰鑿戸牖以為室先言戸後言牖彌文飾也古音甫盖與父同声故云甫声也古有一室一忩一戸也譚長亦當時説文字者記其言廣異聞也其言以為戸字當作日字也夷酒反築短版也從片俞声讀若俞一曰紐也臣鍇曰兩頭版也史記萬石君傳曰取親裠厠牏浣滫注謂于築牆短版而浣滌也特婁反文八三足兩耳和五味之寳器也昔禹収九牧之金鑄鼎荆山之下入山林川澤螭魅蛧蜽莫能逢之以協承天休易卦巽木于下者為鼎象析木以炊鼎也從貞省声古文以貞為鼎籕文以鼎為貞凡鼎之属皆從鼎臣鍇按周易巽下離上為鼎巽木也彖曰鼎以木㢲大烹飪也春秋左傳曰鑄鼎使民知神姦然後不逄不若也顛茗反鼎之圓掩上者從鼎才声詩曰鼐鼎及鼒臣鍇按爾雅注云弇上小上也則欺反俗鼒從金妶声鼎之絶大者從鼎乃声魯詩說鼐小鼎也臣鍇按爾雅鼎絶大者為鼐注曰㝡大圜者也自孔子刪詩為三百篇以授子夏自後分散傳授其說不同故有魯詩齊詩燕詩毛詩也都㧡切以木横貫鼎耳舉之從鼎冂声周禮廟門容六鼏七箇即易玉鉉大吉臣鍇曰按周禮亦謂之扄也民的反文一重二嘉穀也從二月始生八月而熟得時之中和故謂之禾也禾木王而生金王而死從木從􅑰省􅑰象其木也凡禾之屬皆從禾臣鍇曰禾垂穂顧本也故張衡思玄賦曰發昔夢于木禾旣垂潁而顧本淮南子曰金勝木故禾春生秋死髙誘云禾木也菽火也菽故夏生冬死水王而死也麥金也故麥秋生夏死火王而死也薺水也故薺冬生夏死土王而死也戸哥反上諱臣鍇曰禾實也有實之象下垂也漢光武帝諱故許慎闕而不書也息就反禾之秀實為稼莖節為禾從禾家声稼家也一曰禾在野為稼也臣鍇按一曰種之為稼反乍反榖可収曰穡從禾􅞋声臣鍇曰􅞋収也故田夫為􅞋吝􅞋之意也當言􅞋亦声誤脫亦字踈億反埶也從禾童声臣鍇曰布之也之用反早種也從禾直声詩曰稙穉菽珍食反先種後孰也從禾重声直容切疾孰也從禾坴声詩曰黍稷穜稑臣鍇曰古者繆穆稑陸声相亂故秦繆公亦呼秦穆公從翏声也栗菊反或從翏声㓜禾從未屖声晚種後孰者臣鍇按爾雅長婦謂稺婦為弟婦故後漢豫章處士字孺子直致反種穊也從禾眞声周禮曰稹理而堅也臣鍇曰穊宻也周禮考工記相木之言稹亦微宻也友允反多也從禾周声陳収反禾也從禾㣎声臣鍇曰㣎音穆莫叔反禾也從禾厶声北道名禾主人曰私主人臣鍇曰厶私漢制縣有蠻夷北道先兹反稻紫莖不黏也從禾糞声讀若靡臣鍇曰即今紫華稻符旣反齊也五榖之長也從禾畟声臣鍇按本草梁貞曰先生八糓黍稷稻梁禾麻菽麥俗人尚不能分况芝英乎臣今按本草新注黍有數種有黒有黄此今人所易知爾雅秬黒黍秠一稃二米詩曰天降嘉糓維秬維秠注曰皆赤黒黍但其中米異耳稷即穄一名粢字亦作齋楚人謂之稷關中謂之麋呼其米為黄米稻即常食有粳有􅟙梁即粟之麤者有青梁穗有毛粒青米亦微青細於白梁黄梁岀蜀漢南閩浙間亦種之穂大毛長榖米俱麤於白梁而叔少子不耐水旱食之香羙逾于諸梁人號為竹根黄梁陶隱居所謂㐮陽竹根梁白梁爾雅謂之苞白苗穂大多毛且長諸梁多相似而白梁榖麤扁長不似粟圓也米白且大食之香羙黄梁之亞爾雅云虋赤苗今人赤糓粟有數種皆細于諸梁北土常食與梁有别禾即􅏘即苴荢二種也菽荳也麥有二麰大麥也來小麥也又有穬麥陶云穬麥馬食者楚辭曰穱麥挐黄梁煎弋反古文稠也從禾旣声臣鍇曰稠宻也古人云深耕穊種故從禾訖示反䟽也從禾希声臣鍇曰穊旣以禾為凖稀亦同也當言從禾爻巾無声字後人加之爻者希䟽之義與爽同意巾亦足其希象至莃與晞皆從稀省何以知之說文巾部爻部並無希字以是知之忻祈反禾也從禾蔑声名噎反稷從禾齊声臣鍇曰此即齋盛字其米為齋在器曰盛今典亦通借齊字為之稷字注巳詳子思反或從次作臣鍇曰次声稷之黏者從禾术声臣鍇曰黏者柔懦也术者象其体柔撓八其米也言声傳冩誤加之下有八字不當言声若許愼不知則當言闕常出反或不從禾作臣鍇曰但象其禾体柔弱也􅙥術怵述從此糜也從禾祭声子歳反稌也從禾舀声臣鍇按爾雅稌注曰今沛國呼稌徙討反稌稻也從禾余声周禮曰牛冝稌臣鍇曰冝謂体性相冝也按本草牛肉甘平安中益氣主消渇稻米亦煖中稻令人熱牛肉性平相和為冝也他魯反沛國謂稲為稬從禾耎声臣鍇曰稬懦也許愼謂稷為秫稻為穤今則同之奴賛反稲不黏者也從禾兼声讀若風廉臣鍇曰即今稲也賢兼反稻也從禾亢声臣鍇曰亢声根横反俗稉臣鍇曰更声稻屬從禾毛声伊尹曰飯之羙者玄山之禾南海之秏臣鍇曰此吕氏春秋載伊尹說湯之辭也吼號反􅉭粟也從禾廣声古猛反稻今年落來年自生謂之秜從禾尼声臣鍇曰即今云穭生稻也利之反禾别也從禾卑声琅琊有稗臣鍇曰似禾而别也孔子曰是用秕稗也稗生水田中故謝靈運詩曰蒲稗相因依旁賣反禾相倚移也從禾多声一曰移禾名故相倚則移也以支反禾末也從禾頃声詩曰禾潁穟臣鍇曰謂禾穂之端也非謂􅉭為潁故尚書曰唐叔得禾異畆同白虎通曰唐叔之禾大幾盈車長幾充箱潁者銳也故謂錐之末為潁余郢反齊謂麥為䅘從禾來声臣鍇按詩曰貽我來牟來即䅘也婁才反禾成秀從禾瓜声臣鍇曰瓜禾為釆㑹意也夕位反俗從禾惠声或從艸遂作或從禾遂声詩曰禾潁穟穟也禾危穂也從禾勺声臣鍇曰危謂獨出之穗也今言了䄪也得了反禾垂皃也從禾耑声讀若端臣鍇曰禾之垂者即耑也兠果反禾舉出苗也從禾曷声臣鍇曰藒字從此鳩歇反禾􅉭也從禾少声臣鍇曰抄之言妙也微妙也彌小反禾穖也從禾幾聲臣鍇曰按吕氏春秋曰得時之禾䟽機而惠大也機莖也訖耳反一稃二米從禾丕声詩曰誕降嘉穀惟秬惟秠天賜后稷之嘉穀也臣鍇曰后稷勤于稼穡天降此稷尚書曰稷降播種浦冝反也從禾孚声臣鍇曰稃即米殻也草木華房爲柎麥之皮爲麩音義皆同也芳于反或從米附禾繇皃從禾乍声讀若昨臣鍇曰繇動揺也自莫反耕禾間從禾麃声春秋傳曰是穮是蓘臣鍇曰若今人種以長大復鉏其間草也彼消反轢禾也從禾安声臣鍇曰車行禾上也思旰反禾本從禾子声臣鍇曰古人言耘秄是也以工壅根也秄之言字也飬之也津矣反穫刈也一曰撮也從禾齊声臣鍇曰古文齊声臣鍇按爾雅穧穫也炷今以穫禾為穧寂帝反刈榖也從禾蒦声胡郭切積禾也從禾資声詩曰䆅之秩秩臣鍇曰堆積巳刈之禾也疾兹反聚也從禾責声臣鍇曰今人言稲積是也津亦反積也從禾失声詩曰䆅之秩秩臣鍇曰秩秩有叙之皃也遲匹反絭束也從禾囷声臣鍇曰絭䋲也今束禾也國語曰諸侯之使于齊稇載而歸是也若衮反榖之善者從禾果声臣鍇曰今人言稞㑹声若裏者儈反舂粟不潰也從禾􅡜声戸幹反也從禾气声居气反穅也從禾㑹声讀若裏若檜反禾皮從禾從羔声臣鍇按吕氏春秋得時之禾圜粒而薄䅵是也眞若反榖之皮也從禾庾声臣鍇曰爾雅云康空也從禾米米皮去其内以空之意也彄荘反或省作臣鍇曰唯從禾康声禾稾去其皮祭天以為席從禾皆声臣鍇曰謂禾華蔕之榖取其静莖祭天視天下之物無足以稱之尚儉而貴質也根察反禾莖也從禾旱声春秋傳曰或投一秉稈臣鍇曰即稭之和皮者投稈謂楚囊瓦焚郤宛時也根旱反或從千作稈也從禾髙声臣鍇曰比于稈又彌麤亂古之時罪者稾飲水今人言稾草謂書之不謹若禾稾之亂然又文章之未修治也姦皓反不成粟從禾比声並止反麥莖也從禾從肙声臣鍇按潘岳射雉賦曰窺覘䅌葉是也弓玄反黍穣也從禾􅍌声臣鍇曰巫祝䄻茢謂以黍穣為帚治灑桃湯以除不祥也良舌反黍巳治者從禾㐮声臣鍇曰巳經擇治也詩曰降福穣穣降福穣穣多也然荘反禾若秧穣也從禾夾声殷強反䅭䅣穀名從禾㫄声臣鍇曰亦有名如鳴蟬之類是也白良反䅭䅣也從禾皇声戸荒反榖熟也從禾千声春秋傳曰大有年臣鍇曰周曰年取禾一熟也泥賢反續也百榖之緫名也從禾􅟤声臣鍇按前注云粟之言續也義與此同春秋傳曰年榖和熟禮曰祈榖于上帝是􅉭實之緫名也孤速反糓熟也從禾念声春秋傳曰不五稔是臣鍇按春秋傳曰五稔悪之日也言其積悪成熟也而沈反田賦也從禾且声臣鍇曰史記趙奢至田租之吏也尊吾反租也從禾兌臣鍇按春秋公羊傳曰税畆者何履畆而稅也古者什而稅天下之中正也注履踐案行之擇其善畆穀最好者稅取之度不足故履擇苖之善者計其一畒之収數孟子曰夏人百畒而百徹殷人七十而助周人什一而稅莫善于稅莫不善于徹轍𬒮反禾也從禾道声司馬相如云䆃一莖六穂也臣鍇曰禾之名也徒號反虚無食從禾荒声臣鍇曰此饑荒字古多借荒字忽光反把取禾若也從禾魚声臣鍇曰把音把若即竹若也穌猶部歛之也孫呼反出物有漸也從禾肖声臣鍇曰周禮謂群臣之禄食為稍食稍稍給之也史掉反木榖熟也從禾省声臣鍇曰音焦七牛反籕文臣鍇曰不省也伯益之後所封國也地冝禾從禾春省一曰秦禾名也臣鍇曰伯益禹之臣也為舜虞按史記秦本紀顓頊之裔孫曰女脩吞玄鳥之夘生子大業大業娶少典之子曰女華生大費大費與禹平水土巳成舜曰咨爾費賛禹功賜女皁游後嗣將大出乃妻之姚姓之玉女大費佐舜調馴鳥獸鳥獸多馴服是為柏翳賜姓嬴氏費生二子曰大㢘實鳥俗氏二曰若木實費氏玄孫曰費昌昌去桀歸湯為御以敗桀于鳴條大㢘玄孫曰中衍大戊御而妻之遂世佐殷為諸侯玄孫曰中潏保西垂生蜚廉蜚廉生惡來俱事紂蜚亷與紂俱死惡來在外歸無所報葬霍太山蜚㢘子曰季勝勝生孟増幸于周成王是為宅臯狼臯狼生衡父衡父生造父以御幸於穆王封於趙趙㐮其後也蜚㢘子曰悪來革早死有子曰女防女防生旁臯旁皐生太几太几生大駱大駱生非子皆姓趙氏非子居犬丘為孝王主馬􅊈渭之間孝王分之上為附庸又邑之秦徐廣云天水隴西秦亭也續嬴氏後號曰秦嬴生秦侯秦侯生公伯公伯生秦仲見於詩與杜預春秋釋例同大唐天潢玉諜云伯翳即伯益也故云是為伯翳春禾為秦㑹意字也少昊即黄帝之子玄囂青陽也𥘉為已姓後為嬴姓顓頊昌意之子即少昊弟之子同姓故史記秦承顓頊伯翳之後為嬴姓春秋郯莒皆少昊後嬴姓按淮南子洛水輕利冝禾洛水即出秦地自人反籕文從秝臣鍇曰從二禾也程也從禾斗斗者量也臣鍇曰㑹意也若何反銓也從禾爯声春分而禾生夏至晷景可度即禾有秒秋分而秒定律數十二秒而當一分十分而寸其以為重十二粟為一分十二分為一銖故謂程品皆從禾臣鍇曰此又去声即權衡之稱故曰銓也夏至日極北故曰晷景可度禾有秀實則􅉭生􅉭秒也秋萬物成定之時物皆揫緒故曰秒定律皆以分寸數十二秒為一分長短也齒仍反程品也十髪為程一程為分十分為寸從禾呈声臣鍇曰程權衡斗斛律曆也故史記曰漢興張蒼定章程謂歷數之屬也莫成反布之八十縷從禾㚇声臣鍇曰此即十筥稯也子紅反籕文五稯也從禾巿声一曰億數至萬曰秭臣鍇曰二萬四千斤也又按爾雅秭數也注曰今巳十億為秭津矣反秭也從禾乇声周書曰二百四十斤為秉四秉為莒十莒為稯十稯曰秅四百秉謂之一秅臣鍇曰周禮行人之職也論語曰與之粟五秉莒竹器也或從米著巴反百二十斤也一䄷為粟二十斤禾黍一䄷者為粟十六斤太半升也從禾石声臣鍇曰二十斗其量一百二十斤也黍麤而輕也神隻反復其時也從禾其声唐書曰稘三百有六旬臣鍇曰從禾其則朞年之朞亦當從禾復其時謂之一周時也居知切文八十七重十三稀䟽適也從二禾凡秝之屬皆從秝讀若歴臣鍇曰適者冝也禾人手種之故其稀踈等也速約反兼持二禾秉持一禾臣鍇曰可兼持者莫若禾也會意結添反又曰兼并也從又手也秝二禾也文二禾屬而黏也以大暑而穜故謂之黍從禾雨省声孔子曰黍可以為酒禾入水也凡黍之屬皆從黍臣鍇曰此秝黍也叔吕反穄也從黍􅏘声羙皮反黍屬也從黍卑声邊弭反相著也從黍占声聶炎反黏也從黍古声户吳反或從米作黏也從黍日声春秋傳曰不義不䵒臣鍇曰當言續少兩字而吉反䵒或從刃履黏從黍省声古以為利字作履黏以黍米也臣鍇曰履以餬黏之也黍黏也里西反治粟麥禾豆下潰葉也從黍畐声臣鍇曰謂禾豆上長則下葉漸黄爛也治謂除埽之也朋北反從黍尼声臣鍇按有樹出之如漆可以黏蟬雀黍亦黏物也勑其反文九重二芳也從黍從甘春秋傳曰黍稷馨凡之屬皆從臣鍇按尚書洪範稼穡作甘黍甘為㑹意也軒良反香之逺聞也從香殸声臣鍇曰殸籕文馨字声之逺聞香殸為馨亦㑹意也顯青反文二且声臣鍇曰䟽即麤也故爾雅注多謂麤為粗金魯反悪米從米比声周書曰有䉾誓臣鍇按古文尚書費誓如此春秋作費魯地名今沂州費縣筆媚反牙米也從米嶭声臣鍇曰麥糵麥牙也魚洃反糂也從米立声臣鍇曰尚書烝民乃粒里汲反古文從食潰米也從米睪声臣鍇曰釋猶散也漢書曰振兵釋旅振整也失昜反以米和羹也從米甚声一曰粒也臣鍇曰孔子厄于陳蔡藜羮不糝也息感反古文糂從參籕文從替炊米者謂之糪從米辟声臣鍇按爾雅飯中有胜米曰糪胜先定反米胜定下變也今謂豆不􅶊為檗豆也羆麥反糁也從米􅏘声臣鍇曰糜即粥也羮反反糜和也從米声讀若譚持感反潰米從米尼声交趾有冷縣臣鍇曰潰漫也眠伊反酒母從米省声臣鍇曰麴糵也酒主于麴故曰酒母牽六反或從麥鞠省声曰俗作臣鍇曰今鞠字也酒滓也從米曹声作曹切籕文從酉乾也從米声平祕切熬米麥也從米臭声臣鍇曰煼乾米麥也去酉反舂糗也從米􅍫声伎酒反糧也從米胥声臣鍇曰今或借為祭神之糈也仙吕反榖食也從米量声桞昌反雜飰也從米丑声臣鍇按史多言漢粈之霸道也女就反糓也從米翟声臣鍇曰糶糴字皆從此地料反䴲也從米蔑声門撥反不雜也從米卒声雖遂切饋客之芻米從米气声春秋傳曰齊人來氣諸侯臣鍇曰古云乞字直乞而巳許意反氣或從旣氣或從食陳臭米從米工声臣鍇按漢史曰太倉之粟紅腐而不可食多借紅字為之米乆則紅也户聦反傳面者從米分声臣鍇按周禮饋食有粉餈米粉也古傅面亦用米粉故齊民要術有傳面英粉漬粉為之也又紅染之為紅粉燒鈆為粉始自夏桀也弗吻反或從卷作􅔁也從米悉声私列反䊝􅔁散之也從米殺声臣鍇按春秋左傳曰殺管叔而􅔁蔡叔言放之若散米尚書曰囚蔡叔于郭鄰也桑怛反碎也從米靡声臣鍇曰謂䊳米麥也䃺米謂之䊳其石謂之䃺莫播反盗自中出曰竊從宂米禼廿皆声也廿古文􅍚字禼偰字也臣鍇按春秋左傳曰在外為姦在内為宄宄從宂竊從宂彌小所謂䑕竊狗盗也此形声字七屑反文三十五重八糲米一斛舂為八斗也從䊆從殳凡毇之屬皆從毇毇糙米臣鍇曰此㑹意也毁字從毇呼委反糲米一斛舂為九斗曰從毇丵省声臣鍇曰糲米從毇也春秋左傳粢食不鑿字當作此丵音仕朔反子落反自莫反文二舂也古者掘地為􅍫其後穿木石象形中象米也凡􅍫之屬皆從􅍫臣鍇按昜繫曰剡木為杵掘地為􅍫􅍫杵之利萬民以濟也舊舅字皆從此函字下䑕字上皆偶相似非從杵􅍫之􅍫又古文齒字作􅍫亦復相似亦非此字杵􅍫字中四注古文齒左右三注也伎酒反擣米也從廾持杵以臨􅍫杵省古者雍父𥘉作舂臣鍇曰雍父黄帝臣也㑹意輸容反齊謂舂從􅍫屰声讀之若膊字臣鍇曰屰音屰悪厝反舂去麥皮從􅍫于声臣鍇曰㑹意也挿字從此焚箑反杼􅍫從瓜􅍫声詩曰或簸或舀臣鍇曰㑹意也杼向下取之也滔韜稻之類音近舀者皆從如此以紹反或從手宂臣鍇按周言有女舂抭謂抭􅍫中米也反或從􅍫宂小也從人在􅍫上舂地坎可舀又臣鍇曰若今人作阮以舀虎也會意䧟蓞㗖閻之類声近舀者從此寒蘸反文六重二悪也象地穿交䧟其中凡凶之屬皆從凶臣鍇曰悪不可居象地之塹也悪可以䧟人也昜曰入坎凶也吁封反擾恐也從人在凶下春秋傳曰曹人兇惧臣鍇曰象亂而惧也㑹意朂恐反文二分莖皮也從屮八象枲皮凡􅜨之屬皆從􅜨讀若􅩋臣鍇曰剥􅏘之剥也剥之則莖經手故一求也列子曰郷人有甘枲莖是匹儐反􅏘子也從􅜨台者從辝省声臣鍇曰枲􅏘有子若周官有典絲枲淮南子曰位賤尚枲辛子反
